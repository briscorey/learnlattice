{{ define "main" }}

<section class="eal-hero" style="padding:24px 20px">
  <div class="eal-hero-inner" style="max-width:700px">
    <a href="/assessment/" style="font-size:.78rem;color:var(--teal);text-decoration:none;font-weight:600">← Back to Assessment Toolkit</a>
    <h1 class="eal-hero-title" style="font-size:1.6rem;margin-top:8px">{{ .Title }}</h1>
    <p class="eal-hero-sub">{{ .Description }}</p>
  </div>
</section>

<section style="max-width:700px;margin:0 auto;padding:0 20px 40px">
  <div style="border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#f8faf9">
    <iframe src="{{ .Params.tool_src }}?v=20260316b" style="width:100%;height:{{ .Params.tool_height | default 700 }}px;border:none;display:block" loading="lazy" title="{{ .Title }}"></iframe>
  </div>
</section>

{{ partial "newsletter.html" . }}
{{ end }}
