{{ define "main" }}
<style>
.rev{font-family:'Outfit',system-ui,sans-serif;min-height:calc(100vh - 65px);background:#0c0a14;color:#e8e0f0;display:flex;flex-direction:column}
.rev *{box-sizing:border-box;margin:0;padding:0}

/* ── Setup screen ── */
.rev-setup{max-width:560px;margin:0 auto;padding:40px 20px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
.rev-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#f59e0b,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.rev-sub{font-size:.9rem;color:#9a8fad;margin-bottom:32px}
.rev-section{margin-bottom:24px;text-align:left}
.rev-label{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:#6b5f80;margin-bottom:10px;font-weight:700}
.rev-topics{display:flex;flex-wrap:wrap;gap:6px}
.rev-topic{padding:8px 16px;border-radius:10px;border:1.5px solid #2a2440;background:rgba(42,36,64,.4);color:#c4b8d8;font-size:.82rem;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500}
.rev-topic:hover{border-color:#f59e0b;color:#fcd34d}
.rev-topic.on{border-color:#f59e0b;background:rgba(245,158,11,.12);color:#fcd34d}
.rev-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rev-mode{padding:16px 12px;border-radius:12px;border:1.5px solid #2a2440;background:rgba(42,36,64,.3);color:#c4b8d8;font-size:.82rem;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center}
.rev-mode:hover{border-color:#f59e0b}
.rev-mode.on{border-color:#f59e0b;background:rgba(245,158,11,.1);color:#fcd34d}
.rev-mode-icon{font-size:1.6rem;display:block;margin-bottom:6px}
.rev-mode-label{font-weight:600}
.rev-time{display:flex;gap:6px}
.rev-time-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid #2a2440;background:rgba(42,36,64,.3);color:#c4b8d8;font-size:.85rem;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s}
.rev-time-btn:hover{border-color:#f59e0b}
.rev-time-btn.on{border-color:#f59e0b;background:rgba(245,158,11,.1);color:#fcd34d}
.rev-start{margin-top:28px;padding:16px 48px;border-radius:14px;border:none;background:linear-gradient(135deg,#f59e0b,#f97316);color:#1a0f0a;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:all .2s;box-shadow:0 8px 24px rgba(245,158,11,.25)}
.rev-start:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(245,158,11,.35)}
.rev-start:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Session screen ── */
.rev-session{flex:1;display:none;flex-direction:column}
.rev-topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #1e1830}
.rev-topbar-left{display:flex;align-items:center;gap:12px}
.rev-quit{padding:5px 12px;border-radius:8px;border:1px solid #2a2440;background:none;color:#9a8fad;font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .15s}
.rev-quit:hover{border-color:#ef4444;color:#fca5a5}
.rev-topic-badge{font-size:.72rem;padding:3px 10px;border-radius:6px;background:rgba(245,158,11,.1);color:#fcd34d;font-weight:600}
.rev-topbar-right{display:flex;align-items:center;gap:16px}
.rev-timer{font-family:'Courier New',monospace;font-size:1rem;color:#f59e0b;font-weight:700}
.rev-score{font-size:.85rem;color:#c4b8d8;font-weight:600}
.rev-score span{color:#f59e0b}
.rev-streak{font-size:.85rem}

/* ── Progress bar ── */
.rev-progress{height:3px;background:#1e1830}
.rev-progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#f97316);transition:width .4s cubic-bezier(.22,1,.36,1);border-radius:2px}

/* ── Card area ── */
.rev-arena{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;perspective:800px}
.rev-card{width:100%;max-width:520px;min-height:280px;position:relative;transition:transform .5s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d}
.rev-card.flipped{transform:rotateY(180deg)}
.rev-card-face{position:absolute;top:0;left:0;right:0;bottom:0;backface-visibility:hidden;border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1.5px solid #2a2440}
.rev-card-front{background:linear-gradient(145deg,#15112a,#1a1530)}
.rev-card-back{background:linear-gradient(145deg,#1a1530,#201840);transform:rotateY(180deg)}
.rev-card-type{font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:#6b5f80;margin-bottom:16px;font-weight:700}
.rev-card-term{font-size:1.6rem;font-weight:700;color:#e8e0f0;margin-bottom:8px;line-height:1.3}
.rev-card-hint{font-size:.82rem;color:#9a8fad;font-style:italic}
.rev-card-def{font-size:1rem;color:#c4b8d8;line-height:1.6;margin-bottom:8px}
.rev-card-example{font-size:.85rem;color:#9a8fad;padding:10px 14px;background:rgba(245,158,11,.06);border-radius:10px;border-left:3px solid rgba(245,158,11,.3)}
.rev-card-visual{font-size:2.5rem;margin-bottom:12px}

/* Quiz mode */
.rev-quiz-q{font-size:1.2rem;font-weight:600;color:#e8e0f0;line-height:1.4;margin-bottom:20px;white-space:pre-line}
.rev-quiz-answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.rev-quiz-btn{padding:14px 16px;border-radius:12px;border:1.5px solid #2a2440;background:rgba(42,36,64,.3);color:#c4b8d8;font-size:.9rem;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;text-align:center}
.rev-quiz-btn:hover{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.rev-quiz-btn.correct{border-color:#22c55e;background:rgba(34,197,94,.15);color:#86efac}
.rev-quiz-btn.wrong{border-color:#ef4444;background:rgba(239,68,68,.1);color:#fca5a5}
.rev-quiz-source{font-size:.7rem;color:#6b5f80;margin-top:12px}

/* Formula mode */
.rev-formula-text{font-family:'Courier New',monospace;font-size:1.3rem;color:#f59e0b;padding:14px 20px;background:rgba(245,158,11,.06);border-radius:12px;border:1px solid rgba(245,158,11,.15);margin-bottom:12px;letter-spacing:1px}
.rev-formula-title{font-size:1rem;font-weight:600;color:#e8e0f0;margin-bottom:4px}
.rev-formula-subject{font-size:.75rem;color:#6b5f80;text-transform:uppercase;letter-spacing:1px}

/* Tap hint */
.rev-tap{font-size:.72rem;color:#4a3f60;text-align:center;padding:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}

/* Action buttons */
.rev-actions{display:flex;gap:8px;padding:12px 20px;justify-content:center}
.rev-act{padding:10px 24px;border-radius:10px;border:1.5px solid #2a2440;background:none;color:#c4b8d8;font-size:.82rem;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.rev-act:hover{border-color:#f59e0b;color:#fcd34d}
.rev-act-know{border-color:rgba(34,197,94,.3);color:#86efac}
.rev-act-know:hover{background:rgba(34,197,94,.1)}
.rev-act-skip{border-color:rgba(239,68,68,.3);color:#fca5a5}
.rev-act-skip:hover{background:rgba(239,68,68,.1)}

/* ── Results screen ── */
.rev-results{display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;flex:1}
.rev-results h2{font-size:2rem;color:#f59e0b;margin-bottom:8px}
.rev-results-score{font-size:4rem;font-weight:700;color:#fcd34d;margin-bottom:4px}
.rev-results-detail{font-size:.9rem;color:#9a8fad;margin-bottom:6px}
.rev-results-msg{font-size:1rem;color:#c4b8d8;margin:16px 0 24px;max-width:360px;line-height:1.5}
.rev-again{padding:14px 40px;border-radius:14px;border:none;background:linear-gradient(135deg,#f59e0b,#f97316);color:#1a0f0a;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:0 6px 20px rgba(245,158,11,.2)}
.rev-again:hover{transform:translateY(-2px)}
.rev-home{margin-top:12px;padding:10px 24px;border-radius:10px;border:1px solid #2a2440;background:none;color:#9a8fad;font-size:.82rem;cursor:pointer;font-family:inherit}

@media(max-width:480px){
  .rev-setup{padding:24px 14px}
  .rev-title{font-size:1.5rem}
  .rev-modes{grid-template-columns:1fr}
  .rev-quiz-answers{grid-template-columns:1fr}
  .rev-card{min-height:240px}
  .rev-card-term{font-size:1.2rem}
}

/* ── Timer urgency ── */
.rev-timer.warn{color:#fbbf24;animation:timerPulse 1s ease infinite}
.rev-timer.danger{color:#ef4444;animation:timerPulse .5s ease infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── Keyboard hints ── */
.rev-keys{font-size:.65rem;color:#4a3f60;text-align:center;padding:4px;letter-spacing:.5px}
.rev-keys kbd{padding:1px 5px;border-radius:4px;background:#1e1830;border:1px solid #2a2440;font-family:inherit;font-size:.6rem;color:#6b5f80}

/* ── Missed items review ── */
.rev-missed{max-width:400px;margin:0 auto 20px;text-align:left;width:100%}
.rev-missed-title{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:#6b5f80;font-weight:700;margin-bottom:10px;text-align:center}
.rev-missed-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.rev-missed-item{padding:10px 14px;border-radius:10px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);font-size:.82rem;color:#fca5a5}
.rev-missed-item strong{color:#e8e0f0;display:block;margin-bottom:2px}

/* ── Card title font ── */
.rev-title{font-family:'DM Serif Display',serif}
.rev-card-term{font-family:'DM Serif Display',serif}
.rev-formula-title{font-family:'DM Serif Display',serif}
</style>

<div class="rev">
  <!-- SETUP -->
  <div class="rev-setup" id="revSetup">
    <div>
      <h1 class="rev-title">📖 Revision Mode</h1>
      <p class="rev-sub">Pick a topic. Choose how to study. Focus for 5 minutes.</p>

      <div class="rev-section">
        <div class="rev-label">Topic</div>
        <div class="rev-topics" id="revTopics"></div>
      </div>

      <div class="rev-section">
        <div class="rev-label">Mode</div>
        <div class="rev-modes">
          <button class="rev-mode on" data-mode="flashcards" onclick="pickMode(this)">
            <span class="rev-mode-icon">🃏</span>
            <span class="rev-mode-label">Flashcards</span>
          </button>
          <button class="rev-mode" data-mode="quiz" onclick="pickMode(this)">
            <span class="rev-mode-icon">⚡</span>
            <span class="rev-mode-label">Quick Quiz</span>
          </button>
          <button class="rev-mode" data-mode="formulas" onclick="pickMode(this)">
            <span class="rev-mode-icon">📐</span>
            <span class="rev-mode-label">Formulas</span>
          </button>
        </div>
      </div>

      <div class="rev-section">
        <div class="rev-label">Time</div>
        <div class="rev-time">
          <button class="rev-time-btn on" data-mins="3" onclick="pickTime(this)">3 min</button>
          <button class="rev-time-btn" data-mins="5" onclick="pickTime(this)">5 min</button>
          <button class="rev-time-btn" data-mins="10" onclick="pickTime(this)">10 min</button>
        </div>
      </div>

      <button class="rev-start" id="revStartBtn" onclick="startSession()">Start Session</button>
    </div>
  </div>

  <!-- SESSION -->
  <div class="rev-session" id="revSession">
    <div class="rev-topbar">
      <div class="rev-topbar-left">
        <button class="rev-quit" onclick="endSession()">✕ Quit</button>
        <span class="rev-topic-badge" id="revBadge"></span>
      </div>
      <div class="rev-topbar-right">
        <span class="rev-streak" id="revStreak"></span>
        <span class="rev-card-count" id="revCardCount" style="font-size:.75rem;color:#6b5f80"></span>
        <span class="rev-score">Score: <span id="revScoreNum">0</span></span>
        <span class="rev-timer" id="revTimer">5:00</span>
      </div>
    </div>
    <div class="rev-progress"><div class="rev-progress-fill" id="revProgressFill"></div></div>
    <div class="rev-arena" id="revArena"></div>
    <div class="rev-tap" id="revTap"></div>
    <div class="rev-actions" id="revActions"></div>
    <div class="rev-keys" id="revKeys">Press <kbd>Space</kbd> to flip · <kbd>←</kbd> didn't know · <kbd>→</kbd> knew it</div>
  </div>

  <!-- RESULTS -->
  <div class="rev-results" id="revResults">
    <h2>Session Complete</h2>
    <div class="rev-results-score" id="revFinalScore">0</div>
    <div class="rev-results-detail" id="revFinalDetail"></div>
    <div class="rev-results-msg" id="revFinalMsg"></div>
    <div class="rev-missed" id="revMissed" style="display:none">
      <div class="rev-missed-title">Terms to review:</div>
      <div class="rev-missed-list" id="revMissedList"></div>
    </div>
    <button class="rev-again" onclick="location.reload()">Study Again</button>
    <button class="rev-home" onclick="location.href='/students/'">Back to Student Hub</button>
  </div>
</div>

<script>
(function(){
'use strict';

var DATA = null;
var selectedTopic = 'all';
var selectedMode = 'flashcards';
var selectedMins = 3;
var sessionActive = false;
var score = 0, total = 0, streak = 0, maxStreak = 0;
var timerInterval = null;
var timeLeft = 0;
var deck = [];
var deckIndex = 0;
var missed = [];

// Load data
fetch('/js/revision-data.json').then(r=>r.json()).then(function(d){
  DATA = d;
  buildTopicButtons();
}).catch(function(){
  document.getElementById('revSetup').innerHTML = '<p style="color:#ef4444;padding:40px">Could not load revision data. Please try refreshing.</p>';
});

function buildTopicButtons(){
  var topics = new Set();
  DATA.vocab.forEach(function(v){ topics.add(v.subject === 'math' ? 'Mathematics' : 'Science'); });
  DATA.questions.forEach(function(q){ topics.add(q.subject); });

  var el = document.getElementById('revTopics');
  el.innerHTML = '<button class="rev-topic on" data-topic="all" onclick="pickTopic(this)">All Topics</button>';
  ['Mathematics','Biology','Chemistry','Physics','Earth Science','Ecology'].forEach(function(t){
    el.innerHTML += '<button class="rev-topic" data-topic="'+t+'" onclick="pickTopic(this)">'+t+'</button>';
  });
}

window.pickTopic = function(btn){
  document.querySelectorAll('.rev-topic').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  selectedTopic = btn.dataset.topic;
};

window.pickMode = function(btn){
  document.querySelectorAll('.rev-mode').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  selectedMode = btn.dataset.mode;
};

window.pickTime = function(btn){
  document.querySelectorAll('.rev-time-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  selectedMins = parseInt(btn.dataset.mins);
};

function filterByTopic(arr, topicField){
  if(selectedTopic === 'all') return arr.slice();
  return arr.filter(function(item){
    var subj = item[topicField] || '';
    if(selectedTopic === 'Mathematics') return subj === 'math' || subj === 'Mathematics';
    if(selectedTopic === 'Science') return subj !== 'math' && subj !== 'Mathematics';
    return subj.toLowerCase().indexOf(selectedTopic.toLowerCase()) > -1;
  });
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}

window.startSession = function(){
  if(!DATA) return;

  // Build deck based on mode
  if(selectedMode === 'flashcards'){
    deck = shuffle(filterByTopic(DATA.vocab, 'subject'));
    if(deck.length === 0) deck = shuffle(DATA.vocab.slice());
  } else if(selectedMode === 'quiz'){
    deck = shuffle(filterByTopic(DATA.questions, 'subject'));
    if(deck.length === 0) deck = shuffle(DATA.questions.slice());
  } else {
    deck = shuffle(filterByTopic(DATA.formulas, 'subject'));
    if(deck.length === 0) deck = shuffle(DATA.formulas.slice());
  }

  if(deck.length === 0){ alert('No content available for this topic.'); return; }

  // Init session
  score = 0; total = 0; streak = 0; maxStreak = 0; deckIndex = 0; missed = [];
  timeLeft = selectedMins * 60;
  sessionActive = true;

  document.getElementById('revSetup').style.display = 'none';
  document.getElementById('revSession').style.display = 'flex';
  document.getElementById('revBadge').textContent = selectedTopic === 'all' ? 'All Topics' : selectedTopic;
  updateUI();
  showCard();
  startTimer();
};

function startTimer(){
  updateTimerDisplay();
  timerInterval = setInterval(function(){
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0){ endSession(); }
  }, 1000);
}

function updateTimerDisplay(){
  var m = Math.floor(timeLeft/60);
  var s = timeLeft%60;
  var el = document.getElementById('revTimer');
  el.textContent = m+':'+(s<10?'0':'')+s;
  el.className = 'rev-timer' + (timeLeft <= 10 ? ' danger' : timeLeft <= 30 ? ' warn' : '');
  var totalSecs = selectedMins * 60;
  var pct = ((totalSecs - timeLeft) / totalSecs * 100);
  document.getElementById('revProgressFill').style.width = pct + '%';
}

function updateUI(){
  document.getElementById('revScoreNum').textContent = score;
  var emoji = streak >= 5 ? '🔥' : streak >= 3 ? '⭐' : '';
  document.getElementById('revStreak').textContent = streak > 0 ? streak + ' streak ' + emoji : '';
}

function showCard(){
  if(deckIndex >= deck.length) deckIndex = 0; // loop
  var item = deck[deckIndex];
  var arena = document.getElementById('revArena');
  var actions = document.getElementById('revActions');
  var tap = document.getElementById('revTap');
  document.getElementById('revCardCount').textContent = (deckIndex+1) + ' / ' + deck.length;

  if(selectedMode === 'flashcards'){
    arena.innerHTML = '<div class="rev-card" id="revCard" onclick="flipCard()">' +
      '<div class="rev-card-face rev-card-front">' +
        '<div class="rev-card-type">Vocabulary</div>' +
        '<div class="rev-card-visual">' + (item.visual||'📝') + '</div>' +
        '<div class="rev-card-term">' + item.term + '</div>' +
        '<div class="rev-card-hint">Tap to reveal definition</div>' +
      '</div>' +
      '<div class="rev-card-face rev-card-back">' +
        '<div class="rev-card-type">' + item.term + '</div>' +
        '<div class="rev-card-def">' + item.definition + '</div>' +
        (item.example ? '<div class="rev-card-example">' + item.example + '</div>' : '') +
      '</div>' +
    '</div>';
    actions.innerHTML = '';
    tap.textContent = 'Tap the card to flip it';
    document.getElementById('revKeys').innerHTML = 'Press <kbd>Space</kbd> to flip · <kbd>←</kbd> didn\'t know · <kbd>→</kbd> knew it';
  }
  else if(selectedMode === 'quiz'){
    var answers = [item.a];
    var wrongs = item.wrong || [];
    wrongs.forEach(function(w){ if(answers.length < 4) answers.push(w); });
    while(answers.length < 4) answers.push('—');
    shuffle(answers);

    arena.innerHTML = '<div style="width:100%;max-width:520px">' +
      '<div class="rev-card-type">' + (item.type||'question').toUpperCase() + '</div>' +
      '<div class="rev-quiz-q">' + item.q + '</div>' +
      '<div class="rev-quiz-answers" id="quizAnswers">' +
        answers.map(function(a){ return '<button class="rev-quiz-btn" onclick="checkQuiz(this,\''+escape(String(a))+'\',\''+escape(String(item.a))+'\')">' + a + '</button>'; }).join('') +
      '</div>' +
      '<div class="rev-quiz-source">From: ' + (item.source||'') + '</div>' +
    '</div>';
    actions.innerHTML = '';
    tap.textContent = 'Pick the correct answer';
    document.getElementById('revKeys').innerHTML = 'Press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> to answer · <kbd>Esc</kbd> to quit';
  }
  else { // formulas
    arena.innerHTML = '<div class="rev-card" id="revCard" onclick="flipCard()">' +
      '<div class="rev-card-face rev-card-front">' +
        '<div class="rev-card-type">Formula</div>' +
        '<div class="rev-formula-title">' + item.title + '</div>' +
        '<div class="rev-card-hint">What is the formula?</div>' +
      '</div>' +
      '<div class="rev-card-face rev-card-back">' +
        '<div class="rev-card-type">' + item.title + '</div>' +
        '<div class="rev-formula-text">' + item.formula + '</div>' +
        '<div class="rev-formula-subject">' + item.subject + '</div>' +
      '</div>' +
    '</div>';
    actions.innerHTML = '';
    tap.textContent = 'Tap to reveal the formula';
    document.getElementById('revKeys').innerHTML = 'Press <kbd>Space</kbd> to flip · <kbd>←</kbd> didn\'t know · <kbd>→</kbd> knew it';
  }
}

window.flipCard = function(){
  var card = document.getElementById('revCard');
  if(!card) return;
  if(card.classList.contains('flipped')) return;
  card.classList.add('flipped');
  total++;

  // Show action buttons after flip
  var actions = document.getElementById('revActions');
  actions.innerHTML = '<button class="rev-act rev-act-know" onclick="cardResult(true)">✓ I knew it</button>' +
    '<button class="rev-act rev-act-skip" onclick="cardResult(false)">✕ Didn\'t know</button>';
  document.getElementById('revTap').textContent = '';
};

window.cardResult = function(knew){
  if(knew){ score += 10; streak++; if(streak > maxStreak) maxStreak = streak; }
  else { streak = 0; var item = deck[deckIndex]; missed.push({term: item.term || item.title || '', def: item.definition || item.formula || ''}); }
  updateUI();
  deckIndex++;
  showCard();
};

window.checkQuiz = function(btn, picked, correct){
  var decoded_picked = unescape(picked);
  var decoded_correct = unescape(correct);
  var buttons = document.querySelectorAll('.rev-quiz-btn');
  buttons.forEach(function(b){
    b.onclick = null;
    if(b.textContent === decoded_correct) b.classList.add('correct');
  });
  total++;

  if(decoded_picked === decoded_correct){
    btn.classList.add('correct');
    score += 10;
    streak++;
    if(streak > maxStreak) maxStreak = streak;
  } else {
    btn.classList.add('wrong');
    streak = 0;
    var item = deck[deckIndex];
    missed.push({term: item.q || '', def: 'Answer: ' + decoded_correct});
  }
  updateUI();

  setTimeout(function(){
    deckIndex++;
    showCard();
  }, 800);
};

window.endSession = function(){
  sessionActive = false;
  if(timerInterval) clearInterval(timerInterval);

  document.getElementById('revSession').style.display = 'none';
  document.getElementById('revResults').style.display = 'flex';

  document.getElementById('revFinalScore').textContent = score;
  document.getElementById('revFinalDetail').textContent = total + ' cards reviewed · ' + maxStreak + ' best streak';

  var pct = total > 0 ? Math.round(score / (total * 10) * 100) : 0;
  var msg = pct >= 80 ? 'Outstanding! You really know this material. 🔥' :
            pct >= 60 ? 'Solid revision session. Keep it up! ⭐' :
            pct >= 40 ? 'Good start. Try again to improve your score.' :
            'This topic needs more practice. Review the investigations and try again.';
  document.getElementById('revFinalMsg').textContent = msg;

  // Show missed items
  if(missed.length > 0){
    document.getElementById('revMissed').style.display = '';
    var list = document.getElementById('revMissedList');
    list.innerHTML = '';
    missed.forEach(function(m){
      var div = document.createElement('div');
      div.className = 'rev-missed-item';
      div.innerHTML = '<strong>' + m.term + '</strong>' + m.def;
      list.appendChild(div);
    });
  }
};

// Keyboard shortcuts
document.addEventListener('keydown', function(e){
  if(!sessionActive) return;
  var card = document.getElementById('revCard');

  if(selectedMode === 'flashcards' || selectedMode === 'formulas'){
    // Space or Enter to flip
    if(e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      if(card && !card.classList.contains('flipped')){
        flipCard();
      }
    }
    // Right arrow = knew it (only after flip)
    if(e.key === 'ArrowRight' && card && card.classList.contains('flipped')){
      e.preventDefault();
      cardResult(true);
    }
    // Left arrow = didn't know (only after flip)
    if(e.key === 'ArrowLeft' && card && card.classList.contains('flipped')){
      e.preventDefault();
      cardResult(false);
    }
  }

  if(selectedMode === 'quiz'){
    // 1-4 keys for quiz answers
    if(e.key >= '1' && e.key <= '4'){
      var btns = document.querySelectorAll('.rev-quiz-btn');
      var idx = parseInt(e.key) - 1;
      if(btns[idx] && btns[idx].onclick) btns[idx].click();
    }
  }

  // Escape to quit
  if(e.key === 'Escape'){
    endSession();
  }
});

})();
</script>
