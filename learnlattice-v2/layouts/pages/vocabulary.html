{{ define "main" }}

<section class="vocab-hero">
  <div class="vocab-hero-inner">
    <div class="vocab-hero-kicker">For Students</div>
    <h1>Visual Vocabulary</h1>
    <p>Every key term from MYP Mathematics and Science — explained with visuals, not just words.</p>
    <div class="vocab-search-wrap">
      <input type="text" id="vocabSearch" class="vocab-search" placeholder="Search for a term..." oninput="filterVocab()">
    </div>
  </div>
</section>

<section class="vocab-filters">
  <div class="vocab-filters-inner">
    <button class="vocab-filter active" data-subj="all" onclick="filterSubj('all',this)">All</button>
    <button class="vocab-filter" data-subj="math" onclick="filterSubj('math',this)">🔢 Mathematics</button>
    <button class="vocab-filter" data-subj="science" onclick="filterSubj('science',this)">🔬 Science</button>
  </div>
</section>

<section class="vocab-grid-section">
  <div class="vocab-grid" id="vocabGrid"></div>
</section>

{{ partial "newsletter.html" . }}

<script>
var vocab = [
  {term:"Variable",def:"A letter (like x or n) that represents a number we don't know yet.",visual:"🔤",subj:"math",example:"In 3x + 1 = 10, the variable is x.",link:"/resources/understand-algebra/"},
  {term:"Constant",def:"A number that does not change. It stays the same in every case.",visual:"🔒",subj:"math",example:"In T(n) = 3n + 2, the constant is 2."},
  {term:"Coefficient",def:"The number multiplied by a variable.",visual:"×",subj:"math",example:"In 5x, the coefficient is 5."},
  {term:"Mean",def:"Add up all the values, divide by how many there are. The average.",visual:"📊",subj:"math",example:"Mean of 3, 7, 5 = (3+7+5) ÷ 3 = 5."},
  {term:"Median",def:"The middle value when all numbers are in order.",visual:"↕️",subj:"math",example:"In 2, 5, 8, 9, 12 — the median is 8."},
  {term:"Mode",def:"The value that appears most often.",visual:"🔁",subj:"math",example:"In 3, 5, 5, 7, 9 — the mode is 5."},
  {term:"Ratio",def:"A comparison between two quantities. How many of one thing for each of another.",visual:"⚖️",subj:"math",example:"3 red : 5 blue means for every 3 red there are 5 blue."},
  {term:"Proportional",def:"Two quantities that increase at the same rate. When one doubles, the other doubles.",visual:"📈",subj:"math",example:"Bounce height is proportional to drop height."},
  {term:"Linear",def:"A relationship that makes a straight line on a graph. Constant rate of change.",visual:"📏",subj:"math",example:"y = 2x + 1 is linear. The graph is a straight line."},
  {term:"Gradient",def:"How steep a line is. Rise divided by run.",visual:"⛰️",subj:"math",example:"A line going up 3 for every 1 across has gradient 3."},
  {term:"Common Difference",def:"The amount added each time in a number sequence.",visual:"➕",subj:"math",example:"In 4, 7, 10, 13... the common difference is 3."},
  {term:"Density",def:"How much mass is packed into a given volume. Dense things are heavy for their size.",visual:"🧱",subj:"science",example:"Steel is dense (7.9 g/cm³). Cork is not (0.24 g/cm³).",link:"/resources/understand-density/"},
  {term:"Mass",def:"The amount of matter in an object. Measured in grams or kilograms.",visual:"⚖️",subj:"science",example:"A 1 kg bag of sugar has the same mass everywhere — even on the Moon."},
  {term:"Volume",def:"The amount of space an object takes up. Measured in cm³ or mL.",visual:"📦",subj:"science",example:"A cube 10 cm × 10 cm × 10 cm has a volume of 1000 cm³."},
  {term:"Hypothesis",def:"A testable prediction about what you think will happen and why.",visual:"💭",subj:"science",example:"If I increase temperature, the reaction rate will increase because particles move faster."},
  {term:"Variable (Science)",def:"Something that can change in an experiment. Three types: independent, dependent, controlled.",visual:"🔀",subj:"science",example:"Independent = what you change. Dependent = what you measure. Controlled = what you keep the same."},
  {term:"Frequency",def:"How many times something happens in a given time period. In waves: vibrations per second (Hz).",visual:"〰️",subj:"science",example:"A 440 Hz sound wave vibrates 440 times per second.",link:"/resources/waves-and-sound-investigation/"},
  {term:"Wavelength",def:"The distance between two consecutive peaks (or troughs) of a wave.",visual:"🌊",subj:"science",example:"Red light has a longer wavelength than blue light."},
  {term:"Amplitude",def:"The height of a wave from the resting position to the peak. Bigger amplitude = louder/brighter.",visual:"📶",subj:"science",example:"A loud sound has a large amplitude. A quiet sound has a small amplitude."},
  {term:"Ecosystem",def:"A community of living things and the non-living environment they interact with.",visual:"🌿",subj:"science",example:"A pond ecosystem includes fish, plants, water, sunlight, and bacteria.",link:"/resources/grade-6-schoolyard-ecosystem-investigation/"},
  {term:"Reactant",def:"A substance that is used up in a chemical reaction. It goes in.",visual:"⬅️",subj:"science",example:"In burning: fuel + oxygen are reactants."},
  {term:"Product",def:"A substance that is made in a chemical reaction. It comes out.",visual:"➡️",subj:"science",example:"In burning: carbon dioxide + water are products."},
  {term:"Catalyst",def:"A substance that speeds up a reaction without being used up itself.",visual:"⚡",subj:"science",example:"Enzymes are biological catalysts. They make reactions in your body fast enough to keep you alive.",link:"/resources/reaction-rate-lab-game/"},
  {term:"Photosynthesis",def:"The process plants use to convert sunlight, water, and CO₂ into glucose and oxygen.",visual:"☀️🌱",subj:"science",example:"Without photosynthesis, there would be no oxygen in the atmosphere."},
  {term:"Probability",def:"How likely something is to happen. Measured from 0 (impossible) to 1 (certain).",visual:"🎲",subj:"math",example:"The probability of rolling a 6 on a fair die is 1/6 ≈ 0.167.",link:"/resources/probability-simulator-game/"},
  {term:"Exponential Growth",def:"Growth that multiplies by the same factor each time. Gets very big very fast.",visual:"🚀",subj:"math",example:"Bacteria doubling every 20 minutes: 1 → 2 → 4 → 8 → 16 → ...",link:"/resources/population-prediction-idu/"},
  {term:"Conduction",def:"Heat transfer through direct contact. Particles vibrate and pass energy to neighbours.",visual:"🤝",subj:"science",example:"A metal spoon in hot soup gets hot — heat conducts through the metal.",link:"/resources/heat-transfer-investigation/"},
  {term:"Convection",def:"Heat transfer through fluid movement. Hot fluid rises, cool fluid sinks.",visual:"♨️",subj:"science",example:"Hot air rises above a radiator, cool air flows in to replace it."},
  {term:"Radiation",def:"Heat transfer through electromagnetic waves. No medium needed.",visual:"☀️",subj:"science",example:"The Sun heats the Earth through radiation across empty space."},
  {term:"Tessellation",def:"A pattern of shapes that fit together with no gaps and no overlaps.",visual:"🔷",subj:"math",example:"Only three regular shapes tessellate: triangles, squares, and hexagons.",link:"/resources/grade-6-tessellation-explorer-investigation/"},
  {term:"Equation",def:"A mathematical sentence with an equals sign. Both sides have the same value.",visual:"=",subj:"math",example:"3x + 1 = 10 is an equation. x = 3 makes both sides equal 10."},
  {term:"Expression",def:"Numbers and letters combined with operations — but NO equals sign.",visual:"📝",subj:"math",example:"3x + 1 is an expression. It is not an equation because there is no = sign."},
  {term:"Integer",def:"A whole number. Can be positive, negative, or zero.",visual:"🔢",subj:"math",example:"-3, 0, 7, and 142 are all integers. 0.5 is not."},
  {term:"Rational Number",def:"Any number that can be written as a fraction a/b where a and b are integers.",visual:"½",subj:"math",example:"0.75 = 3/4 (rational). π cannot be written as a fraction (irrational)."},
  {term:"Prime Number",def:"A number greater than 1 that has exactly two factors: 1 and itself.",visual:"🔑",subj:"math",example:"2, 3, 5, 7, 11 are prime. 4 is not (factors: 1, 2, 4).",link:"/resources/prime-maze-game/"},
  {term:"Factor",def:"A number that divides exactly into another number with no remainder.",visual:"÷",subj:"math",example:"The factors of 12 are: 1, 2, 3, 4, 6, 12."},
  {term:"Multiple",def:"The result of multiplying a number by any integer.",visual:"×",subj:"math",example:"Multiples of 5: 5, 10, 15, 20, 25, ..."},
  {term:"Area",def:"The amount of space inside a 2D shape. Measured in square units.",visual:"⬛",subj:"math",example:"A rectangle 4cm × 3cm has area = 12 cm²."},
  {term:"Perimeter",def:"The total distance around the outside of a shape.",visual:"🔲",subj:"math",example:"A rectangle 4cm × 3cm has perimeter = 14 cm."},
  {term:"Circumference",def:"The distance around a circle. Calculated as C = πd or C = 2πr.",visual:"⭕",subj:"math",example:"A circle with diameter 10 cm has circumference ≈ 31.4 cm."},
  {term:"Diameter",def:"The distance across a circle through the centre. Twice the radius.",visual:"↔️",subj:"math",example:"If radius = 5 cm, diameter = 10 cm."},
  {term:"Radius",def:"The distance from the centre of a circle to its edge. Half the diameter.",visual:"📏",subj:"math",example:"If diameter = 10 cm, radius = 5 cm."},
  {term:"Parallel",def:"Lines that are always the same distance apart. They never meet.",visual:"‖",subj:"math",example:"Railway tracks are parallel. They run side by side."},
  {term:"Perpendicular",def:"Lines that meet at exactly 90 degrees (a right angle).",visual:"⊥",subj:"math",example:"The corner of a page is where two perpendicular edges meet."},
  {term:"Symmetry",def:"When one half of a shape is a mirror image of the other half.",visual:"🦋",subj:"math",example:"A butterfly has one line of symmetry — left mirrors right."},
  {term:"Translation",def:"Sliding a shape to a new position without rotating or flipping it.",visual:"➡️",subj:"math",example:"Move every point 3 right and 2 up: (x,y) → (x+3, y+2).",link:"/resources/geometry-transformer-game/"},
  {term:"Rotation",def:"Turning a shape around a fixed point by a certain angle.",visual:"↻",subj:"math",example:"Rotate 90° clockwise: (x,y) → (y, -x).",link:"/resources/geometry-transformer-game/"},
  {term:"Reflection",def:"Flipping a shape over a line to create a mirror image.",visual:"🪞",subj:"math",example:"Reflect in the y-axis: (x,y) → (-x, y).",link:"/resources/geometry-transformer-game/"},
  {term:"Scale Factor",def:"The number you multiply by to enlarge or reduce a shape.",visual:"🔍",subj:"math",example:"Scale factor 2 means every length doubles. Scale factor 0.5 means every length halves."},
  {term:"Sequence",def:"An ordered list of numbers that follow a rule.",visual:"1️⃣",subj:"math",example:"2, 5, 8, 11, 14, ... is a sequence with common difference 3.",link:"/resources/worked-example-nth-term/"},
  {term:"Function",def:"A rule that takes an input and produces exactly one output.",visual:"⚙️",subj:"math",example:"f(x) = 2x + 1. Input 3 → output 7.",link:"/resources/function-machine-game/"},
  {term:"Inequality",def:"A statement that one value is greater than, less than, or not equal to another.",visual:"≠",subj:"math",example:"x > 5 means x is any number greater than 5."},
  {term:"Coordinates",def:"Two numbers (x, y) that describe a position on a grid.",visual:"📍",subj:"math",example:"(3, 5) means 3 across and 5 up from the origin."},
  {term:"Origin",def:"The point (0, 0) where the x-axis and y-axis cross.",visual:"⊕",subj:"math",example:"All coordinates are measured from the origin."},
  {term:"Intercept",def:"Where a line crosses an axis. Y-intercept is where x = 0.",visual:"✖️",subj:"math",example:"y = 3x + 2 has y-intercept = 2 (the line crosses the y-axis at 2)."},
  {term:"Correlation",def:"A relationship between two variables. Positive: both increase. Negative: one increases as the other decreases.",visual:"📈📉",subj:"math",example:"Height and shoe size have positive correlation. Temperature and hot chocolate sales have negative correlation."},
  {term:"Outlier",def:"A data point that is far away from the others. It does not fit the pattern.",visual:"⚠️",subj:"math",example:"Test scores: 72, 75, 78, 80, 81, 12. The 12 is an outlier."},
  {term:"Range",def:"The difference between the highest and lowest values in a dataset.",visual:"↕️",subj:"math",example:"Data: 3, 7, 12, 15, 20. Range = 20 − 3 = 17."},
  {term:"Sample",def:"A smaller group selected from a larger population to study.",visual:"🧪",subj:"math",example:"Asking 50 students about lunch preferences is a sample. The whole school is the population."},
  {term:"Cell",def:"The basic unit of life. All living things are made of cells.",visual:"🔬",subj:"science",example:"Your body contains about 37 trillion cells. Each one is alive."},
  {term:"Nucleus",def:"The control centre of a cell. Contains DNA.",visual:"🎯",subj:"science",example:"The nucleus tells the cell what proteins to make.",link:"/resources/cell-explorer-game/"},
  {term:"Mitochondria",def:"The powerhouses of the cell. They release energy from glucose through respiration.",visual:"⚡",subj:"science",example:"Muscle cells have lots of mitochondria because they need lots of energy."},
  {term:"Chloroplast",def:"Found in plant cells only. Where photosynthesis happens.",visual:"🌿",subj:"science",example:"Chloroplasts contain chlorophyll, which absorbs light and makes plants green."},
  {term:"Diffusion",def:"The movement of particles from an area of high concentration to low concentration.",visual:"💨",subj:"science",example:"Perfume spreading across a room is diffusion — particles move from the bottle to the air."},
  {term:"Osmosis",def:"The movement of water molecules through a partially permeable membrane from dilute to concentrated solution.",visual:"💧",subj:"science",example:"Plant roots absorb water by osmosis — water moves from wet soil into the root cells."},
  {term:"Respiration",def:"The chemical process that releases energy from glucose in every living cell. Not the same as breathing.",visual:"🫁",subj:"science",example:"Glucose + Oxygen → Carbon Dioxide + Water + Energy. This happens in mitochondria."},
  {term:"Compound",def:"A substance made of two or more different elements chemically bonded together.",visual:"🔗",subj:"science",example:"Water (H₂O) is a compound — hydrogen and oxygen bonded together."},
  {term:"Element",def:"A substance made of only one type of atom. Cannot be broken down further by chemical means.",visual:"⚛️",subj:"science",example:"Gold (Au), oxygen (O), and carbon (C) are elements."},
  {term:"Atom",def:"The smallest particle of an element that still has the properties of that element.",visual:"⚛️",subj:"science",example:"A gold atom is the smallest piece of gold possible."},
  {term:"Molecule",def:"Two or more atoms bonded together.",visual:"🔗",subj:"science",example:"O₂ is a molecule (two oxygen atoms). H₂O is also a molecule."},
  {term:"Ion",def:"An atom that has gained or lost electrons, giving it an electrical charge.",visual:"⊕⊖",subj:"science",example:"Na⁺ is a sodium ion (lost 1 electron). Cl⁻ is a chloride ion (gained 1 electron)."},
  {term:"pH",def:"A scale from 0 to 14 measuring how acidic or alkaline a substance is. 7 is neutral.",visual:"🧪",subj:"science",example:"Lemon juice ≈ pH 2 (acidic). Water = pH 7 (neutral). Bleach ≈ pH 12 (alkaline)."},
  {term:"Chemical Reaction",def:"A process where reactants are transformed into products. Bonds break and new bonds form.",visual:"💥",subj:"science",example:"Burning wood: wood + oxygen → carbon dioxide + water + heat."},
  {term:"Exothermic",def:"A reaction that releases energy (usually heat) to the surroundings.",visual:"🔥",subj:"science",example:"Burning, neutralisation, and respiration are exothermic — they give out heat."},
  {term:"Endothermic",def:"A reaction that absorbs energy from the surroundings, making them feel cold.",visual:"❄️",subj:"science",example:"Photosynthesis and dissolving ammonium nitrate are endothermic."},
  {term:"Current",def:"The flow of electrical charge through a circuit. Measured in amperes (A).",visual:"⚡",subj:"science",example:"More current = brighter bulb. Current is the same everywhere in a series circuit.",link:"/resources/circuit-builder-game/"},
  {term:"Voltage",def:"The push that drives current around a circuit. Measured in volts (V).",visual:"🔋",subj:"science",example:"A 12V battery pushes harder than a 1.5V battery. More voltage = more current (if resistance stays the same)."},
  {term:"Resistance",def:"How much a component opposes the flow of current. Measured in ohms (Ω).",visual:"🚧",subj:"science",example:"A thin wire has more resistance than a thick wire. More resistance = less current."},
  {term:"Force",def:"A push or a pull. Measured in newtons (N). Can change speed, direction, or shape.",visual:"💪",subj:"science",example:"Gravity pulls you down (your weight in N). The floor pushes you up (normal force)."},
  {term:"Gravity",def:"The force of attraction between any two masses. On Earth: 9.8 N/kg.",visual:"🌍",subj:"science",example:"A 1 kg object weighs about 9.8 N on Earth but only 1.6 N on the Moon."},
  {term:"Friction",def:"A force that opposes motion between two surfaces in contact.",visual:"✋",subj:"science",example:"Rough surfaces have more friction. Ice has very little friction."},
  {term:"Speed",def:"How fast something is moving. Distance divided by time.",visual:"🏃",subj:"science",example:"If you run 100m in 12.5 seconds, your speed = 100 ÷ 12.5 = 8 m/s.",link:"/resources/worked-example-distance-time/"},
  {term:"Acceleration",def:"How quickly speed is changing. Measured in m/s².",visual:"🚀",subj:"science",example:"Going from 0 to 20 m/s in 5 seconds = acceleration of 4 m/s²."},
  {term:"Kinetic Energy",def:"The energy an object has because it is moving. KE = ½mv².",visual:"🏎️",subj:"science",example:"A fast car has more kinetic energy than a slow one. Doubling speed quadruples KE."},
  {term:"Potential Energy",def:"Stored energy due to position or condition. Gravitational PE = mgh.",visual:"⬆️",subj:"science",example:"A ball held high has gravitational PE. When dropped, PE converts to KE."},
  {term:"Tectonic Plates",def:"Giant slabs of rock that make up Earth's surface. They move slowly over the mantle.",visual:"🌍",subj:"science",example:"The Pacific Plate moves about 7-10 cm per year — roughly as fast as your fingernails grow.",link:"/resources/tectonic-puzzle-game/"},
  {term:"Earthquake",def:"A sudden shaking of the ground caused by tectonic plate movement.",visual:"💥",subj:"science",example:"Earthquakes happen at plate boundaries where plates push together, pull apart, or slide past each other."},
  {term:"Volcano",def:"An opening in Earth's crust where molten rock (magma) reaches the surface.",visual:"🌋",subj:"science",example:"Volcanoes often form at subduction zones where one plate slides under another."},
  {term:"Erosion",def:"The wearing away and transport of rock and soil by wind, water, or ice.",visual:"🌊",subj:"science",example:"Rivers erode their banks. Glaciers carve valleys. Wind shapes desert rocks."},
  {term:"Weathering",def:"The breaking down of rock in place — without movement. Physical, chemical, or biological.",visual:"🪨",subj:"science",example:"Freeze-thaw: water gets into cracks, freezes, expands, and breaks the rock apart."},
  {term:"Fossil",def:"The preserved remains or traces of ancient organisms found in rock.",visual:"🦴",subj:"science",example:"Fossils of the same species on different continents are evidence that the continents were once joined."},
  {term:"Natural Selection",def:"The process where organisms better adapted to their environment survive and reproduce more.",visual:"🦎",subj:"science",example:"Darker moths survived better on soot-covered trees during the Industrial Revolution."},
  {term:"Adaptation",def:"A feature of an organism that helps it survive in its environment.",visual:"🐪",subj:"science",example:"A camel's hump stores fat (not water). Long eyelashes keep out sand. Both are adaptations to desert life."},
  {term:"Food Chain",def:"A sequence showing what eats what. Energy flows from producer to consumers.",visual:"🔗",subj:"science",example:"Grass → Rabbit → Fox → Eagle. Each arrow means 'is eaten by'.",link:"/resources/food-web-builder-game/"},
  {term:"Producer",def:"An organism that makes its own food from sunlight (photosynthesis). Always at the start of a food chain.",visual:"🌱",subj:"science",example:"Grass, trees, algae, and phytoplankton are all producers."},
  {term:"Consumer",def:"An organism that gets energy by eating other organisms.",visual:"🐾",subj:"science",example:"Primary consumers eat producers. Secondary consumers eat primary consumers."},
  {term:"Decomposer",def:"An organism that breaks down dead matter, returning nutrients to the soil.",visual:"🍄",subj:"science",example:"Fungi and bacteria are decomposers. Without them, dead material would pile up forever."},
  {term:"Biodiversity",def:"The variety of different species in an area. Higher biodiversity = healthier ecosystem.",visual:"🌍",subj:"science",example:"A tropical rainforest has high biodiversity. A monoculture farm has very low biodiversity.",link:"/resources/grade-6-schoolyard-ecosystem-investigation/"},
  {term:"Habitat",def:"The natural environment where an organism lives.",visual:"🏠",subj:"science",example:"A pond is a habitat for frogs. A desert is a habitat for cacti."},
  {term:"Niche",def:"The specific role an organism plays in its ecosystem — what it eats, where it lives, when it is active.",visual:"🎭",subj:"science",example:"Two species cannot occupy the same niche in the same habitat for long — one will outcompete the other."},
  {term:"Renewable Energy",def:"Energy from sources that are naturally replenished. Will not run out.",visual:"♻️",subj:"science",example:"Solar, wind, hydroelectric, and geothermal are renewable. Coal and gas are not."},
  {term:"Greenhouse Effect",def:"When certain gases trap heat in the atmosphere, warming the planet.",visual:"🌡️",subj:"science",example:"CO₂ and methane are greenhouse gases. Some greenhouse effect is natural and necessary. Too much causes warming."},
];

var activeSubj = 'all';

function renderVocab(items) {
  var grid = document.getElementById('vocabGrid');
  grid.innerHTML = '';
  items.forEach(function(v) {
    var card = document.createElement('div');
    card.className = 'vocab-card';
    card.dataset.subj = v.subj;
    var linkHtml = v.link ? '<a href="'+v.link+'" class="vocab-link">See it in action →</a>' : '';
    card.innerHTML = '<div class="vocab-visual">' + v.visual + '</div><h3>' + v.term + '</h3><p class="vocab-def">' + v.def + '</p><p class="vocab-example">"' + v.example + '"</p>' + linkHtml;
    grid.appendChild(card);
  });
}

function filterVocab() {
  var q = document.getElementById('vocabSearch').value.toLowerCase();
  var filtered = vocab.filter(function(v) {
    var matchSubj = activeSubj === 'all' || v.subj === activeSubj;
    var matchSearch = !q || v.term.toLowerCase().includes(q) || v.def.toLowerCase().includes(q);
    return matchSubj && matchSearch;
  });
  renderVocab(filtered);
}

function filterSubj(s, btn) {
  activeSubj = s;
  document.querySelectorAll('.vocab-filter').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterVocab();
}

renderVocab(vocab);
</script>

{{ end }}
