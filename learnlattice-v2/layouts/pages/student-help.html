{{ define "main" }}

  <div class="sh-pills" id="shPills"></div>

{{ partial "newsletter.html" . }}

<style>
.sh-section { max-width:960px; margin:0 auto; padding:0 24px 48px; }

/* ── Pills ── */
.sh-pills {
  display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
  padding:12px 0 20px;
}
.sh-p {
  padding:7px 14px; border-radius:100px; border:1.5px solid var(--border);
  background:var(--surface-card); color:var(--ink-muted); font-size:.8rem;
  font-weight:500; cursor:pointer; font-family:inherit; transition:all .12s;
  white-space:nowrap; display:inline-flex; align-items:center; gap:5px;
}
.sh-p:hover { border-color:var(--teal); color:var(--teal); }
.sh-p.on { background:var(--teal); border-color:var(--teal); color:#fff; font-weight:600; }

/* ── Viewer ── */
.sh-viewer { border-radius:16px; overflow:hidden; border:1px solid var(--border); background:#0a0f1a; position:relative; }

.sh-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; background:rgba(15,23,42,.95); border-bottom:1px solid #1e293b;
  gap:12px; min-height:44px;
}
.sh-bar-left { display:flex; align-items:center; gap:8px; min-width:0; }
.sh-bar-icon { font-size:1.2rem; flex-shrink:0; }
.sh-bar-title { font-family:'DM Serif Display',serif; font-size:.95rem; color:#e2e8f0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sh-bar-right { display:flex; gap:6px; flex-shrink:0; }
.sh-btn {
  padding:5px 12px; border-radius:7px; border:1px solid #334155;
  background:#1e293b; color:#94a3b8; font-size:.68rem; font-weight:600;
  cursor:pointer; font-family:inherit; transition:all .12s; white-space:nowrap;
}
.sh-btn:hover { border-color:#14b8a6; color:#14b8a6; }

.sh-frame { width:100%; border:none; display:block; background:#0a0f1a; }

.sh-links {
  display:flex; gap:8px; padding:10px 16px; background:rgba(15,23,42,.95);
  border-top:1px solid #1e293b; flex-wrap:wrap; align-items:center;
}
.sh-links-label { font-size:.6rem; text-transform:uppercase; letter-spacing:1.5px; color:#475569; font-weight:700; margin-right:4px; }
.sh-link {
  padding:5px 12px; border-radius:7px; background:#1e293b; border:1px solid #334155;
  color:#94a3b8; font-size:.75rem; text-decoration:none; font-weight:500;
  transition:all .12s;
}
.sh-link:hover { border-color:#14b8a6; color:#14b8a6; }

/* ── Responsive ── */
@media (max-width:640px) {
  .sh-pills { gap:4px; }
  .sh-p { padding:6px 11px; font-size:.72rem; }
  .sh-bar { padding:8px 12px; }
  .sh-bar-title { font-size:.85rem; }
  .sh-links { padding:8px 12px; }
}
@media (max-width:480px) {
  .sh-p { font-size:12px !important; padding:5px 9px; }
  .sh-btn { font-size:11px !important; }
}

html.dark .sh-p { background:#1e293b; border-color:#334155; }
html.dark .sh-p.on { background:var(--teal); border-color:var(--teal); }
html.dark .sh-viewer { border-color:#334155; }
</style>

<script>
(function(){
var T = [
  {t:"Negative Numbers",i:"\u2796",s:"/interactives/negative-numbers.html",l:[{n:"Algebra balance scale",u:"/resources/understand-algebra/"},{n:"Equations step by step",u:"/resources/worked-example-linear-equations/"}]},
  {t:"Fractions",i:"\u00bd",s:"/interactives/fractions.html",l:[{n:"Percentage change",u:"/resources/worked-example-percentage-change/"},{n:"The Fairness Problem",u:"/resources/the-fairness-problem-fractions-inquiry/"}]},
  {t:"Percentages",i:"%",s:"/interactives/percentages.html",l:[{n:"Percentage change step by step",u:"/resources/worked-example-percentage-change/"},{n:"The Recipe Problem",u:"/resources/the-recipe-problem-ratio-investigation/"}]},
  {t:"Ratio",i:"\u2236",s:"/interactives/ratio.html",l:[{n:"The Recipe Problem",u:"/resources/the-recipe-problem-ratio-investigation/"},{n:"Proportional reasoning",u:"/resources/worked-example-percentage-change/"}]},
  {t:"Algebra",i:"\ud835\udc65",s:"/interactives/algebra.html",l:[{n:"Function Machine game",u:"/resources/function-machine-game/"},{n:"nth term step by step",u:"/resources/worked-example-nth-term/"}]},
  {t:"Sequences",i:"1,4,7\u2026",s:"/interactives/sequences.html",l:[{n:"nth term step by step",u:"/resources/worked-example-nth-term/"},{n:"The Staircase Problem",u:"/resources/staircase-problem-patterns-investigation/"}]},
  {t:"Coordinates",i:"\ud83d\udccd",s:"/interactives/coordinates.html",l:[{n:"Geometry Transformer",u:"/resources/geometry-transformer-game/"},{n:"Scatter graphs investigation",u:"/resources/grade-8-scatter-graphs-investigation/"}]},
  {t:"Transformations",i:"\ud83e\ude9e",s:"/interactives/transformations.html",l:[{n:"Geometry Transformer game",u:"/resources/geometry-transformer-game/"},{n:"Tessellation Explorer",u:"/resources/grade-6-tessellation-explorer-investigation/"}]},
  {t:"Graphs",i:"\ud83d\udcc8",s:"/interactives/graph-reading.html",l:[{n:"Line of best fit",u:"/resources/worked-example-line-of-best-fit/"},{n:"Height vs Armspan",u:"/resources/grade-8-scatter-graphs-investigation/"}]},
  {t:"Averages",i:"\u03bc",s:"/interactives/mean-median-mode.html",l:[{n:"Mean from frequency table",u:"/resources/worked-example-mean-from-table/"},{n:"The Misleading Graph",u:"/resources/the-misleading-graph-statistics-investigation/"}]},
  {t:"Area & Perimeter",i:"\u25a2",s:"/interactives/area-perimeter.html",l:[{n:"Tessellation Explorer",u:"/resources/grade-6-tessellation-explorer-investigation/"},{n:"Geometry Transformer",u:"/resources/geometry-transformer-game/"}]},
  {t:"Probability",i:"\ud83c\udfb2",s:"/interactives/probability.html",l:[{n:"Probability Simulator",u:"/resources/probability-simulator-game/"},{n:"Is This Die Cheating?",u:"/resources/is-this-die-cheating-probability-investigation/"}]},
  {t:"Cells",i:"\ud83d\udd2c",s:"/interactives/cells.html",l:[{n:"Cell Explorer game",u:"/resources/cell-explorer-game/"},{n:"Body Systems Inquiry",u:"/resources/grade-6-body-systems-inquiry-unit/"}]},
  {t:"Genetics",i:"\ud83e\uddec",s:"/interactives/genetics.html",l:[{n:"Why Do We Look Like Our Parents?",u:"/resources/genetics-inheritance-investigation/"},{n:"Punnett Squares worked",u:"/resources/worked-example-punnett-squares/"}]},
  {t:"Density",i:"\u2696\ufe0f",s:"/interactives/density.html",l:[{n:"Density step by step",u:"/resources/worked-example-density/"},{n:"The Sinking Orange",u:"/resources/density-and-floating-investigation/"}]},
  {t:"Forces",i:"\ud83d\udcaa",s:"/interactives/forces.html",l:[{n:"Feather and Hammer",u:"/resources/forces-and-falling-investigation/"},{n:"The Impossible Lift",u:"/resources/simple-machines-investigation/"}]},
  {t:"Energy",i:"\u26a1",s:"/interactives/energy.html",l:[{n:"Where Does Energy Go?",u:"/resources/energy-transfer-investigation/"},{n:"E = \u00bdmv\u00b2 worked",u:"/resources/worked-example-substitution/"}]},
  {t:"Waves",i:"\u301c",s:"/interactives/waves.html",l:[{n:"Can You See Sound?",u:"/resources/waves-and-sound-investigation/"},{n:"Speed, Distance, Time",u:"/resources/worked-example-speed-distance-time/"}]},
  {t:"Circuits",i:"\ud83d\udd0c",s:"/interactives/circuits.html",l:[{n:"Circuit Builder game",u:"/resources/circuit-builder-game/"},{n:"The Circuit Detective",u:"/resources/electric-circuits-investigation/"}]},
  {t:"Particles",i:"\u269b\ufe0f",s:"/interactives/particles.html",l:[{n:"Reaction Rate Lab",u:"/resources/reaction-rate-lab-game/"},{n:"Disappearing Candle",u:"/resources/the-disappearing-candle-chemistry-investigation/"}]},
  {t:"pH Scale",i:"\ud83e\uddea",s:"/interactives/ph-scale.html",l:[{n:"Acids & Bases Investigation",u:"/resources/acids-bases-neutralisation-investigation/"},{n:"Reaction Rate Lab",u:"/resources/reaction-rate-lab-game/"}]},
  {t:"Reactions",i:"\u2697\ufe0f",s:"/interactives/chemical-reactions.html",l:[{n:"Equation Balancer game",u:"/resources/equation-balancer-game/"},{n:"The Rusting Race",u:"/resources/the-rusting-race-chemistry-investigation/"}]},
  {t:"Tectonics",i:"\ud83c\udf0d",s:"/interactives/plate-tectonics.html",l:[{n:"Tectonic Puzzle game",u:"/resources/tectonic-puzzle-game/"},{n:"Reading Rocks",u:"/resources/reading-rocks-investigation/"}]},
  {t:"Food Webs",i:"\ud83c\udf3f",s:"/interactives/food-webs.html",l:[{n:"Food Web Builder",u:"/resources/food-web-builder-game/"},{n:"The Invisible Thread",u:"/resources/the-invisible-thread-ecology-investigation/"}]}
];

var cur=0, pills=document.getElementById('shPills'), viewer=document.getElementById('shViewer');

// Build pills once
T.forEach(function(t,i){
  var b=document.createElement('button');
  b.className='sh-p'+(i===0?' on':'');
  b.dataset.i=i;
  b.innerHTML=t.i+' '+t.t;
  b.onclick=function(){show(i)};
  pills.appendChild(b);
});

function show(i){
  cur=i; var t=T[i];
  pills.querySelectorAll('.sh-p').forEach(function(p,j){p.classList.toggle('on',j===i)});

  // Calculate frame height: viewport minus hero, pills, bar, links, and some padding
  var fh=Math.max(340, Math.min(560, window.innerHeight - 280));

  viewer.innerHTML=
    '<div class="sh-bar">'+
      '<div class="sh-bar-left"><span class="sh-bar-icon">'+t.i+'</span><span class="sh-bar-title">'+t.t+'</span></div>'+
      '<div class="sh-bar-right">'+
        '<button class="sh-btn" onclick="nav(-1)">\u2190 Prev</button>'+
        '<button class="sh-btn" onclick="nav(1)">Next \u2192</button>'+
        '<button class="sh-btn" onclick="window.open(T['+i+'].s,\'_blank\')">\u2197 Fullscreen</button>'+
      '</div>'+
    '</div>'+
    '<iframe class="sh-frame" style="height:'+fh+'px" src="'+t.s+'" loading="lazy" title="'+t.t+'"></iframe>'+
    '<div class="sh-links">'+
      '<span class="sh-links-label">Try next</span>'+
      t.l.map(function(l){return '<a href="'+l.u+'" class="sh-link">'+l.n+' \u2192</a>'}).join('')+
    '</div>';
}

window.T=T;
window.nav=function(d){ show((cur+d+T.length)%T.length); };

document.addEventListener('keydown',function(e){
  if(document.activeElement&&document.activeElement.tagName==='IFRAME') return;
  if(e.key==='ArrowRight'){e.preventDefault();nav(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();nav(-1);}
});

show(0);
})();
</script>

{{ end }}
