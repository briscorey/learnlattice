{{ define "main" }}

<section class="pf-hero">
  <div class="pf-hero-inner">
    <div class="pf-hero-kicker">Search & Filter</div>
    <h1>Find the right resource in seconds</h1>
    <p>Combine filters across subject, grade, criterion, and type — or just start typing.</p>
  </div>
</section>

<section class="pf-search-section">
  <div class="pf-search-inner">

    <div class="pf-layout">
      {{/* SIDEBAR FILTERS */}}
      <aside class="pf-filters" id="pfFilters">
        <div class="pf-filter-group">
          <h3>Subject</h3>
          <div id="pf-filter-subject"></div>
        </div>
        <div class="pf-filter-group">
          <h3>Grade</h3>
          <div id="pf-filter-grade"></div>
        </div>
        <div class="pf-filter-group">
          <h3>Criterion</h3>
          <div id="pf-filter-criterion"></div>
        </div>
        <div class="pf-filter-group">
          <h3>Type</h3>
          <div id="pf-filter-type"></div>
        </div>
        <div class="pf-filter-group">
          <h3>Key Concept</h3>
          <div id="pf-filter-concept"></div>
        </div>
        <button class="pf-clear-btn" id="pfClear" style="display:none">Clear all filters</button>
      </aside>

      {{/* MAIN RESULTS */}}
      <div class="pf-results-area">
        <div class="pf-search-bar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:var(--ink-muted)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="pfInput" class="pf-input" placeholder="Search resources, topics, subjects…" autocomplete="off" spellcheck="false">
        </div>
        <div class="pf-status" id="pfStatus"></div>
        <div class="pf-results" id="pfResults"></div>
      </div>
    </div>

    <button class="pf-mobile-filter-btn" id="pfMobileToggle">Filters</button>

  </div>
</section>

<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script>
document.addEventListener('DOMContentLoaded', async function() {
  const pagefind = await import('/pagefind/pagefind.js');
  await pagefind.options({ excerptLength: 0 });

  const input = document.getElementById('pfInput');
  const resultsEl = document.getElementById('pfResults');
  const statusEl = document.getElementById('pfStatus');
  const clearBtn = document.getElementById('pfClear');
  const mobileToggle = document.getElementById('pfMobileToggle');
  const filtersEl = document.getElementById('pfFilters');

  let activeFilters = {};
  let debounceTimer;

  // Build filter checkboxes from pagefind's filter data
  const filters = await pagefind.filters();

  const filterConfig = [
    { key: 'subject', el: 'pf-filter-subject' },
    { key: 'grade', el: 'pf-filter-grade' },
    { key: 'criterion', el: 'pf-filter-criterion' },
    { key: 'type', el: 'pf-filter-type' },
    { key: 'concept', el: 'pf-filter-concept' }
  ];

  filterConfig.forEach(({ key, el }) => {
    const container = document.getElementById(el);
    const values = filters[key] || {};
    const sorted = Object.entries(values).sort((a, b) => a[0].localeCompare(b[0]));

    if (!sorted.length) {
      container.innerHTML = '<span style="font-size:.78rem;color:var(--ink-muted)">None available</span>';
      return;
    }

    sorted.forEach(([value, count]) => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.filterKey = key;
      cb.dataset.filterValue = value;
      cb.addEventListener('change', () => {
        updateActiveFilters();
        runSearch();
      });
      const span = document.createElement('span');
      span.textContent = value;
      const countSpan = document.createElement('span');
      countSpan.className = 'pf-filter-count';
      countSpan.textContent = count;
      label.append(cb, span, countSpan);
      container.appendChild(label);
    });
  });

  function updateActiveFilters() {
    activeFilters = {};
    document.querySelectorAll('.pf-filter-group input:checked').forEach(cb => {
      const key = cb.dataset.filterKey;
      if (!activeFilters[key]) activeFilters[key] = {};
      activeFilters[key][cb.dataset.filterValue] = true;
    });
    const hasFilters = Object.keys(activeFilters).length > 0;
    clearBtn.style.display = hasFilters ? '' : 'none';
  }

  clearBtn.addEventListener('click', () => {
    document.querySelectorAll('.pf-filter-group input:checked').forEach(cb => cb.checked = false);
    activeFilters = {};
    clearBtn.style.display = 'none';
    runSearch();
  });

  mobileToggle.addEventListener('click', () => {
    filtersEl.classList.toggle('open');
    mobileToggle.textContent = filtersEl.classList.contains('open') ? 'Apply filters' : 'Filters';
  });

  async function runSearch() {
    const query = input.value.trim();
    const hasFilters = Object.keys(activeFilters).length > 0;

    if (!query && !hasFilters) {
      // Show all resources by searching with a wildcard-like approach
      const results = await pagefind.search('', { filters: {} });
      renderResults(results);
      return;
    }

    const filterObj = {};
    Object.entries(activeFilters).forEach(([key, values]) => {
      filterObj[key] = Object.keys(values);
    });

    const results = await pagefind.search(query || null, { filters: filterObj });
    renderResults(results);
  }

  async function renderResults(searchResult) {
    const total = searchResult.results.length;
    statusEl.textContent = total === 0 ? 'No resources match your filters' : total + ' resource' + (total === 1 ? '' : 's') + ' found';

    if (total === 0) {
      resultsEl.innerHTML = '<div class="pf-empty">No resources match. Try removing a filter or changing your search.</div>';
      return;
    }

    // Load first 24 results
    const loaded = await Promise.all(searchResult.results.slice(0, 24).map(r => r.data()));

    resultsEl.innerHTML = loaded.map(item => {
      const meta = item.meta || {};
      const filters = item.filters || {};
      const subject = meta.subject || (filters.subject && filters.subject[0]) || '';
      const type = filters.type ? filters.type[0] : '';
      const grades = (filters.grade || []).slice(0, 2).join(', ');

      return '<a href="' + item.url + '" class="pf-result-card">' +
        (subject ? '<span class="pf-result-subject">' + subject + '</span>' : '') +
        '<h3>' + (meta.title || item.url) + '</h3>' +
        (meta.description ? '<p>' + meta.description + '</p>' : '') +
        '<div class="pf-result-tags">' +
          (type ? '<span class="pf-result-tag">' + type + '</span>' : '') +
          (grades ? '<span class="pf-result-tag">' + grades + '</span>' : '') +
        '</div>' +
      '</a>';
    }).join('');

    if (total > 24) {
      resultsEl.innerHTML += '<div class="pf-empty">Showing 24 of ' + total + ' results. Narrow your filters to see more.</div>';
    }
  }

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 150);
  });

  // Initial load — show all resources
  runSearch();
});
</script>

{{ end }}
