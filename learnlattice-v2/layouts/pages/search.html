{{ define "main" }}

<section class="pf-hero">
  <div class="pf-hero-inner">
    <div class="pf-hero-kicker">Search & Filter</div>
    <h1>Find the right resource in seconds</h1>
    <p>Combine filters across subject, grade, criterion, and type — or just start typing.</p>
  </div>
</section>

<section class="pf-search-section">
  <div class="pf-search-inner">

    <div class="pf-layout">
      {{/* SIDEBAR FILTERS */}}
      <aside class="pf-filters" id="pfFilters">
        <div class="pf-filter-group">
          <h3>Subject</h3>
          <div id="pf-filter-subject"></div>
        </div>
        <div class="pf-filter-group">
          <h3>Grade</h3>
          <div id="pf-filter-grade"></div>
        </div>
        <div class="pf-filter-group">
          <h3>Criterion</h3>
          <div id="pf-filter-criterion"></div>
        </div>
        <div class="pf-filter-group">
          <h3>Type</h3>
          <div id="pf-filter-type"></div>
        </div>
        <div class="pf-filter-group">
          <h3>Key Concept</h3>
          <div id="pf-filter-concept"></div>
        </div>
        <button class="pf-clear-btn" id="pfClear" style="display:none">Clear all filters</button>
      </aside>

      {{/* MAIN RESULTS */}}
      <div class="pf-results-area">
        <div class="pf-search-bar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:var(--ink-muted)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="pfInput" class="pf-input" placeholder="Search resources, topics, subjects…" autocomplete="off" spellcheck="false">
        </div>
        <div class="pf-status" id="pfStatus"></div>
        <div class="pf-results" id="pfResults"></div>
      </div>
    </div>

    <button class="pf-mobile-filter-btn" id="pfMobileToggle">Filters</button>

  </div>
</section>

<link href="/pagefind/pagefind-ui.css" rel="stylesheet">

<style>
.pf-hero{padding:48px 24px 28px;text-align:center;background:var(--surface-warm);border-bottom:1px solid var(--border)}
.pf-hero-inner{max-width:900px;margin:0 auto}
.pf-hero-kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);font-weight:600;margin-bottom:8px}
.pf-hero h1{font-family:'DM Serif Display',serif;font-size:clamp(1.6rem,4vw,2.2rem);color:var(--ink);margin-bottom:8px}
.pf-hero p{color:var(--ink-muted);font-size:.92rem;line-height:1.5}
.pf-search-section{max-width:1200px;margin:0 auto;padding:32px 24px 80px}
.pf-layout{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start}
.pf-filters{position:sticky;top:80px;display:flex;flex-direction:column;gap:20px}
.pf-filter-group h3{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-muted);margin-bottom:8px}
.pf-filter-group label{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.85rem;color:var(--ink);cursor:pointer;transition:color .15s}
.pf-filter-group label:hover{color:var(--teal)}
.pf-filter-group input[type="checkbox"]{accent-color:var(--teal);width:16px;height:16px;flex-shrink:0}
.pf-filter-count{font-size:.7rem;color:var(--ink-muted);margin-left:auto;font-family:'JetBrains Mono',monospace}
.pf-clear-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--teal);font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:8px}
.pf-clear-btn:hover{background:var(--teal-wash);border-color:var(--teal)}
.pf-search-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface-card);transition:border-color .2s;margin-bottom:16px}
.pf-search-bar:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.pf-input{flex:1;border:none;background:none;font-family:inherit;font-size:.95rem;color:var(--ink);outline:none}
.pf-input::placeholder{color:var(--ink-muted)}
.pf-status{font-size:.82rem;color:var(--ink-muted);margin-bottom:16px;font-family:'JetBrains Mono',monospace}
.pf-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pf-result-card{display:flex;flex-direction:column;padding:18px;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;color:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
.pf-result-card:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:var(--shadow-md)}
.pf-result-subject{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);margin-bottom:4px}
.pf-result-card h3{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--ink);line-height:1.3;margin-bottom:6px}
.pf-result-card p{font-size:.8rem;color:var(--ink-muted);line-height:1.5;flex:1;margin-bottom:10px}
.pf-result-tags{display:flex;flex-wrap:wrap;gap:4px}
.pf-result-tag{font-size:.62rem;padding:2px 8px;border-radius:5px;background:var(--surface-warm);border:1px solid var(--border);color:var(--ink-muted)}
.pf-empty{text-align:center;padding:48px 24px;color:var(--ink-muted);font-size:.95rem;grid-column:1/-1}
.pf-mobile-filter-btn{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 28px;background:var(--teal);color:#fff;border:none;border-radius:100px;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(13,148,136,.3);z-index:50}
html.dark .pf-search-bar{background:var(--surface-card);border-color:var(--border)}
html.dark .pf-result-card{background:var(--surface-card);border-color:var(--border)}
@media(max-width:768px){
  .pf-layout{grid-template-columns:1fr}
  .pf-filters{display:none;position:fixed;inset:0;z-index:200;background:var(--surface);padding:24px;overflow-y:auto}
  .pf-filters.open{display:flex}
  .pf-mobile-filter-btn{display:block}
}
</style>

<script>
document.addEventListener('DOMContentLoaded', async function() {
  const pagefind = await import('/pagefind/pagefind.js');
  await pagefind.options({ excerptLength: 0 });

  const input = document.getElementById('pfInput');
  const resultsEl = document.getElementById('pfResults');
  const statusEl = document.getElementById('pfStatus');
  const clearBtn = document.getElementById('pfClear');
  const mobileToggle = document.getElementById('pfMobileToggle');
  const filtersEl = document.getElementById('pfFilters');

  let activeFilters = {};
  let debounceTimer;

  // Build filter checkboxes from pagefind's filter data
  const filters = await pagefind.filters();

  const filterConfig = [
    { key: 'subject', el: 'pf-filter-subject' },
    { key: 'grade', el: 'pf-filter-grade' },
    { key: 'criterion', el: 'pf-filter-criterion' },
    { key: 'type', el: 'pf-filter-type' },
    { key: 'concept', el: 'pf-filter-concept' }
  ];

  filterConfig.forEach(({ key, el }) => {
    const container = document.getElementById(el);
    const values = filters[key] || {};
    const sorted = Object.entries(values).sort((a, b) => a[0].localeCompare(b[0]));

    if (!sorted.length) {
      container.innerHTML = '<span style="font-size:.78rem;color:var(--ink-muted)">None available</span>';
      return;
    }

    sorted.forEach(([value, count]) => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.filterKey = key;
      cb.dataset.filterValue = value;
      cb.addEventListener('change', () => {
        updateActiveFilters();
        runSearch();
      });
      const span = document.createElement('span');
      span.textContent = value;
      const countSpan = document.createElement('span');
      countSpan.className = 'pf-filter-count';
      countSpan.textContent = count;
      label.append(cb, span, countSpan);
      container.appendChild(label);
    });
  });

  function updateActiveFilters() {
    activeFilters = {};
    document.querySelectorAll('.pf-filter-group input:checked').forEach(cb => {
      const key = cb.dataset.filterKey;
      if (!activeFilters[key]) activeFilters[key] = {};
      activeFilters[key][cb.dataset.filterValue] = true;
    });
    const hasFilters = Object.keys(activeFilters).length > 0;
    clearBtn.style.display = hasFilters ? '' : 'none';
  }

  clearBtn.addEventListener('click', () => {
    document.querySelectorAll('.pf-filter-group input:checked').forEach(cb => cb.checked = false);
    activeFilters = {};
    clearBtn.style.display = 'none';
    runSearch();
  });

  mobileToggle.addEventListener('click', () => {
    filtersEl.classList.toggle('open');
    mobileToggle.textContent = filtersEl.classList.contains('open') ? 'Apply filters' : 'Filters';
  });

  async function runSearch() {
    const query = input.value.trim();
    const hasFilters = Object.keys(activeFilters).length > 0;

    if (!query && !hasFilters) {
      // Show all resources by searching with a wildcard-like approach
      const results = await pagefind.search('', { filters: {} });
      renderResults(results);
      return;
    }

    const filterObj = {};
    Object.entries(activeFilters).forEach(([key, values]) => {
      filterObj[key] = Object.keys(values);
    });

    const results = await pagefind.search(query || null, { filters: filterObj });
    renderResults(results);
  }

  async function renderResults(searchResult) {
    const total = searchResult.results.length;
    statusEl.textContent = total === 0 ? 'No resources match your filters' : total + ' resource' + (total === 1 ? '' : 's') + ' found';

    if (total === 0) {
      resultsEl.innerHTML = '<div class="pf-empty">No resources match. Try removing a filter or changing your search.</div>';
      return;
    }

    // Load first 24 results
    const loaded = await Promise.all(searchResult.results.slice(0, 24).map(r => r.data()));

    resultsEl.innerHTML = loaded.map(item => {
      const meta = item.meta || {};
      const filters = item.filters || {};
      const subject = meta.subject || (filters.subject && filters.subject[0]) || '';
      const type = filters.type ? filters.type[0] : '';
      const grades = (filters.grade || []).slice(0, 2).join(', ');

      return '<a href="' + item.url + '" class="pf-result-card">' +
        (subject ? '<span class="pf-result-subject">' + subject + '</span>' : '') +
        '<h3>' + (meta.title || item.url) + '</h3>' +
        (meta.description ? '<p>' + meta.description + '</p>' : '') +
        '<div class="pf-result-tags">' +
          (type ? '<span class="pf-result-tag">' + type + '</span>' : '') +
          (grades ? '<span class="pf-result-tag">' + grades + '</span>' : '') +
        '</div>' +
      '</a>';
    }).join('');

    if (total > 24) {
      resultsEl.innerHTML += '<div class="pf-empty">Showing 24 of ' + total + ' results. Narrow your filters to see more.</div>';
    }
  }

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 150);
  });

  // Initial load — show all resources
  runSearch();
});
</script>

{{ end }}
