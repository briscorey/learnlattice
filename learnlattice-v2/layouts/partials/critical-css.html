<style>:root{--teal:#0d9488;--ink:#1e293b;--ink-muted:#64748b;--border:#e2e8f0;--surface:rgba(248,250,249,0.85);--surface-warm:#f8faf9;--radius:12px}
html.dark{--ink:#e2e8f0;--ink-muted:#94a3b8;--border:#334155;--surface:rgba(15,23,42,0.9);--surface-warm:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:var(--surface-warm)}
nav{position:sticky;top:0;z-index:100;background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;gap:24px}
.nav-brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.nav-title{font-family:Georgia,serif;font-size:22px;color:var(--ink)}
.nav-title-accent{color:var(--teal)}
.nav-panel{display:flex;align-items:center;gap:6px;flex:1}
.nav-links{display:flex;align-items:center;gap:6px;list-style:none}
.nav-link{font-size:14px;color:var(--ink-muted);text-decoration:none;padding:8px 12px}
.skip-link{position:absolute;top:-100px}
.lattice-bg{display:none}
main{min-height:60vh}</style>
