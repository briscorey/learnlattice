<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Lattice pattern -->
  <g opacity=".08">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#5eead4"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>
  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>
  <!-- Brand -->
  <text x="80" y="80" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#5eead4" letter-spacing="3" text-transform="uppercase">LEARNLATTICE</text>
  <!-- Subject pill -->
  <rect x="80" y="110" width="200" height="32" rx="16" fill="#0d9488" opacity=".2"/>
  <text x="100" y="132" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#5eead4" letter-spacing="1">MYP RESOURCE</text>
  <!-- Title (will be replaced per-page) -->
  <text x="80" y="220" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#f1f5f9">
    <tspan x="80" dy="0">Resource Title</tspan>
    <tspan x="80" dy="64">Goes Here</tspan>
  </text>
  <!-- Description -->
  <text x="80" y="380" font-family="system-ui,sans-serif" font-size="20" fill="#94a3b8" opacity=".8">
    <tspan x="80" dy="0">Free inquiry-based MYP investigation</tspan>
  </text>
  <!-- Footer bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#0a1628"/>
  <text x="80" y="612" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">learnlattice.org · Free MYP Mathematics &amp; Science · CC BY-SA 4.0</text>
  <!-- Stats -->
  <text x="1120" y="612" font-family="system-ui,sans-serif" font-size="14" fill="#0d9488" text-anchor="end">222+ Resources</text>
</svg>
