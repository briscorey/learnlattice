[taxonomies]
  tag = "tags"
  subject = "subjects"
  year_level = "year-levels"
  resource_type = "resource-types"

[menu]
  [[menu.main]]
    name = "Mathematics"
    identifier = "mathematics"
    url = "/subjects/mathematics/"
    weight = 1
  [[menu.main]]
    name = "Science"
    identifier = "science"
    url = "/subjects/science/"
    weight = 2
  [[menu.main]]
    name = "Grades"
    identifier = "grades"
    url = "/year-levels/"
    weight = 3
  [[menu.main]]
    name = "Games"
    identifier = "games"
    url = "/games/"
    weight = 4
  [[menu.main]]
    name = "Students"
    identifier = "students"
    url = "/students/"
    weight = 5
  [[menu.main]]
    name = "Blog"
    identifier = "blog"
    url = "/blog/"
    weight = 6
  [[menu.main]]
