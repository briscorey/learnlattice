[related]
  includeNewer = true
  threshold = 30
  toLower = true
  [[related.indices]]
    name = "subjects"
    weight = 100
  [[related.indices]]
    name = "math_topic"
    weight = 80
  [[related.indices]]
    name = "tags"
    weight = 60
  [[related.indices]]
    name = "year_levels"
    weight = 40
  [[related.indices]]
    name = "key_concept"
    weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]



[minify]
  disableHTML = true
