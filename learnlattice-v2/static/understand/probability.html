<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Understand Probability — LearnLattice</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.5rem;background:linear-gradient(135deg,#d97706,#d97706aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sub{font-size:.85rem;color:#94a3b8;margin-bottom:20px;text-align:center;max-width:500px}.app{width:100%;max-width:600px}.display{text-align:center;padding:20px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:16px}.coin{font-size:3rem;margin-bottom:8px}.counts{display:flex;justify-content:center;gap:24px;font-family:'Courier New',monospace;font-size:1rem;color:#94a3b8}.pct{font-family:'Courier New',monospace;font-size:1.2rem;color:#d97706;font-weight:700;margin-top:8px}.bar-wrap{height:24px;background:#1e293b;border-radius:12px;overflow:hidden;margin-bottom:16px;border:1px solid #334155}.bar{height:100%;background:#d97706;border-radius:12px;transition:width .3s}.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btns button{padding:8px 18px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:.85rem;font-family:inherit;transition:all .15s}.btns button:hover{border-color:#d97706;background:#0f172a}.info{margin-top:16px;padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:.85rem;color:#94a3b8;line-height:1.6;text-align:center}.info strong{color:#d97706}.hl{color:#d97706;font-weight:700}.neg{color:#ef4444;font-weight:700}.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;justify-content:center}.slider-row label{font-size:.85rem;color:#94a3b8}.slider-row input{width:200px;accent-color:#d97706}.slider-row span{font-family:'Courier New',monospace;color:#d97706;font-weight:700;min-width:40px}.pos{text-align:center;font-family:'Courier New',monospace;font-size:1.3rem;color:#e2e8f0;margin-bottom:16px}.line{display:flex;gap:2px;justify-content:center;margin-bottom:16px;overflow-x:auto;padding:8px 0}.tick{min-width:28px;height:40px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#64748b;border-radius:6px;background:#1e293b;border:1px solid transparent}.tick.current{background:#d97706;color:#fff;font-weight:700;border-color:#d97706}.tick.zero{border-color:#475569}.web{position:relative;height:300px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:12px}.sp{position:absolute;padding:6px 10px;background:#1e293b;border:1px solid #334155;border-radius:8px;font-size:.75rem;cursor:pointer;transition:all .2s;transform:translate(-50%,-50%);white-space:nowrap;user-select:none}.sp:hover{border-color:#059669;background:#0f172a}.sp.affected{border-color:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.3)}.history{font-size:.78rem;color:#64748b;text-align:center}</style></head><body>
<h1>Does Probability Work?</h1>
<p class="sub">Flip the coin. Watch the results. The more you flip, the closer it gets to 50/50.</p>
<div class="app">
  <div class="display">
    <div class="coin" id="coin">🪙</div>
    <div class="counts"><span id="heads">Heads: 0</span><span id="tails">Tails: 0</span></div>
    <div class="pct" id="pct">50.0% heads</div>
  </div>
  <div class="bar-wrap"><div class="bar" id="bar" style="width:50%"></div></div>
  <div class="btns">
    <button onclick="flip(1)">Flip 1</button>
    <button onclick="flip(10)">Flip 10</button>
    <button onclick="flip(100)">Flip 100</button>
    <button onclick="reset()" style="border-color:#475569">Reset</button>
  </div>
  <div class="info" id="info">The <strong>theoretical probability</strong> of heads is exactly 0.5. The <strong>experimental probability</strong> is what you actually get. With more flips, they converge.</div>
</div>
<script>
var h=0,t=0;
function flip(n){for(var i=0;i<n;i++){if(Math.random()<0.5)h++;else t++}update()}
function reset(){h=0;t=0;update()}
function update(){var total=h+t;var pct=total>0?(h/total*100):50;document.getElementById('heads').textContent='Heads: '+h;document.getElementById('tails').textContent='Tails: '+t;document.getElementById('pct').textContent=pct.toFixed(1)+'% heads ('+total+' flips)';document.getElementById('bar').style.width=pct+'%';var info=document.getElementById('info');if(total===0)info.innerHTML='Click a button to start flipping.';else if(total<20)info.innerHTML='Only <strong>'+total+'</strong> flips — the percentage is unstable. Keep going!';else if(Math.abs(pct-50)<2)info.innerHTML='After <strong>'+total+'</strong> flips, the result is <strong>very close to 50%</strong>. This is the Law of Large Numbers in action.';else info.innerHTML='After <strong>'+total+'</strong> flips, you got '+pct.toFixed(1)+'%. Try flipping more — it should get closer to 50%.'}
update();
</script></body></html>
