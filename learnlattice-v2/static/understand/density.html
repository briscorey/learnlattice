<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Understand Density — LearnLattice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.5rem;background:linear-gradient(135deg,#0D9488,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{font-size:.85rem;color:#94a3b8;margin-bottom:20px;text-align:center}
.explainer{display:flex;gap:20px;max-width:900px;width:100%;flex-wrap:wrap}
.tank-area{flex:1;min-width:320px}
.tank{position:relative;width:100%;height:400px;background:linear-gradient(180deg,#0f172a 0%,#0f172a 30%,rgba(56,189,248,.12) 30%,rgba(56,189,248,.18) 100%);border:2px solid #334155;border-radius:0 0 12px 12px;border-top:3px solid #475569;overflow:hidden}
.water-line{position:absolute;top:30%;left:0;right:0;height:2px;background:rgba(56,189,248,.4)}
.water-label{position:absolute;top:32%;right:8px;font-size:.65rem;color:rgba(56,189,248,.6)}
.tank-object{position:absolute;border-radius:8px;cursor:grab;transition:top 1s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.7rem;font-weight:700;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tank-object .obj-name{font-size:.65rem;margin-top:2px;opacity:.8}
.objects-panel{width:240px}
.objects-title{font-size:.72rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.obj-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:6px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#e2e8f0;cursor:pointer;font-size:.82rem;transition:all .15s;font-family:inherit;text-align:left}
.obj-btn:hover{border-color:#0D9488;background:#1e293b}
.obj-btn .emoji{font-size:1.2rem;width:28px;text-align:center}
.obj-btn .density-val{margin-left:auto;font-family:'Courier New',monospace;font-size:.72rem;color:#0D9488}
.obj-btn.placed{opacity:.3;cursor:default}
.info-card{margin-top:16px;padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:.8rem;color:#94a3b8;line-height:1.6}
.info-card strong{color:#0D9488}
.info-card .formula{font-family:'Courier New',monospace;color:#14b8a6;background:#1e293b;padding:2px 8px;border-radius:4px}
.reset-btn{margin-top:10px;padding:8px 16px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.78rem;font-family:inherit;width:100%}
.reset-btn:hover{border-color:#0D9488;color:#e2e8f0}
</style>
</head>
<body>
<h1>What Makes Things Float or Sink?</h1>
<p class="subtitle">Click an object to drop it in the water. Watch what happens.</p>

<div class="explainer">
  <div class="tank-area">
    <div class="tank" id="tank">
      <div class="water-line"></div>
      <div class="water-label">water: 1.0 g/cm³</div>
    </div>
  </div>
  <div class="objects-panel">
    <div class="objects-title">Click to drop</div>
    <div id="objectList"></div>
    <div class="info-card" id="infoCard">
      <strong>The rule:</strong> If an object's density is <strong>less</strong> than water (1.0 g/cm³), it floats. If <strong>more</strong>, it sinks.<br><br>
      <span class="formula">density = mass ÷ volume</span>
    </div>
    <button class="reset-btn" onclick="resetTank()">Reset tank</button>
  </div>
</div>

<script>
var objects = [
  {name:'Cork',emoji:'🪵',density:0.24,color:'#d97706',size:40},
  {name:'Apple',emoji:'🍎',density:0.9,color:'#dc2626',size:44},
  {name:'Ice',emoji:'🧊',density:0.92,color:'#7dd3fc',size:38},
  {name:'Rubber Duck',emoji:'🦆',density:0.85,color:'#fbbf24',size:42},
  {name:'Egg',emoji:'🥚',density:1.03,color:'#fef3c7',size:36},
  {name:'Coin',emoji:'🪙',density:7.8,color:'#94a3b8',size:30},
  {name:'Steel Ball',emoji:'⚫',density:7.9,color:'#64748b',size:32},
  {name:'Rock',emoji:'🪨',density:2.6,color:'#78716c',size:38},
  {name:'Gold Ring',emoji:'💍',density:19.3,color:'#f59e0b',size:26},
];

var placed = [];
var tank = document.getElementById('tank');

function renderButtons(){
  var list = document.getElementById('objectList');
  list.innerHTML = '';
  objects.forEach(function(obj, i){
    var btn = document.createElement('button');
    btn.className = 'obj-btn' + (placed.includes(i) ? ' placed' : '');
    btn.innerHTML = '<span class="emoji">' + obj.emoji + '</span>' + obj.name + '<span class="density-val">' + obj.density + ' g/cm³</span>';
    if (!placed.includes(i)) {
      btn.onclick = function(){ dropObject(i); };
    }
    list.appendChild(btn);
  });
}

function dropObject(i){
  if (placed.includes(i)) return;
  placed.push(i);
  var obj = objects[i];
  var el = document.createElement('div');
  el.className = 'tank-object';
  el.style.width = obj.size + 'px';
  el.style.height = obj.size + 'px';
  el.style.background = obj.color;
  el.style.left = (40 + Math.random() * (tank.offsetWidth - 120)) + 'px';
  el.style.top = '0px';
  el.innerHTML = '<span style="font-size:1.2rem">' + obj.emoji + '</span><span class="obj-name">' + obj.density + '</span>';
  tank.appendChild(el);

  var waterTop = tank.offsetHeight * 0.3;
  var tankBottom = tank.offsetHeight - obj.size - 8;

  setTimeout(function(){
    if (obj.density < 1.0) {
      // Float — sit at water line
      var floatDepth = obj.density / 1.0; // fraction submerged
      el.style.top = (waterTop - obj.size * (1 - floatDepth)) + 'px';
    } else {
      // Sink — go to bottom
      el.style.top = tankBottom + 'px';
    }
  }, 50);

  // Update info
  var card = document.getElementById('infoCard');
  if (obj.density < 1.0) {
    card.innerHTML = '<strong>' + obj.emoji + ' ' + obj.name + ' floats!</strong><br>Density: ' + obj.density + ' g/cm³ — less than water (1.0), so it floats. About ' + Math.round(obj.density * 100) + '% of it sits below the surface.';
  } else {
    card.innerHTML = '<strong>' + obj.emoji + ' ' + obj.name + ' sinks!</strong><br>Density: ' + obj.density + ' g/cm³ — more than water (1.0), so it sinks straight to the bottom.';
  }

  renderButtons();
}

function resetTank(){
  placed = [];
  tank.querySelectorAll('.tank-object').forEach(function(el){el.remove()});
  document.getElementById('infoCard').innerHTML = '<strong>The rule:</strong> If an object\'s density is <strong>less</strong> than water (1.0 g/cm³), it floats. If <strong>more</strong>, it sinks.<br><br><span class="formula">density = mass ÷ volume</span>';
  renderButtons();
}

renderButtons();
</script>
</body>
</html>
