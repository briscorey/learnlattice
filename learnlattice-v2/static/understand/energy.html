<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Understand Energy Transfer. LearnLattice</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.5rem;background:linear-gradient(135deg,#f59e0b,#f59e0baa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sub{font-size:.85rem;color:#94a3b8;margin-bottom:20px;text-align:center;max-width:500px}.app{width:100%;max-width:600px}.display{text-align:center;padding:20px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:16px}.coin{font-size:3rem;margin-bottom:8px}.counts{display:flex;justify-content:center;gap:24px;font-family:'Courier New',monospace;font-size:1rem;color:#94a3b8}.pct{font-family:'Courier New',monospace;font-size:1.2rem;color:#f59e0b;font-weight:700;margin-top:8px}.bar-wrap{height:24px;background:#1e293b;border-radius:12px;overflow:hidden;margin-bottom:16px;border:1px solid #334155}.bar{height:100%;background:#f59e0b;border-radius:12px;transition:width .3s}.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btns button{padding:8px 18px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:.85rem;font-family:inherit;transition:all .15s}.btns button:hover{border-color:#f59e0b;background:#0f172a}.info{margin-top:16px;padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:.85rem;color:#94a3b8;line-height:1.6;text-align:center}.info strong{color:#f59e0b}.hl{color:#f59e0b;font-weight:700}.neg{color:#ef4444;font-weight:700}.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;justify-content:center}.slider-row label{font-size:.85rem;color:#94a3b8}.slider-row input{width:200px;accent-color:#f59e0b}.slider-row span{font-family:'Courier New',monospace;color:#f59e0b;font-weight:700;min-width:40px}.pos{text-align:center;font-family:'Courier New',monospace;font-size:1.3rem;color:#e2e8f0;margin-bottom:16px}.line{display:flex;gap:2px;justify-content:center;margin-bottom:16px;overflow-x:auto;padding:8px 0}.tick{min-width:28px;height:40px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#64748b;border-radius:6px;background:#1e293b;border:1px solid transparent}.tick.current{background:#f59e0b;color:#fff;font-weight:700;border-color:#f59e0b}.tick.zero{border-color:#475569}.web{position:relative;height:300px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:12px}.sp{position:absolute;padding:6px 10px;background:#1e293b;border:1px solid #334155;border-radius:8px;font-size:.75rem;cursor:pointer;transition:all .2s;transform:translate(-50%,-50%);white-space:nowrap;user-select:none}.sp:hover{border-color:#059669;background:#0f172a}.sp.affected{border-color:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.3)}.history{font-size:.78rem;color:#64748b;text-align:center}</style></head><body>
<h1>Where Does the Energy Go?</h1>
<p class="sub">Every energy transfer wastes some energy as heat. Drag the slider to see how efficiency changes the flow.</p>
<div class="app">
  <div class="slider-row"><label>Efficiency:</label><input type="range" id="eff" min="5" max="95" value="60" oninput="draw()"><span id="effVal">60%</span></div>
  <canvas id="canvas" width="500" height="250" style="width:100%;border-radius:10px;background:#0f172a"></canvas>
  <div class="info" id="info">At <strong>60%</strong> efficiency, 60% of the input energy becomes useful output. The other 40% is wasted as heat.</div>
</div>
<script>
var c=document.getElementById('canvas'),ctx=c.getContext('2d');
function draw(){var e=+document.getElementById('eff').value;document.getElementById('effVal').textContent=e+'%';
ctx.clearRect(0,0,500,250);
// Input arrow
ctx.fillStyle='#f59e0b';ctx.fillRect(20,80,100,90);
ctx.fillStyle='#e2e8f0';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('100 J',70,130);ctx.fillText('INPUT',70,148);
// Useful output
var uh=90*(e/100);
ctx.fillStyle='#22c55e';ctx.fillRect(200,80,200,uh);
ctx.fillStyle='#fff';ctx.fillText(e+'J USEFUL',300,80+uh/2+5);
// Waste
var wh=90-uh;
ctx.fillStyle='#ef4444';ctx.fillRect(200,80+uh,200,wh);
if(wh>15){ctx.fillStyle='#fff';ctx.fillText((100-e)+'J WASTE (heat)',300,80+uh+wh/2+5)}
// Arrows
ctx.fillStyle='#64748b';ctx.beginPath();ctx.moveTo(130,125);ctx.lineTo(190,125);ctx.lineTo(190,115);ctx.lineTo(200,125);ctx.lineTo(190,135);ctx.lineTo(190,125);ctx.fill();
// Label
ctx.fillStyle='#94a3b8';ctx.font='11px sans-serif';ctx.fillText('Efficiency = useful output ÷ total input × 100',250,240);
var info=document.getElementById('info');
if(e>80)info.innerHTML='At <strong>'+e+'%</strong> efficiency, almost all energy is useful. LEDs and electric motors achieve this.';
else if(e>40)info.innerHTML='At <strong>'+e+'%</strong> efficiency, '+(100-e)+'% is wasted as heat. A car engine is about 25-30% efficient.';
else info.innerHTML='At <strong>'+e+'%</strong> efficiency, most energy is wasted! An incandescent light bulb is only about 5% efficient at producing light.';}
draw();
</script></body></html>
