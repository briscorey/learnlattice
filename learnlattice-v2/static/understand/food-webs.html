<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Understand Food Webs. LearnLattice</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.5rem;background:linear-gradient(135deg,#059669,#059669aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sub{font-size:.85rem;color:#94a3b8;margin-bottom:20px;text-align:center;max-width:500px}.app{width:100%;max-width:600px}.display{text-align:center;padding:20px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:16px}.coin{font-size:3rem;margin-bottom:8px}.counts{display:flex;justify-content:center;gap:24px;font-family:'Courier New',monospace;font-size:1rem;color:#94a3b8}.pct{font-family:'Courier New',monospace;font-size:1.2rem;color:#059669;font-weight:700;margin-top:8px}.bar-wrap{height:24px;background:#1e293b;border-radius:12px;overflow:hidden;margin-bottom:16px;border:1px solid #334155}.bar{height:100%;background:#059669;border-radius:12px;transition:width .3s}.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btns button{padding:8px 18px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:.85rem;font-family:inherit;transition:all .15s}.btns button:hover{border-color:#059669;background:#0f172a}.info{margin-top:16px;padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:.85rem;color:#94a3b8;line-height:1.6;text-align:center}.info strong{color:#059669}.hl{color:#059669;font-weight:700}.neg{color:#ef4444;font-weight:700}.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;justify-content:center}.slider-row label{font-size:.85rem;color:#94a3b8}.slider-row input{width:200px;accent-color:#059669}.slider-row span{font-family:'Courier New',monospace;color:#059669;font-weight:700;min-width:40px}.pos{text-align:center;font-family:'Courier New',monospace;font-size:1.3rem;color:#e2e8f0;margin-bottom:16px}.line{display:flex;gap:2px;justify-content:center;margin-bottom:16px;overflow-x:auto;padding:8px 0}.tick{min-width:28px;height:40px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#64748b;border-radius:6px;background:#1e293b;border:1px solid transparent}.tick.current{background:#059669;color:#fff;font-weight:700;border-color:#059669}.tick.zero{border-color:#475569}.web{position:relative;height:300px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:12px}.sp{position:absolute;padding:6px 10px;background:#1e293b;border:1px solid #334155;border-radius:8px;font-size:.75rem;cursor:pointer;transition:all .2s;transform:translate(-50%,-50%);white-space:nowrap;user-select:none}.sp:hover{border-color:#059669;background:#0f172a}.sp.affected{border-color:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.3)}.history{font-size:.78rem;color:#64748b;text-align:center}</style></head><body>
<h1>What Happens When a Species Disappears?</h1>
<p class="sub">Click an organism to remove it. See which other species are affected.</p>
<div class="app">
  <div class="web" id="web"></div>
  <div class="info" id="info">Click any organism to remove it from the food web. <strong>Red outlines</strong> show species that lose a food source.</div>
  <button onclick="resetWeb()" style="margin-top:12px;padding:8px 20px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-family:inherit">Reset</button>
</div>
<script>
var species=[
{id:'sun',name:'☀️ Sun',type:'energy',x:50,y:10},
{id:'grass',name:'🌱 Grass',type:'producer',x:20,y:30,needs:['sun']},
{id:'tree',name:'🌳 Tree',type:'producer',x:50,y:30,needs:['sun']},
{id:'algae',name:'🟢 Algae',type:'producer',x:80,y:30,needs:['sun']},
{id:'rabbit',name:'🐰 Rabbit',type:'consumer',x:15,y:55,needs:['grass']},
{id:'caterpillar',name:'🐛 Caterpillar',type:'consumer',x:40,y:55,needs:['tree']},
{id:'fish',name:'🐟 Fish',type:'consumer',x:70,y:55,needs:['algae']},
{id:'bird',name:'🐦 Bird',type:'consumer',x:55,y:55,needs:['caterpillar','grass']},
{id:'fox',name:'🦊 Fox',type:'predator',x:25,y:80,needs:['rabbit','bird']},
{id:'hawk',name:'🦅 Hawk',type:'predator',x:60,y:80,needs:['bird','fish','rabbit']},
];
var removed=[];
function renderWeb(){
var web=document.getElementById('web');
web.innerHTML='';
species.forEach(function(s){
  if(removed.includes(s.id))return;
  var el=document.createElement('div');
  el.className='sp';
  el.style.left=s.x+'%';el.style.top=s.y+'%';
  var affected=s.needs&&s.needs.some(function(n){return removed.includes(n)});
  if(affected)el.classList.add('affected');
  el.innerHTML=s.name;
  el.onclick=function(){if(s.id!=='sun'){removed.push(s.id);renderWeb();updateInfo(s.name)}};
  web.appendChild(el);
});
}
function updateInfo(name){
var affected=species.filter(function(s){return!removed.includes(s.id)&&s.needs&&s.needs.some(function(n){return removed.includes(n)})});
var info=document.getElementById('info');
if(affected.length===0)info.innerHTML='<strong>'+name+'</strong> removed. No other species immediately affected.';
else info.innerHTML='<strong>'+name+'</strong> removed. <strong style="color:#ef4444">'+affected.length+' species affected:</strong> '+affected.map(function(s){return s.name}).join(', ')+'. These species lost a food source.';
}
function resetWeb(){removed=[];renderWeb();document.getElementById('info').innerHTML='Click any organism to remove it from the food web.';}
renderWeb();
</script></body></html>
