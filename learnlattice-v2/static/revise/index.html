<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision Mode. LearnLattice</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f1a;--s:#151929;--s2:#1c2036;--bd:#2a2e45;--ink:#e2e8f0;--ink2:#94a3b8;--teal:#0D9488;--grn:#22c55e;--red:#ef4444;--amb:#f59e0b;--pur:#a78bfa;--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}
.pick{max-width:600px;margin:0 auto;padding:32px 16px;text-align:center}
.pick h1{font-family:'DM Serif Display',serif;font-size:1.8rem;margin-bottom:4px}
.pick .sub{color:var(--ink2);font-size:.85rem;margin-bottom:28px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.tb{padding:14px;border-radius:var(--r);border:1px solid var(--bd);background:var(--s);color:var(--ink);font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:10px}
.tb:hover{border-color:var(--teal);background:var(--s2);transform:translateY(-2px)}
.tb.sel{border-color:var(--teal);background:rgba(13,148,136,.12)}
.tb .ti{font-size:1.3rem}.tb .tc{font-size:.65rem;color:var(--ink2);display:block;font-weight:400}
.sets{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.sb{padding:7px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--s);color:var(--ink2);font-family:inherit;font-size:.78rem;cursor:pointer;transition:all .15s}
.sb.on{border-color:var(--teal);color:var(--teal);background:rgba(13,148,136,.08)}
.go{padding:14px 40px;border-radius:var(--r);border:none;background:var(--teal);color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
.go:hover{background:#0a7c72;transform:translateY(-2px);box-shadow:0 8px 24px rgba(13,148,136,.3)}
.go:disabled{opacity:.4;cursor:not-allowed;transform:none}
.sess{max-width:480px;margin:0 auto;padding:16px;display:none}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.prog{flex:1;height:5px;border-radius:3px;background:var(--s2);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--teal);transition:width .4s}
.cnt{font-size:.75rem;color:var(--ink2);white-space:nowrap}
.pts{font-size:.75rem;color:var(--grn);font-weight:700;white-space:nowrap}
.card{background:var(--s);border:1px solid var(--bd);border-radius:20px;padding:28px 24px;min-height:300px;display:flex;flex-direction:column;animation:cin .3s ease}
@keyframes cin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.ct{font-size:.58rem;text-transform:uppercase;letter-spacing:2px;font-weight:700;padding:3px 9px;border-radius:5px;display:inline-block;margin-bottom:14px;width:fit-content}
.ct-v{background:rgba(13,148,136,.12);color:var(--teal)}.ct-q{background:rgba(37,99,235,.12);color:#60a5fa}
.ct-m{background:rgba(245,158,11,.12);color:var(--amb)}.ct-f{background:rgba(167,139,250,.12);color:var(--pur)}
.cp{font-family:'DM Serif Display',serif;font-size:1.4rem;line-height:1.3;margin-bottom:16px;flex:1}
.cs{font-size:.82rem;color:var(--ink2);margin-bottom:14px;line-height:1.5}
.ans{display:grid;gap:7px}
.ab{padding:12px 16px;border-radius:11px;border:1px solid var(--bd);background:var(--s2);color:var(--ink);font-family:inherit;font-size:.85rem;cursor:pointer;transition:all .15s;text-align:left}
.ab:hover{border-color:var(--teal);background:rgba(13,148,136,.06)}
.ab.ok{border-color:var(--grn);background:rgba(34,197,94,.1);color:var(--grn)}
.ab.no{border-color:var(--red);background:rgba(239,68,68,.08);color:var(--red)}
.ab:disabled{cursor:default}
.rb{padding:12px;border-radius:11px;border:1px dashed var(--bd);background:transparent;color:var(--ink2);font-family:inherit;font-size:.85rem;cursor:pointer;transition:all .2s;width:100%}
.rb:hover{border-color:var(--teal);color:var(--teal)}
.rev{padding:16px;border-radius:11px;background:rgba(13,148,136,.06);border:1px solid rgba(13,148,136,.15);animation:rin .3s ease}
@keyframes rin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rev h4{font-size:.85rem;color:var(--teal);margin-bottom:5px}
.rev p{font-size:.85rem;color:var(--ink);line-height:1.5}
.rr{display:flex;gap:7px;margin-top:14px}
.rt{flex:1;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--s2);color:var(--ink2);font-family:inherit;font-size:.75rem;cursor:pointer;transition:all .15s;text-align:center}
.rt:hover{border-color:var(--teal)}
.rt-h{border-color:var(--red);color:var(--red)}.rt-o{border-color:var(--amb);color:var(--amb)}.rt-e{border-color:var(--grn);color:var(--grn)}
.res{max-width:480px;margin:0 auto;padding:32px 16px;text-align:center;display:none}
.res h2{font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:6px}
.bs{font-size:3rem;font-weight:700;color:var(--teal);margin-bottom:6px}
.ss{color:var(--ink2);font-size:.85rem;margin-bottom:20px}
.sr{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.sx{padding:12px 18px;border-radius:var(--r);background:var(--s);border:1px solid var(--bd);min-width:80px}
.sx .sv{font-size:1.3rem;font-weight:700;display:block}.sx .sl{font-size:.6rem;color:var(--ink2);text-transform:uppercase;letter-spacing:1px}
.sx-g .sv{color:var(--grn)}.sx-a .sv{color:var(--amb)}.sx-r .sv{color:var(--red)}
.wl{text-align:left;margin:14px 0;padding:14px;border-radius:var(--r);background:var(--s);border:1px solid var(--bd)}
.wl h4{font-size:.72rem;color:var(--amb);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.wi{padding:5px 0;font-size:.82rem;color:var(--ink);border-bottom:1px solid var(--bd)}.wi:last-child{border:none}
.rst{padding:12px 36px;border-radius:var(--r);border:1px solid var(--teal);background:rgba(13,148,136,.08);color:var(--teal);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
.rst:hover{background:var(--teal);color:#fff}
.bk{display:inline-block;margin-bottom:12px;color:var(--ink2);text-decoration:none;font-size:.8rem}.bk:hover{color:var(--teal)}
@media(max-width:480px){.tg{grid-template-columns:1fr}.card{padding:20px 16px;min-height:260px}.cp{font-size:1.2rem}.sr{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="pick" id="P">
  <a href="/students/" class="bk">← Back to Students</a>
  <h1>Revision Mode</h1>
  <p class="sub">Pick a topic. Get a focused study session. No guessing what to revise.</p>
  <div class="tg" id="TG"></div>
  <div class="sets">
    <button class="sb on" onclick="SL(10,this)">10 cards</button>
    <button class="sb" onclick="SL(20,this)">20 cards</button>
    <button class="sb" onclick="SL(30,this)">30 cards</button>
  </div>
  <button class="go" id="GO" onclick="start()" disabled>Choose a topic</button>
</div>
<div class="sess" id="S">
  <div class="bar"><div class="prog"><div class="fill" id="F"></div></div><div class="cnt" id="C">1/10</div><div class="pts" id="PT">0</div></div>
  <div id="A"></div>
</div>
<div class="res" id="R">
  <h2>Session Complete</h2>
  <div class="bs" id="FS">0%</div>
  <div class="ss" id="FM"></div>
  <div class="sr">
    <div class="sx sx-g"><span class="sv" id="SC">0</span><span class="sl">Correct</span></div>
    <div class="sx sx-a"><span class="sv" id="SP">0</span><span class="sl">Partial</span></div>
    <div class="sx sx-r"><span class="sv" id="SW">0</span><span class="sl">Missed</span></div>
  </div>
  <div class="wl" id="WL" style="display:none"><h4>Review these</h4><div id="WI"></div></div>
  <button class="rst" onclick="re()">Revise Again</button>
</div>

function up(){document.getElementById('F').style.width=(ci/cards.length*100)+'%';document.getElementById('C').textContent=(ci+1)+'/'+cards.length;document.getElementById('PT').textContent=sc+' pts'}
function rc(){if(ci>=cards.length){sr();return}up();var c=cards[ci],a=document.getElementById('A');if(c.y==='v')rv(a,c.d);else if(c.y==='q')rq(a,c.d);else if(c.y==='m')rm(a,c.d);else rf(a,c.d)}
function rv(a,v){a.innerHTML='<div class="card"><span class="ct ct-v">Vocabulary</span><div class="cp">What does <em>'+v.t+'</em> mean?</div><button class="rb" onclick="this.style.display=\'none\';document.getElementById(\'VA\').style.display=\'block\';document.getElementById(\'VR\').style.display=\'flex\'">Tap to reveal</button><div class="rev" style="display:none" id="VA"><h4>'+v.t+'</h4><p>'+v.d+'</p>'+(v.x?'<p style="margin-top:6px;color:var(--ink2);font-style:italic">'+v.x+'</p>':'')+'</div><div class="rr" style="display:none" id="VR"><button class="rt rt-h" onclick="rate(0)">Didn\'t know</button><button class="rt rt-o" onclick="rate(1)">Kind of</button><button class="rt rt-e" onclick="rate(2)">Knew it</button></div></div>'}
function rq(a,q){var ans=sh([q.c].concat(q.w.slice(0,3)));var h=ans.map(function(x){return'<button class="ab" onclick="cq(this,\''+x.replace(/'/g,"\\'")+'\',\''+q.c.replace(/'/g,"\\'")+'\')">'+x+'</button>'}).join('');a.innerHTML='<div class="card"><span class="ct ct-q">Quick Check</span><div class="cp">'+q.q+'</div><div class="ans">'+h+'</div></div>'}
window.cq=function(b,ans,cor){document.querySelectorAll('.ab').forEach(function(x){x.disabled=true;if(x.textContent===cor)x.classList.add('ok')});if(ans===cor){b.classList.add('ok');sc+=10;rd.c++}else{b.classList.add('no');rd.w++;rd.wk.push(cards[ci].d.q)}setTimeout(nc,900)};
function rm(a,m){a.innerHTML='<div class="card"><span class="ct ct-m">Myth Buster</span><div class="cp" style="font-style:italic">"'+m.m+'"</div><div class="cs">Is this TRUE or FALSE?</div><div class="ans" style="grid-template-columns:1fr 1fr"><button class="ab" onclick="cm(this,true)" style="text-align:center;font-weight:700">TRUE</button><button class="ab" onclick="cm(this,false)" style="text-align:center;font-weight:700">FALSE</button></div><div class="rev" style="display:none;margin-top:10px" id="MR"><h4>It\'s a myth!</h4><p>'+m.t+'</p></div></div>'}
window.cm=function(b,ans){document.querySelectorAll('.ab').forEach(function(x){x.disabled=true});if(!ans){b.classList.add('ok');sc+=10;rd.c++}else{b.classList.add('no');document.querySelectorAll('.ab').forEach(function(x){if(x.textContent==='FALSE')x.classList.add('ok')});rd.w++;rd.wk.push(cards[ci].d.m)}document.getElementById('MR').style.display='block';setTimeout(nc,1500)};
function rf(a,f){a.innerHTML='<div class="card"><span class="ct ct-f">Formula Flash</span><div class="cp" style="font-family:\'DM Sans\',sans-serif;font-size:1.6rem;text-align:center;letter-spacing:1px">'+f.f+'</div><div class="cs" style="text-align:center">What does this calculate?</div><button class="rb" onclick="this.style.display=\'none\';document.getElementById(\'FA\').style.display=\'block\';document.getElementById(\'FR\').style.display=\'flex\'">Tap to reveal</button><div class="rev" style="display:none" id="FA"><h4>'+f.n+'</h4><p>'+f.p+'</p></div><div class="rr" style="display:none" id="FR"><button class="rt rt-h" onclick="rate(0)">Didn\'t know</button><button class="rt rt-o" onclick="rate(1)">Kind of</button><button class="rt rt-e" onclick="rate(2)">Knew it</button></div></div>'}
window.rate=function(l){if(l===0){rd.w++;rd.wk.push(cards[ci].d.t||cards[ci].d.f||'?')}else if(l===1){sc+=5;rd.p++}else{sc+=10;rd.c++}nc()};
function nc(){ci++;up();if(ci>=cards.length){sr();return}rc()}
function sr(){document.getElementById('S').style.display='none';document.getElementById('R').style.display='block';var tot=rd.c+rd.p+rd.w;var pct=tot>0?Math.round((rd.c+rd.p*.5)/tot*100):0;document.getElementById('FS').textContent=pct+'%';document.getElementById('SC').textContent=rd.c;document.getElementById('SP').textContent=rd.p;document.getElementById('SW').textContent=rd.w;document.getElementById('FM').textContent=pct>=80?'Excellent. you know this well!':pct>=60?'Good progress. review the items below.':'Keep practising. focus on what you missed.';if(rd.wk.length>0){document.getElementById('WL').style.display='block';document.getElementById('WI').innerHTML=rd.wk.map(function(w){return'<div class="wi">'+w+'</div>'}).join('')}else{document.getElementById('WL').style.display='none'}}
window.re=function(){document.getElementById('R').style.display='none';document.getElementById('P').style.display='block'};
rp();
})();
</script>
</body>
</html>
