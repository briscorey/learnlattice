<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecosystem Architect — LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,#064e3b,#022c22);color:#fff;font-family:Nunito,sans-serif;min-height:100vh}.hdr{padding:10px 20px;background:rgba(0,0,0,.2);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#6ee7b7;font-weight:800}.hdr-score{font-size:.82rem;color:#6ee7b7;font-weight:700}.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.15)}.prog-s{flex:1;text-align:center}.prog-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-bottom:4px}.prog-bar.done{background:#6ee7b7}.prog-bar.active{background:#fbbf24;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.prog-label{font-size:.55rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px}.prog-s.done .prog-label{color:#6ee7b7}.prog-s.active .prog-label{color:#fbbf24}.game{max-width:640px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#6ee7b7;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:800;margin-bottom:8px}.s-desc{font-size:.85rem;color:#a7f3d0;margin-bottom:20px}.btn{padding:12px 28px;border-radius:12px;border:2px solid rgba(110,231,183,.3);background:rgba(110,231,183,.1);color:#6ee7b7;font-family:Nunito,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(110,231,183,.2);border-color:#6ee7b7;transform:translateY(-2px)}.btn-go{background:#6ee7b7;color:#022c22;border-color:#6ee7b7}.btn-go:hover{background:#a7f3d0}.classify{animation:fadeIn .4s}.cl-prompt{text-align:center;margin-bottom:16px}.cl-organism{font-size:2.5rem;margin-bottom:4px}.cl-name{font-size:1.2rem;font-weight:800;margin-bottom:2px}.cl-clue{font-size:.78rem;color:#a7f3d0;font-style:italic;margin-bottom:16px}.cl-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cl-opt{padding:16px 8px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);text-align:center;cursor:pointer;transition:all .2s;font-family:Nunito,sans-serif;font-weight:700;font-size:.82rem;color:#d1fae5}.cl-opt:hover:not(.locked){border-color:rgba(110,231,183,.4);background:rgba(110,231,183,.08);transform:translateY(-2px)}.cl-opt.correct{border-color:#22c55e;background:rgba(34,197,94,.15);color:#86efac}.cl-opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.1);color:#fca5a5}.cl-opt.locked{cursor:default;opacity:.5}.cl-opt.locked.correct{opacity:1}.cl-opt-icon{font-size:1.3rem;display:block;margin-bottom:4px}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}.fb-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-no{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}.chain{animation:fadeIn .4s}.chain-prompt{text-align:center;font-size:.88rem;color:#a7f3d0;margin-bottom:16px}.chain-slots{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;flex-wrap:wrap}.chain-slot{width:80px;height:80px;border:2px dashed rgba(255,255,255,.15);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;color:rgba(255,255,255,.3);transition:all .2s}.chain-slot.filled{border-style:solid;border-color:#6ee7b7;background:rgba(110,231,183,.08)}.chain-slot .cs-icon{font-size:1.5rem}.chain-slot .cs-name{font-size:.62rem;font-weight:700;color:#d1fae5;margin-top:2px}.chain-arrow{font-size:1.2rem;color:rgba(110,231,183,.3)}.chain-bank{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}.chain-item{padding:10px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);cursor:pointer;transition:all .2s;text-align:center;min-width:72px}.chain-item:hover:not(.used){border-color:#6ee7b7;background:rgba(110,231,183,.08);transform:translateY(-2px)}.chain-item.used{opacity:.3;cursor:default}.chain-item .ci-icon{font-size:1.3rem;display:block}.chain-item .ci-name{font-size:.65rem;font-weight:700;color:#d1fae5;margin-top:2px}.predict{animation:fadeIn .4s}.web-display{padding:20px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);border-radius:14px;margin-bottom:16px}.web-chain{display:flex;align-items:center;gap:4px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}.web-org{padding:6px 12px;border-radius:8px;background:rgba(110,231,183,.08);border:1px solid rgba(110,231,183,.2);font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:4px}.web-org.removed{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);text-decoration:line-through;color:#fca5a5}.web-arr{color:rgba(110,231,183,.3);font-size:.85rem}.predict-q{text-align:center;font-size:.92rem;font-weight:700;color:#fde68a;margin-bottom:16px}.p-opts{display:flex;flex-direction:column;gap:8px}.p-opt{padding:14px 18px;border-radius:10px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);cursor:pointer;font-size:.85rem;color:#d1fae5;transition:all .2s;font-family:Nunito,sans-serif;text-align:left;line-height:1.4}.p-opt:hover:not(.locked){border-color:rgba(110,231,183,.3);background:rgba(110,231,183,.05)}.p-opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.p-opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.p-opt.locked{cursor:default;opacity:.5}.p-opt.locked.correct{opacity:1}.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-size:3rem;font-weight:800;color:#6ee7b7}.r-label{font-size:1.1rem;font-weight:800;margin:6px 0}.r-detail{font-size:.85rem;color:#a7f3d0;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}.stage-done{text-align:center;padding:28px 16px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}</style><style id="embed-check">.embed-mode .hdr{display:none!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>🌿 Ecosystem Architect</h1><span class="hdr-score" id="score">0 pts</span></div><div class="progress" id="prog"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,correct=0,total=0,stageCorrect=0;const STAGES=[{name:"Classify",desc:"Sort organisms into their roles",qs:6},{name:"Food Chains",desc:"Put organisms in the right order",qs:4},{name:"Connections",desc:"Identify who eats who",qs:5},{name:"Predict",desc:"What happens when a species disappears?",qs:5}];function randInt(e,s){return e+Math.floor(Math.random()*(s-e+1))}function shuffle(e){for(let s=e.length-1;s>0;s--){const o=Math.floor(Math.random()*(s+1));[e[s],e[o]]=[e[o],e[s]]}return e}const ORGS=[{name:"Grass",icon:"🌿",role:"producer",clue:"Makes food from sunlight"},{name:"Oak tree",icon:"🌳",role:"producer",clue:"Photosynthesises in a forest"},{name:"Algae",icon:"🦠",role:"producer",clue:"Tiny organisms in water that photosynthesise"},{name:"Phytoplankton",icon:"🟢",role:"producer",clue:"Microscopic ocean producers"},{name:"Rabbit",icon:"🐰",role:"primary",clue:"Eats plants in meadows"},{name:"Caterpillar",icon:"🐛",role:"primary",clue:"Feeds on leaves"},{name:"Zooplankton",icon:"🔵",role:"primary",clue:"Tiny animals that eat algae"},{name:"Grasshopper",icon:"🦗",role:"primary",clue:"Eats grass and crops"},{name:"Mouse",icon:"🐭",role:"primary",clue:"Eats seeds and grain"},{name:"Fox",icon:"🦊",role:"secondary",clue:"Hunts rabbits and mice"},{name:"Frog",icon:"🐸",role:"secondary",clue:"Eats insects"},{name:"Small fish",icon:"🐟",role:"secondary",clue:"Eats zooplankton"},{name:"Snake",icon:"🐍",role:"secondary",clue:"Eats frogs and mice"},{name:"Eagle",icon:"🦅",role:"tertiary",clue:"Top predator — hunts snakes and foxes"},{name:"Shark",icon:"🦈",role:"tertiary",clue:"Apex predator of the ocean"},{name:"Hawk",icon:"🦅",role:"tertiary",clue:"Hunts snakes, mice, and small birds"},{name:"Mushroom",icon:"🍄",role:"decomposer",clue:"Breaks down dead organisms"},{name:"Bacteria",icon:"🦠",role:"decomposer",clue:"Recycles nutrients from dead matter"},{name:"Earthworm",icon:"🪱",role:"decomposer",clue:"Breaks down dead leaves in soil"}],ROLE_LABELS={producer:"🌱 Producer",primary:"🐰 Primary Consumer",secondary:"🦊 Secondary Consumer",tertiary:"🦅 Top Predator",decomposer:"🍄 Decomposer"};function genClassify(){return shuffle([...ORGS]).slice(0,STAGES[0].qs).map(e=>{const s="primary"===e.role||"secondary"===e.role||"tertiary"===e.role?"consumer":e.role;return{org:e,correct:s,hint:"producer"===s?`${e.name} makes its own food using sunlight (photosynthesis).`:"consumer"===s?`${e.name} must eat other organisms for energy.`:`${e.name} breaks down dead matter and returns nutrients to the soil.`,why:"producer"===s?`Producers make their own food through photosynthesis. ${e.name} is a producer.`:"consumer"===s?`Consumers eat other organisms. ${e.name} is a ${e.role} consumer.`:`Decomposers break down dead organisms. ${e.name} recycles nutrients.`}})}function genChains(){return shuffle([[{icon:"🌿",name:"Grass"},{icon:"🐰",name:"Rabbit"},{icon:"🦊",name:"Fox"},{icon:"🦅",name:"Eagle"}],[{icon:"🌳",name:"Oak tree"},{icon:"🐛",name:"Caterpillar"},{icon:"🐸",name:"Frog"},{icon:"🐍",name:"Snake"}],[{icon:"🟢",name:"Phytoplankton"},{icon:"🔵",name:"Zooplankton"},{icon:"🐟",name:"Small fish"},{icon:"🦈",name:"Shark"}],[{icon:"🌿",name:"Grass"},{icon:"🦗",name:"Grasshopper"},{icon:"🐸",name:"Frog"},{icon:"🦅",name:"Hawk"}],[{icon:"🌿",name:"Grass"},{icon:"🐭",name:"Mouse"},{icon:"🐍",name:"Snake"},{icon:"🦅",name:"Eagle"}],[{icon:"🌳",name:"Oak tree"},{icon:"🐭",name:"Mouse"},{icon:"🦊",name:"Fox"},{icon:"🦅",name:"Eagle"}]]).slice(0,STAGES[1].qs)}function genConnections(){return shuffle([{prey:{icon:"🌿",name:"Grass"},pred:{icon:"🐰",name:"Rabbit"},q:"Which organism eats grass?",opts:["Rabbit","Fox","Eagle","Mushroom"],correct:0},{prey:{icon:"🐰",name:"Rabbit"},pred:{icon:"🦊",name:"Fox"},q:"What is the rabbit's predator?",opts:["Fox","Grass","Caterpillar","Bacteria"],correct:0},{prey:{icon:"🐛",name:"Caterpillar"},pred:{icon:"🐸",name:"Frog"},q:"What eats caterpillars?",opts:["Frog","Rabbit","Grass","Shark"],correct:0},{prey:{icon:"🐸",name:"Frog"},pred:{icon:"🐍",name:"Snake"},q:"Frogs are eaten by...",opts:["Snakes","Grass","Algae","Earthworms"],correct:0},{prey:{icon:"🐭",name:"Mouse"},pred:{icon:"🦅",name:"Hawk"},q:"Which predator hunts mice?",opts:["Hawk","Zooplankton","Mushroom","Caterpillar"],correct:0},{prey:{icon:"🦈",name:"Shark"},pred:null,q:"The shark is an apex predator. This means...",opts:["No organism hunts it","It only eats plants","It lives forever","It is the fastest"],correct:0},{prey:{icon:"🍄",name:"Mushroom"},pred:null,q:"Decomposers are important because they...",opts:["Recycle nutrients back to the soil","Eat all the predators","Make food from sunlight","Hunt small animals"],correct:0}]).slice(0,STAGES[2].qs).map(e=>({...e,hint:`Think about the food chain: energy flows from producers → primary consumers → secondary consumers → top predators. ${e.prey.name} is eaten by organisms above it in the chain.`,why:`In this ecosystem, ${e.opts[e.correct].toLowerCase()} is the correct answer. Energy flows up the food chain from producers to consumers.`}))}function genPredict(){return shuffle([{web:["Grass","Rabbit","Fox","Eagle"],removed:"Rabbit",q:"If all rabbits were removed, what would MOST LIKELY happen?",opts:["Fox population decreases (less food)","Eagle population increases","Grass disappears","Nothing changes"],correct:0,hint:"Foxes eat rabbits. If their food source disappears, what happens to the fox population?",why:"Without rabbits, foxes have less food, so their population would decrease. Meanwhile, grass would increase (no rabbits eating it). This shows how removing one species affects the whole ecosystem."},{web:["Phytoplankton","Zooplankton","Small fish","Shark"],removed:"Phytoplankton",q:"If phytoplankton disappeared from the ocean, what happens?",opts:["All populations above decline (no food base)","Sharks get bigger","Zooplankton switch to eating sharks","Small fish increase"],correct:0,hint:"Phytoplankton are the PRODUCERS — the base of the food chain. Without them...",why:"Phytoplankton are the base. Without producers, zooplankton starve, then fish, then sharks. Removing the producer collapses the entire food chain."},{web:["Grass","Grasshopper","Frog","Snake"],removed:"Snake",q:"If snakes were removed from this ecosystem, what happens to the frog population?",opts:["Frog population increases (less predation)","Frogs disappear","Grass grows taller","No change"],correct:0,hint:"Snakes eat frogs. If there are no snakes to eat them...",why:"Without snake predation, the frog population grows. But then frogs eat more grasshoppers, so grasshoppers decline, and grass might increase. Every change ripples through the system."},{web:["Oak tree","Caterpillar","Frog","Snake","Eagle"],removed:"Frog",q:"Frogs are removed. What happens to caterpillar AND snake populations?",opts:["Caterpillars increase, snakes decrease","Both increase","Both decrease","No change"],correct:0,hint:"Frogs eat caterpillars (so caterpillars...) and snakes eat frogs (so snakes...).",why:"Without frogs: caterpillars have fewer predators (increase), and snakes have less food (decrease). One removal causes opposite effects at different levels."},{web:["Grass","Mouse","Rabbit","Fox","Eagle"],removed:"Fox",q:"Foxes are removed. What happens to the grass?",opts:["Grass decreases (more rabbits eating it)","Grass increases","Grass is not affected","Eagles eat the grass instead"],correct:0,hint:"Foxes eat rabbits. Without foxes, rabbit population → ? → effect on grass.",why:"No foxes → more rabbits → rabbits eat more grass → grass decreases. This is called a trophic cascade — effects ripple DOWN the food chain."}]).slice(0,STAGES[3].qs)}let questions=[];const generators=[genClassify,genChains,genConnections,genPredict];function renderProg(){document.getElementById("prog").innerHTML=STAGES.map((e,s)=>`<div class="prog-s ${s<stage?"done":s===stage?"active":""}">\n    <div class="prog-bar ${s<stage?"done":s===stage?"active":""}"></div>\n    <span class="prog-label">${e.name}</span></div>`).join("")}function showIntro(){stageCorrect=0,questions=generators[stage](),qIdx=0,document.getElementById("game").innerHTML=`<div class="intro">\n    <div class="s-num">Stage ${stage+1} of ${STAGES.length}</div>\n    <div class="s-name">${STAGES[stage].name}</div>\n    <div class="s-desc">${STAGES[stage].desc}</div>\n    <button class="btn btn-go" onclick="showQ()">Begin →</button></div>`,renderProg()}function showQ(){qIdx>=questions.length?showStageDone():0===stage?renderClassify():1===stage?renderChain():2===stage?renderConnection():renderPredict()}function renderClassify(){const e=questions[qIdx];document.getElementById("game").innerHTML=`<div class="classify">\n    <div class="cl-prompt">\n      <div class="cl-organism">${e.org.icon}</div>\n      <div class="cl-name">${e.org.name}</div>\n      <div class="cl-clue">${e.org.clue}</div>\n    </div>\n    <div class="cl-options">\n      <button class="cl-opt" onclick="checkClassify('producer',this)"><span class="cl-opt-icon">🌱</span>Producer</button>\n      <button class="cl-opt" onclick="checkClassify('consumer',this)"><span class="cl-opt-icon">🍽️</span>Consumer</button>\n      <button class="cl-opt" onclick="checkClassify('decomposer',this)"><span class="cl-opt-icon">🍄</span>Decomposer</button>\n    </div>\n    <div id="fb"></div><div class="next" id="nx"></div></div>`}function checkClassify(e,s){const o=questions[qIdx];total++,document.querySelectorAll(".cl-opt").forEach(e=>e.classList.add("locked")),e===o.correct?(s.classList.add("correct"),handleOk(o.why)):(s.classList.add("wrong"),document.querySelectorAll(".cl-opt").forEach(e=>{e.textContent.toLowerCase().includes(o.correct)&&e.classList.add("correct")}),handleNo(o.hint))}let chainOrder=[];function renderChain(){const e=questions[qIdx];chainOrder=[];const s=shuffle([...e]);document.getElementById("game").innerHTML=`<div class="chain">\n    <div class="chain-prompt">Build the food chain: place organisms from <strong>producer → top predator</strong></div>\n    <div class="chain-slots" id="slots">${e.map((s,o)=>`<div class="chain-slot" id="slot${o}">${0===o?"Start":"→"}</div>${o<e.length-1?'<span class="chain-arrow">→</span>':""}`).join("")}</div>\n    <div class="chain-bank" id="bank">${s.map((e,s)=>`<div class="chain-item" id="ci${s}" onclick="placeInChain(${s})" data-idx="${s}"><span class="ci-icon">${e.icon}</span><span class="ci-name">${e.name}</span></div>`).join("")}</div>\n    <div id="fb"></div><div class="next" id="nx"></div></div>`,window._scrambled=s,window._correct=e}function placeInChain(e){const s=document.getElementById("ci"+e);if(s.classList.contains("used"))return;const o=document.getElementById("slot"+chainOrder.length);if(!o)return;s.classList.add("used");const n=window._scrambled[e];if(o.classList.add("filled"),o.innerHTML=`<span class="cs-icon">${n.icon}</span><span class="cs-name">${n.name}</span>`,chainOrder.push(n.name),chainOrder.length===window._correct.length){total++;chainOrder.every((e,s)=>e===window._correct[s].name)?handleOk("Energy flows from producers (bottom) through consumers to top predators. You built it correctly!"):handleNo(`The correct order is: ${window._correct.map(e=>e.icon+" "+e.name).join(" → ")}. Remember: producers make food, then primary consumers eat them, then secondary, then top predators.`)}}function renderConnection(){const e=questions[qIdx];document.getElementById("game").innerHTML=`<div class="predict">\n    <div class="web-display"><div class="web-chain">${e.prey?`<span class="web-org">${e.prey.icon} ${e.prey.name}</span><span class="web-arr">→ ?</span>`:""}</div></div>\n    <div class="predict-q">${e.q}</div>\n    <div class="p-opts">${e.opts.map((e,s)=>`<button class="p-opt" onclick="checkOpt(${s})" id="po${s}">${e}</button>`).join("")}</div>\n    <div id="fb"></div><div class="next" id="nx"></div></div>`}function renderPredict(){const e=questions[qIdx];document.getElementById("game").innerHTML=`<div class="predict">\n    <div class="web-display">\n      <div class="web-chain">${e.web.map(s=>`<span class="web-org ${s===e.removed?"removed":""}">${"Grass"===s?"🌿":"Rabbit"===s?"🐰":"Fox"===s?"🦊":"Eagle"===s?"🦅":"Phytoplankton"===s?"🟢":"Zooplankton"===s?"🔵":"Small fish"===s?"🐟":"Shark"===s?"🦈":"Grasshopper"===s?"🦗":"Frog"===s?"🐸":"Snake"===s?"🐍":"Mouse"===s?"🐭":"Caterpillar"===s?"🐛":"Oak tree"===s?"🌳":"🌿"} ${s}</span>${s!==e.web[e.web.length-1]?'<span class="web-arr">→</span>':""}`).join("")}</div>\n      <div style="text-align:center;margin-top:8px;font-size:.75rem;color:#fca5a5">❌ ${e.removed} removed from the ecosystem</div>\n    </div>\n    <div class="predict-q">${e.q}</div>\n    <div class="p-opts">${e.opts.map((e,s)=>`<button class="p-opt" onclick="checkOpt(${s})" id="po${s}">${e}</button>`).join("")}</div>\n    <div id="fb"></div><div class="next" id="nx"></div></div>`}function checkOpt(e){const s=questions[qIdx];total++,document.querySelectorAll(".p-opt").forEach(e=>e.classList.add("locked")),e===s.correct?(document.getElementById("po"+e).classList.add("correct"),handleOk(s.why)):(document.getElementById("po"+e).classList.add("wrong"),document.getElementById("po"+s.correct).classList.add("correct"),handleNo(s.hint))}function handleOk(e){correct++,stageCorrect++,pts+=10,document.getElementById("score").textContent=pts+" pts",document.getElementById("fb").innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${e}</div>`,document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()" style="margin-top:8px">Next →</button>'}function handleNo(e){document.getElementById("fb").innerHTML=`<div class="fb fb-no"><strong>💡 Not quite:</strong>${e}</div>`,document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()" style="margin-top:8px">Next →</button>'}function showStageDone(){const e=Math.round(stageCorrect/questions.length*100),s=e>=80?"⭐⭐⭐":e>=60?"⭐⭐":"⭐";stage<STAGES.length-1?document.getElementById("game").innerHTML=`<div class="stage-done"><div class="sd-stars">${s}</div><div class="s-name">${STAGES[stage].name} Complete!</div><p style="color:#a7f3d0;margin:8px 0">${stageCorrect}/${questions.length} correct</p><button class="btn btn-go" onclick="stage++;showIntro()" style="margin-top:12px">Next Stage →</button></div>`:showResults()}function showResults(){const e=Math.round(correct/total*100);let s="🏆 Ecosystem Master!",o="You understand how energy flows through ecosystems and can predict what happens when they're disrupted.";e<50?(s="🌱 Growing!",o="Ecosystems are complex. Review producers, consumers, and decomposers, then try again."):e<75&&(s="🌿 Good progress!",o="You've got the basics. The prediction questions need more practice."),document.getElementById("game").innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${s}</div><div class="r-detail">${o}<br>Score: ${pts} points</div>\n  <div class="r-transfer">🌍 <strong>Think about this:</strong> In your city, what would happen if all the trees were removed? What about if stray cats disappeared? Every ecosystem — even urban ones — has food chains. One change ripples through the whole system.</div>\n  <div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`,renderProg()}showIntro()</script></body></html>
