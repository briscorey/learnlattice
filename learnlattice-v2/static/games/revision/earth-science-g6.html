<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Science Review — Grade 6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0c1222;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
.app{max-width:880px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
.hdr{text-align:center;padding:14px 0 6px}
.hdr h1{font-size:1.5rem;font-weight:700;color:#f8fafc;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .sub{font-size:.8rem;color:#94a3b8;margin-top:2px}
.badge{display:inline-block;background:rgba(245,158,11,.15);color:#fbbf24;font-size:.66rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-top:5px}
.earth-prog{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 16px}
.ep-dot{width:40px;height:40px;border-radius:50%;border:2px solid #334155;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#475569;transition:all .4s;position:relative}
.ep-dot.done{border-color:#22c55e;background:rgba(34,197,94,.15);color:#86efac}
.ep-dot.now{border-color:#f59e0b;background:rgba(245,158,11,.15);color:#fbbf24;animation:glow 1.5s infinite alternate;box-shadow:0 0 12px rgba(245,158,11,.3)}
@keyframes glow{from{box-shadow:0 0 8px rgba(245,158,11,.2)}to{box-shadow:0 0 16px rgba(245,158,11,.4)}}
.ep-line{width:24px;height:2px;background:#334155;transition:background .4s}.ep-line.done{background:#22c55e}
.ep-label{font-size:.5rem;position:absolute;bottom:-14px;white-space:nowrap;color:#64748b}
.ep-dot.now .ep-label{color:#fbbf24}.ep-dot.done .ep-label{color:#86efac}
.card{background:linear-gradient(145deg,#1a2235,#1e293b);border-radius:16px;padding:24px;flex:1;display:flex;flex-direction:column;border:1px solid #2a3548;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.s-num{font-size:.66rem;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:.08em}
.s-title{font-size:1.2rem;font-weight:700;margin:3px 0;color:#f1f5f9}
.s-int{font-size:.78rem;color:#94a3b8;font-style:italic;margin-bottom:14px}
.q-ct{font-size:.7rem;color:#64748b;margin-bottom:8px}
.q-txt{font-size:.93rem;color:#e2e8f0;margin-bottom:14px;line-height:1.55}
.q-txt strong{color:#fbbf24}
.sc-chip{position:fixed;top:12px;right:12px;background:linear-gradient(135deg,#1a2235,#1e293b);border:1px solid #2a3548;border-radius:10px;padding:8px 14px;font-size:.76rem;color:#94a3b8;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.sc-chip b{font-size:1rem;color:#fbbf24}
.svg-area{width:100%;display:flex;justify-content:center;margin:10px 0 14px}
.svg-area svg{max-width:100%;height:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.drag-zone{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;justify-content:center}
.drag-item{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0f05;padding:7px 14px;border-radius:8px;cursor:grab;font-size:.82rem;font-weight:600;user-select:none;transition:all .15s;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.drag-item:active{transform:scale(1.05);cursor:grabbing}
.drag-item.placed{opacity:.3;cursor:default;box-shadow:none}
.drop-target{min-width:100px;min-height:32px;border:2px dashed #475569;border-radius:8px;padding:4px 10px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;color:#64748b;transition:all .2s;cursor:pointer;margin:2px}
.drop-target.filled{border-style:solid;border-color:#f59e0b;color:#fbbf24;background:rgba(245,158,11,.08)}
.drop-target.correct{border-color:#22c55e;color:#86efac;background:rgba(34,197,94,.1)}
.drop-target.wrong{border-color:#ef4444;color:#fca5a5;background:rgba(239,68,68,.06)}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.opt{background:#0f172a;border:2px solid #2a3548;border-radius:10px;padding:12px 16px;font-size:.88rem;color:#e2e8f0;cursor:pointer;text-align:left;transition:all .15s;font-family:inherit}
.opt:hover:not(.dis){border-color:#f59e0b;background:rgba(245,158,11,.04)}
.opt.cor{border-color:#22c55e;background:rgba(34,197,94,.1);color:#86efac}
.opt.inc{border-color:#ef4444;background:rgba(239,68,68,.05);color:#fca5a5}
.opt.dis{cursor:default;opacity:.5}
.tf{display:flex;gap:10px;margin-bottom:12px}
.tf-btn{flex:1;background:#0f172a;border:2px solid #2a3548;border-radius:10px;padding:14px;font-size:.95rem;font-weight:600;color:#e2e8f0;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.tf-btn:hover:not(.dis){border-color:#f59e0b}
.tf-btn.cor{border-color:#22c55e;background:rgba(34,197,94,.1);color:#86efac}
.tf-btn.inc{border-color:#ef4444;background:rgba(239,68,68,.05);color:#fca5a5}
.tf-btn.dis{cursor:default;opacity:.5}
.ord-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ord-item{display:flex;align-items:center;gap:10px;background:#0f172a;border:2px solid #2a3548;border-radius:10px;padding:10px 14px;transition:all .15s}
.ord-n{width:26px;height:26px;border-radius:50%;background:#2a3548;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#94a3b8;flex-shrink:0}
.ord-txt{font-size:.84rem;color:#e2e8f0;flex:1}
.ord-arr{display:flex;flex-direction:column;gap:2px;margin-left:auto}
.arr-btn{background:none;border:1px solid #475569;color:#94a3b8;width:24px;height:20px;border-radius:4px;cursor:pointer;font-size:.65rem;display:flex;align-items:center;justify-content:center;font-family:inherit}
.arr-btn:hover:not(:disabled){border-color:#f59e0b;color:#f59e0b}
.arr-btn:disabled{opacity:.25;cursor:default}
.fill-s{font-size:.93rem;color:#e2e8f0;line-height:2.2;margin-bottom:12px}
.blank{display:inline-block;min-width:100px;border-bottom:2px dashed #f59e0b;padding:2px 8px;margin:0 3px;text-align:center;color:#fbbf24;font-weight:600;cursor:pointer;transition:all .2s;vertical-align:bottom;min-height:1.3em}
.blank.filled{border-bottom-style:solid}
.blank.cor-b{border-color:#22c55e;color:#86efac}
.blank.inc-b{border-color:#ef4444;color:#fca5a5}
.word-bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;justify-content:center}
.w-chip{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0f05;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:500;user-select:none;transition:all .12s;box-shadow:0 2px 6px rgba(245,158,11,.2)}
.w-chip:hover:not(.used){transform:scale(1.03)}
.w-chip.used{opacity:.3;cursor:default;box-shadow:none}
.m-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.m-btn{background:#0f172a;border:2px solid #2a3548;border-radius:10px;padding:12px 16px;font-size:.88rem;color:#e2e8f0;cursor:pointer;text-align:left;transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:10px}
.m-btn:hover:not(.dis){border-color:#f59e0b;background:rgba(245,158,11,.04)}
.m-btn.tog{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.m-btn.cor{border-color:#22c55e;background:rgba(34,197,94,.1);color:#86efac}
.m-btn.inc{border-color:#ef4444;background:rgba(239,68,68,.05);color:#fca5a5}
.m-btn.mis{border-color:#22c55e;border-style:dashed;background:rgba(34,197,94,.03)}
.m-btn.dis{cursor:default}
.cb{width:18px;height:18px;border:2px solid #475569;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;transition:all .15s}
.m-btn.tog .cb{border-color:#f59e0b;background:rgba(245,158,11,.3)}.m-btn.tog .cb::after{content:'\2713';color:#f59e0b}
.m-btn.cor .cb{border-color:#22c55e;background:rgba(34,197,94,.3)}.m-btn.cor .cb::after{content:'\2713';color:#22c55e}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.m-hdr{font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;padding-bottom:3px}
.m-item{background:#0f172a;border:2px solid #2a3548;border-radius:10px;padding:10px 12px;font-size:.82rem;color:#e2e8f0;cursor:pointer;transition:all .15s;text-align:center}
.m-item:hover:not(.matched){border-color:#f59e0b}
.m-item.sel{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.m-item.matched{border-color:#22c55e;background:rgba(34,197,94,.06);opacity:.65;cursor:default}
.m-item.wf{border-color:#ef4444;animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0;font-size:.84rem;line-height:1.5;display:none}
.fb.ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:#86efac;display:block}
.fb.no{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5;display:block}
.fb .why{margin-top:5px;font-size:.78rem;color:#94a3b8}.fb .why strong{color:#cbd5e1}
.btn-row{display:flex;gap:8px;margin-top:auto;padding-top:12px;justify-content:flex-end}
.btn{padding:10px 22px;border-radius:10px;font-size:.86rem;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-p{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0f05;box-shadow:0 4px 12px rgba(245,158,11,.25)}.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(245,158,11,.35)}
.btn-g{background:#22c55e;color:#fff}.btn-g:hover{background:#16a34a}
.btn-s{background:#334155;color:#e2e8f0}.btn-s:hover{background:#475569}
.intro{align-items:center;justify-content:center;text-align:center}
.intro h2{font-size:1.4rem;margin-bottom:8px;color:#f8fafc}
.intro p{color:#94a3b8;font-size:.88rem;margin-bottom:5px;line-height:1.5}
.i-topics{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.i-topic{background:rgba(245,158,11,.1);color:#fbbf24;padding:5px 12px;border-radius:16px;font-size:.76rem;font-weight:500}
.soi{background:rgba(245,158,11,.06);border-left:3px solid #f59e0b;padding:10px 14px;margin:12px 0;text-align:left;font-size:.8rem;color:#fbbf24;font-style:italic;line-height:1.5;border-radius:0 8px 8px 0}
.trans{text-align:center;padding:32px 16px}
.trans .em{font-size:2.6rem;margin-bottom:12px}
.trans h2{font-size:1.2rem;color:#f1f5f9;margin-bottom:6px}
.trans .tsc{font-size:1rem;color:#22c55e;font-weight:600;margin:10px 0}
.trans p{color:#94a3b8;font-size:.86rem}
.final{text-align:center;padding:32px 16px}
.final h2{font-size:1.4rem;color:#f8fafc;margin-bottom:6px}
.final .big{font-size:2.4rem;font-weight:800;color:#22c55e;margin:12px 0}
.final .grd{font-size:.92rem;color:#94a3b8;margin-bottom:18px}
.s-bd{display:flex;flex-direction:column;gap:6px;margin:14px auto;max-width:340px;text-align:left}
.s-r{display:flex;justify-content:space-between;padding:6px 12px;background:#0f172a;border-radius:6px;font-size:.8rem}
.s-r .n{color:#94a3b8}.s-r .s{color:#22c55e;font-weight:600}
.xfer{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:14px;margin-top:18px;text-align:left}
.xfer h3{color:#fbbf24;font-size:.8rem;margin-bottom:5px}
.xfer p{color:#e2e8f0;font-size:.84rem;line-height:1.5}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;animation:float 1s ease-out forwards}
@keyframes float{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(0)}}
@media(max-width:600px){.app{padding:10px}.card{padding:16px}.m-grid{grid-template-columns:1fr}.sc-chip{top:auto;bottom:10px;right:10px}.ep-dot{width:32px;height:32px;font-size:.6rem}.ep-label{font-size:.45rem}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="app" id="app"></div>
<script>
// STAGES DATA
var STAGES=[
{num:1,title:"Earth's Layers",icon:"\ud83c\udf0d",int:"I can identify and describe Earth's layers and their properties.",questions:[
{type:"label-drag",text:"Drag the labels to the correct positions on the <strong>Earth cross-section</strong>. Click a label, then click a <strong>?</strong> slot.",labels:["Crust","Mantle","Outer Core","Inner Core"],correct:[0,1,2,3],hint:"Outside in: Crust (thin), Mantle (thickest), Outer Core (liquid), Inner Core (solid).",why:"<strong>Crust</strong> = thin outer shell. <strong>Mantle</strong> = thickest layer, solid but flows slowly. <strong>Outer core</strong> = liquid iron/nickel, creates magnetic field. <strong>Inner core</strong> = solid despite extreme heat due to immense pressure."},
{type:"matching",text:"Match each <strong>layer</strong> to its <strong>state of matter</strong>.",left:["Crust","Mantle","Outer Core","Inner Core"],right:["Solid (extreme pressure)","Liquid metal","Solid rock","Solid (flows slowly)"],pairs:[[0,2],[1,3],[2,1],[3,0]],hint:"The outer core is the only liquid layer. The mantle flows slowly but is solid.",why:"<strong>Crust</strong> = solid rock. <strong>Mantle</strong> = solid, flows slowly. <strong>Outer core</strong> = liquid. <strong>Inner core</strong> = solid (pressure keeps it compressed)."},
{type:"mcq",text:"Which layer makes up about <strong>84%</strong> of Earth's volume?",options:["Crust","Mantle","Outer Core","Inner Core"],correct:1,hint:"~2,900 km thick.",why:"The <strong>mantle</strong> at ~2,900 km is the thickest layer."},
{type:"tf",text:"True or False: Oceanic crust is <strong>thicker</strong> than continental crust.",correct:false,hint:"Oceanic = thin but dense. Continental = thick but less dense.",why:"<strong>False.</strong> Oceanic crust is thinner (5\u201310 km) but denser. Continental is thicker (30\u201370 km) but less dense."},
{type:"mcq",text:"Why is the inner core solid despite being the hottest part?",options:["Cooled by outer core","Extreme pressure keeps it solid","Made of gas","Not actually hot"],correct:1,hint:"Squeeze something hard enough and it can't melt.",why:"<strong>Immense pressure</strong> from all layers above keeps the iron/nickel solid even at 5,000\u00b0C+."},
{type:"mcq",text:"The outer core creates something that protects us from solar radiation. What?",options:["Ozone layer","Earth's magnetic field","The atmosphere","Gravity"],correct:1,hint:"Swirling liquid iron generates a field...",why:"Swirling liquid outer core generates Earth's <strong>magnetic field</strong>, deflecting solar wind."},
{type:"fill",text:"Complete using the word bank.",sentence:"The mantle is |___| rock that flows very |___| over millions of years, driven by |___| from the core.",blanks:["solid","slowly","heat"],bank:["solid","liquid","slowly","quickly","heat","gravity"],hint:"The mantle is NOT liquid \u2014 solid rock, slow flow, driven by core heat.",why:"<strong>Solid</strong> rock flows <strong>slowly</strong> over geological time, driven by <strong>heat</strong> from the core."},
{type:"mcq",text:"Best analogy for the mantle?",options:["Water in a river","A block of ice","Thick honey being slowly heated","Air blowing"],correct:2,hint:"Solid but not rigid \u2014 moves incredibly slowly.",why:"Like <strong>thick honey</strong> being heated: technically solid but flows slowly over millions of years."}
]},
{num:2,title:"Convection Engine",icon:"\ud83d\udd25",int:"I can explain how convection currents drive plate movement.",questions:[
{type:"order",text:"Order the steps of a <strong>convection current</strong> in the mantle.",items:["Hot rock near the core rises slowly","Rock reaches the top and moves sideways","Rock cools down near the crust","Cooler, denser rock sinks back down","The cycle repeats continuously"],correct:[0,1,2,3,4],hint:"Heating at bottom \u2192 rises \u2192 cools \u2192 sinks \u2192 loop.",why:"<strong>Circular flow</strong>: hot rises, spreads (dragging plates), cools, sinks, repeats."},
{type:"mcq",text:"Main energy source for mantle convection?",options:["The Sun","Heat from Earth's core","Moon's gravity","Wind"],correct:1,hint:"Heat from below...",why:"<strong>Radioactive decay</strong> and residual heat keep the core hot, driving convection."},
{type:"mcq",text:"Why does hot rock rise?",options:["Pushed by earthquakes","Becomes less dense","Gravity pulls it up","Crust sucks it up"],correct:1,hint:"Like a hot air balloon...",why:"Heated rock <strong>expands, becomes less dense</strong>, and floats upward."},
{type:"tf",text:"True or False: Convection only happens in liquids.",correct:false,hint:"The mantle is solid yet convection happens...",why:"<strong>False.</strong> Solid-state convection occurs in the mantle."},
{type:"fill",text:"Complete using the word bank.",sentence:"Heated rock becomes less |___| and rises. Near the |___| it cools, becomes denser, and |___| .",blanks:["dense","crust","sinks"],bank:["dense","light","crust","core","sinks","rises"],hint:"Hot = less dense = rises. Cool = more dense = sinks.",why:"Less <strong>dense</strong> \u2192 rises to <strong>crust</strong> \u2192 cools \u2192 <strong>sinks</strong>."},
{type:"mcq",text:"How fast do plates move?",options:["A few cm/year","A few m/day","A few km/hour","They don't move"],correct:0,hint:"Fingernail growth speed...",why:"<strong>2\u201310 cm/year</strong>. Slow, but over millions of years = thousands of km."},
{type:"mcq",text:"Best everyday model for convection?",options:["Ball rolling downhill","Heating soup \u2014 warm rises, cool sinks","Mixing paint","Ice melting"],correct:1,hint:"Heating from below \u2192 circular movement.",why:"Stove = core, soup = mantle. Hot <strong>rises</strong>, spreads, <strong>cools</strong>, sinks."},
{type:"multi",text:"Select ALL correct statements.",options:["Move in circular loops","Driven by the Sun","Cause plate movement","Only in the outer core","Hot material rises (less dense)","Move several km/hour"],correct:[0,2,4],hint:"Three correct. Core heat, mantle, very slow.",why:"<strong>Loops</strong>, <strong>cause plate movement</strong>, <strong>hot = less dense = rises</strong>."}
]},
{num:3,title:"Plate Boundaries",icon:"\ud83d\uddfa\ufe0f",int:"I can classify boundary types, name major plates, and predict effects.",questions:[
{type:"matching",text:"Match each <strong>boundary type</strong> to its description.",left:["Divergent","Convergent","Transform"],right:["Plates slide past each other","Plates move apart","Plates push together"],pairs:[[0,1],[1,2],[2,0]],hint:"Diverge = separate. Converge = together. Transform = sideways.",why:"<strong>Divergent</strong> = apart. <strong>Convergent</strong> = collide. <strong>Transform</strong> = sideways."},
{type:"matching",text:"Match each <strong>example</strong> to its boundary type.",left:["Mid-Atlantic Ridge","Himalayas","San Andreas Fault","Mariana Trench"],right:["Transform","Convergent (ocean-ocean)","Divergent","Convergent (continent-continent)"],pairs:[[0,2],[1,3],[2,0],[3,1]],hint:"Mid-Atlantic = apart. Himalayas = India+Asia. San Andreas = sideways. Mariana = oceanic subduction.",why:"<strong>Mid-Atlantic Ridge</strong> = divergent. <strong>Himalayas</strong> = continent-continent. <strong>San Andreas</strong> = transform. <strong>Mariana Trench</strong> = ocean-ocean convergent."},
{type:"mcq",text:"Why does the oceanic plate subduct?",options:["Less dense","Denser than continental crust","Thicker","Moves faster"],correct:1,hint:"Denser material sinks.",why:"Oceanic crust is <strong>denser</strong> \u2192 sinks beneath continental crust."},
{type:"tf",text:"True or False: Volcanoes form at BOTH convergent AND divergent boundaries.",correct:true,hint:"Convergent: melting. Divergent: magma fills gap.",why:"<strong>True.</strong> Convergent: subducted plate melts. Divergent: magma rises (e.g. Iceland)."},
{type:"multi",text:"Select ALL <strong>major tectonic plates</strong>.",options:["Pacific Plate","Atlantic Plate","South American Plate","Antarctic Plate","Saharan Plate","Indo-Australian Plate"],correct:[0,2,3,5],hint:"No Atlantic or Saharan plate exists.",why:"Major: <strong>Pacific, N. American, S. American, African, Eurasian, Antarctic, Indo-Australian</strong>."},
{type:"mcq",text:"Nazca Plate subducts under S. American Plate. What forms?",options:["Mid-ocean ridge","Andes Mountains + volcanoes","Amazon Rainforest","Atlantic Ocean"],correct:1,hint:"Oceanic under continental \u2192 mountains + volcanoes.",why:"<strong>Nazca</strong> subducts \u2192 <strong>Andes</strong> + volcanoes along South America's west coast."},
{type:"mcq",text:"Which hazard is MOST linked to transform boundaries?",options:["Volcanic eruptions","Tsunamis","Earthquakes","Flooding"],correct:2,hint:"San Andreas Fault...",why:"<strong>Earthquakes</strong> from plates grinding past each other."},
{type:"fill",text:"Complete using the word bank.",sentence:"At a convergent boundary, the |___| plate subducts because it is more |___| . It melts and magma rises to form |___| .",blanks:["oceanic","dense","volcanoes"],bank:["oceanic","continental","dense","light","volcanoes","trenches"],hint:"Heavier crust sinks. Melting rock rises.",why:"<strong>Oceanic</strong> plate subducts (more <strong>dense</strong>), melts \u2192 <strong>volcanoes</strong>."}
]},
{num:4,title:"Continental Drift",icon:"\ud83e\udde9",int:"I can use evidence to support Wegener's continental drift theory.",questions:[
{type:"mcq",text:"Who proposed continental drift in 1912?",options:["Darwin","Alfred Wegener","Newton","Curie"],correct:1,hint:"German meteorologist.",why:"<strong>Alfred Wegener</strong> proposed Pangaea."},
{type:"mcq",text:"What was the supercontinent called?",options:["Gondwana","Laurasia","Pangaea","Rodinia"],correct:2,hint:"Greek for 'all lands'.",why:"<strong>Pangaea</strong> (~300\u2013200 Mya)."},

{type:"mcq",text:"Mesosaurus fossils on both S. America and Africa support drift because...",options:["It could fly","It swam the Atlantic","Continents were joined","Scientists planted them"],correct:2,hint:"Small freshwater reptile \u2014 couldn't cross an ocean.",why:"Mesosaurus was a <strong>small freshwater reptile</strong> \u2014 continents must have been <strong>joined</strong>."},

// STATE
var G={stg:-1,qi:0,sc:0,ss:[0,0,0,0,0],mx:[],ans:false,ph:'intro',matchSt:null,orderSt:null,fillSt:null,multiSt:null,dragSt:null};

// PARTICLES

// EARTH SVG
function earthSVG(hl){
  var layers=[{r:100,c:'#78716c'},{r:82,c:'#dc2626'},{r:48,c:'#f97316'},{r:24,c:'#fbbf24'}];
  var s='<svg viewBox="-120 -120 240 240" width="200" height="200" xmlns="http://www.w3.org/2000/svg">';
  if(hl>=0)s+='<defs><filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  layers.forEach(function(l,i){s+='<circle cx="0" cy="0" r="'+l.r+'" fill="'+l.c+'" stroke="'+(i===hl?'#3b82f6':'#1e293b')+'" stroke-width="'+(i===hl?3:1)+'"'+(i===hl?' filter="url(#gl)"':'')+'/>';});
  return s+'</svg>';
}

// PROGRESS
function progHTML(){
  var h='<div class="earth-prog">';
  STAGES.forEach(function(s,i){
    if(i>0)h+='<div class="ep-line '+(i<=G.stg?'done':'')+'"></div>';
    h+='<div class="ep-dot '+(i<G.stg?'done':i===G.stg?'now':'')+'">'+s.icon+'<span class="ep-label">'+s.title+'</span></div>';
  });
  return h+'</div>';
}

// RENDER STAGE
function rStage(a){

// MCQ
function rMCQ(q){return '<div class="opts">'+q.options.map(function(o,i){return '<button class="opt" onclick="cMCQ('+i+')" id="o'+i+'">'+o+'</button>';}).join('')+'</div>';}
function cMCQ(i){if(G.ans)return;G.ans=true;var q=STAGES[G.stg].questions[G.qi],ok=i===q.correct;document.querySelectorAll('.opt').forEach(function(b,j){b.classList.add('dis');if(j===q.correct)b.classList.add('cor');if(j===i&&!ok)b.classList.add('inc');});if(ok){G.sc++;G.ss[G.stg]++;burst(window.innerWidth/2,window.innerHeight/2);}sfb(ok,q);nxt();}

// TF

// ORDER
function rOrder(q){var it=q.items.slice();for(var i=it.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=it[i];it[i]=it[j];it[j]=t;}G.orderSt=it.slice();return '<div class="ord-list" id="oL"></div><div style="text-align:center;margin-bottom:8px"><button class="btn btn-p" onclick="cOrd()" id="cOB">Check Order</button></div>';}
function initOrd(){rOL();}
function rOL(){var l=document.getElementById('oL');if(!l)return;l.innerHTML=G.orderSt.map(function(it,i){return '<div class="ord-item"><div class="ord-n">'+(i+1)+'</div><div class="ord-txt">'+it+'</div><div class="ord-arr"><button class="arr-btn" onclick="mO('+i+',-1)"'+(i===0?' disabled':'')+'>&#9650;</button><button class="arr-btn" onclick="mO('+i+',1)"'+(i===G.orderSt.length-1?' disabled':'')+'>&#9660;</button></div></div>';}).join('');}
function mO(i,d){if(G.ans)return;var n=i+d;if(n<0||n>=G.orderSt.length)return;var t=G.orderSt[i];G.orderSt[i]=G.orderSt[n];G.orderSt[n]=t;rOL();}
function cOrd(){if(G.ans)return;G.ans=true;var q=STAGES[G.stg].questions[G.qi],ok=G.orderSt.every(function(it,i){return it===q.items[i];});document.querySelectorAll('.ord-item').forEach(function(el,i){if(G.orderSt[i]===q.items[i]){el.style.borderColor='#22c55e';el.querySelector('.ord-n').style.background='#22c55e';el.querySelector('.ord-n').style.color='#fff';}else el.style.borderColor='#ef4444';el.querySelectorAll('.arr-btn').forEach(function(b){b.disabled=true;});});document.getElementById('cOB').style.display='none';if(ok){G.sc++;G.ss[G.stg]++;burst(window.innerWidth/2,window.innerHeight/2);}sfb(ok,q);nxt();}

// MATCHING
function rMatch(q){var rm=q.right.map(function(_,i){return i;});for(var i=rm.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=rm[i];rm[i]=rm[j];rm[j]=t;}G.matchSt={sel:null,side:null,matched:[],rm:rm,att:0};var rows='';for(var i=0;i<q.left.length;i++)rows+='<div class="m-item" id="mL'+i+'" onclick="sM(\'left\','+i+')">'+q.left[i]+'</div><div class="m-item" id="mR'+rm[i]+'" onclick="sM(\'right\','+rm[i]+')">'+q.right[rm[i]]+'</div>';return '<div class="m-grid"><div class="m-hdr">Term</div><div class="m-hdr">Description</div>'+rows+'</div><div id="mH" style="font-size:.76rem;color:#64748b;text-align:center">Select one from each column.</div>';}
function sM(side,idx){if(G.ans)return;var q=STAGES[G.stg].questions[G.qi],ms=G.matchSt;if(ms.matched.some(function(m){return(side==='left'&&m[0]===idx)||(side==='right'&&m[1]===idx);}))return;var el=document.getElementById(side==='left'?'mL'+idx:'mR'+idx);el.classList.remove('wf');if(ms.sel!==null&&ms.side!==side){var li=side==='left'?idx:ms.sel,ri=side==='right'?idx:ms.sel;var pair=q.pairs.find(function(p){return p[0]===li;});if(pair&&pair[1]===ri){ms.matched.push([li,ri]);document.getElementById('mL'+li).classList.add('matched');document.getElementById('mR'+ri).classList.add('matched');document.getElementById('mL'+li).classList.remove('sel');document.getElementById('mR'+ri).classList.remove('sel');var prev2=document.getElementById(ms.side==='left'?'mL'+ms.sel:'mR'+ms.sel);if(prev2)prev2.classList.remove('sel');ms.sel=null;ms.side=null;if(ms.matched.length===q.left.length){G.ans=true;var ok=ms.att<q.left.length;if(ok){G.sc++;G.ss[G.stg]++;}burst(window.innerWidth/2,window.innerHeight/2);sfb(true,q);nxt();}}else{ms.att++;el.classList.add('wf');var prev=document.getElementById(ms.side==='left'?'mL'+ms.sel:'mR'+ms.sel);prev.classList.add('wf');prev.classList.remove('sel');ms.sel=null;ms.side=null;document.getElementById('mH').innerHTML='<span style="color:#fca5a5">'+q.hint+'</span>';setTimeout(function(){el.classList.remove('wf');prev.classList.remove('wf');},400);}}else{if(ms.sel!==null&&ms.side===side)document.getElementById(side==='left'?'mL'+ms.sel:'mR'+ms.sel).classList.remove('sel');el.classList.add('sel');ms.sel=idx;ms.side=side;}}

// FILL
function rFill(q){var bank=q.bank.slice();for(var i=bank.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=bank[i];bank[i]=bank[j];bank[j]=t;}G.fillSt={placed:new Array(q.blanks.length).fill(null),ab:0,bank:bank};var parts=q.sentence.split('|___|');var h='<div class="fill-s">';parts.forEach(function(p,i){h+=p;if(i<parts.length-1)h+='<span class="blank" id="bl'+i+'" onclick="sB('+i+')">&#9662;</span>';});h+='</div>';h+='<div class="word-bank">'+bank.map(function(w,i){return '<span class="w-chip" id="ch'+i+'" onclick="pW('+i+')">'+w+'</span>';}).join('')+'</div>';h+='<div style="text-align:center;margin-bottom:8px"><button class="btn btn-p" onclick="cFl()" id="cFB">Check</button></div>';return h;}
function initFill(){hB(0);}
function sB(i){if(G.ans)return;var fs=G.fillSt;if(fs.placed[i]!==null){var ci=fs.bank.indexOf(fs.placed[i]);if(ci>=0)document.getElementById('ch'+ci).classList.remove('used');fs.placed[i]=null;document.getElementById('bl'+i).textContent='\u25be';document.getElementById('bl'+i).classList.remove('filled');}fs.ab=i;hB(i);}
function hB(i){var q=STAGES[G.stg].questions[G.qi];for(var j=0;j<q.blanks.length;j++){var e=document.getElementById('bl'+j);if(e)e.style.borderBottomColor=j===i?'#f59e0b':'#475569';}}
function pW(ci){if(G.ans)return;var fs=G.fillSt,w=fs.bank[ci],ch=document.getElementById('ch'+ci);if(ch.classList.contains('used'))return;var bi=fs.ab;if(fs.placed[bi]!==null){var old=fs.bank.indexOf(fs.placed[bi]);if(old>=0)document.getElementById('ch'+old).classList.remove('used');}fs.placed[bi]=w;ch.classList.add('used');var bl=document.getElementById('bl'+bi);bl.textContent=w;bl.classList.add('filled');var q=STAGES[G.stg].questions[G.qi];for(var i=0;i<q.blanks.length;i++){var nx=(bi+1+i)%q.blanks.length;if(fs.placed[nx]===null){fs.ab=nx;hB(nx);return;}}hB(-1);}
function cFl(){if(G.ans)return;var q=STAGES[G.stg].questions[G.qi],fs=G.fillSt;if(fs.placed.indexOf(null)>=0){document.getElementById('fb').className='fb no';document.getElementById('fb').innerHTML='Fill all blanks first.';document.getElementById('fb').style.display='block';return;}G.ans=true;var ok=fs.placed.every(function(w,i){return w===q.blanks[i];});q.blanks.forEach(function(c,i){var e=document.getElementById('bl'+i);if(fs.placed[i]===c)e.classList.add('cor-b');else{e.classList.add('inc-b');e.textContent=c;}});document.getElementById('cFB').style.display='none';if(ok){G.sc++;G.ss[G.stg]++;burst(window.innerWidth/2,window.innerHeight/2);}sfb(ok,q);nxt();}

// MULTI
function rMulti(q){return '<div class="m-opts">'+q.options.map(function(o,i){return '<button class="m-btn" id="m'+i+'" onclick="tM('+i+')"><span class="cb"></span><span>'+o+'</span></button>';}).join('')+'</div><div style="text-align:center;margin-bottom:8px"><button class="btn btn-p" onclick="cMul()" id="cMB">Check</button></div>';}

function tM(i){if(G.ans)return;var ms=G.multiSt,el=document.getElementById('m'+i);if(ms.tog.has(i)){ms.tog.delete(i);el.classList.remove('tog');}else{ms.tog.add(i);el.classList.add('tog');}}
function cMul(){if(G.ans)return;var q=STAGES[G.stg].questions[G.qi],ms=G.multiSt;if(ms.tog.size===0){document.getElementById('fb').className='fb no';document.getElementById('fb').innerHTML='Select at least one.';document.getElementById('fb').style.display='block';return;}G.ans=true;var cs=new Set(q.correct),ok=ms.tog.size===cs.size&&Array.from(ms.tog).every(function(v){return cs.has(v);});q.options.forEach(function(_,i){var el=document.getElementById('m'+i);el.classList.add('dis');if(cs.has(i)&&ms.tog.has(i))el.classList.add('cor');else if(!cs.has(i)&&ms.tog.has(i))el.classList.add('inc');else if(cs.has(i)&&!ms.tog.has(i))el.classList.add('mis');});document.getElementById('cMB').style.display='none';if(ok){G.sc++;G.ss[G.stg]++;burst(window.innerWidth/2,window.innerHeight/2);}sfb(ok,q);nxt();}

ext-align:center;margin-bottom:8px"><button class="btn btn-p" onclick="cLD()" id="cDB">Check</button></div>';}
function diC(i){if(G.ans)return;if(document.getElementById('di'+i).classList.contains('placed'))return;G.dragSt.sel=i;document.querySelectorAll('.drag-item').forEach(function(el,j){el.style.outline=j===i?'2px solid #3b82f6':'none';});}

function cLD(){if(G.ans)return;var q=STAGES[G.stg].questions[G.qi],ds=G.dragSt;if(ds.placed.indexOf(null)>=0){document.getElementById('fb').className='fb no';document.getElementById('fb').innerHTML='Place all labels. Click a label, then click a ? slot.';document.getElementById('fb').style.display='block';return;}G.ans=true;var ok=ds.placed.every(function(l,i){return l===q.labels[i];});ds.placed.forEach(function(l,i){var dt=document.getElementById('dt'+i);if(l===q.labels[i]){dt.classList.add('correct');dt.textContent=q.labels[i];}else{dt.classList.add('wrong');dt.textContent=q.labels[i];}});document.getElementById('cDB').style.display='none';if(ok){G.sc++;G.ss[G.stg]++;burst(window.innerWidth/2,window.innerHeight/2);}sfb(ok,q);nxt();}

function nxt(){var r=document.getElementById('br'),lq=G.qi>=STAGES[G.stg].questions.length-1,ls=G.stg>=4;if(lq&&ls)r.innerHTML='<button class="btn btn-g" onclick="goF()">See Results</button>';else if(lq)r.innerHTML='<button class="btn btn-g" onclick="goT()">Complete Stage \u2192</button>';else r.innerHTML='<button class="btn btn-p" onclick="goN()">Next \u2192</button>';}

function goT(){G.ph='trans';R();}
function rTrans(a){var s=STAGES[G.stg],sc=G.ss[G.stg],mx=G.mx[G.stg],pct=Math.round(sc/mx*100),em=pct>=70?'\ud83c\udf1f':pct>=50?'\ud83d\udc4d':'\ud83d\udcaa',nx=STAGES[G.stg+1];a.innerHTML='<div class="hdr"><h1>Earth Science Review</h1></div>'+progHTML()+'<div class="sc-chip">Score <b>'+G.sc+'</b></div><div class="card trans"><div class="em">'+em+'</div><h2>Stage '+s.num+': '+s.title+'</h2><div class="tsc">'+sc+'/'+mx+' ('+pct+'%)</div><p>'+(pct>=70?'Great work!':pct>=50?'Good effort!':'Keep going!')+'</p><p style="margin-top:14px;color:#64748b">Next: <strong style="color:#fbbf24">'+nx.icon+' '+nx.title+'</strong></p><div class="btn-row" style="justify-content:center;margin-top:18px"><button class="btn btn-p" onclick="goNS()">Continue \u2192</button></div></div>';}
function goNS(){G.stg++;G.qi=0;G.ans=false;G.ph='play';R();}
function goF(){G.ph='final';R();}
function rFinal(a){var tot=G.ss.reduce(function(a,b){return a+b;},0),mx=G.mx.reduce(function(a,b){return a+b;},0),pct=Math.round(tot/mx*100),grd=pct>=90?'Outstanding':pct>=70?'Proficient':pct>=50?'Developing':'Emerging',em=pct>=90?'\ud83c\udfc6':pct>=70?'\ud83c\udf1f':pct>=50?'\ud83d\udcc8':'\ud83c\udf31';a.innerHTML='<div class="hdr"><h1>Earth Science Review</h1></div><div class="card final"><div style="font-size:2.6rem">'+em+'</div><h2>Review Complete!</h2><div class="big">'+tot+'/'+mx+' ('+pct+'%)</div><div class="grd">'+grd+'</div><div class="s-bd">'+STAGES.map(function(s,i){return '<div class="s-r"><span class="n">'+s.icon+' '+s.title+'</span><span class="s">'+G.ss[i]+'/'+G.mx[i]+'</span></div>';}).join('')+'</div><div class="xfer"><h3>Now think about this...</h3><p>Everything connects through <strong>change</strong>. Heat deep inside Earth drives convection, which moves plates, which reshapes the surface. Next time you see a mountain, volcano, or hear about an earthquake \u2014 you understand the engine driving it all.</p></div><div class="btn-row" style="justify-content:center;margin-top:14px"><button class="btn btn-s" onclick="reset()">Try Again</button></div></div>';}
function reset(){G={stg:-1,qi:0,sc:0,ss:[0,0,0,0,0],mx:STAGES.map(function(s){return s.questions.length;}),ans:false,ph:'intro',matchSt:null,orderSt:null,fillSt:null,multiSt:null,dragSt:null};R();}

R();
