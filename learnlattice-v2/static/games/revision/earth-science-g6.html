/span>.",left:["Crust","Mantle","Outer Core","Inner Core"],right:["~1,200 km","~2,200 km","~2,900 km","5–70 km"],pairs:[[0,3],[1,2],[2,1],[3,0]],hint:"The mantle is the thickest. The crust is the thinnest.",why:"Crust (5–70 km), Mantle (~2,900 km), Outer Core (~2,200 km), Inner Core (~1,200 km radius)."},{type:"tf",q:"True or False: <span class='kw'>Oceanic crust</span> is thicker than continental crust.",ans:!1,hint:"Continental crust supports heavy mountains — it must be thicker.",why:"<strong>False.</strong> Continental crust is thicker (30–70 km) but less dense. Oceanic crust is thinner (5–10 km) but denser."},{type:"mcq",q:"The inner core is solid even though it is the <span class='kw'>hottest</span> part. Why?",opts:["The outer core cools it","It is not that hot","Extreme pressure keeps it solid","It is made of gas"],ans:2,hint:"Extreme pressure can prevent melting even at very high temperatures.",why:"The inner core is over 5,000°C, but <span class='kw'>immense pressure</span> keeps the iron and nickel solid."},{type:"mcq",q:"What <span class='kw'>state</span> is the outer core?",opts:["Gas","Liquid","Solid","Plasma"],ans:1,hint:"Unlike the inner core, the pressure is not high enough to keep it solid.",why:"The outer core is <span class='kw'>liquid</span> iron and nickel. Its movement creates Earth's magnetic field."},{type:"fill",q:"Complete using the word bank.",sentence:"The mantle is mostly |___| rock that flows very |___| . This is driven by |___| from the core.",blanks:["solid","slowly","heat"],bank:["heat","liquid","solid","quickly","slowly","gravity"],hint:"The mantle is NOT liquid — it flows like thick toffee over millions of years.",why:"The mantle is <span class='kw'>solid</span> but flows <span class='kw'>slowly</span> driven by <span class='kw'>heat</span> from the core."},{type:"diagram",dia:"layers",q:"Looking at this unlabelled diagram, the <span class='kw'>innermost yellow circle</span> represents which layer?",opts:["Outer Core","Crust","Mantle","Inner Core"],ans:3,hint:"The smallest circle at the very centre represents the deepest layer.",why:"The innermost circle is the <span class='kw'>Inner Core</span> — solid iron and nickel at extreme temperature and pressure."},{type:"diagram",dia:"tempgradient",q:"Study this temperature graph. What <span class='kw'>pattern</span> does temperature follow as you go deeper into the Earth?",opts:["Temperature stays the same at every depth","Temperature decreases as you go deeper","Temperature increases as you go deeper","Temperature goes up then down"],ans:2,hint:"Look at the red line — which direction does it go from left (surface) to right (core)?",why:"Temperature <span class='kw'>increases</span> as you go deeper. The surface is ~20°C, the mantle reaches ~1000°C, and the inner core is over 5,500°C. This heat drives convection currents."}]},{num:2,title:"Convection Engine",int:"I can explain how convection currents drive plate movement.",questions:[{type:"diagram",dia:"convection",q:"Study the convection diagram. What is the main <span class='kw'>energy source</span>?",opts:["The Moon's gravity","Heat from Earth's core","Surface wind","The Sun"],ans:1,hint:"Look at the bottom of the diagram — what is labelled as the heat source?",why:"<span class='kw'>Radioactive decay</span> and residual heat keep the core hot, driving mantle convection."},{type:"order",q:"Put these steps in order. <span class='kw'>First step at the top</span>, last step at the bottom.",items:["Hot rock near the core rises","Rock spreads sideways at the top","Rock cools near the crust","Cool dense rock sinks back down","The cycle repeats"],correct:[0,1,2,3,4],hint:"Start with heating at the bottom. Hot rises, cools, sinks.",why:"Convection: hot rock rises → spreads sideways → cools → sinks → repeats. This moves tectonic plates."},{type:"mcq",q:"Why does <span class='kw'>hot rock</span> rise in the mantle?",opts:["It becomes less dense","Gravity pulls it up","Earthquakes push it","The crust pulls it"],ans:0,hint:"What happens to water when you heat it? Hot = less dense = rises.",why:"Heated rock <span class='kw'>expands and becomes less dense</span>, so it rises — like a hot air balloon."},{type:"tf",q:"True or False: Convection can <span class='kw'>only</span> happen in liquids.",ans:!1,hint:"The mantle is solid rock, but convection still happens there...",why:"<strong>False.</strong> The solid mantle still convects because rock can flow plastically over millions of years."},{type:"mcq",q:"Where do plates <span class='kw'>pull apart</span> in relation to convection?",opts:["In the middle of the mantle","Where currents sink","At the core","Where currents rise and spread sideways"],ans:3,hint:"Follow the arrows to where they reach the surface and diverge.",why:"Plates separate where rising currents reach the crust and <span class='kw'>spread in opposite directions</span> — creating divergent boundaries."},{type:"fill",q:"Complete the convection cycle.",sentence:"When rock is heated it becomes less |___| and rises. Near the crust it |___| and becomes more dense, then it |___| back down.",blanks:["dense","cools","sinks"],bank:["dense","light","cools","heats","sinks","rises"],hint:"Hot = less dense = rises. Cold = more dense = sinks.",why:"Heated rock is less <span class='kw'>dense</span> (rises). Near the crust it <span class='kw'>cools</span>, gets denser, and <span class='kw'>sinks</span>."},{type:"mcq",q:"A student says: <em>'Convection makes the mantle liquid.'</em> What is wrong?",opts:["Nothing — it IS liquid","The mantle is gas","The mantle is solid but flows slowly","Convection only happens in the core"],ans:2,hint:"Common misconception — is the mantle liquid or solid?",why:"The mantle is <span class='kw'>solid rock</span> that flows extremely slowly. Convection does not melt it."},{type:"multi",q:"Select <span class='kw'>ALL</span> correct statements about convection.",opts:["Driven by core heat","They cause plate movement","They happen instantly","They form circular loops","They only happen in the outer core"],correct:[0,1,3],hint:"Three are correct. Think about speed, shape, and what they drive.",why:"Convection: <span class='kw'>driven by heat</span>, <span class='kw'>moves plates</span>, forms <span class='kw'>circular loops</span>. They are incredibly slow, not instant, and occur in the mantle."},{type:"diagram",dia:"convection",q:"Look at the diagram again. The <span class='kw'>red arrows</span> show hot rock rising. What do the <span class='kw'>blue arrows</span> show?",opts:["Magma erupting from volcanoes","Cool rock sinking back toward the core","Water flowing underground","The crust moving sideways"],ans:1,hint:"Blue = cool. What happens to rock when it cools down near the crust?",why:"The blue arrows show <span class='kw'>cool, dense rock sinking</span> back down toward the core. It cooled near the crust, became denser, and sinks — completing the convection loop."}]},{num:3,title:"Plate Boundaries",int:"I can describe the three boundary types and their features.",questions:[{type:"diagram",dia:"divergent",q:"Study the <span class='kw'>divergent boundary</span>. What happens here?",opts:["Plates slide past each other","Plates collide, mountains form","Plates apart, new crust forms","Plates stack up"],ans:2,hint:"Look at the arrows and the gap between the plates.",why:"At divergent boundaries, plates move apart. Magma rises to create <span class='kw'>new oceanic crust</span>. Mid-ocean ridges form."},{type:"diagram",dia:"convergent",q:"In this <span class='kw'>convergent boundary</span>, what happens to the oceanic plate?",opts:["Rises above continental plate","Slides sideways","Moves away","Subducts beneath continental plate"],ans:3,hint:"The oceanic plate is denser — what happens when dense meets less dense?",why:"The denser oceanic plate <span class='kw'>subducts</span> beneath the continental plate, creating trenches and volcanic arcs."},{type:"diagram",dia:"transform",q:"At this <span class='kw'>transform boundary</span>, what hazard is most common?",opts:["Earthquakes","Tsunamis","Tornadoes","Volcanoes"],ans:0,hint:"The plates grind past each other — they stick, then slip suddenly.",why:"Transform boundaries produce <span class='kw'>earthquakes</span> from friction. The San Andreas Fault is a famous example."},{type:"matching",q:"Match each <span class='kw'>boundary</span> to its surface feature.",left:["Divergent","Convergent (ocean-continent)","Convergent (continent-continent)","Transform"],right:["Fold mountains (e.g. Himalayas)","Mid-ocean ridge","Trench + coastal volcanoes","Earthquake fault line"],pairs:[[0,1],[1,2],[2,0],[3,3]],hint:"Divergent = new crust. Ocean-continent = subduction + volcano. Continent-continent = mountains. Transform = fault.",why:"Divergent → ridges. Ocean-continent → trench + volcanoes. Continent-continent → fold mountains. Transform → faults."},{type:"mcq",q:"The Himalayas formed from two <span class='kw'>continental plates</span> colliding. Why no volcanoes?",opts:["It is actually divergent","Neither plate subducts, so no melting","All boundaries have volcanoes","Not hot enough"],ans:1,hint:"Volcanoes need magma from a subducting plate melting. Can two continents subduct?",why:"Neither continental plate is dense enough to subduct. <span class='kw'>No subduction = no melting = no magma = no volcanoes</span>."},{type:"tf",q:"True or False: The <span class='kw'>Ring of Fire</span> is around the Pacific Plate.",ans:!0,hint:"Where are most earthquakes and volcanoes concentrated?",why:"<strong>True.</strong> ~75% of Earth's volcanoes and ~90% of earthquakes occur around the <span class='kw'>Pacific Plate</span>."},{type:"order",q:"Put these in order from <span class='kw'>first</span> (top) to <span class='kw'>last</span> (bottom). How does a volcanic eruption happen?",items:["Oceanic plate meets continental plate","Denser oceanic plate subducts","Subducting plate melts","Magma rises through cracks","Volcano erupts at surface"],correct:[0,1,2,3,4],hint:"Start with the plates meeting, then follow the process underground.",why:"Plates meet → subduction → melting → magma rises → eruption. Volcanoes form in <span class='kw'>lines above subduction zones</span>."},{type:"mcq",q:"What forms on the sea floor at a <span class='kw'>divergent</span> boundary?",opts:["Coral reef","Flat plain","Deep trench","Mid-ocean ridge"],ans:3,hint:"When plates pull apart, magma rises and solidifies into a raised feature.",why:"A <span class='kw'>mid-ocean ridge</span> — an underwater mountain chain where new crust forms. The Mid-Atlantic Ridge is the best known."},{type:"multi",q:"Select <span class='kw'>ALL</span> the major tectonic plates from this list.",opts:["Pacific Plate","Atlantic Plate","Eurasian Plate","African Plate","Arctic Plate","South American Plate"],correct:[0,2,3,5],hint:"There is no 'Atlantic Plate' or 'Arctic Plate'. Think about which continents and oceans have their own plate.",why:"The major plates include: <span class='kw'>Pacific</span> (largest), <span class='kw'>Eurasian</span>, <span class='kw'>African</span>, <span class='kw'>South American</span>, North American, Indo-Australian, and Antarctic. There is no Atlantic Plate — the Mid-Atlantic Ridge splits between other plates."},{type:"matching",q:"Match each <span class='kw'>tectonic plate</span> to its location.",left:["Pacific Plate","Eurasian Plate","Nazca Plate","Indo-Australian Plate"],right:["Under India, Australia and Indian Ocean","Under Europe and most of Asia","Under the Pacific Ocean (largest plate)","Under the eastern Pacific Ocean floor, near South America"],pairs:[[0,2],[1,1],[2,3],[3,0]],hint:"The Pacific Plate is the largest. The Nazca Plate is small and sits next to South America. The Eurasian Plate covers Europe and Asia.",why:"<span class='kw'>Pacific</span> = largest, under Pacific Ocean. <span class='kw'>Eurasian</span> = Europe + Asia. <span class='kw'>Nazca</span> = small oceanic plate near South America (subducts under it). <span class='kw'>Indo-Australian</span> = India, Australia, Indian Ocean."},{type:"diagram",dia:"platemap",q:"Study this plate boundary map. Point <span class='kw'>B</span> (red line between India and Eurasia) marks the Himalayas. What type of boundary is this?",opts:["Divergent — plates pulling apart","Transform — plates sliding past each other","Convergent (continent-continent) — two continents colliding","Convergent (ocean-continent) — subduction"],ans:2,hint:"India and Eurasia are both continental plates. They are pushing into each other. Neither can subduct.",why:"Point B is a <span class='kw'>continent-continent convergent boundary</span>. The Indian Plate pushed into the Eurasian Plate, and since neither is dense enough to subduct, the crust crumpled upward to form the Himalayas — the tallest mountains on Earth."}]},{num:4,title:"Continental Drift",int:"I can explain continental drift and evaluate Wegener's evidence.",questions:[{type:"diagram",dia:"pangaea",q:"This map shows <span class='kw'>Pangaea</span>. What was it?",opts:["An ancient ocean","A supercontinent","The first tectonic plate","A type of volcano"],ans:1,hint:"'Pan' = all, 'gaea' = Earth/land.",why:"<span class='kw'>Pangaea</span> was a supercontinent ~300 million years ago when all landmasses were joined."},{type:"mcq",q:"Who proposed <span class='kw'>continental drift</span>?",opts:["Darwin","Newton","Wegener","Einstein"],ans:2,hint:"He noticed South America and Africa fit together like puzzle pieces.",why:"<span class='kw'>Alfred Wegener</span> proposed continental drift in 1912."},{type:"multi",q:"Select <span class='kw'>ALL</span> evidence Wegener used.",opts:["Matching fossils across continents","GPS tracking","Coastline jigsaw fit","Matching rock types across oceans","Satellite images","Glacial deposits in tropical areas"],correct:[0,2,3,5],hint:"GPS and satellites did not exist in 1912. Four were available to Wegener.",why:"Wegener used: <span class='kw'>fossils</span>, <span class='kw'>coastline fit</span>, <span class='kw'>matching rocks</span>, and <span class='kw'>glacial evidence</span>."},{type:"mcq",q:"Why was Wegener's theory <span class='kw'>rejected</span> at first?",opts:["He could not explain the mechanism","He was not a geologist","Evidence was wrong","It was already proved wrong"],ans:0,hint:"Scientists wanted to know HOW continents could move.",why:"Wegener could not explain <span class='kw'>what force moved the continents</span>. Sea-floor spreading in the 1960s provided the mechanism."},{type:"tf",q:"True or False: <em>Mesosaurus</em> fossils are found on <span class='kw'>both</span> South America and Africa.",ans:!0,hint:"It was a freshwater reptile — could it swim across the Atlantic?",why:"<strong>True.</strong> Mesosaurus was a freshwater reptile that could not cross an ocean, proving the continents were once joined."},{type:"order",q:"Put these in order from <span class='kw'>earliest</span> (top) to <span class='kw'>most recent</span> (bottom).",items:["Pangaea exists (~300 Mya)","Pangaea breaks apart (~200 Mya)","Atlantic Ocean forms (~150 Mya)","Wegener proposes drift (1912)","Sea-floor spreading discovered (1960s)"],correct:[0,1,2,3,4],hint:"Start with the supercontinent, end with the science.",why:"Pangaea ~300 Mya → breakup ~200 Mya → Atlantic ~150 Mya → Wegener 1912 → confirmation 1960s."},{type:"mcq",q:"What finally explained <span class='kw'>how</span> plates move?",opts:["Sea-floor spreading at mid-ocean ridges","Earthquake data","Volcanic records","Fossil evidence"],ans:0,hint:"New crust was found forming at the bottom of the ocean.",why:"<span class='kw'>Sea-floor spreading</span> at mid-ocean ridges showed new crust forms and pushes plates apart."},{type:"mcq",q:"How fast do tectonic plates move?",opts:["1–10 km/year","1–10 m/year","They stopped moving","1–10 cm/year (fingernail speed)"],ans:3,hint:"You would never notice it in a lifetime.",why:"Plates move <span class='kw'>1–10 cm per year</span> — about as fast as your fingernails grow."},{type:"diagram",dia:"drifttimeline",q:"Study this timeline. About how long did it take for Pangaea to break apart into the continents we see today?",opts:["About 300 years","About 300 million years","About 3000 years","It happened overnight"],ans:1,hint:"Look at the dates: Pangaea existed ~300 Mya, and today the continents are fully separated.",why:"Continental drift took about <span class='kw'>300 million years</span>. Pangaea started breaking apart ~200 Mya and the continents are still moving today. This shows how incredibly slow — but constant — tectonic change is."}]},{num:5,title:"Putting It Together",int:"I can connect interior processes to surface events.",questions:[{type:"diagram",dia:"causechain",q:"Study this cause-effect chain. If <span class='kw'>convection stopped</span>, what would happen?",opts:["Heat would move plates directly","Plates would gradually stop","The core would cool instantly","Earthquakes would increase"],ans:1,hint:"Remove the link between heat and plate movement. What breaks?",why:"Without convection, there is <span class='kw'>no mechanism</span> to transfer core heat into plate motion. Plates would slow and stop."},{type:"diagram",dia:"ringoffire",q:"Why are volcanoes concentrated in the <span class='kw'>Ring of Fire</span> pattern?",opts:["The Sun heats the Pacific more","Volcanoes only form near water","Pacific Plate surrounded by subduction zones","Random chance"],ans:2,hint:"The dots trace the edge of one particular plate.",why:"The Ring of Fire follows the <span class='kw'>Pacific Plate</span> edges — surrounded by subduction zones where oceanic crust subducts and melts."},{type:"mcq",q:"A city at an ocean-continent boundary should prepare for which <span class='kw'>TWO</span> hazards?",opts:["Tornadoes + floods","Earthquakes + volcanoes","Earthquakes + droughts","Volcanoes + blizzards"],ans:1,hint:"Subduction causes friction (one hazard) and melting (another hazard).",why:"Convergent subduction boundaries produce <span class='kw'>earthquakes</span> (friction) and <span class='kw'>volcanoes</span> (melting plate)."},{type:"tf",q:"True or False: Earthquakes can <span class='kw'>only</span> happen at plate boundaries.",ans:!1,hint:"Most happen at boundaries, but can the middle of a plate ever crack?",why:"<strong>False.</strong> <span class='kw'>Intraplate earthquakes</span> can occur due to ancient faults or stress transfer."},{type:"matching",q:"Match each <span class='kw'>feature</span> to its process.",left:["Mid-ocean ridge","Deep trench","Fold mountains","Rift valley"],right:["Continental divergence on land","Oceanic divergence","Plate subduction","Continental collision"],pairs:[[0,1],[1,2],[2,3],[3,0]],hint:"Ridges = divergent. Trenches = subduction. Fold mountains = collision. Rifts = land divergence.",why:"Ridges = oceanic divergence. Trenches = subduction. Fold mountains = continent collision. Rifts = continental divergence."},{type:"multi",q:"Select <span class='kw'>ALL</span> correct statements.",opts:["Core heat drives convection and plate movement","Volcanoes form because the Sun heats the surface","Most hazards occur at plate boundaries","Continental drift is caused by wind","Density differences explain subduction","Mountains form instantly"],correct:[0,2,4],hint:"Three are correct. Think about what drives the system and where hazards occur.",why:"Core heat → convection → plates. Hazards at boundaries. Density explains subduction. NOT the Sun, wind, or instant."},{type:"order",q:"Put this chain in order from <span class='kw'>deep inside Earth</span> (top) to <span class='kw'>the surface</span> (bottom).",items:["Radioactive decay heats the core","Convection currents form in mantle","Currents drag tectonic plates","Plates converge at subduction zone","Volcanic eruption at surface"],correct:[0,1,2,3,4],hint:"Start with the deepest energy source and follow upward.",why:"This is the <span class='kw'>key idea</span>: heat → convection → plate move
