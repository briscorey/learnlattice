<title>Earth Science Review — Grade 6</title>
<!-- MYP Alignment
   Criteria: A – Knowing & Understanding, D – Reflecting on Science
   Key Concept: Change
   Related Concepts: Environment, Models
   ATL: Critical thinking — analyse cause-effect chains
   Global Context: Orientation in space and time
-->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }

.container { max-width: 860px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }

.header { text-align: center; padding: 20px 0 10px; }
.header h1 { font-size: 1.6rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; }
.header .subtitle { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
.myp-badge { display: inline-block; background: rgba(251,146,60,0.15); color: #fb923c; font-size: 0.7rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-top: 8px; letter-spacing: 0.03em; }

.progress-bar { display: flex; gap: 6px; margin: 18px 0 8px; }
.progress-step { flex: 1; height: 6px; border-radius: 3px; background: #1e293b; transition: background 0.4s; }
.progress-step.completed { background: #22c55e; }
.progress-step.active { background: #3b82f6; animation: pulse-bar 1.5s infinite; }
@keyframes pulse-bar { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
.progress-labels { display: flex; gap: 6px; margin-bottom: 20px; }
.progress-labels span { flex: 1; text-align: center; font-size: 0.62rem; color: #475569; font-weight: 500; }
.progress-labels span.active { color: #93c5fd; }
.progress-labels span.completed { color: #86efac; }

.stage { background: #1e293b; border-radius: 16px; padding: 28px; flex: 1; display: flex; flex-direction: column; border: 1px solid #334155; }
.stage-header { margin-bottom: 20px; }
.stage-num { font-size: 0.7rem; font-weight: 700; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.08em; }
.stage-title { font-size: 1.3rem; font-weight: 700; margin: 4px 0; color: #f1f5f9; }
.stage-intention { font-size: 0.82rem; color: #94a3b8; font-style: italic; }

.question-text { font-size: 1rem; color: #e2e8f0; margin-bottom: 18px; line-height: 1.6; }
.question-counter { font-size: 0.75rem; color: #64748b; margin-bottom: 10px; }

.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.option-btn { background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 14px 18px; font-size: 0.92rem; color: #e2e8f0; cursor: pointer; text-align: left; transition: all 0.2s; font-family: inherit; }
.option-btn:hover:not(.disabled) { border-color: #3b82f6; background: rgba(59,130,246,0.08); }
.option-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.12); color: #86efac; }
.option-btn.incorrect { border-color: #ef4444; background: rgba(239,68,68,0.08); color: #fca5a5; }
.option-btn.disabled { cursor: default; opacity: 0.6; }
.option-btn.show-correct { border-color: #22c55e; background: rgba(34,197,94,0.08); }

/* TRUE/FALSE */
.tf-row { display: flex; gap: 12px; margin-bottom: 16px; }
.tf-btn { flex: 1; background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 16px; font-size: 1rem; font-weight: 600; color: #e2e8f0; cursor: pointer; text-align: center; transition: all 0.2s; font-family: inherit; }
.tf-btn:hover:not(.disabled) { border-color: #3b82f6; }
.tf-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.12); color: #86efac; }
.tf-btn.incorrect { border-color: #ef4444; background: rgba(239,68,68,0.08); color: #fca5a5; }
.tf-btn.disabled { cursor: default; opacity: 0.6; }
.tf-btn.show-correct { border-color: #22c55e; background: rgba(34,197,94,0.08); }

/* FILL BLANK */
.fill-sentence { font-size: 1rem; color: #e2e8f0; line-height: 2; margin-bottom: 16px; }
.blank-slot { display: inline-block; min-width: 120px; border-bottom: 2px dashed #3b82f6; padding: 2px 8px; margin: 0 4px; text-align: center; color: #93c5fd; font-weight: 600; cursor: pointer; transition: all 0.2s; vertical-align: bottom; min-height: 1.4em; }
.blank-slot.filled { border-bottom-style: solid; }
.blank-slot.correct-slot { border-color: #22c55e; color: #86efac; }
.blank-slot.incorrect-slot { border-color: #ef4444; color: #fca5a5; }
.word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.word-chip { background: #3b82f6; color: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; user-select: none; transition: all 0.15s; }
.word-chip:hover:not(.used) { background: #2563eb; transform: scale(1.03); }
.word-chip.used { opacity: 0.35; cursor: default; }

/* ORDER */
.order-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.order-item { display: flex; align-items: center; gap: 12px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; padding: 12px 16px; transition: all 0.2s; }
.order-num { width: 28px; height: 28px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #94a3b8; flex-shrink: 0; }
.order-text { font-size: 0.88rem; color: #e2e8f0; flex: 1; }
.order-arrows { display: flex; flex-direction: column; gap: 2px; margin-left: auto; }
.arrow-btn { background: none; border: 1px solid #475569; color: #94a3b8; width: 26px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; font-family: inherit; }
.arrow-btn:hover:not(:disabled) { border-color: #3b82f6; color: #3b82f6; }
.arrow-btn:disabled { opacity: 0.3; cursor: default; }

/* MATCHING */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.match-col-header { font-size: 0.72rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; padding-bottom: 4px; }
.match-item { background: #0f172a; border: 2px solid #334155; border-radius: 10px; padding: 11px 14px; font-size: 0.85rem; color: #e2e8f0; cursor: pointer; transition: all 0.2s; text-align: center; }
.match-item:hover:not(.matched) { border-color: #3b82f6; }
.match-item.selected { border-color: #f59e0b; background: rgba(245,158,11,0.1); }
.match-item.matched { border-color: #22c55e; background: rgba(34,197,94,0.08); opacity: 0.7; cursor: default; }
.match-item.wrong-flash { border-color: #ef4444; animation: shake 0.4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* MULTI-SELECT */
.multi-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.multi-btn { background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 14px 18px; font-size: 0.92rem; color: #e2e8f0; cursor: pointer; text-align: left; transition: all 0.2s; font-family: inherit; display: flex; align-items: center; gap: 10px; }
.multi-btn:hover:not(.disabled) { border-color: #3b82f6; background: rgba(59,130,246,0.08); }
.multi-btn.toggled { border-color: #f59e0b; background: rgba(245,158,11,0.1); }
.multi-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.12); color: #86efac; }
.multi-btn.incorrect { border-color: #ef4444; background: rgba(239,68,68,0.08); color: #fca5a5; }
.multi-btn.missed { border-color: #22c55e; border-style: dashed; background: rgba(34,197,94,0.05); }
.multi-btn.disabled { cursor: default; }
.check-box { width: 20px; height: 20px; border: 2px solid #475569; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
.multi-btn.toggled .check-box { border-color: #f59e0b; background: rgba(245,158,11,0.3); }
.multi-btn.toggled .check-box::after { content: '✓'; color: #f59e0b; }
.multi-btn.correct .check-box { border-color: #22c55e; background: rgba(34,197,94,0.3); }
.multi-btn.correct .check-box::after { content: '✓'; color: #22c55e; }

.feedback { padding: 14px 18px; border-radius: 12px; margin-bottom: 16px; font-size: 0.88rem; line-height: 1.5; display: none; }
.feedback.correct { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; display: block; }
.feedback.incorrect { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; display: block; }
.feedback .why { margin-top: 8px; font-size: 0.82rem; color: #94a3b8; }
.feedback .why strong { color: #cbd5e1; }

.btn { padding: 12px 28px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all 0.2s; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-success { background: #22c55e; color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-secondary { background: #334155; color: #e2e8f0; }
.btn-secondary:hover { background: #475569; }
.btn-row { display: flex; gap: 10px; margin-top: auto; padding-top: 16px; justify-content: flex-end; }

.score-display { position: fixed; top: 16px; right: 16px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px 16px; font-size: 0.8rem; color: #94a3b8; z-index: 10; }
.score-display .score-num { font-size: 1.1rem; font-weight: 700; color: #f8fafc; }

.transition-screen { text-align: center; padding: 40px 20px; }
.transition-screen .emoji { font-size: 3rem; margin-bottom: 16px; }
.transition-screen h2 { font-size: 1.3rem; color: #f1f5f9; margin-bottom: 8px; }
.transition-screen p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 6px; }
.transition-screen .stage-score { font-size: 1rem; color: #22c55e; font-weight: 600; margin: 12px 0; }

.final-screen { text-align: center; padding: 40px 20px; }
.final-screen h2 { font-size: 1.6rem; color: #f8fafc; margin-bottom: 8px; }
.final-score { font-size: 3rem; font-weight: 800; color: #22c55e; margin: 16px 0; }
.final-screen .grade { font-size: 1rem; color: #94a3b8; margin-bottom: 24px; }
.stage-breakdown { display: flex; flex-direction: column; gap: 8px; margin: 20px auto; max-width: 400px; text-align: left; }
.stage-result { display: flex; justify-content: space-between; padding: 8px 14px; background: #0f172a; border-radius: 8px; font-size: 0.85rem; }
.stage-result .name { color: #94a3b8; }
.stage-result .sc { color: #22c55e; font-weight: 600; }
.transfer-prompt { background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.3); border-radius: 12px; padding: 18px; margin-top: 24px; text-align: left; }
.transfer-prompt h3 { color: #fb923c; font-size: 0.85rem; margin-bottom: 8px; }
.transfer-prompt p { color: #e2e8f0; font-size: 0.88rem; line-height: 1.5; }

.intro-screen { text-align: center; padding: 30px 20px; }
.intro-screen h2 { font-size: 1.5rem; margin-bottom: 12px; color: #f8fafc; }
.intro-screen p { color: #94a3b8; font-size: 0.92rem; margin-bottom: 8px; line-height: 1.5; }
.intro-topics { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0; }
.intro-topic { background: rgba(59,130,246,0.12); color: #93c5fd; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
.soi { background: rgba(251,146,60,0.08); border-left: 3px solid #fb923c; padding: 12px 16px; margin: 16px 0; text-align: left; font-size: 0.85rem; color: #fbbf24; font-style: italic; line-height: 1.5; border-radius: 0 8px 8px 0; }

@media (max-width: 600px) {
  .container { padding: 12px; }
  .stage { padding: 18px; }
  .match-grid { grid-template-columns: 1fr; }
  .score-display { top: auto; bottom: 12px; right: 12px; }
  .tf-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
// =====================================================================
//  GAME DATA — 5 stages, 7–8 questions each ≈ 37 questions total
// =====================================================================
const STAGES = [
  // ======== STAGE 1: EARTH'S LAYERS ========
  {
    num: 1, title: "Earth's Layers", intention: "I can identify and describe Earth's layers and their properties.",
    questions: [
      {
        type: "drag-sort",
        text: "Arrange Earth's layers from the <strong>outermost</strong> (top) to the <strong>innermost</strong> (bottom).",
        items: ["Inner Core", "Crust", "Outer Core", "Mantle"],
        correct: ["Crust", "Mantle", "Outer Core", "Inner Core"],
        hint: "Think about digging straight down — which layer would you hit first?",
        why: "Earth has four main layers. The <strong>crust</strong> is the thin outer shell we live on, then the thick <strong>mantle</strong>, the liquid <strong>outer core</strong>, and the solid <strong>inner core</strong> at the centre."
      },
      {
        type: "matching",
        text: "Match each <strong>layer</strong> to its approximate <strong>thickness</strong>.",
        left: ["Crust", "Mantle", "Outer Core", "Inner Core"],
        right: ["~1,200 km", "~2,200 km", "~2,900 km", "~5–70 km"],
        pairs: [[0,3],[1,2],[2,1],[3,0]],
        hint: "The mantle is by far the thickest. The crust is the thinnest — it varies from about 5 km under oceans to 70 km under mountains.",
        why: "The <strong>crust</strong> (5–70 km) is paper-thin compared to the <strong>mantle</strong> (~2,900 km). The <strong>outer core</strong> (~2,200 km) and <strong>inner core</strong> (~1,200 km radius) make up the centre."
      },
      {
        type: "mcq",
        text: "Which layer of the Earth is the thickest?",
        options: ["Crust", "Mantle", "Outer Core", "Inner Core"],
        correct: 1,
        hint: "It makes up about 84% of Earth's total volume.",
        why: "The <strong>mantle</strong> is roughly 2,900 km thick — far thicker than any other layer. It is mostly solid rock but can flow very slowly over long time periods."
      },
      {
        type: "tf",
        text: "True or False: The oceanic crust is thicker than the continental crust.",
        correct: false,
        hint: "Think about what sits on top of each type — continents are much heavier than ocean water, so the crust beneath them must be thicker to support them.",
        why: "<strong>False.</strong> Continental crust is thicker (30–70 km) but less dense. Oceanic crust is thinner (5–10 km) but denser. This density difference is key to understanding subduction."
      },
      {
        type: "mcq",
        text: "The inner core is solid even though it is the hottest part of Earth. Why?",
        options: ["It is made of gas", "Extreme pressure keeps it solid", "It is cooled by the outer core", "It is not actually that hot"],
        correct: 1,
        hint: "Think about what happens when you squeeze something really hard — does it become easier or harder to melt?",
        why: "The inner core reaches over 5,000°C, but the <strong>immense pressure</strong> from all the layers above squeezes the iron and nickel so tightly that it stays solid."
      },
      {
        type: "mcq",
        text: "What state of matter is the outer core?",
        options: ["Solid", "Liquid", "Gas", "Plasma"],
        correct: 1,
        hint: "It is made of iron and nickel, but unlike the inner core, the pressure is not quite high enough to keep it solid.",
        why: "The outer core is <strong>liquid</strong> iron and nickel. Its swirling movement creates Earth's magnetic field, which protects us from harmful solar radiation."
      },
      {
        type: "fill",
        text: "Complete the sentence using the word bank.",
        sentence: "The mantle is made mostly of |___| rock that can flow very |___| over millions of years. This slow flow is caused by |___| from the core below.",
        blanks: ["solid", "slowly", "heat"],
        bank: ["heat", "liquid", "solid", "quickly", "slowly", "gravity"],
        hint: "The mantle is NOT liquid — it is solid rock that behaves like a very thick, slow-moving fluid over long time periods. What energy source drives this?",
        why: "The mantle is <strong>solid</strong> rock, but at geological timescales it flows very <strong>slowly</strong> (like extremely thick toffee). This movement is driven by <strong>heat</strong> from the core — a process called convection."
      },
      {
        type: "mcq",
        text: "Which of these is the best analogy for the mantle's behaviour?",
        options: ["Water flowing in a river", "A block of ice sitting still", "Thick honey being slowly heated — it stays thick but gradually moves", "Air blowing in the wind"],
        correct: 2,
        hint: "The mantle is solid, but it is not rigid. It moves incredibly slowly. What everyday substance is thick but can still flow?",
        why: "The mantle behaves like <strong>very thick honey or toffee</strong> being heated. It is technically solid, but over millions of years the rock flows in slow convection currents. It is not a liquid, and it is definitely not a gas."
      }
    ]
  },

  // ======== STAGE 2: CONVECTION CURRENTS ========
  {
    num: 2, title: "The Convection Engine", intention: "I can explain how convection currents in the mantle drive plate movement.",
    questions: [
      {
        type: "order",
        text: "Put the steps of a <strong>convection current</strong> in the mantle in the correct order.",
        items: [
          "Hot rock near the core rises slowly",
          "Rock reaches the top of the mantle and moves sideways",
          "Rock cools down near the crust",
          "Cooler, denser rock sinks back down",
          "The cycle repeats continuously"
        ],
        correct: [0,1,2,3,4],
        hint: "Convection always starts with heating at the bottom. Hot material rises, cools, then sinks — forming a loop.",
        why: "Convection currents are <strong>circular flows</strong> driven by heat from the core. Hot rock rises, spreads sideways beneath the crust (dragging plates), cools, sinks, and repeats. This is the engine that moves tectonic plates."
      },
      {
        type: "mcq",
        text: "What is the main energy source that drives convection currents in the mantle?",
        options: ["Energy from the Sun", "Heat from Earth's core", "Gravity from the Moon", "Wind on the surface"],
        correct: 1,
        hint: "Convection needs a heat source below. Where is the hottest part of Earth?",
        why: "<strong>Radioactive decay</strong> and residual heat from Earth's formation keep the core extremely hot. This heat transfers to the mantle, driving the slow convection currents that move tectonic plates."
      },
      {
        type: "mcq",
        text: "Why does hot rock in the mantle rise upward?",
        options: ["It is pushed up by earthquakes", "It becomes less dense when heated", "Gravity pulls it up", "The crust sucks it up"],
        correct: 1,
        hint: "Think about what happens when you heat water in a pot — why does the warm water rise?",
        why: "When rock is heated, it <strong>expands slightly and becomes less dense</strong> than the cooler rock around it. Less dense material floats upward — just like a hot air balloon rises because hot air is less dense than cool air."
      },
      {
        type: "tf",
        text: "True or False: Convection currents can only happen in liquids, not in solids.",
        correct: false,
        hint: "Remember what you learned about the mantle — it is solid rock, but it still flows very slowly...",
        why: "<strong>False.</strong> Convection can occur in any material that can flow. The mantle is solid, but over millions of years it flows slowly enough for convection to happen. This is sometimes called <strong>solid-state convection</strong>."
      },
      {
        type: "fill",
        text: "Complete the sentence using the word bank.",
        sentence: "When mantle rock is heated, it becomes less |___| and rises. When it cools near the |___| , it becomes more dense and |___| back down.",
        blanks: ["dense", "crust", "sinks"],
        bank: ["dense", "light", "crust", "core", "sinks", "rises"],
        hint: "The key word here is DENSITY. Hot = less dense = rises. Cool = more dense = ?",
        why: "Convection is all about <strong>density</strong>. Heated rock expands, becomes less <strong>dense</strong>, and rises toward the <strong>crust</strong>. Once it cools, it becomes denser and <strong>sinks</strong> back down. This loop is what drags tectonic plates."
      },
      {
        type: "mcq",
        text: "How fast do convection currents move tectonic plates?",
        options: ["A few centimetres per year", "A few metres per day", "A few kilometres per hour", "They don't actually move plates"],
        correct: 0,
        hint: "Think about how fast your fingernails grow...",
        why: "Tectonic plates move at roughly <strong>2–10 cm per year</strong> — about as fast as your fingernails grow. Slow, but over millions of years, this moves continents thousands of kilometres."
      },
      {
        type: "mcq",
        text: "Which everyday example is the BEST model for convection currents?",
        options: ["A ball rolling down a hill", "Heating a pot of soup — warm soup rises from the bottom and cool soup sinks", "Mixing paint in a bucket", "Ice cubes melting in a glass"],
        correct: 1,
        hint: "Which option involves heating from below causing circular movement?",
        why: "Heating soup in a pot is the classic model: heat from the stove (like Earth's core) warms the bottom, hot soup <strong>rises</strong>, spreads across the surface, <strong>cools</strong>, and sinks back down — exactly like mantle convection."
      },
      {
        type: "multi",
        text: "Select ALL the correct statements about convection currents. (Choose more than one.)",
        options: [
          "They move in circular loops",
          "They are driven by heat from the Sun",
          "They cause tectonic plates to move",
          "They only happen in the outer core",
          "Hot material rises because it is less dense",
          "They move very fast — several km per hour"
        ],
        correct: [0, 2, 4],
        hint: "Three of these are correct. Think about what drives convection (not the Sun), where it happens (the mantle), and how fast plates move (very slow).",
        why: "Convection currents move in <strong>circular loops</strong>, <strong>cause plate movement</strong>, and work because <strong>hot material is less dense and rises</strong>. They are driven by core heat (not the Sun), happen in the mantle (not just the outer core), and are extremely slow."
      }
    ]
  },

  // ======== STAGE 3: PLATE BOUNDARIES ========
  {
    num: 3, title: "Plate Boundaries", intention: "I can classify boundary types and predict their effects on Earth's surface.",
    questions: [
      {
        type: "matching",
        text: "Match each <strong>plate boundary type</strong> with its correct description.",
        left: ["Divergent", "Convergent", "Transform"],
        right: ["Plates slide past each other", "Plates move apart", "Plates push together"],
        pairs: [[0,1],[1,2],[2,0]],
        hint: "Think about the word roots: 'diverge' means to separate, 'converge' means to come together, 'transform' means to change direction.",
        why: "At <strong>divergent</strong> boundaries plates pull apart (new crust forms). At <strong>convergent</strong> boundaries plates collide (mountains or subduction). At <strong>transform</strong> boundaries plates grind sideways past each other (earthquakes)."
      },
      {
        type: "matching",
        text: "Match each <strong>real-world example</strong> to the correct boundary type.",
        left: ["Mid-Atlantic Ridge", "Himalayas", "San Andreas Fault", "Mariana Trench"],
        right: ["Transform", "Convergent (ocean-ocean)", "Divergent", "Convergent (continent-continent)"],
        pairs: [[0,2],[1,3],[2,0],[3,1]],
        hint: "The Mid-Atlantic Ridge is where plates pull apart. The Himalayas formed when India crashed into Asia. The San Andreas is where plates slide past each other. The Mariana Trench is where one oceanic plate dives under another.",
        why: "The <strong>Mid-Atlantic Ridge</strong> = divergent (new ocean floor). <strong>Himalayas</strong> = convergent continent-continent (both push up). <strong>San Andreas</strong> = transform (sideways grinding). <strong>Mariana Trench</strong> = convergent ocean-ocean (one subducts)."
      },

// =====================================================================
//  GAME STATE
// =====================================================================
let state = {
  currentStage: -1,
  currentQ: 0,
  score: 0,
  stageScores: [0,0,0,0,0],
  stageMax: [],
  answered: false,
  matchState: null,
  orderState: null,
  fillState: null,
  multiState: null,
  phase: 'intro'
};
STAGES.forEach(s => state.stageMax.push(s.questions.length));

// =====================================================================
//  RENDER ENGINE
// =====================================================================
function render() {
  const app = document.getElementById('app');
  if (state.phase === 'intro') return renderIntro(app);
  if (state.phase === 'final') return renderFinal(app);
  if (state.phase === 'transition') return renderTransition(app);
  renderStage(app);
}

function renderIntro(app) {
  const totalQ = state.stageMax.reduce((a,b) => a+b, 0);
  app.innerHTML = `
    <div class="header">
      <h1>Earth Science Review</h1>
      <div class="subtitle">Grade 6 — General Revision</div>
      <div class="myp-badge">Key Concept: Change</div>
    </div>
    <div class="stage intro-screen">
      <h2>Welcome, Explorer</h2>
      <p>Review everything you've learned about Earth's dynamic interior and how it shapes our planet's surface.</p>
      <div class="soi">"Change in Earth's environment can be understood through models of its internal structure and processes."</div>
      <div class="intro-topics">
        <span class="intro-topic">Layers of the Earth</span>
        <span class="intro-topic">Convection Currents</span>
        <span class="intro-topic">Plate Tectonics</span>
        <span class="intro-topic">Plate Boundaries</span>
        <span class="intro-topic">Continental Drift</span>
        <span class="intro-topic">Earthquakes &amp; Volcanoes</span>
      </div>
      <p>5 stages &middot; ${totalQ} questions &middot; Multiple question types</p>
      <p style="font-size:0.82rem;color:#64748b;margin-top:4px;">MCQ &middot; True/False &middot; Ordering &middot; Matching &middot; Fill-the-Blank &middot; Multi-Select</p>
      <div class="btn-row" style="justify-content:center;margin-top:20px;">
        <button class="btn btn-primary" onclick="startGame()">Start Review</button>
      </div>
    </div>`;
}

function startGame() { state.currentStage = 0; state.currentQ = 0; state.phase = 'playing'; state.answered = false; render(); }

function progressHTML() {
  const labels = STAGES.map((s,i) => {
    let c = i < state.currentStage ? 'completed' : i === state.currentStage ? 'active' : '';
    return `<span class="${c}">${s.title}</span>`;
  }).join('');
  const steps = STAGES.map((_,i) => {
    let c = i < state.currentStage ? 'completed' : i === state.currentStage ? 'active' : '';
    return `<div class="progress-step ${c}"></div>`;
  }).join('');
  return `<div class="progress-bar">${steps}</div><div class="progress-labels">${labels}</div>`;
}

function renderStage(app) {
  const stg = STAGES[state.currentStage];
  const q = stg.questions[state.currentQ];
  let qHTML = '';
  if (q.type === 'mcq') qHTML = renderMCQ(q);
  else if (q.type === 'tf') qHTML = renderTF(q);
  else if (q.type === 'order' || q.type === 'drag-sort') qHTML = renderOrder(q);
  else if (q.type === 'matching') qHTML = renderMatching(q);
  else if (q.type === 'fill') qHTML = renderFill(q);
  else if (q.type === 'multi') qHTML = renderMulti(q);

  app.innerHTML = `
    <div class="header"><h1>Earth Science Review</h1></div>
    ${progressHTML()}
    <div class="score-display">Score <span class="score-num">${state.score}</span></div>
    <div class="stage">
      <div class="stage-header">
        <div class="stage-num">Stage ${stg.num} of 5</div>
        <div class="stage-title">${stg.title}</div>
        <div class="stage-intention">${stg.intention}</div>
      </div>
      <div class="question-counter">Question ${state.currentQ + 1} of ${stg.questions.length}</div>
      <div class="question-text">${q.text}</div>
      ${qHTML}
      <div id="feedback" class="feedback"></div>
      <div class="btn-row" id="btnRow"></div>
    </div>`;

  if (q.type === 'order' || q.type === 'drag-sort') initOrder();
  if (q.type === 'matching') initMatching();
  if (q.type === 'fill') initFill(q);
  if (q.type === 'multi') initMulti();
}

// === MCQ ===
function renderMCQ(q) {
  return `<div class="options">${q.options.map((o,i) =>
    `<button class="option-btn" onclick="checkMCQ(${i})" id="opt${i}">${o}</button>`
  ).join('')}</div>`;
}
function checkMCQ(idx) {
  if (state.answered) return;
  state.answered = true;
  const q = STAGES[state.currentStage].questions[state.currentQ];
  const ok = idx === q.correct;
  document.querySelectorAll('.option-btn').forEach((b,i) => {
    b.classList.add('disabled');
    if (i === q.correct) b.classList.add('correct');
    if (i === idx && !ok) b.classList.add('incorrect');
  });
  if (ok) { state.score++; state.stageScores[state.currentStage]++; }
  showFeedback(ok, q); showNextBtn();
}

// === TRUE / FALSE ===
function renderTF(q) {
  return `<div class="tf-row">
    <button class="tf-btn" id="tfTrue" onclick="checkTF(true)">True</button>
    <button class="tf-btn" id="tfFalse" onclick="checkTF(false)">False</button>
  </div>`;
}
function checkTF(val) {
  if (state.answered) return;
  state.answered = true;
  const q = STAGES[state.currentStage].questions[state.currentQ];
  const ok = val === q.correct;
  document.getElementById('tfTrue').classList.add('disabled');
  document.getElementById('tfFalse').classList.add('disabled');
  const correctId = q.correct ? 'tfTrue' : 'tfFalse';
  const chosenId = val ? 'tfTrue' : 'tfFalse';
  document.getElementById(correctId).classList.add('correct');
  if (!ok) document.getElementById(chosenId).classList.add('incorrect');
  if (ok) { state.score++; state.stageScores[state.currentStage]++; }
  showFeedback(ok, q); showNextBtn();
}

// === ORDER / DRAG-SORT ===
function renderOrder(q) {
  const items = q.type === 'drag-sort' ? [...q.items] : [...q.items];
  // Shuffle
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
  state.orderState = [...items];
  return `<div class="order-list" id="orderList"></div>
    <div style="text-align:center;margin-bottom:8px;">
      <button class="btn btn-primary" onclick="checkOrder()" id="checkOrderBtn">Check Order</button>
    </div>`;
}
function initOrder() { renderOrderList(); }
function renderOrderList() {
  const list = document.getElementById('orderList');
  if (!list) return;
  list.innerHTML = state.orderState.map((item,i) =>
    `<div class="order-item" id="oi${i}">
      <div class="order-num">${i+1}</div>
      <div class="order-text">${item}</div>
      <div class="order-arrows">
        <button class="arrow-btn" onclick="moveOrder(${i},-1)" ${i===0?'disabled':''}>&#9650;</button>
        <button class="arrow-btn" onclick="moveOrder(${i},1)" ${i===state.orderState.length-1?'disabled':''}>&#9660;</button>
      </div>
    </div>`
  ).join('');
}
function moveOrder(idx, dir) {
  if (state.answered) return;
  const n = idx + dir;
  if (n < 0 || n >= state.orderState.length) return;
  [state.orderState[idx], state.orderState[n]] = [state.orderState[n], state.orderState[idx]];
  renderOrderList();
}
function checkOrder() {
  if (state.answered) return;
  state.answered = true;
  const q = STAGES[state.currentStage].questions[state.currentQ];
  const correct = q.type === 'drag-sort' ? q.correct : q.items;
  const ok = state.orderState.every((item,i) => item === correct[i]);
  document.querySelectorAll('.order-item').forEach((el,i) => {
    if (state.orderState[i] === correct[i]) {
      el.style.borderColor = '#22c55e';
      el.querySelector('.order-num').style.background = '#22c55e';
      el.querySelector('.order-num').style.color = '#fff';
    } else { el.style.borderColor = '#ef4444'; }
    el.querySelectorAll('.arrow-btn').forEach(b => b.disabled = true);
  });
  document.getElementById('checkOrderBtn').style.display = 'none';
  if (ok) { state.score++; state.stageScores[state.currentStage]++; }
  showFeedback(ok, q); showNextBtn();
}

// === MATCHING ===
function renderMatching(q) {
  const rm = q.right.map((_,i) => i);
  for (let i = rm.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [rm[i],rm[j]]=[rm[j],rm[i]]; }
  state.matchState = { selected: null, side: null, matched: [], rightMap: rm, attempts: 0 };
  let rows = '';
  for (let i = 0; i < q.left.length; i++) {
    rows += `<div class="match-item" id="mL${i}" onclick="selectMatch('left',${i})">${q.left[i]}</div>
             <div class="match-item" id="mR${rm[i]}" onclick="selectMatch('right',${rm[i]})">${q.right[rm[i]]}</div>`;
  }
  return `<div class="match-grid">
    <div class="match-col-header">Term</div><div class="match-col-header">Description</div>
    ${rows}
  </div><div id="matchHint" style="font-size:0.82rem;color:#64748b;text-align:center;">Select one from each column to match them.</div>`;
}
function initMatching() {}
function selectMatch(side, idx) {
  if (state.answered) return;
  const q = STAGES[state.currentStage].questions[state.currentQ];
  const ms = state.matchState;
  if (ms.matched.some(m => (side==='left'&&m[0]===idx)||(side==='right'&&m[1]===idx))) return;
  const el = document.getElementById(side==='left'?`mL${idx}`:`mR${idx}`);
  el.classList.remove('wrong-flash');

  if (ms.selected !== null && ms.side !== side) {
    const li = side==='left'?idx:ms.selected, ri = side==='right'?idx:ms.selected;
    const pair = q.pairs.find(p => p[0]===li);
    if (pair && pair[1]===ri) {
      ms.matched.push([li,ri]);
      document.getElementById(`mL${li}`).classList.add('matched');
      document.getElementById(`mR${ri}`).classList.add('matched');
      document.getElementById(`mL${li}`).classList.remove('selected');
      document.getElementById(`mR${ri}`).classList.remove('selected');
      if (ms.side==='left') document.getElementById(`mL${ms.selected}`).classList.remove('selected');
      else document.getElementById(`mR${ms.selected}`).classList.remove('selected');
      ms.selected = null; ms.side = null;
      if (ms.matched.length === q.left.length) {
        state.answered = true;
        const ok = ms.attempts < q.left.length;
        if (ok) { state.score++; state.stageScores[state.currentStage]++; }
        showFeedback(true, q); showNextBtn();
      }
    } else {
      ms.attempts++;
      el.classList.add('wrong-flash');
      const prev = document.getElementById(ms.side==='left'?`mL${ms.selected}`:`mR${ms.selected}`);
      prev.classList.add('wrong-flash'); prev.classList.remove('selected');
      ms.selected = null; ms.side = null;
      document.getElementById('matchHint').innerHTML = `<span style="color:#fca5a5;">${q.hint}</span>`;
      setTimeout(() => { el.classList.remove('wrong-flash'); prev.classList.remove('wrong-flash'); }, 500);
    }
  } else {
    if (ms.selected !== null && ms.side === side) {
      document.getElementById(side==='left'?`mL${ms.selected}`:`mR${ms.selected}`).classList.remove('selected');
    }
    el.classList.add('selected'); ms.selected = idx; ms.side = side;
  }
}

// === FILL THE BLANK ===
function renderFill(q) {
  // Build word bank (shuffled)
  const bank = [...q.bank];
  for (let i = bank.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [bank[i],bank[j]]=[bank[j],bank[i]]; }
  state.fillState = { placed: new Array(q.blanks.length).fill(null), activeBlank: 0, bank };

  const parts = q.sentence.split('|___|');
  let html = '<div class="fill-sentence">';
  parts.forEach((p, i) => {
    html += p;
    if (i < parts.length - 1) html += `<span class="blank-slot" id="blank${i}" onclick="selectBlank(${i})">${i === 0 ? '▾' : '▾'}</span>`;
  });
  html += '</div>';
  html += `<div class="word-bank" id="wordBank">${bank.map((w,i) =>
    `<span class="word-chip" id="chip${i}" onclick="placeWord(${i})">${w}</span>`
  ).join('')}</div>`;
  html += `<div style="text-align:center;margin-bottom:8px;">
    <button class="btn btn-primary" onclick="checkFill()" id="checkFillBtn">Check Answer</button>
  </div>`;
  return html;
}
function initFill(q) { highlightBlank(0); }
function selectBlank(idx) {
  if (state.answered) return;
  const fs = state.fillState;
  // If blank already has a word, return it to bank
  if (fs.placed[idx] !== null) {
    const chipIdx = fs.bank.indexOf(fs.placed[idx]);
    if (chipIdx >= 0) document.getElementById(`chip${chipIdx}`).classList.remove('used');
    fs.placed[idx] = null;
    document.getElementById(`blank${idx}`).textContent = '▾';
    document.getElementById(`blank${idx}`).classList.remove('filled');
  }
  fs.activeBlank = idx;
  highlightBlank(idx);
}
function highlightBlank(idx) {
  const q = STAGES[state.currentStage].questions[state.currentQ];
  for (let i = 0; i < q.blanks.length; i++) {
    const el = document.getElementById(`blank${i}`);
    if (el) el.style.borderBottomColor = i === idx ? '#f59e0b' : '#3b82f6';
  }
}
function placeWord(chipIdx) {
  if (state.answered) return;
  const fs = state.fillState;
  const word = fs.bank[chipIdx];
  const chip = document.getElementById(`chip${chipIdx}`);
  if (chip.classList.contains('used')) return;

  // Place in active blank
  const bi = fs.activeBlank;
  // If blank already has a word, return old word
  if (fs.placed[bi] !== null) {
    const oldIdx = fs.bank.indexOf(fs.placed[bi]);
    if (oldIdx >= 0) document.getElementById(`chip${oldIdx}`).classList.remove('used');
  }
  fs.placed[bi] = word;
  chip.classList.add('used');
  const blank = document.getElementById(`blank${bi}`);
  blank.textContent = word;
  blank.classList.add('filled');

  // Move to next empty blank
  const q = STAGES[state.currentStage].questions[state.currentQ];
  for (let i = 0; i < q.blanks.length; i++) {
    const next = (bi + 1 + i) % q.blanks.length;
    if (fs.placed[next] === null) { fs.activeBlank = next; highlightBlank(next); return; }
  }
  highlightBlank(-1); // All filled
}
function checkFill() {
  if (state.answered) return;
  const q = STAGES[state.currentStage].questions[state.currentQ];
  const fs = state.fillState;
  if (fs.placed.includes(null)) {
    document.getElementById('feedback').className = 'feedback incorrect';
    document.getElementById('feedback').innerHTML = 'Fill in all the blanks before checking.';
    document.getElementById('feedback').style.display = 'block';
    return;
  }
  state.answered = true;
  const ok = fs.placed.every((w,i) => w === q.blanks[i]);
  q.blanks.forEach((correct, i) => {
    const el = document.getElementById(`blank${i}`);
    if (fs.placed[i] === correct) el.classList.add('correct-slot');
    else { el.classList.add('incorrect-slot'); el.textContent = correct; }
  });
  document.getElementById('checkFillBtn').style.display = 'none';
  document.querySelectorAll('.word-chip').forEach(c => c.style.cursor = 'default');
  if (ok) { state.score++; state.stageScores[state.currentStage]++; }
  showFeedback(ok, q); showNextBtn();
}

// === MULTI-SELECT ===
function renderMulti(q) {
  return `<div class="multi-options">${q.options.map((o,i) =>
    `<button class="multi-btn" id="multi${i}" onclick="toggleMulti(${i})"><span class="check-box"></span><span>${o}</span></button>`
  ).join('')}</div>
  <div style="text-align:center;margin-bottom:8px;">
    <button class="btn btn-primary" onclick="checkMulti()" id="checkMultiBtn">Check Answer</button>
  </div>`;
}
function initMulti() { state.multiState = { toggled: new Set() }; }
function toggleMulti(idx) {
  if (state.answered) return;
  const ms = state.multiState;
  const el = document.getElementById(`multi${idx}`);
  if (ms.toggled.has(idx)) { ms.toggled.delete(idx); el.classList.remove('toggled'); }
  else { ms.toggled.add(idx); el.classList.add('toggled'); }
}
function checkMulti() {
  if (state.answered) return;
  const q = STAGES[state.currentStage].questions[state.currentQ];
  const ms = state.multiState;
  if (ms.toggled.size === 0) {
    document.getElementById('feedback').className = 'feedback incorrect';
    document.getElementById('feedback').innerHTML = 'Select at least one option before checking.';
    document.getElementById('feedback').style.display = 'block';
    return;
  }
  state.answered = true;
  const correctSet = new Set(q.correct);
  const ok = ms.toggled.size === correctSet.size && [...ms.toggled].every(v => correctSet.has(v));

  q.options.forEach((_, i) => {
    const el = document.getElementById(`multi${i}`);
    el.classList.add('disabled');
    if (correctSet.has(i) && ms.toggled.has(i)) el.classList.add('correct');
    else if (!correctSet.has(i) && ms.toggled.has(i)) el.classList.add('incorrect');
    else if (correctSet.has(i) && !ms.toggled.has(i)) el.classList.add('missed');
  });
  document.getElementById('checkMultiBtn').style.display = 'none';
  if (ok) { state.score++; state.stageScores[state.currentStage]++; }
  showFeedback(ok, q); showNextBtn();
}

// === FEEDBACK & NAV ===
function showFeedback(ok, q) {
  const fb = document.getElementById('feedback');
  fb.className = ok ? 'feedback correct' : 'feedback incorrect';
  fb.innerHTML = ok
    ? `&#10003; Correct!<div class="why">${q.why}</div>`
    : `&#10007; Not quite. ${q.hint}<div class="why"><strong>The answer:</strong> ${q.why}</div>`;
}
function showNextBtn() {
  const stg = STAGES[state.currentStage];
  const lastQ = state.currentQ >= stg.questions.length - 1;
  const lastS = state.currentStage >= STAGES.length - 1;
  const row = document.getElementById('btnRow');
  if (lastQ && lastS) row.innerHTML = `<button class="btn btn-success" onclick="showFinal()">See Results</button>`;
  else if (lastQ) row.innerHTML = `<button class="btn btn-success" onclick="nextStage()">Complete Stage →</button>`;
  else row.innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">Next Question →</button>`;
}
function nextQuestion() { state.currentQ++; state.answered = false; state.matchState = null; state.orderState = null; state.fillState = null; state.multiState = null; render(); }
function nextStage() { state.phase = 'transition'; render(); }

function renderTransition(app) {
  const stg = STAGES[state.currentStage];
  const sc = state.stageScores[state.currentStage], mx = state.stageMax[state.currentStage];
  const pct = Math.round(sc/mx*100);
  const emoji = pct>=70?'🌟':pct>=50?'👍':'💪';
  const msg = pct>=70?'Great work!':pct>=50?'Good effort — keep building!':'Keep going — revision builds mastery!';
  const nxt = STAGES[state.currentStage+1];
  app.innerHTML = `
    <div class="header"><h1>Earth Science Review</h1></div>
    ${progressHTML()}
    <div class="score-display">Score <span class="score-num">${state.score}</span></div>
    <div class="stage transition-screen">
      <div class="emoji">${emoji}</div>
      <h2>Stage ${stg.num} Complete: ${stg.title}</h2>
      <div class="stage-score">${sc} / ${mx} (${pct}%)</div>
      <p>${msg}</p>
      <p style="margin-top:20px;color:#64748b;">Next up:</p>
      <h2 style="font-size:1.1rem;color:#93c5fd;">Stage ${nxt.num}: ${nxt.title}</h2>
      <p style="color:#94a3b8;font-style:italic;font-size:0.85rem;">${nxt.intention}</p>
      <div class="btn-row" style="justify-content:center;margin-top:24px;">
        <button class="btn btn-primary" onclick="proceedNext()">Continue →</button>
      </div>
    </div>`;
}
function proceedNext() { state.currentStage++; state.currentQ = 0; state.answered = false; state.phase = 'playing'; render(); }

function showFinal() { state.phase = 'final'; render(); }
function renderFinal(app) {
  const total = state.stageMax.reduce((a,b)=>a+b,0);
  const pct = Math.round(state.score/total*100);
  let grade = pct>=90?'Outstanding':pct>=70?'Proficient':pct>=50?'Developing':'Emerging';
  let emoji = pct>=90?'🏆':pct>=70?'🌟':pct>=50?'📈':'🌱';
  const bd = STAGES.map((s,i) =>
    `<div class="stage-result"><span class="name">${s.title}</span><span class="sc">${state.stageScores[i]}/${state.stageMax[i]}</span></div>`
  ).join('');
  app.innerHTML = `
    <div class="header"><h1>Earth Science Review</h1></div>
    <div class="stage final-screen">
      <div style="font-size:3rem;">${emoji}</div>
      <h2>Review Complete!</h2>
      <div class="final-score">${state.score} / ${total} (${pct}%)</div>
      <div class="grade">${grade}</div>
      <div class="stage-breakdown">${bd}</div>
      <div class="transfer-prompt">
        <h3>Now think about this...</h3>
        <p>Everything you reviewed connects through one idea: <strong>change</strong>. Heat deep inside Earth drives convection, which moves plates, which reshapes the surface over millions of years. Next time you see a mountain range, a volcanic island, or hear about an earthquake — you now understand the engine driving it all.</p>
        <p style="margin-top:10px;">Where in the world can you find evidence of these processes happening <em>right now</em>?</p>
      </div>
      <div class="btn-row" style="justify-content:center;margin-top:20px;">
        <button class="btn btn-secondary" onclick="resetGame()">Try Again</button>
      </div>
    </div>`;
}
function resetGame() {
  state = { currentStage:-1, currentQ:0, score:0, stageScores:[0,0,0,0,0], stageMax:state.stageMax,
    answered:false, matchState:null, orderState:null, fillState:null, multiState:null, phase:'intro' };
  render();
}

render();
</script>

  ATL: Critical thinking (cause-effect chains, evaluating evidence)

  Question Types Used: MCQ, True/False, Ordering, Matching, Fill-the-Blank, Multi-Select (40 questions total)

  Suggested Debrief Questions:
  1. How does the concept of "change" connect what happens inside Earth to what we see on the surface?
  2. Why was Wegener's evidence not enough to convince scientists at first? What does this tell us about how science works?
  3. If you could place a GPS tracker on any tectonic plate, which would you choose and why?
  4. How might life on Earth be different if convection currents stopped?
  5. What is the relationship between the type of plate boundary and the type of hazard produced?

  Differentiation:
  - Support: Students can work in pairs. Print hint text as a scaffold sheet. Allow two attempts per question.
  - Extension: After completing, students draw a single cause-chain diagram connecting all 5 stages. Or write a "letter from Wegener" explaining his frustration.

  Estimated Play Time: 25-30 minutes total (~5-6 min per stage)
-->
