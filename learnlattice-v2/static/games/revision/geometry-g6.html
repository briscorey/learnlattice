<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Review. Grade 6</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:var(--bg);--sf:var(--sf);--sf2:var(--sf2);--bd:var(--mt2);--tx:var(--tx);--txb:var(--txb);--mt:var(--mt);--mt2:var(--mt2);--pr:var(--pr);--ok:var(--ok);--er:var(--er);--wa:var(--wa);--ac:var(--ac);--ac2:var(--ac2);--sh:rgba(0,0,0,.3)}@media(prefers-color-scheme:light){:root{--bg:var(--txb);--sf:#ffffff;--sf2:#f1f5f9;--bd:var(--tx);--tx:var(--sf);--txb:var(--bg);--mt:var(--mt);--mt2:var(--mt);--pr:var(--pr);--ok:#16a34a;--er:#dc2626;--wa:#d97706;--ac:var(--ac2);--ac2:var(--ac2);--sh:rgba(0,0,0,.08)}}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}.app{display:flex;flex-direction:column;min-height:100vh;max-width:900px;margin:0 auto;padding:16px}.header{text-align:center;padding:16px 0 8px}.header h1{font-size:1.5rem;font-weight:700;color:var(--txb)}.header .sub{font-size:.82rem;color:var(--mt);margin-top:2px}.myp-badge{display:inline-block;background:rgba(13,148,136,.15);color:var(--ac);font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-top:6px}.tabs{display:flex;gap:4px;margin:14px 0 16px;background:var(--sf);border-radius:12px;padding:4px}.tab{flex:1;padding:10px;text-align:center;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--mt);transition:all .2s;border:none;background:0 0;font-family:inherit}.tab.active{background:var(--bg);color:var(--txb);box-shadow:0 2px 8px rgba(0,0,0,.3)}.tab:hover:not(.active){color:var(--tx)}.tab-panel{display:none}.tab-panel.active{display:flex;flex-direction:column;flex:1}.progress-bar{display:flex;gap:5px;margin-bottom:6px}.prog-step{flex:1;height:5px;border-radius:3px;background:var(--sf);transition:background .4s}.prog-step.done{background:var(--ok)}.prog-step.now{background:var(--pr);animation:pulse size:.8rem;color:var(--mt)}.fb .why strong{color:#cbd5e1}.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.opt{background:var(--bg);border:2px solid var(--sf2);border-radius:10px;padding:12px 16px;font-size:.9rem;color:var(--tx);cursor:pointer;text-align:left;transition:all .15s;font-family:inherit}.opt:hover:not(.dis){border-color:var(--pr);background:rgba(59,130,246,.06)}.opt.cor{border-color:var(--ok);background:rgba(34,197,94,.1);color:#86efac}.opt.inc{border-color:var(--er);background:rgba(239,68,68,.06);color:#fca5a5}.opt.dis{cursor:default;opacity:.55}.btn-row{display:flex;gap:10px;margin-top:auto;padding-top:14px;justify-content:flex-end}.btn{padding:10px 24px;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}.btn-p{background:var(--pr);color:#fff}.btn-p:hover{background:#2563eb}.btn-g{background:var(--ok);color:#fff}.btn-g:hover{background:#16a34a}.btn-s{background:var(--sf2);color:var(--tx)}.btn-s:hover{background:var(--mt2)}.score-chip{position:fixed;top:14px;right:14px;background:var(--sf);border:1px solid var(--sf2);border-radius:10px;padding:8px 14px;font-size:.78rem;color:var(--mt);z-index:20}.score-chip b{font-size:1rem;color:var(--txb)}.trans{text-align:center;padding:36px 20px}.trans .em{font-size:2.8rem;margin-bottom:14px}.trans h2{font-size:1.2rem;color:#f1f5f9;margin-bottom:6px}.trans .sc{font-size:1rem;color:var(--ok);font-weight:600;margin:10px 0}.trans p{color:var(--mt);font-size:.88rem}.final{text-align:center;padding:36px 20px}.final h2{font-size:1.4rem;color:var(--txb);margin-bottom:6px}.final .big{font-size:2.6rem;font-weight:800;color:var(--ok);margin:12px 0}.final .grd{font-size:.95rem;color:var(--mt);margin-bottom:20px}.stg-bd{display:flex;flex-direction:column;gap:6px;margin:16px auto;max-width:360px;text-align:left}.stg-r{display:flex;justify-content:space-between;padding:7px 12px;background:var(--bg);border-radius:7px;font-size:.82rem}.stg-r .n{color:var(--mt)}.stg-r .s{color:var(--ok);font-weight:600}.transfer{background:rgba(13,148,136,.1);border:1px solid rgba(13,148,136,.3);border-radius:10px;padding:16px;margin-top:20px;text-align:left}.transfer h3{color:var(--ac);font-size:.82rem;margin-bottom:6px}.transfer p{color:var(--tx);font-size:.85rem;line-height:1.5}.intro{text-align:center;padding:24px 16px}.intro h2{font-size:1.4rem;margin-bottom:10px;color:var(--txb)}.intro p{color:var(--mt);font-size:.9rem;margin-bottom:6px;line-height:1.5}.intro-topics{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}.intro-topic{background:rgba(13,148,136,.12);color:var(--ac);padding:5px 12px;border-radius:18px;font-size:.78rem;font-weight:500}.soi{background:rgba(13,148,136,.08);border-left:3px solid var(--ac2);padding:10px 14px;margin:14px 0;text-align:left;font-size:.82rem;color:var(--ac);font-style:italic;line-height:1.5;border-radius:0 8px 8px 0}.fs-search{width:100%;padding:12px 16px;border-radius:10px;border:2px solid var(--sf2);background:var(--bg);color:var(--tx);font-size:.92rem;font-family:inherit;margin-bottom:14px;transition:border-color .2s}.fs-search:focus{outline:0;border-color:var(--ac2)}.fs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow-y:auto;flex:1;padding-bottom:16px}.fs-card{background:var(--sf);border:1px solid var(--sf2);border-radius:12px;padding:14px;transition:all .2s}.fs-card.hide{display:none}.fs-card:hover{border-color:var(--ac2)}.fs-name{font-size:.82rem;font-weight:700;color:var(--ac);margin-bottom:4px}.fs-cat{font-size:.62rem;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.fs-formula{font-size:.95rem;font-weight:600;color:var(--txb);background:var(--bg);padding:8px 10px;border-radius:8px;text-align:center;margin-bottom:6px;font-family:'Courier New',monospace}.fs-note{font-size:.72rem;color:var(--mt);line-height:1.4}.fs-visual{text-align:center;margin:6px 0}.fs-visual svg{max-width:100px;height:auto}.calc-toggle{position:fixed;bottom:16px;right:16px;width:48px;height:48px;border-radius:50%;background:var(--ac2);color:#fff;border:none;font-size:1.4rem;cursor:pointer;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:transform .15s;display:flex;align-items:center;justify-content:center}.calc-toggle:hover{transform:scale(1.1)}.calc-overlay{display:none;position:fixed;bottom:76px;right:16px;width:260px;background:var(--sf);border:1px solid var(--sf2);border-radius:14px;padding:14px;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.5)}.calc-overlay.open{display:block}.calc-display{background:var(--bg);border:1px solid var(--sf2);border-radius:8px;padding:10px 12px;font-size:1.3rem;font-family:'Courier New',monospace;color:var(--txb);text-align:right;margin-bottom:10px;min-height:44px;word-break:break-all;overflow:hidden}.calc-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calc-btn{padding:12px 0;border-radius:8px;border:1px solid var(--sf2);background:var(--bg);color:var(--tx);font-size:1rem;font-family:inherit;cursor:pointer;transition:all .1s;text-align:center}.calc-btn:hover{background:var(--sf2)}.calc-btn.op{background:var(--sf2);color:var(--ac)}.calc-btn.eq{background:var(--ac2);color:#fff;font-weight:700}.calc-btn.cl{background:var(--er);color:#fff;font-size:.85rem}.calc-btn.wide{grid-column:span 2}@media(max-width:600px){.app{padding:10px}.stage{padding:16px}.fs-grid{grid-template-columns:1fr}.score-chip{top:auto;bottom:70px;right:10px}.calc-overlay{width:calc(100vw - 32px);right:16px;left:16px}}.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200;overflow:hidden}.confetti-piece{position:absolute;width:8px;height:8px;top:-10px;border-radius:2px;animation:cFall 1.8s ease-out forwards}@keyframes cFall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(720deg) scale(.3);opacity:0}}.score-pop{position:fixed;z-index:150;font-family:'Segoe UI',system-ui,sans-serif;font-size:18px;font-weight:700;color:var(--ok);pointer-events:none;animation:sPop 1s ease-out forwards}.score-miss{position:fixed;z-index:150;font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;font-weight:700;color:var(--er);pointer-events:none;animation:sPop .8s ease-out forwards}@keyframes sPop{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.3)}}.score-chip.s2{filter:drop-shadow(0 0 4px rgba(251,191,36,.4))}.score-chip.s5{filter:drop-shadow(0 0 8px rgba(251,191,36,.6));color:#f59e0b}.score-chip.s10{filter:drop-shadow(0 0 14px rgba(245,158,11,.8));animation:flPulse .6s ease infinite;color:var(--er)}@keyframes flPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes shakeIt{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}.shake{animation:shakeIt .4s ease}.diff-stars{display:inline-block;margin-left:8px;font-size:11px;letter-spacing:1px}.diff-stars .star-on{color:var(--wa)}.diff-stars .star-off{color:var(--sf2)}.stage.correct-glow{animation:cGlow .6s ease}@keyframes cGlow{0%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 20px 4px rgba(34,197,94,.15)}100%{box-shadow:none}}.stage.wrong-glow{animation:wGlow .5s ease}@keyframes wGlow{0%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 15px 3px rgba(239,68,68,.1)}100%{box-shadow:none}}.trans.stage-celebrate{position:relative}.trans.stage-celebrate::before{content:'';position:absolute;top:50%;left:50%;width:200px;height:200px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(74,222,128,.15) 0,transparent 70%);animation:celPulse 1.5s ease-out;pointer-events:none}@keyframes celPulse{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}</style></head><body><div class="app" id="app"><div class="header"><h1>Geometry Review</h1><div class="sub">Grade 6. Perimeter, Area, Volume & Capacity</div><div class="myp-badge">Key Concept: Form</div></div><div class="tabs"><button class="tab active" onclick='switchTab("review")'>📝 Review</button> <button class="tab" onclick='switchTab("formulas")'>📐 Formula Sheet</button></div><div id="reviewPanel" class="tab-panel active"></div><div id="formulaPanel" class="tab-panel"></div></div><button class="calc-toggle" onclick="toggleCalc()" title="Calculator">🧮</button><div class="calc-overlay" id="calcPanel"><div class="calc-display" id="calcDisp">0</div><div class="calc-btns"><button class="calc-btn cl" onclick="calcClear()">C</button> <button class="calc-btn op" onclick='calcInput("(")'>(</button> <button class="calc-btn op" onclick='calcInput(")")'>)</button> <button class="calc-btn op" onclick='calcInput("÷")'>÷</button> <button class="calc-btn" onclick='calcInput("7")'>7</button> <button class="calc-btn" onclick='calcInput("8")'>8</button> <button class="calc-btn" onclick='calcInput("9")'>9</button> <button class="calc-btn op" onclick='calcInput("×")'>×</button> <button class="calc-btn" onclick='calcInput("4")'>4</button> <button class="calc-btn" onclick='calcInput("5")'>5</button> <button class="calc-btn" onclick='calcInput("6")'>6</button> <button class="calc-btn op" onclick='calcInput("-")'>-</button> <button class="calc-btn" onclick='calcInput("1")'>1</button> <button class="calc-btn" onclick='calcInput("2")'>2</button> <button class="calc-btn" onclick='calcInput("3")'>3</button> <button class="calc-btn op" onclick='calcInput("+")'>+</button> <button class="calc-btn wide" onclick='calcInput("0")'>0</button> <button class="calc-btn" onclick='calcInput(".")'>.</button> <button class="calc-btn eq" onclick="calcEval()">=</button> <button class="calc-btn" onclick='calcInput("π")'>π</button> <button class="calc-btn" onclick='calcInput("²")'>x²</button> <button class="calc-btn" onclick='calcInput("√")'>√</button> <button class="calc-btn op" onclick="calcBackspace()">⌫</button></div></div><script>const FORMULAS=[{name:"Rectangle. Perimeter",cat:"Perimeter",formula:"P = 2(l + w)",note:"l = length, w = width. Add all four sides.",tags:"rectangle perimeter"},{name:"Square. Perimeter",cat:"Perimeter",formula:"P = 4s",note:"s = side length. All four sides are equal.",tags:"square perimeter"},{name:"Triangle. Perimeter",cat:"Perimeter",formula:"P = a + b + c",note:"Add all three side lengths together.",tags:"triangle perimeter"},{name:"Circle. Circumference",cat:"Perimeter",formula:"C = 2πr  or  C = πd",note:"r = radius, d = diameter. π ≈ 3.14",tags:"circle circumference perimeter"},{name:"Rectangle. Area",cat:"Area",formula:"A = l × w",note:"l = length, w = width.",tags:"rectangle area"},{name:"Square. Area",cat:"Area",formula:"A = s²",note:"s = side length. Multiply the side by itself.",tags:"square area"},{name:"Triangle. Area",cat:"Area",formula:"A = ½ × b × h",note:"b = base, h = perpendicular height (not the slant).",tags:"triangle area"},{name:"Parallelogram. Area",cat:"Area",formula:"A = b × h",note:"b = base, h = perpendicular height.",tags:"parallelogram area"},{name:"Trapezium. Area",cat:"Area",formula:"A = ½(a + b) × h",note:"a and b = parallel sides, h = height.",tags:"trapezium trapezoid area"},{name:"Circle. Area",cat:"Area",formula:"A = πr²",note:"r = radius. Square the radius first, then multiply by π.",tags:"circle area"},{name:"Rectangular Prism. Volume",cat:"Volume",formula:"V = l × w × h",note:"l = length, w = width, h = height. Also called a cuboid.",tags:"rectangular prism cuboid volume box"},{name:"Cube. Volume",cat:"Volume",formula:"V = s³",note:"s = side length. All edges are equal.",tags:"cube volume"},{name:"Triangular Prism. Volume",cat:"Volume",formula:"V = ½ × b × h × l",note:"b = base of triangle, h = height of triangle, l = length/depth of prism.",tags:"triangular prism volume"},{name:"Cylinder. Volume",cat:"Volume",formula:"V = πr²h",note:"r = radius of circular base, h = height.",tags:"cylinder volume"},{name:"Cone. Volume",cat:"Volume",formula:"V = ⅓πr²h",note:"r = radius of base, h = height. It's ⅓ of a cylinder.",tags:"cone volume"},{name:"Sphere. Volume",cat:"Volume",formula:"V = ⁴⁄₃πr³",note:"r = radius. Cube the radius, multiply by π, then by 4/3.",tags:"sphere volume ball"},{name:"Capacity Conversion",cat:"Capacity",formula:"1 cm³ = 1 mL\n1000 cm³ = 1 L",note:"Volume in cm³ converts directly to mL. Divide by 1000 for litres.",tags:"capacity litres millilitres conversion"}];function rnd(e,t){return Math.floor(Math.random()*(t-e+1))+e}function rnd1(e,t){return Math.round(10*(Math.random()*(t-e)+e))/10}const PI=Math.PI;function genQ(e){let t=[];if(0===e){t.push({text:"Find the <strong>perimeter</strong> of a rectangle with length "+rnd(5,15)+" cm and width "+rnd(3,9)+" cm.",get ans(){return 2*(parseInt(this.text.match(/length (\d+)/)[1])+parseInt(this.text.match(/width (\d+)/)[1]))},unit:"cm",hint:"P = 2(l + w). Add length and width, then multiply by 2.",shape:"rect"}),t.push({text:"A square has a side length of "+rnd(4,12)+" cm. What is its <strong>perimeter</strong>?",get ans(){return 4*parseInt(this.text.match(/of (\d+)/)[1])},unit:"cm",hint:"P = 4 × side. All four sides are equal.",shape:"square"}),t.push({text:"A triangle has sides of "+rnd(5,10)+" cm, "+rnd(6,12)+" cm, and "+rnd(4,9)+" cm. Find the <strong>perimeter</strong>.",get ans(){let e=this.text.match(/of (\d+) cm, (\d+) cm, and (\d+)/);return+e[1]+ +e[2]+ +e[3]},unit:"cm",hint:"P = a + b + c. Just add all three sides.",shape:"tri"});let e=rnd(4,14);t.push({text:"A circle has a diameter of "+e+" cm. Calculate the <strong>circumference</strong>. Give your answer to 1 decimal place.",get ans(){return Math.round(PI*e*10)/10},unit:"cm",hint:"C = πd. Multiply π by the diameter.",shape:"circle",dp:1});let a=rnd(3,10);t.push({text:"A circle has a radius of "+a+" cm. Calculate the <strong>circumference</strong>. Give your answer to 1 decimal place.",get ans(){return Math.round(2*PI*a*10)/10},unit:"cm",hint:"
