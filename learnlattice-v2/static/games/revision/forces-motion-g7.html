<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forces & Motion — Grade 7 Review</title>
<!-- MYP Alignment
   Criteria: A – Knowing & Understanding
   Key Concept: Relationships
   Related Concepts: Function, Interaction
   ATL: Critical thinking
   Global Context: Scientific and Technical Innovation
-->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface-2: #242836;
  --border: #2e3348;
  --text: #e8eaf0;
  --text-muted: #8b90a5;
  --primary: #6c8cff;
  --primary-glow: rgba(108,140,255,0.15);
  --success: #4ade80;
  --success-glow: rgba(74,222,128,0.15);
  --error: #f87171;
  --error-glow: rgba(248,113,113,0.15);
  --warning: #fbbf24;
  --accent: #a78bfa;
  --radius: 12px;
  --radius-sm: 8px;
}

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap');

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* === LAYOUT === */
.app { max-width: 720px; margin: 0 auto; padding: 16px; }

/* === HEADER BAR === */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.header-right { display: flex; align-items: center; gap: 16px; }

/* Progress Ring */
.progress-ring-wrap { position: relative; width: 48px; height: 48px; }
.progress-ring { transform: rotate(-90deg); }
.progress-ring-bg { fill: none; stroke: var(--border); stroke-width: 4; }
.progress-ring-fill { fill: none; stroke: var(--primary); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
.progress-ring-text {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 11px; font-weight: 700; color: var(--primary);
  font-family: 'JetBrains Mono', monospace;
}

/* Streak */
.streak {
  display: flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px; font-weight: 600; color: var(--warning);
}
.streak svg { width: 20px; height: 20px; }

/* Score */
.score-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px; color: var(--text-muted);
}
.score-display span { color: var(--success); font-weight: 600; }

/* === STAGE INDICATOR === */
.stage-bar {
  display: flex; gap: 4px; margin-bottom: 16px;
}
.stage-pip {
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--border); transition: background 0.4s;
}
.stage-pip.active { background: var(--primary); }
.stage-pip.complete { background: var(--success); }

.stage-label {
  text-align: center; margin-bottom: 16px;
  font-size: 13px; color: var(--text-muted); font-weight: 500;
  letter-spacing: 0.5px; text-transform: uppercase;
}

/* === QUESTION CARD === */
.q-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; margin-bottom: 16px;
  animation: fadeIn 0.35s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

.q-number {
  font-size: 12px; font-weight: 600; color: var(--primary);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
}
.q-type-badge {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 4px; margin-left: 8px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.q-type-badge.calc { background: rgba(251,191,36,0.15); color: var(--warning); }
.q-type-badge.diagram { background: rgba(167,139,250,0.15); color: var(--accent); }
.q-type-badge.drag { background: rgba(108,140,255,0.15); color: var(--primary); }
.q-type-badge.scenario { background: rgba(74,222,128,0.15); color: var(--success); }
.q-type-badge.mcq { background: rgba(139,144,165,0.15); color: var(--text-muted); }

.q-text {
  font-size: 17px; font-weight: 500; line-height: 1.6;
  margin-bottom: 20px;
}
.q-text .keyword { color: var(--primary); font-weight: 600; }

/* === MCQ OPTIONS === */
.options { display: flex; flex-direction: column; gap: 8px; }
.opt-btn {
  display: block; width: 100%; text-align: left;
  padding: 14px 16px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); font-size: 15px; font-family: inherit;
  cursor: pointer; transition: all 0.2s;
}
.opt-btn:hover:not(.locked) { border-color: var(--primary); background: var(--primary-glow); }
.opt-btn.correct { border-color: var(--success); background: var(--success-glow); color: var(--success); }
.opt-btn.incorrect { border-color: var(--error); background: var(--error-glow); color: var(--error); }
.opt-btn.locked { cursor: default; opacity: 0.6; }
.opt-btn.reveal { border-color: var(--success); background: var(--success-glow); }

/* === CALC INPUT === */
.calc-input-wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.calc-input {
  flex: 1; min-width: 120px; padding: 12px 16px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 16px;
  outline: none; transition: border-color 0.2s;
}
.calc-input:focus { border-color: var(--primary); }
.calc-input.correct { border-color: var(--success); }
.calc-input.incorrect { border-color: var(--error); }
.calc-unit { font-size: 14px; color: var(--text-muted); font-weight: 500; min-width: 30px; }
.calc-submit {
  padding: 12px 24px; border: none; border-radius: var(--radius-sm);
  background: var(--primary); color: #fff; font-weight: 600;
  font-family: inherit; font-size: 14px; cursor: pointer;
  transition: opacity 0.2s;
}
.calc-submit:hover { opacity: 0.85; }
.calc-submit:disabled { opacity: 0.4; cursor: default; }

/* === DRAG SORT === */
.drag-zone {
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px; background: var(--surface-2);
  border: 2px dashed var(--border); border-radius: var(--radius);
  min-height: 60px; transition: border-color 0.2s;
}
.drag-zone.over { border-color: var(--primary); }
.drag-item {
  padding: 12px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  cursor: grab; font-size: 14px; font-weight: 500;
  user-select: none; transition: all 0.2s; display: flex;
  align-items: center; gap: 10px;
}
.drag-item:active { cursor: grabbing; opacity: 0.7; }
.drag-item .grip { color: var(--text-muted); font-size: 16px; }
.drag-item.correct-pos { border-color: var(--success); background: var(--success-glow); }
.drag-item.incorrect-pos { border-color: var(--error); background: var(--error-glow); }
.drag-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.drag-submit { margin-top: 8px; }

/* === FORCE DIAGRAM === */
.diagram-wrap {
  display: flex; justify-content: center;
  margin: 16px 0; padding: 16px;
  background: var(--surface-2); border-radius: var(--radius);
}
.diagram-wrap svg { max-width: 100%; height: auto; }

/* === FEEDBACK === */
.feedback {
  margin-top: 16px; padding: 14px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px; line-height: 1.5;
  animation: fadeIn 0.3s ease;
}
.feedback.correct { background: var(--success-glow); border-left: 3px solid var(--success); }
.feedback.incorrect { background: var(--error-glow); border-left: 3px solid var(--error); }
.feedback strong { display: block; margin-bottom: 4px; }

.next-btn {
  display: block; width: 100%; margin-top: 16px;
  padding: 14px; border: none; border-radius: var(--radius-sm);
  background: var(--primary); color: #fff; font-size: 15px;
  font-weight: 600; font-family: inherit; cursor: pointer;
  transition: opacity 0.2s;
}
.next-btn:hover { opacity: 0.85; }

/* === INTRO / STAGE TRANSITION / RESULTS === */
.screen {
  text-align: center; padding: 40px 20px;
  animation: fadeIn 0.4s ease;
}
.screen h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.screen h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.screen p { color: var(--text-muted); font-size: 15px; margin-bottom: 6px; }
.screen .soi {
  font-style: italic; color: var(--accent);
  font-size: 13px; margin: 16px auto; max-width: 480px;
}
.screen .start-btn {
  display: inline-block; margin-top: 24px; padding: 14px 40px;
  background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius-sm); font-size: 16px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: opacity 0.2s;
}
.screen .start-btn:hover { opacity: 0.85; }

.stage-complete-icon { font-size: 48px; margin-bottom: 16px; }

/* === ACHIEVEMENTS === */
.achievements {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 10px; margin: 20px 0;
}
.badge {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px; font-size: 12px;
  font-weight: 600; background: var(--surface-2);
  border: 1px solid var(--border); color: var(--text-muted);
  transition: all 0.3s;
}
.badge.earned { border-color: var(--warning); color: var(--warning); background: rgba(251,191,36,0.1); }
.badge .badge-icon { font-size: 16px; }

/* Achievement popup */
.achievement-popup {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 12px 24px; background: var(--surface);
  border: 1px solid var(--warning); border-radius: var(--radius);
  color: var(--warning); font-weight: 600; font-size: 14px;
  z-index: 100; animation: popIn 0.4s ease, popOut 0.4s ease 2.2s forwards;
  box-shadow: 0 4px 20px rgba(251,191,36,0.2);
}
@keyframes popIn { from { opacity:0; transform:translateX(-50%) translateY(-20px); } }
@keyframes popOut { to { opacity:0; transform:translateX(-50%) translateY(-20px); } }

/* Results summary */
.results-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
  gap: 12px; margin: 24px 0; text-align: center;
}
.result-stat {
  padding: 16px; background: var(--surface-2);
  border-radius: var(--radius-sm); border: 1px solid var(--border);
}
.result-stat .val {
  font-size: 28px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.result-stat .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.transfer-prompt {
  margin-top: 24px; padding: 16px; background: var(--primary-glow);
  border: 1px solid var(--primary); border-radius: var(--radius);
  font-size: 14px; color: var(--primary); text-align: left;
}
.transfer-prompt strong { display: block; margin-bottom: 4px; }

/* === MOBILE === */
@media (max-width: 480px) {
  .app { padding: 10px; }
  .header { padding: 10px 12px; }
  .q-card { padding: 18px 16px; }
  .q-text { font-size: 15px; }
  .opt-btn { padding: 12px 14px; font-size: 14px; }
  .screen h1 { font-size: 24px; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// === FORCES & MOTION G7 REVIEW — 44 QUESTIONS ===
// === MYP Alignment: Criterion A, Key Concept: Relationships ===

const STAGES = [
  { name: "Recall & Recognise", desc: "I can identify and name forces and motion vocabulary.", qRange: [0,8] },
  { name: "Calculate & Apply", desc: "I can use formulas to calculate force, speed, and weight.", qRange: [9,17] },
  { name: "Interpret Diagrams", desc: "I can read and interpret force diagrams and determine net force.", qRange: [18,26] },
  { name: "Analyse & Transfer", desc: "I can apply forces concepts to real-world scenarios.", qRange: [27,35] },
  { name: "Evaluate & Synthesise", desc: "I can evaluate complex situations, spot errors, and reason about motion.", qRange: [36,43] }
];

// Question types: mcq, calc, drag, diagram, scenario
const QUESTIONS = [
  // === STAGE 1: Recall & Recognise (Q0–Q8) ===
  { type:"mcq", q:"What is a <span class='keyword'>force</span>?",
    opts:["A push or pull that acts on an object","The mass of an object","The weight of an object","The speed of an object"],
    ans:0, hint:"Think about what happens when you push a door or pull a rope.", why:"A force is a push or a pull that can change the motion, shape, or direction of an object." },
  { type:"mcq", q:"Which unit do we use to measure <span class='keyword'>force</span>?",
    opts:["Metres per second (m/s)","Newtons (N)","Joules (J)","Kilograms (kg)"],
    ans:1, hint:"This unit is named after a famous scientist who studied gravity.", why:"Force is measured in Newtons (N), named after Sir Isaac Newton." },
  { type:"mcq", q:"What is the difference between <span class='keyword'>mass</span> and <span class='keyword'>weight</span>?",
    opts:["They are the same thing","Weight is measured in kilograms","Mass is the amount of matter; weight is the force of gravity on that matter","Mass changes on different planets; weight stays the same"],
    ans:2, hint:"One of these changes if you go to the Moon. The other does not.", why:"Mass (kg) is how much matter is in an object — it stays the same everywhere. Weight (N) is the gravitational force on that mass — it changes with gravity." },
  { type:"mcq", q:"Which of these is a <span class='keyword'>contact force</span>?",
    opts:["Gravity","Magnetism","Electrostatic force","Friction"],
    ans:3, hint:"Contact forces need objects to be touching.", why:"Friction is a contact force — it happens when two surfaces rub against each other. Gravity, magnetism, and electrostatic forces can act at a distance." },
  { type:"mcq", q:"Which of these is a <span class='keyword'>non-contact force</span>?",
    opts:["Air resistance","Gravity","Normal force","Friction"],
    ans:1, hint:"Non-contact forces can act without the objects touching.", why:"Gravity acts at a distance — the Earth pulls you down without touching you. Friction, air resistance, and normal force all require contact." },
  { type:"diagram", q:"Look at this diagram. The same box is pushed with the same force across three surfaces. Which surface has the <span class='keyword'>most friction</span>?",
    diagram:"surfaces", opts:["Carpet — the box is hardest to push","Wood — medium resistance","All surfaces have the same friction","Ice — the box barely slows down"],
    ans:0, hint:"Rougher surfaces have more friction. Look at the length of the red friction arrows.", why:"<span class='keyword'>Carpet</span> has the most friction because it has the roughest surface. The rougher the surface, the more the tiny bumps catch and resist the sliding motion. Ice is very smooth, so friction is very low." },
  { type:"mcq", q:"An object at rest stays at rest unless acted on by a force. This describes which of <span class='keyword'>Newton's Laws</span>?",
    opts:["Newton's Second Law","The Law of Gravity","Newton's Third Law","Newton's First Law"],
    ans:3, hint:"This law is about what happens when forces are balanced (no net force).", why:"Newton's First Law (inertia) says objects keep doing what they are doing — staying still or moving at constant speed — unless a net force acts on them." },
  { type:"drag", q:"Put these types of forces into the correct category.",
    categories:["Contact Forces","Non-Contact Forces"],
    items:[
      {text:"Friction", correct:0}, {text:"Gravity", correct:1},
      {text:"Air resistance", correct:0}, {text:"Magnetism", correct:1},
      {text:"Normal force", correct:0}, {text:"Electrostatic force", correct:1}
    ],
    hint:"Contact forces need the objects to be touching. Non-contact forces act across a gap.",
    why:"Contact: friction, air resistance, normal force (all require touching). Non-contact: gravity, magnetism, electrostatic (all act at a distance)." },
  { type:"diagram", q:"<span class='keyword'>Gear A</span> turns clockwise. The teeth of Gear A and Gear B are meshed together. Which direction does <span class='keyword'>Gear B</span> turn?",
    diagram:"gear_pair", opts:["Clockwise (same direction as Gear A)","It could go either way","Anticlockwise (opposite direction to Gear A)","It does not turn"],
    ans:2, hint:"When two gears are meshed, their teeth push against each other. If one goes clockwise, the other must go...", why:"When two gears mesh, they always turn in <span class='keyword'>opposite directions</span>. If Gear A turns clockwise, Gear B turns anticlockwise. This is because the teeth push against each other at the contact point." },

  // === STAGE 2: Calculate & Apply (Q9–Q17) ===
  { type:"calc", q:"A car has a mass of <span class='keyword'>1200 kg</span> and accelerates at <span class='keyword'>3 m/s²</span>. Calculate the force. Use: F = m × a",
    answer:3600, unit:"N", tolerance:1,
    hint:"Multiply the mass by the acceleration. F = 1200 × 3", why:"F = m × a = 1200 × 3 = 3600 N. The larger the mass or acceleration, the greater the force needed." },
  { type:"calc", q:"A cyclist travels <span class='keyword'>240 metres</span> in <span class='keyword'>60 seconds</span>. What is their speed? Use: speed = distance ÷ time",
    answer:4, unit:"m/s", tolerance:0.1,
    hint:"Divide the distance by the time. 240 ÷ 60", why:"Speed = distance ÷ time = 240 ÷ 60 = 4 m/s. This is the average speed over the whole journey." },
  { type:"calc", q:"What is the <span class='keyword'>weight</span> of an object with a mass of <span class='keyword'>8 kg</span> on Earth? Use: W = m × g (g = 10 N/kg)",
    answer:80, unit:"N", tolerance:1,
    hint:"Multiply the mass by gravitational field strength. 8 × 10", why:"W = m × g = 8 × 10 = 80 N. Weight is a force, so it is measured in Newtons." },
  { type:"calc", q:"A force of <span class='keyword'>500 N</span> acts on an object with mass <span class='keyword'>50 kg</span>. What is the acceleration? Use: a = F ÷ m",
    answer:10, unit:"m/s²", tolerance:0.1,
    hint:"Rearrange F = m × a to find a. Divide the force by the mass.", why:"a = F ÷ m = 500 ÷ 50 = 10 m/s². A bigger force on the same mass gives a bigger acceleration." },
  { type:"calc", q:"A runner covers <span class='keyword'>100 m</span> at a speed of <span class='keyword'>8 m/s</span>. How long does it take? Use: time = distance ÷ speed",
    answer:12.5, unit:"s", tolerance:0.1,
    hint:"Rearrange speed = distance ÷ time. Time = 100 ÷ 8", why:"Time = distance ÷ speed = 100 ÷ 8 = 12.5 seconds." },
  { type:"calc", q:"On the Moon, g = <span class='keyword'>1.6 N/kg</span>. What is the weight of a <span class='keyword'>70 kg</span> astronaut on the Moon?",
    answer:112, unit:"N", tolerance:1,
    hint:"Use W = m × g, but with the Moon's gravity value. 70 × 1.6", why:"W = m × g = 70 × 1.6 = 112 N. The astronaut's mass (70 kg) stays the same, but weight is much less on the Moon because gravity is weaker." },
  { type:"mcq", q:"A 2 kg ball is dropped. Using g = 10 N/kg, what is the net downward force if air resistance is <span class='keyword'>5 N</span>?",
    opts:["20 N","5 N","15 N","25 N"],
    ans:2, hint:"First find the weight (W = m × g = 2 × 10 = 20 N). Then subtract the air resistance.", why:"Weight = 2 × 10 = 20 N downward. Air resistance = 5 N upward. Net force = 20 − 5 = 15 N downward." },
  { type:"calc", q:"A car travels at <span class='keyword'>20 m/s</span> for <span class='keyword'>30 seconds</span>. How far does it travel? Use: distance = speed × time",
    answer:600, unit:"m", tolerance:1,
    hint:"Multiply speed by time. 20 × 30", why:"Distance = speed × time = 20 × 30 = 600 m." },

  // === STAGE 3: Interpret Diagrams (Q18–Q26) ===
  { type:"diagram", q:"Look at the force diagram. The object has a <span class='keyword'>10 N</span> force pushing right and a <span class='keyword'>10 N</span> force pushing left. What is the net force?",
    diagram:"balanced", opts:["20 N to the left","0 N — forces are balanced","20 N to the right","10 N to the right"],
    ans:1, hint:"When forces are equal and opposite, they cancel each other out.", why:"10 N right + 10 N left = 0 N net force. The forces are balanced, so the object will not change its motion." },
  { type:"diagram", q:"This object has <span class='keyword'>15 N</span> pushing right and <span class='keyword'>8 N</span> pushing left. What is the net force and direction?",
    diagram:"unbalanced_right", opts:["7 N to the right","7 N to the left","8 N to the right","23 N to the right"],
    ans:0, hint:"Subtract the smaller force from the larger. The net force goes in the direction of the larger force.", why:"Net force = 15 − 8 = 7 N to the right. The object will accelerate to the right." },
  { type:"diagram", q:"Look at the diagram. There are <span class='keyword'>4 forces</span> acting on this object. What is the net force?",
    diagram:"complex", opts:["0 N","32 N to the right","12 N to the left","8 N to the right"],
    ans:3, hint:"Up and down forces cancel (both 30 N). For left and right: 20 right − 12 left = ?", why:"Up and down: 30 + 30 = balanced (cancel out). Left and right: 20 − 12 = 8 N to the right. The object speeds up to the right." },
  { type:"mcq", q:"In a force diagram, arrows represent forces. A <span class='keyword'>longer arrow</span> means:",
    opts:["More mass","A faster speed","More friction","A bigger force"],
    ans:3, hint:"Look at the arrows. A longer arrow means a bigger or smaller force?", why:"In force diagrams, a longer arrow means a bigger force. A short arrow means a small force." },
  { type:"diagram", q:"Look at this <span class='keyword'>Class 1 lever</span> diagram. Where is the fulcrum located?",
    diagram:"class1", opts:["Between the effort and the load","There is no fulcrum","At one end, with the load at the other end","Next to the effort force"],
    ans:0, hint:"In a Class 1 lever, the fulcrum (pivot point) sits between where you push and what you are lifting.", why:"In a <span class='keyword'>Class 1 lever</span>, the fulcrum is between the effort and the load. Examples: seesaw, scissors, pliers. This is like a balance — push one side down, the other side goes up." },
  { type:"mcq", q:"A box is pushed across a floor. The push force is <span class='keyword'>greater than</span> friction. The box will:",
    opts:["Slow down","Accelerate in the direction of the push","Stay still","Move at constant speed"],
    ans:1, hint:"If the forces are unbalanced (push > friction), what does Newton's Second Law say?", why:"Unbalanced force in the direction of the push means a net force exists. F = ma tells us the object accelerates." },
  { type:"drag", q:"Sort these everyday tools into the correct <span class='keyword'>lever class</span>.",
    categories:["Class 1 (fulcrum in middle)","Class 2 (load in middle)","Class 3 (effort in middle)"],
    items:[
      {text:"Scissors", correct:0}, {text:"Wheelbarrow", correct:1},
      {text:"Tweezers", correct:2}, {text:"Seesaw", correct:0},
      {text:"Bottle opener", correct:1}, {text:"Fishing rod", correct:2}
    ],
    hint:"Remember: Class 1 = fulcrum in the middle (seesaw). Class 2 = load in the middle (wheelbarrow). Class 3 = effort in the middle (tweezers).",
    why:"<span class='keyword'>Class 1</span>: scissors, seesaw (fulcrum in middle). <span class='keyword'>Class 2</span>: wheelbarrow, bottle opener (load in middle — these multiply force). <span class='keyword'>Class 3</span>: tweezers, fishing rod (effort in middle — these multiply distance/speed)." },
  { type:"diagram", q:"Two forces act on a ball: <span class='keyword'>6 N up</span> and <span class='keyword'>14 N down</span>. What is the net force?",
    diagram:"vertical_unbalanced", opts:["8 N upward","6 N upward","8 N downward","20 N downward"],
    ans:2, hint:"Subtract the smaller from the larger. Which direction is the bigger force?", why:"Net force = 14 N down − 6 N up = 8 N downward. The ball will accelerate downward." },
  { type:"mcq", q:"A car moves at constant velocity on a highway. What can you say about the forces?",

// === GAME STATE ===
const SAVE_KEY = "fm_g7_review_v1";

function freshState() {
  return {
    screen: "intro",
    currentQ: 0,
    currentStage: 0,
    score: 0,
    streak: 0,
    bestStreak: 0,
    answered: 0,
    stageScores: [0,0,0,0,0],
    stageAttempts: [0,0,0,0,0],
    achievements: {
      streak3: false, streak5: false, streak10: false,
      perfectStage: false, allCalc: false, speedDemon: false,
      complete: false
    },
    calcCorrect: 0, calcTotal: 0,
    questionStartTime: 0,
    fastAnswers: 0,
    qResults: [] // tracks each answered question: {idx, correct}
  };
}

function saveState() {
  try {
    const toSave = {
      currentQ: state.currentQ,
      score: state.score,
      streak: state.streak,
      bestStreak: state.bestStreak,
      answered: state.answered,
      stageScores: state.stageScores,
      stageAttempts: state.stageAttempts,
      achievements: state.achievements,
      calcCorrect: state.calcCorrect,
      calcTotal: state.calcTotal,
      fastAnswers: state.fastAnswers,
      qResults: state.qResults,
      savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(toSave));
  } catch(e) { /* storage unavailable — fail silently */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const saved = JSON.parse(raw);
    // Validate — must have answered at least 1 and not be complete
    if(!saved || typeof saved.currentQ !== "number" || saved.answered < 1) return null;
    if(saved.achievements && saved.achievements.complete) return null; // finished — no resume
    return saved;
  } catch(e) { return null; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

function resumeFromSave(saved) {
  state = freshState();
  state.currentQ = saved.currentQ;
  state.score = saved.score;
  state.streak = saved.streak;
  state.bestStreak = saved.bestStreak;
  state.answered = saved.answered;
  state.stageScores = saved.stageScores || [0,0,0,0,0];
  state.stageAttempts = saved.stageAttempts || [0,0,0,0,0];
  state.achievements = saved.achievements || freshState().achievements;
  state.calcCorrect = saved.calcCorrect || 0;
  state.calcTotal = saved.calcTotal || 0;
  state.fastAnswers = saved.fastAnswers || 0;
  state.qResults = saved.qResults || [];
  state.screen = "game";
  state.questionStartTime = Date.now();
}

let state = freshState();

const app = document.getElementById("app");

// === RENDER FUNCTIONS ===
function render() {
  switch(state.screen) {
    case "intro": renderIntro(); break;
    case "game": renderGame(); break;
    case "stageTransition": renderStageTransition(); break;
    case "results": renderResults(); break;
  }
}

function renderIntro() {
  const saved = loadState();
  const resumeHTML = saved ? `
    <div style="margin-top:20px; padding:16px; background:var(--surface-2); border:1px solid var(--primary); border-radius:var(--radius);">
      <p style="font-size:14px; color:var(--primary); font-weight:600; margin-bottom:4px;">Saved progress found</p>
      <p style="font-size:13px; color:var(--text-muted);">Question ${saved.currentQ + 1} of ${QUESTIONS.length} · ${saved.score}/${saved.answered} correct · Stage ${getStageForQ(saved.currentQ) + 1}</p>
      <div style="display:flex; gap:8px; margin-top:12px; justify-content:center; flex-wrap:wrap;">
        <button class="start-btn" style="margin:0; padding:12px 32px; font-size:15px;" onclick="resumeGame()">Continue →</button>
        <button class="start-btn" style="margin:0; padding:12px 32px; font-size:15px; background:var(--surface); border:1px solid var(--border); color:var(--text-muted);" onclick="startFresh()">Start Over</button>
      </div>
    </div>
  ` : `<button class="start-btn" onclick="startGame()">Begin Review</button>`;

  app.innerHTML = `
    <div class="screen">
      <h1>Forces & Motion</h1>
      <p>Grade 7 — Exam Revision</p>
      <p class="soi">"Relationships between forces and motion help us understand interaction and function in the context of scientific and technical innovation."</p>
      <div style="margin:20px 0;">
        <p style="font-size:13px;"><strong style="color:var(--primary);">Key Concept:</strong> Relationships &nbsp;|&nbsp; <strong style="color:var(--accent);">Related:</strong> Function, Interaction</p>
        <p style="font-size:13px; margin-top:4px;"><strong style="color:var(--warning);">ATL:</strong> Critical Thinking</p>
      </div>
      <p style="font-size:14px; margin-top:16px; color:var(--text);">${QUESTIONS.length} questions across 5 stages</p>
      <p style="font-size:13px;">Recall → Calculate → Diagrams → Analyse → Evaluate</p>
      ${resumeHTML}
    </div>
  `;
}

function startGame() {
  state = freshState();
  state.screen = "game";
  state.questionStartTime = Date.now();
  clearSave();
  render();
}

window.resumeGame = function() {
  const saved = loadState();
  if(saved) {
    resumeFromSave(saved);
    render();
  } else {
    startGame();
  }
};

window.startFresh = function() {
  clearSave();
  startGame();
};

function getStageForQ(qi) {
  for(let i = 0; i < STAGES.length; i++) {
    if(qi >= STAGES[i].qRange[0] && qi <= STAGES[i].qRange[1]) return i;
  }
  return STAGES.length - 1;
}

function progressPercent() {
  return Math.round((state.answered / QUESTIONS.length) * 100);
}

function renderHeader() {
  const pct = progressPercent();
  const circumference = 2 * Math.PI * 18;
  const offset = circumference - (pct / 100) * circumference;
  return `
    <div class="header">
      <div class="header-left">
        <div class="progress-ring-wrap">
          <svg class="progress-ring" width="48" height="48">
            <circle class="progress-ring-bg" cx="24" cy="24" r="18"/>
            <circle class="progress-ring-fill" cx="24" cy="24" r="18"
              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
          </svg>
          <div class="progress-ring-text">${pct}%</div>
        </div>
        <div class="streak">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z"/></svg>
          ${state.streak}
        </div>
      </div>
      <div class="header-right">
        <div class="score-display"><span>${state.score}</span> / ${state.answered}</div>
      </div>
    </div>
  `;
}

function renderStagePips() {
  const currentStage = getStageForQ(state.currentQ);
  return `
    <div class="stage-bar">
      ${STAGES.map((s, i) => {
        let cls = "";
        if(i < currentStage) cls = "complete";
        else if(i === currentStage) cls = "active";
        return `<div class="stage-pip ${cls}"></div>`;
      }).join("")}
    </div>
    <div class="stage-label">Stage ${currentStage + 1}: ${STAGES[currentStage].name}</div>
  `;
}

// === FORCE DIAGRAMS (SVG) ===
function renderForceDiagram(type) {
  const w = 320, h = 200, cx = 160, cy = 100;
  let arrows = "";
  const boxSize = 40;

  function arrow(x1,y1,x2,y2,label,color="#e8eaf0") {
    const angle = Math.atan2(y2-y1, x2-x1);
    const headLen = 10;
    const ax = x2 - headLen * Math.cos(angle - 0.4);
    const ay = y2 - headLen * Math.sin(angle - 0.4);
    const bx = x2 - headLen * Math.cos(angle + 0.4);
    const by = y2 - headLen * Math.sin(angle + 0.4);
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const labelOffset = (x2-x1) === 0 ? (x1 < cx ? -12 : 12) : (y1 < cy ? -12 : 14);
    const textAnchor = (x2-x1) === 0 ? (x1 < cx ? "end" : "start") : "middle";
    const lx = (x2-x1) === 0 ? mx + labelOffset : mx;
    const ly = (x2-x1) === 0 ? my : my + labelOffset;
    return `
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2.5"/>
      <polygon points="${x2},${y2} ${ax},${ay} ${bx},${by}" fill="${color}"/>
      <text x="${lx}" y="${ly}" fill="${color}" font-size="12" font-weight="600" text-anchor="${textAnchor}" font-family="DM Sans, sans-serif">${label}</text>
    `;
  }

  const box = `<rect x="${cx-boxSize/2}" y="${cy-boxSize/2}" width="${boxSize}" height="${boxSize}" rx="6" fill="#242836" stroke="#6c8cff" stroke-width="2"/>`;

  switch(type) {
    case "balanced":
      arrows = arrow(cx-boxSize/2, cy, cx-90, cy, "10 N", "#f87171") +
               arrow(cx+boxSize/2, cy, cx+90, cy, "10 N", "#4ade80");
      break;
    case "unbalanced_right":
      arrows = arrow(cx-boxSize/2, cy, cx-60, cy, "8 N", "#f87171") +
               arrow(cx+boxSize/2, cy, cx+100, cy, "15 N", "#4ade80");
      break;
    case "complex":
      arrows = arrow(cx, cy-boxSize/2, cx, cy-80, "30 N", "#4ade80") +
               arrow(cx, cy+boxSize/2, cx, cy+80, "30 N", "#f87171") +
               arrow(cx-boxSize/2, cy, cx-70, cy, "12 N", "#fbbf24") +
               arrow(cx+boxSize/2, cy, cx+100, cy, "20 N", "#a78bfa");
      break;
    case "vertical_unbalanced":
      arrows = arrow(cx, cy-boxSize/2, cx, cy-55, "6 N", "#4ade80") +
               arrow(cx, cy+boxSize/2, cx, cy+90, "14 N", "#f87171");
      break;
  }

  return `<div class="diagram-wrap">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
      ${box}${arrows}
    </svg>
  </div>`;
}

// === LEVER DIAGRAMS (SVG) ===
function renderLeverDiagram(type) {
  const w = 360, h = 180;
  // Lever bar, fulcrum triangle, effort arrow, load arrow, labels
  function fulcrum(fx, fy) {
    return `<polygon points="${fx},${fy} ${fx-16},${fy+24} ${fx+16},${fy+24}" fill="#6c8cff" stroke="#8aa4ff" stroke-width="1.5"/>
    <text x="${fx}" y="${fy+38}" text-anchor="middle" fill="#6c8cff" font-size="10" font-weight="600" font-family="DM Sans, sans-serif">Fulcrum</text>`;
  }
  function effortArrow(x, y1, y2, label) {
    return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#4ade80" stroke-width="2.5"/>
    <polygon points="${x},${y2} ${x-6},${y2+10} ${x+6},${y2+10}" fill="#4ade80"/>
    <text x="${x}" y="${y2+24}" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600" font-family="DM Sans, sans-serif">${label}</text>`;
  }
  function loadArrow(x, y1, y2, label) {
    return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#f87171" stroke-width="2.5"/>
    <polygon points="${x},${y2} ${x-6},${y2-10} ${x+6},${y2-10}" fill="#f87171"/>
    <text x="${x}" y="${y1-10}" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600" font-family="DM Sans, sans-serif">${label}</text>`;
  }
  let svg = "";
  const barY = 70;
  switch(type) {
    case "class1": // Fulcrum in middle: seesaw, scissors
      svg = `<rect x="40" y="${barY}" width="280" height="8" rx="4" fill="#e8eaf0"/>` +
        fulcrum(180, barY+8) +
        effortArrow(80, barY, barY-50, "Effort ↓") +
        loadArrow(280, barY, barY+55, "Load ↓") +
        `<text x="180" y="16" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" font-family="DM Sans, sans-serif">CLASS 1 LEVER</text>
        <text x="180" y="165" text-anchor="middle" fill="#8b90a5" font-size="10" font-family="DM Sans, sans-serif">e.g. seesaw, scissors, pliers</text>`;
      break;
    case "class2": // Fulcrum at end, load in middle
      svg = `<rect x="40" y="${barY}" width="280" height="8" rx="4" fill="#e8eaf0"/>` +
        fulcrum(40, barY+8) +
        loadArrow(180, barY, barY+55, "Load ↓") +
        effortArrow(300, barY, barY-50, "Effort ↓") +
        `<text x="180" y="16" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" font-family="DM Sans, sans-serif">CLASS 2 LEVER</text>
        <text x="180" y="165" text-anchor="middle" fill="#8b90a5" font-size="10" font-family="DM Sans, sans-serif">e.g. wheelbarrow, nutcracker, bottle opener</text>`;
      break;
    case "class3": // Fulcrum at end, effort in middle
      svg = `<rect x="40" y="${barY}" width="280" height="8" rx="4" fill="#e8eaf0"/>` +
        fulcrum(40, barY+8) +
        effortArrow(160, barY, barY-50, "Effort ↓") +
        loadArrow(300, barY, barY+55, "Load ↓") +
        `<text x="180" y="16" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" font-family="DM Sans, sans-serif">CLASS 3 LEVER</text>
        <text x="180" y="165" text-anchor="middle" fill="#8b90a5" font-size="10" font-family="DM Sans, sans-serif">e.g. tweezers, fishing rod, broom</text>`;
      break;
    case "class_unknown": // No labels — student must identify
      svg = `<rect x="40" y="${barY}" width="280" height="8" rx="4" fill="#e8eaf0"/>` +
        `<polygon points="40,${barY+8} 24,${barY+32} 56,${barY+32}" fill="#6c8cff" stroke="#8aa4ff" stroke-width="1.5"/>` +
        `<line x1="160" y1="${barY}" x2="160" y2="${barY-45}" stroke="#4ade80" stroke-width="2.5"/>

}

// === GEAR DIAGRAMS (SVG) ===
function renderGearDiagram(type) {
  function gear(cx, cy, r, label, color, arrowDir) {
    const teeth = 10;
    let path = "";
    for (let i = 0; i < teeth; i++) {
      const a1 = (i / teeth) * Math.PI * 2;
      const a2 = ((i + 0.3) / teeth) * Math.PI * 2;
      const a3 = ((i + 0.5) / teeth) * Math.PI * 2;
      const a4 = ((i + 0.8) / teeth) * Math.PI * 2;
      const ir = r - 4, or = r + 6;
      if (i === 0) path += `M ${cx + ir * Math.cos(a1)} ${cy + ir * Math.sin(a1)} `;
      path += `L ${cx + or * Math.cos(a2)} ${cy + or * Math.sin(a2)} `;
      path += `L ${cx + or * Math.cos(a3)} ${cy + or * Math.sin(a3)} `;
      path += `L ${cx + ir * Math.cos(a4)} ${cy + ir * Math.sin(a4)} `;
    }
    path += "Z";
    const arrow = arrowDir === "cw" ?
      `<path d="M ${cx-12} ${cy-r+14} A ${r-14} ${r-14} 0 0 1 ${cx+12} ${cy-r+14}" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#garr)"/>` :
      arrowDir === "ccw" ?
      `<path d="M ${cx+12} ${cy-r+14} A ${r-14} ${r-14} 0 0 0 ${cx-12} ${cy-r+14}" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#garr)"/>` : "";
    return `<path d="${path}" fill="${color}" opacity="0.3" stroke="${color}" stroke-width="1.5"/>
      <circle cx="${cx}" cy="${cy}" r="5" fill="${color}"/>
      <text x="${cx}" y="${cy+r+20}" text-anchor="middle" fill="${color}" font-size="12" font-weight="700" font-family="DM Sans, sans-serif">${label}</text>
      ${arrow}`;
  }
  let svg = "";
  const defs = `<defs><marker id="garr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>`;
  switch(type) {
    case "gear_pair":
      svg = `<svg viewBox="0 0 320 180" width="300" height="170" xmlns="http://www.w3.org/2000/svg">${defs}
        ${gear(100, 80, 40, "Gear A", "#6c8cff", "cw")}
        ${gear(210, 80, 40, "Gear B", "#f87171", "")}
        <text x="160" y="165" text-anchor="middle" fill="#8b90a5" font-size="10" font-family="DM Sans, sans-serif">Teeth are meshed together</text>
        <text x="100" y="135" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600" font-family="DM Sans, sans-serif">↻ Clockwise</text>
      </svg>`;
      break;
    case "gear_chain3":
      svg = `<svg viewBox="0 0 400 180" width="380" height="170" xmlns="http://www.w3.org/2000/svg">${defs}
        ${gear(70, 80, 35, "Gear 1", "#6c8cff", "cw")}
        ${gear(170, 80, 35, "Gear 2", "#a78bfa", "")}
        ${gear(270, 80, 35, "Gear 3", "#f87171", "")}
        <text x="70" y="135" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600" font-family="DM Sans, sans-serif">↻ CW</text>
        <text x="170" y="135" text-anchor="middle" fill="#8b90a5" font-size="10" font-family="DM Sans, sans-serif">?</text>
        <text x="270" y="135" text-anchor="middle" fill="#8b90a5" font-size="10" font-family="DM Sans, sans-serif">?</text>
        <text x="200" y="170" text-anchor="middle" fill="#8b90a5" font-size="10" font-family="DM Sans, sans-serif">Each gear meshes with the next</text>
      </svg>`;
      break;
    case "gear_chain4":
      svg = `<svg viewBox="0 0 440 180" width="420" height="170" xmlns="http://www.w3.org/2000/svg">${defs}
        ${gear(60, 80, 30, "Gear 1", "#6c8cff", "ccw")}
        ${gear(145, 80, 30, "Gear 2", "#a78bfa", "")}
        ${gear(230, 80, 30, "Gear 3", "#4ade80", "")}
        ${gear(315, 80, 30, "Gear 4", "#f87171", "")}
        <text x="60" y="130" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600" font-family="DM Sans, sans-serif">↺ Anti-CW</text>
        <text x="145" y="130" text-anchor="middle" fill="#8b90a5" font-size="9" font-family="DM Sans, sans-serif">?</text>
        <text x="230" y="130" text-anchor="middle" fill="#8b90a5" font-size="9" font-family="DM Sans, sans-serif">?</text>
        <text x="315" y="130" text-anchor="middle" fill="#8b90a5" font-size="9" font-family="DM Sans, sans-serif">?</text>
        <text x="220" y="168" text-anchor="middle" fill="#8b90a5" font-size="9" font-family="DM Sans, sans-serif">Each gear meshes with the next in the chain</text>
      </svg>`;
      break;
  }
  return `<div class="diagram-wrap">${svg}</div>`;
}

// === RENDER GAME ===
function renderGame() {
  const q = QUESTIONS[state.currentQ];
  const qNum = state.currentQ + 1;
  const typeBadge = {
    mcq: '<span class="q-type-badge mcq">Multiple Choice</span>',
    calc: '<span class="q-type-badge calc">Calculate</span>',
    drag: '<span class="q-type-badge drag">Sort / Match</span>',
    diagram: '<span class="q-type-badge diagram">Diagram</span>',
    scenario: '<span class="q-type-badge scenario">Scenario</span>'
  };

  let body = "";

  switch(q.type) {
    case "mcq":
    case "scenario":
      body = `<div class="options">${q.opts.map((o,i) =>
        `<button class="opt-btn" onclick="answerMCQ(${i})" id="opt-${i}">${o}</button>`
      ).join("")}</div>`;
      break;

    case "calc":
      body = `<div class="calc-input-wrap">
        <input type="number" step="any" class="calc-input" id="calc-in" placeholder="Your answer..." onkeydown="if(event.key==='Enter')answerCalc()">
        <span class="calc-unit">${q.unit}</span>
        <button class="calc-submit" onclick="answerCalc()">Check</button>
      </div>`;
      break;

    case "diagram":
      const isLever = q.diagram && q.diagram.startsWith("class");
      const isGear = q.diagram && q.diagram.startsWith("gear");
      const isFriction = q.diagram && (q.diagram === "surfaces" || q.diagram === "experiment" || q.diagram === "shoe_grip");
      const diagramHTML = isLever ? renderLeverDiagram(q.diagram) : isGear ? renderGearDiagram(q.diagram) : isFriction ? renderFrictionDiagram(q.diagram) : renderForceDiagram(q.diagram);
      body = diagramHTML +
        `<div class="options">${q.opts.map((o,i) =>
          `<button class="opt-btn" onclick="answerMCQ(${i})" id="opt-${i}">${o}</button>`
        ).join("")}</div>`;
      break;

    case "drag":
      if(q.isMatch) {
        body = renderMatchQuestion(q);
      } else if(q.isOrdered) {
        body = renderOrderQuestion(q);
      } else {
        body = renderCategoryDrag(q);
      }
      break;
  }

  app.innerHTML = `
    ${renderHeader()}
    ${renderStagePips()}
    <div class="q-card" id="q-card">
      <div class="q-number">Question ${qNum} of ${QUESTIONS.length} ${typeBadge[q.type] || typeBadge[q.type === "scenario" ? "scenario" : "mcq"]}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      <div id="feedback-area"></div>
    </div>
  `;

  // Focus calc input
  if(q.type === "calc") {
    setTimeout(() => { const el = document.getElementById("calc-in"); if(el) el.focus(); }, 100);
  }
}

// === DRAG: CATEGORY SORT ===
function renderCategoryDrag(q) {
  // Shuffle items
  const shuffled = [...q.items].sort(() => Math.random() - 0.5);
  window._dragItems = shuffled;
  window._dragState = shuffled.map(() => -1); // -1 = unassigned

  let html = `<div id="drag-area">`;
  html += `<div class="drag-label">Drag items to a category, or tap an item then tap a category</div>`;
  html += `<div id="source-zone" class="drag-zone" style="margin-bottom:12px;">`;
  shuffled.forEach((item, i) => {
    html += `<div class="drag-item" draggable="true" id="ditem-${i}" onclick="tapDragItem(${i})"><span class="grip">⠿</span> ${item.text}</div>`;
  });
  html += `</div>`;

  q.categories.forEach((cat, ci) => {
    html += `<div class="drag-label">${cat}</div>`;
    html += `<div class="drag-zone" id="cat-${ci}" ondrop="dropItem(event,${ci})" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" onclick="tapCategory(${ci})"></div>`;
  });

  html += `<button class="calc-submit drag-submit" onclick="checkDrag()">Check Order</button></div>`;
  return html;
}

// === DRAG: ORDERED SORT ===
function renderOrderQuestion(q) {
  const shuffled = [...q.items].sort(() => Math.random() - 0.5);
  window._orderItems = shuffled;

  let html = `<div id="drag-area">`;
  html += `<div class="drag-label">${q.categories[0]}</div>`;
  html += `<div class="drag-zone" id="order-zone">`;
  shuffled.forEach((item, i) => {
    html += `<div class="drag-item" draggable="true" id="oitem-${i}" data-idx="${i}" ondragstart="orderDragStart(event,${i})" ondragover="event.preventDefault()" ondrop="orderDrop(event,${i})"><span class="grip">⠿</span> ${item.text}</div>`;
  });
  html += `</div>`;
  html += `<button class="calc-submit drag-submit" onclick="checkOrder()">Check Order</button></div>`;
  return html;
}

// === DRAG: MATCH ===
function renderMatchQuestion(q) {
  const shuffled = [...q.items].sort(() => Math.random() - 0.5);
  window._matchItems = shuffled;
  window._matchState = shuffled.map(() => -1);

  let html = `<div id="drag-area"><div class="drag-label">Match each description to the correct law</div>`;
  shuffled.forEach((item, i) => {
    html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <select id="match-${i}" style="padding:8px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:14px;">
        <option value="-1">Select...</option>
        ${q.matchLabels.map((l,li) => `<option value="${li}">${l}</option>`).join("")}
      </select>
      <span style="font-size:14px;">${item.text}</span>
    </div>`;
  });
  html += `<button class="calc-submit drag-submit" onclick="checkMatch()">Check Matches</button></div>`;
  return html;
}

// === DRAG INTERACTION HANDLERS ===
let selectedDragItem = -1;

window.tapDragItem = function(idx) {
  selectedDragItem = idx;
  document.querySelectorAll('.drag-item').forEach(el => el.style.outline = "none");
  const el = document.getElementById(`ditem-${idx}`);
  if(el) el.style.outline = "2px solid var(--primary)";
};

window.tapCategory = function(catIdx) {
  if(selectedDragItem < 0) return;
  const el = document.getElementById(`ditem-${selectedDragItem}`);
  const zone = document.getElementById(`cat-${catIdx}`);
  if(el && zone) {
    zone.appendChild(el);
    window._dragState[selectedDragItem] = catIdx;
    el.style.outline = "none";
    selectedDragItem = -1;
  }
};

// HTML5 drag
document.addEventListener("dragstart", (e) => {
  if(e.target.classList && e.target.classList.contains("drag-item")) {
    e.dataTransfer.setData("text/plain", e.target.id);
  }
});

window.dropItem = function(e, catIdx) {
  e.preventDefault();
  e.currentTarget.classList.remove("over");
  const id = e.dataTransfer.getData("text/plain");
  const el = document.getElementById(id);
  if(el) {
    e.currentTarget.appendChild(el);
    const idx = parseInt(id.split("-")[1]);
    window._dragState[idx] = catIdx;
  }
};

// Order drag
window.orderDragStart = function(e, idx) {
  e.dataTransfer.setData("text/plain", idx.toString());
};

window.orderDrop = function(e, targetIdx) {
  e.preventDefault();
  const srcIdx = parseInt(e.dataTransfer.getData("text/plain"));
  if(srcIdx === targetIdx) return;
  const zone = document.getElementById("order-zone");
  const items = [...zone.children];
  const srcEl = items[srcIdx];
  const targetEl = items[targetIdx];
  if(srcIdx < targetIdx) {
    zone.insertBefore(srcEl, targetEl.nextSibling);
  } else {
    zone.insertBefore(srcEl, targetEl);
  }
  // Update array
  const moved = window._orderItems.splice(srcIdx, 1)[0];
  window._orderItems.splice(targetIdx, 0, moved);
  // Re-assign IDs
  [...zone.children].forEach((el, i) => {
    el.id = `oitem-${i}`;
    el.setAttribute("data-idx", i);
    el.setAttribute("ondragstart", `orderDragStart(event,${i})`);
    el.setAttribute("ondrop", `orderDrop(event,${i})`);
  });
};

// === ANSWER HANDLERS ===
window.answerMCQ = function(idx) {
  const q = QUESTIONS[state.currentQ];
  const correct = idx === q.ans;
  const stage = getStageForQ(state.currentQ);

  // Lock all options
  document.querySelectorAll(".opt-btn").forEach((btn, i) => {
    btn.classList.add("locked");
    if(i === q.ans) btn.classList.add(correct ? "correct" : "reveal");
    if(i === idx && !correct) btn.classList.add("incorrect");
  });

  recordAnswer(correct, q, stage);
};

window.answerCalc = function() {
  const q = QUESTIONS[state.currentQ];
  const input = document.getElementById("calc-in");
  const val = parseFloat(input.value);
  if(isNaN(val)) return;

  const correct = Math.abs(val - q.answer) <= q.tolerance;
  const stage = getStageForQ(state.currentQ);
  input.classList.add(correct ? "correct" : "incorrect");
  input.disabled = true;
  document.querySelector(".calc-submit").disabled = true;

  state.calcTotal++;
  if(correct) state.calcCorrect++;

  recordAnswer(correct, q, stage);
};

window.checkDrag = function() {
  const q = QUESTIONS[state.currentQ];
  const stage = getStageForQ(state.currentQ);
  let allCorrect = true;

  window._dragItems.forEach((item, i) => {
    const assigned = window._dragState[i];
    const el = document.getElementById(`ditem-${i}`);
    if(assigned === item.correct) {
      if(el) el.classList.add("correct-pos");
    } else {
      allCorrect = false;
      if(el) el.classList.add("incorrect-pos");
    }
  });

  document.querySelector(".drag-submit").disabled = true;
  recordAnswer(allCorrect, q, stage);
};

window.checkOrder = function() {
  const q = QUESTIONS[state.currentQ];
  const stage = getStageForQ(state.currentQ);
  let allCorrect = true;

  window._orderItems.forEach((item, i) => {
    const el = document.getElementById(`oitem-${i}`);
    if(item.order === i) {
      if(el) el.classList.add("correct-pos");
    } else {
      allCorrect = false;
      if(el) el.classList.add("incorrect-pos");
    }
  });

  document.querySelector(".drag-submit").disabled = true;
  recordAnswer(allCorrect, q, stage);
};

window.checkMatch = function() {
  const q = QUESTIONS[state.currentQ];
  const stage = getStageForQ(state.currentQ);
  let allCorrect = true;
  const correctMapping = {0:0, 1:1, 2:2}; // items in shuffled order need matchLabel index

  window._matchItems.forEach((item, i) => {
    const sel = document.getElementById(`match-${i}`);
    const chosen = parseInt(sel.value);
    const expected = q.matchLabels.indexOf(item.label);
    if(chosen !== expected) allCorrect = false;
    sel.disabled = true;
    sel.style.borderColor = (chosen === expected) ? "var(--success)" : "var(--error)";
  });

  document.querySelector(".drag-submit").disabled = true;
  recordAnswer(allCorrect, q, stage);
};

function recordAnswer(correct, q, stage) {
  state.answered++;
  state.stageAttempts[stage]++;
  state.qResults.push({ idx: state.currentQ, correct: correct });

  if(correct) {
    state.score++;
    state.streak++;
    state.stageScores[stage]++;
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;
  } else {
    state.streak = 0;
  }

  // Fast answer check (under 8 seconds)
  const elapsed = Date.now() - state.questionStartTime;
  if(correct && elapsed < 8000) state.fastAnswers++;

  // Check achievements
  checkAchievements();

  // Save progress after every answer
  saveState();

  // Show feedback
  const fb = document.getElementById("feedback-area");
  fb.innerHTML = `
    <div class="feedback ${correct ? "correct" : "incorrect"}">
      <strong>${correct ? "✓ Correct!" : "✗ Not quite"}</strong>
      ${correct ? "" : `<p style="margin-bottom:6px;"><em>Hint: ${q.hint}</em></p>`}
      <p>${q.why}</p>
    </div>
    <button class="next-btn" onclick="nextQuestion()">
      ${state.currentQ < QUESTIONS.length - 1 ? "Next Question →" : "See Results →"}
    </button>
  `;

  // Update header
  const headerEl = document.querySelector(".header");
  if(headerEl) headerEl.outerHTML = renderHeader();
}

function checkAchievements() {
  const a = state.achievements;
  let newAchievement = null;

  if(state.streak >= 3 && !a.streak3) { a.streak3 = true; newAchievement = "🔥 3 Streak!"; }
  if(state.streak >= 5 && !a.streak5) { a.streak5 = true; newAchievement = "🔥 5 Streak!"; }
  if(state.streak >= 10 && !a.streak10) { a.streak10 = true; newAchievement = "💎 10 Streak!"; }

  // Perfect stage check
  const currentStage = getStageForQ(state.currentQ);
  const s = STAGES[currentStage];
  const stageLen = s.qRange[1] - s.qRange[0] + 1;
  if(state.stageScores[currentStage] === stageLen && state.stageAttempts[currentStage] === stageLen && !a.perfectStage) {
    a.perfectStage = true; newAchievement = "⭐ Perfect Stage!";
  }

  // All calc correct
  if(state.calcTotal >= 4 && state.calcCorrect === state.calcTotal && !a.allCalc) {
    a.allCalc = true; newAchievement = "🧮 Calculator Pro!";
  }

  // Speed demon (5+ fast answers)
  if(state.fastAnswers >= 5 && !a.speedDemon) {
    a.speedDemon = true; newAchievement = "⚡ Speed Demon!";
  }

  if(newAchievement) showAchievementPopup(newAchievement);
}

function showAchievementPopup(text) {
  const popup = document.createElement("div");
  popup.className = "achievement-popup";
  popup.textContent = text;
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 2800);
}

window.nextQuestion = function() {
  const currentStage = getStageForQ(state.currentQ);
  const nextQ = state.currentQ + 1;

  if(nextQ >= QUESTIONS.length) {
    state.achievements.complete = true;
    state.screen = "results";
    clearSave(); // completed — no need to resume
    render();
    return;
  }

  const nextStage = getStageForQ(nextQ);
  if(nextStage !== currentStage) {
    state.currentQ = nextQ;
    state.screen = "stageTransition";
    saveState(); // save at stage boundary
    render();
  } else {
    state.currentQ = nextQ;
    state.questionStartTime = Date.now();
    saveState(); // save before rendering next question
    render();
  }
};

function renderStageTransition() {
  const prevStage = getStageForQ(state.currentQ - 1);
  const nextStage = getStageForQ(state.currentQ);
  const pScore = state.stageScores[prevStage];
  const pTotal = state.stageAttempts[prevStage];
  const pct = Math.round((pScore / pTotal) * 100);

  app.innerHTML = `
    <div class="screen">
      <div class="stage-complete-icon">${pct >= 80 ? "🎉" : pct >= 50 ? "👍" : "💪"}</div>
      <h2>Stage ${prevStage + 1} Complete</h2>
      <p>${STAGES[prevStage].name}: ${pScore} / ${pTotal} (${pct}%)</p>
      <p style="margin-top:16px; font-size:16px; color:var(--text);">Up next:</p>
      <h2 style="color:var(--primary); margin-top:4px;">Stage ${nextStage + 1}: ${STAGES[nextStage].name}</h2>
      <p style="font-style:italic; font-size:14px; margin-top:4px;">${STAGES[nextStage].desc}</p>
      <button class="start-btn" onclick="continueGame()">Continue →</button>
    </div>
  `;
}

window.continueGame = function() {
  state.screen = "game";
  state.questionStartTime = Date.now();
  render();
};

function renderResults() {
  const pct = Math.round((state.score / QUESTIONS.length) * 100);
  const grade = pct >= 90 ? "Outstanding" : pct >= 75 ? "Great work" : pct >= 50 ? "Good effort" : "Keep practising";

  const badges = [
    { key:"streak3", icon:"🔥", label:"3 Streak" },
    { key:"streak5", icon:"🔥", label:"5 Streak" },
    { key:"streak10", icon:"💎", label:"10 Streak" },
    { key:"perfectStage", icon:"⭐", label:"Perfect Stage" },
    { key:"allCalc", icon:"🧮", label:"Calc Pro" },
    { key:"speedDemon", icon:"⚡", label:"Speed Demon" },
    { key:"complete", icon:"🏆", label:"Completed" }
  ];

  app.innerHTML = `
    <div class="screen">
      <h1>${grade}!</h1>
      <p style="font-size:18px; color:var(--text); margin:8px 0;">${state.score} / ${QUESTIONS.length} (${pct}%)</p>

      <div class="results-grid">
        <div class="result-stat"><div class="val" style="color:var(--success);">${state.score}</div><div class="label">Correct</div></div>
        <div class="result-stat"><div class="val" style="color:var(--error);">${QUESTIONS.length - state.score}</div><div class="label">Incorrect</div></div>
        <div class="result-stat"><div class="val" style="color:var(--warning);">${state.bestStreak}</div><div class="label">Best Streak</div></div>
      </div>

      <p style="font-size:14px; font-weight:600; margin:16px 0 8px;">Stage Breakdown</p>
      <div class="results-grid">
        ${STAGES.map((s, i) => {
          const sPct = state.stageAttempts[i] > 0 ? Math.round((state.stageScores[i] / state.stageAttempts[i]) * 100) : 0;
          return `<div class="result-stat">
            <div class="val" style="color:${sPct >= 80 ? 'var(--success)' : sPct >= 50 ? 'var(--warning)' : 'var(--error)'};">${sPct}%</div>
            <div class="label">${s.name}</div>
          </div>`;
        }).join("")}
      </div>

      <div class="achievements">
        ${badges.map(b => `<div class="badge ${state.achievements[b.key] ? 'earned' : ''}"><span class="badge-icon">${b.icon}</span> ${b.label}</div>`).join("")}
      </div>

      <div class="transfer-prompt">
        <strong>Think Further (Transfer)</strong>
        Where do you see forces and motion in your daily life? Think about: riding a bike, catching a ball, a car braking, a plane flying. How do Newton's Laws explain what happens? Discuss with a partner.
      </div>

      <button class="start-btn" onclick="resetGame()" style="margin-top:24px;">Play Again</button>
    </div>
  `;
}

window.resetGame = function() {
  clearSave();
  state = freshState();
  render();
};

// === INIT ===
render();
</script>
</body>
</html>
