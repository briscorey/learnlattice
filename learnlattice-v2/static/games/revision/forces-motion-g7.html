<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forces & Motion — Grade 7 Review</title><style>*,::after,::before{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f1117;--surface:#1a1d27;--surface-2:#242836;--border:#2e3348;--text:#e8eaf0;--text-muted:#8b90a5;--primary:#6c8cff;--primary-glow:rgba(108,140,255,0.15);--success:#4ade80;--success-glow:rgba(74,222,128,0.15);--error:#f87171;--error-glow:rgba(248,113,113,0.15);--warning:#fbbf24;--accent:#a78bfa;--radius:12px;--radius-sm:8px}@media (prefers-color-scheme:light){:root{--bg:#f8fafc;--surface:#ffffff;--surface-2:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--text-muted:#64748b;--primary:#3b82f6;--primary-glow:rgba(59,130,246,0.1);--success:#16a34a;--success-glow:rgba(22,163,74,0.1);--error:#dc2626;--error-glow:rgba(220,38,38,0.08);--warning:#d97706;--accent:#7c3aed}}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}.app{max-width:720px;margin:0 auto;padding:16px}.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;flex-wrap:wrap;gap:12px}.header-left{display:flex;align-items:center;gap:14px}.header-right{display:flex;align-items:center;gap:16px}.progress-ring-wrap{position:relative;width:48px;height:48px}.progress-ring{transform:rotate(-90deg)}.progress-ring-bg{fill:none;stroke:var(--border);stroke-width:4}.progress-ring-fill{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .5s ease}.progress-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:var(--primary);font-family:'JetBrains Mono',monospace}.streak{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--warning)}.streak svg{width:20px;height:20px}.score-display{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text-muted)}.score-display span{color:var(--success);font-weight:600}.stage-bar{display:flex;gap:4px;margin-bottom:16px}.stage-pip{flex:1;height:6px;border-radius:3px;background:var(--border);transition:background .4s}.stage-pip.active{background:var(--primary)}.stage-pip.complete{background:var(--success)}.stage-label{text-align:center;margin-bottom:16px;font-size:13px;color:var(--text-muted);font-weight:500;letter-spacing:.5px;text-transform:uppercase}.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.q-number{font-size:12px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.q-type-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;margin-left:8px;text-transform:uppercase;letter-spacing:.5px}.q-type-badge.calc{background:rgba(251,191,36,.15);color:var(--warning)}.q-type-badge.diagram{background:rgba(167,139,250,.15);color:var(--accent)}.q-type-badge.drag{background:rgba(108,140,255,.15);color:var(--primary)}.q-type-badge.scenario{background:rgba(74,222,128,.15);color:var(--success)}.q-type-badge.mcq{background:rgba(139,144,165,.15);color:var(--text-muted)}.q-text{font-size:17px;font-weight:500;line-height:1.6;margin-bottom:20px}.q-text .keyword{color:var(--primary);font-weight:600}.options{display:flex;flex-direction:column;gap:8px}.opt-btn{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer;transition:all .2s}.opt-btn:hover:not(.locked){border-color:var(--primary);background:var(--primary-glow)}.opt-btn.correct{border-color:var(--success);background:var(--success-glow);color:var(--success)}.opt-btn.incorrect{border-color:var(--error);background:var(--error-glow);color:var(--error)}.opt-btn.locked{cursor:default;opacity:.6}.opt-btn.reveal{border-color:var(--success);background:var(--success-glow)}.calc-input-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.calc-input{flex:1;min-width:120px;padding:12px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;outline:0;transition:border-color .2s}.calc-input:focus{border-color:var(--primary)}.calc-input.correct{border-color:var(--success)}.calc-input.incorrect{border-color:var(--error)}.calc-unit{font-size:14px;color:var(--text-muted);font-weight:500;min-width:30px}.calc-submit{padding:12px 24px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-weight:600;font-family:inherit;font-size:14px;cursor:pointer;transition:opacity .2s}.calc-submit:hover{opacity:.85}.calc-submit:disabled{opacity:.4;cursor:default}.drag-zone{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface-2);border:2px dashed var(--border);border-radius:var(--radius);min-height:60px;transition:border-color .2s}.drag-zone.over{border-color:var(--primary)}.drag-item{padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:grab;font-size:14px;font-weight:500;user-select:none;transition:all .2s;display:flex;align-items:center;gap:10px}.drag-item:active{cursor:grabbing;opacity:.7}.drag-item .grip{color:var(--text-muted);font-size:16px}.drag-item.correct-pos{border-color:var(--success);background:var(--success-glow)}.drag-item.incorrect-pos{border-color:var(--error);background:var(--error-glow)}.drag-label{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}.drag-submit{margin-top:8px}.diagram-wrap{display:flex;justify-content:center;margin:16px 0;padding:16px;background:var(--surface-2);border-radius:var(--radius)}.diagram-wrap svg{max-width:100%;height:auto}.feedback{margin-top:16px;padding:14px 16px;border-radius:var(--radius-sm);font-size:14px;line-height:1.5;animation:fadeIn .3s ease}.feedback.correct{background:var(--success-glow);border-left:3px solid var(--success)}.feedback.incorrect{background:var(--error-glow);border-left:3px solid var(--error)}.feedback strong{display:block;margin-bottom:4px}.next-btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .2s}.next-btn:hover{opacity:.85}.screen{text-align:center;padding:40px 20px;animation:fadeIn .4s ease}.screen h1{font-size:28px;font-weight:700;margin-bottom:8px}.screen h2{font-size:22px;font-weight:700;margin-bottom:8px}.screen p{color:var(--text-muted);font-size:15px;margin-bottom:6px}.screen .soi{font-style:italic;color:var(--accent);font-size:13px;margin:16px auto;max-width:480px}.screen .start-btn{display:inline-block;margin-top:24px;padding:14px 40px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .2s}.screen .start-btn:hover{opacity:.85}.stage-complete-icon{font-size:48px;margin-bottom:16px}.achievements{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0}.badge{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);transition:all .3s}.badge.earned{border-color:var(--warning);color:var(--warning);background:rgba(251,191,36,.1)}.badge .badge-icon{font-size:16px}.achievement-popup{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--surface);border:1px solid var(--warning);border-radius:var(--radius);color:var(--warning);font-weight:600;font-size:14px;z-index:100;animation:popIn .4s ease,popOut .4s ease 2.2s forwards;box-shadow:0 4px 20px rgba(251,191,36,.2)}@keyframes popIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}}@keyframes popOut{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:24px 0;text-align:center}.result-stat{padding:16px;background:var(--surface-2);border-radius:var(--radius-sm);border:1px solid var(--border)}.result-stat .val{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace}.result-stat .label{font-size:12px;color:var(--text-muted);margin-top:4px}.transfer-prompt{margin-top:24px;padding:16px;background:var(--primary-glow);border:1px solid var(--primary);border-radius:var(--radius);font-size:14px;color:var(--primary);text-align:left}.transfer-prompt strong{display:block;margin-bottom:4px}@media (max-width:480px){.app{padding:10px}.header{padding:10px 12px}.q-card{padding:18px 16px}.q-text{font-size:15px}.opt-btn{padding:12px 14px;font-size:14px}.screen h1{font-size:24px}}.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200;overflow:hidden}.confetti-piece{position:absolute;width:8px;height:8px;top:-10px;border-radius:2px;animation:confettiFall 1.8s ease-out forwards}@keyframes confettiFall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(720deg) scale(.3);opacity:0}}.score-pop{position:fixed;z-index:150;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--success);pointer-events:none;animation:scorePop 1s ease-out forwards}@keyframes scorePop{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.3)}}.score-miss{position:fixed;z-index:150;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--error);pointer-events:none;animation:scorePop .8s ease-out forwards}.streak.s2 svg{filter:drop-shadow(0 0 4px rgba(251,191,36,.4))}.streak.s5 svg{filter:drop-shadow(0 0 8px rgba(251,191,36,.6));transform:scale(1.1)}.streak.s5{color:#f59e0b}.streak.s10 svg{filter:drop-shadow(0 0 14px rgba(245,158,11,.8));transform:scale(1.25);animation:flamePulse .6s ease infinite}.streak.s10{color:#ef4444;font-size:18px}@keyframes flamePulse{0%,100%{transform:scale(1.25)}50%{transform:scale(1.35)}}@keyframes shakeIt{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}.shake{animation:shakeIt .4s ease}.diff-stars{display:inline-block;margin-left:10px;font-size:11px;letter-spacing:1px}.diff-stars .star-on{color:var(--warning)}.diff-stars .star-off{color:var(--border)}.stage-celebrate{position:relative}.stage-celebrate::before{content:'';position:absolute;top:50%;left:50%;width:200px;height:200px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(74,222,128,.15) 0,transparent 70%);animation:celebPulse 1.5s ease-out;pointer-events:none}@keyframes celebPulse{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}.q-card.correct-glow{animation:correctGlow .6s ease}@keyframes correctGlow{0%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}50%{box-shadow:0 0 20px 4px rgba(74,222,128,.15)}100%{box-shadow:none}}.q-card.wrong-glow{animation:wrongGlow .5s ease}@keyframes wrongGlow{0%{box-shadow:0 0 0 0 rgba(248,113,113,.4)}50%{box-shadow:0 0 15px 3px rgba(248,113,113,.1)}100%{box-shadow:none}}</style></head><body><div class="app" id="app"></div><script>const STAGES=[{name:"Recall & Recognise",desc:"I can identify and name forces and motion vocabulary.",qRange:[0,8]},{name:"Calculate & Apply",desc:"I can use formulas to calculate force, speed, and weight.",qRange:[9,17]},{name:"Interpret Diagrams",desc:"I can read and interpret force diagrams and determine net force.",qRange:[18,26]},{name:"Analyse & Transfer",desc:"I can apply forces concepts to real-world scenarios.",qRange:[27,35]},{name:"Evaluate & Synthesise",desc:"I can evaluate complex situations, spot errors, and reason about motion.",qRange:[36,43]}],QUESTIONS=[{type:"mcq",q:"What is a <span class='keyword'>force</span>?",opts:["A push or pull that acts on an object","The mass of an object","The weight of an object","The speed of an object"],ans:0,hint:"Think about what happens when you push a door or pull a rope.",why:"A force is a push or a pull that can change the motion, shape, or direction of an object."},{type:"mcq",q:"Which unit do we use to measure <span class='keyword'>force</span>?",opts:["Metres per second (m/s)","Newtons (N)","Joules (J)","Kilograms (kg)"],ans:1,hint:"This unit is named after a famous scientist who studied gravity.",why:"Force is measured in Newtons (N), named after Sir Isaac Newton."},{type:"mcq",q:"What is the difference between <span class='keyword'>mass</span> and <span class='keyword'>weight</span>?",opts:["They are the same thing","Weight is measured in kilograms","Mass is the amount of matter; weight is the force of gravity on that matter","Mass changes on different planets; weight stays the same"],ans:2,hint:"One of these changes if you go to the Moon. The other does not.",why:"Mass (kg) is how much matter is in an object — it stays the same everywhere. Weight (N) is the gravitational force on that mass — it changes with gravity."},{type:"mcq",q:"Which of these is a <span class='keyword'>contact force</span>?",opts:["Gravity","Magnetism","Electrostatic force","Friction"],ans:3,hint:"Contact forces need objects to be touching.",why:"Friction is a contact force — it happens when two surfaces rub against each other. Gravity, magnetism, and electrostatic forces can act at a distance."},{type:"mcq",q:"Which of these is a <span class='keyword'>non-contact force</span>?",opts:["Air resistance","Gravity","Normal force","Friction"],ans:1,hint:"Non-contact forces can act without the objects touching.",why:"Gravity acts at a distance — the Earth pulls you down without touching you. Friction, air resistance, and normal force all require contact."},{type:"diagram",q:"Look at this diagram. The same box is pushed with the same force across three surfaces. Which surface has the <span class='keyword'>most friction</span>?",diagram:"surfaces",opts:["Carpet — the box is hardest to push","Wood — medium resistance","All surfaces have the same friction","Ice — the box barely slows down"],ans:0,hint:"Rougher surfaces have more friction. Look at the length of the red friction arrows.",why:"<span class='keyword'>Carpet</span> has the most friction because it has the roughest surface. The rougher the surface, the more the tiny bumps catch and resist the sliding motion. Ice is very smooth, so friction is very low."},{type:"mcq",q:"An object at rest stays at rest unless acted on by a force. This describes which of <span class='keyword'>Newton's Laws</span>?",opts:["Newton's Second Law","The Law of Gravity","Newton's Third Law","Newton's First Law"],ans:3,hint:"This law is about what happens when forces are balanced (no net force).",why:"Newton's First Law (inertia) says objects keep doing what they are doing — staying still or moving at constant speed — unless a net force acts on them."},{type:"drag",q:"Put these types of forces into the correct category.",categories:["Contact Forces","Non-Contact Forces"],items:[{text:"Friction",correct:0},{text:"Gravity",correct:1},{text:"Air resistance",correct:0},{text:"Magnetism",correct:1},{text:"Normal force",correct:0},{text:"Electrostatic force",correct:1}],hint:"Contact forces need the objects to be touching. Non-contact forces act across a gap.",why:"Contact: friction, air resistance, normal force (all require touching). Non-contact: gravity, magnetism, electrostatic (all act at a distance)."},{type:"diagram",q:"<span class='keyword'>Gear A</span> turns clockwise. The teeth of Gear A and Gear B are meshed together. Which direction does <span class='keyword'>Gear B</span> turn?",diagram:"gear_pair",opts:["Clockwise (same direction as Gear A)","It could go either way","Anticlockwise (opposite direction to Gear A)","It does not turn"],ans:2,hint:"When two gears are meshed, their teeth push against each other. If one goes clockwise, the other must go...",why:"When two gears mesh, they always turn in <span class='keyword'>opposite directions</span>. If Gear A turns clockwise, Gear B turns anticlockwise. This is because the teeth push against each other at the contact point."},{type:"calc",q:"A car has a mass of <span class='keyword'>1200 kg</span> and accelerates at <span class='keyword'>3 m/s²</span>. Calculate the force. Use: F = m × a",answer:3600,unit:"N",tolerance:1,hint:"Multiply the mass by the acceleration. F = 1200 × 3",why:"F = m × a = 1200 × 3 = 3600 N. The larger the mass or acceleration, the greater the force needed."},{type:"calc",q:"A cyclist travels <span class='keyword'>240 metres</span> in <span class='keyword'>60 seconds</span>. What is their speed? Use: speed = distance ÷ time",answer:4,unit:"m/s",tolerance:.1,hint:"Divide the distance by the time. 240 ÷ 60",why:"Speed = distance ÷ time = 240 ÷ 60 = 4 m/s. This is the average speed over the whole journey."},{type:"calc",q:"What is the <span class='keyword'>weight</span> of an object with a mass of <span class='keyword'>8 kg</span> on Earth? Use: W = m × g (g = 10 N/kg)",answer:80,unit:"N",tolerance:1,hint:"Multiply the mass by gravitational field strength. 8 × 10",why:"W = m × g = 8 × 10 = 80 N. Weight is a force, so it is measured in Newtons."},{type:"calc",q:"A force of <span class='keyword'>500 N</span> acts on an object with mass <span class='keyword'>50 kg</span>. What is the acceleration? Use: a = F ÷ m",answer:10,unit:"m/s²",tolerance:.1,hint:"Rearrange F = m × a to find a. Divide the force by the mass.",why:"a = F ÷ m = 500 ÷ 50 = 10 m/s². A bigger force on the same mass gives a bigger acceleration."},{type:"calc",q:"A runner covers <span class='keyword'>100 m</span> at a speed of <span class='keyword'>8 m/s</span>. How long does it take? Use: time = distance ÷ speed",answer:12.5,unit:"s",tolerance:.1,hint:"Rearrange speed = distance ÷ time. Time = 100 ÷ 8",why:"Time = distance ÷ speed = 100 ÷ 8 = 12.5 seconds."},{type:"calc",q:"On the Moon, g = <span class='keyword'>1.6 N/kg</span>. What is the weight of a <span class='keyword'>70 kg</span> astronaut on the Moon?",answer:112,unit:"N",tolerance:1,hint:"Use W = m × g, but with the Moon's gravity value. 70 × 1.6",why:"W = m × g = 70 × 1.6 = 112 N. The astronaut's mass (70 kg) stays the same, but weight is much less on the Moon because gravity is weaker."},{type:"mcq",q:"A 2 kg ball is dropped. Using g = 10 N/kg, what is the net downward force if air resistance is <span class='keyword'>5 N</span>?",opts:["20 N","5 N","15 N","25 N"],ans:2,hint:"First find the weight (W = m × g = 2 × 10 = 20 N). Then subtract the air resistance.",why:"Weight = 2 × 10 = 20 N downward. Air resistance = 5 N upward. Net force = 20 − 5 = 15 N downward."},{type:"calc",q:"A car travels at <span class='keyword'>20 m/s</span> for <span class='keyword'>30 seconds</span>. How far does it travel? Use: distance = speed × time",answer:600,unit:"m",tolerance:1,hint:"Multiply speed by time. 20 × 30",why:"Distance = speed × time = 20 × 30 = 600 m."},{type:"diagram",q:"Look at the force diagram. The object has a <span class='keyword'>10 N</span> force pushing right and a <span class='keyword'>10 N</span> force pushing left. What is the net force?",diagram:"balanced",opts:["20 N to the left","0 N — forces are balanced","20 N to the right","10 N to the right"],ans:1,hint:"When forces are equal and opposite, they cancel each other out.",why:"10 N right + 10 N left = 0 N net force. The forces are balanced, so the object will not change its motion."},{type:"diagram",q:"This object has <span class='keyword'>15 N</span> pushing right and <span class='keyword'>8 N</span> pushing left. What is the net force and direction?",diagram:"unbalanced_right",opts:["7 N to the right","7 N to the left","8 N to the right","23 N to the right"],ans:0,hint:"Subtract the smaller force from the larger. The net force goes in the direction of the larger force.",why:"Net force = 15 − 8 = 7 N to the right. The object will accelerate to the right."},{type:"diagram",q:"Look at the diagram. There are <span class='keyword'>4 forces</span> acting on this object. What is the net force?",diagram:"complex",opts:["0 N","32 N to the right","12 N to the left","8 N to the right"],ans:3,hint:"Up and down forces cancel (both 30 N). For left and right: 20 right − 12 left = ?",why:"Up and down: 30 + 30 = balanced (cancel out). Left and right: 20 − 12 = 8 N to the right. The object speeds up to the right."},{type:"mcq",q:"In a force diagram, arrows represent forces. A <span class='keyword'>longer arrow</span> means:",opts:["More mass","A faster speed","More friction","A bigger force"],ans:3,hint:"Look at the arrows. A longer arrow means a bigger or smaller force?",why:"In force diagrams, a longer arrow means a bigger force. A short arrow means a small force."},{type:"diagram",q:"Look at this <span class='keyword'>Class 1 lever</span> diagram. Where is the fulcrum located?",diagram:"class1",opts:["Between the effort and the load","There is no fulcrum","At one end, with the load at the other end","Next to the effort force"],ans:0,hint:"In a Class 1 lever, the fulcrum (pivot point) sits between where you push and what you are lifting.",why:"In a <span class='keyword'>Class 1 lever</span>, the fulcrum is between the effort and the load. Examples: seesaw, scissors, pliers. This is like a balance — push one side down, the other side goes up."},{type:"mcq",q:"A box is pushed across a floor. The push force is <span class='keyword'>greater than</span> friction. The box will:",opts:["Slow down","Accelerate in the direction of the push","Stay still","Move at constant speed"],ans:1,hint:"If the forces are unbalanced (push > friction), what does Newton's Second Law say?",why:"Unbalanced force in the direction of the push means a net force exists. F = ma tells us the object accelerates."},{type:"drag",q:"Sort these everyday tools into the correct <span class='keyword'>lever class</span>.",categories:["Class 1 (fulcrum in middle)","Class 2 (load in middle)","Class 3 (effort in middle)"],items:[{text:"Scissors",correct:0},{text:"Wheelbarrow",correct:1},{text:"Tweezers",correct:2},{text:"Seesaw",correct:0},{text:"Bottle opener",correct:1},{text:"Fishing rod",correct:2}],hint:"Remember: Class 1 = fulcrum in the middle (seesaw). Class 2 = load in the middle (wheelbarrow). Class 3 = effort in the middle (tweezers).",why:"<span class='keyword'>Class 1</span>: scissors, seesaw (fulcrum in middle). <span class='keyword'>Class 2</span>: wheelbarrow, bottle opener (load in middle — these multiply force). <span class='keyword'>Class 3</span>: tweezers, fishing rod (effort in middle — these multiply distance/speed)."},{type:"diagram",q:"Two forces act on a ball: <span class='keyword'>6 N up</span> and <span class='keyword'>14 N down</span>. What is the net force?",diagram:"vertical_unbalanced",opts:["8 N upward","6 N upward","8 N downward","20 N downward"],ans:2,hint:"Subtract the smaller from the larger. Which direction is the bigger force?",why:"Net force = 14 N down − 6 N up = 8 N downward. The ball will accelerate downward."},{type:"mcq",q:"A car moves at constant velocity on a highway. What can you say about the forces?",opts:["The forces are balanced (net force = 0)","Friction is greater than the engine force","There are no forces acting on the car","The engine force is greater than friction"],ans:0,hint:"Constant velocity means no acceleration. What does that tell you about net force?",why:"Constant velocity means zero acceleration, which means zero net force. The driving force equals the total resistive forces (friction + air resistance)."},{type:"scenario",q:"A student says: <em>'My book is not moving, so there are no forces on it.'</em> Is this correct?",opts:["No — only gravity acts on it","Yes — no movement means no forces","No — gravity pulls it down and the table pushes it up, but the forces are balanced","Yes — forces only exist when things move"],ans:2,hint:"Just because something is still does not mean there are no forces. Think about what holds the book up.",why:"The book has weight pulling it down and the table pushes it up (normal force). These are balanced, so the net force is zero — but the forces still exist."},{type:"diagram",q:"In this gear chain, <span class='keyword'>Gear 1</span> turns clockwise (CW). What direction does <span class='keyword'>Gear 3</span> turn?",diagram:"gear_chain3",opts:["Anticlockwise — opposite to Gear 1","It does not move","It spins both ways","Clockwise — same as Gear 1"],ans:3,hint:"Work through it: Gear 1 is CW. So Gear 2 must be anti-CW. So Gear 3 must be...",why:"Gear 1 (CW) → Gear 2 (anti-CW) → Gear 3 (CW). Each gear turns the opposite way. With 3 gears (odd number), the last gear goes the <span class='keyword'>same way</span> as the first."},{type:"scenario",q:"Two teams play tug of war. Team A pulls with <span class='keyword'>500 N</span>. Team B pulls with <span class='keyword'>450 N</span>. Who wins?",opts:["Team B wins — 50 N toward Team B","Team A wins — net force is 50 N toward Team A","Nobody wins — 0 N","It is a draw — 950 N total"],ans:1,hint:"Subtract the smaller force from the larger. The rope moves toward the team with the bigger force.",why:"Net force = 500 − 450 = 50 N toward Team A. The rope (and Team B) accelerate toward Team A."},{type:"calc",q:"You push a trolley (mass <span class='keyword'>25 kg</span>) with <span class='keyword'>40 N</span>. Friction is <span class='keyword'>15 N</span>. Find the acceleration. Step 1: Net force = 40 − 15. Step 2: a = net force ÷ mass",answer:1,unit:"m/s²",tolerance:.1,hint:"First find net force: 40 − 15 = 25 N. Then use a = F ÷ m.",why:"Net force = 40 − 15 = 25 N. Acceleration = 25 ÷ 25 = 1 m/s²."},{type:"scenario",q:"You push a friend on a skateboard. As you push them, you feel yourself being pushed backward. This is an example of:",opts:["Newton's First Law — inertia","Newton's Third Law — action and reaction forces","Newton's Second Law — F = ma","Friction slowing you down"],ans:1,hint:"When you push someone, they push you back. These are equal and opposite forces.",why:"Newton's Third Law: every action has an equal and opposite reaction. You push your friend forward, your friend pushes you backward with the same force."},{type:"scenario",q:"Two cars have the same engine force. Car A has mass <span class='keyword'>1000 kg</span> and Car B has mass <span class='keyword'>2000 kg</span>. Which car accelerates faster?",opts:["Car B — more mass means more acceleration","They accelerate equally","Cannot tell without knowing the force","Car A — less mass means more acceleration for the same force"],ans:3,hint:"Use F = ma. If F is the same but m is smaller, what happens to a?",why:"F = ma, so a = F/m. Same force, smaller mass = bigger acceleration. Car A accelerates twice as fast as Car B."},{type:"diagram",q:"Look at the diagram. A hiking boot and a dress shoe are on the same wet surface. Why does the <span class='keyword'>hiking boot</span> have more grip?",diagram:"shoe_grip",opts:["The hiking boot has a rougher sole with deeper treads, creating more friction","Friction does not depend on the surface","The dress shoe is made of better material","The hiking boot is heavier"],ans:0,hint:"Friction depends on the surfaces touching. Which sole has more bumps and texture?",why:"The hiking boot has a <span class='keyword'>rough sole with deep treads</span>. More bumps = more grip = more friction. The smooth dress shoe slides easily because the surface is flat. We choose shoes based on how much grip we need."},{type:"drag",q:"Match each of Newton's Laws to the correct description.",categories:["Match"],items:[{text:"Objects at rest stay at rest unless a net force acts",correct:0,label:"First Law"},{text:"F = m × a",correct:0,label:"Second Law"},{text:"Every action has an equal and opposite reaction",correct:0,label:"Third Law"}],isMatch:!0,matchLabels:["First Law","Second Law","Third Law"],hint:"First = inertia, Second = the equation, Third = action-reaction pairs.",why:"First Law: inertia (no net force = no change in motion). Second Law: F = ma (force causes acceleration). Third Law: forces come in equal and opposite pairs."},{type:"scenario",q:"A heavy truck and a small car crash. Newton's Third Law says the forces they push on each other are:",opts:["The truck pushes harder","It depends on speed","Equal in size but opposite in direction","The car pushes harder"],ans:2,hint:"Newton's Third Law says action and reaction are always equal. Mass does not change the force.",why:"The truck pushes the car with the same force that the car pushes the truck. The forces are always equal. But the car speeds up more because it has less mass (F = ma, smaller m = bigger a). That is why the small car gets more damaged."},{type:"scenario",q:"A student writes: <em>'A ball thrown up slows down because the throw force gets weaker.'</em> What is wrong?",opts:["The student is correct","Air pushes the ball up","The throw force stops when the ball leaves your hand — after that, only gravity acts","There are no forces on the ball in the air"],ans:2,hint:"Once the ball leaves your hand, does your push still act on it? Think about contact forces.",why:"The throw is a contact force. It stops when the ball leaves your hand. After that, only gravity pulls the ball down. The ball slows because of gravity, not because the throw gets weaker."},{type:"calc",q:"A car slows from <span class='keyword'>30 m/s</span> to <span class='keyword'>10 m/s</span> in <span class='keyword'>5 seconds</span>. Its mass is <span class='keyword'>1500 kg</span>. Find the braking force. Step 1: Change in speed = 30 − 10 = 20. Step 2: a = 20 ÷ 5 = 4. Step 3: F = m × a",answer:6e3,unit:"N",tolerance:10,hint:"Step 1: speed change = 30 − 10 = 20 m/s. Step 2: a = 20 ÷ 5 = 4 m/s². Step 3: F = 1500 × 4",why:"Speed change = 20 m/s. Acceleration = 20 ÷ 5 = 4 m/s². Force = 1500 × 4 = 6000 N. This force slows the car down (braking)."},{type:"diagram",q:"Study this friction experiment setup. A student drags a block across different surfaces and measures the force. What is the <span class='keyword'>dependent variable</span> (what they measure)?",diagram:"experiment",opts:["The force needed to pull the block at constant speed","The speed of pulling","The type of surface","The mass of the block"],ans:0,hint:"Look at the labels on the diagram. The DV is what you measure. It changes when you change the surface.",why:"The <span class='keyword'>dependent variable is the force</span> shown on the force meter. It changes when you use different surfaces. You change the surface (IV). You keep the mass and speed the same (CV)."},{type:"diagram",q:"In this 4-gear chain, <span class='keyword'>Gear 1</span> turns anticlockwise. What direction does <span class='keyword'>Gear 4</span> turn?",diagram:"gear_chain4",opts:["It depends on the gear sizes","Clockwise","It does not move","Anticlockwise — same as Gear 1"],ans:1,hint:"Count the gears: 4 gears. Each gear reverses direction. Gear 1 is anti-CW, so Gear 2 is CW, Gear 3 is anti-CW, Gear 4 is...",why:"Gear 1 (anti-CW) → Gear 2 (CW) → Gear 3 (anti-CW) → Gear 4 (<span class='keyword'>CW</span>). Each gear turns the opposite way to the one before it. Simple rule: odd number of gears = last goes same way as first. Even number = last goes opposite way."},{type:"drag",q:"Rank from <span class='keyword'>lowest</span> net force (top) to <span class='keyword'>highest</span> net force (bottom).",categories:["Lowest to Highest Net Force"],items:[{text:"Book on table (balanced)",correct:0,order:0},{text:"Person walking (slight net forward force)",correct:0,order:1},{text:"Car accelerating onto highway",correct:0,order:2},{text:"Rocket launching into space",correct:0,order:3}],isOrdered:!0,hint:"Think about which situation has the most acceleration. More acceleration = more net force.",why:"Book: 0 N net force. Walking: small net force (~10–50 N). Car accelerating: moderate (~3000–5000 N). Rocket launch: enormous (~30,000,000+ N). Net force determines acceleration (F = ma)."},{type:"diagram",q:"Look at this lever diagram. The <span class='keyword'>fulcrum is at one end</span>, the <span class='keyword'>effort is in the middle</span>, and the <span class='keyword'>load is at the other end</span>. What class is this lever?",diagram:"class_unknown",opts:["Class 2 — load is between fulcrum and effort","Class 1 — fulcrum is between effort and load","This is not a lever","Class 3 — effort is between fulcrum and load"],ans:3,hint:"Look at the positions. Fulcrum at one end. Effort in the middle. Load at the far end. Which class has effort in the middle?",why:"This is a <span class='keyword'>Class 3 lever</span>. The effort is between the fulcrum and the load. Class 3 levers do not make force bigger. Instead, they make movement faster or cover more distance. Examples: tweezers, fishing rods, brooms, your arm."},{type:"scenario",q:"You stand on a scale in a lift. The lift goes <span class='keyword'>up</span>. The scale shows a number <span class='keyword'>bigger</span> than your normal weight. Why?",opts:["The floor must push extra hard to speed you up, so the scale reads more","You gain mass in the lift","The scale is broken","Gravity is stronger in the lift"],ans:0,hint:"The scale measures the push from the floor (normal force). When you speed up going up, the floor pushes harder.",why:"When the lift speeds up going up, the floor must push you harder than just your weight. The scale reads this bigger push. You feel heavier. Your mass has not changed."},{type:"scenario",q:"Which example best shows how understanding forces makes us <span class='keyword'>safer</span>?",opts:["Heavier cars are safer because they have more mass","Seatbelts work by making you lighter","Faster cars are safer because they have more force","Car crumple zones — they slow down the crash over more time, so the force on people is smaller"],ans:3,hint:"To make force smaller, you can spread the stop over more time. Which design does this?",why:"Crumple zones make the crash take longer. More time to stop = less force on people. This uses F = ma: if you slow down more gently (less acceleration), the force is smaller."}],SAVE_KEY="fm_g7_review_v1";function freshState(){return{screen:"intro",currentQ:0,currentStage:0,score:0,streak:0,bestStreak:0,answered:0,stageScores:[0,0,0,0,0],stageAttempts:[0,0,0,0,0],achievements:{streak3:!1,streak5:!1,streak10:!1,perfectStage:!1,allCalc:!1,speedDemon:!1,complete:!1},calcCorrect:0,calcTotal:0,questionStartTime:0,fastAnswers:0,qResults:[],retryMode:!1,retryQueue:[],answerLocked:!1}}function saveState(){try{const e={currentQ:state.currentQ,score:state.score,streak:state.streak,bestStreak:state.bestStreak,answered:state.answered,stageScores:state.stageScores,stageAttempts:state.stageAttempts,achievements:state.achievements,calcCorrect:state.calcCorrect,calcTotal:state.calcTotal,fastAnswers:state.fastAnswers,qResults:state.qResults,savedAt:Date.now()};localStorage.setItem(SAVE_KEY,JSON.stringify(e))}catch(e){}}function loadState(){try{const e=localStorage.getItem(SAVE_KEY);if(!e)return null;const t=JSON.parse(e);return!t||"number"!=typeof t.currentQ||t.answered<1||t.achievements&&t.achievements.complete?null:t}catch(e){return null}}function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}function resumeFromSave(e){state=freshState(),state.currentQ=e.currentQ,state.score=e.score,state.streak=e.streak,state.bestStreak=e.bestStreak,state.answered=e.answered,state.stageScores=e.stageScores||[0,0,0,0,0],state.stageAttempts=e.stageAttempts||[0,0,0,0,0],state.achievements=e.achievements||freshState().achievements,state.calcCorrect=e.calcCorrect||0,state.calcTotal=e.calcTotal||0,state.fastAnswers=e.fastAnswers||0,state.qResults=e.qResults||[],state.screen="game",state.questionStartTime=Date.now()}let state=freshState();const app=document.getElementById("app");function render(){switch(state.screen){case"intro":renderIntro();break;case"game":renderGame();break;case"stageTransition":renderStageTransition();break;case"results":renderResults()}}function renderIntro(){const e=loadState(),t=e?`\n    <div style="margin-top:20px; padding:16px; background:var(--surface-2); border:1px solid var(--primary); border-radius:var(--radius);">\n      <p style="font-size:14px; color:var(--primary); font-weight:600; margin-bottom:4px;">Saved progress found</p>\n      <p style="font-size:13px; color:var(--text-muted);">Question ${e.currentQ+1} of ${QUESTIONS.length} · ${e.score}/${e.answered} correct · Stage ${getStageForQ(e.currentQ)+1}</p>\n      <div style="display:flex; gap:8px; margin-top:12px; justify-content:center; flex-wrap:wrap;">\n        <button class="start-btn" style="margin:0; padding:12px 32px; font-size:15px;" onclick="resumeGame()">Continue →</button>\n        <button class="start-btn" style="margin:0; padding:12px 32px; font-size:15px; background:var(--surface); border:1px solid var(--border); color:var(--text-muted);" onclick="startFresh()">Start Over</button>\n      </div>\n    </div>\n  `:'<button class="start-btn" onclick="startGame()">Begin Review</button>';app.innerHTML=`\n    <div class="screen">\n      <h1>Forces & Motion</h1>\n      <p>Grade 7 — Exam Revision</p>\n      <p class="soi">"Relationships between forces and motion help us understand interaction and function in the context of scientific and technical innovation."</p>\n      <div style="margin:20px 0;">\n        <p style="font-size:13px;"><strong style="color:var(--primary);">Key Concept:</strong> Relationships &nbsp;|&nbsp; <strong style="color:var(--accent);">Related:</strong> Function, Interaction</p>\n        <p style="font-size:13px; margin-top:4px;"><strong style="color:var(--warning);">ATL:</strong> Critical Thinking</p>\n      </div>\n      <p style="font-size:14px; margin-top:16px; color:var(--text);">${QUESTIONS.length} questions across 5 stages</p>\n      <p style="font-size:13px;">Recall → Calculate → Diagrams → Analyse → Evaluate</p>\n      ${t}\n    </div>\n  `}function startGame(){state=freshState(),state.screen="game",state.questionStartTime=Date.now(),clearSave(),render()}function getStageForQ(e){for(let t=0;t<STAGES.length;t++)if(e>=STAGES[t].qRange[0]&&e<=STAGES[t].qRange[1])return t;return STAGES.length-1}function progressPercent(){return Math.round(state.answered/getTotalActiveQuestions()*100)}function renderHeader(){const e=progressPercent(),t=2*Math.PI*18;return`\n    <div class="header">\n      <div class="header-left">\n        <div class="progress-ring-wrap">\n          <svg class="progress-ring" width="48" height="48">\n            <circle class="progress-ring-bg" cx="24" cy="24" r="18"/>\n            <circle class="progress-ring-fill" cx="24" cy="24" r="18"\n              stroke-dasharray="${t}" stroke-dashoffset="${t-e/100*t}"/>\n          </svg>\n          <div class="progress-ring-text">${e}%</div>\n        </div>\n        <div class="streak">\n          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z"/></svg>\n          ${state.streak}\n        </div>\n      </div>\n      <div class="header-right">\n        <div class="score-display"><span>${state.score}</span> / ${state.answered}</div>\n      </div>\n    </div>\n  `}function renderStagePips(){const
