<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Estimation Arena — LearnLattice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0a1a;color:#e2e8f0;font-family:'Sora',sans-serif;min-height:100vh}
.hdr{padding:14px 20px;background:linear-gradient(135deg,#1a0a3e,#0c0a1a);border-bottom:1px solid rgba(139,92,246,.2);display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.2rem;color:#a78bfa;font-weight:800;letter-spacing:1px}
.stats{display:flex;gap:16px;font-size:.8rem}
.stats span{color:#a78bfa;font-weight:600}
.arena{max-width:640px;margin:0 auto;padding:24px}
.q-card{background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(59,130,246,.05));border:1px solid rgba(139,92,246,.2);border-radius:20px;padding:32px;text-align:center;margin-bottom:24px;position:relative;overflow:hidden}
.q-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(139,92,246,.05),transparent 60%);pointer-events:none}
.q-num{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:rgba(139,92,246,.5);margin-bottom:12px}
.q-text{font-size:1.3rem;font-weight:600;color:#e2e8f0;line-height:1.4;margin-bottom:8px}
.q-hint{font-size:.78rem;color:#94a3b8;margin-bottom:20px}
.slider-wrap{margin:20px 0}
.slider-label{display:flex;justify-content:space-between;font-size:.7rem;color:#64748b;margin-bottom:6px}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#a78bfa;border:3px solid #0c0a1a;box-shadow:0 0 12px rgba(139,92,246,.4);cursor:grab}
.guess-display{font-family:'Sora',sans-serif;font-size:2rem;font-weight:800;color:#a78bfa;text-align:center;margin:12px 0;min-height:48px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-family:'Sora',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.3)}
.btn:active{transform:scale(.98)}
.result{display:none;text-align:center;padding:20px;border-radius:16px;margin-top:16px;animation:fadeIn .4s}
.result.show{display:block}
.result-score{font-size:3rem;font-weight:800;margin-bottom:8px}
.result-text{font-size:.85rem;color:#94a3b8;line-height:1.6}
.result-answer{font-size:1.1rem;font-weight:700;color:#a78bfa;margin:8px 0}
.accuracy-bar{height:10px;border-radius:5px;background:#1e293b;margin:12px 0;overflow:hidden}
.accuracy-fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.next-btn{margin-top:16px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);color:#a78bfa}
.next-btn:hover{background:rgba(139,92,246,.25)}
.total{text-align:center;margin-top:24px;padding:20px;background:rgba(139,92,246,.05);border:1px solid rgba(139,92,246,.15);border-radius:16px;display:none}
.total h2{font-size:1.4rem;color:#a78bfa;margin-bottom:8px}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
</style></head><body>
<div class="hdr"><h1>🎯 Estimation Arena</h1><div class="stats"><span id="qn">1 / 8</span><span id="pts">0 pts</span></div></div>
<div class="arena">
  <div class="q-card" id="qCard">
    <div class="q-num" id="qNum">Question 1</div>
    <div class="q-text" id="qText"></div>
    <div class="q-hint" id="qHint"></div>
    <div class="slider-wrap">
      <div class="slider-label"><span id="sMin"></span><span id="sMax"></span></div>
      <input type="range" id="slider" min="0" max="100" value="50" oninput="updateGuess()">
    </div>
    <div class="guess-display" id="guessDisp">—</div>
    <button class="btn" id="lockBtn" onclick="lock()">Lock In</button>
    <div class="result" id="result">
      <div class="result-score" id="rScore"></div>
      <div class="result-answer" id="rAnswer"></div>
      <div class="accuracy-bar"><div class="accuracy-fill" id="accFill"></div></div>
      <div class="result-text" id="rText"></div>
      <button class="btn next-btn" onclick="next()">Next Question →</button>
    </div>
  </div>
  <div class="total" id="total"><h2 id="totalText"></h2><p id="totalSub"></p></div>
</div>
<script>
var questions=[
  {q:"How many seconds are in one day?",hint:"60 seconds × 60 minutes × 24 hours",answer:86400,min:1000,max:500000,unit:"",format:function(v){return v.toLocaleString()}},
  {q:"How many grains of rice fit in a standard coffee mug?",hint:"A mug holds about 350ml. A grain of rice is about 65mm³.",answer:5400,min:100,max:50000,unit:" grains",format:function(v){return v.toLocaleString()}},
  {q:"How tall is the Eiffel Tower in metres?",hint:"Taller than a 100-storey building, shorter than 400m.",answer:330,min:50,max:600,unit:" m",format:function(v){return Math.round(v)+' m'}},
  {q:"How many times does your heart beat in one day?",hint:"About 60-100 beats per minute at rest.",answer:100000,min:5000,max:500000,unit:"",format:function(v){return v.toLocaleString()}},
  {q:"How many tennis balls fit inside a school bus?",hint:"A school bus is roughly 2.4m × 2.4m × 12m. A tennis ball is ~6.7cm diameter.",answer:38000,min:500,max:200000,unit:"",format:function(v){return v.toLocaleString()}},
  {q:"What is the speed of sound in metres per second?",hint:"Sound takes about 3 seconds to travel 1km.",answer:343,min:50,max:1000,unit:" m/s",format:function(v){return Math.round(v)+' m/s'}},
  {q:"How many pages are in all 7 Harry Potter books combined?",hint:"Each book averages around 500-600 pages.",answer:4224,min:500,max:10000,unit:" pages",format:function(v){return v.toLocaleString()+' pages'}},
  {q:"How many breaths do you take in one year?",hint:"About 15-20 breaths per minute at rest.",answer:7884000,min:100000,max:20000000,unit:"",format:function(v){return v.toLocaleString()}},
];
var qi=0,total=0,locked=false;

function loadQ(){
  locked=false;
  var q=questions[qi];
  document.getElementById('qNum').textContent='Question '+(qi+1);
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qHint').textContent='💡 '+q.hint;
  document.getElementById('slider').min=Math.log10(q.min)*100;
  document.getElementById('slider').max=Math.log10(q.max)*100;
  document.getElementById('slider').value=(Math.log10(q.min)+Math.log10(q.max))/2*100;
  document.getElementById('sMin').textContent=q.format(q.min);
  document.getElementById('sMax').textContent=q.format(q.max);
  document.getElementById('result').className='result';
  document.getElementById('lockBtn').style.display='block';
  document.getElementById('qn').textContent=(qi+1)+' / '+questions.length;
  updateGuess();
}

function updateGuess(){
  var q=questions[qi];
  var logVal=document.getElementById('slider').value/100;
  var val=Math.round(Math.pow(10,logVal));
  document.getElementById('guessDisp').textContent=q.format(val);
}

function getGuess(){
  var logVal=document.getElementById('slider').value/100;
  return Math.round(Math.pow(10,logVal));
}

function lock(){
  if(locked)return;locked=true;
  var q=questions[qi],guess=getGuess();
  var ratio=guess/q.answer;
  var accuracy=Math.max(0,100-Math.abs(Math.log10(ratio))*100);
  var pts=Math.round(accuracy);
  total+=pts;

  var color=accuracy>80?'#22c55e':accuracy>50?'#f59e0b':'#ef4444';
  document.getElementById('rScore').textContent=pts+' pts';
  document.getElementById('rScore').style.color=color;
  document.getElementById('rAnswer').textContent='Actual answer: '+q.format(q.answer);
  document.getElementById('accFill').style.width=accuracy+'%';
  document.getElementById('accFill').style.background=color;

  if(accuracy>80) document.getElementById('rText').textContent='Excellent estimation! Within a factor of 1.6×.';
  else if(accuracy>50) document.getElementById('rText').textContent='Good estimate — you had the right order of magnitude.';
  else document.getElementById('rText').textContent='Off by more than 10×. The hint might help next time!';

  document.getElementById('result').className='result show';
  document.getElementById('lockBtn').style.display='none';
  document.getElementById('pts').textContent=total+' pts';
}

function next(){
  if(qi<questions.length-1){qi++;loadQ();}
  else{
    document.getElementById('qCard').style.display='none';
    var t=document.getElementById('total');t.style.display='block';
    var avg=Math.round(total/questions.length);
    document.getElementById('totalText').textContent='🎯 Final Score: '+total+' / '+questions.length*100;
    if(avg>70) document.getElementById('totalSub').textContent='Outstanding estimator! You have strong number sense.';
    else if(avg>40) document.getElementById('totalSub').textContent='Solid estimation skills. Keep practising Fermi problems!';
    else document.getElementById('totalSub').textContent='Estimation takes practice. Try thinking about orders of magnitude.';
  }
}

loadQ();
</script></body></html>
