<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angle Hunter. LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh}.hdr{padding:10px 20px;background:rgba(245,158,11,.06);border-bottom:1px solid rgba(245,158,11,.15);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#fbbf24;font-weight:700}.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#fbbf24}.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.2)}.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-bottom:4px}.pg-bar.done{background:#f59e0b}.pg-bar.active{background:#ec4899;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pg-label{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}.pg.done .pg-label{color:#f59e0b}.pg.active .pg-label{color:#ec4899}.game{max-width:640px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#f59e0b;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:700;margin-bottom:8px}.s-desc{font-size:.85rem;color:#94a3b8;margin-bottom:4px}.s-ican{font-size:.78rem;color:#fde68a;font-style:italic;margin-bottom:20px}.btn{padding:12px 28px;border-radius:10px;border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.1);color:#fde68a;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(245,158,11,.2);border-color:#f59e0b;transform:translateY(-2px)}.btn-go{background:#f59e0b;color:#0f172a;border-color:#f59e0b}.btn-go:hover{background:#d97706}.q{animation:fadeIn .4s}.q-card{padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:16px}.q-num{font-size:.65rem;color:#f59e0b;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.q-text{font-size:1rem;font-weight:600;color:#fff;margin-bottom:16px;line-height:1.5}.angle-box{padding:16px;background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.12);border-radius:12px;margin-bottom:16px;text-align:center}.angle-diagram{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:#fde68a;line-height:1.6}.angle-val{font-family:'JetBrains Mono',monospace;font-size:1.6rem;color:#fbbf24;font-weight:700;margin-bottom:8px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts-1{grid-template-columns:1fr}.opt{padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-size:.88rem;cursor:pointer;transition:all .2s;text-align:center;font-family:'DM Sans',sans-serif;font-weight:500}.opt:hover:not(.locked){border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.06);transform:translateY(-2px)}.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-no{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#f59e0b;font-weight:700}.r-label{font-size:1.1rem;font-weight:700;margin:6px 0}.r-detail{font-size:.85rem;color:#94a3b8;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}.sd{text-align:center;padding:28px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}</style><style id="ec">.embed-mode .hdr{display:none!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>📐 Angle Hunter</h1><span class="pts" id="pts">0 pts</span></div><div class="progress" id="prog"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,correct=0,total=0,sc=0;const STG=[{name:"Types",desc:"Name the angle type",ican:"I can classify angles as acute, right, obtuse, straight, or reflex.",qs:6},{name:"Lines & Points",desc:"Find missing angles on lines and at points",ican:"I can use angle rules (on a line = 180°, at a point = 360°, vertically opposite).",qs:5},{name:"Shapes",desc:"Find angles in triangles and quadrilaterals",ican:"I can find missing angles using triangle (180°) and quadrilateral (360°) rules.",qs:5},{name:"Parallel Lines",desc:"Use parallel line angle rules",ican:"I can identify alternate, co-interior, and corresponding angles.",qs:5}];function ri(e,t){return e+Math.floor(Math.random()*(t-e+1))}function sh(e){for(let t=e.length-1;t>0;t--){const a=Math.floor(Math.random()*(t+1));[e[t],e[a]]=[e[a],e[t]]}return e}function gen0(){return sh([{a:ri(10,85),type:"Acute",hint:"Acute angles are less than 90°.",why:'This angle is less than 90°, so it\'s acute (think "a-cute little angle").'},{a:90,type:"Right angle",hint:"Exactly 90°. look for the square symbol.",why:"Exactly 90° = a right angle. Marked with a small square."},{a:ri(95,170),type:"Obtuse",hint:"Obtuse angles are between 90° and 180°.",why:'Between 90° and 180° = obtuse (think "obese". bigger than a right angle but less than straight).'},{a:180,type:"Straight angle",hint:"A straight line = 180°.",why:"Exactly 180° = a straight angle. It's a straight line."},{a:ri(185,350),type:"Reflex",hint:"Reflex angles are greater than 180° (more than half a turn).",why:'Greater than 180° = reflex angle. It goes "past" the straight line.'},{a:360,type:"Full turn",hint:"A complete rotation = 360°.",why:"360° = a full turn. You end up facing the same direction."},{a:ri(20,70),type:"Acute",hint:"Less than 90° = acute.",why:"This angle is less than 90°, making it acute."},{a:ri(100,160),type:"Obtuse",hint:"Between 90° and 180° = obtuse.",why:"Between 90° and 180° = obtuse."},{a:ri(200,340),type:"Reflex",hint:"More than 180° = reflex.",why:"Greater than 180° = reflex."}]).slice(0,STG[0].qs).map(e=>{const t=sh(["Acute","Right angle","Obtuse","Straight angle","Reflex","Full turn"].filter(t=>t!==e.type)).slice(0,3),a=sh([e.type,...t]);return{angle:e.a,q:`An angle of <strong>${e.a}°</strong> is called:`,opts:a,correct:a.indexOf(e.type),hint:e.hint,why:e.why}})}function gen1(){const e=[];for(let t=0;t<STG[1].qs;t++){const t=ri(0,2);if(0===t){const t=ri(30,140),a=180-t,n=sh([a+"°",180+t+"°",360-t+"°",t+"°"]);e.push({diagram:`Straight line: ${t}° + x = 180°`,q:`Two angles on a straight line. One is ${t}°. Find the other.`,opts:n,correct:n.indexOf(a+"°"),hint:`Angles on a straight line add to 180°. So x = 180 − ${t}.`,why:`180° − ${t}° = ${a}°. Angles on a straight line always sum to 180°.`})}else if(1===t){const t=ri(40,120),a=ri(40,120),n=360-t-a,s=sh([n+"°",180-t+"°",360-t+"°",t+a+"°"]);e.push({diagram:`Around a point: ${t}° + ${a}° + x = 360°`,q:`Three angles meet at a point: ${t}°, ${a}°, and x. Find x.`,opts:s,correct:s.indexOf(n+"°"),hint:`Angles at a point add to 360°. x = 360 − ${t} − ${a}.`,why:`360° − ${t}° − ${a}° = ${n}°. Angles around a point always sum to 360°.`})}else{const t=ri(25,155),a=sh([t+"°",180-t+"°",360-t+"°",(90-t>0?90-t:t+90)+"°"]);e.push({diagram:`Two lines cross: one angle is ${t}°`,q:`Two straight lines cross. One angle is ${t}°. The vertically opposite angle is:`,opts:a,correct:a.indexOf(t+"°"),hint:"Vertically opposite angles are always equal.",why:`Vertically opposite angles are equal: ${t}° = ${t}°. The adjacent angles would be ${180-t}°.`})}}return e}function gen2(){const e=[];for(let t=0;t<STG[2].qs;t++){const t=ri(0,2);if(0===t){const t=ri(30,80),a=ri(30,80),n=180-t-a,s=sh([n+"°",360-t-a+"°",t+a+"°",(90-n>0?90:n+10)+"°"]);e.push({diagram:`Triangle: ${t}° + ${a}° + x = 180°`,q:`A triangle has angles ${t}° and ${a}°. Find the third angle.`,opts:s,correct:s.indexOf(n+"°"),hint:`Angles in a triangle add to 180°. x = 180 − ${t} − ${a}.`,why:`180° − ${t}° − ${a}° = ${n}°. Interior angles of any triangle sum to 180°.`})}else if(1===t){const t=ri(40,100),a=(180-t)/2,n=sh([a+"°",t+"°",180-t+"°",t/2+"°"]);e.push({diagram:`Isosceles triangle: base angle = ${t}°, two equal sides`,q:`An isosceles triangle has a base angle of ${t}°. Find each of the two equal angles.`,opts:n,correct:n.indexOf(a+"°"),hint:`Isosceles = two equal angles. Base angles are ${t}° each... wait, or is ${t}° the top? Let me re-read. The two EQUAL angles: 180 − ${t} = ${180-t}, then ÷2.`,why:`The two equal angles = (180° − ${t}°) ÷ 2 = ${a}° each. Isosceles triangles have two equal base angles.`})}else{const t=ri(60,120),a=ri(60,120),n=ri(60,120),s=360-t-a-n,i=sh([s+"°",180-t+"°",t+a+"°",360-t+"°"]);e.push({diagram:`Quadrilateral: ${t}° + ${a}° + ${n}° + x = 360°`,q:`A quadrilateral has angles ${t}°, ${a}°, and ${n}°. Find the fourth angle.`,opts:i,correct:i.indexOf(s+"°"),hint:`Angles in a quadrilateral add to 360°. x = 360 − ${t} − ${a} − ${n}.`,why:`360° − ${t}° − ${a}° − ${n}° = ${s}°. Interior angles of any quadrilateral sum to 360°.`})}}return e}function gen3(){return sh([{diagram:"Two parallel lines cut by a transversal. Angle a = 65° (top-left of upper intersection).",q:"The alternate angle to 65° is:",opts:["65°","115°","25°","180°"],correct:0,hint:"Alternate angles (Z-shape) are equal when lines are parallel.",why:"Alternate angles are equal: 65°. They form a Z-shape between the parallel lines."},{diagram:"Two parallel lines cut by a transversal. Angle = 110° (top-left).",q:"The corresponding angle is:",opts:["110°","70°","180°","90°"],correct:0,hint:"Corresponding angles (F-shape) are equal when lines are parallel.",why:"Corresponding angles are equal: 110°. They're in the same position at each intersection (F-shape)."},{diagram:"Two parallel lines cut by a transversal. Angle a = 55° (above the line).",q:"The co-interior (same-side) angle is:",opts:["125°","55°","305°","180°"],correct:0,hint:"Co-interior angles (C-shape or U-shape) add to 180°.",why:"Co-interior angles sum to 180°: 180° − 55° = 125°. They're between the parallel lines on the same side."},{diagram:"Parallel lines. One angle is 72°.",q:"Its alternate angle is x and corresponding angle is y. What are x and y?",opts:["x = 72°, y = 72°","x = 108°, y = 72°","x = 72°, y = 108°","x = 108°, y = 108°"],correct:0,hint:"Both alternate AND corresponding angles equal the original when lines are parallel.",why:"Alternate angles are equal (72°). Corresponding angles are equal (72°). Both rules give the same answer here."},{diagram:"Parallel lines cut by transversal. Co-interior angle a = 130°.",q:"Find co-interior angle b:",opts:["50°","130°","230°","180°"],correct:0,hint:"Co-interior angles add to 180°. b = 180 − 130.",why:"Co-interior angles sum to 180°: b = 180° − 130° = 50°."},{diagram:"Two parallel lines. Angle between transversal and top line = x. Angle between transversal and bottom line = 3x.",q:"If these are co-interior angles, find x:",opts:["45°","60°","30°","90°"],correct:0,hint:"Co-interior: x + 3x = 180°. Solve for x.",why:"x + 3x = 180° → 4x = 180° → x = 45°. Then 3x = 135°. Check: 45 + 135 = 180° ✓"}]).slice(0,STG[3].qs)}const generators=[gen0,gen1,gen2,gen3];let questions=[];function renderProg(){document.getElementById("prog").innerHTML=STG.map((e,t)=>`<div class="pg ${t<stage?"done":t===stage?"active":""}"><div class="pg-bar ${t<stage?"done":t===stage?"active":""}"></div><span class="pg-label">${e.name}</span></div>`).join("")}function showIntro(){sc=0,questions=generators[stage](),qIdx=0,document.getElementById("game").innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STG.length}</div><div class="s-name">${STG[stage].name}</div><div class="s-desc">${STG[stage].desc}</div><div class="s-ican">"${STG[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`,renderProg()}function showQ(){if(qIdx>=questions.length)return void showSD();const e=questions[qIdx];let t=`<div class="q"><div class="q-card"><div class="q-num">Q${qIdx+1} of ${questions.length}</div>`;e.angle&&(t+=`<div class="angle-box"><div class="angle-val">${e.angle}°</div></div>`),e.diagram&&(t+=`<div class="angle-box"><div class="angle-diagram">${e.diagram}</div></div>`),t+=`<div class="q-text">${e.q}</div><div class="opts ${e.opts.some(e=>e.length>30)?"opts-1":""}">${e.opts.map((e,t)=>`<button class="opt" onclick="check(${t})" id="o${t}">${e}</button>`).join("")}</div></div><div id="fb"></div><div class="next" id="nx"></div></div>`,document.getElementById("game").innerHTML=t}function check(e){const t=questions[qIdx];total++,document.querySelectorAll(".opt").forEach(e=>e.classList.add("locked")),e===t.correct?(document.getElementById("o"+e).classList.add("correct"),correct++,sc++,pts+=10,document.getElementById("pts").textContent=pts+" pts",document.getElementById("fb").innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${t.why}</div>`):(document.getElementById("o"+e).classList.add("wrong"),document.getElementById("o"+t.correct).classList.add("correct"),document.getElementById("fb").innerHTML=`<div class="fb fb-no"><strong>💡 Hint:</strong>${t.hint}</div>`),document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()">Next →</button>'}function showSD(){const e=Math.round(sc/questions.length*100),t=e>=80?"⭐⭐⭐":e>=60?"⭐⭐":"⭐";stage<STG.length-1?document.getElementById("game").innerHTML=`<div class="sd"><div class="sd-stars">${t}</div><div class="s-name">${STG[stage].name} Complete!</div><p style="color:#94a3b8;margin:8px 0">${sc}/${questions.length}</p><button class="btn btn-go" onclick="stage++;showIntro()">Next →</button></div>`:showResults()}function showResults(){const e=Math.round(correct/total*100);let t="🏆 Angle Expert!",a="You can classify, calculate, and apply angle rules in shapes and parallel lines.";e<50?(t="📐 Keep hunting!",a="Review the key rules: straight line = 180°, triangle = 180°, vertically opposite are equal."):e<75&&(t="📐 Sharp eye!",a="Good basics. Practice the parallel line rules (alternate, corresponding, co-interior)."),document.getElementById("game").innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${t}</div><div class="r-detail">${a}<br>Score: ${pts} pts</div><div class="r-transfer">🌍 <strong>Angles in life:</strong> Architecture (roof angles for rain), snooker (angle of reflection), satellite dishes (precise angles), ramps for accessibility (slope angles), and navigation (bearings). Every building you see was designed using angle rules.</div><div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`,renderProg()}showIntro()</script></body></html>
