<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Web Builder — LearnLattice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}
.header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:#0f172a;border-bottom:1px solid #1e293b;z-index:10;position:relative}
h1{font-size:1.2rem;background:linear-gradient(135deg,#14b8a6,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.controls{display:flex;gap:8px}
.ctrl-btn{padding:6px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.78rem;transition:all .15s}
.ctrl-btn:hover{border-color:#14b8a6;color:#e2e8f0}
.ctrl-btn.danger{border-color:#7f1d1d;color:#fca5a5}
.ctrl-btn.danger:hover{background:#7f1d1d;color:#fff}
.sidebar{position:absolute;top:49px;left:0;bottom:0;width:180px;background:#0f172a;border-right:1px solid #1e293b;padding:12px;overflow-y:auto;z-index:5}
.sidebar-title{font-size:.68rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.organism{padding:8px 10px;margin-bottom:4px;border-radius:8px;border:1px solid #1e293b;cursor:grab;transition:all .15s;font-size:.82rem;display:flex;align-items:center;gap:6px}
.organism:hover{border-color:#14b8a6;background:#1e293b}
.organism .emoji{font-size:1.2rem}
.organism.placed{opacity:.35;cursor:default}
.trophic-label{font-size:.6rem;padding:2px 6px;border-radius:4px;margin-left:auto;font-weight:600}
.t-producer{background:rgba(34,197,94,.15);color:#22c55e}
.t-primary{background:rgba(59,130,246,.15);color:#3b82f6}
.t-secondary{background:rgba(245,158,11,.15);color:#f59e0b}
.t-tertiary{background:rgba(239,68,68,.15);color:#ef4444}
.t-decomposer{background:rgba(168,85,247,.15);color:#a855f7}
.canvas{position:absolute;top:49px;left:180px;right:0;bottom:0}
svg{width:100%;height:100%}
.node{cursor:pointer}
.node circle{stroke-width:2;transition:all .2s}
.node:hover circle{stroke-width:3;filter:drop-shadow(0 0 8px rgba(45,212,191,.5))}
.node text{font-size:11px;fill:#e2e8f0;text-anchor:middle;pointer-events:none}
.node .emoji-label{font-size:22px;text-anchor:middle;pointer-events:none}
.link{stroke-width:2;fill:none;marker-end:url(#arrowhead)}
.link.energy{stroke:#14b8a6;opacity:.6}
.link.removing{stroke:#ef4444;opacity:1;stroke-width:3;stroke-dasharray:6,3}
.info-panel{position:absolute;bottom:16px;left:196px;right:16px;background:rgba(15,23,42,.92);border:1px solid #1e293b;border-radius:12px;padding:14px 18px;backdrop-filter:blur(10px);font-size:.82rem;color:#94a3b8;transition:all .3s}
.info-panel strong{color:#14b8a6}
.info-panel .impact{color:#f59e0b}
.stats-bar{display:flex;gap:16px;font-size:.72rem;color:#64748b;padding:6px 12px;background:#020617;border-radius:8px;margin-top:8px}
.stats-bar span{color:#14b8a6}
</style>
</head>
<body>
<div class="header">
  <h1>Food Web Builder</h1>
  <div class="controls">
    <button class="ctrl-btn" onclick="resetWeb()" id="resetBtn">Reset</button>
    <button class="ctrl-btn danger" id="removeBtn" onclick="toggleRemoveMode()">🔴 Remove Species</button>
  </div>
</div>

<div class="sidebar">
  <div class="sidebar-title">Organisms</div>
  <div id="organismList"></div>
</div>

<div class="canvas">
  <svg id="svg">
    <defs>
      <marker id="arrowhead" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#14b8a6" opacity=".6"/>
      </marker>
    </defs>
    <g id="linksGroup"></g>
    <g id="nodesGroup"></g>
  </svg>
</div>

<div class="info-panel" id="infoPanel">
  <strong>Drag organisms</strong> from the sidebar onto the canvas to place them. Then click two organisms to create a feeding link (prey → predator). Use "Remove Species" to see what happens when a species disappears.
  <div class="stats-bar">Organisms: <span id="statOrg">0</span> &nbsp;|&nbsp; Links: <span id="statLinks">0</span> &nbsp;|&nbsp; Trophic levels: <span id="statTrophic">0</span></div>
</div>

<script>
const organisms=[
  {id:'sun',name:'Sunlight',emoji:'☀️',trophic:'producer',prey:[]},
  {id:'grass',name:'Grass',emoji:'🌿',trophic:'producer',prey:['sun']},
  {id:'algae',name:'Algae',emoji:'🟢',trophic:'producer',prey:['sun']},
  {id:'tree',name:'Oak Tree',emoji:'🌳',trophic:'producer',prey:['sun']},
  {id:'flower',name:'Wildflower',emoji:'🌸',trophic:'producer',prey:['sun']},
  {id:'rabbit',name:'Rabbit',emoji:'🐇',trophic:'primary',prey:['grass','flower']},
  {id:'caterpillar',name:'Caterpillar',emoji:'🐛',trophic:'primary',prey:['tree','flower']},
  {id:'grasshopper',name:'Grasshopper',emoji:'🦗',trophic:'primary',prey:['grass']},
  {id:'snail',name:'Snail',emoji:'🐌',trophic:'primary',prey:['grass','algae','flower']},
  {id:'mouse',name:'Field Mouse',emoji:'🐭',trophic:'primary',prey:['grass','tree','flower']},
  {id:'frog',name:'Frog',emoji:'🐸',trophic:'secondary',prey:['grasshopper','caterpillar','snail']},
  {id:'bird',name:'Songbird',emoji:'🐦',trophic:'secondary',prey:['caterpillar','grasshopper','snail']},
  {id:'snake',name:'Snake',emoji:'🐍',trophic:'secondary',prey:['frog','mouse','bird']},
  {id:'fox',name:'Fox',emoji:'🦊',trophic:'tertiary',prey:['rabbit','mouse','bird','frog']},
  {id:'hawk',name:'Hawk',emoji:'🦅',trophic:'tertiary',prey:['rabbit','mouse','bird','snake']},
  {id:'fungi',name:'Fungi',emoji:'🍄',trophic:'decomposer',prey:[]},
];

const tClasses={producer:'t-producer',primary:'t-primary',secondary:'t-secondary',tertiary:'t-tertiary',decomposer:'t-decomposer'};
const tColors={producer:'#22c55e',primary:'#3b82f6',secondary:'#f59e0b',tertiary:'#ef4444',decomposer:'#a855f7'};

let placed=[],links=[],removeMode=false,selectedNode=null,nodePositions={};
const svg=document.getElementById('svg');
const nodesG=document.getElementById('nodesGroup');
const linksG=document.getElementById('linksGroup');

function renderSidebar(){
  const list=document.getElementById('organismList');
  list.innerHTML='';
  organisms.forEach(o=>{
    const div=document.createElement('div');
    div.className='organism'+(placed.includes(o.id)?' placed':'');
    div.innerHTML=`<span class="emoji">${o.emoji}</span>${o.name}<span class="trophic-label ${tClasses[o.trophic]}">${o.trophic}</span>`;
    if(!placed.includes(o.id)){
      div.draggable=true;
      div.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',o.id)});
      div.addEventListener('click',()=>placeOrganism(o.id));
    }
    list.appendChild(div);
  });
}

function placeOrganism(id){
  if(placed.includes(id))return;
  placed.push(id);
  const canvas=document.querySelector('.canvas');
  const rect=canvas.getBoundingClientRect();
  const o=organisms.find(x=>x.id===id);
  const trophicY={producer:.75,primary:.55,secondary:.35,tertiary:.15,decomposer:.85};
  const ty=trophicY[o.trophic]||.5;
  const sameLevel=placed.filter(p=>{const org=organisms.find(x=>x.id===p);return org&&org.trophic===o.trophic});
  const tx=(sameLevel.length)/(sameLevel.length+2);
  nodePositions[id]={x:80+tx*(rect.width-180),y:30+ty*(rect.height-100)};

  // Auto-create links based on prey relationships
  o.prey.forEach(preyId=>{
    if(placed.includes(preyId)&&!links.find(l=>l.source===preyId&&l.target===id)){
      links.push({source:preyId,target:id});
    }
  });
  // Check if any placed organism eats this one
  placed.forEach(pid=>{
    const po=organisms.find(x=>x.id===pid);
    if(po&&po.prey.includes(id)&&!links.find(l=>l.source===id&&l.target===pid)){
      links.push({source:id,target:pid});
    }
  });

  renderWeb();
  renderSidebar();
  updateStats();
}

function renderWeb(){
  linksG.innerHTML='';
  nodesG.innerHTML='';

  links.forEach(l=>{
    const s=nodePositions[l.source],t=nodePositions[l.target];
    if(!s||!t)return;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',s.x);line.setAttribute('y1',s.y);
    line.setAttribute('x2',t.x);line.setAttribute('y2',t.y);
    line.classList.add('link','energy');
    linksG.appendChild(line);
  });

  placed.forEach(id=>{
    const o=organisms.find(x=>x.id===id);
    const pos=nodePositions[id];
    if(!o||!pos)return;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.classList.add('node');
    g.setAttribute('transform',`translate(${pos.x},${pos.y})`);

    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('r',24);
    circle.setAttribute('fill','#0f172a');
    circle.setAttribute('stroke',tColors[o.trophic]);

    const emoji=document.createElementNS('http://www.w3.org/2000/svg','text');
    emoji.classList.add('emoji-label');
    emoji.setAttribute('dy','7');
    emoji.textContent=o.emoji;

    const label=document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('dy','40');
    label.setAttribute('font-size','10');
    label.textContent=o.name;

    g.appendChild(circle);g.appendChild(emoji);g.appendChild(label);

    g.addEventListener('click',()=>{
      if(removeMode){removeSpecies(id);return}
      if(!selectedNode){selectedNode=id;circle.setAttribute('stroke-width','4');return}
      if(selectedNode===id){selectedNode=null;circle.setAttribute('stroke-width','2');return}
      if(!links.find(l=>l.source===selectedNode&&l.target===id)){
        links.push({source:selectedNode,target:id});
      }
      selectedNode=null;
      renderWeb();updateStats();
    });

    // Make draggable
    let dragging=false,offset={x:0,y:0};
    g.addEventListener('mousedown',e=>{
      if(removeMode)return;
      dragging=true;
      offset={x:e.clientX-pos.x,y:e.clientY-pos.y};
      e.preventDefault();
    });
    const onMove=e=>{
      if(!dragging)return;
      pos.x=e.clientX-offset.x;
      pos.y=e.clientY-offset.y;
      renderWeb();
    };
    const onUp=()=>{dragging=false};
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);

    nodesG.appendChild(g);
  });
}

function removeSpecies(id){
  const o=organisms.find(x=>x.id===id);
  const affectedPredators=links.filter(l=>l.source===id).map(l=>organisms.find(x=>x.id===l.target)).filter(Boolean);
  const affectedPrey=links.filter(l=>l.target===id).map(l=>organisms.find(x=>x.id===l.source)).filter(Boolean);

  placed=placed.filter(p=>p!==id);
  links=links.filter(l=>l.source!==id&&l.target!==id);
  delete nodePositions[id];

  let msg=`<strong>${o.emoji} ${o.name}</strong> removed from the ecosystem. `;
  if(affectedPredators.length){
    msg+=`<span class="impact">⚠ ${affectedPredators.map(a=>a.emoji+' '+a.name).join(', ')} lost a food source!</span> `;
    // Check if any predator now has NO food sources
    affectedPredators.forEach(p=>{
      const remaining=links.filter(l=>l.target===p.id);
      if(remaining.length===0&&placed.includes(p.id)){
        msg+=`<br><span class="impact">🔴 ${p.emoji} ${p.name} has NO remaining food sources — population would collapse!</span>`;
      }
    });
  }

  document.getElementById('infoPanel').innerHTML=msg;
  renderWeb();renderSidebar();updateStats();
  removeMode=false;
  document.getElementById('removeBtn').style.background='';
}

function toggleRemoveMode(){
  removeMode=!removeMode;
  document.getElementById('removeBtn').style.background=removeMode?'#7f1d1d':'';
}

function resetWeb(){
  placed=[];links=[];nodePositions={};selectedNode=null;removeMode=false;
  document.getElementById('removeBtn').style.background='';
  document.getElementById('infoPanel').innerHTML='<strong>Drag organisms</strong> from the sidebar onto the canvas. Links are auto-created based on natural prey relationships. Use "Remove Species" to explore cascading effects.<div class="stats-bar">Organisms: <span id="statOrg">0</span> |  Links: <span id="statLinks">0</span> |  Trophic levels: <span id="statTrophic">0</span></div>';
  renderWeb();renderSidebar();updateStats();
}

function updateStats(){
  const tLevels=new Set(placed.map(id=>{const o=organisms.find(x=>x.id===id);return o?o.trophic:null}).filter(Boolean));
  const so=document.getElementById('statOrg');
  const sl=document.getElementById('statLinks');
  const st=document.getElementById('statTrophic');
  if(so)so.textContent=placed.length;
  if(sl)sl.textContent=links.length;
  if(st)st.textContent=tLevels.size;
}

// Drop support
document.querySelector('.canvas').addEventListener('dragover',e=>e.preventDefault());
document.querySelector('.canvas').addEventListener('drop',e=>{
  e.preventDefault();
  const id=e.dataTransfer.getData('text/plain');
  if(id&&!placed.includes(id)){
    const o=organisms.find(x=>x.id===id);
    const rect=document.querySelector('.canvas').getBoundingClientRect();
    nodePositions[id]={x:e.clientX-rect.left,y:e.clientY-rect.top};
    placed.push(id);
    // Auto-links
    o.prey.forEach(preyId=>{
      if(placed.includes(preyId)&&!links.find(l=>l.source===preyId&&l.target===id)){
        links.push({source:preyId,target:id});
      }
    });
    placed.forEach(pid=>{
      const po=organisms.find(x=>x.id===pid);
      if(po&&po.prey.includes(id)&&!links.find(l=>l.source===id&&l.target===pid)){
        links.push({source:id,target:pid});
      }
    });
    renderWeb();renderSidebar();updateStats();
  }
});

renderSidebar();
</script>
</body>
</html>
