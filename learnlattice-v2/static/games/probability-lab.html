<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probability Lab — LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#0c0a1a;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh}.hdr{padding:10px 20px;background:rgba(139,92,246,.06);border-bottom:1px solid rgba(139,92,246,.15);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#a78bfa;font-weight:700}.hdr-score{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#a78bfa}.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.2)}.prog-s{flex:1;text-align:center}.prog-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06)}.prog-bar.done{background:#a78bfa}.prog-bar.active{background:#fbbf24;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.prog-label{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}.prog-s.done .prog-label{color:#a78bfa}.prog-s.active .prog-label{color:#fbbf24}.game{max-width:640px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#a78bfa;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:700;margin-bottom:8px}.s-desc{font-size:.85rem;color:#94a3b8;margin-bottom:4px}.s-ican{font-size:.78rem;color:#c4b5fd;font-style:italic;margin-bottom:20px}.btn{padding:12px 28px;border-radius:10px;border:1px solid rgba(167,139,250,.3);background:rgba(167,139,250,.1);color:#c4b5fd;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(167,139,250,.2);border-color:#a78bfa;transform:translateY(-2px)}.btn-go{background:#a78bfa;color:#0c0a1a;border-color:#a78bfa}.btn-go:hover{background:#8b5cf6}.q-card{animation:fadeIn .4s;padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:16px}.q-num{font-size:.65rem;color:#a78bfa;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}.q-text{font-size:1rem;font-weight:600;color:#fff;margin-bottom:16px;line-height:1.5}.q-visual{text-align:center;font-size:3rem;margin-bottom:16px;padding:16px;background:rgba(167,139,250,.06);border-radius:12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts-col{grid-template-columns:1fr}.opt{padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-size:.88rem;cursor:pointer;transition:all .2s;text-align:center;font-family:'DM Sans',sans-serif;font-weight:500}.opt:hover:not(.locked){border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.06);transform:translateY(-2px)}.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12);color:#86efac}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08);color:#fca5a5}.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-no{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}.exp{animation:fadeIn .4s}.exp-setup{padding:20px;background:rgba(167,139,250,.04);border:1px solid rgba(167,139,250,.12);border-radius:14px;margin-bottom:16px;text-align:center}.exp-scenario{font-size:.92rem;color:#e2e8f0;margin-bottom:12px;line-height:1.5}.exp-theory{font-size:.85rem;color:#c4b5fd;margin-bottom:16px}.exp-theory strong{color:#a78bfa}.roll-btn{padding:14px 36px;border-radius:12px;border:none;background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}.roll-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.3)}.roll-btn:active{transform:scale(.97)}.roll-btn:disabled{opacity:.5;cursor:default;transform:none}.exp-result{font-size:4rem;margin:16px 0;min-height:80px;display:flex;align-items:center;justify-content:center}.exp-result.rolling{animation:shake .15s infinite}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}.exp-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.exp-stat{padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;text-align:center}.exp-stat-label{font-size:.65rem;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.exp-stat-val{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:#a78bfa;font-weight:600}.exp-compare{margin-top:16px;padding:14px 18px;border-radius:10px}.exp-close{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2)}.exp-far{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2)}.exp-compare p{font-size:.85rem;line-height:1.5}.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#a78bfa;font-weight:700}.r-label{font-size:1.1rem;font-weight:700;margin:6px 0}.r-detail{font-size:.85rem;color:#94a3b8;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}.stage-done{text-align:center;padding:28px 16px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}.input-row{display:flex;justify-content:center;gap:8px;align-items:center}.q-input{font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:#a78bfa;background:rgba(167,139,250,.06);border:2px solid rgba(167,139,250,.2);border-radius:10px;padding:10px 16px;width:100px;text-align:center;outline:0}.q-input:focus{border-color:#a78bfa;box-shadow:0 0 12px rgba(167,139,250,.2)}.sub-btn{padding:10px 20px;border-radius:10px;border:none;background:#a78bfa;color:#0c0a1a;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}</style><style id="embed-check">.embed-mode .hdr{display:none!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>🎲 Probability Lab</h1><span class="hdr-score" id="score">0 pts</span></div><div class="progress" id="prog"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,correct=0,total=0,stageCorrect=0;const STAGES=[{name:"Language",desc:"Use the right words for probability",ican:"I can describe events as impossible, unlikely, even chance, likely, or certain.",qs:5},{name:"Calculate",desc:"Work out theoretical probability",ican:"I can calculate probability as a fraction, decimal, or percentage.",qs:5},{name:"Experiment",desc:"Run trials and compare to theory",ican:"I can compare experimental results to theoretical probability.",qs:3},{name:"Reason",desc:"Apply probability to real situations",ican:"I can use probability to make decisions and evaluate claims.",qs:5}];function randInt(e,t){return e+Math.floor(Math.random()*(t-e+1))}function shuffle(e){for(let t=e.length-1;t>0;t--){const s=Math.floor(Math.random()*(t+1));[e[t],e[s]]=[e[s],e[t]]}return e}function genLanguage(){return shuffle([{q:"You roll a standard die. What is the chance of rolling a number LESS than 7?",visual:"🎲",opts:["Certain","Likely","Even chance","Impossible"],correct:0,hint:"A standard die has faces 1-6. ALL of them are less than 7.",why:"Every face (1,2,3,4,5,6) is less than 7, so this is CERTAIN — probability = 1."},{q:"You flip a fair coin. What is the chance of getting heads?",visual:"🪙",opts:["Even chance","Certain","Unlikely","Impossible"],correct:0,hint:"A fair coin has 2 equally likely outcomes.",why:"Heads or tails — 2 outcomes, equally likely. That's an EVEN CHANCE — probability = 0.5."},{q:"A bag has 9 red balls and 1 blue ball. You pick one randomly. Getting red is...",visual:"🔴🔴🔴🔵",opts:["Likely","Certain","Even chance","Unlikely"],correct:0,hint:"9 out of 10 balls are red. Is that more or less than half?",why:"9/10 = 0.9 = 90%. That's LIKELY — not certain (you could still get blue), but very probable."},{q:"You roll a die. What is the chance of rolling a 7?",visual:"🎲",opts:["Impossible","Unlikely","Even chance","Certain"],correct:0,hint:"What numbers are on a standard die?",why:"A standard die only has 1-6. There is no 7. This is IMPOSSIBLE — probability = 0."},{q:"A spinner has 5 equal sections: 3 red, 1 blue, 1 green. Landing on blue is...",visual:"🎯",opts:["Unlikely","Likely","Even chance","Impossible"],correct:0,hint:"Blue is 1 out of 5 sections. Is that more or less than half?",why:"P(blue) = 1/5 = 0.2 = 20%. That's less than half, so UNLIKELY."},{q:"Weather forecast says 50% chance of rain. Rain is...",visual:"🌧️",opts:["Even chance","Likely","Unlikely","Certain"],correct:0,hint:"50% means exactly half. What probability word matches half?",why:"50% = 0.5 = exactly half. This is an EVEN CHANCE — equally likely to rain or not."},{q:"The sun will rise tomorrow morning. This is...",visual:"☀️",opts:["Certain","Likely","Even chance","Impossible"],correct:0,hint:"Has the sun ever not risen?",why:"The sun has risen every day for billions of years. We treat this as CERTAIN (probability ≈ 1)."}]).slice(0,STAGES[0].qs)}function genCalculate(){return shuffle([{q:"A bag has 3 red and 5 blue marbles. What is P(red)?",visual:"🔴🔴🔴🔵🔵🔵🔵🔵",opts:["3/8","3/5","5/8","5/3"],correct:0,hint:"P = favourable ÷ total. There are 3 red out of how many total?",why:"Total = 3+5 = 8. P(red) = favourable/total = 3/8."},{q:"Roll a die. What is P(even number)?",visual:"🎲",opts:["3/6 = 1/2","2/6","4/6","1/6"],correct:0,hint:"Even numbers on a die: 2, 4, 6. How many is that out of 6?",why:"Even numbers: 2,4,6 — that's 3 outcomes. P(even) = 3/6 = 1/2."},{q:"A spinner has 8 equal sections numbered 1-8. What is P(number > 6)?",visual:"🎯",opts:["2/8 = 1/4","6/8","1/8","3/8"],correct:0,hint:"Numbers greater than 6: which are they? 7 and 8.",why:"Numbers > 6: 7 and 8. That's 2 out of 8. P = 2/8 = 1/4."},{q:"P(rain) = 0.3. What is P(no rain)?",visual:"☀️🌧️",opts:["0.7","0.3","1.3","0"],correct:0,hint:"The probability of something happening + NOT happening = 1.",why:"P(not A) = 1 − P(A) = 1 − 0.3 = 0.7. Complementary events add to 1."},{q:"A box has 4 red, 3 blue, 2 green, 1 yellow sweet. What is P(not green)?",visual:"🍬",opts:["8/10","2/10","6/10","4/10"],correct:0,hint:"Total = 10. Green = 2. Not green = ?",why:"Total = 10. Green = 2. Not green = 10−2 = 8. P(not green) = 8/10 = 4/5."},{q:"Two coins are flipped. What is P(both heads)?",visual:"🪙🪙",opts:["1/4","1/2","2/4","1/3"],correct:0,hint:"List all outcomes: HH, HT, TH, TT. How many give both heads?",why:"Outcomes: HH, HT, TH, TT (4 total). Only HH is both heads. P = 1/4."},{q:"A card is drawn from a standard deck. What is P(heart)?",visual:"♥️♠️♦️♣️",opts:["13/52 = 1/4","4/52","26/52","1/52"],correct:0,hint:"A deck has 52 cards. How many are hearts?",why:"13 hearts in 52 cards. P(heart) = 13/52 = 1/4 = 0.25."}]).slice(0,STAGES[1].qs)}function genExperiment(){return[{type:"die",scenario:"Roll a die 30 times. Theory says P(6) = 1/6 ≈ 16.7%. Let's see what happens!",target:6,theoretical:1/6,trials:30,emoji:["⚀","⚁","⚂","⚃","⚄","⚅"]},{type:"coin",scenario:"Flip a coin 20 times. Theory says P(heads) = 1/2 = 50%.",target:"H",theoretical:.5,trials:20,emoji:["🪙"]},{type:"spinner",scenario:"Spin a 5-section spinner (2 red, 2 blue, 1 green) 25 times. P(green) = 1/5 = 20%.",target:"green",theoretical:.2,trials:25,emoji:["🔴","🔴","🔵","🔵","🟢"]}]}function genReason(){return shuffle([{q:"A game costs ¥5 to play. You win ¥20 if you roll a 6 on a die. Should you play?",opts:["No — expected loss (P(win)=1/6, average win=¥3.33 but cost=¥5)","Yes — you could win ¥20","Yes — 1/6 is good odds","It depends on how lucky you feel"],correct:0,hint:"Calculate: expected winnings = P(win) × prize = 1/6 × ¥20 = ¥3.33. Compare to the ¥5 cost.",why:"Expected value = 1/6 × ¥20 = ¥3.33. You pay ¥5 each time. On average you LOSE ¥1.67 per game. The maths says don't play!"},{q:"A basketball player makes 80% of free throws. She misses 3 in a row. Is the next shot MORE likely to go in?",opts:["No — each shot is independent (still 80%)",'Yes — she\'s "due" for a hit',"Yes — 80% means she can't miss 4 in a row","It depends on the score"],correct:0,hint:"Does the ball remember what happened on previous shots?",why:'Each shot is INDEPENDENT — the ball has no memory. P(make) is still 80% regardless of previous misses. Thinking otherwise is the "gambler\'s fallacy."'},{q:"A medical test is 95% accurate. It says you have a rare disease (1 in 1000 people have it). How worried should you be?",opts:["Not very — most positive results are false positives for rare diseases","Very worried — 95% is very accurate","Moderately — do another test","Not at all — tests are always wrong"],correct:0,hint:"If 1000 people are tested: 1 has the disease (95% chance of positive) but 999 are healthy (5% false positive = ~50 false positives).",why:"Out of 1000: ~1 true positive, ~50 false positives. So even with a positive test, there's only about a 1/51 ≈ 2% chance you actually have it. This is why doctors do follow-up tests."},{q:"Two dice are rolled. Which total is MOST likely?",opts:["7","6","12","2"],correct:0,hint:"List the ways to make each total. 7: (1,6)(2,5)(3,4)(4,3)(5,2)(6,1). How many ways for 12?",why:"7 can be made 6 ways (most of any total). 12 can only be made 1 way (6,6). 7 is the most likely total when rolling two dice."},{q:'A lottery has 1 in 14 million odds. Someone says "I feel lucky today." Does this change their odds?',opts:["No — feelings don't change mathematical probability","Yes — positive thinking helps","Maybe — it depends on the person","Yes — lottery machines sense confidence"],correct:0,hint:"Is the lottery machine affected by how the player feels?",why:"Probability is mathematical, not emotional. The odds are 1 in 14,000,000 regardless of how you feel. Every ticket has the same tiny chance."}]).slice(0,STAGES[3].qs)}let questions=[];const generators=[genLanguage,genCalculate,genExperiment,genReason];function renderProg(){document.getElementById("prog").innerHTML=STAGES.map((e,t)=>`<div class="prog-s ${t<stage?"done":t===stage?"active":""}"><div class="prog-bar ${t<stage?"done":t===stage?"active":""}"></div><span class="prog-label">${e.name}</span></div>`).join("")}function showIntro(){stageCorrect=0,questions=generators[stage](),qIdx=0;const e=STAGES[stage];document.getElementById("game").innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STAGES.length}</div><div class="s-name">${e.name}</div><div class="s-desc">${e.desc}</div><div class="s-ican">"${e.ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`,renderProg()}function showQ(){qIdx>=questions.length?showStageDone():2===stage?renderExperiment():renderMC()}function renderMC(){const e=questions[qIdx];document.getElementById("game").innerHTML=`<div class="q-card">\n    <div class="q-num">Question ${qIdx+1} of ${questions.length}</div>\n    ${e.visual?`<div class="q-visual">${e.visual}</div>`:""}\n    <div class="q-text">${e.q}</div>\n    <div class="opts ${e.opts.some(e=>e.length>30)?"opts-col":""}">${e.opts.map((e,t)=>`<button class="opt" onclick="checkMC(${t})" id="o${t}">${e}</button>`).join("")}</div>\n    <div id="fb"></div><div class="next" id="nx"></div></div>`}function checkMC(e){const t=questions[qIdx];total++,document.querySelectorAll(".opt").forEach(e=>e.classList.add("locked")),e===t.correct?(document.getElementById("o"+e).classList.add("correct"),handleOk(t.why)):(document.getElementById("o"+e).classList.add("wrong"),document.getElementById("o"+t.correct).classList.add("correct"),handleNo(t.hint))}let expData={hits:0,rolls:0,results:[]};function renderExperiment(){const e=questions[qIdx];expData={hits:0,rolls:0,results:[]},document.getElementById("game").innerHTML=`<div class="exp">\n    <div class="exp-setup">\n      <div class="exp-scenario">${e.scenario}</div>\n      <div class="exp-theory">Theoretical probability: <strong>${(100*e.theoretical).toFixed(1)}%</strong></div>\n      <div class="exp-result" id="expResult" style="font-size:3rem">?</div>\n      <button class="roll-btn" id="rollBtn" onclick="doRoll()">\n        ${"die"===e.type?"🎲 Roll!":"coin"===e.type?"🪙 Flip!":"🎯 Spin!"} (0/${e.trials})\n      </button>\n    </div>\n    <div class="exp-stats">\n      <div class="exp-stat"><div class="exp-stat-label">Hits</div><div class="exp-stat-val" id="expHits">0</div></div>\n      <div class="exp-stat"><div class="exp-stat-label">Experimental P</div><div class="exp-stat-val" id="expP">—</div></div>\n    </div>\n    <div id="expCompare"></div>\n    <div id="fb"></div><div class="next" id="nx"></div></div>`}function doRoll(){const e=questions[qIdx];if(expData.rolls>=e.trials)return;const t=document.getElementById("expResult"),s=document.getElementById("rollBtn");t.classList.add("rolling"),s.disabled=!0,setTimeout(()=>{let a;if(t.classList.remove("rolling"),"die"===e.type){const s=randInt(1,6);t.textContent=e.emoji[s-1],a=s===e.target}else if("coin"===e.type){const e=Math.random()<.5;t.textContent=e?"🟡 Heads":"⚪ Tails",a=e}else{const s=randInt(0,e.emoji.length-1);t.textContent=e.emoji[s],a=s===e.emoji.length-1}expData.rolls++,a&&expData.hits++;const o=expData.hits/expData.rolls;if(document.getElementById("expHits").textContent=expData.hits,document.getElementById("expP").textContent=(100*o).toFixed(1)+"%",s.textContent=`${"die"===e.type?"🎲 Roll!":"coin"===e.type?"🪙 Flip!":"🎯 Spin!"} (${expData.rolls}/${e.trials})`,s.disabled=!1,expData.rolls>=e.trials){s.disabled=!0,s.textContent="✅ Done!",total++;const t=Math.abs(o-e.theoretical)<.1;stageCorrect++,correct++,pts+=10,document.getElementById("score").textContent=pts+" pts",document.getElementById("expCompare").innerHTML=`<div class="exp-compare ${t?"exp-close":"exp-far"}">\n        <p><strong>Theoretical:</strong> ${(100*e.theoretical).toFixed(1)}% | <strong>Experimental:</strong> ${(100*o).toFixed(1)}%</p>\n        <p style="margin-top:6px">${t?"✅ Very close! With enough trials, experimental probability approaches theoretical probability. This is the Law of Large Numbers.":"⚠️ Not very close yet! With only "+e.trials+" trials, experimental results can vary a lot. Try 1000 trials and the results would be much closer to theory."}</p>\n      </div>`,document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()" style="margin-top:8px">Next →</button>'}},300)}function handleOk(e){correct++,stageCorrect++,pts+=10,document.getElementById("score").textContent=pts+" pts",document.getElementById("fb").innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${e}</div>`,document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()" style="margin-top:8px">Next →</button>'}function handleNo(e){document.getElementById("fb").innerHTML=`<div class="fb fb-no"><strong>💡 Hint:</strong>${e}</div>`,document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()" style="margin-top:8px">Next →</button>'}function showStageDone(){const e=Math.round(stageCorrect/questions.length*100),t=e>=80?"⭐⭐⭐":e>=60?"⭐⭐":"⭐";stage<STAGES.length-1?document.getElementById("game").innerHTML=`<div class="stage-done"><div class="sd-stars">${t}</div><div class="s-name">${STAGES[stage].name} Complete!</div><p style="color:#94a3b8;margin:8px 0">${stageCorrect}/${questions.length} correct</p><button class="btn btn-go" onclick="stage++;showIntro()" style="margin-top:12px">Next Stage →</button></div>`:showResults()}function showResults(){const e=Math.round(correct/total*100);let t="🏆 Probability Master!",s="You understand probability language, calculation, and can think critically about chance.";e<50?(t="🎲 Keep rolling!",s="Probability takes practice. Focus on the hints — they show the key ideas."):e<75&&(t="🎯 Good aim!",s="You've got the basics. The reasoning stage needs more practice."),document.getElementById("game").innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${t}</div><div class="r-detail">${s}<br>Score: ${pts} points</div>\n  <div class="r-transfer">🌍 <strong>Think about this:</strong> Weather forecasts, medical tests, insurance, games — probability is used everywhere. Next time someone says "I feel lucky," remember: the maths doesn't change based on feelings!</div>\n  <div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`,renderProg()}showIntro()</script></body></html>
