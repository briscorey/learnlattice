<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graph Detective — LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh}.hdr{padding:10px 20px;background:rgba(34,197,94,.06);border-bottom:1px solid rgba(34,197,94,.15);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#4ade80;font-weight:700}.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#4ade80}.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.2)}.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-bottom:4px}.pg-bar.done{background:#22c55e}.pg-bar.active{background:#f59e0b;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pg-label{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}.pg.done .pg-label{color:#22c55e}.pg.active .pg-label{color:#f59e0b}.game{max-width:640px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#22c55e;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:700;margin-bottom:8px}.s-desc{font-size:.85rem;color:#94a3b8;margin-bottom:4px}.s-ican{font-size:.78rem;color:#86efac;font-style:italic;margin-bottom:20px}.btn{padding:12px 28px;border-radius:10px;border:1px solid rgba(34,197,94,.3);background:rgba(34,197,94,.1);color:#86efac;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(34,197,94,.2);border-color:#22c55e;transform:translateY(-2px)}.btn-go{background:#22c55e;color:#052e16;border-color:#22c55e}.btn-go:hover{background:#16a34a}.q{animation:fadeIn .4s}.q-card{padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:16px}.q-num{font-size:.65rem;color:#22c55e;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.q-text{font-size:1rem;font-weight:600;color:#fff;margin-bottom:16px;line-height:1.5}.graph-box{padding:16px;background:rgba(34,197,94,.04);border:1px solid rgba(34,197,94,.12);border-radius:12px;margin-bottom:16px;text-align:center}.graph-box canvas{border-radius:8px;background:#1e293b}.q-context{font-size:.85rem;color:#cbd5e1;line-height:1.5;padding:12px 16px;background:rgba(34,197,94,.04);border:1px solid rgba(34,197,94,.12);border-radius:10px;margin-bottom:16px;font-style:italic}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts-1{grid-template-columns:1fr}.opt{padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-size:.85rem;cursor:pointer;transition:all .2s;text-align:center;font-family:'DM Sans',sans-serif;font-weight:500}.opt:hover:not(.locked){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.06);transform:translateY(-2px)}.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-no{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#22c55e;font-weight:700}.r-label{font-size:1.1rem;font-weight:700;margin:6px 0}.r-detail{font-size:.85rem;color:#94a3b8;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}.sd{text-align:center;padding:28px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}</style><style id="ec">.embed-mode .hdr{display:none!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>📊 Graph Detective</h1><span class="pts" id="pts">0 pts</span></div><div class="progress" id="prog"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,correct=0,total=0,sc=0;const STG=[{name:"Read",desc:"Read values from graphs",ican:"I can read exact values from bar charts and line graphs.",qs:5},{name:"Describe",desc:"Describe what graphs show",ican:"I can describe trends, patterns, and relationships shown in graphs.",qs:5},{name:"Interpret",desc:"Explain what the data means",ican:"I can interpret graphs and explain what the data tells us.",qs:5},{name:"Spot the Trick",desc:"Identify misleading graphs",ican:"I can identify when a graph is misleading and explain why.",qs:5}];function sh(e){for(let t=e.length-1;t>0;t--){const s=Math.floor(Math.random()*(t+1));[e[t],e[s]]=[e[s],e[t]]}return e}function gen0(){return sh([{context:"A bar chart shows ice cream sales: Mon=20, Tue=35, Wed=25, Thu=40, Fri=50.",q:"On which day were the most ice creams sold?",opts:["Friday (50)","Thursday (40)","Tuesday (35)","Wednesday (25)"],correct:0,hint:"Look for the tallest bar. Which day has the highest value?",why:"Friday had 50 sales — the highest bar on the chart."},{context:"A line graph shows temperature over a day: 6am=8°C, 9am=12°C, 12pm=18°C, 3pm=20°C, 6pm=15°C, 9pm=10°C.",q:"What was the temperature at 12pm?",opts:["18°C","20°C","15°C","12°C"],correct:0,hint:"Find 12pm on the x-axis, go up to the line, read across to the y-axis.",why:"At 12pm, the line shows 18°C. Read the y-axis value where the line crosses 12pm."},{context:"A pie chart shows favourite sports: Football 40%, Basketball 25%, Swimming 20%, Tennis 15%. Class has 60 students.",q:"How many students chose Swimming?",opts:["12","20","15","8"],correct:0,hint:"20% of 60 = ?",why:"20% × 60 = 12 students chose Swimming."},{context:"A scatter graph shows hours studied (x) vs test score (y). Points cluster around a line going up-right.",q:"As hours studied increases, test scores...",opts:["Increase (positive correlation)","Decrease","Stay the same","No pattern"],correct:0,hint:"If points go up-right, that means both variables increase together.",why:"Points going up-right = positive correlation. More study → higher scores."},{context:"A bar chart: Brand A = ¥45, Brand B = ¥52, Brand C = ¥38, Brand D = ¥61.",q:"What is the range of the prices?",opts:["¥23","¥61","¥38","¥49"],correct:0,hint:"Range = highest − lowest = 61 − 38.",why:"Range = ¥61 − ¥38 = ¥23. Range measures the spread of data."},{context:"A dual bar chart shows boys and girls scores. Boys: Test 1=65, Test 2=72. Girls: Test 1=70, Test 2=68.",q:"In which test did boys outscore girls?",opts:["Test 2 only","Test 1 only","Both tests","Neither test"],correct:0,hint:"Compare: Test 1: Boys 65 vs Girls 70. Test 2: Boys 72 vs Girls 68.",why:"Test 2: Boys (72) > Girls (68). Test 1: Girls scored higher."}]).slice(0,STG[0].qs)}function gen1(){return sh([{q:"A line graph goes steeply upward from left to right. The best description is:",opts:["Rapid increase","Slow decrease","No change","Fluctuating"],correct:0,hint:"Steep upward = fast increase in the y-value.",why:"Steep upward slope = rapid increase. The steeper the line, the faster the change."},{q:"A scatter graph has points spread randomly with no pattern. This shows:",opts:["No correlation","Positive correlation","Negative correlation","Perfect correlation"],correct:0,hint:"If there's no pattern, the variables aren't related.",why:"Random scatter = no correlation. The two variables have no clear relationship."},{q:"A line graph is flat (horizontal) for a period. This means:",opts:["The value stayed constant","The value was zero","No data was recorded","The graph is broken"],correct:0,hint:"A flat line means the y-value isn't changing over that time.",why:"Flat/horizontal = constant value. No change is happening during that period."},{q:"A bar chart shows decreasing heights from left to right. This data is:",opts:["In descending order","In ascending order","Random","Grouped"],correct:0,hint:"Bars getting shorter left to right = values decreasing.",why:"Decreasing bar heights = descending order (highest to lowest)."},{q:"A line graph shows temperature rising, then plateauing, then rising again. This suggests:",opts:["Two periods of heating with a pause","Constant temperature","Cooling then heating","An error in measurement"],correct:0,hint:"Rising = heating. Flat = pause (constant). Rising again = more heating.",why:"The graph shows: heat → pause (energy used for state change?) → heat. Common in heating curves!"},{q:"Points on a scatter graph cluster tightly around a straight line. The correlation is:",opts:["Strong","Weak","No correlation","Impossible to tell"],correct:0,hint:"The closer points are to a line, the stronger the correlation.",why:"Tight clustering around a line = strong correlation. Spread out = weak correlation."}]).slice(0,STG[1].qs)}function gen2(){return sh([{context:"A graph shows plant growth: Week 1=2cm, Week 2=5cm, Week 3=9cm, Week 4=14cm.",q:"Between which two weeks was growth fastest?",opts:["Week 3 to 4 (5cm growth)","Week 1 to 2 (3cm)","Week 2 to 3 (4cm)","All the same"],correct:0,hint:"Calculate growth each week: W1-2=3cm, W2-3=4cm, W3-4=5cm. Which is biggest?",why:"W3→W4: 14−9 = 5cm growth. This is the steepest part of the graph. Greater slope = faster growth."},{context:"A graph shows two runners. Runner A: steady speed. Runner B: slow start, then speeds up and overtakes.",q:"At the intersection point of the two lines, what is true?",opts:["Both runners are at the same distance","Runner B is faster","Runner A has stopped","The race is over"],correct:0,hint:"Where lines cross on a distance-time graph = same distance at the same time.",why:"The intersection means both runners have covered the same distance at that moment. After this, B is ahead."},{context:"Sales data: Jan=100, Feb=120, Mar=115, Apr=130, May=125, Jun=145.",q:"What is the overall trend despite the fluctuations?",opts:["Generally increasing","Generally decreasing","No trend","Perfectly steady"],correct:0,hint:"Look at the overall direction, not individual ups and downs. Jan=100, Jun=145.",why:"Despite some months dipping (Mar, May), the overall trend is upward: 100 → 145. Focus on the general direction."},{context:"A distance-time graph shows a straight diagonal line.",q:"This means the object is:",opts:["Moving at constant speed","Accelerating","Stationary","Decelerating"],correct:0,hint:"Straight line on distance-time = constant rate of change = constant speed.",why:"Straight diagonal = constant speed. Curved upward = acceleration. Horizontal = stationary."},{context:"A cooling curve shows temperature dropping quickly at first, then levelling off around room temperature.",q:"Why does cooling slow down?",opts:["Smaller temperature difference with surroundings","The thermometer breaks","Heat energy runs out","The object gets heavier"],correct:0,hint:"Newton's Law of Cooling: rate of cooling depends on temperature difference.",why:"The rate of cooling depends on the temperature difference between the object and surroundings. As it cools, the difference shrinks, so cooling slows."}]).slice(0,STG[2].qs)}function gen3(){return sh([{q:"A graph shows Company A profit going from ¥1M to ¥1.2M. But the y-axis starts at ¥900K, making it look like profits doubled. This is misleading because:",opts:["The y-axis doesn't start at zero — exaggerates the change","The numbers are wrong","The graph is too small","Profits did double"],correct:0,hint:"When the y-axis doesn't start at zero, small changes look huge.",why:"Starting the y-axis at ¥900K instead of ¥0 makes a 20% increase look like a 100%+ increase. Always check the axis!"},{q:'Two pie charts compare: "2020: 30% prefer Brand X" and "2025: 35% prefer Brand X." But 2020 surveyed 1000 people and 2025 surveyed 200. Why is this misleading?',opts:["Different sample sizes make percentages incomparable","Percentages can't lie","Both surveys are fine","Brand X definitely grew"],correct:0,hint:"30% of 1000 = 300 people. 35% of 200 = 70 people. Which is actually more?",why:"30% of 1000 = 300 people vs 35% of 200 = 70 people. The percentage went up but actual numbers went DOWN. Sample size matters!"},{q:"A bar chart uses 3D effects that make front bars look bigger than back bars of equal value. This is:",opts:["Misleading — 3D effects distort visual comparison","Better design","More accurate","Standard practice"],correct:0,hint:"3D effects change how we perceive bar heights due to perspective.",why:"3D effects make it harder to compare values accurately. Flat 2D bar charts are almost always more honest."},{q:'A graph shows "Crime has DOUBLED!" but the y-axis goes from 10 to 20 incidents (in a city of 500,000). Is this fair?',opts:["Misleading — absolute numbers are tiny, context needed","Yes, doubling is serious","The graph is fine","We need more data"],correct:0,hint:"10 to 20 = doubled. But 20 incidents in 500,000 people is...?",why:"While technically doubled, 20/500,000 = 0.004%. The graph uses a true fact to create a misleading impression. Context and scale matter."},{q:"A line graph of temperature uses red colour and thick, dramatic lines. A graph of the same data uses blue and thin lines. Which is more objective?",opts:["The blue thin-line version — colour/thickness can influence perception","The red version — it's more visible","Both are equally objective","Neither — all graphs are biased"],correct:0,hint:"Design choices like colour (red = danger) and line thickness affect how we feel about data.",why:"Red implies danger/urgency. Thick lines look more dramatic. Objective graphs use neutral colours and consistent formatting. Design choices ARE editorial choices."},{q:"A bar chart comparing test scores starts the y-axis at 85 instead of 0. Why is this misleading?",opts:["Small differences look huge","It hides the actual scores","The bars are too tall","It makes everyone look equal"],correct:0,hint:"Think about what happens visually when you cut off most of the scale.",why:"Starting at 85 exaggerates differences. A student with 90 vs 87 looks dramatically different when the scale is 85-100, but barely different on a 0-100 scale."},{q:"Two pie charts compare spending: 2010 (¥100k total) and 2020 (¥500k total). Same-sized circles. Problem?",opts:["Total amounts are very different but circles are same size","The colours are wrong","Pie charts can't show time","You need more categories"],correct:0,hint:"If one total is 5× bigger, should the circles be the same size?",why:"A 20% slice of ¥100k (¥20k) looks identical to 20% of ¥500k (¥100k). Same visual, but 5× the money."},{q:'A graph shows "Sales DOUBLED!" The y-axis goes from 48 to 52. What really happened?',opts:["Sales barely changed (48→52 is small)","Sales actually doubled","The graph is correct","We need more data"],correct:0,hint:"What is the actual change? 52-48 = ?",why:"48→52 is only an 8% increase. By zooming the y-axis to 48-52, a tiny change looks enormous."},{q:'A scatter graph shows height vs exam marks with r=0.12. The headline says "Taller = Smarter!" Problem?',opts:["r=0.12 means almost no correlation","Scatter graphs can't show this","Height always predicts grades","The headline is fine"],correct:0,hint:"What does r=0.12 mean? (r=1 is perfect, r=0 is none)",why:"r=0.12 is very weak correlation — almost no relationship. The headline massively overstates what the data shows."}]).slice(0,STG[3].qs)}const generators=[gen0,gen1,gen2,gen3];let questions=[];function renderProg(){document.getElementById("prog").innerHTML=STG.map((e,t)=>`<div class="pg ${t<stage?"done":t===stage?"active":""}"><div class="pg-bar ${t<stage?"done":t===stage?"active":""}"></div><span class="pg-label">${e.name}</span></div>`).join("")}function showIntro(){sc=0,questions=generators[stage](),qIdx=0,document.getElementById("game").innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STG.length}</div><div class="s-name">${STG[stage].name}</div><div class="s-desc">${STG[stage].desc}</div><div class="s-ican">"${STG[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`,renderProg()}function showQ(){if(qIdx>=questions.length)return void showSD();const e=questions[qIdx];let t=`<div class="q"><div class="q-card"><div class="q-num">Q${qIdx+1} of ${questions.length}</div>`;e.context&&(t+=`<div class="q-context">📊 ${e.context}</div>`),t+=`<div class="q-text">${e.q}</div><div class="opts ${e.opts.some(e=>e.length>35)?"opts-1":""}">${e.opts.map((e,t)=>`<button class="opt" onclick="check(${t})" id="o${t}">${e}</button>`).join("")}</div></div><div id="fb"></div><div class="next" id="nx"></div></div>`,document.getElementById("game").innerHTML=t}function check(e){const t=questions[qIdx];total++,document.querySelectorAll(".opt").forEach(e=>e.classList.add("locked")),e===t.correct?(document.getElementById("o"+e).classList.add("correct"),correct++,sc++,pts+=10,document.getElementById("pts").textContent=pts+" pts",document.getElementById("fb").innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${t.why}</div>`):(document.getElementById("o"+e).classList.add("wrong"),document.getElementById("o"+t.correct).classList.add("correct"),document.getElementById("fb").innerHTML=`<div class="fb fb-no"><strong>💡 Hint:</strong>${t.hint}</div>`),document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()">Next →</button>'}function showSD(){const e=Math.round(sc/questions.length*100),t=e>=80?"⭐⭐⭐":e>=60?"⭐⭐":"⭐";stage<STG.length-1?document.getElementById("game").innerHTML=`<div class="sd"><div class="sd-stars">${t}</div><div class="s-name">${STG[stage].name} Complete!</div><p style="color:#94a3b8;margin:8px 0">${sc}/${questions.length}</p><button class="btn btn-go" onclick="stage++;showIntro()">Next →</button></div>`:showResults()}function showResults(){const e=Math.round(correct/total*100);let t="🏆 Graph Master!",s="You can read, describe, interpret, and critically evaluate graphs.";e<50?(t="📊 Keep investigating!",s="Graphs take practice. Focus on reading axes carefully."):e<75&&(t="📊 Good detective work!",s="Solid skills. The misleading graphs stage needs more critical thinking."),document.getElementById("game").innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${t}</div><div class="r-detail">${s}<br>Score: ${pts} pts</div><div class="r-transfer">🌍 <strong>Graphs in the real world:</strong> News articles, social media, advertisements, and politicians ALL use graphs. Now you know how to spot when they're being honest — and when they're trying to trick you.</div><div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`,renderProg()}showIntro()</script></body></html>
