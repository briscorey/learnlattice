=toCanvas(e[t+1].x,e[t+1].y);ctx.moveTo(n.x,n.y),ctx.lineTo(a.x,a.y)}ctx.stroke(),ctx.setLineDash([]),ctx.globalAlpha=1}})}function draw(){ctx.clearRect(0,0,W,H),ctx.strokeStyle="#1e293b",ctx.lineWidth=.5;for(let t=0;t<W;t+=W/12)ctx.beginPath(),ctx.moveTo(t,0),ctx.lineTo(t,H),ctx.stroke();for(let t=0;t<H;t+=H/8)ctx.beginPath(),ctx.moveTo(0,t),ctx.lineTo(W,t),ctx.stroke();ctx.globalAlpha=.15,continents.forEach(t=>{const e={...t,x:t.targetX,y:t.targetY,rotation:t.targetRot},n=toCanvas(e.x,e.y),a=Math.min(W,H)/800*2;ctx.save(),ctx.translate(n.x,n.y),ctx.rotate(e.rotation*Math.PI/180),ctx.beginPath(),e.shape.forEach((t,e)=>{const n=t[0]*a,o=t[1]*a;0===e?ctx.moveTo(n,o):ctx.lineTo(n,o)}),ctx.closePath(),ctx.strokeStyle=t.color,ctx.lineWidth=1,ctx.setLineDash([3,3]),ctx.stroke(),ctx.setLineDash([]),ctx.restore()}),ctx.globalAlpha=1,drawEvidence(),continents.forEach(t=>drawContinent(t,t===dragging))}function hitTest(t,e){const n=Math.min(W,H)/800*2;for(let a=continents.length-1;a>=0;a--){const o=continents[a],c=toCanvas(o.x,o.y),i=t-c.x,s=e-c.y;if(Math.sqrt(i*i+s*s)<40*n)return o}return null}function setMode(t){mode=t,document.querySelectorAll(".tool-btn[data-mode]").forEach(e=>e.classList.toggle("active",e.dataset.mode===t)),draw()}function checkFit(){let t=0,e=0;continents.forEach(n=>{const a=n.x-n.targetX,o=n.y-n.targetY,c=Math.sqrt(a*a+o*o);t+=c,c<.08&&e++});const n=Math.max(0,Math.round(100*(1-t/(.5*continents.length))));document.getElementById("accuracy").textContent=n+"%",evidenceMatched.clear(),evidence.forEach((t,e)=>{const n=t.matches.map(t=>continents.find(e=>e.id===t)).filter(Boolean);if(n.length>=2){let t=!0;for(let e=0;e<n.length-1;e++){const a=n[e].x-n[e+1].x,o=n[e].y-n[e+1].y;Math.sqrt(a*a+o*o)>.2&&(t=!1)}t&&evidenceMatched.add(e)}}),document.getElementById("evidenceCount").textContent=evidenceMatched.size,renderEvidence();const a=document.getElementById("feedback");n>=85?(a.textContent="🎉 Excellent! Your Pangaea reconstruction is very accurate! "+e+"/"+continents.length+" continents in position.",a.className="feedback good"):n>=50?(a.textContent="Getting closer! "+e+"/"+continents.length+" continents are near their target. Use the evidence buttons for hints.",a.className="feedback info"):(a.textContent="Keep going! Try using fossil and rock evidence to guide your placement.",a.className="feedback info")}function renderEvidence(){const t=document.getElementById("evidenceList");t.innerHTML="",evidence.forEach((e,n)=>{const a=document.createElement("div");a.className="evidence-item "+(evidenceMatched.has(n)?"matched":"unmatched"),a.innerHTML=`<span>${e.emoji}</span>${e.text}`,t.appendChild(a)})}function resetPuzzle(){continents.forEach(t=>{t.x=.15+.7*Math.random(),t.y=.15+.7*Math.random(),t.rotation=0}),evidenceMatched.clear(),document.getElementById("accuracy").textContent="0%",document.getElementById("evidenceCount").textContent="0",document.getElementById("feedback").textContent="Drag continents to reconstruct Pangaea. Dashed outlines show target positions. Scroll wheel to rotate.",document.getElementById("feedback").className="feedback info",renderEvidence(),draw()}canvas.addEventListener("mousedown",t=>{if("drag"!==mode)return;const e=canvas.getBoundingClientRect(),n=t.clientX-e.left,a=t.clientY-e.top,o=hitTest(n,a);if(o){dragging=o;const t=toCanvas(o.x,o.y);dragOffset={x:n-t.x,y:a-t.y}}}),canvas.addEventListener("mousemove",t=>{if(!dragging)return;const e=canvas.getBoundingClientRect(),n=t.clientX-e.left,a=t.clientY-e.top,o=fromCanvas(n-dragOffset.x,a-dragOffset.y);dragging.x=Math.max(.05,Math.min(.95,o.x)),dragging.y=Math.max(.05,Math.min(.95,o.y)),draw()}),canvas.addEventListener("mouseup",()=>{dragging=null}),canvas.addEventListener("mouseleave",()=>{dragging=null}),canvas.addEventListener("touchstart",t=>{if("drag"!==mode)return;const e=canvas.getBoundingClientRect(),n=t.touches[0],a=n.clientX-e.left,o=n.clientY-e.top,c=hitTest(a,o);if(c){dragging=c;const e=toCanvas(c.x,c.y);dragOffset={x:a-e.x,y:o-e.y},t.prev
