<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tectonic Puzzle — LearnLattice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;overflow-x:hidden}
h1{font-size:1.5rem;background:linear-gradient(135deg,#14b8a6,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{color:#94a3b8;font-size:.82rem;margin-bottom:12px;text-align:center}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.tool-btn{padding:6px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.78rem;transition:all .15s}
.tool-btn:hover{border-color:#14b8a6;color:#e2e8f0}
.tool-btn.active{background:#0D9488;border-color:#0D9488;color:#fff}
.game-container{position:relative;width:100%;max-width:800px;aspect-ratio:16/10}
.map-canvas{width:100%;height:100%;border:2px solid #1e293b;border-radius:12px;background:#0c1829;cursor:grab}
.map-canvas:active{cursor:grabbing}
.info-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:800px;margin-top:12px;padding:10px 16px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:.82rem}
.info-bar .score{color:#14b8a6;font-weight:700}
.evidence-panel{width:100%;max-width:800px;margin-top:12px;padding:14px 18px;background:#0f172a;border:1px solid #1e293b;border-radius:10px}
.evidence-title{font-size:.72rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.evidence-list{display:flex;flex-wrap:wrap;gap:8px}
.evidence-item{padding:6px 12px;border-radius:8px;font-size:.78rem;border:1px solid #1e293b;display:flex;align-items:center;gap:6px}
.evidence-item.matched{background:rgba(34,197,94,.1);border-color:#22c55e;color:#22c55e}
.evidence-item.unmatched{color:#64748b}
.feedback{text-align:center;padding:10px;font-size:.9rem;margin-top:8px;border-radius:8px}
.feedback.good{background:rgba(34,197,94,.1);color:#22c55e}
.feedback.info{background:rgba(59,130,246,.1);color:#60a5fa}
</style>
</head>
<body>
<h1>Tectonic Puzzle</h1>
<p class="subtitle">Drag the continents to reconstruct Pangaea. Use evidence from fossils, climate, and rock formations.</p>

<div class="toolbar">
  <button class="tool-btn active" data-mode="drag" onclick="setMode('drag')">✋ Move Plates</button>
  <button class="tool-btn" data-mode="fossils" onclick="setMode('fossils')">🦴 Show Fossils</button>
  <button class="tool-btn" data-mode="climate" onclick="setMode('climate')">🌡️ Show Climate</button>
  <button class="tool-btn" data-mode="rocks" onclick="setMode('rocks')">🪨 Show Rock Matches</button>
  <button class="tool-btn" onclick="checkFit()">✓ Check Fit</button>
  <button class="tool-btn" onclick="resetPuzzle()">Reset</button>
</div>

<div class="game-container">
  <canvas id="mapCanvas" class="map-canvas"></canvas>
</div>

<div id="feedback" class="feedback info">Drag continents to their Pangaea positions. Use the evidence buttons for clues.</div>

<div class="info-bar">
  <span>Accuracy: <span class="score" id="accuracy">0%</span></span>
  <span>Evidence matched: <span class="score" id="evidenceCount">0</span>/12</span>
</div>

<div class="evidence-panel">
  <div class="evidence-title">Evidence for Continental Drift</div>
  <div class="evidence-list" id="evidenceList"></div>
</div>

<script>
const canvas=document.getElementById('mapCanvas');
const ctx=canvas.getContext('2d');
let W,H,mode='drag';

function resize(){
  const rect=canvas.parentElement.getBoundingClientRect();
  W=canvas.width=rect.width;
  H=canvas.height=rect.width*10/16;
  canvas.style.height=H+'px';
  draw();
}
window.addEventListener('resize',resize);

// Simplified continent shapes as polygons (relative to center, scaled to canvas)
const continents=[
  {id:'sa',name:'South America',color:'#22c55e',
   shape:[[-30,-10],[-35,15],[-28,45],[-15,55],[-10,45],[-5,20],[-10,5],[-20,-15]],
   x:.25,y:.55,targetX:.42,targetY:.52,rotation:0,targetRot:40},
  {id:'af',name:'Africa',color:'#f59e0b',
   shape:[[-20,-40],[-30,-15],[-25,15],[-15,35],[-5,40],[10,35],[20,10],[25,-10],[15,-30],[5,-40]],
   x:.55,y:.5,targetX:.52,targetY:.45,rotation:0,targetRot:-15},
  {id:'na',name:'North America',color:'#3b82f6',
   shape:[[-35,-5],[-30,15],[-15,25],[5,20],[20,15],[25,0],[20,-15],[10,-25],[-10,-25],[-25,-15]],
   x:.2,y:.25,targetX:.35,targetY:.28,rotation:0,targetRot:30},
  {id:'eu',name:'Europe',color:'#a855f7',
   shape:[[-20,-10],[-15,5],[-5,12],[10,10],[18,5],[15,-5],[10,-15],[0,-15]],
   x:.55,y:.2,targetX:.52,targetY:.25,rotation:0,targetRot:-10},
  {id:'an',name:'Antarctica',color:'#94a3b8',
   shape:[[-30,-8],[-20,8],[-5,12],[10,10],[25,5],[30,-5],[20,-12],[0,-12]],
   x:.5,y:.85,targetX:.5,targetY:.65,rotation:0,targetRot:0},
  {id:'au',name:'Australia',color:'#ef4444',
   shape:[[-15,-10],[-18,2],[-10,12],[5,10],[15,5],[12,-8],[5,-12]],
   x:.8,y:.65,targetX:.62,targetY:.6,rotation:0,targetRot:-30},
  {id:'in',name:'India',color:'#06b6d4',
   shape:[[-8,-15],[-12,-5],[-8,10],[0,18],[8,10],[12,-5],[8,-15]],
   x:.7,y:.4,targetX:.56,targetY:.5,rotation:0,targetRot:5},
];

const evidence=[
  {type:'fossil',text:'Mesosaurus fossils found in both South America and Africa',matches:['sa','af'],emoji:'🦴'},
  {type:'fossil',text:'Glossopteris fern fossils on all southern continents',matches:['sa','af','an','au','in'],emoji:'🌿'},
  {type:'fossil',text:'Lystrosaurus fossils in Africa, India, and Antarctica',matches:['af','in','an'],emoji:'🦎'},
  {type:'fossil',text:'Cynognathus fossils in South America and Africa',matches:['sa','af'],emoji:'🦴'},
  {type:'climate',text:'Glacial scratches in tropical Africa, India, and Australia',matches:['af','in','au'],emoji:'🧊'},
  {type:'climate',text:'Coal deposits (tropical origin) in Antarctica',matches:['an'],emoji:'⛏️'},
  {type:'climate',text:'Desert sandstone in northern Europe matches Sahara formations',matches:['eu','af'],emoji:'🏜️'},
  {type:'climate',text:'Tropical plant fossils in Arctic North America',matches:['na'],emoji:'🌴'},
  {type:'rocks',text:'Mountain ranges continue from East NA across to Northern Europe',matches:['na','eu'],emoji:'⛰️'},
  {type:'rocks',text:'Rock formations on Brazil coast match West African coast exactly',matches:['sa','af'],emoji:'🪨'},
  {type:'rocks',text:'Matching ore deposits in Australia and Antarctica',matches:['au','an'],emoji:'💎'},
  {type:'rocks',text:'Identical rock layers in India and Madagascar (Africa)',matches:['in','af'],emoji:'🧱'},
];

let dragging=null,dragOffset={x:0,y:0},evidenceMatched=new Set();

function toCanvas(rx,ry){return{x:rx*W,y:ry*H}}
function fromCanvas(cx,cy){return{x:cx/W,y:cy/H}}

function drawContinent(c,highlight){
  const center=toCanvas(c.x,c.y);
  const scale=Math.min(W,H)/800*2;
  ctx.save();
  ctx.translate(center.x,center.y);
  ctx.rotate(c.rotation*Math.PI/180);
  ctx.beginPath();
  c.shape.forEach((p,i)=>{
    const px=p[0]*scale,py=p[1]*scale;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  });
  ctx.closePath();
  ctx.fillStyle=c.color+'33';
  ctx.fill();
  ctx.strokeStyle=highlight?'#fff':c.color;
  ctx.lineWidth=highlight?3:2;
  ctx.stroke();

  // Label
  ctx.rotate(-c.rotation*Math.PI/180);
  ctx.fillStyle='#fff';
  ctx.font='bold 11px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(c.name,0,4);
  ctx.restore();
}

function drawEvidence(){
  if(mode==='drag')return;
  const relevantEvidence=evidence.filter(e=>e.type===mode.replace('s',''));
  const scale=Math.min(W,H)/800*2;
  relevantEvidence.forEach(e=>{
    const matchedContinents=e.matches.map(id=>continents.find(c=>c.id===id)).filter(Boolean);
    if(matchedContinents.length>=2){
      ctx.beginPath();
      ctx.setLineDash([4,4]);
      ctx.strokeStyle=e.type==='fossil'?'#22c55e':e.type==='climate'?'#f59e0b':'#a855f7';
      ctx.lineWidth=1.5;
      ctx.globalAlpha=.5;
      for(let i=0;i<matchedContinents.length-1;i++){
        const a=toCanvas(matchedContinents[i].x,matchedContinents[i].y);
        const b=toCanvas(matchedContinents[i+1].x,matchedContinents[i+1].y);
        ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha=1;
    }
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='#1e293b';ctx.lineWidth=.5;
  for(let i=0;i<W;i+=W/12){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  for(let i=0;i<H;i+=H/8){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}

  // Target outlines (ghost positions for Pangaea)
  ctx.globalAlpha=.15;
  continents.forEach(c=>{
    const ghost={...c,x:c.targetX,y:c.targetY,rotation:c.targetRot};
    const center=toCanvas(ghost.x,ghost.y);
    const scale=Math.min(W,H)/800*2;
    ctx.save();
    ctx.translate(center.x,center.y);
    ctx.rotate(ghost.rotation*Math.PI/180);
    ctx.beginPath();
    ghost.shape.forEach((p,i)=>{
      const px=p[0]*scale,py=p[1]*scale;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    });
    ctx.closePath();
    ctx.strokeStyle=c.color;
    ctx.lineWidth=1;
    ctx.setLineDash([3,3]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  });
  ctx.globalAlpha=1;

  drawEvidence();
  continents.forEach(c=>drawContinent(c,c===dragging));
}

function hitTest(mx,my){
  const scale=Math.min(W,H)/800*2;
  for(let i=continents.length-1;i>=0;i--){
    const c=continents[i];
    const center=toCanvas(c.x,c.y);
    const dx=mx-center.x,dy=my-center.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<40*scale)return c;
  }
  return null;
}

canvas.addEventListener('mousedown',e=>{
  if(mode!=='drag')return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const hit=hitTest(mx,my);
  if(hit){
    dragging=hit;
    const center=toCanvas(hit.x,hit.y);
    dragOffset={x:mx-center.x,y:my-center.y};
  }
});

canvas.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const pos=fromCanvas(mx-dragOffset.x,my-dragOffset.y);
  dragging.x=Math.max(.05,Math.min(.95,pos.x));
  dragging.y=Math.max(.05,Math.min(.95,pos.y));
  draw();
});

canvas.addEventListener('mouseup',()=>{dragging=null});
canvas.addEventListener('mouseleave',()=>{dragging=null});

// Touch support
canvas.addEventListener('touchstart',e=>{
  if(mode!=='drag')return;
  const rect=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const mx=t.clientX-rect.left,my=t.clientY-rect.top;
  const hit=hitTest(mx,my);
  if(hit){dragging=hit;const center=toCanvas(hit.x,hit.y);dragOffset={x:mx-center.x,y:my-center.y};e.preventDefault()}
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(!dragging)return;
  const rect=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const mx=t.clientX-rect.left,my=t.clientY-rect.top;
  const pos=fromCanvas(mx-dragOffset.x,my-dragOffset.y);
  dragging.x=Math.max(.05,Math.min(.95,pos.x));
  dragging.y=Math.max(.05,Math.min(.95,pos.y));
  draw();e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',()=>{dragging=null});

// Scroll wheel rotates selected continent
canvas.addEventListener('wheel',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const hit=hitTest(mx,my);
  if(hit){
    hit.rotation+=(e.deltaY>0?5:-5);
    draw();
    e.preventDefault();
  }
},{passive:false});

function setMode(m){
  mode=m;
  document.querySelectorAll('.tool-btn[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  draw();
}

function checkFit(){
  let totalDist=0,matched=0;
  continents.forEach(c=>{
    const dx=c.x-c.targetX,dy=c.y-c.targetY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    totalDist+=dist;
    if(dist<.08)matched++;
  });
  const accuracy=Math.max(0,Math.round((1-totalDist/(continents.length*.5))*100));
  document.getElementById('accuracy').textContent=accuracy+'%';

  // Check evidence
  evidenceMatched.clear();
  evidence.forEach((e,i)=>{
    const matchContinents=e.matches.map(id=>continents.find(c=>c.id===id)).filter(Boolean);
    if(matchContinents.length>=2){
      let close=true;
      for(let a=0;a<matchContinents.length-1;a++){
        const dx=matchContinents[a].x-matchContinents[a+1].x;
        const dy=matchContinents[a].y-matchContinents[a+1].y;
        if(Math.sqrt(dx*dx+dy*dy)>.2)close=false;
      }
      if(close)evidenceMatched.add(i);
    }
  });
  document.getElementById('evidenceCount').textContent=evidenceMatched.size;
  renderEvidence();

  const fb=document.getElementById('feedback');
  if(accuracy>=85){
    fb.textContent='🎉 Excellent! Your Pangaea reconstruction is very accurate! '+matched+'/'+continents.length+' continents in position.';
    fb.className='feedback good';
  }else if(accuracy>=50){
    fb.textContent='Getting closer! '+matched+'/'+continents.length+' continents are near their target. Use the evidence buttons for hints.';
    fb.className='feedback info';
  }else{
    fb.textContent='Keep going! Try using fossil and rock evidence to guide your placement.';
    fb.className='feedback info';
  }
}

function renderEvidence(){
  const list=document.getElementById('evidenceList');
  list.innerHTML='';
  evidence.forEach((e,i)=>{
    const div=document.createElement('div');
    div.className='evidence-item '+(evidenceMatched.has(i)?'matched':'unmatched');
    div.innerHTML=`<span>${e.emoji}</span>${e.text}`;
    list.appendChild(div);
  });
}

function resetPuzzle(){
  continents.forEach(c=>{
    // Scatter to modern-ish positions
    c.x=.15+Math.random()*.7;
    c.y=.15+Math.random()*.7;
    c.rotation=0;
  });
  evidenceMatched.clear();
  document.getElementById('accuracy').textContent='0%';
  document.getElementById('evidenceCount').textContent='0';
  document.getElementById('feedback').textContent='Drag continents to reconstruct Pangaea. Dashed outlines show target positions. Scroll wheel to rotate.';
  document.getElementById('feedback').className='feedback info';
  renderEvidence();
  draw();
}

renderEvidence();
resize();
</script>
</body>
</html>
