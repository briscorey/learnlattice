<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Circuit Challenge — LearnLattice</title>
<!-- MYP Alignment
  Criteria: A – Knowing & Understanding, D – Applying
  Key Concept: Systems
  Related Concepts: Function, Models
  ATL: Critical thinking (troubleshooting), Transfer (real-world circuits)
  Global Context: Scientific and Technical Innovation
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020617;color:#e2e8f0;font-family:'Space Grotesk',sans-serif;min-height:100vh}
.hdr{padding:10px 20px;background:rgba(234,179,8,.06);border-bottom:1px solid rgba(234,179,8,.15);display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.1rem;color:#fbbf24;font-weight:700}
.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#fbbf24}
.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.3)}
.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-bottom:4px}
.pg-bar.done{background:#fbbf24}.pg-bar.active{background:#f59e0b;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pg-label{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}
.pg.done .pg-label{color:#fbbf24}.pg.active .pg-label{color:#f59e0b}
.game{max-width:640px;margin:0 auto;padding:20px}
.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.s-num{font-size:.6rem;color:#fbbf24;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.s-name{font-size:1.5rem;font-weight:700;margin-bottom:8px}
.s-desc{font-size:.85rem;color:#94a3b8;margin-bottom:4px}
.s-ican{font-size:.78rem;color:#fde68a;font-style:italic;margin-bottom:20px}
.btn{padding:12px 28px;border-radius:10px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.1);color:#fde68a;font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{background:rgba(251,191,36,.2);border-color:#fbbf24;transform:translateY(-2px)}
.btn-go{background:#fbbf24;color:#020617;border-color:#fbbf24}.btn-go:hover{background:#f59e0b}
.q{animation:fadeIn .4s}
.q-card{padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:16px}
.q-num{font-size:.65rem;color:#fbbf24;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.q-text{font-size:1rem;font-weight:600;color:#fff;margin-bottom:16px;line-height:1.5}
/* Circuit diagram */
.circuit{padding:20px;background:rgba(251,191,36,.04);border:1px solid rgba(251,191,36,.12);border-radius:14px;margin-bottom:16px;text-align:center}
.circuit-diagram{font-family:'JetBrains Mono',monospace;font-size:.85rem;color:#fde68a;line-height:2;white-space:pre;display:inline-block;text-align:left}
.circuit-diagram .wire{color:#64748b}
.circuit-diagram .component{color:#fbbf24;font-weight:600}
.circuit-diagram .broken{color:#ef4444;text-decoration:line-through}
.circuit-label{font-size:.72rem;color:#94a3b8;margin-top:8px}
/* Component card */
.comp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.comp{padding:14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);text-align:center;cursor:pointer;transition:all .2s}
.comp:hover:not(.locked){border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.06);transform:translateY(-2px)}
.comp-icon{font-size:2rem;margin-bottom:6px;display:block}
.comp-name{font-size:.78rem;font-weight:600;color:#e2e8f0}
.comp.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.comp.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}
.comp.locked{cursor:default;opacity:.5}.comp.locked.correct{opacity:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts-1{grid-template-columns:1fr}
.opt{padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-size:.85rem;cursor:pointer;transition:all .2s;text-align:left;font-family:'Space Grotesk',sans-serif;line-height:1.4}
.opt:hover:not(.locked){border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.06);transform:translateY(-2px)}
.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}
.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}
.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}
.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}
.fb-no{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}
.fb strong{display:block;margin-bottom:2px}
.next{text-align:center;margin-top:12px}
.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}
.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#fbbf24;font-weight:700}
.r-label{font-size:1.1rem;font-weight:700;margin:6px 0}
.r-detail{font-size:.85rem;color:#94a3b8;margin-bottom:20px;line-height:1.5}
.r-transfer{padding:14px 18px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}
.r-actions{display:flex;gap:8px;justify-content:center}
.sd{text-align:center;padding:28px;animation:fadeIn .5s}
.sd-stars{font-size:2rem;margin-bottom:6px}
</style>
<style id="ec">.embed-mode .hdr{display:none!important}</style>
<script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed-mode');</script>
</head>
<body>
<div class="hdr"><h1>⚡ Circuit Challenge</h1><span class="pts" id="pts">0 pts</span></div>
<div class="progress" id="prog"></div>
<div class="game" id="game"></div>
<script>
let stage=0,qIdx=0,pts=0,correct=0,total=0,sc=0;
const STAGES=[
  {name:'Components',desc:'Name the parts of a circuit',ican:'I can identify circuit components and their symbols.',qs:6},
  {name:'Complete',desc:'Will the circuit work?',ican:'I can determine if a circuit is complete.',qs:5},
  {name:'Predict',desc:'What happens to brightness and current?',ican:'I can predict how adding components changes a circuit.',qs:5},
  {name:'Troubleshoot',desc:'Find and fix the fault',ican:'I can diagnose why a circuit isn\'t working.',qs:5}
];
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// STAGE 1: Component identification
function gen0(){
  return sh([
    {icon:'🔋',q:'This component pushes electrical charge around the circuit. It is a...',opts:['Battery (cell)','Bulb','Switch','Resistor'],correct:0,hint:'This component provides the "push" (voltage) that drives current.',why:'A battery/cell provides voltage — the push that makes current flow around the circuit.'},
    {icon:'💡',q:'This component converts electrical energy into light. It is a...',opts:['Bulb (lamp)','Battery','Motor','Resistor'],correct:0,hint:'It glows when current flows through it.',why:'A bulb converts electrical energy into light (and heat) energy.'},
    {icon:'🔌',q:'This component can break or complete the circuit. It is a...',opts:['Switch','Wire','Resistor','Ammeter'],correct:0,hint:'You can turn it ON and OFF.',why:'A switch controls whether current can flow by opening or closing a gap in the circuit.'},
    {icon:'Ⓜ️',q:'This component converts electrical energy into movement. It is a...',opts:['Motor','Generator','Battery','Fuse'],correct:0,hint:'It spins when current flows through it.',why:'A motor converts electrical energy into kinetic (movement) energy.'},
    {icon:'🌡️',q:'This instrument measures the current flowing through a circuit. It is an...',opts:['Ammeter','Voltmeter','Thermometer','Barometer'],correct:0,hint:'It measures current in Amperes (A).',why:'An ammeter measures current (in amps). It must be connected in SERIES with the component.'},
    {icon:'📏',q:'This instrument measures the voltage across a component. It is a...',opts:['Voltmeter','Ammeter','Wattmeter','Ohmmeter'],correct:0,hint:'It measures the "push" across a component, in Volts.',why:'A voltmeter measures voltage (in volts). It must be connected in PARALLEL across the component.'},
    {icon:'⚡',q:'This component reduces the flow of current. It is a...',opts:['Resistor','Conductor','Battery','Switch'],correct:0,hint:'It opposes the flow of charge. More of these = less current.',why:'A resistor opposes current flow. Resistance is measured in ohms (Ω).'},
    {icon:'🔒',q:'This safety device melts if too much current flows, breaking the circuit. It is a...',opts:['Fuse','Switch','Resistor','Capacitor'],correct:0,hint:'It protects the circuit by breaking when current is dangerously high.',why:'A fuse is a safety device. It melts (breaks) when current exceeds a safe value, protecting the circuit.'}
  ]).slice(0,STAGES[0].qs);
}

// STAGE 2: Complete circuits
function gen1(){
  return sh([
    {diagram:'🔋 ─── 💡 ─── 🔌(closed) ─── back to 🔋',q:'This circuit has a battery, bulb, and closed switch. Will the bulb light up?',opts:['Yes — complete circuit with closed switch','No — the switch blocks current','No — needs more batteries','Only if the bulb is new'],correct:0,hint:'For current to flow, the circuit must be a complete, unbroken loop with a closed switch.',why:'The circuit is complete: battery provides voltage, current flows through the closed switch and bulb. The bulb lights up!'},
    {diagram:'🔋 ─── 💡 ─── 🔌(OPEN) ─── back to 🔋',q:'The switch is OPEN. Will the bulb light up?',opts:['No — open switch breaks the circuit','Yes — the battery is connected','Yes — but dimly','Only for a moment'],correct:0,hint:'An open switch creates a gap. Can current flow across a gap?',why:'An open switch breaks the circuit. There\'s a gap, so no current flows and the bulb stays off.'},
    {diagram:'🔋 ─── 💡 ─── [GAP] ─── back to 🔋',q:'One wire is disconnected. Will the bulb work?',opts:['No — circuit is incomplete','Yes — electricity can jump gaps','Yes — one wire is enough','Only with high voltage'],correct:0,hint:'Current needs a complete loop. Is there a complete loop here?',why:'A disconnected wire means an incomplete circuit. Current cannot flow across the gap. No light.'},
    {diagram:'🔋 ─── 💡₁ ─── 💡₂ ─── back to 🔋',q:'Two bulbs are connected one after another. This is called a...',opts:['Series circuit','Parallel circuit','Open circuit','Short circuit'],correct:0,hint:'Components one after another in a single loop = ?',why:'Components connected end-to-end in one loop are in SERIES. Current has only one path to follow.'},
    {diagram:'🔋 ─┬─ 💡₁ ─┬─ back to 🔋\n         └─ 💡₂ ─┘',q:'Two bulbs are connected on separate branches. This is called a...',opts:['Parallel circuit','Series circuit','Short circuit','Open circuit'],correct:0,hint:'Components on separate branches, sharing the same battery = ?',why:'Components on separate branches are in PARALLEL. Current splits and flows through both paths.'},
    {diagram:'🔋 ─── wire ─── wire ─── back to 🔋 (no components)',q:'A wire connects directly across the battery with NO components. This is a...',opts:['Short circuit — dangerous!','Normal circuit','Parallel circuit','Open circuit'],correct:0,hint:'What happens when current has NO resistance? It flows uncontrollably.',why:'A short circuit has no resistance. Huge current flows, overheating the wire. This is dangerous and can cause fires!'}
  ]).slice(0,STAGES[1].qs);
}

// STAGE 3: Predict brightness/current
function gen2(){
  return sh([
    {q:'A circuit has one battery and one bulb (bright). You ADD a second bulb in SERIES. What happens?',opts:['Both bulbs are dimmer than the original','Both bulbs are brighter','The first stays the same, second is dim','Nothing changes'],correct:0,hint:'In series, adding another bulb increases total resistance. More resistance means...',why:'Adding a bulb in series increases resistance, so LESS current flows. Both bulbs get less current and are dimmer.'},
    {q:'A circuit has one battery and one bulb. You ADD a second bulb in PARALLEL. What happens?',opts:['Both bulbs are equally bright (same as original)','Both are dimmer','The new one doesn\'t work','Both are brighter'],correct:0,hint:'In parallel, each bulb gets the FULL battery voltage independently.',why:'In parallel, each bulb gets the full voltage of the battery. Each is as bright as if it were alone. (Total current from battery increases.)'},
    {q:'Two identical bulbs are in SERIES. One bulb blows (breaks). What happens to the other?',opts:['It goes out too (circuit broken)','It gets brighter','It stays the same','It flickers'],correct:0,hint:'In series, current has only ONE path. If that path is broken...',why:'In series, there\'s only one path. A broken bulb = broken circuit. NO current flows, so the other bulb goes out.'},
    {q:'Two identical bulbs are in PARALLEL. One bulb blows. What happens to the other?',opts:['It stays on (still has its own path)','It goes out','It gets dimmer','It gets brighter'],correct:0,hint:'In parallel, each bulb has its OWN path to the battery.',why:'In parallel, the other bulb still has a complete path to the battery. It stays on! This is why houses use parallel wiring.'},
    {q:'You replace a 3V battery with a 6V battery (same circuit, same bulb). What happens?',opts:['Bulb is brighter (more current)','Bulb is dimmer','No change','Bulb breaks immediately'],correct:0,hint:'More voltage = more "push." What happens to current when there\'s more push?',why:'Doubling voltage doubles current (V=IR). More current through the bulb = brighter. (Though too much voltage could burn it out!)'},
    {q:'In a series circuit with 2 identical bulbs: where is the current LARGEST?',opts:['Current is the same everywhere','At the battery','At the first bulb','Between the bulbs'],correct:0,hint:'In series, there\'s only one path. Does current "use up" as it goes?',why:'In a series circuit, current is the SAME at every point. Current is not "used up" — it flows in a complete loop.'}
  ]).slice(0,STAGES[2].qs);
}

// STAGE 4: Troubleshoot
function gen3(){
  return sh([
    {q:'🔋─💡─🔌(closed)─🔋. The bulb doesn\'t light. The battery is new and the switch is closed. What\'s most likely wrong?',opts:['The bulb is blown (broken filament)','The battery is flat','The switch is open','Electricity doesn\'t work today'],correct:0,hint:'Battery is new ✓, switch is closed ✓. What\'s left?',why:'If the battery works and switch is closed, the bulb filament is probably broken. No continuous path = no current.'},
    {q:'Two bulbs in series — neither lights up. You swap one bulb and both light. What was wrong?',opts:['The swapped bulb was blown','The battery was dead','Both bulbs were wrong','The wires were crossed'],correct:0,hint:'In series, one broken component breaks the whole circuit. Swapping one fixed it, so...',why:'In series, one broken bulb breaks the entire circuit. The bulb you swapped out was blown, stopping all current.'},
    {q:'A parallel circuit has 3 bulbs. Bulb 2 goes out but 1 and 3 stay on. What happened?',opts:['Bulb 2 is blown (its branch broken)','The battery is dying','A wire fell off the battery','Bulb 2 was never connected'],correct:0,hint:'In parallel, each branch is independent. If only one goes out...',why:'In parallel, each bulb has its own path. Bulb 2\'s filament broke, but the other branches are unaffected.'},
    {q:'A circuit should have current of 2A but the ammeter reads 0A. The battery and wires are fine. What should you check?',opts:['Is the switch open? Is any component broken?','Is the ammeter broken?','Is the voltage too high?','Are there too many bulbs?'],correct:0,hint:'0A means NO current flows. The circuit must be broken somewhere.',why:'0A = no current = broken circuit. Check for open switches, blown fuses, broken bulbs, or loose connections.'},
    {q:'A student connects a voltmeter in SERIES instead of parallel. What happens?',opts:['Very little current flows (voltmeter has very high resistance)','The circuit works normally','The voltmeter explodes','Current increases'],correct:0,hint:'A voltmeter has very high resistance. What happens when high resistance is put in series?',why:'Voltmeters have very high resistance. In series, this blocks almost all current — the circuit barely works. Always connect voltmeters in PARALLEL.'},
    {q:'A circuit has a 6V battery, a bulb, and a 2A fuse. The bulb draws 3A. What happens?',opts:['The fuse blows (3A > 2A rating)','The bulb works fine','The battery overheats','Nothing — fuses don\'t affect current'],correct:0,hint:'The fuse is rated for 2A maximum. The bulb needs 3A. Is 3 > 2?',why:'The bulb draws 3A but the fuse is only rated for 2A. The fuse wire melts, breaking the circuit. You need a higher-rated fuse (or a different bulb).'}
  ]).slice(0,STAGES[3].qs);
}

const generators=[gen0,gen1,gen2,gen3];
let questions=[];

function renderProg(){document.getElementById('prog').innerHTML=STAGES.map((s,i)=>`<div class="pg ${i<stage?'done':i===stage?'active':''}"><div class="pg-bar ${i<stage?'done':i===stage?'active':''}"></div><span class="pg-label">${s.name}</span></div>`).join('')}

function showIntro(){sc=0;questions=generators[stage]();qIdx=0;document.getElementById('game').innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STAGES.length}</div><div class="s-name">${STAGES[stage].name}</div><div class="s-desc">${STAGES[stage].desc}</div><div class="s-ican">"${STAGES[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`;renderProg()}

function showQ(){
  if(qIdx>=questions.length){showSD();return}
  const q=questions[qIdx];
  let html=`<div class="q"><div class="q-card"><div class="q-num">Question ${qIdx+1} of ${questions.length}</div>`;
  if(q.icon)html+=`<div style="text-align:center;font-size:3rem;margin-bottom:12px">${q.icon}</div>`;
  if(q.diagram)html+=`<div class="circuit"><div class="circuit-diagram">${q.diagram}</div></div>`;
  html+=`<div class="q-text">${q.q}</div>`;
  html+=`<div class="opts ${q.opts.some(o=>o.length>40)?'opts-1':''}">${q.opts.map((o,i)=>`<button class="opt" onclick="check(${i})" id="o${i}">${o}</button>`).join('')}</div>`;
  html+=`</div><div id="fb"></div><div class="next" id="nx"></div></div>`;
  document.getElementById('game').innerHTML=html;
}

function check(i){
  const q=questions[qIdx];total++;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('locked'));
  if(i===q.correct){
    document.getElementById('o'+i).classList.add('correct');
    correct++;sc++;pts+=10;document.getElementById('pts').textContent=pts+' pts';
    document.getElementById('fb').innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${q.why}</div>`;
  }else{
    document.getElementById('o'+i).classList.add('wrong');document.getElementById('o'+q.correct).classList.add('correct');
    document.getElementById('fb').innerHTML=`<div class="fb fb-no"><strong>💡 Not quite:</strong>${q.hint}</div>`;
  }
  document.getElementById('nx').innerHTML=`<button class="btn" onclick="qIdx++;showQ()">Next →</button>`;
}

function showSD(){
  const pct=Math.round(sc/questions.length*100);const stars=pct>=80?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
  if(stage<STAGES.length-1){document.getElementById('game').innerHTML=`<div class="sd"><div class="sd-stars">${stars}</div><div class="s-name">${STAGES[stage].name} Complete!</div><p style="color:#94a3b8;margin:8px 0">${sc}/${questions.length} correct</p><button class="btn btn-go" onclick="stage++;showIntro()">Next Stage →</button></div>`}
  else showResults();
}

function showResults(){
  const pct=Math.round(correct/total*100);
  let label='🏆 Circuit Master!',detail='You can identify, build, predict, and troubleshoot circuits.';
  if(pct<50){label='⚡ Keep charging!';detail='Circuits are tricky. Review series vs parallel and try again.'}
  else if(pct<75){label='⚡ Good connection!';detail='Solid foundation. The prediction and troubleshooting stages need practice.'}
  document.getElementById('game').innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${label}</div><div class="r-detail">${detail}<br>Score: ${pts} points</div>
  <div class="r-transfer">🌍 <strong>Circuits in your life:</strong> Your phone, the lights in your room, your laptop — all circuits. Houses use PARALLEL wiring (so one blown bulb doesn't kill all lights). Circuit breakers are automatic fuses that protect your home.</div>
  <div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`;renderProg();
}

showIntro();
</script>
</body>
</html>
