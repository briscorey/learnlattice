<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision Mode — LearnLattice</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0f1a;--surface:#151929;--card:#1c2137;--border:#2a3050;--ink:#e8eaf0;--muted:#6b7194;--accent:#6366f1;--accent2:#818cf8;--correct:#22c55e;--wrong:#ef4444;--amber:#f59e0b;--radius:14px}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* ── Header ── */
.hdr{padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-stats{display:flex;gap:16px;font-size:.82rem}
.hdr-stat{display:flex;align-items:center;gap:4px}
.hdr-stat .num{font-weight:700;color:var(--accent2);font-size:1rem}

/* ── Screens ── */
.screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.screen.active{display:flex}

/* ── Topic Picker ── */
.pick-title{font-size:2rem;font-weight:800;margin-bottom:6px;letter-spacing:-1px}
.pick-sub{font-size:.95rem;color:var(--muted);margin-bottom:32px;max-width:400px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;max-width:600px}
.pick-btn{padding:18px 14px;border-radius:var(--radius);border:2px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.pick-btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.15)}
.pick-btn .pick-icon{font-size:1.6rem}
.pick-btn .pick-count{font-size:.68rem;color:var(--muted)}
.pick-all{grid-column:1/-1;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.pick-all:hover{opacity:.9;transform:translateY(-2px)}

/* ── Session ── */
.session{padding:20px;flex:1;display:flex;flex-direction:column;align-items:center;max-width:600px;margin:0 auto;width:100%}

/* Progress bar */
.progress-bar{width:100%;height:6px;background:var(--surface);border-radius:3px;margin-bottom:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s cubic-bezier(.22,1,.36,1)}

/* Card */
.card{width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:0;overflow:hidden;transition:all .3s;min-height:280px;display:flex;flex-direction:column;position:relative}
.card-type{padding:12px 20px;font-size:.62rem;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.card-type.recall{background:rgba(99,102,241,.08);color:var(--accent2)}
.card-type.apply{background:rgba(245,158,11,.08);color:var(--amber)}
.card-type.extend{background:rgba(239,68,68,.08);color:var(--wrong)}
.card-type.tf{background:rgba(34,197,94,.08);color:var(--correct)}
.card-body{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:center}
.card-source{font-size:.7rem;color:var(--muted);margin-bottom:12px}
.card-q{font-size:1.25rem;font-weight:600;line-height:1.4;color:var(--ink);margin-bottom:16px;white-space:pre-line}
.card-reveal-btn{padding:12px 24px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent2);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;align-self:center}
.card-reveal-btn:hover{background:var(--accent);color:#fff}
.card-answer{padding:20px 24px;background:var(--surface);border-top:1px solid var(--border);font-size:.95rem;line-height:1.5;color:var(--ink);display:none;animation:slideUp .3s ease}
.card-answer.show{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* TF buttons */
.tf-btns{display:flex;gap:10px;align-self:center}
.tf-btn{padding:12px 28px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s}
.tf-btn:hover{border-color:var(--accent)}
.tf-btn.selected-correct{background:rgba(34,197,94,.15);border-color:var(--correct);color:var(--correct)}
.tf-btn.selected-wrong{background:rgba(239,68,68,.15);border-color:var(--wrong);color:var(--wrong)}

/* Self-assess buttons */
.assess{display:flex;gap:10px;margin-top:16px;justify-content:center;width:100%}
.assess-btn{flex:1;padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s;max-width:180px}
.assess-btn:hover{transform:translateY(-2px)}
.assess-got{color:var(--correct);border-color:rgba(34,197,94,.3)}
.assess-got:hover{background:rgba(34,197,94,.1);border-color:var(--correct)}
.assess-not{color:var(--amber);border-color:rgba(245,158,11,.3)}
.assess-not:hover{background:rgba(245,158,11,.1);border-color:var(--amber)}

/* ── Summary ── */
.summary-score{font-size:4rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.summary-label{font-size:1rem;color:var(--muted);margin-bottom:24px}
.summary-stats{display:flex;gap:20px;margin-bottom:24px}
.summary-stat{text-align:center;padding:14px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.summary-stat .val{font-size:1.4rem;font-weight:700;display:block}
.summary-stat .lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:4px}
.summary-stat.got .val{color:var(--correct)}
.summary-stat.not .val{color:var(--amber)}
.summary-stat.time .val{color:var(--accent2)}
.review-list{width:100%;max-width:500px;margin-bottom:24px;text-align:left}
.review-list h3{font-size:.82rem;color:var(--amber);margin-bottom:8px}
.review-item{padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:.85rem}
.review-item .ri-q{color:var(--ink);font-weight:500}
.review-item .ri-a{color:var(--muted);font-size:.8rem;margin-top:4px}
.big-btn{padding:14px 40px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.big-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.3)}
.big-btn.outline{background:transparent;border:2px solid var(--border);color:var(--muted)}
.big-btn.outline:hover{border-color:var(--accent);color:var(--accent2)}

/* ── Streak animation ── */
.streak-pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:3rem;font-weight:800;color:var(--accent2);pointer-events:none;z-index:100;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.streak-pop.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.streak-pop.hide{transform:translate(-50%,-60%) scale(0.8);opacity:0}

/* ── Mobile ── */
@media(max-width:480px){
  .pick-title{font-size:1.5rem}
  .pick-grid{grid-template-columns:repeat(2,1fr)}
  .card-q{font-size:1.05rem}
  .summary-stats{flex-wrap:wrap}
  .summary-score{font-size:3rem}
}
</style>
</head>
<body>

<div class="hdr">
  <h1>📖 Revision Mode</h1>
  <div class="hdr-stats">
    <div class="hdr-stat"><span class="num" id="hStreak">0</span>🔥</div>
    <div class="hdr-stat"><span class="num" id="hScore">0</span>pts</div>
  </div>
</div>

<!-- Screen 1: Topic Picker -->
<div class="screen active" id="pickScreen">
  <div class="pick-title">What are you revising?</div>
  <div class="pick-sub">Pick a subject for a focused study session. Cards come from real investigations you've done in class.</div>
  <div class="pick-grid" id="pickGrid"></div>
</div>

<!-- Screen 2: Session -->
<div class="screen" id="sessionScreen">
  <div class="session">
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div class="card" id="card">
      <div class="card-type" id="cardType">RECALL</div>
      <div class="card-body">
        <div class="card-source" id="cardSource"></div>
        <div class="card-q" id="cardQ"></div>
        <div id="cardActions"></div>
      </div>
      <div class="card-answer" id="cardAnswer"></div>
    </div>
    <div class="assess" id="assessBtns" style="display:none">
      <button class="assess-btn assess-got" onclick="assess(true)">✓ Got it</button>
      <button class="assess-btn assess-not" onclick="assess(false)">✗ Not yet</button>
    </div>
  </div>
</div>

<!-- Screen 3: Summary -->
<div class="screen" id="summaryScreen">
  <div class="summary-score" id="sumScore">0%</div>
  <div class="summary-label" id="sumLabel">Session complete</div>
  <div class="summary-stats">
    <div class="summary-stat got"><span class="val" id="sumGot">0</span><span class="lbl">Got it</span></div>
    <div class="summary-stat not"><span class="val" id="sumNot">0</span><span class="lbl">Review</span></div>
    <div class="summary-stat time"><span class="val" id="sumTime">0s</span><span class="lbl">Time</span></div>
  </div>
  <div class="review-list" id="reviewList"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="big-btn" onclick="startSession(lastSubject)">Try again</button>
    <button class="big-btn outline" onclick="showPicker()">Change topic</button>
  </div>
</div>

<div class="streak-pop" id="streakPop"></div>

<script>
var REVISION_DATA = [{"s": "Biology", "t": "recall", "q": "Name 4 of the 7 MRS GREN characteristics.", "a": "Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition", "src": "Dead or Alive? The Criteria Problem"}, {"s": "Biology", "t": "apply", "q": "A car moves, uses fuel, and produces exhaust. Is it alive? Which criteria does it fail?", "a": "Not alive — fails Growth, Reproduction, Sensitivity (no voluntary response)", "src": "Dead or Alive? The Criteria Problem"}, {"s": "Biology", "t": "extend", "q": "Why do scientists disagree about whether viruses are alive?", "a": "Viruses reproduce but only inside host cells. They don't respire, grow, or respond independently.", "src": "Dead or Alive? The Criteria Problem"}, {"s": "Biology", "t": "tf", "q": "If something moves, it is alive", "a": "Rivers move. Clouds move. Robots move. Movement alone does not indicate life — it must be self-generated movement in response to stimuli.", "src": "Dead or Alive? The Criteria Problem"}, {"s": "Biology", "t": "tf", "q": "Fire is alive because it grows and reproduces", "a": "Fire does not have cells, DNA, or metabolism. It is a chemical reaction, not an organism. It meets some criteria superficially but fails at the cellular level.", "src": "Dead or Alive? The Criteria Problem"}, {"s": "Biology", "t": "tf", "q": "Viruses are alive because they reproduce", "a": "Viruses cannot reproduce independently — they hijack a host cell. They do not respire, grow, or respond to stimuli on their own. Scientists genuinely disagree about whether viruses are alive.", "src": "Dead or Alive? The Criteria Problem"}, {"s": "Physics", "t": "recall", "q": "What is the formula for density?", "a": "Density = mass ÷ volume", "src": "The Sinking Orange"}, {"s": "Physics", "t": "apply", "q": "A block has mass 60g and volume 20cm³. Will it float in water?", "a": "Density = 3.0 g/cm³ — it sinks (greater than 1.0)", "src": "The Sinking Orange"}, {"s": "Physics", "t": "extend", "q": "Why does ice float on water even though both are H₂O?", "a": "Ice is less dense because water molecules form a crystal structure with gaps", "src": "The Sinking Orange"}, {"s": "Physics", "t": "tf", "q": "Heavy things sink", "a": "It is density, not mass. A massive ship floats because its average density including air inside is less than water.", "src": "The Sinking Orange"}, {"s": "Physics", "t": "tf", "q": "All metals sink", "a": "Aluminium foil can be shaped into a boat that floats. Sodium metal actually floats on water because its density is 0.97.", "src": "The Sinking Orange"}, {"s": "Physics", "t": "tf", "q": "Water always has density 1.0", "a": "Salt water is denser than fresh water, which is why you float more easily in the sea. Temperature also changes water density.", "src": "The Sinking Orange"}, {"s": "Physics", "t": "tf", "q": "Heavier objects fall faster", "a": "In a vacuum, ALL objects fall at the same rate. The difference we see is caused by air resistance, not gravity.", "src": "The Feather and the Hammer"}, {"s": "Physics", "t": "tf", "q": "Objects fall because they are heavy", "a": "Objects fall because gravity pulls them. Weight is the FORCE of gravity on the object, but the acceleration is the same regardless of mass.", "src": "The Feather and the Hammer"}, {"s": "Space Science", "t": "tf", "q": "The brightest star is the closest", "a": "Brightness depends on BOTH distance and luminosity. A very luminous star far away can look brighter than a dim star nearby.", "src": "How Do We Know What Stars Are Made Of?"}, {"s": "Space Science", "t": "tf", "q": "Stars are all the same colour", "a": "Stars range from red (cool, about 3000K) to blue (hot, about 30000K). Our eyes struggle to see star colours, but telescopes reveal them clearly.", "src": "How Do We Know What Stars Are Made Of?"}, {"s": "Space Science", "t": "tf", "q": "We guess what stars are made of", "a": "Spectroscopy analyses the light from a star. Each element absorbs specific wavelengths, leaving a unique fingerprint. We KNOW what stars are made of.", "src": "How Do We Know What Stars Are Made Of?"}, {"s": "Mathematics", "t": "recall", "q": "What do the interior angles of a triangle add up to?", "a": "180°", "src": "Impossible Shapes"}, {"s": "Mathematics", "t": "apply", "q": "What is the angle sum of a hexagon (6 sides)?", "a": "(6-2) × 180 = 720°", "src": "Impossible Shapes"}, {"s": "Mathematics", "t": "extend", "q": "Why does adding one side always add exactly 180° to the angle sum?", "a": "Each extra side creates one more triangle in the decomposition.", "src": "Impossible Shapes"}, {"s": "Mathematics", "t": "tf", "q": "All triangles add to exactly 180 degrees when you measure", "a": "Measurement always has error. You will get 178 or 182. The mathematical truth is exactly 180, but physical measurement is approximate.", "src": "Impossible Shapes"}, {"s": "Mathematics", "t": "tf", "q": "The angle sum formula only works for regular polygons", "a": "The formula works for ALL polygons — regular or irregular. You can always decompose any polygon into triangles.", "src": "Impossible Shapes"}, {"s": "Mathematics", "t": "tf", "q": "A circle has infinite sides so its angle sum is infinite", "a": "A circle is not a polygon. As the number of sides increases, each interior angle approaches 180 degrees, but the total does increase without bound.", "src": "Impossible Shapes"}, {"s": "Mathematics", "t": "recall", "q": "What is the theoretical probability of rolling a 3 on a fair die?", "a": "1/6 ≈ 0.167", "src": "Is This Die Cheating?"}, {"s": "Mathematics", "t": "apply", "q": "You roll a die 60 times. How many 4s do you EXPECT?", "a": "60 × 1/6 = 10", "src": "Is This Die Cheating?"}, {"s": "Mathematics", "t": "extend", "q": "You get twelve 6s in 60 rolls. Is the die unfair? How would you decide?", "a": "Expected is 10, got 12. Possible by chance. Need more rolls or a statistical test to be sure.", "src": "Is This Die Cheating?"}, {"s": "Mathematics", "t": "tf", "q": "After 5 heads, tails is due", "a": "Each flip is independent. The coin has no memory. The probability of tails is still 0.5 regardless of previous flips.", "src": "Is This Die Cheating?"}, {"s": "Mathematics", "t": "tf", "q": "30 rolls is enough to know if a die is fair", "a": "With 30 rolls, random variation is large. You need hundreds of rolls before the experimental probability reliably matches the theoretical probability.", "src": "Is This Die Cheating?"}, {"s": "Mathematics", "t": "tf", "q": "If results are not exactly equal, the die is unfair", "a": "Even a perfectly fair die will not give exactly equal results. Random variation is normal. The question is whether the variation is larger than we would expect by chance.", "src": "Is This Die Cheating?"}, {"s": "Earth Science", "t": "tf", "q": "Rocks are all the same — just different colours", "a": "Crystal size, layering, hardness, and mineral composition all tell different stories. A geologist reads a rock like a detective reads evidence.", "src": "Reading Rocks: How We Know What We Cannot See"}, {"s": "Earth Science", "t": "tf", "q": "Fossils are found in all types of rock", "a": "Fossils are found almost exclusively in sedimentary rock. Igneous and metamorphic processes destroy organic remains.", "src": "Reading Rocks: How We Know What We Cannot See"}, {"s": "Earth Science", "t": "tf", "q": "Metamorphic means the rock melted", "a": "Metamorphic rocks changed due to heat and pressure WITHOUT melting. If they melted, they would become igneous rock.", "src": "Reading Rocks: How We Know What We Cannot See"}, {"s": "Mathematics", "t": "tf", "q": "Planets are close together in space", "a": "Space is almost entirely empty. At basketball-Sun scale, Earth is 26 metres away. Neptune is 780 metres. The nearest star is over 6000 km.", "src": "Scaling the Solar System"}, {"s": "Mathematics", "t": "tf", "q": "The Sun is a bit bigger than the planets", "a": "The Sun is 109 times Earth's diameter. You could fit 1.3 million Earths inside the Sun.", "src": "Scaling the Solar System"}, {"s": "Mathematics", "t": "recall", "q": "Which is bigger: 2/5 or 3/8?", "a": "2/5 = 16/40, 3/8 = 15/40. So 2/5 is bigger.", "src": "The Fairness Problem"}, {"s": "Mathematics", "t": "apply", "q": "3 people share 2 pizzas. 5 people share 3 pizzas. Who gets more?", "a": "2/3 vs 3/5. 2/3 ≈ 0.667, 3/5 = 0.6. First group gets more.", "src": "The Fairness Problem"}, {"s": "Mathematics", "t": "extend", "q": "Can two different fractions ALWAYS be compared? What method works every time?", "a": "Yes — find a common denominator, or convert both to decimals.", "src": "The Fairness Problem"}, {"s": "Mathematics", "t": "tf", "q": "Bigger denominator means bigger fraction", "a": "Bigger denominator means MORE pieces, which means each piece is SMALLER. 1/5 is smaller than 1/3.", "src": "The Fairness Problem"}, {"s": "Mathematics", "t": "tf", "q": "You add fractions by adding tops and bottoms", "a": "You need a common denominator first. 1/2 + 1/3 = 3/6 + 2/6 = 5/6, not 2/5.", "src": "The Fairness Problem"}, {"s": "Mathematics", "t": "tf", "q": "Fractions and decimals are different things", "a": "They are different representations of the same value. 1/4 = 0.25 = 25%. Understanding this equivalence is essential.", "src": "The Fairness Problem"}, {"s": "Ecology", "t": "tf", "q": "Removing one species only affects the species directly connected to it", "a": "Cascade effects ripple through the entire web. Removing a producer can collapse consumers three or four levels above.", "src": "The Invisible Thread"}, {"s": "Ecology", "t": "tf", "q": "Top predators are the most important species", "a": "Producers are often the most critical because ALL energy enters through them. Remove the grass and everything above it collapses.", "src": "The Invisible Thread"}, {"s": "Ecology", "t": "tf", "q": "More species is always better", "a": "Invasive species can devastate ecosystems. It is the right species in the right balance that matters, not just the total number.", "src": "The Invisible Thread"}, {"s": "Mathematics", "t": "recall", "q": "How many seconds are in one day?", "a": "86,400", "src": "The Million Dollar Question"}, {"s": "Mathematics", "t": "apply", "q": "If you earn $1 per second, how much do you earn in one hour?", "a": "$3,600", "src": "The Million Dollar Question"}, {"s": "Mathematics", "t": "extend", "q": "About how many years is one billion seconds? Show your reasoning.", "a": "About 31.7 years", "src": "The Million Dollar Question"}, {"s": "Mathematics", "t": "tf", "q": "A million is a really big number", "a": "A million seconds is only 11.5 days. A billion seconds is 31 years. The difference between million, billion, and trillion is enormous.", "src": "The Million Dollar Question"}, {"s": "Mathematics", "t": "tf", "q": "You can estimate by guessing", "a": "Good estimation uses calculation with rounded numbers. It is not a guess — it is a calculation with simpler values.", "src": "The Million Dollar Question"}, {"s": "Mathematics", "t": "tf", "q": "Scientific notation is just for scientists", "a": "Scientific notation is for anyone working with very large or very small numbers. It makes comparison possible.", "src": "The Million Dollar Question"}, {"s": "Mathematics", "t": "tf", "q": "If a graph looks dramatic, the change is dramatic", "a": "The visual impression depends on the scale, not just the data. Always check the axis values before drawing conclusions.", "src": "The Misleading Graph"}, {"s": "Mathematics", "t": "tf", "q": "All graphs are honest", "a": "Graphs are created by people who make choices about scale, colour, labels, and time range. Every choice can emphasise or hide information.", "src": "The Misleading Graph"}, {"s": "Mathematics", "t": "recall", "q": "How many blocks in a 5-step staircase?", "a": "15", "src": "The Staircase Problem"}, {"s": "Mathematics", "t": "apply", "q": "Use the formula to find the number of blocks in a 10-step staircase.", "a": "10 × 11 ÷ 2 = 55", "src": "The Staircase Problem"}, {"s": "Mathematics", "t": "extend", "q": "A staircase uses 210 blocks. How many steps does it have?", "a": "20 steps (20 × 21 ÷ 2 = 210)", "src": "The Staircase Problem"}, {"s": "Mathematics", "t": "tf", "q": "The formula is just the pattern of differences", "a": "The differences tell you about the formula but they ARE not the formula. The totals are 1, 3, 6, 10 — these are triangular numbers: n(n+1)/2.", "src": "The Staircase Problem"}, {"s": "Mathematics", "t": "tf", "q": "Checking 5 cases proves a formula", "a": "Verification is not proof. A formula must work for ALL values of n, not just the ones you tested.", "src": "The Staircase Problem"}, {"s": "Mathematics", "t": "tf", "q": "Algebra is about guessing and checking", "a": "Deriving a formula means building it logically from the structure of the problem. Guess-and-check finds the answer but does not explain WHY it works.", "src": "The Staircase Problem"}, {"s": "Physics", "t": "tf", "q": "Sound travels through empty space", "a": "Sound needs a medium — air, water, or solid. In the vacuum of space, there is no sound. This is why the tagline of Alien is scientifically accurate.", "src": "Can You See Sound?"}, {"s": "Physics", "t": "tf", "q": "Louder means higher pitch", "a": "Loudness is amplitude (height of the wave). Pitch is frequency (speed of vibration). They are independent.", "src": "Can You See Sound?"}, {"s": "Mathematics", "t": "tf", "q": "0.999... is close to 1 but not equal", "a": "There is no gap. If two numbers are different, you can always find a number between them. Try to find a number between 0.999... and 1. You cannot. They are the same number.", "src": "0.999... = 1? Prove It."}, {"s": "Mathematics", "t": "tf", "q": "The proof is a trick", "a": "Every step is valid. Let x = 0.999... Then 10x = 9.999... Then 10x - x = 9. So 9x = 9 and x = 1. No trick — just logic.", "src": "0.999... = 1? Prove It."}, {"s": "Mathematics", "t": "tf", "q": "Infinity is not re : "recall", "q": "What is the formula for speed?", "a": "Speed = distance ÷ time", "src": "Motion"}, {"s": "Physics", "t": "recall", "q": "What is the unit of force?", "a": "Newton (N)", "src": "Forces"}, {"s": "Physics", "t": "recall", "q": "What is the formula for density?", "a": "Density = mass ÷ volume", "src": "Matter"}, {"s": "Physics", "t": "recall", "q": "What happens to resistance when you add resistors in series?", "a": "Total resistance increases (R₁ + R₂)", "src": "Circuits"}, {"s": "Physics", "t": "recall", "q": "What is the unit of energy?", "a": "Joule (J)", "src": "Energy"}, {"s": "Biology", "t": "recall", "q": "Name the 7 characteristics of life (MRS GREN)", "a": "Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition", "src": "Living Things"}, {"s": "Biology", "t": "recall", "q": "What is the function of mitochondria?", "a": "Release energy through respiration (the powerhouse of the cell)", "src": "Cells"}, {"s": "Biology", "t": "recall", "q": "What is photosynthesis?", "a": "Plants convert CO₂ + water → glucose + oxygen using light energy", "src": "Plants"}, {"s": "Biology", "t": "recall", "q": "What is osmosis?", "a": "Movement of water from dilute to concentrated solution through a semi-permeable membrane", "src": "Cell Transport"}, {"s": "Biology", "t": "recall", "q": "Name 3 parts of a plant cell not in an animal cell", "a": "Cell wall, chloroplasts, large vacuole", "src": "Cells"}, {"s": "Chemistry", "t": "recall", "q": "What is the pH of a neutral solution?", "a": "7", "src": "Acids & Bases"}, {"s": "Chemistry", "t": "recall", "q": "What is the word equation for photosynthesis?", "a": "carbon dioxide + water → glucose + oxygen", "src": "Reactions"}, {"s": "Chemistry", "t": "recall", "q": "What are the 3 states of matter?", "a": "Solid, liquid, gas", "src": "Particle Theory"}, {"s": "Chemistry", "t": "recall", "q": "What happens to particles when heated?", "a": "They gain energy, move faster, spread apart", "src": "Par var deck = [], current = 0, got = [], missed = [], streak = 0, bestStreak = 0, score = 0, startTime = 0;
var lastSubject = 'all';
var subjectIcons = {
  'Mathematics':'🔢','Biology':'🧬','Chemistry':'⚗️','Physics':'⚡',
  'Earth Science':'🌍','Space Science':'🚀','Ecology':'🌿'
};

// Build topic picker
function buildPicker() {
  var grid = document.getElementById('pickGrid');
  grid.innerHTML = '';
  
  // Count per subject
  var counts = {};
  REVISION_DATA.forEach(function(q) {
    counts[q.s] = (counts[q.s] || 0) + 1;
  });
  
  // All button
  var allBtn = document.createElement('button');
  allBtn.className = 'pick-btn pick-all';
  allBtn.innerHTML = '<span class="pick-icon">🎯</span>All Topics<span class="pick-count">' + REVISION_DATA.length + ' cards</span>';
  allBtn.onclick = function() { startSession('all'); };
  grid.appendChild(allBtn);
  
  // Subject buttons
  Object.keys(counts).sort().forEach(function(subj) {
    var btn = document.createElement('button');
    btn.className = 'pick-btn';
    btn.innerHTML = '<span class="pick-icon">' + (subjectIcons[subj] || '📚') + '</span>' + subj + '<span class="pick-count">' + counts[subj] + ' cards</span>';
    btn.onclick = function() { startSession(subj); };
    grid.appendChild(btn);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function showPicker() { showScreen('pickScreen'); }

function startSession(subject) {
  lastSubject = subject;
  
  // Filter and shuffle
  var pool = subject === 'all' ? REVISION_DATA.slice() : REVISION_DATA.filter(function(q) { return q.s === subject; });
  
  // Shuffle
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  
  // Take up to 15 cards per session
  deck = pool.slice(0, 15);
  current = 0;
  got = [];
  missed = [];
  streak = 0;
  bestStreak = 0;
  score = 0;
  startTime = Date.now();
  
  updateHUD();
  showScreen('sessionScreen');
  showCard();
}

function showCard() {
  if (current >= deck.length) {
    // Check if we need to re-test missed cards
    if (missed.length > 0 && deck.length < 20) {
      // Add missed cards back for another chance
      var retry = missed.slice();
      missed = [];
      for (var i = retry.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = retry[i]; retry[i] = retry[j]; retry[j] = tmp;
      }
      deck = deck.concat(retry);
      showCard();
      return;
    }
    showSummary();
    return;
  }
  
  var q = deck[current];
  var typeLabels = {recall:'Recall',apply:'Apply',extend:'Extend',tf:'True or False',misconception:'True or False'};
  
  document.getElementById('cardType').textContent = typeLabels[q.t] || 'Recall';
  document.getElementById('cardType').className = 'card-type ' + (q.t === 'misconception' ? 'tf' : q.t);
  document.getElementById('cardSource').textContent = q.src;
  document.getElementById('cardQ').textContent = q.q;
  document.getElementById('cardAnswer').classList.remove('show');
  document.getElementById('cardAnswer').textContent = '';
  document.getElementById('assessBtns').style.display = 'none';
  
  // Update progress
  var pct = (current / deck.length) * 100;
  document.getElementById('progFill').style.width = pct + '%';
  
  // Actions depend on type
  var actions = document.getElementById('cardActions');
  actions.innerHTML = '';
  
  if (q.t === 'tf' || q.t === 'misconception') {
    // True/False buttons
    var div = document.createElement('div');
    div.className = 'tf-btns';
    var trueBtn = document.createElement('button');
    trueBtn.className = 'tf-btn';
    trueBtn.textContent = '✓ True';
    trueBtn.onclick = function() { answerTF(true, trueBtn, falseBtn); };
    var falseBtn = document.createElement('button');
    falseBtn.className = 'tf-btn';
    falseBtn.textContent = '✗ False';
    falseBtn.onclick = function() { answerTF(false, trueBtn, falseBtn); };
    div.appendChild(trueBtn);
    div.appendChild(falseBtn);
    actions.appendChild(div);
  } else {
    // Reveal button
    var btn = document.createElement('button');
    btn.className = 'card-reveal-btn';
    btn.textContent = 'Reveal answer';
    btn.onclick = function() { revealAnswer(); };
    actions.appendChild(btn);
  }
}

function answerTF(guessedTrue, trueBtn, falseBtn) {
  var q = deck[current];
  // All misconception/tf questions are FALSE (they're myths)
  var correct = !guessedTrue;
  
  if (correct) {
    if(falseBtn)falseBtn.classList.add('selected-correct');
  } else {
    if(trueBtn)trueBtn.classList.add('selected-wrong');
    if(falseBtn)falseBtn.classList.add('selected-correct');
  }
  
  // Disable buttons
  if(trueBtn)trueBtn.onclick = null;
  if(falseBtn)falseBtn.onclick = null;
  
  // Show answer
  document.getElementById('cardAnswer').textContent = q.a;
  document.getElementById('cardAnswer').classList.add('show');
  
  // Auto-assess
  if (correct) {
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    score += 10;
    got.push(q);
    checkStreak();
  } else {
    streak = 0;
    missed.push(q);
  }
  
  updateHUD();
  
  // Auto-advance after 1.5s
  setTimeout(function() {
    current++;
    showCard();
  }, 1800);
}

function revealAnswer() {
  var q = deck[current];
  document.getElementById('cardAnswer').textContent = q.a;
  document.getElementById('cardAnswer').classList.add('show');
  document.getElementById('cardActions').innerHTML = '';
  document.getElementById('assessBtns').style.display = 'flex';
}

function assess(gotIt) {
  var q = deck[current];
  if (gotIt) {
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    score += 10;
    got.push(q);
    checkStreak();
  } else {
    streak = 0;
    missed.push(q);
  }
  
  updateHUD();
  document.getElementById('assessBtns').style.display = 'none';
  current++;
  showCard();
}

function checkStreak() {
  if (streak >= 3 && streak % 3 === 0) {
    var pop = document.getElementById('streakPop');
    pop.textContent = streak + '🔥';
    pop.classList.add('show');
    setTimeout(function() { pop.classList.remove('show'); pop.classList.add('hide'); }, 800);
    setTimeout(function() { pop.classList.remove('hide'); }, 1200);
  }
}

function updateHUD() {
  document.getElementById('hStreak').textContent = streak;
  document.getElementById('hScore').textContent = score;
}

function showSummary() {
  showScreen('summaryScreen');
  document.getElementById('progFill').style.width = '100%';
  
  var total = got.length + missed.length;
  var pct = total > 0 ? Math.round(got.length / total * 100) : 0;
  var elapsed = Math.round((Date.now() - startTime) / 1000);
  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;
  
  document.getElementById('sumScore').textContent = pct + '%';
  document.getElementById('sumGot').textContent = got.length;
  document.getElementById('sumNot').textContent = missed.length;
  document.getElementById('sumTime').textContent = mins > 0 ? mins + 'm ' + secs + 's' : secs + 's';
  
  var label = pct >= 90 ? '🌟 Outstanding!' :
              pct >= 70 ? '💪 Strong revision session' :
              pct >= 50 ? '📚 Keep practising — you\'re getting there' :
              '🔄 Try again — focus on the review cards below';
  document.getElementById('sumLabel').textContent = label;
  
  // Show missed cards for review
  var reviewEl = document.getElementById('reviewList');
  reviewEl.innerHTML = '';
  if (missed.length > 0) {
    reviewEl.innerHTML = '<h3>Review these ' + missed.length + ' cards:</h3>';
    missed.forEach(function(q) {
      reviewEl.innerHTML += '<div class="review-item"><div class="ri-q">' + q.q + '</div><div class="ri-a">' + q.a + '</div></div>';
    });
  }
}

// Init
buildPicker();
</script>
</body>
</html>
