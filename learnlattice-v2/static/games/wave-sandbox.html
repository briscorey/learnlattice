<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wave Sandbox — LearnLattice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020617;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.hdr{padding:12px 20px;background:#0f172a;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.2rem;background:linear-gradient(135deg,#06b6d4,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.ctrls{display:flex;gap:16px;flex-wrap:wrap;padding:12px 20px;background:#0f172a;border-bottom:1px solid #1e293b}
.ctrl{display:flex;flex-direction:column;gap:4px}
.ctrl label{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:#64748b}
.ctrl input[type=range]{width:140px;accent-color:#06b6d4;height:6px}
.ctrl .val{font-size:.8rem;color:#06b6d4;font-weight:600;text-align:center}
.mode-btns{display:flex;gap:4px;align-items:flex-end}
.mode-btn{padding:6px 12px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.72rem;font-family:inherit;transition:all .15s}
.mode-btn.on{background:#06b6d4;border-color:#06b6d4;color:#020617}
canvas{touch-action:none;flex:1;display:block}
.info{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:8px;padding:8px 16px;font-size:.72rem;color:#94a3b8;backdrop-filter:blur(8px)}
.readings{position:absolute;top:12px;right:12px;background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:9px;padding:10px 14px;font-size:.75rem}
.readings div{margin-bottom:4px;color:#64748b}.readings span{color:#06b6d4;font-weight:600}
.cvs-wrap{flex:1;position:relative}
</style><style id="embed-check">.embed-mode .hdr,.embed-mode .header,.embed-mode>div:first-child:not(.wrap):not(.main):not(.game):not(.lab):not(.arena){display:none!important}.embed-mode{padding-top:0!important}</style>
<script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed-mode');</script>
</head><body>
<div class="hdr"><h1>🌊 Wave Sandbox</h1><a href="/games/" style="font-size:.72rem;color:#94a3b8;text-decoration:none;opacity:.7;margin-left:8px">← All Games</a></div>
<div class="ctrls">
  <div class="ctrl"><label>Frequency 1</label><input type="range" id="f1" min="0.5" max="5" step="0.1" value="1" oninput="updateVal()"><div class="val" id="f1v">1.0 Hz</div></div>
  <div class="ctrl"><label>Amplitude 1</label><input type="range" id="a1" min="10" max="100" step="1" value="60" oninput="updateVal()"><div class="val" id="a1v">60</div></div>
  <div class="ctrl"><label>Frequency 2</label><input type="range" id="f2" min="0.5" max="5" step="0.1" value="1.5" oninput="updateVal()"><div class="val" id="f2v">1.5 Hz</div></div>
  <div class="ctrl"><label>Amplitude 2</label><input type="range" id="a2" min="0" max="100" step="1" value="40" oninput="updateVal()"><div class="val" id="a2v">40</div></div>
  <div class="mode-btns">
    <button class="mode-btn on" onclick="setMode(this,'both')">Both</button>
    <button class="mode-btn" onclick="setMode(this,'wave1')">Wave 1</button>
    <button class="mode-btn" onclick="setMode(this,'wave2')">Wave 2</button>
    <button class="mode-btn" onclick="setMode(this,'sum')">Combined</button>
  </div>
</div>
<div class="cvs-wrap">
  <canvas id="C"></canvas>
  <div class="readings">
    <div>Wave 1: <span id="r1"></span></div>
    <div>Wave 2: <span id="r2"></span></div>
    <div>Combined: <span id="rc"></span></div>
  </div>
  <div class="info" id="info">Adjust frequency and amplitude to explore wave behaviour</div>
</div>
<script>
var C=document.getElementById('C'),X=C.getContext('2d'),W,H;
var mode='both',t=0;
function resize(){var r=C.parentElement.getBoundingClientRect();var dpr=devicePixelRatio||1;W=r.width;H=r.height;C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize);resize();

function val(id){return parseFloat(document.getElementById(id).value);}
function updateVal(){
  document.getElementById('f1v').textContent=val('f1').toFixed(1)+' Hz';
  document.getElementById('a1v').textContent=Math.round(val('a1'));
  document.getElementById('f2v').textContent=val('f2').toFixed(1)+' Hz';
  document.getElementById('a2v').textContent=Math.round(val('a2'));
}

function setMode(btn,m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  var info=document.getElementById('info');
  if(m==='sum'){
    var f1=val('f1'),f2=val('f2');
    if(Math.abs(f1-f2)<0.2) info.textContent='Similar frequencies → beats pattern (constructive + destructive interference)';
    else if(f2===f1*2) info.textContent='Frequency 2 is double frequency 1 → octave relationship (harmonics)';
    else info.textContent='Combined wave = Wave 1 + Wave 2 (superposition principle)';
  } else info.textContent='Adjust frequency and amplitude to explore wave behaviour';
}

function wave(x,freq,amp,phase){return amp*Math.sin(2*Math.PI*freq*(x/W*4-t)+phase);}

function draw(){
  t+=0.015;
  X.clearRect(0,0,W,H);
  var cy=H/2,f1=val('f1'),a1=val('a1'),f2=val('f2'),a2=val('a2');

  // Grid
  X.strokeStyle='#1e293b';X.lineWidth=.5;
  X.beginPath();X.moveTo(0,cy);X.lineTo(W,cy);X.stroke();
  for(var g=-3;g<=3;g++){X.beginPath();X.moveTo(0,cy+g*40);X.lineTo(W,cy+g*40);X.stroke();}

  // Axis labels
  X.fillStyle='#334155';X.font='10px sans-serif';X.textAlign='right';
  for(var g=-2;g<=2;g++){if(g!==0)X.fillText(g>0?'+'+g:''+g,W-8,cy-g*40+4);}

  function drawWave(freq,amp,color,alpha){
    X.beginPath();X.strokeStyle=color;X.lineWidth=2.5;X.globalAlpha=alpha;
    for(var x=0;x<W;x++){
      var y=cy-wave(x,freq,amp,0);
      x===0?X.moveTo(x,y):X.lineTo(x,y);
    }
    X.stroke();X.globalAlpha=1;
    // Glow
    X.beginPath();X.strokeStyle=color;X.lineWidth=6;X.globalAlpha=alpha*0.15;
    for(var x=0;x<W;x++){var y=cy-wave(x,freq,amp,0);x===0?X.moveTo(x,y):X.lineTo(x,y);}
    X.stroke();X.globalAlpha=1;
  }

  function drawSum(f1,a1,f2,a2,color){
    X.beginPath();X.strokeStyle=color;X.lineWidth=3;
    for(var x=0;x<W;x++){
      var y=cy-(wave(x,f1,a1,0)+wave(x,f2,a2,0));
      x===0?X.moveTo(x,y):X.lineTo(x,y);
    }
    X.stroke();
    X.beginPath();X.strokeStyle=color;X.lineWidth=8;X.globalAlpha=0.1;
    for(var x=0;x<W;x++){var y=cy-(wave(x,f1,a1,0)+wave(x,f2,a2,0));x===0?X.moveTo(x,y):X.lineTo(x,y);}
    X.stroke();X.globalAlpha=1;
  }

  if(mode==='both'||mode==='wave1') drawWave(f1,a1,'#06b6d4',mode==='both'?0.7:1);
  if(mode==='both'||mode==='wave2') drawWave(f2,a2,'#f59e0b',mode==='both'?0.7:1);
  if(mode==='both'||mode==='sum') drawSum(f1,a1,f2,a2,'#a78bfa');

  // Readings
  document.getElementById('r1').textContent=f1.toFixed(1)+'Hz, A='+Math.round(a1)+', λ='+Math.round(W/(f1*4))+'px';
  document.getElementById('r2').textContent=f2.toFixed(1)+'Hz, A='+Math.round(a2)+', λ='+Math.round(W/(f2*4))+'px';
  document.getElementById('rc').textContent='max A='+(a1+a2)+' | beat='+(Math.abs(f1-f2)).toFixed(1)+'Hz';
  
  // Dynamic info
  var info=document.getElementById('info');
  if(mode==='sum'||mode==='both'){
    var diff=Math.abs(f1-f2);
    if(diff<0.3&&a2>0) info.textContent='Frequencies are close → you can see BEATS (the amplitude rises and falls)';
    else if(Math.abs(f2-f1*2)<0.2&&a2>0) info.textContent='Frequency 2 is double → this is a HARMONIC (octave relationship)';
    else if(a2===0) info.textContent='Only Wave 1 is active. Increase Amplitude 2 to see superposition.';
    else info.textContent='Two waves combine by SUPERPOSITION — add their values at each point';
  }

  requestAnimationFrame(draw);
}
draw();
</script></body></html>
