<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Density Dash. LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#020617;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh}.hdr{padding:10px 20px;background:rgba(6,182,212,.06);border-bottom:1px solid rgba(6,182,212,.15);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#22d3ee;font-weight:700}.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#22d3ee}.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.2)}.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-bottom:4px}.pg-bar.done{background:#06b6d4}.pg-bar.active{background:#f59e0b;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pg-label{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}.pg.done .pg-label{color:#06b6d4}.pg.active .pg-label{color:#f59e0b}.game{max-width:640px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#06b6d4;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:700;margin-bottom:8px}.s-desc{font-size:.85rem;color:#94a3b8;margin-bottom:4px}.s-ican{font-size:.78rem;color:#67e8f9;font-style:italic;margin-bottom:20px}.btn{padding:12px 28px;border-radius:10px;border:1px solid rgba(6,182,212,.3);background:rgba(6,182,212,.1);color:#67e8f9;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(6,182,212,.2);border-color:#06b6d4;transform:translateY(-2px)}.btn-go{background:#06b6d4;color:#020617;border-color:#06b6d4}.btn-go:hover{background:#0891b2}.q{animation:fadeIn .4s}.q-card{padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:16px}.q-num{font-size:.65rem;color:#06b6d4;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.q-text{font-size:1rem;font-weight:600;color:#fff;margin-bottom:16px;line-height:1.5}.q-data{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;text-align:center}.q-data-item{padding:12px;background:rgba(6,182,212,.06);border:1px solid rgba(6,182,212,.12);border-radius:10px}.q-data-label{font-size:.62rem;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.q-data-val{font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:#22d3ee;font-weight:600}.q-object{text-align:center;font-size:2.5rem;margin-bottom:8px}.q-obj-name{text-align:center;font-size:.85rem;color:#94a3b8;margin-bottom:16px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts-1{grid-template-columns:1fr}.opt{padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-size:.88rem;cursor:pointer;transition:all .2s;text-align:center;font-family:'DM Sans',sans-serif;font-weight:500}.opt:hover:not(.locked){border-color:rgba(6,182,212,.4);background:rgba(6,182,212,.06);transform:translateY(-2px)}.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-no{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#06b6d4;font-weight:700}.r-label{font-size:1.1rem;font-weight:700;margin:6px 0}.r-detail{font-size:.85rem;color:#94a3b8;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}.sd{text-align:center;padding:28px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}</style><style id="ec">.embed-mode .hdr{display:none!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>⚖️ Density Dash</h1><span class="pts" id="pts">0 pts</span></div><div class="progress" id="prog"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,correct=0,total=0,sc=0;const STG=[{name:"Float or Sink?",desc:"Predict using density",ican:"I can predict if an object floats or sinks by comparing its density to water.",qs:6},{name:"Calculate",desc:"Use D = M ÷ V",ican:"I can calculate density from mass and volume.",qs:5},{name:"Rearrange",desc:"Find mass or volume",ican:"I can rearrange D = M/V to find mass or volume.",qs:5},{name:"Design",desc:"Apply density reasoning",ican:"I can solve real-world density problems.",qs:5}];function ri(e,t){return e+Math.floor(Math.random()*(t-e+1))}function sh(e){for(let t=e.length-1;t>0;t--){const s=Math.floor(Math.random()*(t+1));[e[t],e[s]]=[e[s],e[t]]}return e}function gen0(){return sh([{icon:"🪨",name:"Rock (density ≈ 2.7 g/cm³)",q:"A rock is placed in water. Will it float or sink?",opts:["Sink. denser than water","Float. lighter than water","Stay in the middle","Dissolve"],correct:0,hint:"Water density = 1 g/cm³. Rock = 2.7 g/cm³. Is 2.7 > 1?",why:"Rock (2.7 g/cm³) > water (1 g/cm³), so it sinks. Objects denser than water always sink."},{icon:"🪵",name:"Wood (density ≈ 0.6 g/cm³)",q:"A block of wood is placed in water.",opts:["Float. less dense than water","Sink. heavier than water","It depends on size","Stay at the bottom"],correct:0,hint:"Wood ≈ 0.6, water = 1. Which is bigger?",why:"Wood (0.6) < water (1), so it floats. Less dense = floats, regardless of size."},{icon:"🧊",name:"Ice (density ≈ 0.92 g/cm³)",q:"Ice is placed in water. What happens?",opts:["Floats (just barely. most submerged)","Sinks","Stays exactly in the middle","Melts instantly"],correct:0,hint:"Ice = 0.92, water = 1. Very close but ice is slightly less dense.",why:"Ice (0.92) < water (1) but only just. That's why ~92% of an iceberg is underwater!"},{icon:"🫧",name:"Cooking oil (density ≈ 0.9 g/cm³)",q:"You pour oil into a glass of water.",opts:["Oil floats on top","Oil sinks to bottom","They mix evenly","Oil stays in middle"],correct:0,hint:"Oil ≈ 0.9, water = 1. Less dense liquids sit on top.",why:"Oil (0.9) < water (1), so oil floats on top. That's why oil and water separate!"},{icon:"🪙",name:"Gold coin (density ≈ 19.3 g/cm³)",q:"A gold coin in water will...",opts:["Sink quickly. very dense","Float. gold is light","Dissolve","Float then slowly sink"],correct:0,hint:"Gold = 19.3 g/cm³. That's nearly 20× denser than water!",why:"Gold (19.3) >> water (1). It sinks rapidly. Gold is one of the densest common elements."},{icon:"⚽",name:"Beach ball (very low density)",q:"A beach ball is pushed underwater then released.",opts:["Shoots up to surface. much less dense","Stays underwater","Slowly sinks","Pops"],correct:0,hint:"A beach ball is mostly air. Air density ≈ 0.001 g/cm³.",why:"The ball is mostly air (≈ 0.001 g/cm³), far less than water. The buoyant force pushes it up rapidly."},{icon:"🥚",name:"Egg in fresh water vs salt water",q:"An egg sinks in fresh water but floats in very salty water. Why?",opts:["Salt water is denser than the egg","The egg gets lighter in salt","Salt makes the egg float magically","The egg absorbs salt"],correct:0,hint:"Adding salt increases water's density. At some point, water becomes denser than the egg.",why:"Fresh water (1.0) < egg (1.03) → sinks. Salt water (1.1) > egg (1.03) → floats. Density of the liquid matters!"}]).slice(0,STG[0].qs)}function gen1(){const e=[];for(let t=0;t<STG[1].qs;t++){const t=10*ri(2,20),s=10*ri(2,10),a=(t/s).toFixed(1),o=sh([a+" g/cm³",(t/(s+10)).toFixed(1)+" g/cm³",(t*s/100).toFixed(1)+" g/cm³",((t+s)/10).toFixed(1)+" g/cm³"]);e.push({mass:t,volume:s,q:`An object has mass <strong>${t}g</strong> and volume <strong>${s}cm³</strong>. What is its density?`,opts:o,correct:o.indexOf(a+" g/cm³"),hint:`Density = Mass ÷ Volume = ${t} ÷ ${s}.`,why:`D = M ÷ V = ${t} ÷ ${s} = ${a} g/cm³.`})}return e}function gen2(){return sh([{q:"Density = 8 g/cm³, Volume = 5 cm³.\nWhat is the mass?",opts:["40 g","1.6 g","13 g","3 g"],correct:0,hint:"M = D × V. Multiply density by volume.",why:"M = D × V = 8 × 5 = 40g. Rearranging: if D = M/V, then M = D×V."},{q:"Mass = 240g, Density = 3 g/cm³.\nWhat is the volume?",opts:["80 cm³","720 cm³","60 cm³","237 cm³"],correct:0,hint:"V = M ÷ D. Divide mass by density.",why:"V = M ÷ D = 240 ÷ 3 = 80 cm³. Rearranging: V = M/D."},{q:"Density = 2.5 g/cm³, Mass = 100g.\nVolume = ?",opts:["40 cm³","250 cm³","25 cm³","50 cm³"],correct:0,hint:"V = M ÷ D = 100 ÷ 2.5.",why:"V = 100 ÷ 2.5 = 40 cm³."},{q:"Volume = 200 cm³, Density = 0.8 g/cm³.\nMass = ?",opts:["160 g","250 g","200 g","80 g"],correct:0,hint:"M = D × V = 0.8 × 200.",why:"M = 0.8 × 200 = 160g."},{q:"An object has mass 450g and density 9 g/cm³.\nWhat volume of water would it displace?",opts:["50 cm³","4050 cm³","441 cm³","9 cm³"],correct:0,hint:"Volume displaced = volume of object = M ÷ D.",why:"V = 450 ÷ 9 = 50 cm³. The object displaces its own volume of water."},{q:"A cube has sides 4cm and mass 320g.\nWhat is its density?",opts:["5 g/cm³","80 g/cm³","20 g/cm³","1.25 g/cm³"],correct:0,hint:"Volume of cube = 4³ = 64 cm³. Then D = 320 ÷ 64.",why:"V = 4×4×4 = 64 cm³. D = 320÷64 = 5 g/cm³."},{q:"A liquid has mass 360g and volume 400cm³. What is its density?",opts:["0.9 g/cm³","0.8 g/cm³","1.1 g/cm³","3.6 g/cm³"],correct:0,hint:"D = M÷V = 360÷400",why:"360÷400 = 0.9 g/cm³. Less than 1, so it would float on water."},{q:"Steel has density 7.8 g/cm³. What is the mass of 15cm³?",opts:["117 g","78 g","156 g","97.5 g"],correct:0,hint:"M = D×V = 7.8×15",why:"7.8 × 15 = 117g."},{q:"A rock has mass 450g and density 2.5 g/cm³. What is its volume?",opts:["180 cm³","225 cm³","112.5 cm³","200 cm³"],correct:0,hint:"V = M÷D = 450÷2.5",why:"450÷2.5 = 180cm³."},{q:"Honey density = 1.4 g/cm³. Mass of 200cm³?",opts:["280 g","240 g","300 g","140 g"],correct:0,hint:"M = D×V = 1.4×200",why:"1.4 × 200 = 280g."},{q:"A block: mass 600g, volume 750cm³. Density?",opts:["0.8 g/cm³","1.2 g/cm³","0.6 g/cm³","0.75 g/cm³"],correct:0,hint:"D = M÷V = 600÷750",why:"600÷750 = 0.8 g/cm³. This would float on water (< 1)."}]).slice(0,STG[2].qs)}function gen3(){return sh([{q:"A ship is made of steel (density 7.8 g/cm³) but floats. How?",opts:["The hull is hollow. overall density < water","Steel becomes lighter in water","Salt water is denser than steel","Ships use anti-gravity"],correct:0,hint:"Think about the OVERALL density, not just the material. The ship is mostly air inside.",why:"The hull encloses a huge volume of air. Overall density = total mass ÷ total volume < 1 g/cm³. Shape matters!"},{q:"You have a mystery liquid (125g, 100 cm³). It's poured into water. What happens?",opts:["It sinks below water (density 1.25 > 1)","It floats on water","They mix completely","It evaporates"],correct:0,hint:"Calculate: D = 125÷100 = 1.25 g/cm³. Compare to water (1.0).",why:"D = 1.25 g/cm³ > water (1.0). The liquid sinks below the water layer."},{q:"Hot air balloons rise because heated air...",opts:["Is less dense than cool air","Is heavier than cool air","Has more particles","Changes colour"],correct:0,hint:"Heating air makes particles spread out → same mass, larger volume → density?",why:"Hot air expands (more volume, same mass) → lower density → less dense than surrounding cool air → rises. D = M/V."},{q:'A gold bar has mass 1000g and volume 51.8 cm³. A "gold" bar is 1000g but 85 cm³. Is it real?',opts:["Fake. density too low for gold","Real. same mass means same gold","Need more tests","Impossible to tell"],correct:0,hint:"Real gold: D = 1000÷51.8 ≈ 19.3. Suspect: D = 1000÷85 ≈ 11.8. Compare.",why:"Real: 19.3 g/cm³. Suspect: 11.8 g/cm³. Much too low for gold. It's fake! Density is used to identify materials."},{q:"A submarine dives by filling ballast tanks with water. This works because...",opts:["Adding water increases its overall density above 1","Water makes it heavier on one side","The engines push it down","Water cools the submarine"],correct:0,hint:"Empty tanks = air (low density). Full tanks = water (density 1). Overall density changes.",why:"Empty tanks: overall density < 1 → floats. Full tanks: overall density > 1 → sinks. Submarines control their density!"},{q:"A boat must carry 500kg cargo. Hull volume = 800L. Will it float if empty boat mass = 200kg?",opts:["Yes. total density < 1 g/cm³","No. too heavy","Only in salt water","Depends on shape"],correct:0,hint:"Total mass = 700kg = 700,000g. Volume = 800,000cm³. D = M/V.",why:"D = 700,000÷800,000 = 0.875 g/cm³. Less than water (1), so it floats."},{q:"You need a sinker for fishing. Which material?",opts:["Lead (11.3 g/cm³)","Cork (0.24 g/cm³)","Wood (0.6 g/cm³)","Styrofoam (0.03 g/cm³)"],correct:0,hint:"A sinker needs to sink. which has the highest density?",why:"Lead at 11.3 g/cm³ is much denser than water. It sinks quickly."},{q:"Ice density = 0.92 g/cm³. What fraction of an iceberg is underwater?",opts:["About 92%","About 50%","About 80%","About 100%"],correct:0,hint:"The fraction submerged = ice density ÷ water density.",why:"0.92÷1.0 = 0.92 = 92%. Only 8% is above water!"},{q:"Salt water density ≈ 1.03 g/cm³. An object with density 1.01 g/cm³...",opts:["Floats in salt water, sinks in fresh","Sinks in both","Floats in both","Sinks in salt, floats in fresh"],correct:0,hint:"Compare: 1.01 < 1.03 (salt) but 1.01 > 1.0 (fresh).",why:"1.01 < 1.03 so floats in salt water. 1.01 > 1.0 so sinks in fresh water."},{q:"A hollow ball (mass 50g, volume 200cm³) vs solid ball (mass 50g, volume 30cm³). Which floats?",opts:["Hollow ball floats, solid sinks","Both float","Both sink","Solid floats, hollow sinks"],correct:0,hint:"Calculate each density: D = M/V.",why:"Hollow: 50/200=0.25 (floats). Solid: 50/30=1.67 (sinks)."}]).slice(0,STG[3].qs)}const generators=[gen0,gen1,gen2,gen3];let questions=[];function renderProg(){document.getElementById("prog").innerHTML=STG.map((e,t)=>`<div class="pg ${t<stage?"done":t===stage?"active":""}"><div class="pg-bar ${t<stage?"done":t===stage?"active":""}"></div><span class="pg-label">${e.name}</span></div>`).join("")}function showIntro(){sc=0,questions=generators[stage](),qIdx=0,document.getElementById("game").innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STG.length}</div><div class="s-name">${STG[stage].name}</div><div class="s-desc">${STG[stage].desc}</div><div class="s-ican">"${STG[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`,renderProg()}function showQ(){if(qIdx>=questions.length)return void showSD();const e=questions[qIdx];let t=`<div class="q"><div class="q-card"><div class="q-num">Q${qIdx+1} of ${questions.length}</div>`;e.icon&&(t+=`<div class="q-object">${e.icon}</div><div class="q-obj-name">${e.name||""}</div>`),e.mass&&(t+=`<div class="q-data"><div class="q-data-item"><div class="q-data-label">Mass</div><div class="q-data-val">${e.mass}g</div></div><div class="q-data-item"><div class="q-data-label">Volume</div><div class="q-data-val">${e.volume}cm³</div></div><div class="q-data-item"><div class="q-data-label">Density</div><div class="q-data-val">?</div></div></div>`),t+=`<div class="q-text">${e.q.replace(/\n/g,"<br>")}</div><div class="opts ${e.opts.some(e=>e.length>30)?"opts-1":""}">${e.opts.map((e,t)=>`<button class="opt" onclick="check(${t})" id="o${t}">${e}</button>`).join("")}</div></div><div id="fb"></div><div class="next" id="nx"></div></div>`,document.getElementById("game").innerHTML=t}function check(e){const t=questions[qIdx];total++,document.querySelectorAll(".opt").forEach(e=>e.classList.add("locked")),e===t.correct?(document.getElementById("o"+e).classList.add("correct"),correct++,sc++,pts+=10,document.getElementById("pts").textContent=pts+" pts",document.getElementById("fb").innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${t.why}</div>`):(document.getElementById("o"+e).classList.add("wrong"),document.getElementById("o"+t.correct).classList.add("correct"),document.getElementById("fb").innerHTML=`<div class="fb fb-no"><strong>💡 Hint:</strong>${t.hint}</div>`),document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()">Next →</button>'}function showSD(){const e=Math.round(sc/questions.length*100),t=e>=80?"⭐⭐⭐":e>=60?"⭐⭐":"⭐";stage<STG.length-1?document.getElementById("game").innerHTML=`<div class="sd"><div class="sd-stars">${t}</div><div class="s-name">${STG[stage].name} Complete!</div><p style="color:#94a3b8;margin:8px 0">${sc}/${questions.length}</p><button class="btn btn-go" onclick="stage++;showIntro()">Next →</button></div>`:showResults()}function showResults(){const e=Math.round(correct/total*100);let t="🏆 Density Expert!",s="You understand density, can calculate it, and apply it to real situations.";e<50?(t="⚖️ Keep measuring!",s="Review D = M/V and practice the triangle method."):e<75&&(t="⚖️ Getting denser!",s="Good grasp of basics. Work on rearranging the formula."),document.getElementById("game").innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${t}</div><div class="r-detail">${s}<br>Score: ${pts} pts</div><div class="r-transfer">🌍 <strong>Density in life:</strong> Why icebergs float (barely), why hot air balloons rise, why oil sits on water, how submarines dive, and how scientists detect fake gold. The D=M/V triangle is one of the most useful formulas in science.</div><div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`,renderProg()}showIntro()</script></body></html>
