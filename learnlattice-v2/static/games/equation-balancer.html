<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equation Balancer — LearnLattice</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Outfit', system-ui, sans-serif; background: #0a0f1a; color: #e0e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.game { max-width: 720px; width: 100%; }
.header { text-align: center; margin-bottom: 28px; }
.header h1 { font-family: 'DM Serif Display', Georgia, serif; font-size: 1.8rem; color: #14b8a6; margin-bottom: 4px; }
.header p { font-size: 0.85rem; color: rgba(255,255,255,0.4); }

.score-bar { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; font-size: 0.82rem; color: rgba(255,255,255,0.5); }
.score-bar span strong { color: #14b8a6; font-size: 1.1rem; }

.equation-display { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 32px 24px; margin-bottom: 24px; text-align: center; }
.equation { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 1.4rem; }
.term { display: flex; align-items: center; gap: 4px; }
.coeff-btn { width: 44px; height: 44px; border-radius: 10px; border: 2px solid rgba(20,184,166,0.4); background: rgba(20,184,166,0.1); color: #14b8a6; font-size: 1.3rem; font-weight: 700; font-family: 'Outfit', sans-serif; cursor: pointer; transition: all 0.15s; user-select: none; }
.coeff-btn:hover { background: rgba(20,184,166,0.2); border-color: #14b8a6; transform: scale(1.08); }
.coeff-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.2); color: #22c55e; }
.formula { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; }
.formula sub { font-size: 0.75em; }
.arrow { color: rgba(255,255,255,0.3); font-size: 1.3rem; margin: 0 8px; }
.plus { color: rgba(255,255,255,0.3); margin: 0 4px; }

.atom-count { margin-top: 20px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.atom-pill { padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; border: 1px solid; }
.atom-pill.balanced { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.3); color: #22c55e; }
.atom-pill.unbalanced { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.3); color: #f59e0b; }

.controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
button.action { padding: 10px 24px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.15s; }
.btn-check { background: #0D9488; color: #fff; }
.btn-check:hover { background: #0a7c72; }
.btn-next { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #e0e8f0; }
.btn-next:hover { background: rgba(255,255,255,0.12); }
.btn-hint { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: #f59e0b; }

.feedback { text-align: center; min-height: 36px; margin-bottom: 16px; font-size: 0.95rem; }
.feedback.success { color: #22c55e; }
.feedback.wrong { color: #fb7185; }
.feedback.hint { color: #f59e0b; font-size: 0.85rem; }

.level-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 16px; }
.level-easy { background: rgba(34,197,94,0.15); color: #22c55e; }
.level-medium { background: rgba(245,158,11,0.15); color: #f59e0b; }
.level-hard { background: rgba(225,29,72,0.15); color: #fb7185; }

@media (max-width: 500px) { .equation { font-size: 1.1rem; } .coeff-btn { width: 38px; height: 38px; font-size: 1.1rem; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="embed-check">.embed-mode .hdr,.embed-mode .header,.embed-mode>div:first-child:not(.wrap):not(.main):not(.game):not(.lab):not(.arena){display:none!important}.embed-mode{padding-top:0!important}</style>
<script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed-mode');</script>
</head>
<body>
<div class="game">
  <div class="header">
    <h1>Equation Balancer</h1><a href="/games/" style="font-size:.72rem;color:#94a3b8;text-decoration:none;opacity:.7;margin-left:8px">← All Games</a>
    <p>Click the numbers to balance each chemical equation</p>
  </div>
  <div class="score-bar">
    <span>Streak: <strong id="streak">0</strong></span>
    <span>Solved: <strong id="solved">0</strong></span>
    <span id="levelBadge"></span>
  </div>
  <div class="equation-display">
    <div class="equation" id="equation"></div>
    <div class="atom-count" id="atomCount"></div>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="action btn-hint" id="hintBtn">Hint</button>
    <button class="action btn-check" id="checkBtn">Check</button>
    <button class="action btn-next" id="nextBtn">Skip →</button>
  </div>
</div>

<script>
(function() {
  var equations = [
    // Easy
    { reactants: [{f:'H₂',atoms:{H:2}},{f:'O₂',atoms:{O:2}}], products: [{f:'H₂O',atoms:{H:2,O:1}}], answer: [2,1,2], level:'easy' },
    { reactants: [{f:'N₂',atoms:{N:2}},{f:'H₂',atoms:{H:2}}], products: [{f:'NH₃',atoms:{N:1,H:3}}], answer: [1,3,2], level:'easy' },
    { reactants: [{f:'C',atoms:{C:1}},{f:'O₂',atoms:{O:2}}], products: [{f:'CO₂',atoms:{C:1,O:2}}], answer: [1,1,1], level:'easy' },
    { reactants: [{f:'Na',atoms:{Na:1}},{f:'Cl₂',atoms:{Cl:2}}], products: [{f:'NaCl',atoms:{Na:1,Cl:1}}], answer: [2,1,2], level:'easy' },
    { reactants: [{f:'Mg',atoms:{Mg:1}},{f:'O₂',atoms:{O:2}}], products: [{f:'MgO',atoms:{Mg:1,O:1}}], answer: [2,1,2], level:'easy' },
    // Medium
    { reactants: [{f:'Fe',atoms:{Fe:1}},{f:'O₂',atoms:{O:2}}], products: [{f:'Fe₂O₃',atoms:{Fe:2,O:3}}], answer: [4,3,2], level:'medium' },
    { reactants: [{f:'CH₄',atoms:{C:1,H:4}},{f:'O₂',atoms:{O:2}}], products: [{f:'CO₂',atoms:{C:1,O:2}},{f:'H₂O',atoms:{H:2,O:1}}], answer: [1,2,1,2], level:'medium' },
    { reactants: [{f:'Al',atoms:{Al:1}},{f:'HCl',atoms:{H:1,Cl:1}}], products: [{f:'AlCl₃',atoms:{Al:1,Cl:3}},{f:'H₂',atoms:{H:2}}], answer: [2,6,2,3], level:'medium' },
    // Hard
    { reactants: [{f:'C₂H₆',atoms:{C:2,H:6}},{f:'O₂',atoms:{O:2}}], products: [{f:'CO₂',atoms:{C:1,O:2}},{f:'H₂O',atoms:{H:2,O:1}}], answer: [2,7,4,6], level:'hard' },
    { reactants: [{f:'Fe₂O₃',atoms:{Fe:2,O:3}},{f:'C',atoms:{C:1}}], products: [{f:'Fe',atoms:{Fe:1}},{f:'CO₂',atoms:{C:1,O:2}}], answer: [2,3,4,3], level:'hard' },
  ];

  var current = 0;
  var coeffs = [];
  var streak = 0;
  var solved = 0;
  var order = [];

  function shuffle() {
    order = equations.map(function(_,i){return i;});
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
  }

  function getEq() { return equations[order[current % order.length]]; }

  function renderEquation() {
    var eq = getEq();
    var numTerms = eq.reactants.length + eq.products.length;
    coeffs = new Array(numTerms).fill(1);

    var html = '';
    var idx = 0;
    eq.reactants.forEach(function(r, i) {
      if (i > 0) html += '<span class="plus">+</span>';
      html += '<div class="term"><button class="coeff-btn" data-idx="' + idx + '">' + coeffs[idx] + '</button><span class="formula">' + r.f + '</span></div>';
      idx++;
    });
    html += '<span class="arrow">→</span>';
    eq.products.forEach(function(p, i) {
      if (i > 0) html += '<span class="plus">+</span>';
      html += '<div class="term"><button class="coeff-btn" data-idx="' + idx + '">' + coeffs[idx] + '</button><span class="formula">' + p.f + '</span></div>';
      idx++;
    });

    document.getElementById('equation').innerHTML = html;
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';

    var badge = eq.level === 'easy' ? '<span class="level-badge level-easy">Easy</span>' :
                eq.level === 'medium' ? '<span class="level-badge level-medium">Medium</span>' :
                '<span class="level-badge level-hard">Hard</span>';
    document.getElementById('levelBadge').innerHTML = badge;

    // Add click handlers
    document.querySelectorAll('.coeff-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        var i = parseInt(this.dataset.idx);
        coeffs[i] = (coeffs[i] % 9) + 1; // cycle 1-9
        this.textContent = coeffs[i];
        updateAtomCounts();
      });
      btn.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        var i = parseInt(this.dataset.idx);
        coeffs[i] = coeffs[i] <= 1 ? 9 : coeffs[i] - 1;
        this.textContent = coeffs[i];
        updateAtomCounts();
      });
    });
    updateAtomCounts();
  }

  function getAtomCounts() {
    var eq = getEq();
    var left = {}, right = {};
    var idx = 0;

    eq.reactants.forEach(function(r) {
      for (var atom in r.atoms) {
        left[atom] = (left[atom] || 0) + r.atoms[atom] * coeffs[idx];
      }
      idx++;
    });
    eq.products.forEach(function(p) {
      for (var atom in p.atoms) {
        right[atom] = (right[atom] || 0) + p.atoms[atom] * coeffs[idx];
      }
      idx++;
    });
    return { left: left, right: right };
  }

  function updateAtomCounts() {
    var counts = getAtomCounts();
    var allAtoms = Object.keys(Object.assign({}, counts.left, counts.right));
    document.getElementById('atomCount').innerHTML = allAtoms.map(function(a) {
      var l = counts.left[a] || 0;
      var r = counts.right[a] || 0;
      var balanced = l === r;
      return '<span class="atom-pill ' + (balanced ? 'balanced' : 'unbalanced') + '">' +
        a + ': ' + l + ' → ' + r +
        (balanced ? ' ✓' : '') +
      '</span>';
    }).join('');
  }

  function checkAnswer() {
    var counts = getAtomCounts();
    var allAtoms = Object.keys(Object.assign({}, counts.left, counts.right));
    var allBalanced = allAtoms.every(function(a) {
      return (counts.left[a] || 0) === (counts.right[a] || 0);
    });
    // Also check not all 1s when answer requires higher (prevent trivial bypass)
    var allOnes = coeffs.every(function(c) { return c === 1; });
    var eq = getEq();
    var answerAllOnes = eq.answer.every(function(a) { return a === 1; });

    if (allBalanced && !(allOnes && !answerAllOnes)) {
      document.getElementById('feedback').textContent = 'Balanced! Conservation of mass achieved.';
      document.getElementById('feedback').className = 'feedback success';
      document.querySelectorAll('.coeff-btn').forEach(function(b) { b.classList.add('correct'); });
      streak++;
      solved++;
      updateScore();
      setTimeout(function() { nextEquation(); }, 1500);
    } else {
      document.getElementById('feedback').textContent = 'Not balanced yet. Check the atom counts.';
      document.getElementById('feedback').className = 'feedback wrong';
      streak = 0;
      updateScore();
    }
  }

  function showHint() {
    var eq = getEq();
    var counts = getAtomCounts();
    var allAtoms = Object.keys(Object.assign({}, counts.left, counts.right));
    var unbalanced = allAtoms.find(function(a) {
      return (counts.left[a] || 0) !== (counts.right[a] || 0);
    });
    if (unbalanced) {
      var l = counts.left[unbalanced] || 0;
      var r = counts.right[unbalanced] || 0;
      document.getElementById('feedback').textContent = 'Focus on ' + unbalanced + ': you have ' + l + ' on the left and ' + r + ' on the right.';
      document.getElementById('feedback').className = 'feedback hint';
    }
  }

  function nextEquation() {
    current++;
    if (current >= order.length) shuffle();
    renderEquation();
  }

  function updateScore() {
    document.getElementById('streak').textContent = streak;
    document.getElementById('solved').textContent = solved;
  }

  document.getElementById('checkBtn').addEventListener('click', checkAnswer);
  document.getElementById('nextBtn').addEventListener('click', function() { streak = 0; updateScore(); nextEquation(); });
  document.getElementById('hintBtn').addEventListener('click', showHint);

  shuffle();
  renderEquation();
})();
</script>
</body>
</html>
