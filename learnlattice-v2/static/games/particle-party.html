<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Party — LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#1a0a2e;color:#e2e8f0;font-family:'Space Grotesk',sans-serif;min-height:100vh}.hdr{padding:10px 20px;background:rgba(168,85,247,.06);border-bottom:1px solid rgba(168,85,247,.15);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#c084fc;font-weight:700}.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#c084fc}.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.2)}.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-bottom:4px}.pg-bar.done{background:#a855f7}.pg-bar.active{background:#f59e0b;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pg-label{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}.pg.done .pg-label{color:#a855f7}.pg.active .pg-label{color:#f59e0b}.game{max-width:640px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#a855f7;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:700;margin-bottom:8px}.s-desc{font-size:.85rem;color:#94a3b8;margin-bottom:4px}.s-ican{font-size:.78rem;color:#d8b4fe;font-style:italic;margin-bottom:20px}.btn{padding:12px 28px;border-radius:10px;border:1px solid rgba(168,85,247,.3);background:rgba(168,85,247,.1);color:#d8b4fe;font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(168,85,247,.2);border-color:#a855f7;transform:translateY(-2px)}.btn-go{background:#a855f7;color:#fff;border-color:#a855f7}.btn-go:hover{background:#9333ea}.q{animation:fadeIn .4s}.q-card{padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:16px}.q-num{font-size:.65rem;color:#a855f7;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.q-text{font-size:1rem;font-weight:600;color:#fff;margin-bottom:16px;line-height:1.5}.particle-box{padding:20px;background:rgba(168,85,247,.04);border:1px solid rgba(168,85,247,.12);border-radius:14px;margin-bottom:16px;text-align:center}.particle-diagram{font-size:.85rem;color:#d8b4fe;line-height:1.8;font-family:'JetBrains Mono',monospace;letter-spacing:1px}.particle-label{font-size:.72rem;color:#94a3b8;margin-top:8px}.temp-arrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;font-size:1rem;color:#d8b4fe}.temp-arrow .from{padding:8px 14px;border-radius:8px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.2);color:#93c5fd}.temp-arrow .arrow{font-size:1.3rem;color:#f59e0b}.temp-arrow .to{padding:8px 14px;border-radius:8px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);color:#fca5a5}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts-1{grid-template-columns:1fr}.opt{padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-size:.85rem;cursor:pointer;transition:all .2s;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:500}.opt:hover:not(.locked){border-color:rgba(168,85,247,.4);background:rgba(168,85,247,.06);transform:translateY(-2px)}.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-no{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#a855f7;font-weight:700}.r-label{font-size:1.1rem;font-weight:700;margin:6px 0}.r-detail{font-size:.85rem;color:#94a3b8;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}.sd{text-align:center;padding:28px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}</style><style id="ec">.embed-mode .hdr{display:none!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>⚛️ Particle Party</h1><span class="pts" id="pts">0 pts</span></div><div class="progress" id="prog"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,correct=0,total=0,sc=0;const STG=[{name:"Identify",desc:"Name the state from particle arrangement",ican:"I can identify solids, liquids, and gases from their particle diagrams.",qs:6},{name:"Change",desc:"Predict what happens when temperature changes",ican:"I can predict state changes when substances are heated or cooled.",qs:5},{name:"Explain",desc:"Link particle behaviour to properties",ican:"I can explain macroscopic properties using the particle model.",qs:5},{name:"Apply",desc:"Use the particle model in real situations",ican:"I can apply particle theory to explain everyday phenomena.",qs:5}];function sh(e){for(let t=e.length-1;t>0;t--){const s=Math.floor(Math.random()*(t+1));[e[t],e[s]]=[e[s],e[t]]}return e}function gen0(){return sh([{diagram:"⚫⚫⚫⚫\n⚫⚫⚫⚫\n⚫⚫⚫⚫",label:"Particles packed tightly in fixed rows",q:"This particle arrangement represents a:",opts:["Solid","Liquid","Gas","Plasma"],correct:0,hint:"Particles in a fixed, regular pattern = they can't move from position.",why:"Solid — particles are tightly packed in a regular arrangement. They vibrate but don't change position."},{diagram:"⚫ ⚫⚫ ⚫\n ⚫⚫ ⚫⚫\n⚫ ⚫ ⚫⚫",label:"Particles close but randomly arranged",q:"This particle arrangement represents a:",opts:["Liquid","Solid","Gas","Mixture"],correct:0,hint:"Close together but no fixed pattern = they can slide past each other.",why:"Liquid — particles are close together but arranged randomly. They can flow and slide past each other."},{diagram:"⚫    ⚫   ⚫\n  ⚫       ⚫\n⚫     ⚫    ⚫",label:"Particles far apart, moving randomly",q:"This particle arrangement represents a:",opts:["Gas","Liquid","Solid","Vacuum"],correct:0,hint:"Far apart with lots of space between = high energy, fast movement.",why:"Gas — particles are far apart, moving quickly in random directions. They fill any container."},{diagram:"⚫⚫⚫⚫⚫⚫",label:"Fixed in a line, vibrating in place",q:"These particles are in a:",opts:["Solid","Liquid","Gas","Dissolved state"],correct:0,hint:"Fixed positions + vibrating (not moving around) = ?",why:"Solid — particles vibrate about fixed positions. This is why solids keep their shape."},{diagram:"⚫⚫  ⚫ ⚫⚫\n ⚫ ⚫⚫  ⚫",label:"Touching but flowing",q:"These particles are in a:",opts:["Liquid","Gas","Solid","Between states"],correct:0,hint:"They're touching (close together) but can move around (not fixed).",why:"Liquid — particles are touching but can flow. This is why liquids take the shape of their container but have fixed volume."},{diagram:"⚫           ⚫\n     ⚫\n          ⚫      ⚫",label:"Very spread out, fast random motion",q:"These particles are in a:",opts:["Gas","Liquid","Solid","None of these"],correct:0,hint:"Huge gaps between particles = very high energy.",why:"Gas — lots of empty space between particles. They move fast and randomly in all directions."}]).slice(0,STG[0].qs)}function gen1(){return sh([{from:"Ice (solid)",to:"Water (liquid)",q:"Ice is heated. What is this change called?",opts:["Melting","Freezing","Evaporation","Condensation"],correct:0,hint:"Solid → liquid = ?",why:"Solid → liquid = melting. Particles gain energy and break free from fixed positions."},{from:"Water (liquid)",to:"Steam (gas)",q:"Water is heated to 100°C. This change is:",opts:["Boiling / evaporation","Melting","Condensation","Sublimation"],correct:0,hint:"Liquid → gas = ?",why:"Liquid → gas = boiling (at boiling point) or evaporation (below boiling point). Particles gain enough energy to escape the liquid."},{from:"Steam (gas)",to:"Water (liquid)",q:"Steam hits a cold window. What happens?",opts:["Condensation (gas → liquid)","Evaporation","Melting","Freezing"],correct:0,hint:"Gas cooling down → liquid = ?",why:"Gas → liquid = condensation. Gas particles lose energy, slow down, and form liquid droplets on the cold surface."},{from:"Water (liquid)",to:"Ice (solid)",q:"Water is cooled to 0°C. This change is:",opts:["Freezing","Melting","Condensation","Sublimation"],correct:0,hint:"Liquid → solid = ?",why:"Liquid → solid = freezing. Particles lose energy and lock into fixed positions."},{from:"Dry ice (solid CO₂)",to:"CO₂ gas",q:"Dry ice turns directly into gas, skipping liquid. This is:",opts:["Sublimation","Evaporation","Melting","Deposition"],correct:0,hint:"Solid → gas (skipping liquid) = ?",why:"Sublimation = solid → gas directly. The reverse (gas → solid) is called deposition."},{from:"Water vapour (gas)",to:"Frost (solid)",q:"On a freezing night, water vapour becomes frost on grass. This is:",opts:["Deposition (gas → solid)","Condensation","Freezing","Sublimation"],correct:0,hint:"Gas → solid directly (skipping liquid) = ?",why:"Deposition = gas → solid directly. The water vapour doesn't become liquid first — it goes straight to ice crystals."}]).slice(0,STG[1].qs)}function gen2(){return sh([{q:"Solids have a fixed shape because their particles:",opts:["Vibrate in fixed positions — can't move past each other","Don't move at all","Are heavier than liquid particles","Are glued together"],correct:0,hint:"What's special about solid particles? They have positions they can't leave.",why:"Solid particles vibrate about FIXED positions. They can't slide past each other, so the solid keeps its shape."},{q:"Gases can be compressed (squeezed) easily because:",opts:["There are large gaps between particles","The particles are smaller","Gas particles are lighter","Gases have no mass"],correct:0,hint:"Think about the space between particles. Can you squeeze something if there's no gap?",why:"Gas particles have large spaces between them. Compression pushes particles closer together, filling the gaps. Solids and liquids have almost no gaps."},{q:"When a liquid evaporates, which particles escape first?",opts:["The fastest-moving ones at the surface","The heaviest ones","All particles at once","Random particles from anywhere"],correct:0,hint:"Not all particles have the same speed. Some are faster than average.",why:"The fastest surface particles have enough energy to escape. This is why evaporation cools the liquid — the most energetic particles leave."},{q:"During melting, temperature stays constant even though heat is added. Why?",opts:["Energy breaks bonds between particles instead of increasing speed","The thermometer is broken","Heat escapes to surroundings","Particles can't get hotter"],correct:0,hint:"The energy goes somewhere, but not into making particles move faster...",why:"During a state change, added energy breaks intermolecular bonds (latent heat), NOT increasing kinetic energy. So temperature stays flat."},{q:"Diffusion is faster in gases than liquids because:",opts:["Gas particles move faster and have more space","Liquids are thicker","Gas particles are smarter","Diffusion doesn't happen in liquids"],correct:0,hint:"In gases, particles move fast with big gaps. In liquids, they're slower and closer.",why:"Gas particles move faster AND have more space between them, so they spread out much more quickly than in liquids."},{q:"A balloon expands when heated because:",opts:["Gas particles move faster and hit walls harder","The rubber melts","Hot air is heavier","New air enters the balloon"],correct:0,hint:"Heating → particles gain energy → move faster → push harder on...",why:"Heated particles have more kinetic energy → move faster → collide with balloon walls more often and harder → balloon expands. Pressure increases."}]).slice(0,STG[2].qs)}function gen3(){return sh([{q:"You can smell perfume from across a room. This happens because:",opts:["Perfume particles diffuse through air (spread from high to low concentration)","Perfume is magnetic","Air pushes the smell","Light carries the smell"],correct:0,hint:"Gas particles spread out from where there are lots of them to where there are few.",why:"Diffusion — perfume gas particles move randomly from high concentration (the bottle) to low concentration (across the room)."},{q:"A pressure cooker cooks food faster because:",opts:["Higher pressure raises the boiling point of water","It traps more air","The pot is hotter","Food is compressed"],correct:0,hint:"At higher pressure, water needs MORE energy to boil. So it boils at a higher temperature.",why:"Higher pressure → higher boiling point → water can reach >100°C before boiling → food cooks faster."},{q:"Sweating cools you down because:",opts:["Sweat particles with the most energy evaporate, removing heat","Sweat is cold","Wind blows the heat away","Sweat absorbs sunlight"],correct:0,hint:"What happens to a liquid when its fastest particles escape?",why:"Evaporation of sweat removes the most energetic particles from your skin. This takes heat energy away from your body (cooling effect)."},{q:"A jar of gas weighs the same whether the lid is on or off. This proves:",opts:["Gas has mass — particles have weight","Gas is weightless","The jar is heavier than the gas","Scales don't measure gas"],correct:0,hint:"If the gas escapes (lid off) and the jar weighs LESS, what does that tell you?",why:"Gas has mass. When gas escapes, the jar weighs less. This proves gas particles have mass, even though we can't see them."},{q:"Why does a bicycle tyre feel warm after you pump it up?",opts:["Compressing gas increases particle collisions → temperature rises","The pump heats the rubber","Friction from riding","Air is naturally warm"],correct:0,hint:"Compressing gas → particles closer → more collisions → more energy transferred →",why:"Compressing air forces particles closer together. More frequent collisions transfer more energy, increasing temperature. This is why compressed gases heat up."},{q:"Dry ice (solid CO₂) turns directly into gas. What is this change called?",opts:["Sublimation","Evaporation","Melting","Condensation"],correct:0,hint:"Solid → Gas directly, skipping liquid phase.",why:"Sublimation = solid directly to gas. Dry ice sublimates at -78°C, never forming liquid at normal pressure."},{q:"Why does sweating cool you down?",opts:["Evaporation removes heat energy from skin","Sweat is cold","Water blocks sunlight","Salt absorbs heat"],correct:0,hint:"What happens to liquid water on hot skin? It changes state...",why:"Sweat evaporates, and evaporation requires energy (latent heat). This energy comes from your skin, cooling it."},{q:"A sealed bottle of fizzy drink is opened. Bubbles appear. Why?",opts:["Dissolved CO₂ comes out as gas (pressure drops)","The drink is boiling","Air rushes in","The bottle creates bubbles"],correct:0,hint:"The drink was sealed under pressure. When you open it, pressure...",why:"CO₂ was dissolved under high pressure. Opening reduces pressure, so CO₂ comes out of solution as gas bubbles."},{q:"Fog forms on a cold morning. Which state change?",opts:["Condensation (gas → liquid)","Evaporation","Freezing","Sublimation"],correct:0,hint:"Water vapour in warm air meets cold air and becomes visible droplets.",why:"Water vapour (gas) cools and condenses into tiny liquid droplets suspended in air = fog."},{q:"Why does salt lower the melting point of ice?",opts:["Salt particles disrupt the ice crystal structure","Salt is warm","Salt absorbs water","Salt is heavier than ice"],correct:0,hint:"Salt particles get between water molecules in the ice lattice...",why:"Salt ions interfere with ice crystal formation, requiring a lower temperature to maintain the solid structure."}]).slice(0,STG[3].qs)}const generators=[gen0,gen1,gen2,gen3];let questions=[];function renderProg(){document.getElementById("prog").innerHTML=STG.map((e,t)=>`<div class="pg ${t<stage?"done":t===stage?"active":""}"><div class="pg-bar ${t<stage?"done":t===stage?"active":""}"></div><span class="pg-label">${e.name}</span></div>`).join("")}function showIntro(){sc=0,questions=generators[stage](),qIdx=0,document.getElementById("game").innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STG.length}</div><div class="s-name">${STG[stage].name}</div><div class="s-desc">${STG[stage].desc}</div><div class="s-ican">"${STG[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`,renderProg()}function showQ(){if(qIdx>=questions.length)return void showSD();const e=questions[qIdx];let t=`<div class="q"><div class="q-card"><div class="q-num">Q${qIdx+1} of ${questions.length}</div>`;e.diagram&&(t+=`<div class="particle-box"><div class="particle-diagram">${e.diagram.replace(/\n/g,"<br>")}</div><div class="particle-label">${e.label||""}</div></div>`),e.from&&(t+=`<div class="temp-arrow"><span class="from">${e.from}</span><span class="arrow">🔥→</span><span class="to">${e.to}</span></div>`),t+=`<div class="q-text">${e.q}</div><div class="opts ${e.opts.some(e=>e.length>35)?"opts-1":""}">${e.opts.map((e,t)=>`<button class="opt" onclick="check(${t})" id="o${t}">${e}</button>`).join("")}</div></div><div id="fb"></div><div class="next" id="nx"></div></div>`,document.getElementById("game").innerHTML=t}function check(e){const t=questions[qIdx];total++,document.querySelectorAll(".opt").forEach(e=>e.classList.add("locked")),e===t.correct?(document.getElementById("o"+e).classList.add("correct"),correct++,sc++,pts+=10,document.getElementById("pts").textContent=pts+" pts",document.getElementById("fb").innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${t.why}</div>`):(document.getElementById("o"+e).classList.add("wrong"),document.getElementById("o"+t.correct).classList.add("correct"),document.getElementById("fb").innerHTML=`<div class="fb fb-no"><strong>💡 Hint:</strong>${t.hint}</div>`),document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()">Next →</button>'}function showSD(){const e=Math.round(sc/questions.length*100),t=e>=80?"⭐⭐⭐":e>=60?"⭐⭐":"⭐";stage<STG.length-1?document.getElementById("game").innerHTML=`<div class="sd"><div class="sd-stars">${t}</div><div class="s-name">${STG[stage].name} Complete!</div><p style="color:#94a3b8;margin:8px 0">${sc}/${questions.length}</p><button class="btn btn-go" onclick="stage++;showIntro()">Next →</button></div>`:showResults()}function showResults(){const e=Math.round(correct/total*100);let t="🏆 Particle Master!",s="You understand particle theory and can apply it to explain real phenomena.";e<50?(t="⚛️ Keep partying!",s="Review the three states and their particle arrangements."):e<75&&(t="⚛️ Good energy!",s="Solid foundation. Work on explaining properties using the particle model."),document.getElementById("game").innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${t}</div><div class="r-detail">${s}<br>Score: ${pts} pts</div><div class="r-transfer">🌍 <strong>Particles explain everything:</strong> Why you can smell dinner from upstairs (diffusion), why puddles disappear (evaporation), why ice floats (density change), and why pressure cookers work. The particle model is one of science's most powerful ideas.</div><div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`,renderProg()}showIntro()</script></body></html>
