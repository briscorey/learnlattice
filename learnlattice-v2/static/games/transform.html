<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transform! — LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh}.hdr{padding:10px 20px;background:rgba(59,130,246,.06);border-bottom:1px solid rgba(59,130,246,.15);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#60a5fa;font-weight:700}.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#60a5fa}.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.2)}.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-bottom:4px}.pg-bar.done{background:#60a5fa}.pg-bar.active{background:#f59e0b;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pg-label{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}.pg.done .pg-label{color:#60a5fa}.pg.active .pg-label{color:#f59e0b}.game{max-width:640px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#60a5fa;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:700;margin-bottom:8px}.s-desc{font-size:.85rem;color:#94a3b8;margin-bottom:4px}.s-ican{font-size:.78rem;color:#93c5fd;font-style:italic;margin-bottom:20px}.btn{padding:12px 28px;border-radius:10px;border:1px solid rgba(96,165,250,.3);background:rgba(96,165,250,.1);color:#93c5fd;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(96,165,250,.2);border-color:#60a5fa;transform:translateY(-2px)}.btn-go{background:#3b82f6;color:#fff;border-color:#3b82f6}.btn-go:hover{background:#2563eb}.q{animation:fadeIn .4s}.q-card{padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:16px}.q-num{font-size:.65rem;color:#60a5fa;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.q-text{font-size:1rem;font-weight:600;color:#fff;margin-bottom:16px;line-height:1.5}.grid-wrap{display:flex;justify-content:center;margin-bottom:16px}canvas{border-radius:12px;border:1px solid rgba(96,165,250,.2);background:#1e293b}.grid-legend{display:flex;gap:16px;justify-content:center;margin-bottom:16px;font-size:.72rem;color:#94a3b8}.legend-item{display:flex;align-items:center;gap:4px}.legend-dot{width:10px;height:10px;border-radius:3px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts-1{grid-template-columns:1fr}.opt{padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-size:.85rem;cursor:pointer;transition:all .2s;text-align:center;font-family:'DM Sans',sans-serif}.opt:hover:not(.locked){border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.06);transform:translateY(-2px)}.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-no{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#60a5fa;font-weight:700}.r-label{font-size:1.1rem;font-weight:700;margin:6px 0}.r-detail{font-size:.85rem;color:#94a3b8;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}.sd{text-align:center;padding:28px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}.coord{font-family:'JetBrains Mono',monospace;color:#60a5fa;font-weight:600}</style><style id="ec">.embed-mode .hdr{display:none!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>🔷 Transform!</h1><span class="pts" id="pts">0 pts</span></div><div class="progress" id="prog"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,correct=0,total=0,sc=0;
const STAGES=[
  {name:'Identify',desc:'Name the transformation',ican:'I can identify translations, reflections, and rotations.',qs:6},
  {name:'Translate',desc:'Move shapes by a vector',ican:'I can translate a point by a given vector.',qs:5},
  {name:'Reflect',desc:'Mirror shapes across an axis',ican:'I can reflect a point across the x-axis or y-axis.',qs:5},
  {name:'Describe',desc:'Describe what happened',ican:'I can describe a transformation using correct mathematical language.',qs:5}
];
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Canvas grid drawing
function drawGrid(canvasId,shapes,gridSize=8,cellSize=32){
  const cvs=document.getElementById(canvasId);
  if(!cvs)return;
  const ctx=cvs.getContext('2d');
  const w=gridSize*cellSize,h=gridSize*cellSize;
  cvs.width=w;cvs.height=h;
  // Grid
  ctx.strokeStyle='rgba(96,165,250,0.1)';ctx.lineWidth=1;
  for(let i=0;i<=gridSize;i++){
    ctx.beginPath();ctx.moveTo(i*cellSize,0);ctx.lineTo(i*cellSize,h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*cellSize);ctx.lineTo(w,i*cellSize);ctx.stroke();
  }
  // Axes
  const cx=Math.floor(gridSize/2)*cellSize;const cy=Math.floor(gridSize/2)*cellSize;
  ctx.strokeStyle='rgba(96,165,250,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(w,cy);ctx.stroke();
  // Axis labels
  ctx.fillStyle='rgba(96,165,250,0.4)';ctx.font='10px JetBrains Mono';
  ctx.fillText('x',w-12,cy-4);ctx.fillText('y',cx+4,12);
  // Shapes
  shapes.forEach(s=>{
    ctx.fillStyle=s.color||'rgba(96,165,250,0.4)';
    ctx.strokeStyle=s.stroke||'rgba(96,165,250,0.8)';
    ctx.lineWidth=2;
    const pts=s.points.map(([x,y])=>[cx+x*cellSize,cy-y*cellSize]);
    ctx.beginPath();
    pts.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y));
    ctx.closePath();ctx.fill();ctx.stroke();
    // Label
    if(s.label){
      const centX=pts.reduce((a,p)=>a+p[0],0)/pts.length;
      const centY=pts.reduce((a,p)=>a+p[1],0)/pts.length;
      ctx.fillStyle=s.stroke||'#60a5fa';ctx.font='bold 12px DM Sans';
      ctx.fillText(s.label,centX-4,centY+4);
    }
    // Point labels
    if(s.pointLabels){
      ctx.fillStyle='#fff';ctx.font='bold 10px JetBrains Mono';
      pts.forEach(([x,y],i)=>{
        if(s.pointLabels[i])ctx.fillText(s.pointLabels[i],x+4,y-4);
      });
    }
  });
}

// STAGE 1: Identify transformation type
function gen0(){
  return sh([
    {shapes:[{points:[[1,1],[3,1],[3,3],[1,3]],color:'rgba(96,165,250,0.3)',stroke:'#60a5fa',label:'A'},{points:[[1,-1],[3,-1],[3,-3],[1,-3]],color:'rgba(239,68,68,0.3)',stroke:'#ef4444',label:'A′'}],
      q:'Shape A has been transformed to A′. What type of transformation is this?',opts:['Reflection in the x-axis','Translation','Rotation 90°','Enlargement'],correct:0,
      hint:'The shape is flipped — it\'s a mirror image. Which axis is it mirrored across?',why:'The shape is flipped over the x-axis. Each point (x,y) became (x,−y). This is a reflection in the x-axis.'},
    {shapes:[{points:[[−3,1],[−1,1],[−1,3],[−3,3]],color:'rgba(96,165,250,0.3)',stroke:'#60a5fa',label:'A'},{points:[[1,1],[3,1],[3,3],[1,3]],color:'rgba(239,68,68,0.3)',stroke:'#ef4444',label:'A′'}],
      q:'Shape A moved to A′. What transformation is this?',opts:['Translation (4 units right)','Reflection','Rotation','Enlargement'],correct:0,
      hint:'The shape didn\'t flip or turn — it just slid. That\'s a...',why:'The shape moved 4 units right without flipping or rotating. This is a translation by vector (4, 0).'},
    {shapes:[{points:[[1,1],[3,1],[3,3],[1,3]],color:'rgba(96,165,250,0.3)',stroke:'#60a5fa',label:'A'},{points:[[-1,1],[-3,1],[-3,3],[-1,3]],color:'rgba(239,68,68,0.3)',stroke:'#ef4444',label:'A′'}],
      q:'Shape A became A′. What transformation?',opts:['Reflection in the y-axis','Translation','Rotation 180°','Reflection in x-axis'],correct:0,
      hint:'The shape is a mirror image — flipped left-to-right across the y-axis.',why:'Each point (x,y) became (−x,y). The shape is reflected in the y-axis.'},
    {shapes:[{points:[[1,1],[3,1],[3,2]],color:'rgba(96,165,250,0.3)',stroke:'#60a5fa',label:'A'},{points:[[1,-1],[3,-1],[3,-2]],color:'rgba(239,68,68,0.3)',stroke:'#ef4444',label:'A′'}],
      q:'Triangle A became A′. What transformation?',opts:['Reflection in the x-axis','Translation down','Rotation 90° clockwise','Enlargement'],correct:0,
      hint:'Is A′ a mirror image of A? Which axis could be the mirror line?',why:'The triangle is flipped across the x-axis: (x,y) → (x,−y). It\'s a reflection.'},
    {shapes:[{points:[[-3,-1],[-1,-1],[-1,-3],[-3,-3]],color:'rgba(96,165,250,0.3)',stroke:'#60a5fa',label:'A'},{points:[[0,2],[2,2],[2,0],[0,0]],color:'rgba(239,68,68,0.3)',stroke:'#ef4444',label:'A′'}],
      q:'Shape A moved to A′. What transformation?',opts:['Translation (3 right, 3 up)','Reflection','Rotation 90°','Enlargement'],correct:0,
      hint:'The shape kept its orientation (didn\'t flip). It just moved. Count the units.',why:'The shape slid 3 right and 3 up without flipping or rotating. Translation by vector (3, 3).'},
    {shapes:[{points:[[1,0],[2,2],[0,2]],color:'rgba(96,165,250,0.3)',stroke:'#60a5fa',label:'A'},{points:[[1,0],[-1,2],[1,2]],color:'rgba(239,68,68,0.3)',stroke:'#ef4444',label:'A′'}],
      q:'Triangle A became A′. Both share a vertex. What happened?',opts:['Rotation around the shared point','Translation','Reflection in y-axis','Enlargement'],correct:0,
      hint:'The shapes share a point and one has turned. That\'s a rotation about that point.',why:'The triangle has been rotated around the shared vertex (1,0). The shape turned without flipping.'}
  ]).slice(0,STAGES[0].qs);
}

// STAGE 2: Apply translations
function gen1(){
  const qs=[];
  for(let i=0;i<STAGES[1].qs;i++){
    const px=ri(-2,2),py=ri(-2,2);
    const dx=ri(1,3)*(Math.random()>0.5?1:-1);
    const dy=ri(1,3)*(Math.random()>0.5?1:-1);
    const nx=px+dx,ny=py+dy;
    const wrong1=`(${px+dx},${py-dy})`,wrong2=`(${px-dx},${py+dy})`,wrong3=`(${nx+1},${ny})`;
    const opts=sh([`(${nx},${ny})`,wrong1,wrong2,wrong3]);
    qs.push({px,py,dx,dy,opts,correct:opts.indexOf(`(${nx},${ny})`),
      shapes:[{points:[[px,py],[px+1,py],[px+1,py+1],[px,py+1]],color:'rgba(96,165,250,0.3)',stroke:'#60a5fa',pointLabels:['','','',`(${px},${py})`]}],
      q:`Point <span class="coord">(${px}, ${py})</span> is translated by vector <span class="coord">(${dx}, ${dy})</span>. What are the new coordinates?`,
      hint:`Add the vector to the point: (${px}+${dx > 0 ? dx : '('+dx+')'}, ${py}+${dy > 0 ? dy : '('+dy+')'}).`,
      why:`(${px},${py}) + (${dx},${dy}) = (${px}+${dx}, ${py}+${dy}) = (${nx},${ny}). Translation adds the vector to each coordinate.`});
  }
  return qs;
}

// STAGE 3: Reflections
function gen2(){
  const qs=[];
  for(let i=0;i<STAGES[2].qs;i++){
    const px=ri(1,3),py=ri(1,3);
    const axis=Math.random()>0.5?'x':'y';
    let nx,ny;
    if(axis==='x'){nx=px;ny=-py}else{nx=-px;ny=py}
    const wrong1=axis==='x'?`(${-px},${py})`:`(${px},${-py})`;
    const wrong2=`(${-px},${-py})`;
    const wrong3=`(${py},${px})`;
    const opts=sh([`(${nx},${ny})`,wrong1,wrong2,wrong3]);
    qs.push({px,py,axis,opts,correct:opts.indexOf(`(${nx},${ny})`),
      shapes:[{points:[[px,py],[px+0.3,py],[px+0.3,py+0.3],[px,py+0.3]],color:'rgba(96,165,250,0.5)',stroke:'#60a5fa'}],
      q:`Reflect point <span class="coord">(${px}, ${py})</span> in the <strong>${axis}-axis</strong>. What are the new coordinates?`,
      hint:axis==='x'?`Reflecting in the x-axis: the x stays the same, the y changes sign. (x,y) → (x, −y).`:`Reflecting in the y-axis: the y stays the same, the x changes sign. (x,y) → (−x, y).`,
      why:axis==='x'?`Reflect in x-axis: (${px},${py}) → (${px},${-py}). The y-coordinate changes sign.`:`Reflect in y-axis: (${px},${py}) → (${-px},${py}). The x-coordinate changes sign.`});
  }
  return qs;
}

// STAGE 4: Describe transformations
function gen3(){
  return sh([
    {q:'A shape at (2,3) moves to (5,1). Describe the transformation.',opts:['Translation by vector (3, −2)','Reflection in x-axis','Rotation 90° clockwise','Translation by vector (−3, 2)'],correct:0,
      hint:'How far right/left? 5−2=3. How far up/down? 1−3=−2.',why:'Vector = (5−2, 1−3) = (3, −2). Translation 3 right and 2 down.'},
    {q:'Point (4, 2) becomes (−4, 2). Describe the transformation.',opts:['Reflection in the y-axis','Reflection in the x-axis','Translation (−8, 0)','Rotation 90°'],correct:0,
      hint:'x changed sign (4 → −4), y stayed the same (2 → 2). Which reflection does this?',why:'(x,y) → (−x,y) is a reflection in the y-axis. The x-coordinate changes sign.'},
    {q:'Point (3, −1) becomes (3, 1). Describe the transformation.',opts:['Reflection in the x-axis','Reflection in the y-axis','Translation (0, 2)','Rotation 180°'],correct:0,
      hint:'x stayed the same (3 → 3), y changed sign (−1 → 1). Which reflection?',why:'(x,y) → (x,−y) is a reflection in the x-axis. Only the y-coordinate changed sign.'},
    {q:'A triangle moves from coordinates (1,1),(3,1),(2,3) to (−1,−1),(−3,−1),(−2,−3). What happened?',opts:['Rotation 180° about the origin','Reflection in x-axis','Reflection in y-axis','Translation'],correct:0,
      hint:'Every coordinate was negated: (x,y) → (−x,−y). This is equivalent to...',why:'(x,y) → (−x,−y) is a rotation of 180° about the origin. Both coordinates change sign.'},
    {q:'Shape A is at (2,4). After a transformation it\'s at (2,−4). Then it\'s translated by (3,0) to (5,−4). Describe BOTH transformations.',opts:['Reflection in x-axis, then translation (3,0)','Two translations','Rotation then reflection','Reflection in y-axis, then translation'],correct:0,
      hint:'Step 1: (2,4)→(2,−4). That\'s y changing sign = reflection in x-axis. Step 2: (2,−4)→(5,−4). That\'s x+3 = translation.',
      why:'Step 1: Reflection in x-axis: (2,4)→(2,−4). Step 2: Translation by (3,0): (2,−4)→(5,−4). Combined transformations can be described step by step.'},
    {q:'A designer wants to create a pattern by repeating a shape. They translate it (4,0), then translate again (4,0). What single translation gives the same result?',opts:['Translation (8,0)','Translation (4,0)','Translation (4,4)','Translation (16,0)'],correct:0,
      hint:'Two translations of (4,0) add up to...?',why:'(4,0) + (4,0) = (8,0). Consecutive translations can be combined by adding the vectors.'}
  ]).slice(0,STAGES[3].qs);
}

const generators=[gen0,gen1,gen2,gen3];
let questions=[];

function renderProg(){document.getElementById('prog').innerHTML=STAGES.map((s,i)=>`<div class="pg ${i<stage?'done':i===stage?'active':''}"><div class="pg-bar ${i<stage?'done':i===stage?'active':''}"></div><span class="pg-label">${s.name}</span></div>`).join('')}

function showIntro(){sc=0;questions=generators[stage]();qIdx=0;document.getElementById('game').innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STAGES.length}</div><div class="s-name">${STAGES[stage].name}</div><div class="s-desc">${STAGES[stage].desc}</div><div class="s-ican">"${STAGES[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`;renderProg()}

function showQ(){
  if(qIdx>=questions.length){showSD();return}
  const q=questions[qIdx];
  let html=`<div class="q"><div class="q-card"><div class="q-num">Question ${qIdx+1} of ${questions.length}</div>`;
  html+=`<div class="q-text">${q.q}</div>`;
  if(q.shapes){
    html+=`<div class="grid-wrap"><canvas id="cvs"></canvas></div>`;
    html+=`<div class="grid-legend"><div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div>Original</div><div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>Image</div></div>`;
  }
  html+=`<div class="opts ${q.opts.some(o=>o.length>35)?'opts-1':''}">${q.opts.map((o,i)=>`<button class="opt" onclick="check(${i})" id="o${i}">${o}</button>`).join('')}</div>`;
  html+=`</div><div id="fb"></div><div class="next" id="nx"></div></div>`;
  document.getElementById('game').innerHTML=html;
  if(q.shapes)setTimeout(()=>drawGrid('cvs',q.shapes),10);
}

function check(i){
  const q=questions[qIdx];total++;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('locked'));
  if(i===q.correct){
    document.getElementById('o'+i).classList.add('correct');correct++;sc++;pts+=10;
    document.getElementById('pts').textContent=pts+' pts';
    document.getElementById('fb').innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${q.why}</div>`;
  }else{
    document.getElementById('o'+i).classList.add('wrong');document.getElementById('o'+q.correct).classList.add('correct');
    document.getElementById('fb').innerHTML=`<div class="fb fb-no"><strong>💡 Not quite:</strong>${q.hint}</div>`;
  }
  document.getElementById('nx').innerHTML=`<button class="btn" onclick="qIdx++;showQ()">Next →</button>`;
}

function showSD(){
  const pct=Math.round(sc/questions.length*100);const stars=pct>=80?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
  if(stage<STAGES.length-1){document.getElementById('game').innerHTML=`<div class="sd"><div class="sd-stars">${stars}</div><div class="s-name">${STAGES[stage].name} Complete!</div><p style="color:#94a3b8;margin:8px 0">${sc}/${questions.length} correct</p><button class="btn btn-go" onclick="stage++;showIntro()">Next Stage →</button></div>`}
  else showResults();
}

function showResults(){
  const pct=Math.round(correct/total*100);
  let label='🏆 Transformation Expert!',detail='You can identify, apply, and describe translations, reflections, and rotations.';
  if(pct<50){label='🔷 Keep transforming!';detail='Focus on the rules: translation adds, x-axis reflection negates y, y-axis reflection negates x.'}
  else if(pct<75){label='🔷 Good progress!';detail='You know the basics. Practice describing transformations with correct mathematical language.'}
  document.getElementById('game').innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${label}</div><div class="r-detail">${detail}<br>Score: ${pts} points</div>
  <div class="r-transfer">🌍 <strong>Transformations in real life:</strong> Video game graphics (every moving sprite is being translated), mirror selfies (reflection), clock hands (rotation), wallpaper patterns (repeated translations). Architects and designers use these daily.</div>
  <div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`;renderProg();
}

showIntro();</script></body></html>
