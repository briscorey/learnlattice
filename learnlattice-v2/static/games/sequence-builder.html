<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Builder — LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:Outfit,sans-serif;min-height:100vh}.hdr{padding:12px 20px;background:#1e293b;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}h1{font-size:1.2rem;color:#0d9488;font-weight:700}.hdr-r{display:flex;gap:14px;font-size:.82rem}.hdr-r span{color:#0d9488;font-weight:600}.game{max-width:800px;margin:0 auto;padding:24px}.stage{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;margin-bottom:20px}.stage-label{font-size:.62rem;text-transform:uppercase;letter-spacing:2px;color:#64748b;margin-bottom:14px}.visual{display:flex;gap:20px;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin-bottom:20px;min-height:120px}.shape-group{text-align:center}.shape-label{font-size:.72rem;color:#94a3b8;margin-top:6px}.shape-count{font-size:1rem;font-weight:700;color:#0d9488}canvas.shape-canvas{border-radius:8px;background:rgba(13,148,136,.03);border:1px solid rgba(13,148,136,.1)}.table-wrap{overflow-x:auto;margin-bottom:16px}table{width:100%;border-collapse:collapse;font-size:.85rem}th{background:rgba(13,148,136,.08);padding:8px 12px;color:#0d9488;font-weight:600;border:1px solid #334155;text-align:center}td{padding:8px 12px;border:1px solid #334155;text-align:center;color:#94a3b8}td.filled{color:#e2e8f0;font-weight:600}.predict{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}.predict label{font-size:.88rem;color:#94a3b8}.predict input{width:80px;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#0d9488;font-family:Outfit,sans-serif;font-size:1rem;text-align:center;outline:0}.predict input:focus{border-color:#0d9488;box-shadow:0 0 8px rgba(13,148,136,.2)}.formula-section{margin-top:16px}.formula-section label{font-size:.78rem;color:#64748b;display:block;margin-bottom:6px}.formula-input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-family:Outfit,sans-serif;font-size:.9rem;outline:0}.formula-input:focus{border-color:#0d9488}.btn{padding:10px 24px;border-radius:10px;border:1px solid #0d9488;background:rgba(13,148,136,.1);color:#0d9488;font-family:Outfit,sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(13,148,136,.2);box-shadow:0 0 16px rgba(13,148,136,.15)}.btn-primary{background:#0d9488;color:#fff;border-color:#0d9488}.btn-primary:hover{background:#0a7c72}.btns{display:flex;gap:8px;justify-content:center;margin-top:16px}.fb{margin-top:14px;padding:12px;border-radius:10px;font-size:.88rem;text-align:center;display:none}.fb.ok{display:block;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#22c55e}.fb.no{display:block;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#ef4444}.progress{display:flex;gap:4px;justify-content:center;margin-bottom:20px}.pdot{width:36px;height:5px;border-radius:3px;background:#1e293b;border:1px solid #334155}.pdot.done{background:#0d9488;border-color:#0d9488}.pdot.cur{background:rgba(13,148,136,.4);border-color:#0d9488}</style><style id="embed-check">.embed-mode .hdr,.embed-mode .header,.embed-mode>div:first-child:not(.wrap):not(.main):not(.game):not(.lab):not(.arena){display:none!important}.embed-mode{padding-top:0!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>🔷 Sequence Builder</h1><a href="/games/" target="_top" style="font-size:.72rem;color:#94a3b8;text-decoration:none;opacity:.7;margin-left:8px">← All games</a><div class="hdr-r"><span id="lvl">Level 1/8</span><span id="pts">Score: 0</span></div></div><div class="game"><div class="progress" id="prog"></div><div class="stage"><div class="stage-label" id="stageLabel">Growing Pattern</div><div class="visual" id="visual"></div><div class="table-wrap"><table id="tbl"><thead><tr id="tHead"></tr></thead><tbody><tr id="tBody"></tr></tbody></table></div><div class="predict"><label>Term <span id="predictN"></span> =</label> <input type="number" id="predictInput" placeholder="?"> <button class="btn btn-primary" onclick="checkPredict()">Check</button></div><div class="formula-section"><label>Write the formula for term n (optional)</label> <input class="formula-input" id="formulaInput" placeholder="e.g. 2n + 1"></div><div class="fb" id="fb"></div><div class="btns"><button class="btn" onclick="showHint()">💡 Hint</button> <button class="btn" onclick="nextLevel()">Next →</button></div></div></div><script>var levels=[{name:"Dots in a Row",terms:[2,4,6,8],predict:5,answer:10,formula:"2n",hint:"Each term adds 2 dots.",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=2*e,r=Math.min(a,6),l=Math.ceil(a/6),i=0;i<l;i++)for(var o=0;o<Math.min(r,a-6*i);o++)n.beginPath(),n.arc(12+20*o,12+20*i,7,0,2*Math.PI),n.fillStyle="#0D9488",n.fill()}},{name:"L-Shapes",terms:[1,3,5,7],predict:6,answer:11,formula:"2n-1",hint:"Each L-shape adds 2 more squares.",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=0;a<e;a++)n.fillStyle="#0D9488",n.fillRect(4+16*a,t.height-20,14,14);for(a=1;a<e;a++)n.fillStyle="#14b8a6",n.fillRect(4,t.height-20-16*a,14,14)}},{name:"Squares",terms:[1,4,9,16],predict:7,answer:49,formula:"n²",hint:"1×1, 2×2, 3×3, 4×4...",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=Math.min(14,Math.floor((t.width-8)/(e+1))),r=0;r<e;r++)for(var l=0;l<e;l++)n.fillStyle=r===e-1||l===e-1?"#14b8a6":"#0D9488",n.fillRect(4+l*(a+2),4+r*(a+2),a,a)}},{name:"Triangular Numbers",terms:[1,3,6,10],predict:6,answer:21,formula:"n(n+1)/2",hint:"Row 1 has 1, row 2 has 2, row 3 has 3...",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=4,r=1;r<=e;r++){for(var l=(t.width-16*r)/2,i=0;i<r;i++)n.beginPath(),n.arc(l+8+16*i,a+8,6,0,2*Math.PI),n.fillStyle=r===e?"#14b8a6":"#0D9488",n.fill();a+=16}}},{name:"Powers of Two",terms:[2,4,8,16],predict:8,answer:256,formula:"2ⁿ",hint:"Each term doubles the previous one.",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=Math.pow(2,e),r=Math.min(10,Math.floor(t.width/Math.ceil(Math.sqrt(a))))-2,l=Math.ceil(Math.sqrt(a)),i=0;i<a&&i<64;i++){var o=Math.floor(i/l),c=i%l;n.fillStyle="#0D9488",n.fillRect(2+c*(r+2),2+o*(r+2),r,r)}}},{name:"Cubes",terms:[1,8,27,64],predict:5,answer:125,formula:"n³",hint:"1³, 2³, 3³, 4³...",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height),n.font="bold 24px Outfit",n.fillStyle="#0D9488",n.textAlign="center",n.textBaseline="middle",n.fillText(Math.pow(e,3),t.width/2,t.height/2),n.font="10px Outfit",n.fillStyle="#64748b",n.fillText(e+"³",t.width/2,t.height/2+24)}},{name:"Fibonacci-style",terms:[1,1,2,3],predict:7,answer:13,formula:"add previous two",hint:"Each number is the sum of the two before it.",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=[1,1],r=2;r<e;r++)a.push(a[r-1]+a[r-2]);var l=a[e-1];n.font="bold 20px Outfit",n.fillStyle="#0D9488",n.textAlign="center",n.textBaseline="middle",n.fillText(l,t.width/2,t.height/2)}},{name:"Oblong Numbers",terms:[2,6,12,20],predict:6,answer:42,formula:"n(n+1)",hint:"2=1×2, 6=2×3, 12=3×4, 20=4×5...",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=Math.min(12,Math.floor((t.width-8)/(e+1+1))),r=0;r<e;r++)for(var l=0;l<e+1;l++)n.fillStyle=l===e?"#14b8a6":"#0D9488",n.fillRect(4+l*(a+2),4+r*(a+2),a,a)}},,{name:"Powers of 2",terms:[2,4,8,16],predict:8,answer:256,formula:"2ⁿ",hint:"Each term doubles the previous one.",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=Math.pow(2,e),r=Math.min(12,Math.floor(120/Math.ceil(Math.sqrt(a)))),l=Math.ceil(Math.sqrt(a)),i=0;i<a;i++){var o=Math.floor(i/l),c=i%l;n.fillStyle="#7c3aed",n.fillRect(c*(r+2)+10,o*(r+2)+10,r,r)}}},{name:"Pentagonal",terms:[1,5,12,22],predict:6,answer:51,formula:"n(3n−1)/2",hint:"Differences increase by 3 each time: 4, 7, 10, 13...",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);var a=e*(3*e-1)/2;n.fillStyle="#f59e0b",n.font="28px sans-serif",n.textAlign="center",n.fillText(a,t.width/2,t.height/2+10)}},{name:"Odd Numbers",terms:[1,3,5,7],predict:10,answer:19,formula:"2n−1",hint:"The pattern of odd numbers. What's the 10th odd number?",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);for(var a=2*e-1,r=0;r<a;r++)n.fillStyle="#0D9488",n.beginPath(),n.arc(20+14*r,t.height/2,5,0,2*Math.PI),n.fill()}},{name:"Cube Numbers",terms:[1,8,27,64],predict:6,answer:216,formula:"n³",hint:"1³=1, 2³=8, 3³=27... what is 6³?",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height),n.fillStyle="#ec4899",n.font="32px sans-serif",n.textAlign="center",n.fillText(e+"³ = "+e*e*e,t.width/2,t.height/2+12)}},{name:"Decreasing",terms:[100,90,81,73],predict:7,answer:37,formula:"100−n(n+1)/2·(approx)",hint:"Differences are 10, 9, 8, 7... decreasing by 1 each time.",draw:function(e,t){var n=t.getContext("2d");n.clearRect(0,0,t.width,t.height);var a=[100,90,81,73,66,60,55,51,48][e-1]||48,r=.8*a;n.fillStyle="#3b82f6",n.fillRect(t.width/2-20,t.height-r-10,40,r),n.fillStyle="#e2e8f0",n.font="14px sans-serif",n.textAlign="center",n.fillText(a,t.width/2,t.height-r-15)}}],ci=0,score=0,answered=!1;function loadLevel(){answered=!1;var e=levels[ci];document.getElementById("stageLabel").textContent=e.name,document.getElementById("lvl").textContent="Level "+(ci+1)+"/"+levels.length,document.getElementById("pts").textContent="Score: "+score,document.getElementById("predictN").textContent=e.predict,document.getElementById("predictInput").value="",document.getElementById("formulaInput").value="",document.getElementById("fb").className="fb";var t=document.getElementById("prog");t.innerHTML="",levels.forEach(function(e,n){t.innerHTML+='<div class="pdot'+(n<ci?" done":n===ci?" cur":"")+'"></div>'});var n=document.getElementById("visual");n.innerHTML="";for(var a=1;a<=4;a++){var r=document.createElement("div");r.className="shape-group";var l=document.createElement("canvas");l.className="shape-canvas",l.width=120,l.height=100,r.appendChild(l);var i=document.createElement("div");i.className="shape-label",i.textContent="Term "+a,r.appendChild(i);var o=document.createElement("div");o.className="shape-count",o.textContent=e.terms[a-1],r.appendChild(o),n.appendChild(r),e.draw(a,l)}var c=document.createElement("div");c.className="shape-group";var d=document.createElement("canvas");d.className="shape-canvas",d.width=120,d.height=100,d.style.opacity="0.3",c.appendChild(d);var h=document.createElement("div");h.className="shape-label",h.textContent="Term "+e.predict,c.appendChild(h);var s=document.createElement("div");s.className="shape-count",s.style.color="#f59e0b",s.textContent="?",c.appendChild(s),n.appendChild(c);var m=document.getElementById("tHead");m.innerHTML="<th>n</th>";var f=document.getElementById("tBody");f.innerHTML='<td class="filled">T(n)</td>';for(a=1;a<=4;a++)m.innerHTML+="<th>"+a+"</th>",f.innerHTML+='<td class="filled">'+e.terms[a-1]+"</td>";m.innerHTML+='<th style="color:#f59e0b">'+e.predict+"</th>",f.innerHTML+='<td style="color:#f59e0b">?</td>'}function checkPredict(){if(!answered){var e=levels[ci],t=parseInt(document.getElementById("predictInput").value),n=document.getElementById("fb");if(isNaN(t))return n.textContent="Enter a number!",void(n.className="fb no");if(t===e.answer){answered=!0,score+=10,n.textContent="✓ Correct! T("+e.predict+") = "+e.answer+". The formula is: "+e.formula,n.className="fb ok",document.getElementById("pts").textContent="Score: "+score;var a=document.querySelectorAll(".pdot");a[ci]&&(a[ci].className="pdot done")}else n.textContent="✗ Not quite. Look at the pattern in the differences.",n.className="fb no"}}function showHint(){var e=document.getElementById("fb");e.textContent="💡 "+levels[ci].hint,e.className="fb ok"}function nextLevel(){ci<levels.length-1?(ci++,loadLevel()):(document.getElementById("fb").textContent="🎉 All 8 levels complete! Final score: "+score+"/80",document.getElementById("fb").className="fb ok","function"==typeof celebrate&&celebrate("🎉 "+score+"/80!"))}document.getElementById("predictInput").addEventListener("keydown",function(e){"Enter"===e.key&&checkPredict()}),loadLevel()</script></body></html>
