<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equation Quest — LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e17;color:#e2e8f0;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden}.hdr{padding:10px 20px;background:rgba(13,148,136,.08);border-bottom:1px solid rgba(13,148,136,.2);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#14b8a6;font-weight:700;letter-spacing:1px}.hdr-right{display:flex;align-items:center;gap:16px}.hdr-score{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#14b8a6}.hdr-streak{font-size:.72rem;color:#fbbf24}.progress{display:flex;gap:6px;padding:12px 20px;background:rgba(255,255,255,.02)}.prog-stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default}.prog-bar{height:4px;width:100%;border-radius:2px;background:rgba(255,255,255,.08)}.prog-bar.done{background:#14b8a6}.prog-bar.active{background:#fbbf24;animation:pulse 1.5s ease infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.prog-label{font-size:.58rem;color:#64748b;text-transform:uppercase;letter-spacing:1px}.prog-stage.done .prog-label{color:#14b8a6}.prog-stage.active .prog-label{color:#fbbf24}.game{max-width:640px;margin:0 auto;padding:24px 20px}.stage-intro{text-align:center;padding:40px 20px;animation:fadeIn .5s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}.stage-num{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:#14b8a6;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}.stage-name{font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:10px}.stage-desc{font-size:.88rem;color:#94a3b8;margin-bottom:6px}.stage-ican{font-size:.78rem;color:#14b8a6;font-style:italic;margin-bottom:24px}.btn{padding:12px 32px;border-radius:10px;border:1px solid rgba(20,184,166,.3);background:rgba(20,184,166,.1);color:#14b8a6;font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(20,184,166,.2);border-color:#14b8a6;box-shadow:0 0 20px rgba(20,184,166,.15)}.btn-primary{background:#14b8a6;color:#0a0e17;border-color:#14b8a6}.btn-primary:hover{background:#0d9488}.question{animation:fadeIn .4s ease}.q-display{text-align:center;padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:20px}.q-equation{font-family:'JetBrains Mono',monospace;font-size:2rem;color:#fff;letter-spacing:2px;margin-bottom:8px}.q-equation .highlight{color:#14b8a6;text-decoration:underline;text-underline-offset:4px}.q-instruction{font-size:.82rem;color:#94a3b8}.q-context{font-size:.85rem;color:#cbd5e1;line-height:1.6;padding:14px 18px;background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.15);border-radius:10px;margin-bottom:16px;font-style:italic}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-family:'JetBrains Mono',monospace;font-size:1rem;cursor:pointer;transition:all .2s;text-align:center}.opt:hover:not(.locked){border-color:rgba(20,184,166,.4);background:rgba(20,184,166,.06);transform:translateY(-2px)}.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12);color:#22c55e;animation:correctPop .4s ease}@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08);color:#ef4444}.opt.locked{cursor:default;opacity:.6}.opt.locked.correct{opacity:1}.feedback{margin-top:16px;padding:14px 18px;border-radius:10px;font-size:.85rem;line-height:1.6;animation:fadeIn .3s ease}.fb-correct{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-wrong{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb-wrong strong{color:#ef4444;display:block;margin-bottom:4px}.fb-correct strong{color:#22c55e;display:block;margin-bottom:4px}.next-area{text-align:center;margin-top:16px}.input-row{display:flex;justify-content:center;gap:10px;align-items:center}.q-input{font-family:'JetBrains Mono',monospace;font-size:1.4rem;color:#14b8a6;background:rgba(20,184,166,.06);border:2px solid rgba(20,184,166,.2);border-radius:10px;padding:12px 20px;width:120px;text-align:center;outline:0;transition:border-color .2s}.q-input:focus{border-color:#14b8a6;box-shadow:0 0 16px rgba(20,184,166,.2)}.q-input::placeholder{color:rgba(20,184,166,.25)}.submit-btn{padding:12px 24px;border-radius:10px;border:none;background:#14b8a6;color:#0a0e17;font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}.submit-btn:hover{background:#0d9488;transform:translateY(-1px)}.results{text-align:center;padding:40px 20px;animation:fadeIn .5s ease}.results-score{font-family:'JetBrains Mono',monospace;font-size:3.5rem;color:#14b8a6;font-weight:700}.results-label{font-size:1.2rem;color:#fff;font-weight:700;margin:8px 0}.results-detail{font-size:.88rem;color:#94a3b8;margin-bottom:24px;line-height:1.6}.results-transfer{padding:16px 20px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.88rem;color:#fde68a;margin-bottom:24px;line-height:1.6}.results-actions{display:flex;gap:10px;justify-content:center}.stage-complete{text-align:center;padding:32px 20px;animation:fadeIn .5s ease}.stage-stars{font-size:2rem;margin-bottom:8px}</style><style id="embed-check">.embed-mode .hdr{display:none!important}.embed-mode{padding-top:0!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>⚡ Equation Quest</h1><div class="hdr-right"><span class="hdr-streak" id="streak"></span> <span class="hdr-score" id="score">0 pts</span></div></div><div class="progress" id="progBar"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,streak=0,correct=0,total=0,stageCorrect=0;const STAGES=[{name:"Identify",desc:"Name the parts of an equation",ican:"I can identify variables, coefficients, and constants.",qs:5},{name:"One-Step",desc:"Solve equations with one operation",ican:"I can solve equations like 3x = 12 and x + 5 = 9.",qs:5},{name:"Two-Step",desc:"Solve equations with two operations",ican:"I can solve equations like 2x + 3 = 11.",qs:5},{name:"Brackets",desc:"Expand and solve",ican:"I can solve equations with brackets like 3(x + 2) = 15.",qs:5},{name:"Real World",desc:"Turn words into equations",ican:"I can write and solve equations from word problems.",qs:5}];function randInt(t,e){return t+Math.floor(Math.random()*(e-t+1))}function shuffle(t){for(let e=t.length-1;e>0;e--){const n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}return t}function genStage0(){return shuffle([{eq:"5x + 3 = 18",q:"What is the <em>variable</em> in this equation?",opts:["x","5","3","18"],correct:0,hint:"A variable is a letter that stands for an unknown number.",why:"x is the variable — it represents the number we're trying to find."},{eq:"7y − 2 = 19",q:"What is the <em>coefficient</em> of y?",opts:["7","y","2","19"],correct:0,hint:"The coefficient is the number in front of the variable (multiplying it).",why:"7 is the coefficient — it tells us y is multiplied by 7."},{eq:"4n + 9 = 25",q:"What is the <em>constant</em> on the left side?",opts:["9","4","n","25"],correct:0,hint:"A constant is a number on its own — not attached to a variable.",why:"9 is the constant on the left — it has no variable attached."},{eq:"3a = 21",q:"How many <em>terms</em> are on the left side?",opts:["1","2","3","21"],correct:0,hint:"A term is a number, a variable, or a number × variable. Count them.",why:"3a is one term. The left side has 1 term."},{eq:"2x + 5 = x + 12",q:"How many terms have a <em>variable</em>?",opts:["2","1","3","4"],correct:0,hint:"Look for terms with a letter (x) in them — on BOTH sides.",why:"2x and x both contain the variable x, so there are 2 variable terms."},{eq:"6m − 1 = 17",q:"What operation connects 6m and 1?",opts:["Subtraction","Addition","Multiplication","Division"],correct:0,hint:"Look at the sign between 6m and 1.",why:"The minus sign (−) means subtraction connects 6m and 1."},{eq:"8 + 3k = 29",q:"What is the coefficient of k?",opts:["3","8","29","k"],correct:0,hint:"The coefficient is the number directly multiplying the variable.",why:"3 is the coefficient — it's the number multiplied by k."}]).slice(0,STAGES[0].qs)}function genStage1(){const t=[];for(let e=0;e<STAGES[1].qs;e++){const e=randInt(0,3);let n,s,i,a,o,r;if(0===e){n=randInt(2,12),s=randInt(2,9);const t=s*n;i=`${s}x = ${t}`,a=n,o=`To find x, divide both sides by ${s}. What is ${t} ÷ ${s}?`,r=`${s}x = ${t}, so x = ${t} ÷ ${s} = ${n}. We undo multiplication with division.`}else if(1===e){n=randInt(1,15),s=randInt(2,12);const t=n+s;i=`x + ${s} = ${t}`,a=n,o=`To find x, subtract ${s} from both sides. What is ${t} − ${s}?`,r=`x + ${s} = ${t}, so x = ${t} − ${s} = ${n}. We undo addition with subtraction.`}else if(2===e){n=randInt(5,20),s=randInt(1,n-1);const t=n-s;i=`x − ${s} = ${t}`,a=n,o=`To find x, add ${s} to both sides. What is ${t} + ${s}?`,r=`x − ${s} = ${t}, so x = ${t} + ${s} = ${n}. We undo subtraction with addition.`}else{const t=randInt(2,8);s=randInt(2,6),n=s*t,i=`x ÷ ${s} = ${t}`,a=n,o=`To find x, multiply both sides by ${s}. What is ${t} × ${s}?`,r=`x ÷ ${s} = ${t}, so x = ${t} × ${s} = ${n}. We undo division with multiplication.`}t.push({eq:i,ans:a,hint:o,why:r,input:!0})}return t}function genStage2(){const t=[];for(let e=0;e<STAGES[2].qs;e++){const e=randInt(2,10),n=randInt(2,7),s=randInt(1,9),i=n*e+s,a=`${n}x + ${s} = ${i}`;t.push({eq:a,ans:e,input:!0,hint:`Step 1: Subtract ${s} from both sides → ${n}x = ${i-s}. Step 2: Divide by ${n}.`,why:`${n}x + ${s} = ${i}. Subtract ${s}: ${n}x = ${i-s}. Divide by ${n}: x = ${e}. Always undo addition/subtraction first, THEN multiplication/division.`})}return t}function genStage3(){const t=[];for(let e=0;e<STAGES[3].qs;e++){const e=randInt(1,8),n=randInt(2,5),s=randInt(1,6),i=n*(e+s),a=`${n}(x + ${s}) = ${i}`;t.push({eq:a,ans:e,input:!0,hint:`First expand the bracket: ${n}×x + ${n}×${s} = ${n}x + ${n*s}. Then solve ${n}x + ${n*s} = ${i}.`,why:`${n}(x + ${s}) = ${i}. Expand: ${n}x + ${n*s} = ${i}. Subtract ${n*s}: ${n}x = ${i-n*s}. Divide by ${n}: x = ${e}.`})}return t}function genStage4(){const t=[()=>{const t=randInt(3,12),e=randInt(2,8),n=randInt(5,20),s=e*t+n;return{context:`A taxi charges ¥${n} base fare plus ¥${e} per kilometre. The total fare was ¥${s}. How many kilometres was the ride?`,eq:`${e}x + ${n} = ${s}`,ans:t,input:!0,hint:`Let x = kilometres. The equation is ${e}x + ${n} = ${s}. Subtract ${n} first.`,why:`${e}x + ${n} = ${s}. Subtract ${n}: ${e}x = ${s-n}. Divide by ${e}: x = ${t} km.`}},()=>{const t=randInt(5,15),e=randInt(3,8),n=e*t+randInt(1,10),s=n-e*t;return{context:`You have ¥${n}. After buying ${t} identical items, you have ¥${s} remaining. What is the price of each item?`,eq:`${n} − ${t}p = ${s}`,ans:e,input:!0,hint:`You spent ¥${n-s} total. If you bought ${t} items, divide the total spent by ${t}.`,why:`Total spent = ${n} − ${s} = ${n-s}. Price per item = ${n-s} ÷ ${t} = ¥${e}.`}},()=>{const t=randInt(4,10),e=randInt(2,5),n=randInt(1,6),s=2*(e*t+n);return{context:`A rectangle has length ${e}x and width ${n} cm. Its perimeter is ${s} cm. Find x.`,eq:`2(${e}x + ${n}) = ${s}`,ans:t,input:!0,hint:`Perimeter = 2(length + width). So 2(${e}x + ${n}) = ${s}. Divide by 2 first: ${e}x + ${n} = ${s/2}.`,why:`2(${e}x + ${n}) = ${s}. Divide by 2: ${e}x + ${n} = ${s/2}. Subtract ${n}: ${e}x = ${s/2-n}. Divide by ${e}: x = ${t}.`}},()=>{const t=randInt(10,25),e=randInt(3,6),n=randInt(2,5),s=e*t+n*(e*(e-1)/2);return{context:`${e} friends have consecutive amounts of money, each ¥${n} more than the last. The person with the least has ¥x. Together they have ¥${s}. Find x.`,eq:`${e}x + ${n*e*(e-1)/2} = ${s}`,ans:t,input:!0,hint:`If the smallest amount is x, the amounts are x, x+${n}, x+${2*n}... Sum them and set equal to ${s}.`,why:`Sum = ${e}x + ${n}(0+1+...+${e-1}) = ${e}x + ${n*e*(e-1)/2} = ${s}. So ${e}x = ${s-n*e*(e-1)/2}, x = ${t}.`}},()=>{const t=randInt(2,8),e=randInt(2,4),n=randInt(3,10),s=e*t+n;return{context:`One side of a triangle is x cm. The second side is ${e} times longer plus ${n} cm (which is ${s} cm). Find x.`,eq:`${e}x + ${n} = ${s}`,ans:t,input:!0,hint:`The second side = ${e}x + ${n}, and we know it's ${s} cm. Solve ${e}x + ${n} = ${s}.`,why:`${e}x + ${n} = ${s}. Subtract ${n}: ${e}x = ${s-n}. Divide by ${e}: x = ${t} cm.`}}];return shuffle(t).slice(0,STAGES[4].qs).map(t=>t())}const generators=[genStage0,genStage1,genStage2,genStage3,genStage4];let questions=[];function renderProgress(){document.getElementById("progBar").innerHTML=STAGES.map((t,e)=>`<div class="prog-stage ${e<stage?"done":e===stage?"active":""}">\n    <div class="prog-bar ${e<stage?"done":e===stage?"active":""}"></div>\n    <span class="prog-label">${t.name}</span>\n  </div>`).join("")}function showStageIntro(){const t=STAGES[stage];stageCorrect=0,questions=generators[stage](),qIdx=0,document.getElementById("game").innerHTML=`<div class="stage-intro">\n    <div class="stage-num">Stage ${stage+1} of ${STAGES.length}</div>\n    <div class="stage-name">${t.name}</div>\n    <div class="stage-desc">${t.desc}</div>\n    <div class="stage-ican">"${t.ican}"</div>\n    <button class="btn btn-primary" onclick="showQuestion()">Begin →</button>\n  </div>`,renderProgress()}function showQuestion(){if(qIdx>=questions.length)return void showStageComplete();const t=questions[qIdx],e=document.getElementById("game");let n=`<div class="question">\n    <div class="q-display">\n      <div class="q-instruction">Question ${qIdx+1} of ${questions.length}</div>`;t.context&&(n+=`</div><div class="q-context">📖 ${t.context}</div><div class="q-display">`),n+=`<div class="q-equation">${t.eq}</div>`,t.q&&(n+=`<div class="q-instruction">${t.q}</div>`),n+="</div>",t.opts?n+=`<div class="options">${t.opts.map((t,e)=>`<button class="opt" onclick="checkMC(${e})" id="opt${e}">${t}</button>`).join("")}</div>`:t.input&&(n+=`<div class="q-instruction" style="text-align:center;margin-bottom:12px">Find the value of x${t.context?" (the unknown)":""}:</div>\n    <div class="input-row">\n      <span style="font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:#94a3b8">x =</span>\n      <input class="q-input" type="number" id="qInput" placeholder="?" autofocus onkeydown="if(event.key==='Enter')checkInput()">\n      <button class="submit-btn" onclick="checkInput()">Check</button>\n    </div>`),n+='<div id="feedback"></div><div class="next-area" id="nextArea"></div></div>',e.innerHTML=n,t.input&&document.getElementById("qInput")?.focus()}function checkMC(t){const e=questions[qIdx],n=document.querySelectorAll(".opt");n.forEach(t=>t.classList.add("locked")),total++,t===e.correct?(n[t].classList.add("correct"),handleCorrect(e.why)):(n[t].classList.add("wrong"),n[e.correct].classList.add("correct"),handleWrong(e.hint))}function checkInput(){const t=questions[qIdx],e=document.getElementById("qInput");if(!e)return;const n=parseFloat(e.value);isNaN(n)||(e.disabled=!0,document.querySelector(".submit-btn").disabled=!0,total++,Math.abs(n-t.ans)<.01?(e.style.borderColor="#22c55e",e.style.color="#22c55e",handleCorrect(t.why)):(e.style.borderColor="#ef4444",e.style.color="#ef4444",handleWrong(t.hint)))}function handleCorrect(t){correct++,stageCorrect++,streak++;pts+=10+(streak>=3?2*streak:0),document.getElementById("score").textContent=pts+" pts",document.getElementById("streak").textContent=streak>=2?`🔥 ${streak} streak`:"",document.getElementById("feedback").innerHTML=`<div class="feedback fb-correct"><strong>✅ Correct!${streak>=3?" 🔥 Streak bonus!":""}</strong>${t}</div>`,document.getElementById("nextArea").innerHTML='<button class="btn" onclick="qIdx++;showQuestion()" style="margin-top:8px">Next →</button>'}function handleWrong(t){streak=0,document.getElementById("streak").textContent="",document.getElementById("feedback").innerHTML=`<div class="feedback fb-wrong"><strong>💡 Not quite — here's a hint:</strong>${t}</div>`,document.getElementById("nextArea").innerHTML='<button class="btn" onclick="qIdx++;showQuestion()" style="margin-top:8px">Next →</button>'}function showStageComplete(){const t=Math.round(stageCorrect/questions.length*100),e=t>=80?"⭐⭐⭐":t>=60?"⭐⭐":"⭐";stage<STAGES.length-1?document.getElementById("game").innerHTML=`<div class="stage-complete">\n      <div class="stage-stars">${e}</div>\n      <div class="stage-name">${STAGES[stage].name} Complete!</div>\n      <p style="color:#94a3b8;margin:8px 0">${stageCorrect}/${questions.length} correct</p>\n      <button class="btn btn-primary" onclick="stage++;showStageIntro()" style="margin-top:16px">Next Stage →</button>\n    </div>`:showFinalResults()}function showFinalResults(){const t=Math.round(correct/total*100);let e="🏆 Outstanding!",n="You've mastered equations from basics to real-world applications.";t<50?(e="📚 Keep practising!",n="Equations take time. Try again — focus on the hints when you get stuck."):t<75&&(e="💪 Good progress!",n="You're getting there. The later stages need more practice."),document.getElementById("game").innerHTML=`<div class="results">\n    <div class="results-score">${correct}/${total}</div>\n    <div class="results-label">${e}</div>\n    <div class="results-detail">${n}<br>Final score: ${pts} points</div>\n    <div class="results-transfer">🌍 <strong>Transfer challenge:</strong> Next time you go shopping, try this: if 3 items cost ¥45 total and each costs the same, you just solved 3x = 45 in your head. Equations are everywhere.</div>\n    <div class="results-actions">\n      <button class="btn" onclick="location.reload()">🔄 Play again</button>\n      <a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a>\n    </div>\n  </div>`,renderProgress()}showStageIntro()</script></body></html>
