<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Rate Lab — LearnLattice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;background:linear-gradient(135deg,#e11d48,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{font-size:.82rem;color:#94a3b8;margin-bottom:16px;text-align:center}
.lab{display:flex;gap:20px;max-width:900px;width:100%;flex-wrap:wrap}
.controls{width:260px;flex-shrink:0}
.control-group{margin-bottom:16px;padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px}
.control-group h3{font-size:.78rem;color:#e11d48;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.control-row{margin-bottom:10px}
.control-row label{display:block;font-size:.72rem;color:#94a3b8;margin-bottom:4px}
.control-row input[type=range]{width:100%;accent-color:#e11d48}
.control-row .val{font-family:'Courier New',monospace;font-size:.85rem;color:#f43f5e;font-weight:700}
.sim-area{flex:1;min-width:300px;overflow:hidden}
.beaker{position:relative;width:100%;aspect-ratio:4/3;background:#0f172a;border:2px solid #334155;border-radius:0 0 16px 16px;border-top:none;overflow:hidden}
.beaker::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:#334155;border-radius:2px}
.beaker-liquid{position:absolute;bottom:0;left:0;right:0;height:70%;transition:background .5s;border-radius:0 0 14px 14px}
.particle{position:absolute;border-radius:50%;transition:none}
.data-panel{margin-top:12px;padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px}
.data-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1e293b;font-size:.82rem}
.data-row:last-child{border:none}
.data-label{color:#94a3b8}
.data-value{color:#e11d48;font-weight:700;font-family:'Courier New',monospace}
.btn-run{width:100%;padding:12px;border:none;border-radius:10px;background:#e11d48;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;margin-top:8px;font-family:inherit}
.btn-run:hover{background:#be123c;transform:translateY(-1px)}
.btn-run:active{transform:scale(.97)}
.btn-run:disabled{opacity:.4;cursor:default;transform:none}
.progress{height:6px;background:#1e293b;border-radius:3px;margin-top:8px;overflow:hidden}
.progress-bar{height:100%;background:#e11d48;border-radius:3px;transition:width .3s;width:0}
.insight{margin-top:12px;padding:10px 14px;background:rgba(225,29,72,.08);border:1px solid rgba(225,29,72,.2);border-radius:8px;font-size:.78rem;color:#f87171;line-height:1.5}
.insight strong{color:#fff}
</style>
</head>
<body>
<h1>Reaction Rate Lab</h1>
<p class="subtitle">Adjust temperature, concentration, and surface area. Watch how particles collide.</p>

<div class="lab">
  <div class="controls">
    <div class="control-group">
      <h3>🌡️ Temperature</h3>
      <div class="control-row">
        <label>Temperature: <span class="val" id="tempVal">25°C</span></label>
        <input type="range" id="temp" min="10" max="100" value="25" oninput="updateSim()">
      </div>
    </div>
    <div class="control-group">
      <h3>🧪 Concentration</h3>
      <div class="control-row">
        <label>Particles: <span class="val" id="concVal">20</span></label>
        <input type="range" id="conc" min="5" max="60" value="20" oninput="updateSim()">
      </div>
    </div>
    <div class="control-group">
      <h3>📏 Surface Area</h3>
      <div class="control-row">
        <label>Particle size: <span class="val" id="saVal">Medium</span></label>
        <input type="range" id="sa" min="1" max="3" value="2" step="1" oninput="updateSim()">
      </div>
    </div>
    <div class="control-group">
      <h3>⚗️ Catalyst</h3>
      <div class="control-row">
        <label><input type="checkbox" id="catalyst" onchange="updateSim()"> Add catalyst</label>
      </div>
    </div>
    <button class="btn-run" id="runBtn" onclick="runExperiment()">▶ Run Experiment (10s)</button>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div class="sim-area">
    <div class="beaker" id="beaker">
      <div class="beaker-liquid" id="liquid"></div>
    </div>
    <div class="data-panel">
      <div class="data-row"><span class="data-label">Collisions</span><span class="data-value" id="collisions">0</span></div>
      <div class="data-row"><span class="data-label">Successful reactions</span><span class="data-value" id="reactions">0</span></div>
      <div class="data-row"><span class="data-label">Reaction rate</span><span class="data-value" id="rate">0 /s</span></div>
      <div class="data-row"><span class="data-label">Avg. particle speed</span><span class="data-value" id="speed">0 px/s</span></div>
    </div>
    <div class="insight" id="insight" style="display:none"></div>
  </div>
</div>

<script>
const beaker=document.getElementById('beaker');
const liquid=document.getElementById('liquid');
let particles=[],animFrame=null,running=false;
let collisionCount=0,reactionCount=0,startTime=0;
const sizeLabels={1:'Small (powder)',2:'Medium (chunks)',3:'Large (whole)'};

function updateSim(){
  const temp=+document.getElementById('temp').value;
  const conc=+document.getElementById('conc').value;
  const sa=+document.getElementById('sa').value;
  const cat=document.getElementById('catalyst').checked;
  document.getElementById('tempVal').textContent=temp+'°C';
  document.getElementById('concVal').textContent=conc;
  document.getElementById('saVal').textContent=sizeLabels[sa];

  // Liquid color based on concentration
  const alpha=Math.min(0.3+conc/100,0.7);
  liquid.style.background=`rgba(225,29,72,${alpha})`;

  if(!running)initParticles();
}

function initParticles(){
  const conc=+document.getElementById('conc').value;
  const sa=+document.getElementById('sa').value;
  const rect=beaker.getBoundingClientRect();
  const w=rect.width,h=rect.height*0.7;

  // Clear old
  particles.forEach(p=>p.el&&p.el.remove());
  particles=[];

  const sizes={1:4,2:7,3:11};
  const r=sizes[sa];

  for(let i=0;i<conc;i++){
    const el=document.createElement('div');
    el.className='particle';
    const isReactant=i%3===0;
    el.style.width=el.style.height=(r*2)+'px';
    el.style.background=isReactant?'#f43f5e':'#fbbf24';
    el.style.opacity='0.8';
    beaker.appendChild(el);
    particles.push({
      el,x:20+Math.random()*(w-40),y:h*0.3+Math.random()*h*0.65,
      vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,
      r,isReactant,reacted:false
    });
  }
  positionParticles();
}

function positionParticles(){
  particles.forEach(p=>{
    p.el.style.left=(p.x-p.r)+'px';
    p.el.style.top=(p.y-p.r)+'px';
  });
}

function runExperiment(){
  if(running)return;
  running=true;
  collisionCount=0;reactionCount=0;startTime=Date.now();
  document.getElementById('runBtn').disabled=true;
  document.getElementById('insight').style.display='none';

  const temp=+document.getElementById('temp').value;
  const cat=document.getElementById('catalyst').checked;
  const speedMult=(temp/25)*(cat?1.8:1);
  const activationThreshold=cat?0.8:1.5;

  // Set velocities based on temperature
  particles.forEach(p=>{
    p.vx=(Math.random()-.5)*3*speedMult;
    p.vy=(Math.random()-.5)*3*speedMult;
    p.reacted=false;
    p.el.style.opacity='0.8';
    p.el.style.background=p.isReactant?'#f43f5e':'#fbbf24';
  });

  const rect=beaker.getBoundingClientRect();
  const w=rect.width,h=rect.height;
  const liquidTop=h*0.3;

  function step(){
    if(!running)return;
    const elapsed=(Date.now()-startTime)/1000;
    document.getElementById('progressBar').style.width=(elapsed/10*100)+'%';

    if(elapsed>=10){
      running=false;
      document.getElementById('runBtn').disabled=false;
      document.getElementById('progressBar').style.width='100%';
      showInsight();
      return;
    }

    // Move particles
    particles.forEach(p=>{
      if(p.reacted)return;
      p.x+=p.vx;p.y+=p.vy;
      // Bounce off walls
      if(p.x<p.r){p.x=p.r;p.vx*=-1}
      if(p.x>w-p.r){p.x=w-p.r;p.vx*=-1}
      if(p.y<liquidTop+p.r){p.y=liquidTop+p.r;p.vy*=-1}
      if(p.y>h-p.r){p.y=h-p.r;p.vy*=-1}
    });

    // Check collisions
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a=particles[i],b=particles[j];
        if(a.reacted||b.reacted)continue;
        const dx=a.x-b.x,dy=a.y-b.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<a.r+b.r){
          collisionCount++;
          // Bounce
          const nx=dx/dist,ny=dy/dist;
          a.vx+=nx*0.5;a.vy+=ny*0.5;
          b.vx-=nx*0.5;b.vy-=ny*0.5;
          // Check if reaction occurs (need enough energy)
          const relSpeed=Math.sqrt((a.vx-b.vx)**2+(a.vy-b.vy)**2);
          if(a.isReactant!==b.isReactant&&relSpeed>activationThreshold){
            reactionCount++;
            a.reacted=b.reacted=true;
            a.el.style.background=b.el.style.background='#22c55e';
            a.el.style.opacity=b.el.style.opacity='0.4';
            a.vx=a.vy=b.vx=b.vy=0;
          }
        }
      }
    }

    positionParticles();

    // Update readings
    const avgSpeed=particles.filter(p=>!p.reacted).reduce((s,p)=>s+Math.sqrt(p.vx**2+p.vy**2),0)/Math.max(1,particles.filter(p=>!p.reacted).length);
    document.getElementById('collisions').textContent=collisionCount;
    document.getElementById('reactions').textContent=reactionCount;
    document.getElementById('rate').textContent=(reactionCount/Math.max(0.1,elapsed)).toFixed(1)+' /s';
    document.getElementById('speed').textContent=avgSpeed.toFixed(1)+' px/s';

    animFrame=requestAnimationFrame(step);
  }
  step();
}

function showInsight(){
  const temp=+document.getElementById('temp').value;
  const conc=+document.getElementById('conc').value;
  const cat=document.getElementById('catalyst').checked;
  const sa=+document.getElementById('sa').value;
  const rate=reactionCount/10;

  let msg='';
  if(rate<0.5)msg=`<strong>Very slow reaction.</strong> Only ${reactionCount} successful reactions in 10 seconds. `;
  else if(rate<2)msg=`<strong>Moderate reaction rate.</strong> ${reactionCount} reactions in 10 seconds. `;
  else msg=`<strong>Fast reaction!</strong> ${reactionCount} reactions in 10 seconds. `;

  if(temp<30)msg+=`The low temperature (${temp}°C) means particles move slowly — fewer collisions have enough energy to react. `;
  else if(temp>70)msg+=`The high temperature (${temp}°C) gives particles more kinetic energy — more collisions exceed the activation energy. `;

  if(cat)msg+=`The catalyst lowered the activation energy, allowing more collisions to succeed. `;
  if(sa===1)msg+=`Small particles (powder) have high surface area, exposing more reactant to collisions. `;
  if(conc>40)msg+=`High concentration means more particles in the same space — more frequent collisions.`;

  const el=document.getElementById('insight');
  el.innerHTML=msg;
  el.style.display='block';
}

updateSim();
</script>
</body>
</html>
