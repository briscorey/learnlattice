<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ratio Blaster — LearnLattice</title>
<!-- MYP: Key Concept: Relationships, Related: Equivalence, Simplification, ATL: Transfer -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{background:#0c0a1a;color:#e2e8f0;font-family:'Space Grotesk',sans-serif;min-height:100vh}
.hdr{padding:10px 20px;background:rgba(236,72,153,.06);border-bottom:1px solid rgba(236,72,153,.15);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#f9a8d4;font-weight:700}.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#f9a8d4}
.progress{display:flex;gap:6px;padding:10px 20px;background:rgba(0,0,0,.2)}.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-bottom:4px}.pg-bar.done{background:#ec4899}.pg-bar.active{background:#f59e0b;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pg-label{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}.pg.done .pg-label{color:#ec4899}.pg.active .pg-label{color:#f59e0b}
.game{max-width:640px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#ec4899;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:700;margin-bottom:8px}.s-desc{font-size:.85rem;color:#94a3b8;margin-bottom:4px}.s-ican{font-size:.78rem;color:#f9a8d4;font-style:italic;margin-bottom:20px}
.btn{padding:12px 28px;border-radius:10px;border:1px solid rgba(236,72,153,.3);background:rgba(236,72,153,.1);color:#f9a8d4;font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{background:rgba(236,72,153,.2);border-color:#ec4899;transform:translateY(-2px)}.btn-go{background:#ec4899;color:#fff;border-color:#ec4899}.btn-go:hover{background:#db2777}
.q{animation:fadeIn .4s}.q-card{padding:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:16px}.q-num{font-size:.65rem;color:#ec4899;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.q-text{font-size:1rem;font-weight:600;color:#fff;margin-bottom:16px;line-height:1.5}
.q-visual{text-align:center;padding:16px;background:rgba(236,72,153,.04);border:1px solid rgba(236,72,153,.12);border-radius:12px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:1.4rem;color:#f9a8d4;letter-spacing:2px}
.q-context{font-size:.85rem;color:#cbd5e1;line-height:1.6;padding:12px 16px;background:rgba(251,191,36,.04);border:1px solid rgba(251,191,36,.12);border-radius:10px;margin-bottom:16px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts-1{grid-template-columns:1fr}
.opt{padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e2e8f0;font-size:.88rem;cursor:pointer;transition:all .2s;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:500}.opt:hover:not(.locked){border-color:rgba(236,72,153,.4);background:rgba(236,72,153,.06);transform:translateY(-2px)}.opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}.opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}
.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5;animation:fadeIn .3s}.fb-ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}.fb-no{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#fca5a5}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}
.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#ec4899;font-weight:700}.r-label{font-size:1.1rem;font-weight:700;margin:6px 0}.r-detail{font-size:.85rem;color:#94a3b8;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:10px;font-size:.85rem;color:#fde68a;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}
.sd{text-align:center;padding:28px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}
</style>
<style id="ec">.embed-mode .hdr{display:none!important}</style>
<script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed-mode');</script>
</head><body>
<div class="hdr"><h1>🚀 Ratio Blaster</h1><span class="pts" id="pts">0 pts</span></div>
<div class="progress" id="prog"></div>
<div class="game" id="game"></div>
<script>
let stage=0,qIdx=0,pts=0,correct=0,total=0,sc=0;
const STG=[{name:'Simplify',desc:'Reduce ratios to simplest form',ican:'I can simplify a ratio by dividing by the HCF.',qs:5},{name:'Missing Value',desc:'Find the unknown in a ratio',ican:'I can find a missing value when ratios are equivalent.',qs:5},{name:'Scale',desc:'Scale quantities up and down',ican:'I can use ratios to scale recipes and mixtures.',qs:5},{name:'Real World',desc:'Solve proportion problems',ican:'I can apply ratio reasoning to maps, sharing, and mixing.',qs:5}];
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gcd(a,b){return b?gcd(b,a%b):a}

function gen0(){const qs=[];for(let i=0;i<STG[0].qs;i++){const g=ri(2,6);const a=ri(1,5)*g,b=ri(1,5)*g;const sa=a/g,sb=b/g;const w1=`${a/ri(1,g-1>1?g-1:2)}:${b/ri(1,g-1>1?g-1:2)}`,w2=`${sa+1}:${sb}`,w3=`${a}:${b}`;const opts=sh([`${sa}:${sb}`,w2,w3,`${sb}:${sa}`]);qs.push({visual:`${a} : ${b}`,q:`Simplify the ratio <strong>${a} : ${b}</strong>`,opts,correct:opts.indexOf(`${sa}:${sb}`),hint:`Find the HCF of ${a} and ${b}. HCF = ${g}. Divide both by ${g}.`,why:`HCF(${a}, ${b}) = ${g}. So ${a}÷${g} : ${b}÷${g} = ${sa}:${sb}.`})}return qs}

function gen1(){const qs=[];for(let i=0;i<STG[1].qs;i++){const a=ri(2,6),b=ri(2,6),m=ri(2,5);const opts=sh([m*b,m*b+a,m*a,m*b-1].map(String));qs.push({visual:`${a} : ${b} = ${m*a} : ?`,q:`If <strong>${a} : ${b} = ${m*a} : ?</strong>, find the missing value.`,opts,correct:opts.indexOf(String(m*b)),hint:`${a} was multiplied by ${m} to get ${m*a}. Multiply ${b} by the same number.`,why:`${a} × ${m} = ${m*a}, so ${b} × ${m} = ${m*b}. The ratio is ${m*a}:${m*b}.`})}return qs}

function gen2(){return sh([
  {q:'A recipe for 4 people uses 300g flour. How much for 6 people?',opts:['450g','500g','350g','600g'],correct:0,hint:'Scale factor = 6÷4 = 1.5. Multiply 300 by 1.5.',why:'6÷4 = 1.5. 300g × 1.5 = 450g flour for 6 people.'},
  {q:'Paint is mixed in ratio 3:1 (blue:white). You need 20 litres total. How much blue?',opts:['15 L','12 L','16 L','10 L'],correct:0,hint:'Total parts = 3+1 = 4. Blue = 3/4 of 20.',why:'3+1 = 4 parts. Blue = 3/4 × 20 = 15 litres.'},
  {q:'A smoothie uses fruit:yogurt = 5:2. You have 400ml yogurt. How much fruit?',opts:['1000 ml','800 ml','500 ml','1200 ml'],correct:0,hint:'If 2 parts = 400ml, then 1 part = 200ml. Fruit = 5 parts.',why:'1 part = 400÷2 = 200ml. Fruit = 5 × 200 = 1000ml.'},
  {q:'Concrete mix is cement:sand:gravel = 1:2:3. For 180kg total, how much sand?',opts:['60 kg','90 kg','30 kg','45 kg'],correct:0,hint:'Total parts = 1+2+3 = 6. Sand = 2/6 of 180.',why:'6 parts total. Sand = 2/6 × 180 = 60kg.'},
  {q:'A recipe for 12 cookies uses 2 eggs. How many eggs for 30 cookies?',opts:['5','6','4','3'],correct:0,hint:'Scale factor = 30÷12 = 2.5. Multiply 2 by 2.5.',why:'30÷12 = 2.5. Eggs = 2 × 2.5 = 5 eggs.'},
  {q:'Orange juice concentrate:water = 1:4. To make 2.5L of juice, how much concentrate?',opts:['500 ml','400 ml','625 ml','250 ml'],correct:0,hint:'Total parts = 1+4 = 5. Concentrate = 1/5 of 2500ml.',why:'5 parts. Concentrate = 2500÷5 = 500ml.'},
  {q:'A map scale is 1:25000. Two towns are 8cm apart on the map. Real distance?',opts:['2 km','2.5 km','0.8 km','4 km'],correct:0,hint:'8cm × 25000 = 200000cm. Convert to km.',why:'8 × 25000 = 200,000cm = 2,000m = 2km.'},
  {q:'Mortar mix is cement:sand = 1:5. You need 24kg total. How much cement?',opts:['4 kg','5 kg','6 kg','3 kg'],correct:0,hint:'Total parts = 6. Cement = 1/6 of 24.',why:'1+5 = 6 parts. Cement = 24÷6 = 4kg.'},
  {q:'A photo is 4:3 ratio. Width is 20cm. What is the height?',opts:['15 cm','16 cm','12 cm','18 cm'],correct:0,hint:'4 parts = 20cm, so 1 part = 5cm. Height = 3 parts.',why:'1 part = 20÷4 = 5cm. Height = 3×5 = 15cm.'},
  {q:'Squash:water = 1:9. You pour 50ml squash. How much water?',opts:['450 ml','400 ml','500 ml','350 ml'],correct:0,hint:'1 part squash = 50ml. Water = 9 parts.',why:'9 × 50 = 450ml water.'},
  {q:'Purple paint is red:blue = 3:2. How much blue for 750ml total?',opts:['300 ml','375 ml','250 ml','400 ml'],correct:0,hint:'Total parts = 5. Blue = 2/5 of 750.',why:'2/5 × 750 = 300ml blue.'}
]).slice(0,STG[2].qs)}

function gen3(){return sh([
  {context:'A map has scale 1:50,000. Two towns are 3cm apart on the map.',q:'What is the real distance between the towns?',opts:['1.5 km','3 km','0.5 km','15 km'],correct:0,hint:'Real distance = 3 × 50,000 = 150,000 cm. Convert to km (÷100,000).',why:'3 × 50,000 = 150,000cm = 1,500m = 1.5km.'},
  {context:'¥720 is shared between Ali and Ben in the ratio 5:3.',q:'How much does Ali get?',opts:['¥450','¥360','¥400','¥500'],correct:0,hint:'Total parts = 5+3 = 8. Ali gets 5/8 of ¥720.',why:'8 parts. Ali = 5/8 × 720 = ¥450.'},
  {context:'A car travels 240km on 20L of fuel.',q:'How far can it travel on 35L?',opts:['420 km','350 km','480 km','300 km'],correct:0,hint:'km per litre = 240÷20 = 12. Multiply by 35.',why:'12 km/L × 35L = 420km.'},
  {context:'3 workers paint a fence in 8 hours.',q:'How long for 6 workers (same rate)?',opts:['4 hours','6 hours','12 hours','3 hours'],correct:0,hint:'Double the workers = half the time. This is inverse proportion.',why:'More workers → less time. 3×8 = 6×t, so t = 24÷6 = 4 hours. Inverse proportion.'},
  {context:'A shop sells 250g of cheese for ¥18.75.',q:'What is the cost of 400g?',opts:['¥30','¥25','¥37.50','¥22.50'],correct:0,hint:'Price per gram = 18.75÷250 = ¥0.075. Multiply by 400.',why:'¥18.75÷250 = ¥0.075/g. 400 × 0.075 = ¥30.'},
  {context:'In a class, the ratio of boys to girls is 3:5. There are 15 girls.',q:'How many students are in the class?',opts:['24','20','30','18'],correct:0,hint:'If 5 parts = 15, then 1 part = 3. Boys = 3×3 = 9. Total = 9+15.',why:'1 part = 15÷5 = 3. Boys = 3×3 = 9. Total = 9+15 = 24.'},
  {context:'A school trip costs ¥4800 for 16 students.',q:'How much for 22 students?',opts:['¥6600','¥7200','¥5400','¥5800'],correct:0,hint:'Cost per student = 4800÷16. Then multiply by 22.',why:'¥4800÷16 = ¥300/student. 22×300 = ¥6600.'},
  {context:'Lemonade recipe: 2 lemons for every 500ml water. You have 7 lemons.',q:'How much water do you need?',opts:['1750 ml','1500 ml','2000 ml','1400 ml'],correct:0,hint:'2 lemons → 500ml. So 1 lemon → 250ml. 7 lemons → ?',why:'1 lemon = 250ml water. 7 × 250 = 1750ml.'},
  {context:'A printer uses 8ml ink per 50 pages.',q:'How many pages from a 200ml cartridge?',opts:['1250','1000','1600','800'],correct:0,hint:'Pages per ml = 50÷8. Then multiply by 200.',why:'50÷8 = 6.25 pages/ml. 6.25 × 200 = 1250 pages.'},
  {context:'Exchange rate: ¥100 = $12.50.',q:'How many yen for $75?',opts:['¥600','¥500','¥750','¥650'],correct:0,hint:'¥100 = $12.50, so ¥1 = $0.125. For $75: 75÷0.125.',why:'¥1 = $0.125. $75 ÷ $0.125 = ¥600.'},
  {context:'Bronze is copper:tin = 9:1. You need 3kg of bronze.',q:'How much copper?',opts:['2.7 kg','2.5 kg','3 kg','2.4 kg'],correct:0,hint:'Total parts = 10. Copper = 9/10 of 3kg.',why:'9/10 × 3 = 2.7kg copper.'}
]).slice(0,STG[3].qs)}

const generators=[gen0,gen1,gen2,gen3];let questions=[];
function renderProg(){document.getElementById('prog').innerHTML=STG.map((s,i)=>`<div class="pg ${i<stage?'done':i===stage?'active':''}"><div class="pg-bar ${i<stage?'done':i===stage?'active':''}"></div><span class="pg-label">${s.name}</span></div>`).join('')}
function showIntro(){sc=0;questions=generators[stage]();qIdx=0;document.getElementById('game').innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STG.length}</div><div class="s-name">${STG[stage].name}</div><div class="s-desc">${STG[stage].desc}</div><div class="s-ican">"${STG[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`;renderProg()}
function showQ(){if(qIdx>=questions.length){showSD();return}const q=questions[qIdx];let h=`<div class="q"><div class="q-card"><div class="q-num">Q${qIdx+1} of ${questions.length}</div>`;if(q.context)h+=`<div class="q-context">📖 ${q.context}</div>`;if(q.visual)h+=`<div class="q-visual">${q.visual}</div>`;h+=`<div class="q-text">${q.q}</div><div class="opts ${q.opts.some(o=>o.length>25)?'opts-1':''}">${q.opts.map((o,i)=>`<button class="opt" onclick="check(${i})" id="o${i}">${o}</button>`).join('')}</div></div><div id="fb"></div><div class="next" id="nx"></div></div>`;document.getElementById('game').innerHTML=h}
function check(i){const q=questions[qIdx];total++;document.querySelectorAll('.opt').forEach(o=>o.classList.add('locked'));if(i===q.correct){document.getElementById('o'+i).classList.add('correct');correct++;sc++;pts+=10;document.getElementById('pts').textContent=pts+' pts';document.getElementById('fb').innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!</strong>${q.why}</div>`}else{document.getElementById('o'+i).classList.add('wrong');document.getElementById('o'+q.correct).classList.add('correct');document.getElementById('fb').innerHTML=`<div class="fb fb-no"><strong>💡 Hint:</strong>${q.hint}</div>`}document.getElementById('nx').innerHTML=`<button class="btn" onclick="qIdx++;showQ()">Next →</button>`}
function showSD(){const p=Math.round(sc/questions.length*100);const s=p>=80?'⭐⭐⭐':p>=60?'⭐⭐':'⭐';if(stage<STG.length-1){document.getElementById('game').innerHTML=`<div class="sd"><div class="sd-stars">${s}</div><div class="s-name">${STG[stage].name} Complete!</div><p style="color:#94a3b8;margin:8px 0">${sc}/${questions.length}</p><button class="btn btn-go" onclick="stage++;showIntro()">Next Stage →</button></div>`}else showResults()}
function showResults(){const p=Math.round(correct/total*100);let l='🏆 Ratio Master!',d='You can simplify, scale, and apply ratios to real problems.';if(p<50){l='🚀 Keep blasting!';d='Ratios take practice. Focus on finding the scale factor.'}else if(p<75){l='🚀 Good aim!';d='Solid foundation. The real-world problems need more practice.'}document.getElementById('game').innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${l}</div><div class="r-detail">${d}<br>Score: ${pts} pts</div><div class="r-transfer">🌍 <strong>Ratios everywhere:</strong> Recipes (double the ingredients), maps (1cm = 50km), screen resolution (16:9), and even your heartbeat (beats per minute is a rate — a type of ratio).</div><div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`;renderProg()}
showIntro();
</script></body></html>
