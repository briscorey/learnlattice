<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Fighter. LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#fef7ed;color:#1c1917;font-family:Nunito,sans-serif;min-height:100vh}.hdr{padding:10px 20px;background:#fff;border-bottom:2px solid #fed7aa;display:flex;justify-content:space-between;align-items:center}h1{font-size:1.1rem;color:#ea580c;font-weight:800}.hdr-r{display:flex;gap:14px;align-items:center}.streak{font-size:.72rem;color:#f59e0b;font-weight:700}.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#ea580c;font-weight:600}.progress{display:flex;gap:6px;padding:10px 20px;background:#fff8f0}.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:#fed7aa;margin-bottom:4px}.pg-bar.done{background:#ea580c}.pg-bar.active{background:#f59e0b;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pg-label{font-size:.55rem;color:#9a3412;opacity:.5;text-transform:uppercase;letter-spacing:1px}.pg.done .pg-label{color:#ea580c;opacity:1}.pg.active .pg-label{color:#f59e0b;opacity:1}.game{max-width:600px;margin:0 auto;padding:20px}.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.s-num{font-size:.6rem;color:#ea580c;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}.s-name{font-size:1.5rem;font-weight:800;color:#7c2d12;margin-bottom:8px}.s-desc{font-size:.85rem;color:#9a3412;margin-bottom:4px}.s-ican{font-size:.78rem;color:#ea580c;font-style:italic;margin-bottom:20px}.btn{padding:12px 28px;border-radius:12px;border:2px solid #fed7aa;background:#fff;color:#ea580c;font-family:Nunito,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}.btn:hover{background:#fff7ed;border-color:#ea580c;transform:translateY(-2px);box-shadow:0 4px 12px rgba(234,88,12,.12)}.btn-go{background:#ea580c;color:#fff;border-color:#ea580c}.btn-go:hover{background:#c2410c}.q{animation:fadeIn .4s}.q-card{padding:24px;background:#fff;border:2px solid #fed7aa;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 16px rgba(234,88,12,.06)}.q-num{font-size:.65rem;color:#ea580c;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.q-text{font-size:1rem;font-weight:700;color:#7c2d12;margin-bottom:16px;line-height:1.5}.frac-visual{display:flex;justify-content:center;gap:4px;margin-bottom:16px;flex-wrap:wrap}.frac-bar{display:flex;border-radius:8px;overflow:hidden;border:2px solid #7c2d12;height:40px}.frac-piece{height:100%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;min-width:28px;border-right:1px solid rgba(255,255,255,.3)}.frac-piece:last-child{border-right:none}.frac-piece.filled{background:#ea580c}.frac-piece.empty{background:#fed7aa;color:#9a3412}.frac-compare{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px}.frac-display{text-align:center}.frac-num{font-family:'JetBrains Mono',monospace;font-size:1.8rem;font-weight:800;color:#7c2d12;display:flex;flex-direction:column;align-items:center}.frac-line{width:40px;height:3px;background:#7c2d12;margin:4px 0}.frac-vs{font-size:1.2rem;color:#f59e0b;font-weight:800}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts-3{grid-template-columns:1fr 1fr 1fr}.opt{padding:14px 16px;border-radius:12px;border:2px solid #fed7aa;background:#fff;color:#7c2d12;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;font-family:Nunito,sans-serif}.opt:hover:not(.locked){border-color:#ea580c;background:#fff7ed;transform:translateY(-2px)}.opt.correct{border-color:#16a34a;background:#dcfce7;color:#166534}.opt.wrong{border-color:#ef4444;background:#fee2e2;color:#991b1b}.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5}.fb-ok{background:#dcfce7;border:1px solid #bbf7d0;color:#166534}.fb-no{background:#fee2e2;border:1px solid #fecaca;color:#991b1b}.fb strong{display:block;margin-bottom:2px}.next{text-align:center;margin-top:12px}.input-row{display:flex;justify-content:center;gap:8px;align-items:center}.q-input{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:#ea580c;background:#fff7ed;border:2px solid #fed7aa;border-radius:10px;padding:10px 16px;width:80px;text-align:center;outline:0}.q-input:focus{border-color:#ea580c}.frac-slash{font-size:1.5rem;color:#7c2d12;font-weight:800}.sub-btn{padding:10px 20px;border-radius:10px;border:none;background:#ea580c;color:#fff;font-weight:700;cursor:pointer;font-family:Nunito,sans-serif}.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#ea580c;font-weight:800}.r-label{font-size:1.1rem;font-weight:800;color:#7c2d12;margin:6px 0}.r-detail{font-size:.85rem;color:#9a3412;margin-bottom:20px;line-height:1.5}.r-transfer{padding:14px 18px;background:#fef3c7;border:1px solid #fde68a;border-radius:10px;font-size:.85rem;color:#92400e;margin-bottom:20px;line-height:1.5}.r-actions{display:flex;gap:8px;justify-content:center}.sd{text-align:center;padding:28px;animation:fadeIn .5s}.sd-stars{font-size:2rem;margin-bottom:6px}.q-context{font-size:.85rem;color:#92400e;line-height:1.5;padding:12px 16px;background:#fef3c7;border:1px solid #fde68a;border-radius:10px;margin-bottom:16px;font-style:italic}@media(max-width:480px){.frac-visual{overflow-x:auto}.frac-bar{min-width:200px}.frac-compare{gap:12px}.opts{grid-template-columns:1fr}}</style><style id="ec">.embed-mode .hdr{display:none!important}@media(max-width:480px){.frac-visual{overflow-x:auto}.frac-bar{min-width:200px}.frac-compare{gap:12px}.opts{grid-template-columns:1fr}}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="hdr"><h1>🍕 Fraction Fighter</h1><div class="hdr-r"><span class="streak" id="strk"></span><span class="pts" id="pts">0 pts</span></div></div><div class="progress" id="prog"></div><div class="game" id="game"></div><script>let stage=0,qIdx=0,pts=0,streak=0,correct=0,total=0,sc=0;const STAGES=[{name:"See It",desc:"Identify fractions from pictures",ican:"I can read a fraction from a visual model.",qs:5},{name:"Same Value",desc:"Find equivalent fractions",ican:"I can find fractions that are equal in value.",qs:5},{name:"Compare",desc:"Which fraction is bigger?",ican:"I can compare and order fractions.",qs:5},{name:"Calculate",desc:"Add and subtract fractions",ican:"I can add and subtract fractions with different denominators.",qs:5},{name:"Real World",desc:"Fractions in everyday life",ican:"I can solve real-world problems using fractions.",qs:5}];function ri(t,e){return t+Math.floor(Math.random()*(e-t+1))}function sh(t){for(let e=t.length-1;e>0;e--){const s=Math.floor(Math.random()*(e+1));[t[e],t[s]]=[t[s],t[e]]}return t}function gcd(t,e){return e?gcd(e,t%e):t}function simplify(t,e){const s=gcd(Math.abs(t),Math.abs(e));return[t/s,e/s]}function gen0(){const t=[];for(let e=0;e<STAGES[0].qs;e++){const e=sh([2,3,4,5,6,8])[0],s=ri(1,e-1),n=Array(e).fill(!1);for(let t=0;t<s;t++)n[t]=!0;const o=sh([`${s}/${e}`,`${s+1}/${e}`,`${s}/${e+1}`,`${e}/${s}`]);t.push({n:s,d:e,pieces:n,opts:o,correct:o.indexOf(`${s}/${e}`),hint:`Count the filled pieces (${s}) and the total pieces (${e}). The fraction is filled/total.`,why:`${s} out of ${e} pieces are filled, so the fraction is ${s}/${e}.`})}return t}function gen1(){const t=[];for(let e=0;e<STAGES[1].qs;e++){const e=sh([2,3,4,5,6])[0],s=ri(1,e-1),n=ri(2,4),o=s*n,a=e*n,i=sh([`${o}/${a}`,`${s*n+1}/${e*n}`,`${s*n}/${e*n+1}`,`${s+n}/${e+n}`]);t.push({frac:`${s}/${e}`,opts:i,correct:i.indexOf(`${o}/${a}`),hint:`Multiply BOTH the numerator and denominator by the same number. ${s}×${n}=${o}, ${e}×${n}=${a}.`,why:`${s}/${e} = ${o}/${a} (multiply top and bottom by ${n}). Equivalent fractions have the same value.`})}return t}function gen2(){const t=[];for(let e=0;e<STAGES[2].qs;e++){const e=sh([2,3,4,5,6,8])[0],s=sh([2,3,4,5,6,8].filter(t=>t!==e))[0],n=ri(1,e-1),o=ri(1,s-1),a=n/e,i=o/s;let c;c=Math.abs(a-i)<.001?"=":a>i?">":"<",t.push({n1:n,d1:e,n2:o,d2:s,opts:[">","<","="],correct:[">","<","="].indexOf(c),type:"compare",hint:`Convert to decimals: ${n}/${e} = ${a.toFixed(3)} and ${o}/${s} = ${i.toFixed(3)}. Or find a common denominator.`,why:`${n}/${e} = ${a.toFixed(3)} and ${o}/${s} = ${i.toFixed(3)}. So ${n}/${e} ${c} ${o}/${s}.`})}return t}function gen3(){const t=[];for(let e=0;e<STAGES[3].qs;e++){const e=Math.random()>.4,s=sh([2,3,4,5,6])[0],n=sh([2,3,4,5,6].filter(t=>t!==s))[0],o=ri(1,s-1),a=ri(1,n-1),i=s*n/gcd(s,n),c=o*(i/s),r=a*(i/n);let d=e?c+r:c-r;d<=0&&(d=c+r);const l=d===c+r?"+":"−",[$,u]=simplify(d,i),m=1===u?`${$}`:`${$}/${u}`,f=sh([`${o+a}/${s+n}`,`${d}/${i+1}`,`${d+1}/${i}`]).slice(0,3),p=sh([m,...f]);t.push({n1:o,d1:s,n2:a,d2:n,op:l,opts:p,correct:p.indexOf(m),hint:`Step 1: Find common denominator (${i}). Step 2: ${o}/${s} = ${c}/${i} and ${a}/${n} = ${r}/${i}. Step 3: ${c} ${l} ${r} = ${d}. Answer: ${d}/${i}${$!==d?" = "+m:""}.`,why:`${o}/${s} ${l} ${a}/${n} = ${c}/${i} ${l} ${r}/${i} = ${d}/${i}${$!==d?" = "+m:""}. Always find a common denominator first!`})}return t}function gen4(){return sh([{context:"A pizza is cut into 8 slices. You eat 3 slices. Your friend eats 2 slices. What fraction of the pizza is left?",opts:["3/8","5/8","2/8","6/8"],correct:0,hint:"Total eaten: 3+2=5 slices out of 8. Left = 8-5 = 3 slices.",why:"3+2=5 slices eaten. 8-5=3 slices left. That's 3/8 of the pizza."},{context:"A recipe needs ¾ cup of flour. You want to make half the recipe. How much flour do you need?",opts:["3/8 cup","3/4 cup","1/2 cup","6/8 cup"],correct:0,hint:"Half of ¾ means ½ × ¾. Multiply numerators and denominators.",why:"½ × ¾ = 3/8 cup. To halve a fraction, multiply by ½."},{context:"A phone battery is at 2/5. After charging for an hour, it's at 4/5. What fraction of charge was added?",opts:["2/5","3/5","1/5","4/5"],correct:0,hint:"Charge added = final − initial = 4/5 − 2/5.",why:"4/5 − 2/5 = 2/5. Same denominator, so just subtract the numerators."},{context:"A class has 30 students. 2/5 are girls. How many girls are in the class?",opts:["12","15","6","20"],correct:0,hint:"2/5 of 30 means 2/5 × 30 = ?",why:"2/5 × 30 = (2×30)/5 = 60/5 = 12 girls."},{context:"You ran 3/4 km in the morning and 1/2 km in the evening. How far did you run in total?",opts:["1 1/4 km","1 km","5/6 km","3/8 km"],correct:0,hint:"3/4 + 1/2. Find common denominator (4): 3/4 + 2/4 = ?",why:"3/4 + 2/4 = 5/4 = 1 1/4 km. Convert to a common denominator, then add."},{context:"A tank is 5/6 full. You use 1/3 of the tank. What fraction is left?",opts:["1/2","2/3","5/6","1/6"],correct:0,hint:"5/6 − 1/3. Common denominator is 6: 5/6 − 2/6 = ?",why:"5/6 − 2/6 = 3/6 = 1/2. Always simplify your final answer."}]).slice(0,STAGES[4].qs)}const generators=[gen0,gen1,gen2,gen3,gen4];let questions=[];function renderProg(){document.getElementById("prog").innerHTML=STAGES.map((t,e)=>`<div class="pg ${e<stage?"done":e===stage?"active":""}"><div class="pg-bar ${e<stage?"done":e===stage?"active":""}"></div><span class="pg-label">${t.name}</span></div>`).join("")}function showIntro(){sc=0,questions=generators[stage](),qIdx=0,document.getElementById("game").innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STAGES.length}</div><div class="s-name">${STAGES[stage].name}</div><div class="s-desc">${STAGES[stage].desc}</div><div class="s-ican">"${STAGES[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`,renderProg()}function showQ(){if(qIdx>=questions.length)return void showSD();const t=questions[qIdx];let e=`<div class="q"><div class="q-card"><div class="q-num">Question ${qIdx+1} of ${questions.length}</div>`;if(0===stage)e+='<div class="q-text">What fraction is shaded?</div>',e+='<div class="frac-visual"><div class="frac-bar">',t.pieces.forEach((t,s)=>{e+=`<div class="frac-piece ${t?"filled":"empty"}">${s+1}</div>`}),e+="</div></div>",e+=`<div class="opts">${t.opts.map((t,e)=>`<button class="opt" onclick="check(${e})" id="o${e}">${t}</button>`).join("")}</div>`;else if(1===stage){e+=`<div class="q-text">Which fraction is equivalent to <strong>${t.frac}</strong>?</div>`;const[s,n]=t.frac.split("/").map(Number);e+='<div class="frac-visual"><div class="frac-bar">';for(let t=0;t<n;t++)e+=`<div class="frac-piece ${t<s?"filled":"empty"}"></div>`;e+="</div></div>",e+=`<div class="opts">${t.opts.map((t,e)=>`<button class="opt" onclick="check(${e})" id="o${e}">${t}</button>`).join("")}</div>`}else 2===stage?(e+='<div class="q-text">Compare these fractions:</div>',e+=`<div class="frac-compare">\n      <div class="frac-display"><div class="frac-num"><span>${t.n1}</span><div class="frac-line"></div><span>${t.d1}</span></div></div>\n      <span class="frac-vs">?</span>\n      <div class="frac-display"><div class="frac-num"><span>${t.n2}</span><div class="frac-line"></div><span>${t.d2}</span></div></div>\n    </div>`,e+=`<div class="opts opts-3">${t.opts.map((t,e)=>`<button class="opt" onclick="check(${e})" id="o${e}" style="font-size:1.5rem">${t}</button>`).join("")}</div>`):3===stage?(e+=`<div class="q-text">Calculate: <strong style="font-family:'JetBrains Mono',monospace;font-size:1.2rem">${t.n1}/${t.d1} ${t.op} ${t.n2}/${t.d2}</strong></div>`,e+=`<div class="opts">${t.opts.map((t,e)=>`<button class="opt" onclick="check(${e})" id="o${e}" style="font-family:'JetBrains Mono',monospace">${t}</button>`).join("")}</div>`):(e+=`<div class="q-context">📖 ${t.context}</div>`,e+=`<div class="opts">${t.opts.map((t,e)=>`<button class="opt" onclick="check(${e})" id="o${e}">${t}</button>`).join("")}</div>`);e+='</div><div id="fb"></div><div class="next" id="nx"></div></div>',document.getElementById("game").innerHTML=e}function check(t){const e=questions[qIdx];total++,document.querySelectorAll(".opt").forEach(t=>t.classList.add("locked")),t===e.correct?(document.getElementById("o"+t).classList.add("correct"),correct++,sc++,streak++,pts+=10+(streak>=3?2*streak:0),document.getElementById("pts").textContent=pts+" pts",document.getElementById("strk").textContent=streak>=2?`🔥${streak}`:"",document.getElementById("fb").innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!${streak>=3?" 🔥 Streak!":""}</strong>${e.why}</div>`):(document.getElementById("o"+t).classList.add("wrong"),document.getElementById("o"+e.correct).classList.add("correct"),streak=0,document.getElementById("strk").textContent="",document.getElementById("fb").innerHTML=`<div class="fb fb-no"><strong>💡 Not quite:</strong>${e.hint}</div>`),document.getElementById("nx").innerHTML='<button class="btn" onclick="qIdx++;showQ()">Next →</button>'}function showSD(){const t=Math.round(sc/questions.length*100),e=t>=80?"⭐⭐⭐":t>=60?"⭐⭐":"⭐";stage<STAGES.length-1?document.getElementById("game").innerHTML=`<div class="sd"><div class="sd-stars">${e}</div><div class="s-name">${STAGES[stage].name} Complete!</div><p style="color:#9a3412;margin:8px 0">${sc}/${questions.length} correct</p><button class="btn btn-go" onclick="stage++;showIntro()">Next Stage →</button></div>`:showResults()}function showResults(){const t=Math.round(correct/total*100);let e="🏆 Fraction Master!",s="You can see, compare, calculate, and apply fractions.";t<50?(e="🍕 Keep slicing!",s="Fractions take practice. Try visualising them as pizza slices or bar models."):t<75&&(e="🍕 Getting there!",s="Good progress. The calculation and word problem stages need more work."),document.getElementById("game").innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${e}</div><div class="r-detail">${s}<br>Score: ${pts} points</div>\n  <div class="r-transfer">🌍 <strong>Fractions are everywhere:</strong> Cooking (½ cup), music (¾ time), sales (1/3 off), sports (batting .333 = 1/3). Next time you see a fraction, picture the bar model in your head.</div>\n  <div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`,renderProg()}showIntro()</script></body></html>
