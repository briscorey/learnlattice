<!DOCTYPE html>
<html lang="en">
<head>

<title>Fraction Fighter — LearnLattice</title>
<!-- MYP Alignment
  Criteria: A – Knowing & Understanding
  Key Concept: Form
  Related Concepts: Equivalence, Representation
  ATL: Critical thinking
  Global Context: Scientific and Technical Innovation

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fef7ed;color:#1c1917;font-family:'Nunito',sans-serif;min-height:100vh}
.hdr{padding:10px 20px;background:#fff;border-bottom:2px solid #fed7aa;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.1rem;color:#ea580c;font-weight:800}
.hdr-r{display:flex;gap:14px;align-items:center}
.streak{font-size:.72rem;color:#f59e0b;font-weight:700}
.pts{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#ea580c;font-weight:600}
.progress{display:flex;gap:6px;padding:10px 20px;background:#fff8f0}
.pg{flex:1;text-align:center}.pg-bar{height:4px;border-radius:2px;background:#fed7aa;margin-bottom:4px}
.pg-bar.done{background:#ea580c}.pg-bar.active{background:#f59e0b;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pg-label{font-size:.55rem;color:#9a3412;opacity:.5;text-transform:uppercase;letter-spacing:1px}
.pg.done .pg-label{color:#ea580c;opacity:1}.pg.active .pg-label{color:#f59e0b;opacity:1}
.game{max-width:600px;margin:0 auto;padding:20px}
.intro{text-align:center;padding:32px 16px;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.s-num{font-size:.6rem;color:#ea580c;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.s-name{font-size:1.5rem;font-weight:800;color:#7c2d12;margin-bottom:8px}
.s-desc{font-size:.85rem;color:#9a3412;margin-bottom:4px}
.s-ican{font-size:.78rem;color:#ea580c;font-style:italic;margin-bottom:20px}
.btn{padding:12px 28px;border-radius:12px;border:2px solid #fed7aa;background:#fff;color:#ea580c;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn:hover{background:#fff7ed;border-color:#ea580c;transform:translateY(-2px);box-shadow:0 4px 12px rgba(234,88,12,.12)}
.btn-go{background:#ea580c;color:#fff;border-color:#ea580c}.btn-go:hover{background:#c2410c}
.q{animation:fadeIn .4s}
.q-card{padding:24px;background:#fff;border:2px solid #fed7aa;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 16px rgba(234,88,12,.06)}
.q-num{font-size:.65rem;color:#ea580c;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.q-text{font-size:1rem;font-weight:700;color:#7c2d12;margin-bottom:16px;line-height:1.5}
/* Fraction visual */
.frac-visual{display:flex;justify-content:center;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.frac-bar{display:flex;border-radius:8px;overflow:hidden;border:2px solid #7c2d12;height:40px}
.frac-piece{height:100%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;min-width:28px;border-right:1px solid rgba(255,255,255,.3)}
.frac-piece:last-child{border-right:none}
.frac-piece.filled{background:#ea580c}
.frac-piece.empty{background:#fed7aa;color:#9a3412}
/* Comparison */
.frac-compare{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px}
.frac-display{text-align:center}
.frac-num{font-family:'JetBrains Mono',monospace;font-size:1.8rem;font-weight:800;color:#7c2d12;display:flex;flex-direction:column;align-items:center}
.frac-line{width:40px;height:3px;background:#7c2d12;margin:4px 0}
.frac-vs{font-size:1.2rem;color:#f59e0b;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts-3{grid-template-columns:1fr 1fr 1fr}
.opt{padding:14px 16px;border-radius:12px;border:2px solid #fed7aa;background:#fff;color:#7c2d12;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;font-family:'Nunito',sans-serif}
.opt:hover:not(.locked){border-color:#ea580c;background:#fff7ed;transform:translateY(-2px)}
.opt.correct{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.wrong{border-color:#ef4444;background:#fee2e2;color:#991b1b}
.opt.locked{cursor:default;opacity:.5}.opt.locked.correct{opacity:1}
.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.82rem;line-height:1.5}
.fb-ok{background:#dcfce7;border:1px solid #bbf7d0;color:#166534}
.fb-no{background:#fee2e2;border:1px solid #fecaca;color:#991b1b}
.fb strong{display:block;margin-bottom:2px}
.next{text-align:center;margin-top:12px}
/* Input */
.input-row{display:flex;justify-content:center;gap:8px;align-items:center}
.q-input{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:#ea580c;background:#fff7ed;border:2px solid #fed7aa;border-radius:10px;padding:10px 16px;width:80px;text-align:center;outline:none}
.q-input:focus{border-color:#ea580c}
.frac-slash{font-size:1.5rem;color:#7c2d12;font-weight:800}
.sub-btn{padding:10px 20px;border-radius:10px;border:none;background:#ea580c;color:#fff;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
/* Results */
.results{text-align:center;padding:36px 16px;animation:fadeIn .5s}
.r-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:#ea580c;font-weight:800}
.r-label{font-size:1.1rem;font-weight:800;color:#7c2d12;margin:6px 0}
.r-detail{font-size:.85rem;color:#9a3412;margin-bottom:20px;line-height:1.5}
.r-transfer{padding:14px 18px;background:#fef3c7;border:1px solid #fde68a;border-radius:10px;font-size:.85rem;color:#92400e;margin-bottom:20px;line-height:1.5}
.r-actions{display:flex;gap:8px;justify-content:center}
.sd{text-align:center;padding:28px;animation:fadeIn .5s}
.sd-stars{font-size:2rem;margin-bottom:6px}
.q-context{font-size:.85rem;color:#92400e;line-height:1.5;padding:12px 16px;background:#fef3c7;border:1px solid #fde68a;border-radius:10px;margin-bottom:16px;font-style:italic}
@media(max-width:480px){.frac-visual{overflow-x:auto}.frac-bar{min-width:200px}.frac-compare{gap:12px}.opts{grid-template-columns:1fr}}</style>
<style id="ec">.embed-mode .hdr{display:none!important}@media(max-width:480px){.frac-visual{overflow-x:auto}.frac-bar{min-width:200px}.frac-compare{gap:12px}.opts{grid-template-columns:1fr}}</style>
<script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed-mode');</script>
</head>
<body>
<div class="hdr"><h1>🍕 Fraction Fighter</h1><div class="hdr-r"><span class="streak" id="strk"></span><span class="pts" id="pts">0 pts</span></div></div>
<div class="progress" id="prog"></div>
<div class="game" id="game"></div>
<script>
let stage=0,qIdx=0,pts=0,streak=0,correct=0,total=0,sc=0;
const STAGES=[
  {name:'See It',desc:'Identify fractions from pictures',ican:'I can read a fraction from a visual model.',qs:5},
  {name:'Same Value',desc:'Find equivalent fractions',ican:'I can find fractions that are equal in value.',qs:5},
  {name:'Compare',desc:'Which fraction is bigger?',ican:'I can compare and order fractions.',qs:5},
  {name:'Calculate',desc:'Add and subtract fractions',ican:'I can add and subtract fractions with different denominators.',qs:5},
  {name:'Real World',desc:'Fractions in everyday life',ican:'I can solve real-world problems using fractions.',qs:5}
];
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gcd(a,b){return b?gcd(b,a%b):a}
function simplify(n,d){const g=gcd(Math.abs(n),Math.abs(d));return[n/g,d/g]}

// STAGE 1: Visual identification
function gen0(){
  const qs=[];
  for(let i=0;i<STAGES[0].qs;i++){
    const d=sh([2,3,4,5,6,8])[0];
    const n=ri(1,d-1);
    const pieces=Array(d).fill(false);
    for(let j=0;j<n;j++)pieces[j]=true;
    const wrong1=`${n+1}/${d}`,wrong2=`${n}/${d+1}`,wrong3=`${d}/${n}`;
    const opts=sh([`${n}/${d}`,wrong1,wrong2,wrong3]);
    qs.push({n,d,pieces,opts,correct:opts.indexOf(`${n}/${d}`),
      hint:`Count the filled pieces (${n}) and the total pieces (${d}). The fraction is filled/total.`,
      why:`${n} out of ${d} pieces are filled, so the fraction is ${n}/${d}.`});
  }
  return qs;
}

// STAGE 2: Equivalent fractions
function gen1(){
  const qs=[];
  for(let i=0;i<STAGES[1].qs;i++){
    const d=sh([2,3,4,5,6])[0];
    const n=ri(1,d-1);
    const mult=ri(2,4);
    const eqN=n*mult,eqD=d*mult;
    const wrong1=`${n*mult+1}/${d*mult}`,wrong2=`${n*mult}/${d*mult+1}`,wrong3=`${n+mult}/${d+mult}`;
    const opts=sh([`${eqN}/${eqD}`,wrong1,wrong2,wrong3]);
    qs.push({frac:`${n}/${d}`,opts,correct:opts.indexOf(`${eqN}/${eqD}`),
      hint:`Multiply BOTH the numerator and denominator by the same number. ${n}×${mult}=${eqN}, ${d}×${mult}=${eqD}.`,
      why:`${n}/${d} = ${eqN}/${eqD} (multiply top and bottom by ${mult}). Equivalent fractions have the same value.`});
  }
  return qs;
}

// STAGE 3: Compare
function gen2(){
  const qs=[];
  for(let i=0;i<STAGES[2].qs;i++){
    const d1=sh([2,3,4,5,6,8])[0];
    const d2=sh([2,3,4,5,6,8].filter(x=>x!==d1))[0];
    const n1=ri(1,d1-1),n2=ri(1,d2-1);
    const v1=n1/d1,v2=n2/d2;
    let correctAns;
    if(Math.abs(v1-v2)<0.001)correctAns='=';
    else if(v1>v2)correctAns='>';
    else correctAns='<';
    qs.push({n1,d1,n2,d2,opts:['>','<','='],correct:['>', '<', '='].indexOf(correctAns),type:'compare',
      hint:`Convert to decimals: ${n1}/${d1} = ${(v1).toFixed(3)} and ${n2}/${d2} = ${(v2).toFixed(3)}. Or find a common denominator.`,
      why:`${n1}/${d1} = ${(v1).toFixed(3)} and ${n2}/${d2} = ${(v2).toFixed(3)}. So ${n1}/${d1} ${correctAns} ${n2}/${d2}.`});
  }
  return qs;
}

// STAGE 4: Add/subtract
function gen3(){
  const qs=[];
  for(let i=0;i<STAGES[3].qs;i++){
    const isAdd=Math.random()>0.4;
    const d1=sh([2,3,4,5,6])[0];
    const d2=sh([2,3,4,5,6].filter(x=>x!==d1))[0];
    const n1=ri(1,d1-1),n2=ri(1,d2-1);
    const lcd=d1*d2/gcd(d1,d2);
    const adj1=n1*(lcd/d1),adj2=n2*(lcd/d2);
    let resN=isAdd?adj1+adj2:adj1-adj2;
    if(resN<=0){resN=adj1+adj2;}// force addition if subtraction gives 0 or negative
    const op=resN===(adj1+adj2)?'+':'−';
    const [sn,sd]=simplify(resN,lcd);
    const ansStr=sd===1?`${sn}`:`${sn}/${sd}`;
    // Generate wrong answers
    const wrongs=sh([`${n1+n2}/${d1+d2}`,`${resN}/${lcd+1}`,`${resN+1}/${lcd}`]).slice(0,3);
    const opts=sh([ansStr,...wrongs]);
    const nn1=op==='+'?n1:n1,nn2=op==='+'?n2:n2;
    qs.push({n1,d1,n2,d2,op,opts,correct:opts.indexOf(ansStr),
      hint:`Step 1: Find common denominator (${lcd}). Step 2: ${n1}/${d1} = ${adj1}/${lcd} and ${n2}/${d2} = ${adj2}/${lcd}. Step 3: ${adj1} ${op} ${adj2} = ${resN}. Answer: ${resN}/${lcd}${sn!==resN?' = '+ansStr:''}.`,
      why:`${n1}/${d1} ${op} ${n2}/${d2} = ${adj1}/${lcd} ${op} ${adj2}/${lcd} = ${resN}/${lcd}${sn!==resN?' = '+ansStr:''}. Always find a common denominator first!`});
  }
  return qs;
}

// STAGE 5: Real world
function gen4(){
  const qs=[
    {context:'A pizza is cut into 8 slices. You eat 3 slices. Your friend eats 2 slices. What fraction of the pizza is left?',
      opts:['3/8','5/8','2/8','6/8'],correct:0,
      hint:'Total eaten: 3+2=5 slices out of 8. Left = 8-5 = 3 slices.',
      why:'3+2=5 slices eaten. 8-5=3 slices left. That\'s 3/8 of the pizza.'},
    {context:'A recipe needs ¾ cup of flour. You want to make half the recipe. How much flour do you need?',
      opts:['3/8 cup','3/4 cup','1/2 cup','6/8 cup'],correct:0,
      hint:'Half of ¾ means ½ × ¾. Multiply numerators and denominators.',
      why:'½ × ¾ = 3/8 cup. To halve a fraction, multiply by ½.'},
    {context:'A phone battery is at 2/5. After charging for an hour, it\'s at 4/5. What fraction of charge was added?',
      opts:['2/5','3/5','1/5','4/5'],correct:0,
      hint:'Charge added = final − initial = 4/5 − 2/5.',
      why:'4/5 − 2/5 = 2/5. Same denominator, so just subtract the numerators.'},
    {context:'A class has 30 students. 2/5 are girls. How many girls are in the class?',
      opts:['12','15','6','20'],correct:0,
      hint:'2/5 of 30 means 2/5 × 30 = ?',
      why:'2/5 × 30 = (2×30)/5 = 60/5 = 12 girls.'},
    {context:'You ran 3/4 km in the morning and 1/2 km in the evening. How far did you run in total?',
      opts:['1 1/4 km','1 km','5/6 km','3/8 km'],correct:0,
      hint:'3/4 + 1/2. Find common denominator (4): 3/4 + 2/4 = ?',
      why:'3/4 + 2/4 = 5/4 = 1 1/4 km. Convert to a common denominator, then add.'},
    {context:'A tank is 5/6 full. You use 1/3 of the tank. What fraction is left?',
      opts:['1/2','2/3','5/6','1/6'],correct:0,
      hint:'5/6 − 1/3. Common denominator is 6: 5/6 − 2/6 = ?',
      why:'5/6 − 2/6 = 3/6 = 1/2. Always simplify your final answer.'},
  ];
  return sh(qs).slice(0,STAGES[4].qs);
}

const generators=[gen0,gen1,gen2,gen3,gen4];
let questions=[];

function renderProg(){
  document.getElementById('prog').innerHTML=STAGES.map((s,i)=>`<div class="pg ${i<stage?'done':i===stage?'active':''}"><div class="pg-bar ${i<stage?'done':i===stage?'active':''}"></div><span class="pg-label">${s.name}</span></div>`).join('');
}

function showIntro(){
  sc=0;questions=generators[stage]();qIdx=0;
  document.getElementById('game').innerHTML=`<div class="intro"><div class="s-num">Stage ${stage+1} of ${STAGES.length}</div><div class="s-name">${STAGES[stage].name}</div><div class="s-desc">${STAGES[stage].desc}</div><div class="s-ican">"${STAGES[stage].ican}"</div><button class="btn btn-go" onclick="showQ()">Begin →</button></div>`;
  renderProg();
}

function showQ(){
  if(qIdx>=questions.length){showSD();return}
  const q=questions[qIdx];
  let html=`<div class="q"><div class="q-card"><div class="q-num">Question ${qIdx+1} of ${questions.length}</div>`;

  if(stage===0){
    // Visual
    html+=`<div class="q-text">What fraction is shaded?</div>`;
    html+=`<div class="frac-visual"><div class="frac-bar">`;
    q.pieces.forEach((filled,i)=>{html+=`<div class="frac-piece ${filled?'filled':'empty'}">${i+1}</div>`});
    html+=`</div></div>`;
    html+=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="check(${i})" id="o${i}">${o}</button>`).join('')}</div>`;
  } else if(stage===1){
    html+=`<div class="q-text">Which fraction is equivalent to <strong>${q.frac}</strong>?</div>`;
    // Show visual bar for the original
    const [n,d]=q.frac.split('/').map(Number);
    html+=`<div class="frac-visual"><div class="frac-bar">`;
    for(let i=0;i<d;i++)html+=`<div class="frac-piece ${i<n?'filled':'empty'}"></div>`;
    html+=`</div></div>`;
    html+=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="check(${i})" id="o${i}">${o}</button>`).join('')}</div>`;
  } else if(stage===2){
    html+=`<div class="q-text">Compare these fractions:</div>`;
    html+=`<div class="frac-compare">
      <div class="frac-display"><div class="frac-num"><span>${q.n1}</span><div class="frac-line"></div><span>${q.d1}</span></div></div>
      <span class="frac-vs">?</span>
      <div class="frac-display"><div class="frac-num"><span>${q.n2}</span><div class="frac-line"></div><span>${q.d2}</span></div></div>
    </div>`;
    html+=`<div class="opts opts-3">${q.opts.map((o,i)=>`<button class="opt" onclick="check(${i})" id="o${i}" style="font-size:1.5rem">${o}</button>`).join('')}</div>`;
  } else if(stage===3){
    html+=`<div class="q-text">Calculate: <strong style="font-family:'JetBrains Mono',monospace;font-size:1.2rem">${q.n1}/${q.d1} ${q.op} ${q.n2}/${q.d2}</strong></div>`;
    html+=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="check(${i})" id="o${i}" style="font-family:'JetBrains Mono',monospace">${o}</button>`).join('')}</div>`;
  } else {
    html+=`<div class="q-context">📖 ${q.context}</div>`;
    html+=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="check(${i})" id="o${i}">${o}</button>`).join('')}</div>`;
  }

  html+=`</div><div id="fb"></div><div class="next" id="nx"></div></div>`;
  document.getElementById('game').innerHTML=html;
}

function check(i){
  const q=questions[qIdx];total++;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('locked'));
  if(i===q.correct){
    document.getElementById('o'+i).classList.add('correct');
    correct++;sc++;streak++;pts+=10+(streak>=3?streak*2:0);
    document.getElementById('pts').textContent=pts+' pts';
    document.getElementById('strk').textContent=streak>=2?`🔥${streak}`:'';
    document.getElementById('fb').innerHTML=`<div class="fb fb-ok"><strong>✅ Correct!${streak>=3?' 🔥 Streak!':''}</strong>${q.why}</div>`;
  }else{
    document.getElementById('o'+i).classList.add('wrong');
    document.getElementById('o'+q.correct).classList.add('correct');
    streak=0;document.getElementById('strk').textContent='';
    document.getElementById('fb').innerHTML=`<div class="fb fb-no"><strong>💡 Not quite:</strong>${q.hint}</div>`;
  }
  document.getElementById('nx').innerHTML=`<button class="btn" onclick="qIdx++;showQ()">Next →</button>`;
}

function showSD(){
  const pct=Math.round(sc/questions.length*100);
  const stars=pct>=80?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
  if(stage<STAGES.length-1){
    document.getElementById('game').innerHTML=`<div class="sd"><div class="sd-stars">${stars}</div><div class="s-name">${STAGES[stage].name} Complete!</div><p style="color:#9a3412;margin:8px 0">${sc}/${questions.length} correct</p><button class="btn btn-go" onclick="stage++;showIntro()">Next Stage →</button></div>`;
  }else{showResults()}
}

function showResults(){
  const pct=Math.round(correct/total*100);
  let label='🏆 Fraction Master!',detail='You can see, compare, calculate, and apply fractions.';
  if(pct<50){label='🍕 Keep slicing!';detail='Fractions take practice. Try visualising them as pizza slices or bar models.'}
  else if(pct<75){label='🍕 Getting there!';detail='Good progress. The calculation and word problem stages need more work.'}
  document.getElementById('game').innerHTML=`<div class="results"><div class="r-score">${correct}/${total}</div><div class="r-label">${label}</div><div class="r-detail">${detail}<br>Score: ${pts} points</div>
  <div class="r-transfer">🌍 <strong>Fractions are everywhere:</strong> Cooking (½ cup), music (¾ time), sales (1/3 off), sports (batting .333 = 1/3). Next time you see a fraction, picture the bar model in your head.</div>
  <div class="r-actions"><button class="btn" onclick="location.reload()">🔄 Play again</button><a class="btn" href="/games/" target="_top" style="text-decoration:none">← All games</a></div></div>`;renderProg();
}

showIntro();
</script>
</body>
</html>
