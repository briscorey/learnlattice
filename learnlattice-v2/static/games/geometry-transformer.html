<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Transformer — LearnLattice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.header{padding:12px 20px;background:#0f172a;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
h1{font-size:1.2rem;background:linear-gradient(135deg,#0D9488,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.controls{display:flex;gap:6px;flex-wrap:wrap}
.ctrl{padding:6px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.78rem;transition:all .15s;display:flex;align-items:center;gap:4px}
.ctrl:hover{border-color:#0D9488;color:#e2e8f0}
.ctrl.active{background:#0D9488;border-color:#0D9488;color:#fff}
.main-area{flex:1;display:flex;overflow:hidden}
.canvas-wrap{flex:1;position:relative}
canvas{touch-action:none;display:block;width:100%;height:100%;cursor:crosshair}
.panel{width:220px;background:#0f172a;border-left:1px solid #1e293b;padding:12px;overflow-y:auto;overflow-x:hidden}
.panel-title{font-size:.68rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.transform-group{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1e293b}
.transform-group h3{font-size:.85rem;color:#e2e8f0;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.transform-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;overflow:hidden}
.transform-row label{font-size:.72rem;color:#94a3b8;min-width:16px;flex-shrink:0;overflow:hidden}
.transform-row input[type=range]{flex:1;accent-color:#0D9488}
.transform-row .val{font-family:"Courier New",monospace;font-size:.72rem;color:#0D9488;width:32px;text-align:right;flex-shrink:0}
.history{margin-top:12px}
.history-item{font-size:.72rem;color:#94a3b8;padding:4px 8px;margin-bottom:3px;background:#1e293b;border-radius:6px;border:1px solid #334155}
.coords{position:absolute;bottom:10px;left:10px;font-family:'Courier New',monospace;font-size:.72rem;color:#64748b;background:rgba(15,23,42,.8);padding:4px 10px;border-radius:6px;backdrop-filter:blur(4px)}
.challenge-bar{padding:10px 20px;background:#1e293b;border-top:1px solid #334155;font-size:.82rem;text-align:center;color:#94a3b8}
.challenge-bar strong{color:#0D9488}
</style>
<style id="embed-check">.embed-mode .hdr,.embed-mode .header,.embed-mode>div:first-child:not(.wrap):not(.main):not(.game):not(.lab):not(.arena){display:none!important}.embed-mode{padding-top:0!important}</style>
<script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed-mode');</script>
</head>
<body>
<div class="header">
  <h1>Geometry Transformer</h1><a href="/games/" style="font-size:.72rem;color:#94a3b8;text-decoration:none;opacity:.7;margin-left:8px">← All Games</a>
  <div class="controls">
    <button class="ctrl active" data-shape="triangle" onclick="setShape('triangle')">△ Triangle</button>
    <button class="ctrl" data-shape="square" onclick="setShape('square')">□ Square</button>
    <button class="ctrl" data-shape="lshape" onclick="setShape('lshape')">⌐ L-Shape</button>
    <button class="ctrl" onclick="resetTransforms()">↺ Reset</button>
  </div>
</div>
<div class="main-area">
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="coords" id="coords">(0, 0)</div>
  </div>
  <div class="panel">
    <div class="panel-title">Transformations</div>

    <div class="transform-group">
      <h3>↔ Translate</h3>
      <div class="transform-row"><label>X:</label><input type="range" id="tx" min="-8" max="8" value="0" step="1" oninput="updateTransform()"><span class="val" id="txv">0</span></div>
      <div class="transform-row"><label>Y:</label><input type="range" id="ty" min="-8" max="8" value="0" step="1" oninput="updateTransform()"><span class="val" id="tyv">0</span></div>
    </div>

    <div class="transform-group">
      <h3>↻ Rotate</h3>
      <div class="transform-row"><label>Angle:</label><input type="range" id="rot" min="0" max="360" value="0" step="15" oninput="updateTransform()"><span class="val" id="rotv">0°</span></div>
    </div>

    <div class="transform-group">
      <h3>↕ Reflect</h3>
      <div class="transform-row">
        <button class="ctrl" id="refX" onclick="toggleReflect('x')">X-axis</button>
        <button class="ctrl" id="refY" onclick="toggleReflect('y')">Y-axis</button>
      </div>
    </div>

    <div class="transform-group">
      <h3>⤢ Enlarge</h3>
      <div class="transform-row"><label>Scale:</label><input type="range" id="scale" min="0.5" max="3" value="1" step="0.25" oninput="updateTransform()"><span class="val" id="scalev">1×</span></div>
    </div>

    <div class="panel-title" style="margin-top:12px">History</div>
    <div class="history" id="history"></div>
  </div>
</div>
<div class="challenge-bar" id="challengeBar">
  Apply transformations using the sliders. The <strong>original shape</strong> stays grey — your <strong>transformed shape</strong> moves in real time.
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H,UNIT,originX,originY;
let currentShape='triangle';
let transforms={tx:0,ty:0,rot:0,scale:1,refX:false,refY:false};
let history=[];

const shapes={
  triangle:[[0,0],[4,0],[2,3]],
  square:[[0,0],[3,0],[3,3],[0,3]],
  lshape:[[0,0],[4,0],[4,1],[1,1],[1,3],[0,3]]
};

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  W=canvas.width=r.width;H=canvas.height=r.height;
  UNIT=Math.min(W,H)/20;
  originX=W/2;originY=H/2;
  draw();
}
window.addEventListener('resize',resize);

function toScreen(x,y){return[originX+x*UNIT,originY-y*UNIT]}
function fromScreen(sx,sy){return[Math.round((sx-originX)/UNIT*10)/10,Math.round((originY-sy)/UNIT*10)/10]}

function drawGrid(){
  ctx.strokeStyle='#1e293b';ctx.lineWidth=.5;
  for(let x=-10;x<=10;x++){const[sx]=toScreen(x,0);ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke()}
  for(let y=-10;y<=10;y++){const[,sy]=toScreen(0,y);ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke()}
  // Axes
  ctx.strokeStyle='#334155';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,originY);ctx.lineTo(W,originY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(originX,0);ctx.lineTo(originX,H);ctx.stroke();
  // Labels
  ctx.fillStyle='#64748b';ctx.font='10px sans-serif';ctx.textAlign='center';
  for(let x=-9;x<=9;x++){if(x===0)continue;const[sx]=toScreen(x,0);ctx.fillText(x,sx,originY+14)}
  ctx.textAlign='right';
  for(let y=-9;y<=9;y++){if(y===0)continue;const[,sy]=toScreen(0,y);ctx.fillText(y,originX-6,sy+4)}
}

function drawShape(pts,fill,stroke,lineW,alpha=1){
  if(pts.length<2)return;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.beginPath();
  const[sx,sy]=toScreen(pts[0][0],pts[0][1]);
  ctx.moveTo(sx,sy);
  for(let i=1;i<pts.length;i++){const[x,y]=toScreen(pts[i][0],pts[i][1]);ctx.lineTo(x,y)}
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=stroke;ctx.lineWidth=lineW;ctx.stroke();
  // Vertices
  pts.forEach(p=>{
    const[x,y]=toScreen(p[0],p[1]);
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=stroke;ctx.fill();
  });
  ctx.restore();
}

function applyTransforms(pts){
  let result=pts.map(p=>[...p]);
  // Center of shape for rotation/scale
  const cx=result.reduce((s,p)=>s+p[0],0)/result.length;
  const cy=result.reduce((s,p)=>s+p[1],0)/result.length;
  // Scale
  if(transforms.scale!==1){
    result=result.map(([x,y])=>[(x-cx)*transforms.scale+cx,(y-cy)*transforms.scale+cy]);
  }
  // Rotate
  if(transforms.rot!==0){
    const rad=transforms.rot*Math.PI/180;
    result=result.map(([x,y])=>{
      const dx=x-cx,dy=y-cy;
      return[cx+dx*Math.cos(rad)-dy*Math.sin(rad),cy+dx*Math.sin(rad)+dy*Math.cos(rad)];
    });
  }
  // Reflect
  if(transforms.refX)result=result.map(([x,y])=>[x,-y]);
  if(transforms.refY)result=result.map(([x,y])=>[-x,y]);
  // Translate
  result=result.map(([x,y])=>[x+transforms.tx,y+transforms.ty]);
  return result;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawGrid();
  const original=shapes[currentShape];
  // Original (grey ghost)
  drawShape(original,'rgba(148,163,184,0.08)','#475569',1.5,0.5);
  // Transformed
  const transformed=applyTransforms(original);
  drawShape(transformed,'rgba(13,148,136,0.15)','#0D9488',2,0.9);
  // Coordinate labels on transformed
  ctx.fillStyle='#0D9488';ctx.font='bold 10px monospace';
  transformed.forEach((p,i)=>{
    const[sx,sy]=toScreen(p[0],p[1]);
    ctx.fillText(`(${p[0].toFixed(1)}, ${p[1].toFixed(1)})`,sx+8,sy-8);
  });
}

function updateTransform(){
  transforms.tx=+document.getElementById('tx').value;
  transforms.ty=+document.getElementById('ty').value;
  transforms.rot=+document.getElementById('rot').value;
  transforms.scale=+document.getElementById('scale').value;
  document.getElementById('txv').textContent=transforms.tx;
  document.getElementById('tyv').textContent=transforms.ty;
  document.getElementById('rotv').textContent=transforms.rot+'°';
  document.getElementById('scalev').textContent=transforms.scale+'×';
  draw();
}

function toggleReflect(axis){
  if(axis==='x'){transforms.refX=!transforms.refX;document.getElementById('refX').classList.toggle('active',transforms.refX)}
  if(axis==='y'){transforms.refY=!transforms.refY;document.getElementById('refY').classList.toggle('active',transforms.refY)}
  draw();
}

function setShape(s){
  currentShape=s;
  document.querySelectorAll('.ctrl[data-shape]').forEach(b=>b.classList.toggle('active',b.dataset.shape===s));
  draw();
}

function resetTransforms(){
  transforms={tx:0,ty:0,rot:0,scale:1,refX:false,refY:false};
  document.getElementById('tx').value=0;document.getElementById('ty').value=0;
  document.getElementById('rot').value=0;document.getElementById('scale').value=1;
  document.getElementById('refX').classList.remove('active');
  document.getElementById('refY').classList.remove('active');
  updateTransform();
}

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const[x,y]=fromScreen(e.clientX-r.left,e.clientY-r.top);
  document.getElementById('coords').textContent=`(${x}, ${y})`;
});

resize();
</script>
</body>
</html>
