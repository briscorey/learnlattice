<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pattern Lab — LearnLattice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a0e;color:#e2e8f0;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden}
.hdr{padding:14px 20px;border-bottom:1px solid #0f2;display:flex;justify-content:space-between;align-items:center;background:rgba(0,255,34,.02)}
h1{font-size:1.3rem;color:#0f2;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:16px}
.lvl{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:#0f2;opacity:.7}
.score{font-family:'IBM Plex Mono',monospace;font-size:.9rem;color:#0f2}
.lab{max-width:800px;margin:0 auto;padding:24px}
.machine{background:rgba(0,255,34,.03);border:1px solid rgba(0,255,34,.15);border-radius:16px;padding:24px;margin-bottom:24px;position:relative;overflow:hidden}
.machine::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#0f2,transparent);opacity:.3}
.machine-label{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:rgba(0,255,34,.5);margin-bottom:16px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:20px}
.pair{background:rgba(0,255,34,.05);border:1px solid rgba(0,255,34,.1);border-radius:10px;padding:12px;text-align:center;transition:all .3s}
.pair:hover{border-color:rgba(0,255,34,.4);background:rgba(0,255,34,.08)}
.pair-in{font-family:'IBM Plex Mono',monospace;font-size:1.3rem;color:#94a3b8;margin-bottom:4px}
.pair-arrow{font-size:.7rem;color:rgba(0,255,34,.4);margin-bottom:4px}
.pair-out{font-family:'IBM Plex Mono',monospace;font-size:1.3rem;color:#0f2;font-weight:600}
.test-section{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.test-label{font-size:.85rem;color:#94a3b8}
.test-input{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;color:#0f2;background:rgba(0,255,34,.05);border:1px solid rgba(0,255,34,.2);border-radius:8px;padding:8px 16px;width:100px;text-align:center;outline:none;transition:border-color .2s}
.test-input:focus{border-color:#0f2;box-shadow:0 0 12px rgba(0,255,34,.2)}
.test-input::placeholder{color:rgba(0,255,34,.2)}
.btn{padding:10px 24px;border-radius:10px;border:1px solid rgba(0,255,34,.3);background:rgba(0,255,34,.08);color:#0f2;font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.btn:hover{background:rgba(0,255,34,.15);border-color:#0f2;box-shadow:0 0 20px rgba(0,255,34,.15)}
.btn:active{transform:scale(.97)}
.btn-primary{background:#0f2;color:#050a0e;border-color:#0f2}
.btn-primary:hover{background:#0d3;box-shadow:0 0 24px rgba(0,255,34,.3)}
.feedback{margin-top:16px;padding:14px;border-radius:10px;font-size:.9rem;display:none;animation:fadeIn .3s}
.feedback.correct{display:block;background:rgba(0,255,34,.08);border:1px solid rgba(0,255,34,.3);color:#0f2}
.feedback.wrong{display:block;background:rgba(255,50,50,.08);border:1px solid rgba(255,50,50,.3);color:#f55}
.rule-section{margin-top:20px}
.rule-input{width:100%;padding:10px 16px;border-radius:10px;border:1px solid rgba(0,255,34,.15);background:rgba(0,255,34,.03);color:#e2e8f0;font-family:'IBM Plex Mono',monospace;font-size:.9rem;outline:none}
.rule-input:focus{border-color:#0f2}
.progress{display:flex;gap:6px;margin-bottom:24px;justify-content:center}
.progress-dot{width:32px;height:6px;border-radius:3px;background:rgba(0,255,34,.1)}
.progress-dot.done{background:#0f2}
.progress-dot.current{background:rgba(0,255,34,.4);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.scanline{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,34,.015) 2px,rgba(0,255,34,.015) 4px);z-index:999}
</style><style id="embed-check">.embed-mode .hdr,.embed-mode .header,.embed-mode>div:first-child:not(.wrap):not(.main):not(.game):not(.lab):not(.arena){display:none!important}.embed-mode{padding-top:0!important}</style>
<script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed-mode');</script>
</head><body>
<div class="scanline"></div>
<div class="hdr">
  <h1>⚡ Pattern Lab</h1><a href="/games/" style="font-size:.72rem;color:#94a3b8;text-decoration:none;opacity:.7;margin-left:8px">← All Games</a>
  <div class="hdr-right">
    <span class="lvl" id="lvlText">Level 1 / 10</span>
    <span class="score" id="scoreText">Score: 0</span>
  </div>
</div>
<div class="lab">
  <div class="progress" id="progress"></div>
  <div class="machine">
    <div class="machine-label">Observed Input → Output Pairs</div>
    <div class="pairs" id="pairs"></div>
    <div class="test-section">
      <span class="test-label">If input =</span>
      <span class="test-input" id="testIn" style="pointer-events:none;opacity:.7">?</span>
      <span class="test-label">→ output =</span>
      <input class="test-input" id="testOut" placeholder="?" type="number">
      <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="rule-section">
    <div class="machine-label" style="margin-bottom:8px">Describe the rule (optional)</div>
    <input class="rule-input" id="ruleInput" placeholder="e.g. multiply by 2 then add 1">
  </div>
  <div style="display:flex;gap:10px;margin-top:16px;justify-content:center">
    <button class="btn" onclick="showHint()">💡 Hint</button>
    <button class="btn" onclick="nextLevel()">Next →</button>
  </div>
</div>
<script>
var levels=[
  {pairs:[[1,3],[2,5],[3,7],[4,9]],test:5,answer:11,rule:"2n+1",hint:"Look at the differences between outputs."},
  {pairs:[[1,4],[2,7],[3,10],[4,13]],test:6,answer:19,rule:"3n+1",hint:"Each output increases by 3."},
  {pairs:[[0,5],[1,8],[2,11],[3,14]],test:5,answer:20,rule:"3n+5",hint:"Start value is 5. What's added each time?"},
  {pairs:[[1,1],[2,4],[3,9],[4,16]],test:7,answer:49,rule:"n²",hint:"These are perfect squares."},
  {pairs:[[1,2],[2,6],[3,12],[4,20]],test:5,answer:30,rule:"n(n+1)",hint:"Try multiplying n by something related to n."},
  {pairs:[[1,0],[2,3],[3,8],[4,15]],test:6,answer:35,rule:"n²-1",hint:"Subtract 1 from perfect squares."},
  {pairs:[[2,1],[4,2],[6,3],[10,5]],test:8,answer:4,rule:"n/2",hint:"Output is always exactly half the input."},
  {pairs:[[1,1],[2,3],[3,6],[4,10]],test:8,answer:36,rule:"n(n+1)/2",hint:"These are triangular numbers! Add 1+2+3+...+n."},
  {pairs:[[1,2],[2,5],[3,10],[4,17]],test:5,answer:26,rule:"n²+1",hint:"One more than perfect squares."},
  {pairs:[[0,1],[1,3],[2,9],[3,27]],test:4,answer:81,rule:"3ⁿ",hint:"Each output is 3 times the previous one."}
];
var current=0,score=0,answered=false;

function loadLevel(){
  answered=false;
  var lv=levels[current];
  var pairsEl=document.getElementById('pairs');
  pairsEl.innerHTML='';
  lv.pairs.forEach(function(p){
    pairsEl.innerHTML+='<div class="pair"><div class="pair-in">'+p[0]+'</div><div class="pair-arrow">▼</div><div class="pair-out">'+p[1]+'</div></div>';
  });
  document.getElementById('testIn').textContent=lv.test;
  document.getElementById('testOut').value='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').style.display='none';
  document.getElementById('lvlText').textContent='Level '+(current+1)+' / '+levels.length;
  document.getElementById('scoreText').textContent='Score: '+score;
  // Progress dots
  var prog=document.getElementById('progress');
  prog.innerHTML='';
  levels.forEach(function(_,i){
    var cls='progress-dot';
    if(i<current) cls+=' done';
    else if(i===current) cls+=' current';
    prog.innerHTML+='<div class="'+cls+'"></div>';
  });
}

function checkAnswer(){
  if(answered)return;
  var lv=levels[current];
  var guess=parseInt(document.getElementById('testOut').value);
  var fb=document.getElementById('feedback');
  if(isNaN(guess)){fb.textContent='Enter a number!';fb.className='feedback wrong';return;}
  if(guess===lv.answer){
    answered=true;score+=10;
    fb.textContent='✓ Correct! The rule is: '+lv.rule;
    fb.className='feedback correct';
    document.getElementById('scoreText').textContent='Score: '+score;
    // Update progress
    var dots=document.querySelectorAll('.progress-dot');
    if(dots[current])dots[current].className='progress-dot done';
  } else {
    fb.textContent='✗ Not quite. Try again — look at the pattern more carefully.';
    fb.className='feedback wrong';
  }
}

function showHint(){
  var fb=document.getElementById('feedback');
  fb.textContent='💡 '+levels[current].hint;
  fb.className='feedback correct';
  fb.style.display='block';
}

function nextLevel(){if(!answered){document.getElementById("feedback").textContent="Answer the current level first!";document.getElementById("feedback").className="feedback wrong";return;}
  if(current<levels.length-1){current++;loadLevel();}
  else{
    document.getElementById('feedback').textContent='🎉 All 10 levels complete! Final score: '+score+'/100';if(typeof celebrate==='function')celebrate('🎉 '+score+'/100!');
    document.getElementById('feedback').className='feedback correct';
  }
}

document.getElementById('testOut').addEventListener('keydown',function(e){if(e.key==='Enter')checkAnswer();});
loadLevel();
</script></body></html>
