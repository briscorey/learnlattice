<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Lab — LearnLattice</title><style>@import url(https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap);*{margin:0;padding:0;box-sizing:border-box}body{background:#050a0e;color:#e2e8f0;font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden}.hdr{padding:14px 20px;border-bottom:1px solid #0f2;display:flex;justify-content:space-between;align-items:center;background:rgba(0,255,34,.02)}h1{font-size:1.3rem;color:#0f2;letter-spacing:2px;text-transform:uppercase;font-weight:700}.hdr-right{display:flex;align-items:center;gap:16px}.lvl{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:#0f2;opacity:.7}.score{font-family:'IBM Plex Mono',monospace;font-size:.9rem;color:#0f2}.lab{max-width:800px;margin:0 auto;padding:24px}.machine{background:rgba(0,255,34,.03);border:1px solid rgba(0,255,34,.15);border-radius:16px;padding:24px;margin-bottom:24px;position:relative;overflow:hidden}.machine::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#0f2,transparent);opacity:.3}.machine-label{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:rgba(0,255,34,.5);margin-bottom:16px}.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:20px}.pair{background:rgba(0,255,34,.05);border:1px solid rgba(0,255,34,.1);border-radius:10px;padding:12px;text-align:center;transition:all .3s}.pair:hover{border-color:rgba(0,255,34,.4);background:rgba(0,255,34,.08)}.pair-in{font-family:'IBM Plex Mono',monospace;font-size:1.3rem;color:#94a3b8;margin-bottom:4px}.pair-arrow{font-size:.7rem;color:rgba(0,255,34,.4);margin-bottom:4px}.pair-out{font-family:'IBM Plex Mono',monospace;font-size:1.3rem;color:#0f2;font-weight:600}.test-section{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.test-label{font-size:.85rem;color:#94a3b8}.test-input{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;color:#0f2;background:rgba(0,255,34,.05);border:1px solid rgba(0,255,34,.2);border-radius:8px;padding:8px 16px;width:100px;text-align:center;outline:0;transition:border-color .2s}.test-input:focus{border-color:#0f2;box-shadow:0 0 12px rgba(0,255,34,.2)}.test-input::placeholder{color:rgba(0,255,34,.2)}.btn{padding:10px 24px;border-radius:10px;border:1px solid rgba(0,255,34,.3);background:rgba(0,255,34,.08);color:#0f2;font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px}.btn:hover{background:rgba(0,255,34,.15);border-color:#0f2;box-shadow:0 0 20px rgba(0,255,34,.15)}.btn:active{transform:scale(.97)}.btn-primary{background:#0f2;color:#050a0e;border-color:#0f2}.btn-primary:hover{background:#0d3;box-shadow:0 0 24px rgba(0,255,34,.3)}.feedback{margin-top:16px;padding:14px;border-radius:10px;font-size:.9rem;display:none;animation:fadeIn .3s}.feedback.correct{display:block;background:rgba(0,255,34,.08);border:1px solid rgba(0,255,34,.3);color:#0f2}.feedback.wrong{display:block;background:rgba(255,50,50,.08);border:1px solid rgba(255,50,50,.3);color:#f55}.rule-section{margin-top:20px}.rule-input{width:100%;padding:10px 16px;border-radius:10px;border:1px solid rgba(0,255,34,.15);background:rgba(0,255,34,.03);color:#e2e8f0;font-family:'IBM Plex Mono',monospace;font-size:.9rem;outline:0}.rule-input:focus{border-color:#0f2}.progress{display:flex;gap:6px;margin-bottom:24px;justify-content:center}.progress-dot{width:32px;height:6px;border-radius:3px;background:rgba(0,255,34,.1)}.progress-dot.done{background:#0f2}.progress-dot.current{background:rgba(0,255,34,.4);animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.scanline{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,34,.015) 2px,rgba(0,255,34,.015) 4px);z-index:999}</style><style id="embed-check">.embed-mode .hdr,.embed-mode .header,.embed-mode>div:first-child:not(.wrap):not(.main):not(.game):not(.lab):not(.arena){display:none!important}.embed-mode{padding-top:0!important}</style><script>location.search.indexOf("embed=1")>-1&&document.documentElement.classList.add("embed-mode")</script></head><body><div class="scanline"></div><div class="hdr"><h1>⚡ Pattern Lab</h1><a href="/games/" target="_top" style="font-size:.72rem;color:#94a3b8;text-decoration:none;opacity:.7;margin-left:8px">← All games</a><div class="hdr-right"><span class="lvl" id="lvlText">Level 1 / 10</span> <span class="score" id="scoreText">Score: 0</span></div></div><div class="lab"><div class="progress" id="progress"></div><div class="machine"><div class="machine-label">Observed Input → Output Pairs</div><div class="pairs" id="pairs"></div><div class="test-section"><span class="test-label">If input =</span> <span class="test-input" id="testIn" style="pointer-events:none;opacity:.7">?</span> <span class="test-label">→ output =</span> <input class="test-input" id="testOut" placeholder="?" type="number"> <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check</button></div><div class="feedback" id="feedback"></div></div><div class="rule-section"><div class="machine-label" style="margin-bottom:8px">Describe the rule (optional)</div><input class="rule-input" id="ruleInput" placeholder="e.g. multiply by 2 then add 1"></div><div style="display:flex;gap:10px;margin-top:16px;justify-content:center"><button class="btn" onclick="showHint()">💡 Hint</button> <button class="btn" onclick="nextLevel()">Next →</button></div></div><script>var levels=[{pairs:[[1,3],[2,5],[3,7],[4,9]],test:5,answer:11,rule:"2n+1",hint:"Look at the differences between outputs."},{pairs:[[1,4],[2,7],[3,10],[4,13]],test:6,answer:19,rule:"3n+1",hint:"Each output increases by 3."},{pairs:[[0,5],[1,8],[2,11],[3,14]],test:5,answer:20,rule:"3n+5",hint:"Start value is 5. What's added each time?"},{pairs:[[1,1],[2,4],[3,9],[4,16]],test:7,answer:49,rule:"n²",hint:"These are perfect squares."},{pairs:[[1,2],[2,6],[3,12],[4,20]],test:5,answer:30,rule:"n(n+1)",hint:"Try multiplying n by something related to n."},{pairs:[[1,0],[2,3],[3,8],[4,15]],test:6,answer:35,rule:"n²-1",hint:"Subtract 1 from perfect squares."},{pairs:[[2,1],[4,2],[6,3],[10,5]],test:8,answer:4,rule:"n/2",hint:"Output is always exactly half the input."},{pairs:[[1,1],[2,3],[3,6],[4,10]],test:8,answer:36,rule:"n(n+1)/2",hint:"These are triangular numbers! Add 1+2+3+...+n."},{pairs:[[1,2],[2,5],[3,10],[4,17]],test:5,answer:26,rule:"n²+1",hint:"One more than perfect squares."},{pairs:[[0,1],[1,3],[2,9],[3,27]],test:4,answer:81,rule:"3ⁿ",hint:"Each output is 3 times the previous one."},{pairs:[[1,5],[2,8],[3,11],[4,14]],test:7,answer:23,rule:"3n+2",hint:"Each output increases by 3. What's the starting offset?"},{pairs:[[1,0],[2,2],[3,6],[4,12]],test:5,answer:20,rule:"n²−n",hint:"Try n² minus something..."},{pairs:[[1,10],[2,8],[3,6],[4,4]],test:6,answer:0,rule:"12−2n",hint:"Outputs are decreasing by 2 each time. Count down from 12."},{pairs:[[1,1],[2,8],[3,27],[4,64]],test:5,answer:125,rule:"n³",hint:"These are cube numbers!"},{pairs:[[1,3],[2,9],[3,19],[4,33]],test:5,answer:51,rule:"2n²+1",hint:"The differences between outputs increase: 6, 10, 14... (going up by 4)."}],current=0,score=0,answered=!1;function loadLevel(){answered=!1;var e=levels[current],t=document.getElementById("pairs");t.innerHTML="",e.pairs.forEach(function(e){t.innerHTML+='<div class="pair"><div class="pair-in">'+e[0]+'</div><div class="pair-arrow">▼</div><div class="pair-out">'+e[1]+"</div></div>"}),document.getElementById("testIn").textContent=e.test,document.getElementById("testOut").value="",document.getElementById("feedback").className="feedback",document.getElementById("feedback").style.display="none",document.getElementById("lvlText").textContent="Level "+(current+1)+" / "+levels.length,document.getElementById("scoreText").textContent="Score: "+score;var n=document.getElementById("progress");n.innerHTML="",levels.forEach(function(e,t){var r="progress-dot";t<current?r+=" done":t===current&&(r+=" current"),n.innerHTML+='<div class="'+r+'"></div>'})}function checkAnswer(){if(!answered){var e=levels[current],t=parseInt(document.getElementById("testOut").value),n=document.getElementById("feedback");if(isNaN(t))return n.textContent="Enter a number!",void(n.className="feedback wrong");if(t===e.answer){answered=!0,score+=10,n.textContent="✓ Correct! The rule is: "+e.rule,n.className="feedback correct",document.getElementById("scoreText").textContent="Score: "+score;var r=document.querySelectorAll(".progress-dot");r[current]&&(r[current].className="progress-dot done")}else n.textContent="✗ Not quite. Try again — look at the pattern more carefully.",n.className="feedback wrong"}}function showHint(){var e=document.getElementById("feedback");e.textContent="💡 "+levels[current].hint,e.className="feedback correct",e.style.display="block"}function nextLevel(){if(!answered)return document.getElementById("feedback").textContent="Answer the current level first!",void(document.getElementById("feedback").className="feedback wrong");current<levels.length-1?(current++,loadLevel()):(document.getElementById("feedback").textContent="🎉 All 10 levels complete! Final score: "+score+"/100","function"==typeof celebrate&&celebrate("🎉 "+score+"/100!"),document.getElementById("feedback").className="feedback correct")}document.getElementById("testOut").addEventListener("keydown",function(e){"Enter"===e.key&&checkAnswer()}),loadLevel()</script></body></html>
