<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fraction Wall — LearnLattice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fefce8;color:#1c1917;font-family:'Nunito',sans-serif;min-height:100vh}
.hdr{padding:14px 20px;background:#fff;border-bottom:2px solid #fde68a;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.3rem;color:#d97706;font-weight:800}
.score-box{font-size:.85rem;color:#92400e;font-weight:700}
.game{max-width:700px;margin:0 auto;padding:24px}
.wall{background:#fff;border:2px solid #fde68a;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 20px rgba(217,119,6,.08)}
.wall-row{display:flex;margin-bottom:3px;height:36px;border-radius:8px;overflow:hidden}
.wall-cell{height:100%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;cursor:pointer;transition:all .2s;border-right:2px solid #fefce8;user-select:none}
.wall-cell:last-child{border-right:none}
.wall-cell:hover{filter:brightness(1.15);transform:scaleY(1.1)}
.wall-cell.selected{outline:3px solid #1c1917;outline-offset:-2px;z-index:1;transform:scaleY(1.15)}
.wall-label{font-size:.65rem;color:#92400e;font-weight:600;text-align:right;width:36px;padding-right:6px;display:flex;align-items:center;justify-content:flex-end;flex-shrink:0}
.challenge{background:#fff;border:2px solid #fde68a;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;box-shadow:0 4px 20px rgba(217,119,6,.08)}
.challenge-q{font-size:1.1rem;font-weight:700;color:#92400e;margin-bottom:12px}
.challenge-hint{font-size:.82rem;color:#a8a29e;margin-bottom:16px}
.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opt{padding:10px 24px;border-radius:12px;border:2px solid #fde68a;background:#fffbeb;cursor:pointer;font-size:1rem;font-weight:700;color:#92400e;font-family:'Nunito',sans-serif;transition:all .2s}
.opt:hover{border-color:#d97706;background:#fef3c7;transform:translateY(-2px)}
.opt.correct{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.wrong{border-color:#ef4444;background:#fee2e2;color:#991b1b}
.fb{margin-top:12px;font-size:.9rem;font-weight:600;min-height:24px}
.fb.ok{color:#16a34a}.fb.no{color:#ef4444}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:2px solid #d97706;background:#f59e0b;color:#fff;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn:hover{background:#d97706;transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,158,11,.3)}
.colors{display:flex;gap:4px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.colors span{font-size:.6rem;padding:3px 8px;border-radius:4px;color:#fff;font-weight:600}
</style><style id="embed-check">.embed-mode .hdr,.embed-mode .header,.embed-mode>div:first-child:not(.wrap):not(.main):not(.game):not(.lab):not(.arena){display:none!important}.embed-mode{padding-top:0!important}</style>
<script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed-mode');</script>
</head><body>
<div class="hdr"><h1>🧱 Fraction Wall</h1><a href="/games/" style="font-size:.72rem;color:#94a3b8;text-decoration:none;opacity:.7;margin-left:8px">← All Games</a><div class="score-box" id="sc">0 / 0</div></div>
<div class="game">
  <div class="wall" id="wall"></div>
  <div class="challenge">
    <div class="challenge-q" id="cq"></div>
    <div class="challenge-hint" id="ch"></div>
    <div class="options" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn" style="margin-top:16px" onclick="nextQ()">Next Question →</button>
  </div>
</div>
<script>
var colors=['#ef4444','#f97316','#f59e0b','#84cc16','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#6366f1','#14b8a6','#e11d48'];
var denoms=[1,2,3,4,5,6,8,10,12];
var correct=0,total=0,selected=[];

function buildWall(){
  var w=document.getElementById('wall');w.innerHTML='';
  denoms.forEach(function(d,di){
    var row=document.createElement('div');row.className='wall-row';
    var label=document.createElement('div');label.className='wall-label';label.textContent='1/'+d;
    row.appendChild(label);
    for(var i=0;i<d;i++){
      var cell=document.createElement('div');
      cell.className='wall-cell';
      cell.style.width=(100/d)+'%';
      cell.style.background=colors[di%colors.length];
      cell.textContent=d===1?'1':'1/'+d;
      cell.dataset.num=1;cell.dataset.den=d;
      cell.onclick=function(){this.classList.toggle('selected');};
      row.appendChild(cell);
    }
    w.appendChild(row);
  });
}

var questions=[
  {q:"Which is bigger: 1/3 or 1/4?",opts:["1/3","1/4","They're equal"],answer:0,hint:"Look at the wall — which row has wider pieces?"},
  {q:"How many sixths make one half?",opts:["2","3","4"],answer:1,hint:"Find 1/2 on the wall. How many 1/6 pieces line up?"},
  {q:"Which fraction is equivalent to 2/4?",opts:["1/3","1/2","2/3"],answer:1,hint:"Shade 2 pieces of the 1/4 row. What single piece matches?"},
  {q:"Put in order: 1/2, 1/3, 1/5",opts:["1/5, 1/3, 1/2","1/2, 1/3, 1/5","1/3, 1/5, 1/2"],answer:0,hint:"The bigger the denominator, the smaller the piece."},
  {q:"What is 1/3 + 1/6?",opts:["1/2","2/9","1/3"],answer:0,hint:"1/3 = 2/6. So 2/6 + 1/6 = 3/6 = ?"},
  {q:"Which is closer to 1: 3/4 or 5/6?",opts:["3/4","5/6","They're equal"],answer:1,hint:"Both are close to 1. Which leaves a smaller gap?"},
  {q:"How many eighths equal 3/4?",opts:["4","6","8"],answer:1,hint:"3/4 = ?/8. Multiply top and bottom by 2."},
  {q:"1/2 + 1/3 = ?",opts:["2/5","5/6","1/1"],answer:1,hint:"Common denominator is 6. 3/6 + 2/6 = ?"},
  {q:"Which is bigger: 2/3 or 3/5?",opts:["2/3","3/5","They're equal"],answer:0,hint:"Convert both to fifteenths: 10/15 vs 9/15."},
  {q:"How many twelfths make 1/3?",opts:["3","4","6"],answer:1,hint:"1/3 = 4/12. Count on the wall!"},
];
var qi=0;

function loadQ(){
  var q=questions[qi%questions.length];
  document.getElementById('cq').textContent=q.q;
  document.getElementById('ch').textContent='💡 '+q.hint;
  document.getElementById('fb').textContent='';document.getElementById('fb').className='fb';
  var opts=document.getElementById('opts');opts.innerHTML='';
  q.opts.forEach(function(o,i){
    var btn=document.createElement('button');btn.className='opt';btn.textContent=o;
    btn.onclick=function(){
      if(document.querySelector('.opt.correct')||document.querySelector('.opt.wrong'))return;
      total++;
      if(i===q.answer){
        correct++;this.classList.add('correct');
        document.getElementById('fb').textContent='✓ Correct!';document.getElementById('fb').className='fb ok';
      } else {
        this.classList.add('wrong');
        opts.children[q.answer].classList.add('correct');
        document.getElementById('fb').textContent='✗ The answer is '+q.opts[q.answer];document.getElementById('fb').className='fb no';
      }
      document.getElementById('sc').textContent=correct+' / '+total;
    };
    opts.appendChild(btn);
  });
}

function nextQ(){qi++;if(qi>=questions.length){document.getElementById('cq').textContent='🎉 All 10 questions complete! Score: '+correct+'/'+total;document.getElementById('ch').textContent='';document.getElementById('opts').innerHTML='';document.getElementById('fb').textContent='';return;}loadQ();}

buildWall();loadQ();
</script></body></html>
