<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#5eead4"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>
  <text x="80" y="100" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#5eead4" letter-spacing="3">LEARNLATTICE.ORG</text>
  <text x="80" y="200" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#f1f5f9">Free MYP</text>
  <text x="80" y="268" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#5eead4">Investigations</text>
  <text x="80" y="350" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8">Mathematics · Science · Grades 6–9</text>
  <text x="80" y="410" font-family="system-ui,sans-serif" font-size="20" fill="#64748b">222 inquiry-based resources · 16 interactive games · Teacher moves · EAL scaffolds</text>
  <rect x="0" y="580" width="1200" height="50" fill="#0a1628"/>
  <text x="80" y="612" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">Built by a teacher, for teachers and students · CC BY-SA 4.0</text>
  <text x="1120" y="612" font-family="system-ui,sans-serif" font-size="14" fill="#0d9488" text-anchor="end">learnlattice.org</text>
