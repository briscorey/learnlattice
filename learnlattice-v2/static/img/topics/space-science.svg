<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03060f"/>
      <stop offset="50%" stop-color="#05091a"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <radialGradient id="ss-star" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="ss-glow" cx="28%" cy="50%" r="35%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ss-nebula" cx="70%" cy="35%" r="40%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="720" rx="32" fill="url(#ss-bg)"/>
  <rect width="960" height="720" rx="32" fill="url(#ss-glow)"/>
  <rect width="960" height="720" rx="32" fill="url(#ss-nebula)"/>
  <!-- Stars field - various sizes -->
  <g fill="white">
    <circle cx="62"  cy="44"  r="1.2" opacity="0.7"/><circle cx="145" cy="88"  r="0.8" opacity="0.5"/>
    <circle cx="218" cy="32"  r="1.4" opacity="0.8"/><circle cx="312" cy="67"  r="0.9" opacity="0.5"/>
    <circle cx="398" cy="22"  r="1.1" opacity="0.6"/><circle cx="502" cy="58"  r="0.7" opacity="0.4"/>
    <circle cx="588" cy="38"  r="1.3" opacity="0.7"/><circle cx="671" cy="75"  r="0.9" opacity="0.5"/>
    <circle cx="748" cy="28"  r="1.0" opacity="0.6"/><circle cx="842" cy="52"  r="1.5" opacity="0.8"/>
    <circle cx="922" cy="35"  r="0.8" opacity="0.4"/><circle cx="88"  cy="148" r="0.9" opacity="0.5"/>
    <circle cx="178" cy="192" r="1.2" opacity="0.7"/><circle cx="358" cy="148" r="0.7" opacity="0.4"/>
    <circle cx="448" cy="180" r="1.1" opacity="0.6"/><circle cx="622" cy="165" r="0.8" opacity="0.5"/>
    <circle cx="712" cy="195" r="1.3" opacity="0.7"/><circle cx="898" cy="162" r="1.0" opacity="0.6"/>
    <circle cx="52"  cy="285" r="0.8" opacity="0.4"/><circle cx="148" cy="312" r="1.1" opacity="0.6"/>
    <circle cx="892" cy="298" r="1.2" opacity="0.7"/><circle cx="932" cy="420" r="0.9" opacity="0.5"/>
    <circle cx="78"  cy="475" r="1.0" opacity="0.6"/><circle cx="922" cy="568" r="1.3" opacity="0.7"/>
    <circle cx="62"  cy="630" r="0.8" opacity="0.4"/><circle cx="198" cy="668" r="1.1" opacity="0.6"/>
    <circle cx="878" cy="672" r="1.4" opacity="0.8"/><circle cx="402" cy="652" r="0.7" opacity="0.4"/>
    <circle cx="558" cy="698" r="1.0" opacity="0.5"/><circle cx="728" cy="645" r="0.9" opacity="0.5"/>
  </g>
  <!-- A few brighter star glints -->
  <g fill="white" opacity="0.85">
    <circle cx="218" cy="32"  r="2.5"/><circle cx="842" cy="52"  r="2.8"/>
    <circle cx="178" cy="192" r="2.2"/><circle cx="712" cy="195" r="2.4"/>
    <circle cx="898" cy="162" r="2.0"/>
  </g>
  <!-- Star cross-glints -->
  <g stroke="white" stroke-opacity="0.30" stroke-width="0.8" stroke-linecap="round">
    <line x1="218" y1="29" x2="218" y2="35"/><line x1="215" y1="32" x2="221" y2="32"/>
    <line x1="842" y1="49" x2="842" y2="55"/><line x1="839" y1="52" x2="845" y2="52"/>
    <line x1="712" y1="192" x2="712" y2="198"/><line x1="709" y1="195" x2="715" y2="195"/>
  </g>
  <!-- Sun - left center -->
  <circle cx="200" cy="360" r="88" fill="url(#ss-star)" fill-opacity="0.85"/>
  <circle cx="200" cy="360" r="105" fill="none" stroke="#fbbf24" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="200" cy="360" r="128" fill="none" stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="200" cy="360" r="155" fill="none" stroke="#fbbf24" stroke-opacity="0.04" stroke-width="1"/>
  <!-- Solar flare arcs -->
  <path d="M200 272 C215 245 235 240 240 258" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M280 300 C304 285 316 292 310 312" stroke="#fbbf24" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M275 420 C300 438 304 455 285 460" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Orbital ellipses (tilted) -->
  <ellipse cx="480" cy="360" rx="360" ry="60" fill="none" stroke="#e2e8f0" stroke-opacity="0.08" stroke-width="1" transform="rotate(-15 480 360)"/>
  <ellipse cx="480" cy="360" rx="310" ry="50" fill="none" stroke="#e2e8f0" stroke-opacity="0.06" stroke-width="1" transform="rotate(10 480 360)"/>
  <ellipse cx="480" cy="360" rx="260" ry="42" fill="none" stroke="#e2e8f0" stroke-opacity="0.10" stroke-width="1.2" transform="rotate(-5 480 360)"/>
  <!-- Planet 1 -->
  <circle cx="710" cy="258" r="30" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.8"/>
  <ellipse cx="710" cy="258" rx="52" ry="12" fill="none" stroke="#818cf8" stroke-opacity="0.30" stroke-width="1.5" transform="rotate(-20 710 258)"/>
  <!-- Planet 2 (smaller) -->
  <circle cx="820" cy="445" r="18" fill="#134e4a" stroke="#34d399" stroke-opacity="0.40" stroke-width="1.5"/>
  <!-- Planet 3 -->
  <circle cx="590" cy="540" r="22" fill="#1c1917" stroke="#fb923c" stroke-opacity="0.38" stroke-width="1.5"/>
  <!-- Moon of planet 3 -->
  <circle cx="620" cy="520" r="8" fill="#1c1917" stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="590" y1="540" x2="620" y2="520" stroke="#e2e8f0" stroke-opacity="0.10" stroke-width="0.8"/>
  <!-- Asteroid belt dots -->
  <g fill="#e2e8f0" fill-opacity="0.18">
    <circle cx="445" cy="165" r="2"/><circle cx="460" cy="178" r="1.5"/><circle cx="472" cy="158" r="2.5"/>
    <circle cx="488" cy="172" r="1.8"/><circle cx="500" cy="155" r="2"/><circle cx="515" cy="168" r="1.5"/>
    <circle cx="528" cy="150" r="2.2"/><circle cx="540" cy="165" r="1.8"/><circle cx="552" cy="152" r="2"/>
    <circle cx="440" cy="182" r="1.5"/><circle cx="565" cy="176" r="1.5"/>
  </g>
  <!-- Comet tail -->
  <path d="M850 130 L780 175" stroke="white" stroke-opacity="0.30" stroke-width="2" stroke-linecap="round"/>
  <path d="M856 136 L798 168" stroke="white" stroke-opacity="0.15" stroke-width="1" stroke-linecap="round"/>
  <path d="M844 124 L782 168" stroke="white" stroke-opacity="0.12" stroke-width="1" stroke-linecap="round"/>
  <circle cx="858" cy="128" r="4" fill="white" fill-opacity="0.70"/>
  <!-- Border -->
  <rect x="1" y="1" width="958" height="718" rx="31" fill="none" stroke="#818cf8" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
