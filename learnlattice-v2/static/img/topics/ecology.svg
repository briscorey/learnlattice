<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eco-bg" x1="0" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060f08"/>
      <stop offset="50%" stop-color="#0a1a0c"/>
      <stop offset="100%" stop-color="#040c06"/>
    </linearGradient>
    <radialGradient id="eco-glow1" cx="50%" cy="40%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eco-sun" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <rect width="960" height="720" rx="32" fill="url(#eco-bg)"/>
  <rect width="960" height="720" rx="32" fill="url(#eco-glow1)"/>
  <!-- Grid -->
  <g stroke="#4ade80" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="144" x2="960" y2="144"/><line x1="0" y1="288" x2="960" y2="288"/>
    <line x1="0" y1="432" x2="960" y2="432"/><line x1="0" y1="576" x2="960" y2="576"/>
    <line x1="192" y1="0" x2="192" y2="720"/><line x1="384" y1="0" x2="384" y2="720"/>
    <line x1="576" y1="0" x2="576" y2="720"/><line x1="768" y1="0" x2="768" y2="720"/>
  </g>
  <!-- Ground layer -->
  <rect x="0" y="580" width="960" height="140" rx="0" fill="#16a34a" fill-opacity="0.07"/>
  <line x1="0" y1="580" x2="960" y2="580" stroke="#4ade80" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- Tree 1 - large center -->
  <line x1="480" y1="580" x2="480" y2="320" stroke="#166534" stroke-opacity="0.60" stroke-width="8"/>
  <!-- Canopy layers -->
  <ellipse cx="480" cy="310" rx="120" ry="75" fill="#166534" fill-opacity="0.30" stroke="#4ade80" stroke-opacity="0.25" stroke-width="1.5"/>
  <ellipse cx="480" cy="260" rx="90" ry="60" fill="#15803d" fill-opacity="0.35" stroke="#4ade80" stroke-opacity="0.30" stroke-width="1.5"/>
  <ellipse cx="480" cy="215" rx="64" ry="48" fill="#16a34a" fill-opacity="0.40" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1.5"/>
  <ellipse cx="480" cy="178" rx="42" ry="34" fill="#22c55e" fill-opacity="0.35" stroke="#4ade80" stroke-opacity="0.40" stroke-width="1"/>
  <!-- Tree 2 - left -->
  <line x1="240" y1="580" x2="240" y2="390" stroke="#166534" stroke-opacity="0.50" stroke-width="6"/>
  <ellipse cx="240" cy="382" rx="85" ry="54" fill="#166534" fill-opacity="0.25" stroke="#4ade80" stroke-opacity="0.20" stroke-width="1.2"/>
  <ellipse cx="240" cy="342" rx="62" ry="42" fill="#15803d" fill-opacity="0.28" stroke="#4ade80" stroke-opacity="0.25" stroke-width="1.2"/>
  <ellipse cx="240" cy="308" rx="42" ry="30" fill="#16a34a" fill-opacity="0.32" stroke="#4ade80" stroke-opacity="0.28" stroke-width="1"/>
  <!-- Tree 3 - right -->
  <line x1="720" y1="580" x2="720" y2="390" stroke="#166534" stroke-opacity="0.50" stroke-width="6"/>
  <ellipse cx="720" cy="382" rx="80" ry="52" fill="#166534" fill-opacity="0.25" stroke="#4ade80" stroke-opacity="0.20" stroke-width="1.2"/>
  <ellipse cx="720" cy="344" rx="58" ry="40" fill="#15803d" fill-opacity="0.28" stroke="#4ade80" stroke-opacity="0.25" stroke-width="1.2"/>
  <ellipse cx="720" cy="312" rx="38" ry="28" fill="#16a34a" fill-opacity="0.32" stroke="#4ade80" stroke-opacity="0.28" stroke-width="1"/>
  <!-- Small trees -->
  <line x1="130" y1="580" x2="130" y2="460" stroke="#166534" stroke-opacity="0.40" stroke-width="4"/>
  <ellipse cx="130" cy="454" rx="52" ry="34" fill="#166534" fill-opacity="0.20" stroke="#4ade80" stroke-opacity="0.15" stroke-width="1"/>
  <ellipse cx="130" cy="426" rx="36" ry="26" fill="#16a34a" fill-opacity="0.22" stroke="#4ade80" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="840" y1="580" x2="840" y2="460" stroke="#166534" stroke-opacity="0.40" stroke-width="4"/>
  <ellipse cx="840" cy="454" rx="52" ry="34" fill="#166534" fill-opacity="0.20" stroke="#4ade80" stroke-opacity="0.15" stroke-width="1"/>
  <ellipse cx="840" cy="426" rx="36" ry="26" fill="#16a34a" fill-opacity="0.22" stroke="#4ade80" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Sun top right -->
  <circle cx="820" cy="100" r="46" fill="url(#eco-sun)" fill-opacity="0.7"/>
  <circle cx="820" cy="100" r="58" fill="none" stroke="#fde68a" stroke-opacity="0.20" stroke-width="1.5"/>
  <circle cx="820" cy="100" r="72" fill="none" stroke="#fde68a" stroke-opacity="0.10" stroke-width="1"/>
  <!-- Sun rays -->
  <g stroke="#fde68a" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round">
    <line x1="820" y1="34" x2="820" y2="22"/><line x1="820" y1="166" x2="820" y2="178"/>
    <line x1="754" y1="100" x2="742" y2="100"/><line x1="886" y1="100" x2="898" y2="100"/>
    <line x1="773" y1="53" x2="765" y2="45"/><line x1="867" y1="147" x2="875" y2="155"/>
    <line x1="867" y1="53" x2="875" y2="45"/><line x1="773" y1="147" x2="765" y2="155"/>
  </g>
  <!-- Energy flow arrows (sun to plants) -->
  <path d="M795 148 C760 200 660 240 560 270" stroke="#fde68a" stroke-opacity="0.15" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
  <polygon points="556,272 568,262 562,274" fill="#fde68a" fill-opacity="0.15"/>
  <!-- Food web dots + connections (upper left) -->
  <g transform="translate(80, 120)">
    <!-- Producer -->
    <circle cx="0" cy="120" r="16" fill="#16a34a" fill-opacity="0.25" stroke="#4ade80" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="0" y="125" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4ade80" fill-opacity="0.55">P</text>
    <!-- Primary consumer -->
    <circle cx="60" cy="60" r="14" fill="#0a1a0c" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="60" y="65" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4ade80" fill-opacity="0.45">1°</text>
    <!-- Secondary -->
    <circle cx="120" cy="0" r="12" fill="#0a1a0c" stroke="#4ade80" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="120" y="5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4ade80" fill-opacity="0.38">2°</text>
    <!-- Arrows -->
    <line x1="14" y1="106" x2="48" y2="72" stroke="#4ade80" stroke-opacity="0.30" stroke-width="1.2"/>
    <line x1="72" y1="46" x2="108" y2="12" stroke="#4ade80" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
  <!-- Root system below ground line (stylized) -->
  <g stroke="#4ade80" stroke-opacity="0.14" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M480 580 L480 640 M480 640 L450 680 M480 640 L510 680 M480 640 L480 680"/>
    <path d="M240 580 L240 630 M240 630 L218 660 M240 630 L262 660"/>
    <path d="M720 580 L720 630 M720 630 L698 660 M720 630 L742 660"/>
  </g>
  <!-- Leaf detail on main tree -->
  <g fill="#4ade80" fill-opacity="0.18">
    <ellipse cx="510" cy="240" rx="12" ry="7" transform="rotate(30 510 240)"/>
    <ellipse cx="450" cy="255" rx="10" ry="6" transform="rotate(-20 450 255)"/>
    <ellipse cx="505" cy="290" rx="11" ry="6" transform="rotate(50 505 290)"/>
  </g>
  <!-- Border -->
  <rect x="1" y="1" width="958" height="718" rx="31" fill="none" stroke="#4ade80" stroke-opacity="0.10" stroke-width="1.5"/>
</svg>
