<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="math-bg" x1="0" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="50%" stop-color="#0c1530"/>
      <stop offset="100%" stop-color="#060c1a"/>
    </linearGradient>
    <radialGradient id="math-glow1" cx="55%" cy="48%" r="45%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="math-glow2" cx="25%" cy="60%" r="36%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="720" rx="32" fill="url(#math-bg)"/>
  <rect width="960" height="720" rx="32" fill="url(#math-glow1)"/>
  <rect width="960" height="720" rx="32" fill="url(#math-glow2)"/>
  <!-- Coordinate grid -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="720"/><line x1="200" y1="0" x2="200" y2="720"/>
    <line x1="300" y1="0" x2="300" y2="720"/><line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="500" y1="0" x2="500" y2="720"/><line x1="600" y1="0" x2="600" y2="720"/>
    <line x1="700" y1="0" x2="700" y2="720"/><line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="900" y1="0" x2="900" y2="720"/>
    <line x1="0" y1="80" x2="960" y2="80"/><line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="400" x2="960" y2="400"/><line x1="0" y1="480" x2="960" y2="480"/>
    <line x1="0" y1="560" x2="960" y2="560"/><line x1="0" y1="640" x2="960" y2="640"/>
  </g>
  <!-- Main axes -->
  <line x1="60" y1="360" x2="900" y2="360" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5"/>
  <line x1="480" y1="60" x2="480" y2="660" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Axis tick marks -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1">
    <line x1="200" y1="355" x2="200" y2="365"/><line x1="300" y1="355" x2="300" y2="365"/>
    <line x1="400" y1="355" x2="400" y2="365"/><line x1="600" y1="355" x2="600" y2="365"/>
    <line x1="700" y1="355" x2="700" y2="365"/><line x1="800" y1="355" x2="800" y2="365"/>
    <line x1="475" y1="160" x2="485" y2="160"/><line x1="475" y1="240" x2="485" y2="240"/>
    <line x1="475" y1="480" x2="485" y2="480"/><line x1="475" y1="560" x2="485" y2="560"/>
  </g>
  <!-- Sine wave -->
  <path d="M60 360 C110 280 160 200 210 280 C260 360 310 440 360 360 C410 280 460 200 510 280 C560 360 610 440 660 360 C710 280 760 200 810 280 C860 360 900 400 940 360" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.70" fill="none" stroke-linecap="round"/>
  <!-- Parabola -->
  <path d="M160 640 C280 200 360 120 480 110 C600 120 680 200 800 640" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.40" fill="none" stroke-linecap="round"/>
  <!-- Straight line y=mx+b -->
  <line x1="80" y1="580" x2="880" y2="140" stroke="#0ea5e9" stroke-opacity="0.30" stroke-width="1.8"/>
  <!-- Golden spiral (Fibonacci-ish arc) -->
  <path d="M560 260 A90 90 0 0 1 470 350" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5" fill="none"/>
  <path d="M470 350 A56 56 0 0 1 526 406" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.5" fill="none"/>
  <path d="M526 406 A35 35 0 0 1 491 371" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1.5" fill="none"/>
  <!-- Circle -->
  <circle cx="480" cy="360" r="120" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Data points on sine wave -->
  <g fill="#38bdf8" fill-opacity="0.75">
    <circle cx="210" cy="280" r="5"/><circle cx="310" cy="440" r="5"/>
    <circle cx="410" cy="280" r="5"/><circle cx="510" cy="280" r="5"/>
    <circle cx="610" cy="440" r="5"/><circle cx="710" cy="280" r="5"/>
  </g>
  <!-- Math symbols floating -->
  <text x="148" y="180" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="22" font-weight="500" opacity="0.22">∫</text>
  <text x="820" y="480" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="20" font-weight="500" opacity="0.18">π</text>
  <text x="100" y="480" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="18" opacity="0.15">∑</text>
  <text x="780" y="200" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="18" opacity="0.15">√</text>
  <text x="380" y="80" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="16" opacity="0.13">y = mx + b</text>
  <!-- Axis arrows -->
  <polygon points="900,360 888,354 888,366" fill="#38bdf8" fill-opacity="0.22"/>
  <polygon points="480,60 474,72 486,72" fill="#38bdf8" fill-opacity="0.22"/>
  <!-- Border -->
  <rect x="1" y="1" width="958" height="718" rx="31" fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="1.5"/>
</svg>
