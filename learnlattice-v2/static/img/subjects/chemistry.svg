<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#chemGrad)" rx="16"/>
  <!-- Molecular bonds -->
  <line x1="100" y1="70" x2="60" y2="110" stroke="#e11d48" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="70" x2="140" y2="110" stroke="#e11d48" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="70" x2="100" y2="30" stroke="#e11d48" stroke-width="2" opacity="0.3"/>
  <line x1="60" y1="110" x2="60" y2="155" stroke="#e11d48" stroke-width="1.5" opacity="0.3"/>
  <line x1="60" y1="110" x2="25" y2="95" stroke="#e11d48" stroke-width="1.5" opacity="0.25"/>
  <line x1="140" y1="110" x2="175" y2="95" stroke="#e11d48" stroke-width="1.5" opacity="0.25"/>
  <line x1="140" y1="110" x2="140" y2="155" stroke="#e11d48" stroke-width="1.5" opacity="0.3"/>
  <!-- Atoms -->
  <circle cx="100" cy="70" r="14" fill="#e11d48" opacity="0.2"/>
  <circle cx="100" cy="70" r="8" fill="#e11d48" opacity="0.15"/>
  <circle cx="60" cy="110" r="11" fill="#e11d48" opacity="0.18"/>
  <circle cx="140" cy="110" r="11" fill="#e11d48" opacity="0.18"/>
  <circle cx="100" cy="30" r="7" fill="#e11d48" opacity="0.15"/>
  <circle cx="60" cy="155" r="7" fill="#e11d48" opacity="0.12"/>
  <circle cx="140" cy="155" r="7" fill="#e11d48" opacity="0.12"/>
  <circle cx="25" cy="95" r="6" fill="#e11d48" opacity="0.1"/>
  <circle cx="175" cy="95" r="6" fill="#e11d48" opacity="0.1"/>
  <!-- Electron clouds -->
  <circle cx="80" cy="88" r="2" fill="#e11d48" opacity="0.35"/>
  <circle cx="120" cy="88" r="2" fill="#e11d48" opacity="0.35"/>
</svg>
