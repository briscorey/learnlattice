  <!-- Fossil hint -->
  <circle cx="50" cy="158" r="4" fill="none" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>
  <path d="M 48,156 Q 50,160 52,156" fill="none" stroke="#d97706" stroke-width="0.6" opacity="0.3"/>
</svg>
