  <path d="M 0,185 Q 55,180 100,186 T 200,183" fill="none" stroke="#d97706" stroke-width="1" opacity="0.2"/>
  <!-- Mountain -->
  <path d="M 60,140 L 95,60 L 115,85 L 135,45 L 165,140" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.45"/>
