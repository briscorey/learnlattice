<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bioGrad)" rx="16"/>
  <!-- Cell membrane -->
  <ellipse cx="100" cy="100" rx="72" ry="65" fill="none" stroke="#16a34a" stroke-width="2" opacity="0.5"/>
  <ellipse cx="100" cy="100" rx="76" ry="69" fill="none" stroke="#16a34a" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,3"/>
  <!-- Nucleus -->
  <ellipse cx="90" cy="95" rx="24" ry="20" fill="none" stroke="#16a34a" stroke-width="1.5" opacity="0.7"/>
  <circle cx="85" cy="92" r="5" fill="#16a34a" opacity="0.3"/>
  <!-- Organelles -->
  <ellipse cx="135" cy="80" rx="12" ry="7" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.4" transform="rotate(-20 135 80)"/>
  <ellipse cx="130" cy="125" rx="10" ry="6" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.35" transform="rotate(15 130 125)"/>
  <ellipse cx="65" cy="130" rx="11" ry="6" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.35" transform="rotate(-30 65 130)"/>
  <!-- Ribosomes -->
  <circle cx="110" cy="70" r="2" fill="#16a34a" opacity="0.4"/>
  <circle cx="120" cy="105" r="2" fill="#16a34a" opacity="0.35"/>
  <circle cx="75" cy="75" r="2" fill="#16a34a" opacity="0.3"/>
  <circle cx="140" cy="100" r="1.8" fill="#16a34a" opacity="0.3"/>
  <circle cx="60" cy="100" r="1.8" fill="#16a34a" opacity="0.25"/>
  <circle cx="105" cy="140" r="2" fill="#16a34a" opacity="0.3"/>
</svg>
