<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#spaceGrad)" rx="16"/>
  <!-- Orbits -->
  <ellipse cx="100" cy="100" rx="35" ry="70" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.25" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="35" ry="70" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.2" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="35" ry="70" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.2" transform="rotate(90 100 100)"/>
  <!-- Central body (star/sun) -->
  <circle cx="100" cy="100" r="12" fill="#7c3aed" opacity="0.2"/>
  <circle cx="100" cy="100" r="6" fill="#7c3aed" opacity="0.15"/>
  <!-- Planets -->
  <circle cx="72" cy="55" r="4" fill="#7c3aed" opacity="0.4"/>
  <circle cx="140" cy="80" r="3" fill="#7c3aed" opacity="0.35"/>
  <circle cx="85" cy="155" r="3.5" fill="#7c3aed" opacity="0.3"/>
  <!-- Stars -->
  <circle cx="25" cy="30" r="1.2" fill="#7c3aed" opacity="0.4"/>
  <circle cx="170" cy="25" r="1" fill="#7c3aed" opacity="0.3"/>
  <circle cx="180" cy="170" r="1.2" fill="#7c3aed" opacity="0.35"/>
  <circle cx="20" cy="160" r="0.8" fill="#7c3aed" opacity="0.25"/>
  <circle cx="155" cy="45" r="0.8" fill="#7c3aed" opacity="0.2"/>
  <circle cx="40" cy="175" r="1" fill="#7c3aed" opacity="0.2"/>
</svg>
