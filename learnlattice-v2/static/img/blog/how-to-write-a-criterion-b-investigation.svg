<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#0f172a"/>
  <defs><linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#042f2e"/><stop offset="100%" stop-color="#0D9488" stop-opacity="0.15"/></linearGradient></defs>
  <rect width="1200" height="400" fill="url(#bg2)"/>
  <!-- Ascending steps -->
  <rect x="150" y="300" width="160" height="60" rx="8" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.3"/>
  <text x="230" y="338" text-anchor="middle" font-size="14" fill="#0D9488" opacity="0.6" font-family="sans-serif">Hook</text>
  <rect x="350" y="240" width="160" height="120" rx="8" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.35"/>
  <text x="430" y="310" text-anchor="middle" font-size="14" fill="#0D9488" opacity="0.6" font-family="sans-serif">Investigate</text>
  <rect x="550" y="180" width="160" height="180" rx="8" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.4"/>
  <text x="630" y="280" text-anchor="middle" font-size="14" fill="#0D9488" opacity="0.6" font-family="sans-serif">Pattern</text>
  <rect x="750" y="120" width="160" height="240" rx="8" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.45"/>
  <text x="830" y="250" text-anchor="middle" font-size="14" fill="#14b8a6" opacity="0.7" font-family="sans-serif">Justify</text>
  <!-- Arrow -->
  <line x1="180" y1="100" x2="900" y2="100" stroke="#0D9488" stroke-width="0.8" opacity="0.15" stroke-dasharray="4,4"/>
  <text x="960" y="105" font-size="11" fill="#0D9488" opacity="0.3" font-family="sans-serif">Level 7-8</text>
  <!-- Criterion B label -->
  <text x="1050" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="64" fill="#0D9488" opacity="0.08">B</text>
</svg>
