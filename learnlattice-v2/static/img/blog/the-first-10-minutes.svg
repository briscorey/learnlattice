<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#0f172a"/>
  <defs><radialGradient id="bg3" cx="30%" cy="50%"><stop offset="0%" stop-color="#0D9488" stop-opacity="0.08"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="400" fill="url(#bg3)"/>
  <!-- Clock circle -->
  <circle cx="300" cy="200" r="120" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.25"/>
  <circle cx="300" cy="200" r="4" fill="#0D9488" opacity="0.5"/>
  <!-- Clock hands — showing 10 minutes -->
  <line x1="300" y1="200" x2="300" y2="100" stroke="#0D9488" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="300" y1="200" x2="360" y2="170" stroke="#14b8a6" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
  <!-- 10 minute markers -->
  <circle cx="300" cy="82" r="3" fill="#0D9488" opacity="0.4"/>
  <circle cx="400" cy="142" r="2" fill="#0D9488" opacity="0.2"/>
  <circle cx="418" cy="200" r="2" fill="#0D9488" opacity="0.2"/>
  <circle cx="200" cy="142" r="2" fill="#0D9488" opacity="0.2"/>
  <circle cx="182" cy="200" r="2" fill="#0D9488" opacity="0.2"/>
  <circle cx="300" cy="318" r="2" fill="#0D9488" opacity="0.2"/>
  <!-- "10" text -->
  <text x="300" y="220" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#0D9488" opacity="0.15">10:00</text>
  <!-- Speech bubbles floating right -->
  <rect x="550" y="120" width="200" height="50" rx="12" fill="none" stroke="#0D9488" stroke-width="1" opacity="0.2"/>
  <text x="650" y="150" text-anchor="middle" font-size="12" fill="#94a3b8" opacity="0.5" font-family="sans-serif">🤔 "What if...?"</text>
  <rect x="620" y="210" width="220" height="50" rx="12" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.25"/>
  <text x="730" y="240" text-anchor="middle" font-size="12" fill="#94a3b8" opacity="0.5" font-family="sans-serif">💡 "I think it's..."</text>
  <rect x="570" y="300" width="180" height="50" rx="12" fill="none" stroke="#0D9488" stroke-width="1" opacity="0.2"/>
  <text x="660" y="330" text-anchor="middle" font-size="12" fill="#94a3b8" opacity="0.5" font-family="sans-serif">🗣️ "But why?"</text>
</svg>
