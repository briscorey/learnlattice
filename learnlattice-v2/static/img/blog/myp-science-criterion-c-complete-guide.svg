<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#0f172a"/>
  <rect x="0" y="0" width="6" height="400" fill="#0891b2"/>
  <!-- Large criterion letter -->
  <text x="900" y="340" font-family="Georgia,serif" font-size="320" fill="#0891b2" opacity="0.07" font-weight="700">C</text>
  <!-- Smaller Greek symbol -->
  <text x="80" y="160" font-family="Georgia,serif" font-size="80" fill="#22d3ee" opacity="0.15">γ</text>
  <!-- Grid lines -->
  <g opacity="0.04" stroke="#22d3ee" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>
  <!-- Subject badge -->
  <text x="80" y="60" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#22d3ee" letter-spacing="3" opacity="0.6">MYP SCIENCES · CRITERION C</text>
  <!-- Level indicators -->
  <g opacity="0.12">
    <rect x="80" y="350" width="60" height="8" rx="4" fill="#22d3ee" opacity="0.3"/>
    <rect x="160" y="350" width="80" height="8" rx="4" fill="#22d3ee" opacity="0.5"/>
    <rect x="260" y="350" width="100" height="8" rx="4" fill="#22d3ee" opacity="0.7"/>
    <rect x="380" y="350" width="120" height="8" rx="4" fill="#22d3ee" opacity="1.0"/>
    <text x="85" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#22d3ee" opacity="0.4">1-2</text>
    <text x="170" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#22d3ee" opacity="0.4">3-4</text>
    <text x="275" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#22d3ee" opacity="0.4">5-6</text>
    <text x="400" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#22d3ee" opacity="0.4">7-8</text>
  </g>
</svg>