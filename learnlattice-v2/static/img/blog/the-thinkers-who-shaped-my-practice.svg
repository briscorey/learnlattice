<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#0f172a"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="tg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#tg)" opacity="0.5"/>
  
  <!-- Abstract thought nodes — representing different thinkers -->
  <!-- Node 1: Liljedahl -->
  <circle cx="150" cy="180" r="35" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.6"/>
  <circle cx="150" cy="180" r="4" fill="#14b8a6" opacity="0.8"/>
  
  <!-- Node 2: Boaler -->
  <circle cx="340" cy="120" r="28" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <circle cx="340" cy="120" r="4" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Node 3: Wiliam -->
  <circle cx="520" cy="220" r="32" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
  <circle cx="520" cy="220" r="4" fill="#8b5cf6" opacity="0.8"/>
  
  <!-- Node 4: Meyer -->
  <circle cx="700" cy="140" r="30" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
  <circle cx="700" cy="140" r="4" fill="#ef4444" opacity="0.8"/>
  
  <!-- Node 5: Papert -->
  <circle cx="880" cy="200" r="26" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
  <circle cx="880" cy="200" r="4" fill="#22c55e" opacity="0.8"/>
  
  <!-- Node 6: Bruner -->
  <circle cx="1050" cy="160" r="30" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5"/>
  <circle cx="1050" cy="160" r="4" fill="#06b6d4" opacity="0.8"/>
  
  <!-- Connecting lines between thinkers -->
  <line x1="150" y1="180" x2="340" y2="120" stroke="#14b8a6" stroke-width="1" opacity="0.15"/>
  <line x1="340" y1="120" x2="520" y2="220" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>
  <line x1="520" y1="220" x2="700" y2="140" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <line x1="700" y1="140" x2="880" y2="200" stroke="#ef4444" stroke-width="1" opacity="0.15"/>
  <line x1="880" y1="200" x2="1050" y2="160" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  
  <!-- Cross-connections (ideas that influence each other) -->
  <line x1="150" y1="180" x2="520" y2="220" stroke="#14b8a6" stroke-width="0.5" opacity="0.08" stroke-dasharray="4 6"/>
  <line x1="340" y1="120" x2="700" y2="140" stroke="#f59e0b" stroke-width="0.5" opacity="0.08" stroke-dasharray="4 6"/>
  <line x1="520" y1="220" x2="1050" y2="160" stroke="#8b5cf6" stroke-width="0.5" opacity="0.08" stroke-dasharray="4 6"/>
  <line x1="150" y1="180" x2="880" y2="200" stroke="#14b8a6" stroke-width="0.5" opacity="0.06" stroke-dasharray="4 6"/>
  
  <!-- Radiating thought ripples -->
  <circle cx="150" cy="180" r="55" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.12"/>
  <circle cx="520" cy="220" r="50" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.1"/>
  <circle cx="880" cy="200" r="42" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Small satellite nodes — individual ideas -->
  <circle cx="110" cy="140" r="3" fill="#14b8a6" opacity="0.3"/>
  <circle cx="195" cy="145" r="2" fill="#14b8a6" opacity="0.25"/>
  <circle cx="300" cy="85" r="2" fill="#f59e0b" opacity="0.25"/>
  <circle cx="380" cy="155" r="3" fill="#f59e0b" opacity="0.3"/>
  <circle cx="475" cy="260" r="2" fill="#8b5cf6" opacity="0.25"/>
  <circle cx="565" cy="175" r="2" fill="#8b5cf6" opacity="0.25"/>
  <circle cx="660" cy="105" r="2" fill="#ef4444" opacity="0.25"/>
  <circle cx="745" cy="180" r="3" fill="#ef4444" opacity="0.3"/>
  <circle cx="840" cy="165" r="2" fill="#22c55e" opacity="0.25"/>
  <circle cx="920" cy="240" r="2" fill="#22c55e" opacity="0.25"/>
  <circle cx="1010" cy="125" r="2" fill="#06b6d4" opacity="0.25"/>
  <circle cx="1090" cy="195" r="3" fill="#06b6d4" opacity="0.3"/>
  
  <!-- Bottom fade -->
  <rect y="340" width="1200" height="60" fill="url(#bf)"/>
  <defs>
    <linearGradient id="bf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
