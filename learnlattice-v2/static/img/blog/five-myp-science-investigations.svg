<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#0f172a"/>
  <rect width="1200" height="400" fill="url(#bg1)" opacity="0.5"/>
  <defs><linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#042f2e"/><stop offset="100%" stop-color="#0f172a"/></linearGradient></defs>
  <!-- Five numbered circles -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="#0D9488" stroke-width="2" opacity="0.3"/>
  <text x="200" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#0D9488" opacity="0.7">1</text>
  <circle cx="360" cy="200" r="60" fill="none" stroke="#16a34a" stroke-width="2" opacity="0.3"/>
  <text x="360" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#16a34a" opacity="0.7">2</text>
  <circle cx="520" cy="200" r="60" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
  <text x="520" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#2563eb" opacity="0.7">3</text>
  <circle cx="680" cy="200" r="60" fill="none" stroke="#d97706" stroke-width="2" opacity="0.3"/>
  <text x="680" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#d97706" opacity="0.7">4</text>
  <circle cx="840" cy="200" r="60" fill="none" stroke="#e11d48" stroke-width="2" opacity="0.3"/>
  <text x="840" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#e11d48" opacity="0.7">5</text>
  <!-- Connecting lines -->
  <line x1="260" y1="200" x2="300" y2="200" stroke="#0D9488" stroke-width="1" opacity="0.2"/>
  <line x1="420" y1="200" x2="460" y2="200" stroke="#16a34a" stroke-width="1" opacity="0.2"/>
  <line x1="580" y1="200" x2="620" y2="200" stroke="#2563eb" stroke-width="1" opacity="0.2"/>
  <line x1="740" y1="200" x2="780" y2="200" stroke="#d97706" stroke-width="1" opacity="0.2"/>
  <!-- Subject icons as small text -->
  <text x="200" y="285" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif" opacity="0.6">Density</text>
  <text x="360" y="285" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif" opacity="0.6">Heat</text>
  <text x="520" y="285" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif" opacity="0.6">Sound</text>
  <text x="680" y="285" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif" opacity="0.6">Gravity</text>
  <text x="840" y="285" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif" opacity="0.6">Ecology</text>
  <!-- Decorative dots -->
  <circle cx="1050" cy="100" r="2" fill="#0D9488" opacity="0.3"/>
  <circle cx="1100" cy="150" r="1.5" fill="#0D9488" opacity="0.2"/>
  <circle cx="1080" cy="300" r="2" fill="#0D9488" opacity="0.2"/>
</svg>
