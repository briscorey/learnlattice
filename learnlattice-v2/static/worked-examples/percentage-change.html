<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Worked Example: Percentage Change — LearnLattice</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px}h1{font-size:1.4rem;background:linear-gradient(135deg,#0D9488,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sub{font-size:.82rem;color:#94a3b8;margin-bottom:24px;text-align:center}.ex{width:100%;max-width:560px}.prob{padding:20px;background:#1e293b;border:2px solid #0D9488;border-radius:12px;text-align:center;margin-bottom:24px}.prob-l{font-size:.68rem;text-transform:uppercase;letter-spacing:1.5px;color:#0D9488;margin-bottom:8px}.prob-t{font-size:1rem;color:#e2e8f0;line-height:1.5}.steps{display:flex;flex-direction:column}.step{border:1px solid #1e293b;border-radius:10px;overflow:hidden;margin-bottom:8px}.step.on{border-color:#334155}.step.cur{border-color:#0D9488}.step-h{display:flex;align-items:center;gap:10px;padding:12px 16px}.step-n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}.step:not(.on) .step-n{background:#334155;color:#64748b}.step.on .step-n{background:#0D9488;color:#fff}.step-t{font-size:.85rem;color:#94a3b8}.step.on .step-t{color:#e2e8f0}.step-b{display:none;padding:0 16px 16px}.step.on .step-b{display:block}.step-e{font-size:.82rem;color:#94a3b8;line-height:1.6;margin-bottom:10px}.step-m{font-family:'Courier New',monospace;font-size:1.1rem;color:#14b8a6;background:#0f172a;padding:10px 16px;border-radius:8px;text-align:center}.step-m .hl{color:#f59e0b}.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:#0D9488;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:16px}.btn:hover{background:#0a7c72}.btn.done{background:#22c55e}.pg{display:flex;gap:4px;justify-content:center;margin-bottom:20px}.dot{width:10px;height:10px;border-radius:50%;background:#334155;transition:background .3s}.dot.on{background:#0D9488}.nav{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap}.nav button{padding:6px 12px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;cursor:pointer;font-size:.75rem;transition:all .15s}.nav button.on{background:#0D9488;color:#fff}</style></head><body>
<h1>Percentage Change</h1><p class="sub">Increase, decrease, and percentage change — step by step.</p>
<div class="ex"><div class="prob"><div class="prob-l">Calculate</div><div class="prob-t" id="pt"></div></div><div class="pg" id="pg"></div><div class="steps" id="ss"></div><button class="btn" id="btn" onclick="next()">Show next step</button><div class="nav" id="nav"></div></div>
<script>
var P=[
{t:"A shirt costs $40. It is reduced by 25%. What is the new price?",s:[
{t:"Write the formula",e:"New price = original × (1 − percentage/100)",m:"New = 40 × (1 − 25/100)"},
{t:"Calculate the multiplier",e:"1 − 25/100 = 1 − 0.25 = 0.75",m:"New = 40 × <span class='hl'>0.75</span>"},
{t:"Multiply",e:"40 × 0.75 = 30",m:"New price = <span class='hl'>$30</span>"},
{t:"Check",e:"25% of 40 = 10. 40 − 10 = 30 ✓",m:"$40 − $10 = $30 ✓"},
]},
{t:"A population grows from 1200 to 1500. What is the percentage increase?",s:[
{t:"Write the formula",e:"% change = (new − old) ÷ old × 100",m:"% change = (1500 − 1200) ÷ 1200 × 100"},
{t:"Calculate the change",e:"1500 − 1200 = 300",m:"% change = <span class='hl'>300</span> ÷ 1200 × 100"},
{t:"Divide by original",e:"300 ÷ 1200 = 0.25",m:"% change = <span class='hl'>0.25</span> × 100"},
{t:"Convert to percentage",e:"0.25 × 100 = 25%",m:"Percentage increase = <span class='hl'>25%</span>"},
]},
{t:"After a 20% increase, a phone costs $360. What was the original price?",s:[
{t:"Set up the equation",e:"Original × 1.20 = 360 (because a 20% increase means multiplying by 1.20)",m:"Original × 1.20 = 360"},
{t:"Divide both sides by 1.20",e:"To find the original, reverse the multiplication.",m:"Original = 360 ÷ <span class='hl'>1.20</span>"},
{t:"Calculate",e:"360 ÷ 1.20 = 300",m:"Original price = <span class='hl'>$300</span>"},
{t:"Check",e:"20% of 300 = 60. 300 + 60 = 360 ✓",m:"$300 + $60 = $360 ✓"},
]},
];
var ci=0,ri=0;
function load(i){ci=i;ri=0;document.getElementById('pt').textContent=P[i].t;var s=P[i].s,c=document.getElementById('ss');c.innerHTML='';s.forEach(function(st,j){var d=document.createElement('div');d.className='step';d.id='s'+j;d.innerHTML='<div class="step-h"><div class="step-n">'+(j+1)+'</div><div class="step-t">'+st.t+'</div></div><div class="step-b"><div class="step-e">'+st.e+'</div><div class="step-m">'+st.m+'</div></div>';c.appendChild(d)});var p=document.getElementById('pg');p.innerHTML='';s.forEach(function(){var d=document.createElement('div');d.className='dot';p.appendChild(d)});var n=document.getElementById('nav');n.innerHTML='';P.forEach(function(pr,j){var b=document.createElement('button');b.className=j===i?'on':'';b.textContent='Problem '+(j+1);b.onclick=function(){load(j)};n.appendChild(b)});document.getElementById('btn').textContent='Show next step';document.getElementById('btn').className='btn';document.getElementById('btn').onclick=next}
function next(){var s=P[ci].s;if(ri>=s.length)return;document.getElementById('s'+ri).classList.add('on','cur');if(ri>0)document.getElementById('s'+(ri-1)).classList.remove('cur');document.querySelectorAll('.dot')[ri].classList.add('on');ri++;if(ri>=s.length){var b=document.getElementById('btn');b.textContent='✓ Complete';b.className='btn done';b.onclick=function(){load((ci+1)%P.length)}}}
load(0);
</script></body></html>
