<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Explainers</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f8faf9;color:#134e4a;line-height:1.6}.app{max-width:620px;margin:0 auto;padding:20px}h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}.sub{font-size:.82rem;color:#5f8a82;margin-bottom:16px}.search-box{width:100%;padding:12px 18px;border-radius:10px;border:1.5px solid #d5e5e0;background:#fff;font-size:.92rem;font-family:inherit;color:#134e4a;outline:0;transition:border-color .15s;margin-bottom:16px}.search-box:focus{border-color:#0d9488}.search-box::placeholder{color:#b0cec6}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}.f-btn{padding:7px 14px;border-radius:8px;border:1.5px solid #d5e5e0;background:#fff;color:#5f8a82;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}.f-btn:hover{border-color:#0d9488;color:#0d9488}.f-btn.active{background:#0d9488;border-color:#0d9488;color:#fff}.cards{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1.5px solid #d5e5e0;border-radius:14px;overflow:hidden;transition:border-color .2s}.card:hover{border-color:#0d9488}.card-top{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}.card-icon{font-size:1.6rem;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#f0fdf4;border-radius:12px;flex-shrink:0}.card-title{font-size:1rem;font-weight:700;color:#134e4a;flex:1}.card-subject{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:3px 8px;border-radius:5px;flex-shrink:0}.subj-math{background:rgba(13,148,136,.1);color:#0d9488}.subj-sci{background:rgba(37,99,235,.1);color:#2563eb}.card-arrow{color:#d5e5e0;font-size:1rem;transition:transform .2s;flex-shrink:0}.card.open .card-arrow{transform:rotate(180deg);color:#0d9488}.card-body{max-height:0;overflow:hidden;transition:max-height .35s ease}.card.open .card-body{max-height:500px}.card-content{padding:0 18px 18px}.explain-box{padding:16px 18px;background:#f0fdf4;border-radius:10px;border-left:3px solid #0d9488;font-size:.92rem;color:#134e4a;line-height:1.7;margin-bottom:12px}.explain-box strong{color:#0d9488}.key-words{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}.kw{padding:4px 10px;background:#e6faf6;border-radius:6px;font-size:.72rem;font-weight:600;color:#0d9488}.card-links{display:flex;gap:8px;flex-wrap:wrap}.cl{padding:6px 12px;border-radius:6px;border:1px solid #d5e5e0;background:#fff;color:#5f8a82;font-size:.72rem;font-weight:600;text-decoration:none;transition:all .15s}.cl:hover{border-color:#0d9488;color:#0d9488}.empty{text-align:center;padding:40px 20px;color:#5f8a82;font-size:.92rem}@media(max-width:480px){.card-top{padding:12px 14px}.explain-box{padding:12px 14px;font-size:.85rem}}</style></head><body><div class="app"><h1>💡 Simple Explainers</h1><p class="sub">Every topic explained in plain language. If you don't understand the investigation, start here.</p><input class="search-box" placeholder="Search topics... (e.g. algebra, forces, cells)" oninput="filterCards()"><div class="filters"><button class="f-btn active" onclick='setFilter("all")'>All</button> <button class="f-btn" onclick='setFilter("math")'>Mathematics</button> <button class="f-btn" onclick='setFilter("science")'>Science</button></div><div class="cards" id="cards"></div></div><script>const TOPICS=[{title:"Algebra",icon:"🔤",subject:"math",explain:"Algebra is when we use <strong>letters to stand for numbers we don't know yet</strong>. Instead of saying 'some number plus 3 equals 10', we write <strong>x + 3 = 10</strong>. The letter x is a placeholder. Your job is to figure out what number x is. In this case, x = 7, because 7 + 3 = 10. That's it — algebra is just finding the missing number.",words:["Variable","Expression","Equation","Substitute","Coefficient"],links:[{label:"Visual explainer",href:"/students/help/#algebra"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Fractions",icon:"🍕",subject:"math",explain:"A fraction is a way of writing <strong>part of a whole thing</strong>. If you cut a pizza into 4 equal slices and eat 1 slice, you ate <strong>¼</strong> (one quarter) of the pizza. The bottom number (4) tells you how many equal parts there are. The top number (1) tells you how many parts you're talking about. Fractions, decimals, and percentages are three different ways of writing the same thing: ½ = 0.5 = 50%.",words:["Numerator","Denominator","Equivalent","Simplify","Mixed number"],links:[{label:"Visual explainer",href:"/students/help/#fractions"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Percentages",icon:"💯",subject:"math",explain:"Percent means <strong>'out of 100'</strong>. So 25% means 25 out of every 100. If a shop has a 20% discount, they're taking away 20 out of every 100 yuan. To find a percentage of a number, multiply and divide by 100. For example, 30% of 50 = (30 × 50) ÷ 100 = 15.",words:["Percent","Discount","Increase","Decrease","Of"],links:[{label:"Visual explainer",href:"/students/help/#percentages"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Ratio & Proportion",icon:"⚖️",subject:"math",explain:"A ratio compares <strong>two amounts</strong>. If a recipe uses 2 cups of flour and 1 cup of sugar, the ratio is <strong>2:1</strong>. It means 'for every 2 cups of flour, use 1 cup of sugar.' If you double the recipe, you keep the same ratio: 4:2. The amounts change but the relationship stays the same.",words:["Ratio","Proportion","Simplify","Scale","Equivalent"],links:[{label:"Visual explainer",href:"/students/help/#ratio"}]},{title:"Coordinates",icon:"📍",subject:"math",explain:"Coordinates tell you <strong>exactly where a point is</strong> on a grid. You write them as <strong>(x, y)</strong> — the first number says how far to go across (left/right), the second says how far to go up/down. The point (3, 2) means 'go 3 steps right and 2 steps up from the centre.' The centre is called the origin: (0, 0).",words:["x-axis","y-axis","Origin","Quadrant","Plot"],links:[{label:"Visual explainer",href:"/students/help/#coordinates"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Probability",icon:"🎲",subject:"math",explain:"Probability measures <strong>how likely something is to happen</strong>. It goes from 0 (impossible) to 1 (certain). If you flip a fair coin, there are 2 possible outcomes and 1 is heads, so <strong>P(heads) = ½ = 0.5</strong>. That means heads will happen about half the time. To find probability: count the outcomes you want, divide by the total outcomes.",words:["Probability","Event","Outcome","Fair","Random"],links:[{label:"Visual explainer",href:"/students/help/#probability"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Area & Perimeter",icon:"📐",subject:"math",explain:"<strong>Perimeter</strong> is the distance around the outside of a shape — imagine walking around the edge. <strong>Area</strong> is the space inside — imagine painting the floor. Perimeter is measured in cm or m. Area is measured in cm² or m² (square units) because you're covering a surface, not walking a line.",words:["Perimeter","Area","Length","Width","Square units"],links:[{label:"Visual explainer",href:"/students/help/#area-perimeter"}]},{title:"Sequences",icon:"🔢",subject:"math",explain:"A sequence is a <strong>list of numbers that follow a pattern</strong>. For example: 2, 5, 8, 11, 14... Each number is 3 more than the one before. If you can find the pattern, you can predict any number in the sequence without listing them all. The rule here is: <strong>start at 2, add 3 each time</strong> (or as a formula: T(n) = 3n − 1).",words:["Sequence","Term","Pattern","Rule","Common difference"],links:[{label:"Visual explainer",href:"/students/help/#sequences"}]},{title:"Mean, Median, Mode",icon:"📊",subject:"math",explain:"These are three ways to find the <strong>'typical' value</strong> in a set of data. The <strong>mean</strong> is the average (add everything up, divide by how many). The <strong>median</strong> is the middle value when you put them in order. The <strong>mode</strong> is the value that appears most often. Each one tells a slightly different story about your data.",words:["Mean","Median","Mode","Range","Average"],links:[{label:"Visual explainer",href:"/students/help/#mean-median-mode"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Forces",icon:"💪",subject:"science",explain:"A force is a <strong>push or a pull</strong>. You can't see forces, but you can see what they do — they make things speed up, slow down, change direction, or change shape. Forces are measured in <strong>Newtons (N)</strong>. Gravity pulls you down. Friction slows you down. When forces are balanced, nothing changes. When forces are unbalanced, the object moves.",words:["Force","Newton","Friction","Gravity","Balanced"],links:[{label:"Visual explainer",href:"/students/help/#forces"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Cells",icon:"🔬",subject:"science",explain:"A cell is the <strong>smallest building block of every living thing</strong>. Your body is made of about 37 trillion cells. Each cell has a <strong>membrane</strong> (the skin), <strong>cytoplasm</strong> (the jelly inside), and a <strong>nucleus</strong> (the control centre with DNA). Plant cells also have a cell wall, chloroplasts, and a large vacuole. Cells are too small to see without a microscope.",words:["Cell","Nucleus","Membrane","Cytoplasm","Mitochondria"],links:[{label:"Visual explainer",href:"/students/help/#cells"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Density",icon:"🧊",subject:"science",explain:"Density tells you <strong>how heavy something is for its size</strong>. A small piece of metal feels heavy — it's dense. A big piece of foam feels light — it's not dense. The formula is <strong>density = mass ÷ volume</strong>. If something is less dense than water (less than 1 g/cm³), it floats. If it's more dense, it sinks.",words:["Density","Mass","Volume","Float","Sink"],links:[{label:"Visual explainer",href:"/students/help/#density"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Energy",icon:"⚡",subject:"science",explain:"Energy is the <strong>ability to make things happen</strong>. A moving ball has kinetic energy. A ball at the top of a hill has potential energy (stored, ready to go). Energy can change from one type to another — like a battery's chemical energy becoming electrical energy — but it <strong>can never be created or destroyed</strong>. It just moves around.",words:["Kinetic","Potential","Thermal","Transfer","Conservation"],links:[{label:"Visual explainer",href:"/students/help/#energy"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Ecology & Food Webs",icon:"🌿",subject:"science",explain:"Ecology is the study of <strong>how living things interact with each other and their environment</strong>. A food chain shows who eats who: grass → rabbit → fox. The arrow means 'is eaten by.' Producers (plants) make food from sunlight. Consumers eat other organisms. Decomposers break down dead things. If you remove one species, the whole chain is affected.",words:["Ecosystem","Producer","Consumer","Decomposer","Food chain"],links:[{label:"Visual explainer",href:"/students/help/#food-webs"},{label:"Quick check",href:"/students/quick-check/"}]},{title:"Chemical Reactions",icon:"🧪",subject:"science",explain:"A chemical reaction is when <strong>substances change into new, different substances</strong>. The starting substances are called reactants. The new substances are called products. Signs that a reaction has happened: colour change, gas bubbles, temperature change, or a new solid forming. Atoms are rearranged but <strong>never created or destroyed</strong> — the total mass stays the same.",words:["Reactant","Product","Chemical change","Conservation of mass","Exothermic"],links:[{label:"Visual explainer",href:"/students/help/#chemical-reactions"}]},{title:"Waves",icon:"🌊",subject:"science",explain:"A wave is a <strong>way of transferring energy without transferring matter</strong>. Think of a wave at a football stadium — people stand and sit, but nobody moves to a new seat. Sound waves, light waves, and water waves all work this way. Every wave has a <strong>frequency</strong> (how many waves per second) and a <strong>wavelength</strong> (the distance from one peak to the next).",words:["Wave","Frequency","Wavelength","Amplitude","Transverse"],links:[{label:"Visual explainer",href:"/students/help/#waves"}]},{title:"Genetics",icon:"🧬",subject:"science",explain:"Genetics is about <strong>how traits are passed from parents to children</strong>. Your traits (eye colour, hair type) are controlled by genes, which are stored in your DNA inside the nucleus of every cell. You get one copy of each gene from your mum and one from your dad. Some gene versions are <strong>dominant</strong> (they show up) and others are <strong>recessive</strong> (they're hidden unless you get two copies).",words:["Gene","DNA","Dominant","Recessive","Inheritance"],links:[{label:"Visual explainer",href:"/students/help/#genetics"}]},{title:"Particles & States of Matter",icon:"🔵",subject:"science",explain:"Everything is made of tiny <strong>particles</strong> (atoms or molecules). In a <strong>solid</strong>, particles are packed tightly and vibrate in place — that's why solids keep their shape. In a <strong>liquid</strong>, particles can slide past each other — that's why liquids flow. In a <strong>gas</strong>, particles fly around freely — that's why gas fills any container. Heating makes particles move faster.",words:["Solid","Liquid","Gas","Particle","Melting point"],links:[{label:"Visual explainer",href:"/students/help/#particles"}]}];let activeFilter="all";function render(e){const t=document.getElementById("cards");e.length?t.innerHTML=e.map((e,t)=>`\n    <div class="card" data-idx="${t}" data-subject="${e.subject}" onclick="toggleCard(this)">\n      <div class="card-top">\n        <div class="card-icon">${e.icon}</div>\n        <div class="card-title">${e.title}</div>\n        <span class="card-subject ${"math"===e.subject?"subj-math":"subj-sci"}">${"math"===e.subject?"MATHS":"SCIENCE"}</span>\n        <span class="card-arrow">▼</span>\n      </div>\n      <div class="card-body">\n        <div class="card-content">\n          <div class="explain-box">${e.explain}</div>\n          <div class="key-words">${e.words.map(e=>`<span class="kw">${e}</span>`).join("")}</div>\n          <div class="card-links">${e.links.map(e=>`<a class="cl" href="${e.href}" target="_top">${e.label} →</a>`).join("")}</div>\n        </div>\n      </div>\n    </div>\n  `).join(""):t.innerHTML='<div class="empty">No topics match your search.</div>'}function toggleCard(e){e.classList.toggle("open")}function setFilter(e){activeFilter=e,document.querySelectorAll(".f-btn").forEach(e=>e.classList.remove("active")),event.target.classList.add("active"),filterCards()}function filterCards(){const e=document.querySelector(".search-box").value.toLowerCase();render(TOPICS.filter(t=>{const s="all"===activeFilter||t.subject===activeFilter,a=!e||t.title.toLowerCase().includes(e)||t.words.some(t=>t.toLowerCase().includes(e))||t.explain.toLowerCase().includes(e);return s&&a}))}render(TOPICS)</script></body></html>
