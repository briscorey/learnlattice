<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Dots — LearnLattice</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0f172a;--surface:#1e293b;--card:rgba(30,41,59,.8);--border:rgba(71,85,105,.4);--ink:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--red:#ef4444;--red-g:linear-gradient(135deg,#ef4444,#f97316);--yel:#eab308;--yel-g:linear-gradient(135deg,#eab308,#f59e0b);--teal:#0D9488;--blue:#3b82f6;--violet:#8b5cf6;--pink:#ec4899}body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}.jd-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.jd-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.15;animation:orbFloat 20s ease-in-out infinite}.jd-orb:first-child{width:400px;height:400px;background:var(--violet);top:-100px;left:-100px;animation-delay:0s}.jd-orb:nth-child(2){width:350px;height:350px;background:var(--blue);bottom:-80px;right:-80px;animation-delay:-7s}.jd-orb:nth-child(3){width:300px;height:300px;background:var(--pink);top:50%;left:50%;animation-delay:-14s}@keyframes orbFloat{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-30px)}50%{transform:translate(-20px,40px)}75%{transform:translate(30px,20px)}}.jd-app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px}.jd-header{text-align:center;margin-bottom:16px}.jd-header h1{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,var(--red),var(--yel));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.jd-header p{font-size:.78rem;color:var(--muted)}.jd-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}.jd-status{text-align:center;margin-bottom:12px;padding:10px 16px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;font-size:.85rem;font-weight:600}.jd-status .turn-red{color:var(--red)}.jd-status .turn-yel{color:var(--yel)}.jd-board-wrap{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:16px;display:inline-block}.jd-board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.jd-cell{width:60px;height:60px;border-radius:50%;background:#0f172a;border:2px solid var(--border);cursor:pointer;transition:all .15s;position:relative;display:flex;align-items:center;justify-content:center}.jd-cell:hover{border-color:var(--teal);background:rgba(13,148,136,.08)}.jd-cell.red{background:var(--red-g);border-color:var(--red);box-shadow:0 0 16px rgba(239,68,68,.3)}.jd-cell.yel{background:var(--yel-g);border-color:var(--yel);box-shadow:0 0 16px rgba(234,179,8,.3)}.jd-cell.last::after{content:'';position:absolute;inset:3px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}.jd-cell.win{animation:winPulse 1s ease-in-out infinite}@keyframes winPulse{0%,100%{box-shadow:0 0 16px rgba(255,255,255,.2)}50%{box-shadow:0 0 32px rgba(255,255,255,.6)}}.jd-cell.dropping{animation:dropIn .4s cubic-bezier(.22,1,.36,1)}@keyframes dropIn{from{transform:translateY(-300px);opacity:0}to{transform:translateY(0);opacity:1}}.jd-col-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}.jd-col-label{height:16px;display:flex;align-items:center;justify-content:center}.jd-col-arrow{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--red);opacity:0;transition:opacity .15s}.jd-board-wrap:hover .jd-col-arrow{opacity:.3}.jd-panel{display:flex;flex-direction:column;gap:12px}.jd-topics{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:14px}.jd-topics h3{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:8px}.jd-topic-tabs{display:flex;flex-wrap:wrap;gap:4px}.jd-topic-tab{padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:0 0;color:var(--muted);font-size:.68rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}.jd-topic-tab:hover{border-color:var(--teal);color:var(--ink)}.jd-topic-tab.on{background:var(--teal);border-color:var(--teal);color:#fff}.jd-question{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:16px;display:none}.jd-question.show{display:block;animation:fadeUp .3s ease}.jd-q-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);margin-bottom:8px}.jd-q-text{font-size:.92rem;font-weight:600;color:var(--ink);margin-bottom:14px;line-height:1.5}.jd-q-opts{display:flex;flex-direction:column;gap:6px}.jd-q-opt{padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:.82rem;cursor:pointer;font-family:inherit;transition:all .15s;text-align:left;line-height:1.4}.jd-q-opt:hover:not(.locked){border-color:var(--teal);color:var(--ink)}.jd-q-opt.correct{border-color:#22c55e;background:rgba(34,197,94,.1);color:#22c55e}.jd-q-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.06);color:var(--red)}.jd-q-opt.locked{cursor:default}.jd-q-feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:.78rem;line-height:1.5;display:none}.jd-q-feedback.show{display:block}.jd-q-feedback.correct{background:rgba(34,197,94,.08);color:#22c55e}.jd-q-feedback.wrong{background:rgba(239,68,68,.06);color:var(--red)}.jd-score{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;gap:16px;justify-content:center}.jd-score-item{text-align:center}.jd-score-item strong{display:block;font-size:1.3rem}.jd-score-item.red strong{color:var(--red)}.jd-score-item.yel strong{color:var(--yel)}.jd-score-item small{font-size:.65rem;color:var(--dim)}.jd-diff-screen{text-align:center;padding:40px 20px}.jd-diff-screen h2{font-size:1.3rem;margin-bottom:8px;background:linear-gradient(135deg,var(--red),var(--yel));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.jd-diff-screen p{font-size:.82rem;color:var(--muted);margin-bottom:24px}.jd-diff-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.jd-diff-btn{padding:16px 28px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);backdrop-filter:blur(12px);color:var(--ink);cursor:pointer;font-family:inherit;transition:all .2s;text-align:center;min-width:140px}.jd-diff-btn:hover{border-color:var(--teal);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}.jd-diff-btn strong{display:block;font-size:.95rem;margin-bottom:4px}.jd-diff-btn small{font-size:.7rem;color:var(--dim)}.jd-win{display:none;text-align:center;padding:20px 16px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px}.jd-win.show{display:block;animation:fadeUp .4s ease}.jd-win h2{font-size:1.2rem;margin-bottom:8px}.jd-win p{font-size:.82rem;color:var(--muted);margin-bottom:14px}.jd-win button{padding:10px 24px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:800px){.jd-layout{grid-template-columns:1fr}.jd-cell{width:44px;height:44px}.jd-board-wrap{padding:10px}}</style></head><body><div class="jd-bg"><div class="jd-orb"></div><div class="jd-orb"></div><div class="jd-orb"></div></div><div class="jd-app"><div class="jd-header"><h1>🔴🟡 Join Dots</h1><p>Answer a question to earn your move. Connect 4 to win!</p></div><div id="jdDiffScreen" class="jd-diff-screen"><h2>Choose Difficulty</h2><p>How smart should your opponent be?</p><div class="jd-diff-btns"><button class="jd-diff-btn" onclick="startGame(1)"><strong>🟢 Easy</strong><small>Sometimes makes mistakes</small></button> <button class="jd-diff-btn" onclick="startGame(3)"><strong>🟡 Medium</strong><small>Plays well, misses some</small></button> <button class="jd-diff-btn" onclick="startGame(5)"><strong>🔴 Hard</strong><small>Strategic and ruthless</small></button></div></div><div id="jdGame" style="display:none"><div class="jd-layout"><div><div class="jd-status" id="jdStatus">Your turn — answer a question to play!</div><div class="jd-board-wrap"><div class="jd-col-labels" id="jdColLabels"></div><div class="jd-board" id="jdBoard"></div></div></div><div class="jd-panel"><div class="jd-score"><div class="jd-score-item red"><strong id="jdRedScore">0</strong><small>You (🔴)</small></div><div class="jd-score-item"><strong id="jdDraws">0</strong><small>Draws</small></div><div class="jd-score-item yel"><strong id="jdYelScore">0</strong><small>AI (🟡)</small></div></div><div class="jd-topics"><h3>Pick your topic</h3><div class="jd-topic-tabs" id="jdTopics"></div></div><div class="jd-question" id="jdQuestion"></div><div class="jd-win" id="jdWin"></div></div></div></div></div><script>var board,currentPlayer,gameOver,aiDepth,pendingCol,animating,ROWS=6,COLS=7,scores={red:0,yel:0,draws:0},activeTopic="all",QUESTIONS={algebra:[{q:"Solve: 3x + 7 = 22",opts:["x = 5","x = 7","x = 3","x = 15"],a:0,why:"Subtract 7: 3x = 15. Divide by 3: x = 5."},{q:"What is the gradient of y = 4x − 3?",opts:["4","−3","3","−4"],a:0,why:"In y = mx + c, the gradient m is the coefficient of x."},{q:"Simplify: 5a + 3b − 2a + b",opts:["3a + 4b","7a + 4b","3a + 2b","7a + 2b"],a:0,why:"Combine like terms: 5a − 2a = 3a, 3b + b = 4b."},{q:"What is the y-intercept of y = 2x + 5?",opts:["5","2","−5","7"],a:0,why:"The y-intercept is the constant c in y = mx + c."},{q:"Expand: 3(2x − 4)",opts:["6x − 12","6x − 4","5x − 12","6x + 12"],a:0,why:"Multiply each term: 3 × 2x = 6x, 3 × (−4) = −12."},{q:"If n = 5, what is 2n² + 1?",opts:["51","26","11","101"],a:0,why:"2 × 5² + 1 = 2 × 25 + 1 = 51."},{q:"Common difference in: 3, 7, 11, 15...?",opts:["4","3","7","5"],a:0,why:"Each term increases by 4."},{q:"Solve: x/4 = 6",opts:["x = 24","x = 2","x = 10","x = 1.5"],a:0,why:"Multiply both sides by 4: x = 24."},{q:"Solve: 5x − 3 = 17",opts:["x = 4","x = 5","x = 3","x = 2.8"],a:0,why:"Add 3: 5x = 20. Divide by 5: x = 4."},{q:"What is the nth term of 5, 8, 11, 14...?",opts:["3n + 2","3n + 5","5n + 3","n + 3"],a:0,why:"Common difference is 3. When n=1: 3(1)+2 = 5. ✓"},{q:"Factorise: 6x + 12",opts:["6(x + 2)","3(2x + 4)","6(x + 12)","2(3x + 6)"],a:0,why:"HCF of 6 and 12 is 6. Factor out: 6(x + 2)."},{q:"If y = 3x − 1, what is y when x = 4?",opts:["11","13","12","7"],a:0,why:"y = 3(4) − 1 = 12 − 1 = 11."},{q:"Solve: 2(x + 3) = 14",opts:["x = 4","x = 7","x = 5.5","x = 4.5"],a:0,why:"Expand: 2x + 6 = 14. Subtract 6: 2x = 8. x = 4."},{q:"What does the inequality x > 3 mean?",opts:["x is greater than 3","x is less than 3","x equals 3","x is at least 3"],a:0,why:"The > symbol means 'greater than'."},{q:"Simplify: 4x × 3x",opts:["12x²","12x","7x","7x²"],a:0,why:"Multiply coefficients: 4×3=12. Multiply x×x=x². Answer: 12x²."},{q:"What is the value of 3² + 4²?",opts:["25","24","7","49"],a:0,why:"3² = 9, 4² = 16. 9 + 16 = 25."},{q:"Solve: 3x + 2 = x + 10",opts:["x = 4","x = 6","x = 3","x = 8"],a:0,why:"Subtract x: 2x + 2 = 10. Subtract 2: 2x = 8. x = 4."},{q:"What type of sequence is 2, 6, 18, 54?",opts:["Geometric","Arithmetic","Fibonacci","Square"],a:0,why:"Each term is multiplied by 3 — that's a geometric sequence."}],fractions:[{q:"What is ½ + ⅓?",opts:["5/6","2/3","1","2/5"],a:0,why:"Common denominator: 3/6 + 2/6 = 5/6."},{q:"Convert 0.75 to a fraction",opts:["3/4","3/5","7/8","2/3"],a:0,why:"0.75 = 75/100 = 3/4."},{q:"What is ⅔ of 18?",opts:["12","9","6","15"],a:0,why:"18 ÷ 3 = 6, then 6 × 2 = 12."},{q:"Simplify 12/16",opts:["3/4","2/3","5/8","4/5"],a:0,why:"Divide both by 4: 12÷4=3, 16÷4=4."},{q:"What is 30% as a fraction?",opts:["3/10","1/3","3/100","30/10"],a:0,why:"30% = 30/100 = 3/10."},{q:"What is ¾ − ¼?",opts:["1/2","1/4","2/4","1"],a:0,why:"Same denominator: 3/4 − 1/4 = 2/4 = 1/2."},{q:"Convert ⅗ to a decimal",opts:["0.6","0.35","0.53","0.67"],a:0,why:"3 ÷ 5 = 0.6."},{q:"What is ½ × ⅓?",opts:["1/6","1/5","2/3","5/6"],a:0,why:"Multiply numerators: 1×1=1. Denominators: 2×3=6."},{q:"Which is bigger: ⅗ or ⅔?",opts:["2/3","3/5","They are equal","Cannot tell"],a:0,why:"2/3 = 10/15, 3/5 = 9/15. 10/15 > 9/15."},{q:"What is 25% of 80?",opts:["20","25","40","15"],a:0,why:"25% = 1/4. 80 ÷ 4 = 20."},{q:"Convert 1.25 to a mixed number",opts:["1 and 1/4","1 and 1/5","1 and 2/5","5/4"],a:0,why:"0.25 = 1/4, so 1.25 = 1 and 1/4."},{q:"What is ⅓ + ¼?",opts:["7/12","2/7","1/7","4/7"],a:0,why:"Common denominator 12: 4/12 + 3/12 = 7/12."},{q:"Simplify 15/25",opts:["3/5","5/3","1/5","2/5"],a:0,why:"Divide both by 5: 15÷5=3, 25÷5=5."},{q:"What is ¾ ÷ ½?",opts:["3/2","3/8","1/2","2/3"],a:0,why:"Dividing by 1/2 = multiplying by 2. 3/4 × 2 = 6/4 = 3/2."},{q:"40% of a number is 20. What is the number?",opts:["50","80","40","30"],a:0,why:"20 ÷ 0.4 = 50. Check: 40% of 50 = 20. ✓"}],probability:[{q:"A fair die is rolled. P(even)?",opts:["1/2","1/3","1/6","2/3"],a:0,why:"Even numbers: 2, 4, 6 = 3 out of 6 = 1/2."},{q:"A bag has 3 red, 2 blue. P(red)?",opts:["3/5","2/5","3/2","1/3"],a:0,why:"3 red out of 5 total = 3/5."},{q:"Two coins flipped. P(both heads)?",opts:["1/4","1/2","1/3","3/4"],a:0,why:"4 outcomes (HH,HT,TH,TT). Only 1 is HH = 1/4."},{q:"Spinner has 8 equal sections. P(5)?",opts:["1/8","5/8","1/5","1/4"],a:0,why:"Each section equally likely: 1 out of 8."},{q:"If P(rain) = 0.3, what is P(no rain)?",opts:["0.7","0.3","1.3","0.03"],a:0,why:"P(not A) = 1 − P(A) = 1 − 0.3 = 0.7."},{q:"A coin is flipped. P(heads)?",opts:["1/2","1/4","1","0"],a:0,why:"A fair coin has 2 equally likely outcomes."},{q:"Rolling a die, P(greater than 4)?",opts:["2/6","4/6","1/6","3/6"],a:0,why:"Numbers > 4 are 5 and 6 = 2 outcomes out of 6."},{q:"A bag has 5 red, 3 green, 2 blue. P(green)?",opts:["3/10","3/5","5/10","2/10"],a:0,why:"3 green out of 10 total = 3/10."},{q:"An event is certain. Its probability is?",opts:["1","0","1/2","2"],a:0,why:"Certain events have probability = 1 (100%)."},{q:"An event is impossible. Its probability is?",opts:["0","1","−1","1/2"],a:0,why:"Impossible events have probability = 0."},{q:"P(A) = 0.4, P(B) = 0.3 (independent). P(A and B)?",opts:["0.12","0.7","0.1","0.43"],a:0,why:"For independent events: P(A and B) = 0.4 × 0.3 = 0.12."},{q:"A card is drawn from 52 cards. P(heart)?",opts:["13/52","4/52","1/52","26/52"],a:0,why:"13 hearts in a deck of 52 = 13/52 = 1/4."},{q:"Expected heads in 100 fair coin flips?",opts:["50","100","25","75"],a:0,why:"Expected value = n × P = 100 × 0.5 = 50."},{q:"Relative frequency: 30 sixes in 200 rolls. Estimate P(6)?",opts:["0.15","0.3","30","0.06"],a:0,why:"Relative frequency = 30/200 = 0.15."},{q:"Which CANNOT be a probability?",opts:["1.5","0","0.5","1"],a:0,why:"Probabilities must be between 0 and 1 inclusive."}],forces:[{q:"Force is measured in?",opts:["Newtons (N)","Joules (J)","Watts (W)","Pascals (Pa)"],a:0,why:"Force is measured in Newtons."},{q:"Balanced forces mean the object...",opts:["Stays the same","Speeds up","Slows down","Falls"],a:0,why:"Balanced forces = no change in motion."},{q:"What is mass × acceleration?",opts:["Force","Energy","Power","Speed"],a:0,why:"F = ma (Newton's 2nd law)."},{q:"Friction always acts...",opts:["Against motion","With motion","Upward","Randomly"],a:0,why:"Friction opposes the direction of movement."},{q:"Weight is measured in...",opts:["Newtons","Kilograms","Grams","Metres"],a:0,why:"Weight is a force, measured in Newtons. Mass is in kg."},{q:"Weight = mass × ...",opts:["Gravitational field strength","Speed","Volume","Density"],a:0,why:"W = mg, where g ≈ 10 N/kg on Earth."},{q:"What is g on Earth (approx)?",opts:["10 N/kg","100 N/kg","1 N/kg","10 kg"],a:0,why:"Gravitational field strength on Earth ≈ 10 N/kg."},{q:"A 5 kg mass on Earth weighs?",opts:["50 N","5 N","500 N","0.5 N"],a:0,why:"W = mg = 5 × 10 = 50 N."},{q:"Air resistance is a type of...",opts:["Friction","Gravity","Weight","Energy"],a:0,why:"Air resistance is friction between an object and air."},{q:"An object at constant speed has...",opts:["Balanced forces","Unbalanced forces","No forces","Increasing force"],a:0,why:"Constant speed = zero resultant force = balanced."},{q:"Newton's 3rd law: every action has...",opts:["An equal opposite reaction","A bigger reaction","No reaction","A delayed reaction"],a:0,why:"Forces always come in equal and opposite pairs."},{q:"What force pulls objects toward Earth?",opts:["Gravity","Friction","Air resistance","Magnetism"],a:0,why:"Gravity is the force of attraction between masses."},{q:"Terminal velocity occurs when...",opts:["Air resistance = weight","Speed = 0","Gravity = 0","Mass increases"],a:0,why:"At terminal velocity, drag force equals weight."},{q:"A 60 kg person on the Moon (g=1.6). Weight?",opts:["96 N","60 N","600 N","9.6 N"],a:0,why:"W = mg = 60 × 1.6 = 96 N."},{q:"Pressure = force ÷ ...",opts:["Area","Volume","Mass","Speed"],a:0,why:"P = F/A. More area = less pressure."}],cells:[{q:"Which organelle is the 'powerhouse'?",opts:["Mitochondria","Nucleus","Ribosome","Cell membrane"],a:0,why:"Mitochondria produce energy (ATP) via respiration."},{q:"What controls entry/exit from a cell?",opts:["Cell membrane","Nucleus","Cytoplasm","Cell wall"],a:0,why:"The cell membrane is selectively permeable."},{q:"Found in plant cells but NOT animal?",opts:["Cell wall","Nucleus","Mitochondria","Cytoplasm"],a:0,why:"Plant cells have a rigid cell wall."},{q:"Where is DNA found?",opts:["Nucleus","Cytoplasm","Membrane","Ribosome"],a:0,why:"DNA is stored in the nucleus."},{q:"What makes proteins in a cell?",opts:["Ribosomes","Mitochondria","Nucleus","Vacuole"],a:0,why:"Ribosomes are the site of protein synthesis."},{q:"What fills most of the cell?",opts:["Cytoplasm","Nucleus","Vacuole","Membrane"],a:0,why:"Cytoplasm is the jelly-like substance fillin
