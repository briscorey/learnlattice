<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MYP Assessment Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f8faf9;color:#134E4A;line-height:1.5}
.app{max-width:760px;margin:0 auto;padding:20px}
h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
.sub{font-size:.82rem;color:#5f8a82;margin-bottom:20px}
.stepper{display:flex;gap:4px;margin-bottom:24px}
.step-dot{flex:1;height:4px;border-radius:2px;background:#d5e5e0;transition:background .3s}
.step-dot.done{background:#0D9488}.step-dot.active{background:#134E4A}
.step-label{font-size:.72rem;color:#5f8a82;margin-bottom:16px;font-weight:600}
.panel{display:none}.panel.active{display:block}
.form-group{margin-bottom:18px}
.form-label{font-size:.78rem;font-weight:700;color:#134E4A;margin-bottom:8px;display:block}
.form-hint{font-size:.72rem;color:#5f8a82;margin-top:4px}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-btn{padding:12px 18px;border-radius:10px;border:1.5px solid #d5e5e0;background:#fff;color:#134E4A;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;flex:1;min-width:100px;text-align:center}
.form-btn:hover{border-color:#0D9488;background:#f0fdf4}
.form-btn.selected{background:#0D9488;border-color:#0D9488;color:#fff}
.form-input,.form-textarea{width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid #d5e5e0;font-size:.88rem;font-family:inherit;color:#134E4A;outline:none;transition:border-color .15s}
.form-textarea{resize:vertical;min-height:80px}
.form-input:focus,.form-textarea:focus{border-color:#0D9488}
.form-input::placeholder,.form-textarea::placeholder{color:#b0cec6}
.actions{display:flex;gap:10px;margin-top:24px}
.btn-back{padding:10px 20px;border-radius:10px;border:1.5px solid #d5e5e0;background:#fff;color:#5f8a82;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-back:hover{border-color:#0D9488;color:#0D9488}
.btn-next{padding:10px 24px;border-radius:10px;border:none;background:#0D9488;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;margin-left:auto}
.btn-next:hover{background:#0a7c72}
.btn-next:disabled{background:#d5e5e0;color:#5f8a82;cursor:default}
.loading{text-align:center;padding:48px 24px}
.loading-spinner{width:40px;height:40px;border:3px solid #d5e5e0;border-top:3px solid #0D9488;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.92rem;color:#134E4A;font-weight:600;margin-bottom:6px}
.loading-sub{font-size:.78rem;color:#5f8a82}
.loading-dots::after{content:'';animation:dots 1.5s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.output-section{margin-bottom:24px}
.output-section h2{font-size:1.1rem;font-weight:700;color:#134E4A;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.output-section .out-desc{font-size:.78rem;color:#5f8a82;margin-bottom:14px}
.output-box{background:#fff;border:1.5px solid #d5e5e0;border-radius:14px;padding:20px;position:relative}
.output-box h3{font-size:.95rem;font-weight:700;color:#0D9488;margin-bottom:8px}
.output-box h4{font-size:.82rem;font-weight:700;color:#134E4A;margin-top:14px;margin-bottom:6px}
.output-box p{font-size:.88rem;color:#134E4A;line-height:1.65}
.level-tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.65rem;font-weight:700;margin-bottom:6px}
.lt-34{background:rgba(34,197,94,.1);color:#16a34a}
.lt-56{background:rgba(245,158,11,.1);color:#d97706}
.lt-78{background:rgba(13,148,136,.1);color:#0D9488}
.copy-btn{position:absolute;top:12px;right:12px;padding:5px 12px;border-radius:6px;border:1px solid #d5e5e0;background:#f8faf9;color:#5f8a82;font-size:.68rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.copy-btn:hover{border-color:#0D9488;color:#0D9488}
.copy-btn.copied{background:#0D9488;border-color:#0D9488;color:#fff}
.divider{height:1px;background:#d5e5e0;margin:16px 0}
.eal-box{margin-top:14px;padding:12px 16px;background:rgba(37,99,235,.04);border:1px solid rgba(37,99,235,.12);border-radius:8px;font-size:.82rem}
.eal-box strong{color:#2563eb;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.rubric-tbl{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.rubric-tbl th{padding:8px 12px;background:#f0fdf4;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:#0D9488;border-bottom:2px solid #d5e5e0}
.rubric-tbl td{padding:8px 12px;border-bottom:1px solid #f0f5f3;vertical-align:top;line-height:1.5}
.rubric-tbl .lv{font-weight:700;white-space:nowrap;color:#0D9488}
.sample-resp{padding:12px 16px;background:#f8faf9;border-radius:8px;border-left:3px solid #d5e5e0;font-style:italic;font-size:.85rem;margin-bottom:8px;line-height:1.6}
.sample-why{font-size:.78rem;color:#5f8a82;line-height:1.5;padding:8px 12px;background:rgba(124,58,237,.04);border-radius:6px;margin-bottom:14px}
.sample-why strong{color:#7c3aed;font-size:.68rem;text-transform:uppercase;display:block;margin-bottom:3px}
.links-box{margin-top:16px;padding:12px 16px;background:rgba(13,148,136,.04);border:1px solid rgba(13,148,136,.12);border-radius:8px;font-size:.78rem}
.links-box a{color:#0D9488;font-weight:600;text-decoration:none}
.links-box a:hover{text-decoration:underline}
.error-box{padding:20px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);border-radius:12px;text-align:center;margin:20px 0}
.error-box p{font-size:.88rem;color:#991b1b;margin-bottom:10px}
.error-box button{padding:8px 20px;border-radius:8px;border:1px solid #ef4444;background:#fff;color:#ef4444;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.print-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.print-btn{padding:8px 16px;border-radius:8px;border:1.5px solid #d5e5e0;background:#fff;color:#5f8a82;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.print-btn:hover{border-color:#0D9488;color:#0D9488}
.summary-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:12px 16px;background:#f0fdf4;border-radius:10px;font-size:.78rem;color:#134E4A;align-items:center}
.summary-strip span{font-weight:700;color:#0D9488}
.q-block{padding:12px 16px;background:#f8faf9;border:1px solid #e6faf6;border-radius:8px;margin-bottom:8px}
.hook-block{padding:14px 18px;background:linear-gradient(135deg,rgba(13,148,136,.06),rgba(13,148,136,.02));border-radius:10px;border-left:3px solid #0D9488;margin-bottom:14px;font-style:italic;font-size:.92rem;line-height:1.6}
.sf-line{padding:4px 10px;background:rgba(255,255,255,.6);border-radius:4px;border-left:2px solid #2563eb;margin-bottom:4px;font-style:italic;font-size:.82rem}
.sheet-wrap{border:2px solid #d5e5e0;border-radius:12px;padding:24px}
.sheet-hdr{text-align:center;margin-bottom:16px}
.sheet-hdr .s1{font-size:.72rem;color:#5f8a82}.sheet-hdr .s2{font-size:1.15rem;font-weight:700;color:#134E4A;margin:4px 0}.sheet-hdr .s3{font-size:.75rem;color:#5f8a82}
.sheet-sec{margin-bottom:16px}.sheet-sec h4{font-size:.82rem;color:#0D9488;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.sheet-lines{min-height:120px;border:1.5px dashed #d5e5e0;border-radius:8px;margin:14px 0;padding:10px}
.sheet-frame{padding:6px 10px;background:#f8faf9;border-radius:6px;border-left:3px solid #0D9488;margin-bottom:6px;font-size:.82rem;font-style:italic}
@media(max-width:640px){.form-row{flex-direction:column}.form-btn{min-width:auto}.rubric-tbl{display:block;overflow-x:auto}}
@media print{.stepper,.actions,.copy-btn,.print-bar,.btn-back,.btn-next,.summary-strip .edit-link,.panel:not(.active),.form-group,.sub{display:none !important}.output-box{border:1px solid #ccc;break-inside:avoid}body{background:#fff}.panel.active{display:block !important}}
</style>
</head>
<body>
<div class="app">
  <h1>🏗️ MYP Assessment Builder</h1>
  <p class="sub">AI-powered. Describe what you're teaching — get a fully contextualised task, rubric, student sheet, and marking guide.</p>
  <div class="stepper"><div class="step-dot active" id="sd0"></div><div class="step-dot" id="sd1"></div></div>

  <div class="panel active" id="p0">
    <div class="step-label">Step 1 — Describe your assessment</div>
    <div class="form-group">
      <label class="form-label">Criterion</label>
      <div class="form-row">
        <button class="form-btn" onclick="pick('criterion','A')">A — Knowing</button>
        <button class="form-btn" onclick="pick('criterion','B')">B — Investigating</button>
      </div>
      <div class="form-row" style="margin-top:8px">
        <button class="form-btn" onclick="pick('criterion','C')">C — Communicating</button>
        <button class="form-btn" onclick="pick('criterion','D')">D — Applying</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Subject</label>
      <div class="form-row">
        <button class="form-btn" onclick="pick('subject','Mathematics')">Mathematics</button>
        <button class="form-btn" onclick="pick('subject','Science')">Science</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Grade level</label>
      <div class="form-row">
        <button class="form-btn" onclick="pick('grade','6')">Grade 6</button>
        <button class="form-btn" onclick="pick('grade','7')">Grade 7</button>
        <button class="form-btn" onclick="pick('grade','8')">Grade 8</button>
        <button class="form-btn" onclick="pick('grade','9')">Grade 9</button>
        <button class="form-btn" onclick="pick('grade','10')">Grade 10</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Topic</label>
      <input class="form-input" id="topicInput" placeholder="e.g. Area & perimeter, Density, Food webs, Linear equations..." oninput="state.topic=this.value;checkReady()">
    </div>
    <div class="form-group">
      <label class="form-label">Real-world context or scenario</label>
      <textarea class="form-textarea" id="contextInput" placeholder="e.g. The school wants to repave the courtyard. Students measure the courtyard (irregular L-shape, roughly 15m x 20m with a 5m x 8m section removed), research paving costs (¥120-180/m² depending on material), and recommend the best option within a ¥50,000 budget." oninput="state.context=this.value;checkReady()"></textarea>
      <div class="form-hint">Be specific: include real measurements, numbers, constraints, local details. The more you give, the better the output.</div>
    </div>
    <div class="form-group">
      <label class="form-label">Additional notes (optional)</label>
      <input class="form-input" id="notesInput" placeholder="e.g. Many EAL students, 2-period task, focus on graphing, students have studied the topic for 3 weeks..." oninput="state.notes=this.value">
    </div>
    <div class="actions"><button class="btn-next" id="genBtn" disabled onclick="generate()">✨ Generate assessment →</button></div>
  </div>

  <div class="panel" id="p1"><div id="outputArea"></div></div>
</div>
<script>
const state={criterion:'',subject:'',grade:'',topic:'',context:'',notes:''};
const CRN={A:'Knowing & Understanding',B:'Investigating Patterns',C:'Communicating',D:'Applying in Real-Life Contexts'};

function pick(field,val){
  state[field]=val;
  document.querySelectorAll('.form-btn').forEach(b=>{
    const fn=b.getAttribute('onclick')||'';
    if(fn.includes("'"+field+"'"))b.classList.toggle('selected',fn.includes("'"+val+"'"));
  });
  checkReady();
}
function checkReady(){document.getElementById('genBtn').disabled=!(state.criterion&&state.subject&&state.grade&&state.topic&&state.context)}

async function generate(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p1').classList.add('active');
  document.querySelectorAll('.step-dot').forEach((d,i)=>d.className='step-dot'+(i===0?' done':' active'));
  document.getElementById('outputArea').innerHTML=`<div class="loading"><div class="loading-spinner"></div><div class="loading-text">Building your assessment<span class="loading-dots"></span></div><div class="loading-sub">Generating a fully contextualised task for<br><strong>Criterion ${state.criterion}</strong> · ${state.subject} · Grade ${state.grade} · ${state.topic}<br><em style="color:#0D9488">"${state.context.substring(0,80)}${state.context.length>80?'...':''}"</em></div></div>`;

  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,
        messages:[{role:"user",content:buildPrompt()}]})
    });
    if(!r.ok)throw new Error('API error: '+r.status);
    const d=await r.json();
    const txt=(d.content||[]).map(c=>c.text||'').join('');
    let parsed;
    try{const c=txt.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();parsed=JSON.parse(c)}
    catch(e){const m=txt.match(/\{[\s\S]*\}/);if(m)parsed=JSON.parse(m[0]);else throw new Error('Parse error')}
    renderOutput(parsed);
  }catch(err){
    document.getElementById('outputArea').innerHTML=`<div class="error-box"><p>Something went wrong generating the assessment.</p><p style="font-size:.75rem;color:#5f8a82">${err.message}</p><button onclick="goBack()">← Try again</button></div>`;
  }
}

function buildPrompt(){
  const crDesc={
    A:"Criterion A — Knowing & Understanding: demonstrate knowledge, use correct terminology, apply understanding to familiar and unfamiliar situations.",
    B:"Criterion B — Investigating Patterns: select problem-solving techniques, describe patterns as general rules, verify and justify conclusions.",
    C:"Criterion C — Communicating: use appropriate language, notation, multiple representations (tables, graphs, diagrams) with clear logical structure.",
    D:"Criterion D — Applying in Real-Life Contexts: identify real-world problems, select appropriate techniques, apply with real data, evaluate results, justify conclusions."
  };
  return `You are an expert IB MYP ${state.subject} teacher and assessment designer. Create a HIGHLY SPECIFIC assessment task.

INPUTS:
- Criterion: ${crDesc[state.criterion]}
- Subject: ${state.subject}
- Grade: ${state.grade}
- Topic: ${state.topic}
- Real-world context: ${state.context}
${state.notes?'- Teacher notes: '+state.notes:''}

CRITICAL: Every single output field must be DEEPLY SPECIFIC to the context "${state.context}". Use the EXACT measurements, numbers, names, and constraints from the context. Do NOT write generic questions that could apply to any topic. The questions should be IMPOSSIBLE to answer without engaging with this specific context.

Return ONLY a JSON object (no markdown, no backticks, no explanation) with this exact structure:

{"task":{"title":"Specific title referencing the exact context","hook":"2-3 sentence scenario using EXACT details from the context. Include specific numbers, measurements, names, constraints. Make it feel real and urgent.","questions":[{"level":"3-4","text":"Specific question using real numbers from this context. Tests basic recall and application."},{"level":"5-6","text":"Deeper question requiring analysis within this specific context. Must reference specific data."},{"level":"7-8","text":"Complex question requiring evaluation, comparison, or justification within this context. Must require critical thinking."}],"eal_support":{"key_vocabulary":["5 terms specific to this topic and context"],"sentence_frames":["3 sentence frames with blanks, each one specific to this task, not generic"]}},"rubric":[{"level":"1-2","generic":"Generic MYP descriptor","task_specific":"What 1-2 looks like for THIS exact task"},{"level":"3-4","generic":"Generic MYP descriptor","task_specific":"What 3-4 looks like with specific reference to this context"},{"level":"5-6","generic":"Generic MYP descriptor","task_specific":"What 5-6 looks like - reference specific calculations or analysis from this context"},{"level":"7-8","generic":"Generic MYP descriptor","task_specific":"What 7-8 looks like - reference the specific evaluation or justification needed"}],"marking_guide":[{"level":"3-4","sample_response":"A realistic, imperfect Grade ${state.grade} student response at 3-4. Use specific numbers from the context but show incomplete reasoning.","why_this_level":"2-3 sentences explaining what makes this 3-4 and what's missing."},{"level":"5-6","sample_response":"A solid Grade ${state.grade} response at 5-6. Correct work with the specific context data but limited evaluation.","why_this_level":"What makes this 5-6 and what would push it higher."},{"level":"7-8","sample_response":"An excellent Grade ${state.grade} response. Thorough analysis of this specific context with justified conclusions.","why_this_level":"What makes this excellent."}],"teacher_notes":"3-4 sentences: timing, common misconceptions for this specific topic, differentiation tips, how to set up the context."}`;
}

function renderOutput(d){
  let h=`<div class="summary-strip"><span>Criterion ${state.criterion}</span> ${CRN[state.criterion]} · <span>${state.subject}</span> · <span>Grade ${state.grade}</span> · ${state.topic} <a href="#" onclick="goBack();return false" style="margin-left:auto;color:#0D9488;font-weight:600;text-decoration:none" class="edit-link">✏️ Edit</a></div>
  <div class="print-bar"><button class="print-btn" onclick="window.print()">🖨️ Print all</button><button class="print-btn" onclick="copyAll()">📋 Copy all text</button></div>`;

  // TASK
  h+=`<div class="output-section"><h2>📝 Task Prompt</h2><p class="out-desc">Student-facing task. Project or print.</p><div class="output-box" id="taskBox"><button class="copy-btn" onclick="copyBox('taskBox')">Copy</button><h3>${esc(d.task?.title||'Assessment Task')}</h3><div class="hook-block">${esc(d.task?.hook||'')}</div>`;
  (d.task?.questions||[]).forEach(q=>{
    const c=q.level==='3-4'?'lt-34':q.level==='5-6'?'lt-56':'lt-78';
    h+=`<div class="q-block"><span class="level-tag ${c}">Level ${q.level}</span><p>${esc(q.text)}</p></div>`;
  });
  if(d.task?.eal_support){
    h+=`<div class="eal-box"><strong>🌏 EAL Support</strong><p><strong style="font-size:.78rem;color:#134E4A;text-transform:none;letter-spacing:0">Key vocabulary:</strong> ${(d.task.eal_support.key_vocabulary||[]).map(esc).join(', ')}</p><p style="margin-top:6px"><strong style="font-size:.78rem;color:#134E4A;text-transform:none;letter-spacing:0">Sentence frames:</strong></p>${(d.task.eal_support.sentence_frames||[]).map(f=>'<div class="sf-line">'+esc(f)+'</div>').join('')}</div>`;
  }
  h+=`</div></div>`;

  // RUBRIC
  h+=`<div class="output-section"><h2>📊 Task-Specific Rubric</h2><p class="out-desc">Generic IB descriptors translated into task-specific language.</p><div class="output-box" id="rubricBox"><button class="copy-btn" onclick="copyBox('rubricBox')">Copy</button><table class="rubric-tbl"><thead><tr><th>Level</th><th>Generic MYP Descriptor</th><th>What This Looks Like in This Task</th></tr></thead><tbody>`;
  (d.rubric||[]).forEach(r=>{h+=`<tr><td class="lv">${r.level}</td><td style="color:#5f8a82;font-style:italic">${esc(r.generic)}</td><td style="font-weight:500">${esc(r.task_specific)}</td></tr>`});
  h+=`</tbody></table></div></div>`;

  // STUDENT SHEET
  h+=`<div class="output-section"><h2>📄 Student Task Sheet</h2><p class="out-desc">Printable handout with task, sentence frames, and self-check.</p><div class="output-box" id="sheetBox"><button class="copy-btn" onclick="copyBox('sheetBox')">Copy</button><div class="sheet-wrap"><div class="sheet-hdr"><div class="s1">MYP ${state.subject} — Criterion ${state.criterion}: ${CRN[state.criterion]}</div><div class="s2">${esc(d.task?.title||'Assessment Task')}</div><div class="s3">Grade ${state.grade} · Name: _________________ · Date: _________________</div></div>`;
  h+=`<div class="sheet-sec"><h4>The Scenario</h4><p style="font-style:italic;line-height:1.6">${esc(d.task?.hook||'')}</p></div>`;
  h+=`<div class="sheet-sec"><h4>Your Tasks</h4>`;
  (d.task?.questions||[]).forEach((q,i)=>{h+=`<p style="margin-bottom:8px"><strong>${i+1}.</strong> ${esc(q.text)}</p>`});
  h+=`</div><div class="sheet-lines"></div>`;
  h+=`<div class="sheet-sec"><h4>Sentence Frames</h4>${(d.task?.eal_support?.sentence_frames||[]).map(f=>'<div class="sheet-frame">'+esc(f)+'</div>').join('')}</div>`;
  const checks=state.criterion==='A'?['I defined key terms in my own words','I gave examples with real numbers from the scenario','I explained connections between ideas','I used correct '+(state.subject==='Mathematics'?'mathematical':'scientific')+' vocabulary']:state.criterion==='B'?['I tested multiple cases','I recorded data in a clear table','I wrote a general rule','I verified my rule works','I explained WHY the pattern works']:state.criterion==='C'?['I showed all working step by step','My graph/table has title, labels, and units','I used correct notation consistently','I interpreted my results (not just described them)']:['I identified the real-world problem clearly','I used real numbers from the scenario','I showed all my working','I checked my answer is reasonable','I discussed limitations or assumptions'];
  h+=`<div class="sheet-sec"><h4>Before You Submit — Check</h4><div style="font-size:.82rem;line-height:2">${checks.map(c=>'☐ '+c).join('<br>')}</div></div></div></div></div>`;

  // MARKING GUIDE
  h+=`<div class="output-section"><h2>✏️ Marking Guide</h2><p class="out-desc">Sample responses at each level. Use for standardisation.</p><div class="output-box" id="markingBox"><button class="copy-btn" onclick="copyBox('markingBox')">Copy</button>`;
  (d.marking_guide||[]).forEach(m=>{
    const c=m.level==='3-4'?'lt-34':m.level==='5-6'?'lt-56':'lt-78';
    h+=`<span class="level-tag ${c}">Level ${m.level} response</span><div class="sample-resp">"${esc(m.sample_response)}"</div><div class="sample-why"><strong>Why this level?</strong>${esc(m.why_this_level)}</div>`;
  });
  if(d.teacher_notes)h+=`<div class="divider"></div><h4 style="font-size:.82rem;color:#d97706;margin-bottom:6px">💡 Teacher Notes</h4><p style="font-size:.85rem;line-height:1.6">${esc(d.teacher_notes)}</p>`;
  h+=`<div class="links-box"><strong style="color:#0D9488;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px">Related LearnLattice Tools</strong><a href="/assessment/comments/" target="_top">Comment Bank</a> · <a href="/eal/writing-guides/" target="_top">Writing Guides</a> · <a href="/eal/graphic-organizers/" target="_top">Graphic Organizers</a> · <a href="/students/checklist/" target="_top">Investigation Checklist</a> · <a href="/eal/sentence-frames/" target="_top">Sentence Frames</a></div></div></div>`;

  h+=`<div class="actions"><button class="btn-back" onclick="goBack()">← Build another</button><button class="btn-next" onclick="window.print()">🖨️ Print everything</button></div>`;
  document.getElementById('outputArea').innerHTML=h;
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function goBack(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('p0').classList.add('active');document.querySelectorAll('.step-dot').forEach((d,i)=>d.className='step-dot'+(i===0?' active':''))}
function copyBox(id){const t=document.getElementById(id).innerText;navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('#'+id+' .copy-btn');b.textContent='✓ Copied!';b.classList.add('copied');setTimeout(()=>{b.textContent='Copy';b.classList.remove('copied')},1500)})}
function copyAll(){navigator.clipboard.writeText(document.getElementById('outputArea').innerText)}
</script>
</body>
