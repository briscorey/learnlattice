<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Understand Percentages — LearnLattice</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.5rem;background:linear-gradient(135deg,#0D9488,#0D9488aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sub{font-size:.85rem;color:#94a3b8;margin-bottom:20px;text-align:center;max-width:500px}.app{width:100%;max-width:560px}.row{display:flex;align-items:center;gap:12px;margin-bottom:14px;justify-content:center}.row label{font-size:.85rem;color:#94a3b8;min-width:90px;text-align:right}.row input[type=range]{width:180px;accent-color:#0D9488}.row .val{font-family:'Courier New',monospace;color:#0D9488;font-weight:700;min-width:50px;font-size:1rem}.bar-area{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:20px;margin-bottom:16px}.bar-label{display:flex;justify-content:space-between;font-size:.75rem;color:#64748b;margin-bottom:6px}.bar-track{height:32px;background:#1e293b;border-radius:8px;overflow:hidden;position:relative;border:1px solid #334155}.bar-fill{height:100%;border-radius:8px;transition:width .3s,background .3s}.bar-original{background:#0D9488}.bar-change{position:absolute;top:0;height:100%;transition:left .3s,width .3s;border-radius:0 8px 8px 0;opacity:.7}.bar-increase{background:#22c55e}.bar-decrease{background:#ef4444}.result-box{text-align:center;padding:20px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:16px}.result-num{font-family:'Courier New',monospace;font-size:2rem;font-weight:700;color:#0D9488;margin-bottom:4px}.result-calc{font-size:.85rem;color:#94a3b8}.btns{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}.btn{padding:7px 16px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:.8rem;font-family:inherit;transition:all .15s}.btn:hover{border-color:#0D9488;background:#0f172a}.btn.on{border-color:#0D9488;background:rgba(13,148,136,.15);color:#5eead4}.info{padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:.85rem;color:#94a3b8;line-height:1.6;text-align:center}.info strong{color:#0D9488}</style></head><body>
<h1>Percentages: See the Change</h1>
<p class="sub">Adjust the original value and percentage. Watch how the bar and result change.</p>
<div class="app">
  <div class="row"><label>Original:</label><input type="range" id="origSlider" min="10" max="500" value="200" oninput="update()"><span class="val" id="origVal">200</span></div>
  <div class="row"><label>Percentage:</label><input type="range" id="pctSlider" min="1" max="100" value="25" oninput="update()"><span class="val" id="pctVal">25%</span></div>
  <div class="btns">
    <button class="btn on" id="btnInc" onclick="setMode('increase')">Increase ↑</button>
    <button class="btn" id="btnDec" onclick="setMode('decrease')">Decrease ↓</button>
    <button class="btn" id="btnOf" onclick="setMode('of')">% of</button>
  </div>
  <div class="bar-area">
    <div class="bar-label"><span>0</span><span id="barMax">500</span></div>
    <div class="bar-track">
      <div class="bar-fill bar-original" id="barOrig"></div>
      <div class="bar-change" id="barChange"></div>
    </div>
  </div>
  <div class="result-box">
    <div class="result-num" id="resultNum">250</div>
    <div class="result-calc" id="resultCalc">200 + 25% = 250</div>
  </div>
  <div class="info" id="info"><strong>Percent</strong> means "per hundred." So 25% of 200 means 25 out of every 100 — that's <strong>50</strong>.</div>
</div>
<script>
var mode='increase';
function setMode(m){mode=m;document.querySelectorAll('.btn').forEach(b=>b.classList.remove('on'));document.getElementById('btn'+{increase:'Inc',decrease:'Dec',of:'Of'}[m]).classList.add('on');update();}
function update(){
  var orig=+document.getElementById('origSlider').value;
  var pct=+document.getElementById('pctSlider').value;
  document.getElementById('origVal').textContent=orig;
  document.getElementById('pctVal').textContent=pct+'%';
  var change=orig*pct/100;
  var result,calc,barMax=500;
  if(mode==='increase'){result=orig+change;calc=orig+' + '+pct+'% = '+Math.round(result*100)/100;}
  else if(mode==='decrease'){result=orig-change;calc=orig+' − '+pct+'% = '+Math.round(result*100)/100;}
  else{result=change;calc=pct+'% of '+orig+' = '+Math.round(result*100)/100;}
  if(result>barMax)barMax=Math.ceil(result/100)*100;
  document.getElementById('barMax').textContent=barMax;
  document.getElementById('barOrig').style.width=(orig/barMax*100)+'%';
  var ch=document.getElementById('barChange');
  if(mode==='increase'){ch.className='bar-change bar-increase';ch.style.left=(orig/barMax*100)+'%';ch.style.width=(change/barMax*100)+'%';}
  else if(mode==='decrease'){ch.className='bar-change bar-decrease';ch.style.left=((orig-change)/barMax*100)+'%';ch.style.width=(change/barMax*100)+'%';}
  else{ch.className='bar-change bar-increase';ch.style.left='0';ch.style.width=(result/barMax*100)+'%';}
  document.getElementById('resultNum').textContent=Math.round(result*100)/100;
  document.getElementById('resultCalc').textContent=calc;
  var pctPart=Math.round(change*100)/100;
  if(mode==='of') document.getElementById('info').innerHTML='<strong>'+pct+'%</strong> of <strong>'+orig+'</strong> = <strong>'+pctPart+'</strong>. Think: '+pct+' out of every 100. Since '+orig+' has '+(orig/100)+' hundreds, the answer is '+pct+' × '+(orig/100)+' = <strong>'+pctPart+'</strong>.';
  else if(mode==='increase') document.getElementById('info').innerHTML='<strong>'+pct+'%</strong> of '+orig+' is <strong>'+pctPart+'</strong>. Add it on: '+orig+' + '+pctPart+' = <strong>'+Math.round(result*100)/100+'</strong>. The multiplier is <strong>×'+(1+pct/100).toFixed(2)+'</strong>.';
  else document.getElementById('info').innerHTML='<strong>'+pct+'%</strong> of '+orig+' is <strong>'+pctPart+'</strong>. Take it away: '+orig+' − '+pctPart+' = <strong>'+Math.round(result*100)/100+'</strong>. The multiplier is <strong>×'+(1-pct/100).toFixed(2)+'</strong>.';
}
update();
</script></body></html>
