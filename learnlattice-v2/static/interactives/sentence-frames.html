<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MYP Sentence Frames — LearnLattice</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.4rem;background:linear-gradient(135deg,#0D9488,#0D9488aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sub{font-size:.85rem;color:#94a3b8;margin-bottom:20px;text-align:center;max-width:560px}.app{width:100%;max-width:600px}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.fbtn{padding:7px 16px;border-radius:8px;border:1.5px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.8rem;font-family:inherit;font-weight:600;transition:all .15s}
.fbtn:hover{border-color:#0D9488;color:#e2e8f0}
.fbtn.on{color:#fff;border-color:var(--fc,#0D9488);background:var(--fc,#0D9488)}
.level-btns{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.lbtn{padding:5px 14px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#64748b;cursor:pointer;font-size:.72rem;font-family:inherit;transition:all .12s}
.lbtn:hover{border-color:#0D9488}.lbtn.on{border-color:#0D9488;background:rgba(13,148,136,.12);color:#5eead4}
.frames-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.frame-card{padding:16px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;cursor:pointer;transition:all .15s;position:relative}
.frame-card:hover{border-color:#0D9488}
.frame-card.copied{border-color:#22c55e;background:rgba(34,197,94,.06)}
.frame-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px}
.frame-text{font-size:1rem;line-height:1.7;color:#e2e8f0}
.frame-text .blank{color:#0D9488;font-weight:700;border-bottom:2px dashed #0D948866;padding-bottom:1px}
.frame-hint{font-size:.72rem;color:#64748b;margin-top:6px;font-style:italic}
.frame-copy{position:absolute;top:12px;right:12px;font-size:.65rem;color:#64748b;background:#1e293b;border:1px solid #334155;padding:3px 8px;border-radius:5px;transition:all .15s}
.frame-card:hover .frame-copy{color:#0D9488;border-color:#0D9488}
.frame-card.copied .frame-copy{color:#22c55e;border-color:#22c55e}
.section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:#64748b;font-weight:700;margin-bottom:8px;margin-top:4px;padding-left:4px}
.tips{padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:.82rem;color:#94a3b8;line-height:1.6;text-align:center}
.tips strong{color:#0D9488}
.count{text-align:center;font-size:.75rem;color:#64748b;margin-bottom:12px}
</style></head><body>
<h1>MYP Sentence Frames</h1>
<p class="sub">Pick a criterion and level. Click any frame to copy it. Paste into your investigation.</p>
<div class="app">
  <div class="filters" id="critBtns"></div>
  <div class="level-btns" id="levelBtns"></div>
  <div class="count" id="count"></div>
  <div class="frames-list" id="framesList"></div>
  <div class="tips" id="tips"><strong>Tip:</strong> Click any frame to copy it. Then paste it into your document and fill in the blanks.</div>
</div>
<script>
var data={
A:{
  color:"#0D9488",name:"Criterion A: Knowing & Understanding",
  "1-2":{
    label:"Getting started",
    frames:[
      {text:"_____ means _____.",hint:"Define a key term in your own words"},
      {text:"I know that _____ is important because _____.",hint:"Explain why a concept matters"},
      {text:"An example of _____ is _____.",hint:"Give a specific example"},
      {text:"_____ and _____ are similar because they both _____.",hint:"Compare two ideas"},
      {text:"The formula for _____ is _____.",hint:"State a formula or rule"}
    ]
  },
  "3-4":{
    label:"Building understanding",
    frames:[
      {text:"_____ works because _____.",hint:"Explain the reason behind a rule"},
      {text:"The connection between _____ and _____ is that _____.",hint:"Link two concepts together"},
      {text:"I can use _____ to solve _____ because _____.",hint:"Justify a method choice"},
      {text:"This is an example of _____ because it shows _____.",hint:"Connect an example to a concept"},
      {text:"If _____ changes, then _____ will _____ because _____.",hint:"Show cause and effect understanding"}
    ]
  },
  "5-6":{
    label:"Explaining with depth",
    frames:[
      {text:"_____ is related to _____ because _____. This means that _____.",hint:"Make a multi-step connection"},
      {text:"The reason _____ works is that _____. Without this, _____.",hint:"Explain what would happen otherwise"},
      {text:"I chose _____ instead of _____ because _____.",hint:"Justify why one approach is better"},
      {text:"This concept applies to _____ because _____.",hint:"Transfer knowledge to a new context"},
      {text:"The limitation of _____ is that _____. A better approach might be _____.",hint:"Evaluate and suggest improvements"}
    ]
  },
  "7-8":{
    label:"Expert reasoning",
    frames:[
      {text:"While _____ explains _____, it does not account for _____ because _____.",hint:"Identify limitations of a model"},
      {text:"The mathematical/scientific principle behind _____ is _____. This connects to _____ because _____.",hint:"Show deep cross-topic understanding"},
      {text:"In this context, _____ is more appropriate than _____ because _____, although _____.",hint:"Evaluate with nuance"},
      {text:"If we extend this reasoning, then _____ must also be true because _____.",hint:"Draw logical conclusions"},
      {text:"The relationship between _____ and _____ can be generalised as: _____.",hint:"Form generalisations"}
    ]
  }
},
B:{
  color:"#2563eb",name:"Criterion B: Investigating",
  "1-2":{
    label:"Describing patterns",
    frames:[
      {text:"I notice that _____ gets _____ each time.",hint:"Describe a simple pattern"},
      {text:"The numbers go: _____. The pattern is _____.",hint:"List values and describe what changes"},
      {text:"When I tried _____, I found that _____.",hint:"Report what happened"},
      {text:"I predict the next number will be _____ because _____.",hint:"Make a simple prediction"},
      {text:"I tested my idea by _____ and found _____.",hint:"Describe how you checked"}
    ]
  },
  "3-4":{
    label:"Finding rules",
    frames:[
      {text:"The rule is _____ because the common difference is _____.",hint:"State a rule with evidence"},
      {text:"I found the formula _____ by _____.",hint:"Explain how you found the formula"},
      {text:"I checked my rule for n = _____ and got _____, which matches.",hint:"Verify with specific values"},
      {text:"The independent variable is _____ and the dependent variable is _____.",hint:"Identify variables"},
      {text:"As _____ increases by _____, _____ increases by _____.",hint:"Describe the rate of change"}
    ]
  },
  "5-6":{
    label:"Verifying and explaining",
    frames:[
      {text:"Since the common difference is _____, the rule involves _____n. The first term gives _____, so the rule is _____.",hint:"Derive the rule logically"},
      {text:"I verified this rule for all _____ given values. Each time, _____ matched _____.",hint:"Show systematic verification"},
      {text:"The relationship is _____ because _____. This can be seen in the data where _____.",hint:"Explain with evidence"},
      {text:"My method was to _____, then _____, and finally _____.",hint:"Describe a multi-step approach"},
      {text:"The data supports _____ because _____. However, _____.",hint:"Draw a conclusion with limitations"}
    ]
  },
  "7-8":{
    label:"Proving and justifying",
    frames:[
      {text:"I can prove this works for all values because: _____.",hint:"Provide algebraic or logical proof"},
      {text:"Checking specific cases is not the same as proving. To prove, I need to show that _____.",hint:"Distinguish verification from proof"},
      {text:"T(n+1) − T(n) = _____, which is constant/not constant, proving the relationship is _____.",hint:"Use formal mathematical reasoning"},
      {text:"The general case follows from _____ because _____. Therefore, for any value of n, _____.",hint:"Generalise from specific to universal"},
      {text:"My conclusion is justified because _____, not merely because I checked _____ cases.",hint:"Explain why proof matters"}
    ]
  }
},
C:{
  color:"#16a34a",name:"Criterion C: Communicating",
  "1-2":{
    label:"Using vocabulary",
    frames:[
      {text:"The answer is _____ because I _____ the numbers.",hint:"Use a mathematical/scientific verb"},
      {text:"I made a _____ to show my data.",hint:"Name the representation (table, graph, diagram)"},
      {text:"My diagram shows _____.",hint:"Describe what a visual represents"},
      {text:"First I _____. Then I _____. Finally I _____.",hint:"Organise steps in order"},
      {text:"The units are _____ because we are measuring _____.",hint:"State and justify units"}
    ]
  },
  "3-4":{
    label:"Organising clearly",
    frames:[
      {text:"Figure _____ shows _____. The _____ axis represents _____ and the _____ axis represents _____.",hint:"Label and describe a graph"},
      {text:"I used a _____ because it best shows _____.",hint:"Justify your choice of representation"},
      {text:"The data in the table shows that _____. This is also visible in the graph where _____.",hint:"Connect different representations"},
      {text:"In this investigation, _____ means _____.",hint:"Define a key term in context"},
      {text:"My working shows: Step 1: _____. Step 2: _____. Therefore _____.",hint:"Present logical working"}
    ]
  },
  "5-6":{
    label:"Precise communication",
    frames:[
      {text:"I chose a _____ rather than a _____ because _____.",hint:"Justify your representation choice"},
      {text:"The gradient of _____ represents _____. This tells us that _____.",hint:"Interpret mathematical features"},
      {text:"Moving from the table to the graph, we can see that _____. The equation _____ confirms this.",hint:"Move between representations fluently"},
      {text:"The key findings are: (1) _____, (2) _____, and (3) _____.",hint:"Summarise findings clearly"},
      {text:"To improve the clarity of my communication, I could _____.",hint:"Self-evaluate your communication"}
    ]
  },
  "7-8":{
    label:"Expert communication",
    frames:[
      {text:"A _____ is more appropriate than a _____ here because _____, although _____ would also show _____.",hint:"Evaluate representation choices with nuance"},
      {text:"The mathematical notation _____ precisely captures _____, which in words means _____.",hint:"Use and translate formal notation"},
      {text:"Integrating the data from my table, graph, and equation, the evidence consistently shows that _____.",hint:"Synthesise across representations"},
      {text:"My conclusion is limited by _____, which could be addressed by _____.",hint:"Acknowledge and address limitations"},
      {text:"For the intended audience, I chose to present _____ because _____.",hint:"Consider audience in communication choices"}
    ]
  }
},
D:{
  color:"#d97706",name:"Criterion D: Applying in Real Life",
  "1-2":{
    label:"Connecting to the real world",
    frames:[
      {text:"This is used in real life when _____.",hint:"Give a real-world connection"},
      {text:"The answer is _____, which means _____.",hint:"Interpret what a number means in context"},
      {text:"I used _____ to solve this problem.",hint:"Name the mathematical/scientific tool used"},
      {text:"In this situation, _____ is important because _____.",hint:"Explain relevance"},
      {text:"The real-world problem is about _____.",hint:"Identify the context"}
    ]
  },
  "3-4":{
    label:"Applying and interpreting",
    frames:[
      {text:"I identified that _____ and _____ are the relevant quantities. Using _____, I found _____.",hint:"Select and apply appropriate maths/science"},
      {text:"My answer of _____ makes sense because in this context _____.",hint:"Interpret the result in context"},
      {text:"The mathematical model I used is _____. It applies here because _____.",hint:"Identify and justify the model"},
      {text:"My answer is reasonable because _____ is within the expected range of _____.",hint:"Check reasonableness"},
      {text:"The degree of accuracy is _____ because _____.",hint:"Justify precision"}
    ]
  },
  "5-6":{
    label:"Evaluating solutions",
    frames:[
      {text:"My model predicts _____. This is reasonable because _____, but it assumes _____.",hint:"State predictions with assumptions"},
      {text:"The degree of accuracy (_____ decimal places / significant figures) is appropriate because _____.",hint:"Justify the level of precision"},
      {text:"Practical constraints such as _____ mean that _____.",hint:"Consider real-world limitations"},
      {text:"Comparing my mathematical answer (_____ ) with the real situation, _____.",hint:"Compare model to reality"},
      {text:"If I were advising someone, I would recommend _____ because _____.",hint:"Make a real-world recommendation"}
    ]
  },
  "7-8":{
    label:"Critical evaluation",
    frames:[
      {text:"My model assumes _____. In reality, _____, which means my answer of _____ is likely _____.",hint:"Evaluate model limitations critically"},
      {text:"This mathematical model breaks down when _____ because _____. A _____ model would be more appropriate.",hint:"Identify when models fail"},
      {text:"The mathematical answer is _____, but the practical answer is _____ because _____.",hint:"Distinguish mathematical from practical solutions"},
      {text:"To improve this model, I would _____ because _____ .",hint:"Suggest evidence-based improvements"},
      {text:"My solution is valid for _____ but not for _____ because _____.",hint:"Define the range of validity"}
    ]
  }
}
};

var curCrit='A',curLevel='3-4';

function init(){
  var el=document.getElementById('critBtns');
  ['A','B','C','D'].forEach(function(c){
    var d=data[c];
    el.innerHTML+='<button class="fbtn'+(c===curCrit?' on':'')+'" style="--fc:'+d.color+'" onclick="setCrit(\''+c+'\')">'+c+' — '+d.name.split(': ')[1]+'</button>';
  });
  buildLevels();
  render();
}

function setCrit(c){curCrit=c;document.querySelectorAll('#critBtns .fbtn').forEach(function(b,i){b.classList.toggle('on',['A','B','C','D'][i]===c)});render();}
function setLevel(l){curLevel=l;document.querySelectorAll('#levelBtns .lbtn').forEach(function(b){b.classList.toggle('on',b.dataset.l===l)});render();}

function buildLevels(){
  var el=document.getElementById('levelBtns');
  el.innerHTML='';
  ['1-2','3-4','5-6','7-8'].forEach(function(l){
    el.innerHTML+='<button class="lbtn'+(l===curLevel?' on':'')+'" data-l="'+l+'" onclick="setLevel(\''+l+'\')">Level '+l+'</button>';
  });
}

function render(){
  var d=data[curCrit],lvl=d[curLevel],el=document.getElementById('framesList');
  el.innerHTML='<div class="section-label" style="color:'+d.color+'">'+d.name+' · Level '+curLevel+' — '+lvl.label+'</div>';
  lvl.frames.forEach(function(f,i){
    var displayText=f.text.replace(/_____/g,'<span class="blank">_____</span>');
    el.innerHTML+=
      '<div class="frame-card" onclick="copyFrame(this,\''+f.text.replace(/'/g,"\\'")+'\')" title="Click to copy">'+
        '<div class="frame-copy">Click to copy</div>'+
        '<div class="frame-text">'+displayText+'</div>'+
        '<div class="frame-hint">'+f.hint+'</div>'+
      '</div>';
  });
  document.getElementById('count').textContent=lvl.frames.length+' sentence frames for Level '+curLevel;
}

function copyFrame(card,text){
  navigator.clipboard.writeText(text).then(function(){
    card.classList.add('copied');
    card.querySelector('.frame-copy').textContent='Copied!';
    setTimeout(function(){card.classList.remove('copied');card.querySelector('.frame-copy').textContent='Click to copy';},1500);
  });
}

init();
</script></body></html>
