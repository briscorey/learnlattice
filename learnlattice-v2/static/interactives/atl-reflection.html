<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATL Skills Self-Reflection. LearnLattice</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0f1a;--card:#0f172a;--surface:#1e293b;--border:#334155;--ink:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--teal:#0D9488;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--violet:#8b5cf6}body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:16px 16px 48px}.atl-header{max-width:800px;margin:0 auto 20px;text-align:center}.atl-header h1{font-size:1.4rem;background:linear-gradient(135deg,var(--teal),#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.atl-header p{font-size:.82rem;color:var(--muted);max-width:520px;margin:0 auto}#atlEngBar{max-width:800px;margin:0 auto 16px}.atl-layout{max-width:900px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}.atl-radar{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:20px;position:sticky;top:80px}.atl-radar-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:12px;text-align:center}.atl-radar svg{display:block;margin:0 auto}.atl-radar-legend{display:flex;flex-direction:column;gap:4px;margin-top:12px}.atl-radar-leg{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted)}.atl-radar-leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}.atl-radar-avg{text-align:center;margin-top:12px;font-size:.78rem;color:var(--dim)}.atl-radar-avg strong{color:var(--teal);font-size:1.1rem}.atl-save-all{display:block;width:100%;margin-top:12px;padding:10px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s}.atl-save-all:hover{transform:translateY(-2px)}.atl-saved-msg{text-align:center;font-size:.72rem;color:var(--green);margin-top:6px;min-height:16px}.atl-history-btn{display:block;width:100%;margin-top:8px;padding:8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}.atl-history-btn:hover{border-color:var(--teal);color:var(--teal)}.atl-cats{display:flex;flex-direction:column;gap:12px}.atl-cat{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s}.atl-cat:hover{border-color:var(--border)}.atl-cat-header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;transition:background .15s}.atl-cat-header:hover{background:var(--surface)}.atl-cat-icon{font-size:1.3rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}.atl-cat-info{flex:1;min-width:0}.atl-cat-name{font-size:.92rem;font-weight:700;color:var(--ink)}.atl-cat-desc{font-size:.68rem;color:var(--dim)}.atl-cat-score{font-size:1.1rem;font-weight:800;color:var(--teal);min-width:28px;text-align:center}.atl-cat-chevron{color:var(--dim);transition:transform .25s;font-size:.8rem}.atl-cat.open .atl-cat-chevron{transform:rotate(180deg)}.atl-cat-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.22,1,.36,1)}.atl-cat.open .atl-cat-body{max-height:1200px}.atl-cat-skills{padding:0 18px 18px}.atl-skill{padding:12px 0;border-bottom:1px solid var(--border)}.atl-skill:last-child{border-bottom:none}.atl-skill-name{font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:6px}.atl-skill-example{font-size:.68rem;color:var(--dim);font-style:italic;margin-bottom:8px;line-height:1.4}.atl-skill-slider{display:flex;align-items:center;gap:8px}.atl-skill-slider input[type=range]{flex:1;height:6px;-webkit-appearance:none;appearance:none;background:var(--surface);border-radius:3px;outline:0}.atl-skill-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--teal);border-radius:50%;cursor:pointer;border:2px solid var(--bg)}.atl-skill-val{font-size:.78rem;font-weight:700;color:var(--teal);min-width:18px;text-align:center}.atl-skill-labels{display:flex;justify-content:space-between;font-size:.55rem;color:var(--dim);margin-top:2px;padding:0 2px}.atl-history-overlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(10,15,26,.85);backdrop-filter:blur(6px);justify-content:center;align-items:center;padding:24px}.atl-history-overlay.open{display:flex}.atl-history-modal{background:var(--card);border:1px solid var(--border);border-radius:18px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;padding:24px}.atl-history-modal h2{font-size:1.1rem;color:var(--ink);margin-bottom:16px}.atl-history-entry{padding:12px;margin-bottom:8px;background:var(--surface);border-radius:10px;border:1px solid var(--border)}.atl-history-date{font-size:.68rem;color:var(--dim);margin-bottom:6px}.atl-history-scores{display:flex;gap:6px;flex-wrap:wrap}.atl-history-score{padding:3px 10px;border-radius:6px;font-size:.7rem;font-weight:600}.atl-history-close{display:block;margin:16px auto 0;padding:8px 24px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:.78rem;cursor:pointer;font-family:inherit}@media(max-width:700px){.atl-layout{grid-template-columns:1fr}.atl-radar{position:static;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}}@media(max-width:480px){.atl-radar{grid-template-columns:1fr}}</style></head><body><div class="atl-header"><h1>ATL Skills Self-Reflection</h1><p>Approaches to Learning. rate yourself honestly across 5 skill categories. Track your growth. Build your learner profile.</p></div><div id="atlEngBar"></div><div class="atl-layout"><div class="atl-radar" id="atlRadar"><div class="atl-radar-title">Your ATL Profile</div><svg id="atlRadarSvg" width="240" height="240" viewBox="0 0 240 240"></svg><div class="atl-radar-legend" id="atlLegend"></div><div class="atl-radar-avg" id="atlAvg"></div><button class="atl-save-all" onclick="saveReflection()">Save Reflection</button><div class="atl-saved-msg" id="atlSaved"></div><button class="atl-history-btn" onclick="showHistory()">📅 View History</button></div><div class="atl-cats" id="atlCats"></div></div><div class="atl-history-overlay" id="atlHistoryOverlay"><div class="atl-history-modal" id="atlHistoryModal"><h2>Reflection History</h2><div id="atlHistoryList"></div><button class="atl-history-close" onclick="closeHistory()">Close</button></div></div><script src="/js/student-engine.js"></script><script>var ATL_KEY="ll_atl_",CATS=[{id:"communication",name:"Communication",icon:"💬",color:"#0D9488",bg:"rgba(13,148,136,.12)",skills:[{id:"exchange",name:"Share ideas clearly",ex:"When I explain my method to a partner, they can follow my reasoning."},{id:"readwrite",name:"Read and write effectively",ex:"I can read a science text and identify the key information."},{id:"language",name:"Use language to gather info",ex:"I ask specific questions in class that help me understand."},{id:"ict",name:"Use technology to communicate",ex:"I can create a clear graph or presentation to show my findings."}]},{id:"social",name:"Social",icon:"🤝",color:"#2563EB",bg:"rgba(37,99,235,.12)",skills:[{id:"collab",name:"Work well with others",ex:"In group investigations, I take responsibility for my part."},{id:"respect",name:"Respect other viewpoints",ex:"I listen to ideas I disagree with before responding."},{id:"conflict",name:"Manage disagreements",ex:"When my group disagrees, I help find a solution everyone accepts."},{id:"decisions",name:"Make fair group decisions",ex:"I make sure everyone gets a say, not just the loudest voice."}]},{id:"selfmanagement",name:"Self-Management",icon:"⏰",color:"#D97706",bg:"rgba(217,119,6,.12)",skills:[{id:"organise",name:"Stay organised",ex:"My notes, files, and materials are easy to find when I need them."},{id:"time",name:"Manage my time",ex:"I start assignments early enough to do them well, not just finish them."},{id:"emotion",name:"Manage stress and emotions",ex:"When I don't understand something, I stay calm and try a different approach."},{id:"persist",name:"Keep going when it's hard",ex:"I don't give up on a problem just because it's difficult."}]},{id:"research",name:"Research",icon:"🔍",color:"#7C3AED",bg:"rgba(124,58,237,.12)",skills:[{id:"find",name:"Find reliable information",ex:"I know how to search for specific information using good sources."},{id:"evaluate",name:"Judge source quality",ex:"I can tell the difference between a reliable source and an unreliable one."},{id:"cite",name:"Give credit to sources",ex:"I always say where my information came from."},{id:"media",name:"Understand media messages",ex:"I think about who created the information and why."}]},{id:"thinking",name:"Thinking",icon:"🧠",color:"#EC4899",bg:"rgba(236,72,153,.12)",skills:[{id:"critical",name:"Think critically",ex:"I question assumptions instead of accepting things without evidence."},{id:"creative",name:"Think creatively",ex:"I try different approaches to a problem, not just the obvious one."},{id:"transfer",name:"Apply knowledge to new situations",ex:"I can use what I learned in maths to solve a science problem."},{id:"reflect",name:"Reflect on my learning",ex:"After a task, I think about what I did well and what I'd do differently."}]}],scores={};function loadScores(){try{var e=JSON.parse(localStorage.getItem(ATL_KEY+"current"));e&&(scores=e)}catch(e){}CATS.forEach(function(e){e.skills.forEach(function(e){scores[e.id]||(scores[e.id]=2)})})}function getCatAvg(e){var a=0;return e.skills.forEach(function(e){a+=scores[e.id]||2}),a/e.skills.length}function getOverallAvg(){var e=0,a=0;return CATS.forEach(function(t){t.skills.forEach(function(t){e+=scores[t.id]||2,a++})}),a>0?e/a:0}function drawRadar(){for(var e=document.getElementById("atlRadarSvg"),a=120,t=120,n=95,i=CATS.length,s=CATS.map(function(e,a){return 2*Math.PI*a/i-Math.PI/2}),o="",r=1;r<=4;r++){var l=r/4*n,c=s.map(function(e){return a+l*Math.cos(e)+","+(t+l*Math.sin(e))}).join(" ");o+='<polygon points="'+c+'" fill="none" stroke="#1e293b" stroke-width="1"/>'}s.forEach(function(e){o+='<line x1="120" y1="120" x2="'+(a+n*Math.cos(e))+'" y2="'+(t+n*Math.sin(e))+'" stroke="#1e293b" stroke-width="1"/>'});c=CATS.map(function(e,i){var o=getCatAvg(e)/4*n;return a+o*Math.cos(s[i])+","+(t+o*Math.sin(s[i]))}).join(" ");o+='<polygon points="'+c+'" fill="rgba(13,148,136,.2)" stroke="#0D9488" stroke-width="2"/>',CATS.forEach(function(e,i){var r=getCatAvg(e)/4*n,l=a+r*Math.cos(s[i]),c=t+r*Math.sin(s[i]);o+='<circle cx="'+l+'" cy="'+c+'" r="5" fill="'+e.color+'" stroke="'+e.bg+'" stroke-width="2"/>';var d=a+111*Math.cos(s[i]),g=t+111*Math.sin(s[i]);o+='<text x="'+d+'" y="'+(g+4)+'" text-anchor="'+(d<a?"end":d>122?"start":"middle")+'" font-size="10" font-weight="700" fill="'+e.color+'">'+e.icon+"</text>"}),e.innerHTML=o;var d=CATS.map(function(e){return'<div class="atl-radar-leg"><span class="atl-radar-leg-dot" style="background:'+e.color+'"></span>'+e.name+': <strong style="color:'+e.color+'">'+getCatAvg(e).toFixed(1)+"</strong>/4</div>"}).join("");document.getElementById("atlLegend").innerHTML=d;var g=getOverallAvg();document.getElementById("atlAvg").innerHTML="Overall: <strong>"+g.toFixed(1)+"</strong> / 4"}function renderCategories(){var e="";CATS.forEach(function(a,t){var n=getCatAvg(a);e+='<div class="atl-cat'+(0===t?" open":"")+'" data-cat="'+t+'"><div class="atl-cat-header" onclick="toggleCat('+t+')" style="--cat-color:'+a.color+'"><span class="atl-cat-icon" style="background:'+a.bg+'">'+a.icon+'</span><div class="atl-cat-info"><span class="atl-cat-name">'+a.name+'</span><span class="atl-cat-desc">'+a.skills.length+' skills</span></div><span class="atl-cat-score" style="color:'+a.color+'">'+n.toFixed(1)+'</span><span class="atl-cat-chevron">▾</span></div><div class="atl-cat-body"><div class="atl-cat-skills">',a.skills.forEach(function(a){var t=scores[a.id]||2;e+='<div class="atl-skill"><div class="atl-skill-name">'+a.name+'</div><div class="atl-skill-example">'+a.ex+'</div><div class="atl-skill-slider"><input type="range" min="1" max="4" step="1" value="'+t+'" data-skill="'+a.id+'" oninput="updateSkill(\''+a.id+'\',this.value)"><span class="atl-skill-val" id="val_'+a.id+'">'+t+'</span></div><div class="atl-skill-labels"><span>Beginning</span><span>Developing</span><span>Meeting</span><span>Exceeding</span></div></div>'}),e+="</div></div></div>"}),document.getElementById("atlCats").innerHTML=e}window.toggleCat=function(e){document.querySelectorAll(".atl-cat")[e].classList.toggle("open")},window.updateSkill=function(e,a){scores[e]=parseInt(a),document.getElementById("val_"+e).textContent=a,CATS.forEach(function(e,a){var t=getCatAvg(e);document.querySelectorAll(".atl-cat")[a].querySelector(".atl-cat-score").textContent=t.toFixed(1)}),drawRadar();try{localStorage.setItem(ATL_KEY+"current",JSON.stringify(scores))}catch(e){}},window.saveReflection=function(){var e={date:(new Date).toISOString().slice(0,10),ts:Date.now(),scores:Object.assign({},scores),averages:{}};CATS.forEach(function(a){e.averages[a.id]=getCatAvg(a)}),e.averages.overall=getOverallAvg();var a=[];try{a=JSON.parse(localStorage.getItem(ATL_KEY+"history"))||[]}catch(e){}a.push(e),a.length>30&&(a=a.slice(-30));try{localStorage.setItem(ATL_KEY+"history",JSON.stringify(a))}catch(e){}(document.getElementById("atlSaved").textContent="✓ Saved! "+e.date,"undefined"!=typeof LL)&&(LL.xp.add(20,"atl"),LL.badges.check().forEach(function(e){LL.render.toast(e)}),LL.render.bar("atlEngBar"))},window.showHistory=function(){var e=[];try{e=JSON.parse(localStorage.getItem(ATL_KEY+"history"))||[]}catch(e){}var a="";e.length?e.slice().reverse().forEach(function(e){a+='<div class="atl-history-entry"><div class="atl-history-date">'+e.date+'</div><div class="atl-history-scores">',CATS.forEach(function(t){var n=e.averages[t.id]||0;a+='<span class="atl-history-score" style="background:'+t.bg+";color:"+t.color+'">'+t.icon+" "+n.toFixed(1)+"</span>"}),a+='<span class="atl-history-score" style="background:rgba(13,148,136,.1);color:#0D9488">Overall: '+(e.averages.overall||0).toFixed(1)+"</span>",a+="</div></div>"}):a='<p style="color:var(--dim);text-align:center;padding:20px">No reflections saved yet. Rate your skills and click Save.</p>',document.getElementById("atlHistoryList").innerHTML=a,document.getElementById("atlHistoryOverlay").classList.add("open")},window.closeHistory=function(){document.getElementById("atlHistoryOverlay").classList.remove("open")},loadScores(),renderCategories(),drawRadar(),"undefined"!=typeof LL&&(LL.streak.update(),LL.render.bar("atlEngBar"))</script></body></html>
