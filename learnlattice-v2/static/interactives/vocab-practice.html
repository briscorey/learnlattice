<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Practice. LearnLattice</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0f1a;--card:#0f172a;--surface:#1e293b;--border:#334155;--ink:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--teal:#0D9488;--teal-b:#14b8a6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6}body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:16px 16px 48px}.vp-header{max-width:680px;margin:0 auto 16px;text-align:center}.vp-header h1{font-size:1.4rem;background:linear-gradient(135deg,var(--teal),var(--teal-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.vp-header p{font-size:.82rem;color:var(--muted);max-width:480px;margin:0 auto}#vpEngBar{max-width:680px;margin:0 auto 12px}.vp-boxes{display:flex;gap:4px;max-width:680px;margin:0 auto 16px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px}.vp-box{flex:1;text-align:center;padding:8px 4px;border-radius:8px;cursor:pointer;transition:all .15s}.vp-box:hover{background:var(--surface)}.vp-box.active{background:var(--surface);border:1px solid var(--teal)}.vp-box-num{font-size:1.1rem;font-weight:800;margin-bottom:2px}.vp-box-label{font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}.vp-box-count{font-size:.72rem;color:var(--muted);font-weight:600;margin-top:2px}.vp-box[data-b="1"] .vp-box-num{color:var(--red)}.vp-box[data-b="2"] .vp-box-num{color:var(--amber)}.vp-box[data-b="3"] .vp-box-num{color:#eab308}.vp-box[data-b="4"] .vp-box-num{color:var(--blue)}.vp-box[data-b="5"] .vp-box-num{color:var(--green)}.vp-filters{display:flex;gap:4px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}.vp-filt{padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:0 0;color:var(--dim);font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}.vp-filt:hover{border-color:var(--teal);color:var(--muted)}.vp-filt.on{background:rgba(13,148,136,.15);border-color:var(--teal);color:var(--teal-b)}.vp-modes{display:flex;gap:4px;justify-content:center;margin-bottom:16px}.vp-mode{padding:7px 16px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}.vp-mode:hover{border-color:var(--teal);color:var(--ink)}.vp-mode.on{background:var(--teal);border-color:var(--teal);color:#fff}.vp-area{max-width:680px;margin:0 auto}.vp-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:28px 24px;text-align:center;margin-bottom:12px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}.vp-card-visual{font-size:2.5rem;margin-bottom:10px}.vp-card-prompt{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal-b);margin-bottom:12px}.vp-card-term{font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:6px}.vp-card-subject{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:2px 10px;border-radius:100px;margin-bottom:16px;display:inline-block}.vp-card-subject.math{background:rgba(13,148,136,.12);color:var(--teal-b)}.vp-card-subject.science{background:rgba(59,130,246,.12);color:var(--blue)}.vp-reveal-btn{padding:12px 32px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s}.vp-reveal-btn:hover{transform:translateY(-2px)}.vp-answer{width:100%;text-align:left;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);animation:vpFade .3s ease}.vp-answer-def{font-size:.92rem;color:var(--ink);line-height:1.6;margin-bottom:10px}.vp-answer-example{font-size:.78rem;color:var(--muted);line-height:1.5;padding:10px 14px;background:var(--surface);border-radius:8px;border-left:3px solid var(--teal);font-style:italic;margin-bottom:16px}.vp-rate{display:flex;gap:8px;justify-content:center}.vp-rate-btn{flex:1;max-width:200px;padding:12px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}.vp-rate-btn:hover{transform:translateY(-2px)}.vp-rate-btn span{display:block;font-size:1.3rem;margin-bottom:3px}.vp-rate-btn small{font-size:.7rem;color:var(--muted)}.vp-rate-btn.wrong:hover{border-color:var(--red);background:rgba(239,68,68,.06)}.vp-rate-btn.right:hover{border-color:var(--green);background:rgba(34,197,94,.06)}.vp-summary{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:28px 24px;text-align:center}.vp-summary h2{font-size:1.2rem;color:#fff;margin-bottom:6px}.vp-summary-stats{display:flex;gap:16px;justify-content:center;margin:16px 0;flex-wrap:wrap}.vp-summary-stat{text-align:center}.vp-summary-stat strong{display:block;font-size:1.5rem}.vp-summary-stat small{font-size:.7rem;color:var(--dim)}.vp-summary-stat.correct strong{color:var(--green)}.vp-summary-stat.wrong strong{color:var(--red)}.vp-summary-stat.promoted strong{color:var(--blue)}.vp-again{padding:12px 28px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:12px}.vp-mc-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:16px}.vp-mc-opt{padding:14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:.82rem;cursor:pointer;font-family:inherit;transition:all .15s;text-align:left;line-height:1.45}.vp-mc-opt:hover:not(.locked){border-color:var(--teal);color:var(--ink)}.vp-mc-opt.correct{border-color:var(--green);background:rgba(34,197,94,.08);color:var(--green)}.vp-mc-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.06);color:var(--red)}.vp-mc-opt.locked{cursor:default}.vp-progress{height:4px;background:var(--surface);border-radius:2px;max-width:680px;margin:0 auto 12px;overflow:hidden}.vp-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-b));border-radius:2px;transition:width .4s cubic-bezier(.22,1,.36,1)}.vp-rec{max-width:680px;margin:0 auto 12px;padding:10px 16px;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);border-radius:10px;font-size:.78rem;color:var(--amber);text-align:center}@keyframes vpFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){.vp-boxes{flex-wrap:wrap}.vp-box{min-width:55px}.vp-mc-options{grid-template-columns:1fr}.vp-rate{flex-direction:column;align-items:center}.vp-rate-btn{max-width:none;width:100%}.vp-card-term{font-size:1.3rem}}</style></head><body><div class="vp-header"><h1>Vocabulary Practice</h1><p>102 MYP terms with Leitner spaced repetition. Terms you get wrong come back sooner. Terms you master move to higher boxes.</p></div><div id="vpEngBar"></div><div class="vp-boxes" id="vpBoxes"></div><div class="vp-filters" id="vpFilters"><button class="vp-filt on" data-f="all">All (102)</button> <button class="vp-filt" data-f="math">🔢 Maths</button> <button class="vp-filt" data-f="science">🔬 Science</button> <button class="vp-filt" data-f="due">📅 Due for review</button></div><div class="vp-modes"><button class="vp-mode on" data-m="flashcard">🃏 Flashcard</button> <button class="vp-mode" data-m="multichoice">🎯 Multiple Choice</button></div><div class="vp-progress"><div class="vp-progress-fill" id="vpProgress" style="width:0%"></div></div><div class="vp-rec" id="vpRec" style="display:none"></div><div class="vp-area" id="vpArea"></div><script src="/js/student-engine.js"></script><script>var VOCAB=[{term:"Variable",def:"A letter (like x or n) that represents a number we don't know yet.",visual:"🔤",subj:"math",topic:"algebra",example:"In 3x + 1 = 10, the variable is x.",link:"/resources/understand-algebra/"},{term:"Constant",def:"A number that does not change. It stays the same in every case.",visual:"🔒",subj:"math",topic:"algebra",example:"In T(n) = 3n + 2, the constant is 2."},{term:"Coefficient",def:"The number multiplied by a variable.",visual:"×",subj:"math",topic:"algebra",example:"In 5x, the coefficient is 5."},{term:"Mean",def:"Add up all the values, divide by how many there are. The average.",visual:"📊",subj:"math",topic:"statistics",example:"Mean of 3, 7, 5 = (3+7+5) ÷ 3 = 5."},{term:"Median",def:"The middle value when all numbers are in order.",visual:"↕️",subj:"math",topic:"statistics",example:"In 2, 5, 8, 9, 12. the median is 8."},{term:"Mode",def:"The value that appears most often.",visual:"🔁",subj:"math",topic:"statistics",example:"In 3, 5, 5, 7, 9. the mode is 5."},{term:"Ratio",def:"A comparison between two quantities. How many of one thing for each of another.",visual:"⚖️",subj:"math",topic:"statistics",example:"3 red : 5 blue means for every 3 red there are 5 blue."},{term:"Proportional",def:"Two quantities that increase at the same rate. When one doubles, the other doubles.",visual:"📈",subj:"math",topic:"statistics",example:"Bounce height is proportional to drop height."},{term:"Linear",def:"A relationship that makes a straight line on a graph. Constant rate of change.",visual:"📏",subj:"math",topic:"algebra",example:"y = 2x + 1 is linear. The graph is a straight line."},{term:"Gradient",def:"How steep a line is. Rise divided by run.",visual:"⛰️",subj:"math",topic:"algebra",example:"A line going up 3 for every 1 across has gradient 3."},{term:"Common Difference",def:"The amount added each time in a number sequence.",visual:"➕",subj:"math",topic:"algebra",example:"In 4, 7, 10, 13... the common difference is 3."},{term:"Density",def:"How much mass is packed into a given volume. Dense things are heavy for their size.",visual:"🧱",subj:"science",topic:"physics",example:"Steel is dense (7.9 g/cm³). Cork is not (0.24 g/cm³).",link:"/resources/understand-density/"},{term:"Mass",def:"The amount of matter in an object. Measured in grams or kilograms.",visual:"⚖️",subj:"science",topic:"physics",example:"A 1 kg bag of sugar has the same mass everywhere. even on the Moon."},{term:"Volume",def:"The amount of space an object takes up. Measured in cm³ or mL.",visual:"📦",subj:"science",topic:"physics",example:"A cube 10 cm × 10 cm × 10 cm has a volume of 1000 cm³."},{term:"Hypothesis",def:"A testable prediction about what you think will happen and why.",visual:"💭",subj:"science",topic:"skills",example:"If I increase temperature, the reaction rate will increase because particles move faster."},{term:"Variable (Science)",def:"Something that can change in an experiment. Three types: independent, dependent, controlled.",visual:"🔀",subj:"science",topic:"skills",example:"Independent = what you change. Dependent = what you measure. Controlled = what you keep the same."},{term:"Frequency",def:"How many times something happens in a given time period. In waves: vibrations per second (Hz).",visual:"〰️",subj:"science",topic:"physics",example:"A 440 Hz sound wave vibrates 440 times per second.",link:"/resources/waves-and-sound-investigation/"},{term:"Wavelength",def:"The distance between two consecutive peaks (or troughs) of a wave.",visual:"🌊",subj:"science",topic:"physics",example:"Red light has a longer wavelength than blue light."},{term:"Amplitude",def:"The height of a wave from the resting position to the peak. Bigger amplitude = louder/brighter.",visual:"📶",subj:"science",topic:"physics",example:"A loud sound has a large amplitude. A quiet sound has a small amplitude."},{term:"Ecosystem",def:"A community of living things and the non-living environment they interact with.",visual:"🌿",subj:"science",topic:"biology",example:"A pond ecosystem includes fish, plants, water, sunlight, and bacteria.",link:"/resources/grade-6-schoolyard-ecosystem-investigation/"},{term:"Reactant",def:"A substance that is used up in a chemical reaction. It goes in.",visual:"⬅️",subj:"science",topic:"chemistry",example:"In burning: fuel + oxygen are reactants."},{term:"Product",def:"A substance that is made in a chemical reaction. It comes out.",visual:"➡️",subj:"science",topic:"chemistry",example:"In burning: carbon dioxide + water are products."},{term:"Catalyst",def:"A substance that speeds up a reaction without being used up itself.",visual:"⚡",subj:"science",topic:"chemistry",example:"Enzymes are biological catalysts. They make reactions in your body fast enough to keep you alive.",link:"/resources/cell-explorer-game/"},{term:"Photosynthesis",def:"The process plants use to convert sunlight, water, and CO₂ into glucose and oxygen.",visual:"☀️🌱",subj:"science",topic:"biology",example:"Without photosynthesis, there would be no oxygen in the atmosphere."},{term:"Probability",def:"How likely something is to happen. Measured from 0 (impossible) to 1 (certain).",visual:"🎲",subj:"math",topic:"statistics",example:"The probability of rolling a 6 on a fair die is 1/6 ≈ 0.167.",link:"/resources/number-climber-game/"},{term:"Exponential Growth",def:"Growth that multiplies by the same factor each time. Gets very big very fast.",visual:"🚀",subj:"math",topic:"number",example:"Bacteria doubling every 20 minutes: 1 → 2 → 4 → 8 → 16 → ...",link:"/resources/population-prediction-idu/"},{term:"Conduction",def:"Heat transfer through direct contact. Particles vibrate and pass energy to neighbours.",visual:"🤝",subj:"science",topic:"physics",example:"A metal spoon in hot soup gets hot. heat conducts through the metal.",link:"/resources/heat-transfer-investigation/"},{term:"Convection",def:"Heat transfer through fluid movement. Hot fluid rises, cool fluid sinks.",visual:"♨️",subj:"science",topic:"physics",example:"Hot air rises above a radiator, cool air flows in to replace it."},{term:"Radiation",def:"Heat transfer through electromagnetic waves. No medium needed.",visual:"☀️",subj:"science",topic:"physics",example:"The Sun heats the Earth through radiation across empty space."},{term:"Tessellation",def:"A pattern of shapes that fit together with no gaps and no overlaps.",visual:"🔷",subj:"math",topic:"geometry",example:"Only three regular shapes tessellate: triangles, squares, and hexagons.",link:"/resources/grade-6-tessellation-explorer-investigation/"},{term:"Equation",def:"A mathematical sentence with an equals sign. Both sides have the same value.",visual:"=",subj:"math",topic:"algebra",example:"3x + 1 = 10 is an equation. x = 3 makes both sides equal 10."},{term:"Expression",def:"Numbers and letters combined with operations. but NO equals sign.",visual:"📝",subj:"math",topic:"algebra",example:"3x + 1 is an expression. It is not an equation because there is no = sign."},{term:"Integer",def:"A whole number. Can be positive, negative, or zero.",visual:"🔢",subj:"math",topic:"number",example:"-3, 0, 7, and 142 are all integers. 0.5 is not."},{term:"Rational Number",def:"Any number that can be written as a fraction a/b where a and b are integers.",visual:"½",subj:"math",topic:"number",example:"0.75 = 3/4 (rational). π cannot be written as a fraction (irrational)."},{term:"Prime Number",def:"A number greater than 1 that has exactly two factors: 1 and itself.",visual:"🔑",subj:"math",topic:"number",example:"2, 3, 5, 7, 11 are prime. 4 is not (factors: 1, 2, 4).",link:"/resources/number-climber-game/"},{term:"Factor",def:"A number that divides exactly into another number with no remainder.",visual:"÷",subj:"math",topic:"number",example:"The factors of 12 are: 1, 2, 3, 4, 6, 12."},{term:"Multiple",def:"The result of multiplying a number by any integer.",visual:"×",subj:"math",topic:"number",example:"Multiples of 5: 5, 10, 15, 20, 25, ..."},{term:"Area",def:"The amount of space inside a 2D shape. Measured in square units.",visual:"⬛",subj:"math",topic:"geometry",example:"A rectangle 4cm × 3cm has area = 12 cm²."},{term:"Perimeter",def:"The total distance around the outside of a shape.",visual:"🔲",subj:"math",topic:"geometry",example:"A rectangle 4cm × 3cm has perimeter = 14 cm."},{term:"Circumference",def:"The distance around a circle. Calculated as C = πd or C = 2πr.",visual:"⭕",subj:"math",topic:"geometry",example:"A circle with diameter 10 cm has circumference ≈ 31.4 cm."},{term:"Diameter",def:"The distance across a circle through the centre. Twice the radius.",visual:"↔️",subj:"math",topic:"geometry",example:"If radius = 5 cm, diameter = 10 cm."},{term:"Radius",def:"The distance from the centre of a circle to its edge. Half the diameter.",visual:"📏",subj:"math",topic:"geometry",example:"If diameter = 10 cm, radius = 5 cm."},{term:"Parallel",def:"Lines that are always the same distance apart. They never meet.",visual:"‖",subj:"math",topic:"geometry",example:"Railway tracks are parallel. They run side by side."},{term:"Perpendicular",def:"Lines that meet at exactly 90 degrees (a right angle).",visual:"⊥",subj:"math",topic:"geometry",example:"The corner of a page is where two perpendicular edges meet."},{term:"Symmetry",def:"When one half of a shape is a mirror image of the other half.",visual:"🦋",subj:"math",topic:"geometry",example:"A butterfly has one line of symmetry. left mirrors right."},{term:"Translation",def:"Sliding a shape to a new position without rotating or flipping it.",visual:"➡️",subj:"math",topic:"geometry",example:"Move every point 3 right and 2 up: (x,y) → (x+3, y+2).",link:"/resources/sequence-builder-game/"},{term:"Rotation",def:"Turning a shape around a fixed point by a certain angle.",visual:"↻",subj:"math",topic:"geometry",example:"Rotate 90° clockwise: (x,y) → (y, -x).",link:"/resources/sequence-builder-game/"},{term:"Reflection",def:"Flipping a shape over a line to create a mirror image.",visual:"🪞",subj:"math",topic:"geometry",example:"Reflect in the y-axis: (x,y) → (-x, y).",link:"/resources/sequence-builder-game/"},{term:"Scale Factor",def:"The number you multiply by to enlarge or reduce a shape.",visual:"🔍",subj:"math",topic:"geometry",example:"Scale factor 2 means every length doubles. Scale factor 0.5 means every length halves."},{term:"Sequence",def:"An ordered list of numbers that follow a rule.",visual:"1️⃣",subj:"math",topic:"algebra",example:"2, 5, 8, 11, 14, ... is a sequence with common difference 3.",link:"/resources/worked-example-nth-term/"},{term:"Function",def:"A rule that takes an input and produces exactly one output.",visual:"⚙️",subj:"math",topic:"algebra",example:"f(x) = 2x + 1. Input 3 → output 7.",link:"/resources/pattern-lab-game/"},{term:"Inequality",def:"A statement that one value is greater than, less than, or not equal to another.",visual:"≠",subj:"math",topic:"algebra",example:"x > 5 means x is any number greater than 5."},{term:"Coordinates",def:"Two numbers (x, y) that describe a position on a grid.",visual:"📍",subj:"math",topic:"algebra",example:"(3, 5) means 3 across and 5 up from the origin."},{term:"Origin",def:"The point (0, 0) where the x-axis and y-axis cross.",visual:"⊕",subj:"math",topic:"algebra",example:"All coordinates are measured from the origin."},{term:"Intercept",def:"Where a line crosses an axis. Y-intercept is where x = 0.",visual:"✖️",subj:"math",topic:"algebra",example:"y = 3x + 2 has y-intercept = 2 (the line crosses the y-axis at 2)."},{term:"Correlation",def:"A relationship between two variables. Positive: both increase. Negative: one increases as the other decreases.",visual:"📈📉",subj:"math",topic:"statistics",example:"Height and shoe size have positive correlation. Temperature and hot chocolate sales have negative correlation."},{term:"Outlier",def:"A data point that is far away from the others. It does not fit the pattern.",visual:"⚠️",subj:"math",topic:"statistics",example:"Test scores: 72, 75, 78, 80, 81, 12. The 12 is an outlier."},{term:"Range",def:"The difference between the highest and lowest values in a dataset.",visual:"↕️",subj:"math",topic:"statistics",example:"Data: 3, 7, 12, 15, 20. Range = 20 − 3 = 17."},{term:"Sample",def:"A smaller group selected from a larger population to study.",visual:"🧪",subj:"math",topic:"statistics",example:"Asking 50 students about lunch preferences is a sample. The whole school is the population."},{term:"Cell",def:"The basic unit of life. All living things are made of cells.",visual:"🔬",subj:"science",topic:"biology",example:"Your body contains about 37 trillion cells. Each one is alive."},{term:"Nucleus",def:"The control centre of a cell. Contains DNA.",visual:"🎯",subj:"science",topic:"biology",example:"The nucleus tells the cell what proteins to make.",link:"/resources/cell-explorer-game/"},{term:"Mitochondria",def:"The powerhouses of the cell. They release energy from glucose through respiration.",visual:"⚡",subj:"science",topic:"biology",example:"Muscle cells have lots of mitochondria because they need lots of energy."},{term:"Chloroplast",def:"Found in plant cells only. Where photosynthesis happens.",visual:"🌿",subj:"science",topic:"biology",example:"Chloroplasts contain chlorophyll, which absorbs light and makes plants green."},{term:"Diffusion",def:"The movement of particles from an area of high concentration to low concentration.",visual:"💨",subj:"science",topic:"biology",example:"Perfume spreading across a room is diffusion. particles move from the bottle to the air."},{term:"Osmosis",def:"The movement of water molecules through a partially permeable membrane from dilute to concentrated solution.",visual:"💧",subj:"science",topic:"biology",example:"Plant roots absorb water by osmosis. water moves from wet soil into the root cells."},{term:"Respiration",def:"The chemical process that releases energy from glucose in every living cell. Not the same as breathing.",visual:"🫁",subj:"science",topic:"biology",example:"Glucose + Oxygen → Carbon Dioxide + Water + Energy. This happens in mitochondria."},{term:"Compound",def:"A substance made of two or more different elements chemically bonded together.",visual:"🔗",subj:"science",topic:"chemistry",example:"Water (H₂O) is a compound. hydrogen and oxygen bonded together."},{term:"Element",def:"A substance made of only one type of atom. Cannot be broken down further by chemical means.",visual:"⚛️",subj:"science",topic:"chemistry",example:"Gold (Au), oxygen (O), and carbon (C) are elements."},{term:"Atom",def:"The smallest particle of an element that still has the properties of that element.",visual:"⚛️",subj:"science",topic:"chemistry",example:"A gold atom is the smallest piece of gold possible."},{term:"Molecule",def:"Two or more atoms bonded together.",visual:"🔗",subj:"science",topic:"chemistry",example:"O₂ is a molecule (two oxygen atoms). H₂O is also a molecule."},{term:"Ion",def:"An atom that has gained or lost electrons, giving it an electrical charge.",visual:"⊕⊖",subj:"science",topic:"chemistry",example:"Na⁺ is a sodium ion (lost 1 electron). Cl⁻ is a chloride ion (gained 1 electron)."},{term:"pH",def:"A scale from 0 to 14 measuring how acidic or alkaline a substance is. 7 is neutral.",visual:"🧪",subj:"science",topic:"chemistry",example:"Lemon juice ≈ pH 2 (acidic). Water = pH 7 (neutral). Bleach ≈ pH 12 (alkaline)."},{term:"Chemical Reaction",def:"A process where reactants are transformed into products. Bonds break and new bonds form.",visual:"💥",subj:"science",topic:"chemistry",example:"Burning wood: wood + oxygen → carbon dioxide + water + heat."},{term:"Exothermic",def:"A reaction that releases energy (usually heat) to the surroundings.",visual:"🔥",subj:"science",topic:"chemistry",example:"Burning, neutralisation, and respiration are exothermic. they give out heat."},{term:"Endothermic",def:"A reaction that absorbs energy from the surroundings, making them feel cold.",visual:"❄️",subj:"science",topic:"chemistry",example:"Photosynthesis and dissolving ammonium nitrate are endothermic."},{term:"Current",def:"The flow of electrical charge through a circuit. Measured in amperes (A).",visual:"⚡",subj:"science",topic:"physics",example:"More current = brighter bulb. Current is the same everywhere in a series circuit.",link:"/resources/cell-explorer-game/"},{term:"Voltage",def:"The push that drives current around a circuit. Measured in volts (V).",visual:"🔋",subj:"science",topic:"physics",example:"A 12V battery pushes harder than a 1.5V battery. More voltage = more current (if resistance stays the same)."},{term:"Resistance",def:"How much a component opposes the flow of current. Measured in ohms (Ω).",visual:"🚧",subj:"science",topic:"physics",example:"A thin wire has more resistance than a thick wire. More resistance = less current."},{term:"Force",def:"A push or a pull. Measured in newtons (N). Can change speed, direction, or shape.",visual:"💪",subj:"science",topic:"physics",example:"Gravity pulls you down (your weight in N). The floor pushes you up (normal force)."},{term:"Gravity",def:"The force of attraction between any two masses. On Earth: 9.8 N/kg.",visual:"🌍",subj:"science",topic:"physics",example:"A 1 kg object weighs about 9.8 N on Earth but only 1.6 N on the Moon."},{term:"Friction",def:"A force that opposes motion between two surfaces in contact.",visual:"✋",subj:"science",topic:"physics",example:"Rough surfaces have more friction. Ice has very little friction."},{term:"Speed",def:"How fast something is moving. Distance divided by time.",visual:"🏃",subj:"science",topic:"physics",example:"If you run 100m in 12.5 seconds, your speed = 100 ÷ 12.5 = 8 m/s.",link:"/resources/worked-example-distance-time/"},{term:"Acceleration",def:"How quickly speed is changing. Measured in m/s².",visual:"🚀",subj:"science",topic:"physics",example:"Going from 0 to 20 m/s in 5 seconds = acceleration of 4 m/s²."},{term:"Kinetic Energy",def:"The energy an object has because it is moving. KE = ½mv².",visual:"🏎️",subj:"science",topic:"physics",example:"A fast car has more kinetic energy than a slow one. Doubling speed quadruples KE."},{term:"Potential Energy",def:"
