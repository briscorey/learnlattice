<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Understand Fractions — LearnLattice</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.5rem;background:linear-gradient(135deg,#0D9488,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sub{font-size:.85rem;color:#94a3b8;margin-bottom:20px;text-align:center;max-width:500px}.app{width:100%;max-width:600px}.compare{display:flex;gap:20px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}.frac-box{text-align:center;padding:16px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;min-width:200px;flex:1}.frac-label{font-family:'Courier New',monospace;font-size:1.4rem;color:#14b8a6;margin-bottom:12px}.frac-bar{display:flex;height:40px;border-radius:8px;overflow:hidden;border:1px solid #334155}.frac-filled{background:#0D9488;transition:width .4s}.frac-empty{background:#1e293b}.frac-decimal{font-family:'Courier New',monospace;font-size:.85rem;color:#94a3b8;margin-top:8px}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}.ctrl-group{text-align:center}.ctrl-group label{display:block;font-size:.72rem;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}.ctrl-group input{width:80px;padding:8px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:1rem;text-align:center;font-family:'Courier New',monospace}.result{text-align:center;padding:16px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;font-size:1rem;min-height:50px;line-height:1.6;color:#94a3b8}.result .hl{color:#14b8a6;font-weight:700}.result .bigger{color:#f59e0b;font-weight:700}</style></head><body>
<h1>Which Fraction Is Bigger?</h1>
<p class="sub">Change the fractions and see them side by side. The visual makes it obvious.</p>
<div class="app">
  <div class="controls">
    <div class="ctrl-group"><label>Fraction A</label><div style="display:flex;align-items:center;gap:4px"><input type="number" id="a1" value="2" min="0" max="20" oninput="update()"><span style="color:#64748b;font-size:1.2rem">/</span><input type="number" id="a2" value="3" min="1" max="20" oninput="update()"></div></div>
    <div style="display:flex;align-items:center;font-size:1.5rem;color:#64748b;padding-top:20px">vs</div>
    <div class="ctrl-group"><label>Fraction B</label><div style="display:flex;align-items:center;gap:4px"><input type="number" id="b1" value="3" min="0" max="20" oninput="update()"><span style="color:#64748b;font-size:1.2rem">/</span><input type="number" id="b2" value="5" min="1" max="20" oninput="update()"></div></div>
  </div>
  <div class="compare">
    <div class="frac-box"><div class="frac-label" id="labelA">2/3</div><div class="frac-bar"><div class="frac-filled" id="barA" style="width:66.7%"></div><div class="frac-empty" style="flex:1"></div></div><div class="frac-decimal" id="decA">= 0.667</div></div>
    <div class="frac-box"><div class="frac-label" id="labelB">3/5</div><div class="frac-bar"><div class="frac-filled" id="barB" style="width:60%;background:#f59e0b"></div><div class="frac-empty" style="flex:1"></div></div><div class="frac-decimal" id="decB">= 0.600</div></div>
  </div>
  <div class="result" id="result"><span class="hl">2/3</span> is bigger than <span class="bigger">3/5</span></div>
</div>
<script>
function update(){var a1=+document.getElementById('a1').value,a2=+document.getElementById('a2').value||1,b1=+document.getElementById('b1').value,b2=+document.getElementById('b2').value||1;var va=a1/a2,vb=b1/b2;document.getElementById('labelA').textContent=a1+'/'+a2;document.getElementById('labelB').textContent=b1+'/'+b2;document.getElementById('barA').style.width=Math.min(va*100,100)+'%';document.getElementById('barB').style.width=Math.min(vb*100,100)+'%';document.getElementById('decA').textContent='= '+va.toFixed(3);document.getElementById('decB').textContent='= '+vb.toFixed(3);var r=document.getElementById('result');if(Math.abs(va-vb)<0.001)r.innerHTML='<span class="hl">'+a1+'/'+a2+'</span> is <span class="bigger">equal to</span> <span class="hl">'+b1+'/'+b2+'</span>';else if(va>vb)r.innerHTML='<span class="hl">'+a1+'/'+a2+'</span> is <span class="bigger">bigger</span> than '+b1+'/'+b2;else r.innerHTML=b1+'/'+b2+' is <span class="bigger">bigger</span> than <span class="hl">'+a1+'/'+a2+'</span>'}
update();
</script></body></html>
