<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYP Command Term Trainer — LearnLattice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0f1a;--card:#0f172a;--surface:#1e293b;--border:#334155;--ink:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--teal:#0D9488;--teal-bright:#14b8a6;--teal-glow:rgba(13,148,136,.15);--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--violet:#8b5cf6}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;padding:16px 16px 40px}

/* Header */
.ct-header{max-width:680px;margin:0 auto 20px;text-align:center}
.ct-header h1{font-size:1.5rem;background:linear-gradient(135deg,var(--teal),var(--teal-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.ct-header p{font-size:.82rem;color:var(--muted);line-height:1.5;max-width:460px;margin:0 auto 16px}

/* Stats bar */
.ct-stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.ct-stat{padding:6px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.ct-stat strong{color:var(--teal-bright);font-size:.85rem;font-variant-numeric:tabular-nums}
.ct-stat--streak strong{color:var(--amber)}

/* Mode tabs */
.ct-modes{display:flex;gap:4px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.ct-mode{padding:8px 18px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.ct-mode:hover{border-color:var(--teal);color:var(--ink)}
.ct-mode.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* Filter pills */
.ct-filters{display:flex;gap:4px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.ct-filter{padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.ct-filter:hover{border-color:var(--teal);color:var(--muted)}
.ct-filter.on{background:var(--teal-glow);border-color:var(--teal);color:var(--teal-bright)}

/* Card area */
.ct-area{max-width:680px;margin:0 auto}
.ct-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;transition:border-color .2s}

/* Browse mode */
.ct-browse-card{padding:20px 24px}
.ct-browse-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.ct-term-name{font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:-.02em}
.ct-tier{padding:3px 10px;border-radius:100px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ct-tier--lower{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.ct-tier--middle{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.ct-tier--higher{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.ct-def{font-size:.92rem;color:var(--ink);line-height:1.65;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.ct-examples{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ct-example{padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:.78rem;line-height:1.55}
.ct-example-label{display:block;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.ct-example--math .ct-example-label{color:var(--teal-bright)}
.ct-example--sci .ct-example-label{color:var(--blue)}
.ct-example p{color:var(--muted)}

/* Browse nav */
.ct-browse-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.ct-nav-btn{padding:8px 18px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:600;font-family:inherit;transition:all .12s}
.ct-nav-btn:hover{border-color:var(--teal);color:var(--ink)}
.ct-nav-btn:disabled{opacity:.3;cursor:default}
.ct-nav-count{font-size:.75rem;color:var(--dim);font-variant-numeric:tabular-nums}

/* Test mode */
.ct-test-card{padding:28px 24px;text-align:center}
.ct-test-prompt{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal-bright);margin-bottom:12px}
.ct-test-term{font-size:1.8rem;font-weight:800;color:#fff;margin-bottom:8px}
.ct-test-hint{font-size:.75rem;color:var(--dim);margin-bottom:20px}
.ct-reveal-btn{padding:12px 32px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s}
.ct-reveal-btn:hover{transform:translateY(-2px)}
.ct-reveal-btn:active{transform:scale(.97)}

/* Answer revealed */
.ct-answer{text-align:left;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);animation:fadeUp .3s ease}
.ct-answer .ct-def{margin-bottom:14px;padding-bottom:14px}
.ct-rate{margin-top:16px}
.ct-rate-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:10px;text-align:center}
.ct-rate-btns{display:flex;gap:6px;justify-content:center}
.ct-rate-btn{flex:1;max-width:120px;padding:10px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.ct-rate-btn:hover{transform:translateY(-2px)}
.ct-rate-btn span{display:block;font-size:1.2rem;margin-bottom:3px}
.ct-rate-btn small{font-size:.68rem;color:var(--muted);font-weight:500}
.ct-rate-btn[data-q="1"]:hover{border-color:var(--red);background:rgba(239,68,68,.08)}
.ct-rate-btn[data-q="3"]:hover{border-color:var(--amber);background:rgba(245,158,11,.08)}
.ct-rate-btn[data-q="5"]:hover{border-color:var(--green);background:rgba(34,197,94,.08)}

/* Match mode */
.ct-match-area{max-width:680px;margin:0 auto}
.ct-match-score{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:12px}
.ct-match-score strong{color:var(--teal-bright)}
.ct-match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ct-match-col-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);text-align:center;padding-bottom:6px}
.ct-match-item{padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:.8rem;cursor:pointer;transition:all .15s;min-height:48px;display:flex;align-items:center;line-height:1.4}
.ct-match-item:hover{border-color:var(--teal);color:var(--ink)}
.ct-match-item.selected{border-color:var(--teal);background:var(--teal-glow);color:var(--teal-bright)}
.ct-match-item.correct{border-color:var(--green);background:rgba(34,197,94,.1);color:var(--green);cursor:default;opacity:.7}
.ct-match-item.wrong{border-color:var(--red);background:rgba(239,68,68,.08);animation:shake .4s ease}
.ct-match-item.term-item{font-weight:700;color:var(--ink);font-size:.88rem}
.ct-next-round{display:block;margin:16px auto 0;padding:10px 28px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}

/* Progress bar */
.ct-progress{height:4px;background:var(--surface);border-radius:2px;margin-bottom:12px;overflow:hidden}
.ct-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-bright));border-radius:2px;transition:width .4s cubic-bezier(.22,1,.36,1)}

/* Mastery breakdown */
.ct-mastery{max-width:680px;margin:20px auto 0;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.ct-mastery-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:10px}
.ct-mastery-bars{display:flex;flex-direction:column;gap:6px}
.ct-mastery-row{display:flex;align-items:center;gap:10px;font-size:.75rem}
.ct-mastery-label{width:80px;color:var(--muted);flex-shrink:0}
.ct-mastery-bar{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
.ct-mastery-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.ct-mastery-bar-fill.new{background:#475569}
.ct-mastery-bar-fill.learning{background:var(--amber)}
.ct-mastery-bar-fill.mastered{background:var(--green)}
.ct-mastery-count{width:28px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:.72rem}

/* Empty state */
.ct-empty{text-align:center;padding:40px 24px;color:var(--dim)}
.ct-empty h3{font-size:1.1rem;color:var(--ink);margin-bottom:8px}
.ct-empty p{font-size:.85rem;margin-bottom:16px}
.ct-empty button{padding:10px 24px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.ct-pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}

/* Responsive */
@media(max-width:480px){
  .ct-examples{grid-template-columns:1fr}
  .ct-match-grid{grid-template-columns:1fr}
  .ct-test-term{font-size:1.4rem}
  .ct-rate-btns{flex-wrap:wrap}
  .ct-rate-btn{max-width:none}
}
</style>
</head>
<body>

<div class="ct-header">
  <h1>MYP Command Term Trainer</h1>
  <p>40 command terms used in every MYP Mathematics and Science assessment. Master them and you'll always know exactly what the question is asking.</p>
</div>

<div class="ct-stats" id="ctStats"></div>

<div class="ct-modes" id="ctModes">
  <button class="ct-mode on" data-mode="browse">📖 Browse</button>
  <button class="ct-mode" data-mode="test">🧠 Test</button>
  <button class="ct-mode" data-mode="match">⚡ Match</button>
</div>

<div class="ct-filters" id="ctFilters">
  <button class="ct-filter on" data-tier="all">All</button>
  <button class="ct-filter" data-tier="Lower">🟢 Lower</button>
  <button class="ct-filter" data-tier="Middle">🟡 Middle</button>
  <button class="ct-filter" data-tier="Higher">🔴 Higher</button>
</div>

<div class="ct-progress"><div class="ct-progress-fill" id="ctProgress" style="width:0%"></div></div>

<div class="ct-area" id="ctArea"></div>
<div class="ct-mastery" id="ctMastery"></div>

<script>
// ═══════════════════════════════════════════
// MYP COMMAND TERM TRAINER
// SM-2 spaced repetition + 3 learning modes
// All state in localStorage
// ═══════════════════════════════════════════

var TERMS = [
  {t:"State",lv:1,ti:"Lower",def:"Give a specific name, value, or other brief answer without explanation.",mx:"State the gradient of y = 3x + 5.",sx:"State the name of the process by which plants make food."},
  {t:"Define",lv:1,ti:"Lower",def:"Give the precise meaning of a word, phrase, or concept.",mx:"Define the term 'prime number'.",sx:"Define the term 'photosynthesis'."},
  {t:"Identify",lv:1,ti:"Lower",def:"Recognise and briefly state a relevant fact, feature, or pattern.",mx:"Identify the type of correlation shown in the scatter graph.",sx:"Identify the independent variable in this experiment."},
  {t:"List",lv:1,ti:"Lower",def:"Give a sequence of brief answers with no explanation.",mx:"List the first five square numbers.",sx:"List three adaptations of a polar bear."},
  {t:"Label",lv:1,ti:"Lower",def:"Add names or titles to a diagram, graph, or figure.",mx:"Label the x-axis and y-axis on the coordinate grid.",sx:"Label the parts of a plant cell on the diagram."},
  {t:"Measure",lv:1,ti:"Lower",def:"Find the value of a quantity using appropriate tools.",mx:"Measure the angle at vertex B using a protractor.",sx:"Measure the temperature of the water every 30 seconds."},
  {t:"Outline",lv:1,ti:"Lower",def:"Give a brief overview or summary of the main points.",mx:"Outline the steps needed to solve a linear equation.",sx:"Outline how energy is transferred in a food chain."},
  {t:"Recall",lv:1,ti:"Lower",def:"Remember and state a fact or piece of information from memory.",mx:"Recall the formula for the area of a triangle.",sx:"Recall the word equation for photosynthesis."},
  {t:"Select",lv:1,ti:"Lower",def:"Choose the correct or most appropriate option.",mx:"Select the appropriate formula to find the volume of a cylinder.",sx:"Select the correct unit for measuring force."},
  {t:"Describe",lv:2,ti:"Middle",def:"Give a detailed account of what something looks like, what happened, or how something works. Not why — just what.",mx:"Describe the pattern in the sequence 2, 6, 18, 54.",sx:"Describe what happens to the temperature as the ice melts."},
  {t:"Distinguish",lv:2,ti:"Middle",def:"Make clear the differences between two or more things.",mx:"Distinguish between a linear and a quadratic sequence.",sx:"Distinguish between a physical change and a chemical change."},
  {t:"Estimate",lv:2,ti:"Middle",def:"Find an approximate value using reasoning, not exact calculation.",mx:"Estimate the mean height of students using the grouped frequency table.",sx:"Estimate the pH of lemon juice based on its properties."},
  {t:"Calculate",lv:2,ti:"Middle",def:"Find the answer using mathematical methods. Show your working.",mx:"Calculate the area of a circle with radius 7 cm.",sx:"Calculate the speed of a car that travels 150 km in 2 hours."},
  {t:"Apply",lv:2,ti:"Middle",def:"Use knowledge or a method in a new or unfamiliar situation.",mx:"Apply compound interest to find the value after 3 years.",sx:"Apply your knowledge of density to explain why oil floats on water."},
  {t:"Demonstrate",lv:2,ti:"Middle",def:"Show clearly by giving evidence, examples, or practical proof.",mx:"Demonstrate that the angles in a triangle add up to 180°.",sx:"Demonstrate that light travels in straight lines."},
  {t:"Construct",lv:2,ti:"Middle",def:"Build, draw, or create something following specific rules or methods.",mx:"Construct an accurate pie chart for the given data.",sx:"Construct a food web using the organisms listed."},
  {t:"Solve",lv:2,ti:"Middle",def:"Work out the answer to a mathematical problem.",mx:"Solve the equation 3x + 7 = 22.",sx:"Solve for the missing force in the balanced force diagram."},
  {t:"Classify",lv:2,ti:"Middle",def:"Arrange or sort into groups based on shared characteristics.",mx:"Classify these shapes as regular or irregular polygons.",sx:"Classify these substances as acids, bases, or neutral."},
  {t:"Summarise",lv:2,ti:"Middle",def:"Give a condensed version of the main points.",mx:"Summarise the key findings from your statistical investigation.",sx:"Summarise the results of your experiment in 2–3 sentences."},
  {t:"Interpret",lv:2,ti:"Middle",def:"Explain the meaning or significance of data, a graph, or a result.",mx:"Interpret the correlation shown in the scatter graph.",sx:"Interpret the results of the pH test to identify the unknown liquid."},
  {t:"Explain",lv:2,ti:"Middle",def:"Give a detailed account including reasons or causes — tell WHY something happens, not just what happens.",mx:"Explain why the sum of two odd numbers is always even.",sx:"Explain why the rate of photosynthesis increases as light intensity increases."},
  {t:"Formulate",lv:2,ti:"Middle",def:"Express an idea, rule, or hypothesis in a precise way.",mx:"Formulate an algebraic expression for the nth term.",sx:"Formulate a hypothesis about how temperature affects enzyme activity."},
  {t:"Verify",lv:2,ti:"Middle",def:"Check that a result, pattern, or rule is correct by testing it.",mx:"Verify your rule by substituting n = 10.",sx:"Verify your prediction by conducting the experiment again."},
  {t:"Suggest",lv:2,ti:"Middle",def:"Propose a possible answer or improvement — more than one response may be correct.",mx:"Suggest a reason why the outlier might have occurred.",sx:"Suggest two improvements to make this experiment more reliable."},
  {t:"Compare",lv:2,ti:"Middle",def:"Describe the similarities AND differences between two or more things.",mx:"Compare the two methods of solving the simultaneous equations.",sx:"Compare aerobic and anaerobic respiration."},
  {t:"Analyse",lv:3,ti:"Higher",def:"Break down information into parts, identify patterns, and explain how the parts connect.",mx:"Analyse the data to determine whether hours of study affects test scores.",sx:"Analyse the results to determine whether the hypothesis was supported."},
  {t:"Discuss",lv:3,ti:"Higher",def:"Consider different perspectives or arguments, giving evidence for and against.",mx:"Discuss whether the mean or median is a better average for this data set.",sx:"Discuss the advantages and disadvantages of renewable energy sources."},
  {t:"Evaluate",lv:3,ti:"Higher",def:"Make a judgement about value, quality, or effectiveness, using evidence to support your conclusion.",mx:"Evaluate the effectiveness of your model for predicting future values.",sx:"Evaluate the reliability and validity of the experimental method."},
  {t:"Justify",lv:3,ti:"Higher",def:"Give valid reasons or evidence to support an answer, decision, or conclusion.",mx:"Justify why your general rule works for all cases.",sx:"Justify your choice of method for this investigation."},
  {t:"Deduce",lv:3,ti:"Higher",def:"Reach a conclusion by reasoning from given information.",mx:"Deduce the value of angle x using properties of parallel lines.",sx:"Deduce which gas was produced based on the test results."},
  {t:"Derive",lv:3,ti:"Higher",def:"Obtain a formula or result by logical steps from known information.",mx:"Derive the formula for the sum of the first n terms.",sx:"Derive the relationship between voltage, current, and resistance from the data."},
  {t:"Design",lv:3,ti:"Higher",def:"Plan and create a method or solution, making thoughtful choices.",mx:"Design a survey to test whether students prefer different music types.",sx:"Design an experiment to test how light intensity affects photosynthesis."},
  {t:"Prove",lv:3,ti:"Higher",def:"Show that something is true using a logical, step-by-step argument.",mx:"Prove that the sum of three consecutive numbers is always divisible by 3.",sx:"Prove that the gas collected is carbon dioxide using a chemical test."},
  {t:"Predict",lv:3,ti:"Higher",def:"Give an expected result based on evidence, patterns, or scientific knowledge.",mx:"Predict the 20th term of the sequence using your general rule.",sx:"Predict what will happen to reaction rate if temperature is doubled."},
  {t:"Synthesize",lv:3,ti:"Higher",def:"Combine different ideas or evidence to create a new understanding.",mx:"Synthesize findings from both investigations to draw an overall conclusion.",sx:"Synthesize evidence from multiple sources to evaluate the impact of deforestation."},
  {t:"Create",lv:3,ti:"Higher",def:"Produce something new — a model, solution, investigation, or presentation.",mx:"Create a mathematical model for the relationship between time and distance.",sx:"Create a poster explaining how vaccines protect against disease."},
  {t:"Critique",lv:3,ti:"Higher",def:"Examine and judge the strengths and weaknesses of something.",mx:"Critique the graph produced by another group.",sx:"Critique the experimental design and suggest improvements."}
];

var KEY = 'll_ct_'; // localStorage prefix
var mode = 'browse';
var tier = 'all';
var browseIdx = 0;
var testQueue = [];
var testIdx = 0;
var revealed = false;
var matchTerms = [];
var matchDefs = [];
var matchSel = null; // {side:'term'|'def', idx:n}
var matchPairs = 0;
var matchTotal = 0;
var matchRound = 0;

// ─── SM-2 state per term ───
function getTermState(term) {
  try { var s = JSON.parse(localStorage.getItem(KEY + term)); return s || null; } catch(e) { return null; }
}
function setTermState(term, state) {
  try { localStorage.setItem(KEY + term, JSON.stringify(state)); } catch(e) {}
}
function initTermState(term) {
  return { interval: 0, repetition: 0, efactor: 2.5, next: 0, status: 'new' };
}

// SM-2 algorithm
function sm2(state, quality) { // quality: 0-5
  var s = Object.assign({}, state);
  if (quality >= 3) {
    if (s.repetition === 0) s.interval = 1;
    else if (s.repetition === 1) s.interval = 6;
    else s.interval = Math.round(s.interval * s.efactor);
    s.repetition++;
    s.efactor = Math.max(1.3, s.efactor + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
    s.status = s.repetition >= 3 ? 'mastered' : 'learning';
  } else {
    s.repetition = 0;
    s.interval = 0;
    s.status = 'learning';
  }
  s.next = Date.now() + s.interval * 86400000;
  return s;
}

// ─── Streak tracking ───
function getStreak() {
  try {
    var d = JSON.parse(localStorage.getItem(KEY + 'streak')) || { count: 0, last: '' };
    var today = new Date().toISOString().slice(0, 10);
    var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (d.last === today) return d;
    if (d.last === yesterday) { d.count++; d.last = today; }
    else { d.count = 1; d.last = today; }
    localStorage.setItem(KEY + 'streak', JSON.stringify(d));
    return d;
  } catch(e) { return { count: 1, last: '' }; }
}

// ─── Filtered terms ───
function filtered() {
  return tier === 'all' ? TERMS : TERMS.filter(function(t) { return t.ti === tier; });
}

// ─── Stats ───
function getMasteryStats() {
  var n = 0, l = 0, m = 0;
  TERMS.forEach(function(t) {
    var s = getTermState(t.t);
    if (!s || s.status === 'new') n++;
    else if (s.status === 'learning') l++;
    else m++;
  });
  return { new: n, learning: l, mastered: m };
}

function renderStats() {
  var ms = getMasteryStats();
  var streak = getStreak();
  document.getElementById('ctStats').innerHTML =
    '<div class="ct-stat"><span>📊</span> <strong>' + ms.mastered + '</strong> mastered</div>' +
    '<div class="ct-stat"><span>📝</span> <strong>' + ms.learning + '</strong> learning</div>' +
    '<div class="ct-stat"><span>🆕</span> <strong>' + ms.new + '</strong> unseen</div>' +
    '<div class="ct-stat ct-stat--streak"><span>🔥</span> <strong>' + streak.count + '</strong> day streak</div>';
  
  // Progress bar
  var pct = Math.round(((ms.mastered + ms.learning * 0.4) / TERMS.length) * 100);
  document.getElementById('ctProgress').style.width = pct + '%';
  
  // Mastery breakdown
  var total = TERMS.length;
  document.getElementById('ctMastery').innerHTML =
    '<div class="ct-mastery-title">Mastery Breakdown</div>' +
    '<div class="ct-mastery-bars">' +
      '<div class="ct-mastery-row"><span class="ct-mastery-label">Mastered</span><div class="ct-mastery-bar"><div class="ct-mastery-bar-fill mastered" style="width:' + (ms.mastered/total*100) + '%"></div></div><span class="ct-mastery-count">' + ms.mastered + '</span></div>' +
      '<div class="ct-mastery-row"><span class="ct-mastery-label">Learning</span><div class="ct-mastery-bar"><div class="ct-mastery-bar-fill learning" style="width:' + (ms.learning/total*100) + '%"></div></div><span class="ct-mastery-count">' + ms.learning + '</span></div>' +
      '<div class="ct-mastery-row"><span class="ct-mastery-label">Unseen</span><div class="ct-mastery-bar"><div class="ct-mastery-bar-fill new" style="width:' + (ms.new/total*100) + '%"></div></div><span class="ct-mastery-count">' + ms.new + '</span></div>' +
    '</div>';
}

// ─── BROWSE MODE ───
function renderBrowse() {
  var list = filtered();
  if (!list.length) { renderEmpty(); return; }
  browseIdx = Math.max(0, Math.min(browseIdx, list.length - 1));
  var t = list[browseIdx];
  var tierCls = t.ti.toLowerCase();
  
  document.getElementById('ctArea').innerHTML =
    '<div class="ct-browse-nav">' +
      '<button class="ct-nav-btn" onclick="browseNav(-1)" ' + (browseIdx === 0 ? 'disabled' : '') + '>← Previous</button>' +
      '<span class="ct-nav-count">' + (browseIdx + 1) + ' / ' + list.length + '</span>' +
      '<button class="ct-nav-btn" onclick="browseNav(1)" ' + (browseIdx >= list.length - 1 ? 'disabled' : '') + '>Next →</button>' +
    '</div>' +
    '<div class="ct-card ct-browse-card ct-pop">' +
      '<div class="ct-browse-top">' +
        '<span class="ct-term-name">' + t.t + '</span>' +
        '<span class="ct-tier ct-tier--' + tierCls + '">' + t.ti + '-order</span>' +
      '</div>' +
      '<div class="ct-def">' + t.def + '</div>' +
      '<div class="ct-examples">' +
        '<div class="ct-example ct-example--math"><span class="ct-example-label">📐 Math example</span><p>' + t.mx + '</p></div>' +
        '<div class="ct-example ct-example--sci"><span class="ct-example-label">🔬 Science example</span><p>' + t.sx + '</p></div>' +
      '</div>' +
    '</div>';
}

window.browseNav = function(d) {
  browseIdx += d;
  renderBrowse();
};

// ─── TEST MODE (spaced repetition) ───
function buildTestQueue() {
  var list = filtered();
  var now = Date.now();
  // Priority: due items first, then new items, then not-yet-due
  var due = [], fresh = [], later = [];
  list.forEach(function(t) {
    var s = getTermState(t.t);
    if (!s) fresh.push(t);
    else if (s.next <= now) due.push(t);
    else later.push(t);
  });
  // Shuffle each group
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; } return a; }
  testQueue = shuffle(due).concat(shuffle(fresh)).concat(shuffle(later));
  testIdx = 0;
  revealed = false;
}

function renderTest() {
  if (!testQueue.length) { buildTestQueue(); }
  if (!testQueue.length) { renderEmpty(); return; }
  if (testIdx >= testQueue.length) testIdx = 0;
  
  var t = testQueue[testIdx];
  revealed = false;
  
  document.getElementById('ctArea').innerHTML =
    '<div class="ct-card ct-test-card ct-pop">' +
      '<div class="ct-test-prompt">What does this command term mean?</div>' +
      '<div class="ct-test-term">' + t.t + '</div>' +
      '<div class="ct-test-hint">Think about the definition, then reveal to check.</div>' +
      '<button class="ct-reveal-btn" onclick="revealAnswer()">Reveal Definition</button>' +
      '<div id="ctAnswer"></div>' +
    '</div>';
}

window.revealAnswer = function() {
  if (revealed) return;
  revealed = true;
  var t = testQueue[testIdx];
  var tierCls = t.ti.toLowerCase();
  
  document.getElementById('ctAnswer').innerHTML =
    '<div class="ct-answer">' +
      '<div class="ct-def">' + t.def + '</div>' +
      '<div class="ct-examples">' +
        '<div class="ct-example ct-example--math"><span class="ct-example-label">📐 Math</span><p>' + t.mx + '</p></div>' +
        '<div class="ct-example ct-example--sci"><span class="ct-example-label">🔬 Science</span><p>' + t.sx + '</p></div>' +
      '</div>' +
      '<div class="ct-rate">' +
        '<div class="ct-rate-label">How well did you know it?</div>' +
        '<div class="ct-rate-btns">' +
          '<button class="ct-rate-btn" data-q="1" onclick="rateAndNext(1)"><span>😕</span><small>Not at all</small></button>' +
          '<button class="ct-rate-btn" data-q="3" onclick="rateAndNext(3)"><span>🤔</span><small>Kind of</small></button>' +
          '<button class="ct-rate-btn" data-q="5" onclick="rateAndNext(5)"><span>😄</span><small>Nailed it</small></button>' +
        '</div>' +
      '</div>' +
    '</div>';
  
  document.querySelector('.ct-reveal-btn').style.display = 'none';
};

window.rateAndNext = function(quality) {
  var t = testQueue[testIdx];
  var state = getTermState(t.t) || initTermState(t.t);
  state = sm2(state, quality);
  setTermState(t.t, state);
  testIdx++;
  // Award XP via engagement engine
  if (typeof LL !== 'undefined') {
    LL.xp.add(LL.xp.COMMAND_TERM_TEST, 'command-terms');
    var newBadges = LL.badges.check();
    newBadges.forEach(function(b) { LL.render.toast(b); });
  }
  renderStats();
  renderTest();
};

// ─── MATCH MODE ───
function buildMatchRound() {
  var list = filtered();
  if (list.length < 4) { renderEmpty(); return; }
  // Pick 5 random terms (or fewer if filtered)
  var count = Math.min(5, list.length);
  var shuffled = list.slice().sort(function() { return Math.random() - 0.5; });
  var picked = shuffled.slice(0, count);
  
  matchTerms = picked.map(function(t, i) { return { text: t.t, idx: i, matched: false }; });
  matchDefs = picked.map(function(t, i) { return { text: t.def, idx: i, matched: false }; });
  // Shuffle defs
  matchDefs.sort(function() { return Math.random() - 0.5; });
  matchSel = null;
  matchPairs = 0;
  matchTotal = count;
  matchRound++;
}

function renderMatch() {
  if (!matchTerms.length) buildMatchRound();
  
  var html = '<div class="ct-match-area">' +
    '<div class="ct-match-score">Round ' + matchRound + ' · <strong>' + matchPairs + ' / ' + matchTotal + '</strong> matched</div>' +
    '<div class="ct-match-grid">' +
      '<div><div class="ct-match-col-label">Command Term</div>';
  
  matchTerms.forEach(function(t, i) {
    var cls = 'ct-match-item term-item';
    if (t.matched) cls += ' correct';
    else if (matchSel && matchSel.side === 'term' && matchSel.idx === i) cls += ' selected';
    html += '<div class="' + cls + '" data-side="term" data-i="' + i + '" onclick="matchClick(\'term\',' + i + ')">' + t.text + '</div>';
  });
  
  html += '</div><div><div class="ct-match-col-label">Definition</div>';
  
  matchDefs.forEach(function(d, i) {
    var cls = 'ct-match-item';
    if (d.matched) cls += ' correct';
    else if (matchSel && matchSel.side === 'def' && matchSel.idx === i) cls += ' selected';
    html += '<div class="' + cls + '" data-side="def" data-i="' + i + '" onclick="matchClick(\'def\',' + i + ')">' + d.text + '</div>';
  });
  
  html += '</div></div>';
  
  if (matchPairs >= matchTotal) {
    html += '<button class="ct-next-round" onclick="nextMatchRound()">Next Round →</button>';
  }
  
  html += '</div>';
  document.getElementById('ctArea').innerHTML = html;
}

window.matchClick = function(side, idx) {
  var item = side === 'term' ? matchTerms[idx] : matchDefs[idx];
  if (item.matched) return;
  
  if (!matchSel) {
    matchSel = { side: side, idx: idx };
    renderMatch();
  } else if (matchSel.side === side) {
    matchSel = { side: side, idx: idx };
    renderMatch();
  } else {
    // Check match
    var termIdx = side === 'term' ? idx : matchSel.idx;
    var defIdx = side === 'def' ? idx : matchSel.idx;
    var termItem = matchTerms[termIdx];
    var defItem = matchDefs[defIdx];
    
    if (termItem.idx === defItem.idx) {
      // Correct!
      termItem.matched = true;
      defItem.matched = true;
      matchPairs++;
      matchSel = null;
      
      // Update SM-2 state
      var term = termItem.text;
      var state = getTermState(term) || initTermState(term);
      state = sm2(state, 4); // good recall
      setTermState(term, state);
      renderStats();
      renderMatch();
    } else {
      // Wrong — flash red briefly
      matchSel = null;
      renderMatch();
      var els = document.querySelectorAll('.ct-match-item');
      els.forEach(function(el) {
        if ((el.dataset.side === 'term' && parseInt(el.dataset.i) === termIdx) ||
            (el.dataset.side === 'def' && parseInt(el.dataset.i) === defIdx)) {
          el.classList.add('wrong');
          setTimeout(function() { el.classList.remove('wrong'); }, 500);
        }
      });
    }
  }
};

window.nextMatchRound = function() {
  buildMatchRound();
  renderMatch();
};

// ─── Empty state ───
function renderEmpty() {
  document.getElementById('ctArea').innerHTML =
    '<div class="ct-empty"><h3>No terms in this category</h3><p>Try selecting "All" to see all 40 command terms.</p>' +
    '<button onclick="setFilter(\'all\')">Show All Terms</button></div>';
}

// ─── Mode & filter switching ───
function setMode(m) {
  mode = m;
  document.querySelectorAll('.ct-mode').forEach(function(b) { b.classList.toggle('on', b.dataset.mode === m); });
  if (m === 'test') buildTestQueue();
  if (m === 'match') { matchRound = 0; buildMatchRound(); }
  render();
}

window.setFilter = function(t) {
  tier = t;
  document.querySelectorAll('.ct-filter').forEach(function(b) { b.classList.toggle('on', b.dataset.tier === t); });
  browseIdx = 0;
  if (mode === 'test') buildTestQueue();
  if (mode === 'match') { matchRound = 0; buildMatchRound(); }
  render();
};

function render() {
  if (mode === 'browse') renderBrowse();
  else if (mode === 'test') renderTest();
  else if (mode === 'match') renderMatch();
  renderStats();
}

// ─── Event listeners ───
document.querySelectorAll('.ct-mode').forEach(function(b) {
  b.addEventListener('click', function() { setMode(this.dataset.mode); });
});
document.querySelectorAll('.ct-filter').forEach(function(b) {
  b.addEventListener('click', function() { setFilter(this.dataset.tier); });
});

// Keyboard nav for browse mode
document.addEventListener('keydown', function(e) {
  if (mode === 'browse') {
    if (e.key === 'ArrowRight') { e.preventDefault(); browseNav(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); browseNav(-1); }
  }
  if (mode === 'test' && e.key === ' ' && !revealed) { e.preventDefault(); revealAnswer(); }
});

// ─── Init ───
getStreak(); // triggers streak update
render();

// ─── Engagement Engine Integration ───
(function(){
  var script = document.createElement('script');
  script.src = '/js/student-engine.js';
  script.onload = function() {
    if (typeof LL !== 'undefined') {
      LL.streak.update();
    }
  };
  document.head.appendChild(script);
})();
</script>
