;overflow:hidden}.ct-mastery-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}.ct-mastery-bar-fill.new{background:#475569}.ct-mastery-bar-fill.learning{background:var(--amber)}.ct-mastery-bar-fill.mastered{background:var(--green)}.ct-mastery-count{width:28px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:.72rem}.ct-empty{text-align:center;padding:40px 24px;color:var(--dim)}.ct-empty h3{font-size:1.1rem;color:var(--ink);margin-bottom:8px}.ct-empty p{font-size:.85rem;margin-bottom:16px}.ct-empty button{padding:10px 24px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}@keyframes pop{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}.ct-pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}@media(max-width:480px){.ct-examples{grid-template-columns:1fr}.ct-match-grid{grid-template-columns:1fr}.ct-test-term{font-size:1.4rem}.ct-rate-btns{flex-wrap:wrap}.ct-rate-btn{max-width:none}}</style></head><body><div class="ct-header"><h1>MYP Command Term Trainer</h1><p>40 command terms used in every MYP Mathematics and Science assessment. Master them and you'll always know exactly what the question is asking.</p></div><div class="ct-stats" id="ctStats"></div><div class="ct-modes" id="ctModes"><button class="ct-mode on" data-mode="browse">📖 Browse</button> <button class="ct-mode" data-mode="test">🧠 Test</button> <button class="ct-mode" data-mode="match">⚡ Match</button></div><div class="ct-filters" id="ctFilters"><button class="ct-filter on" data-tier="all">All</button> <button class="ct-filter" data-tier="Lower">🟢 Lower</button> <button class="ct-filter" data-tier="Middle">🟡 Middle</button> <button class="ct-filter" data-tier="Higher">🔴 Higher</button></div><div class="ct-progress"><div class="ct-progress-fill" id="ctProgress" style="width:0%"></div></div><div class="ct-area" id="ctArea"></div><div class="ct-mastery" id="ctMastery"></div><script>var TERMS=[{t:"State",lv:1,ti:"Lower",def:"Give a specific name, value, or other brief answer without explanation.",mx:"State the gradient of y = 3x + 5.",sx:"State the name of the process by which plants make food."},{t:"Define",lv:1,ti:"Lower",def:"Give the precise meaning of a word, phrase, or concept.",mx:"Define the term 'prime number'.",sx:"Define the term 'photosynthesis'."},{t:"Identify",lv:1,ti:"Lower",def:"Recognise and briefly state a relevant fact, feature, or pattern.",mx:"Identify the type of correlation shown in the scatter graph.",sx:"Identify the independent variable in this experiment."},{t:"List",lv:1,ti:"Lower",def:"Give a sequence of brief answers with no explanation.",mx:"List the first five square numbers.",sx:"List three adaptations of a polar bear."},{t:"Label",lv:1,ti:"Lower",def:"Add names or titles to a diagram, graph, or figure.",mx:"Label the x-axis and y-axis on the coordinate grid.",sx:"Label the parts of a plant cell on the diagram."},{t:"Measure",lv:1,ti:"Lower",def:"Find the value of a quantity using appropriate tools.",mx:"Measure the angle at vertex B using a protractor.",sx:"Measure the temperature of the water every 30 seconds."},{t:"Outline",lv:1,ti:"Lower",def:"Give a brief overview or summary of the main points.",mx:"Outline the steps needed to solve a linear equation.",sx:"Outline how energy is transferred in a food chain."},{t:"Recall",lv:1,ti:"Lower",def:"Remember and state a fact or piece of information from memory.",mx:"Recall the formula for the area of a triangle.",sx:"Recall the word equation for photosynthesis."},{t:"Select",lv:1,ti:"Lower",def:"Choose the correct or most appropriate option.",mx:"Select the appropriate formula to find the volume of a cylinder.",sx:"Select the correct unit for measuring force."},{t:"Describe",lv:2,ti:"Middle",def:"Give a detailed account of what something looks like, what happened, or how something works. Not why. just what.",mx:"Describe the pattern in the sequence 2, 6, 18, 54.",sx:"Describe what happens to the temperature as the ice melts."},{t:"Distinguish",lv:2,ti:"Middle",def:"Make clear the differences between two or more things.",mx:"Distinguish between a linear and a quadratic sequence.",sx:"Distinguish between a physical change and a chemical change."},{t:"Estimate",lv:2,ti:"Middle",def:"Find an approximate value using reasoning, not exact calculation.",mx:"Estimate the mean height of students using the grouped frequency table.",sx:"Estimate the pH of lemon juice based on its properties."},{t:"Calculate",lv:2,ti:"Middle",def:"Find the answer using mathematical methods. Show your working.",mx:"Calculate the area of a circle with radius 7 cm.",sx:"Calculate the speed of a car that travels 150 km in 2 hours."},{t:"Apply",lv:2,ti:"Middle",def:"Use knowledge or a method in a new or unfamiliar situation.",mx:"Apply compound interest to find the value after 3 years.",sx:"Apply your knowledge of density to explain why oil floats on water."},{t:"Demonstrate",lv:2,ti:"Middle",def:"Show clearly by giving evidence, examples, or practical proof.",mx:"Demonstrate that the angles in a triangle add up to 180°.",sx:"Demonstrate that light travels in straight lines."},{t:"Construct",lv:2,ti:"Middle",def:"Build, draw, or create something following specific rules or methods.",mx:"Construct an accurate pie chart for the given data.",sx:"Construct a food web using the organisms listed."},{t:"Solve",lv:2,ti:"Middle",def:"Work out the answer to a mathematical problem.",mx:"Solve the equation 3x + 7 = 22.",sx:"Solve for the missing force in the balanced force diagram."},{t:"Classify",lv:2,ti:"Middle",def:"Arrange or sort into groups based on shared characteri
