<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Concept Map — LearnLattice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow:hidden}

.cm-chrome{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(15,23,42,.95);border-bottom:1px solid #1e293b;gap:12px;flex-wrap:wrap;z-index:10;position:relative}
.cm-title{font-size:1rem;font-weight:700;background:linear-gradient(135deg,#0D9488,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cm-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cm-search{padding:6px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:.78rem;font-family:inherit;outline:none;width:180px;transition:border-color .15s}
.cm-search:focus{border-color:#0D9488}
.cm-filter{padding:5px 12px;border-radius:100px;border:1px solid #334155;background:transparent;color:#64748b;font-size:.68rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.cm-filter:hover{border-color:#0D9488;color:#94a3b8}
.cm-filter.on{background:rgba(13,148,136,.15);border-color:#0D9488;color:#14b8a6}
.cm-legend{display:flex;gap:12px;align-items:center}
.cm-leg{display:flex;align-items:center;gap:4px;font-size:.62rem;color:#64748b}
.cm-leg-dot{width:10px;height:10px;border-radius:50%}

/* SVG canvas — fills remaining viewport */
#cmCanvas{width:100%;height:calc(100vh - 52px);display:block;cursor:grab}
#cmCanvas:active{cursor:grabbing}

/* Tooltip */
.cm-tip{position:fixed;display:none;padding:12px 16px;background:rgba(15,23,42,.96);border:1px solid #334155;border-radius:12px;max-width:280px;z-index:100;pointer-events:none;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.cm-tip-type{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.cm-tip-name{font-size:.95rem;font-weight:700;color:#fff;margin-bottom:4px}
.cm-tip-desc{font-size:.72rem;color:#94a3b8;line-height:1.45;margin-bottom:6px}
.cm-tip-links{display:flex;flex-direction:column;gap:3px}
.cm-tip-link{font-size:.68rem;color:#14b8a6;font-weight:500}

/* Click panel */
.cm-panel{position:fixed;top:52px;right:0;width:320px;height:calc(100vh - 52px);background:rgba(15,23,42,.98);border-left:1px solid #1e293b;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:50;padding:20px}
.cm-panel.open{transform:translateX(0)}
.cm-panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:8px;background:#1e293b;border:1px solid #334155;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .15s}
.cm-panel-close:hover{border-color:#0D9488;color:#fff}
.cm-panel-type{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.cm-panel-name{font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:8px}
.cm-panel-desc{font-size:.82rem;color:#94a3b8;line-height:1.55;margin-bottom:16px}
.cm-panel-section{margin-bottom:16px}
.cm-panel-section h3{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:8px}
.cm-panel-link{display:block;padding:8px 12px;margin-bottom:4px;background:#1e293b;border:1px solid #334155;border-radius:8px;text-decoration:none;color:#e2e8f0;font-size:.78rem;transition:all .12s}
.cm-panel-link:hover{border-color:#0D9488;color:#14b8a6}
.cm-panel-connections{display:flex;flex-wrap:wrap;gap:4px}
.cm-panel-conn{padding:3px 10px;border-radius:6px;font-size:.65rem;font-weight:600;background:#1e293b;border:1px solid #334155;color:#94a3b8;cursor:pointer;transition:all .12s}
.cm-panel-conn:hover{border-color:#0D9488;color:#14b8a6}

.cm-help{position:fixed;bottom:12px;left:12px;font-size:.65rem;color:#475569;z-index:10}
</style>
</head>
<body>

<div class="cm-chrome">
  <span class="cm-title">🧠 Concept Map</span>
  <div class="cm-controls">
    <input type="text" class="cm-search" id="cmSearch" placeholder="Search topics..." oninput="searchNodes(this.value)">
    <button class="cm-filter on" data-f="all" onclick="filterType('all',this)">All</button>
    <button class="cm-filter" data-f="subject" onclick="filterType('subject',this)">Subjects</button>
    <button class="cm-filter" data-f="topic" onclick="filterType('topic',this)">Topics</button>
    <button class="cm-filter" data-f="key_concept" onclick="filterType('key_concept',this)">Key Concepts</button>
    <button class="cm-filter" data-f="tag" onclick="filterType('tag',this)">Tags</button>
  </div>
  <div class="cm-legend">
    <span class="cm-leg"><span class="cm-leg-dot" style="background:#0D9488"></span>Subject</span>
    <span class="cm-leg"><span class="cm-leg-dot" style="background:#f59e0b"></span>Topic</span>
    <span class="cm-leg"><span class="cm-leg-dot" style="background:#e11d48"></span>Key Concept</span>
    <span class="cm-leg"><span class="cm-leg-dot" style="background:#3b82f6"></span>Tag</span>
  </div>
</div>

<svg id="cmCanvas"></svg>
<div class="cm-tip" id="cmTip"></div>
<div class="cm-panel" id="cmPanel"></div>
<div class="cm-help">Scroll to zoom · Drag to pan · Click a node to explore</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
var TYPE_COLORS = {subject:'#0D9488',topic:'#f59e0b',key_concept:'#e11d48',tag:'#3b82f6'};
var TYPE_RADIUS = {subject:18,topic:14,key_concept:16,tag:8};
var TYPE_LABELS = {subject:'Subject',topic:'Topic',key_concept:'Key Concept',tag:'Tag'};
var graphData, simulation, svg, g, link, node, label;
var activeFilter = 'all';
var searchTerm = '';
var selectedNode = null;

// Load data
fetch('/js/concept-graph-data.json')
  .then(function(r){return r.json()})
  .then(function(data){
    graphData = data;
    initGraph();
  })
  .catch(function(e){
    document.getElementById('cmCanvas').innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#64748b" font-size="14">Loading concept map data...</text>';
  });

function initGraph() {
  var width = window.innerWidth;
  var height = window.innerHeight - 52;
  
  svg = d3.select('#cmCanvas')
    .attr('width', width)
    .attr('height', height);
  
  // Zoom
  var zoom = d3.zoom()
    .scaleExtent([0.3, 4])
    .on('zoom', function(event) { g.attr('transform', event.transform); });
  svg.call(zoom);
  
  g = svg.append('g');
  
  // Initial zoom to fit
  svg.call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(0.8));
  
  // Force simulation
  simulation = d3.forceSimulation(graphData.nodes)
    .force('link', d3.forceLink(graphData.links).id(function(d){return d.id}).distance(function(d){
      // Shorter links between related types
      return 60;
    }).strength(0.3))
    .force('charge', d3.forceManyBody().strength(function(d){
      return d.type === 'subject' ? -300 : d.type === 'key_concept' ? -200 : -80;
    }))
    .force('center', d3.forceCenter(0, 0))
    .force('collision', d3.forceCollide().radius(function(d){return (TYPE_RADIUS[d.type]||8) + 4}));
  
  // Links
  link = g.append('g')
    .selectAll('line')
    .data(graphData.links)
    .join('line')
    .attr('stroke', '#1e293b')
    .attr('stroke-width', 0.8)
    .attr('stroke-opacity', 0.5);
  
  // Nodes
  node = g.append('g')
    .selectAll('circle')
    .data(graphData.nodes)
    .join('circle')
    .attr('r', function(d){return TYPE_RADIUS[d.type]||8})
    .attr('fill', function(d){return TYPE_COLORS[d.type]||'#64748b'})
    .attr('stroke', '#0a0f1a')
    .attr('stroke-width', 2)
    .attr('cursor', 'pointer')
    .attr('opacity', 1)
    .on('mouseover', onHover)
    .on('mouseout', onHoverOut)
    .on('click', onClick)
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragging)
      .on('end', dragEnd));
  
  // Labels (only for subjects and key concepts, and larger topics)
  label = g.append('g')
    .selectAll('text')
    .data(graphData.nodes.filter(function(d){return d.type==='subject'||d.type==='key_concept'||d.type==='topic'}))
    .join('text')
    .attr('text-anchor', 'middle')
    .attr('dy', function(d){return (TYPE_RADIUS[d.type]||8) + 14})
    .attr('font-size', function(d){return d.type==='subject'?'11px':'9px'})
    .attr('font-weight', function(d){return d.type==='subject'?'700':'500'})
    .attr('fill', function(d){return TYPE_COLORS[d.type]||'#64748b'})
    .attr('opacity', 0.8)
    .text(function(d){return d.label});
  
  simulation.on('tick', function() {
    link.attr('x1',function(d){return d.source.x}).attr('y1',function(d){return d.source.y})
        .attr('x2',function(d){return d.target.x}).attr('y2',function(d){return d.target.y});
    node.attr('cx',function(d){return d.x}).attr('cy',function(d){return d.y});
    label.attr('x',function(d){return d.x}).attr('y',function(d){return d.y});
  });
}

// ─── Interactions ───
function onHover(event, d) {
  var tip = document.getElementById('cmTip');
  var connections = graphData.links.filter(function(l){
    return (l.source.id||l.source)===d.id || (l.target.id||l.target)===d.id;
  }).length;
  
  tip.innerHTML = '<div class="cm-tip-type" style="color:' + (TYPE_COLORS[d.type]||'#64748b') + '">' + (TYPE_LABELS[d.type]||d.type) + '</div>' +
    '<div class="cm-tip-name">' + d.label + '</div>' +
    '<div class="cm-tip-desc">' + connections + ' connections · Click to explore</div>';
  tip.style.display = 'block';
  tip.style.left = (event.pageX + 16) + 'px';
  tip.style.top = (event.pageY - 10) + 'px';
  
  // Highlight connected nodes
  var connectedIds = new Set([d.id]);
  graphData.links.forEach(function(l){
    var sid = l.source.id||l.source, tid = l.target.id||l.target;
    if(sid===d.id) connectedIds.add(tid);
    if(tid===d.id) connectedIds.add(sid);
  });
  node.attr('opacity', function(n){return connectedIds.has(n.id)?1:0.15});
  link.attr('stroke-opacity', function(l){
    var sid=l.source.id||l.source, tid=l.target.id||l.target;
    return (sid===d.id||tid===d.id)?0.8:0.05;
  }).attr('stroke', function(l){
    var sid=l.source.id||l.source, tid=l.target.id||l.target;
    return (sid===d.id||tid===d.id)?TYPE_COLORS[d.type]:'#1e293b';
  });
  label.attr('opacity', function(n){return connectedIds.has(n.id)?1:0.1});
}

function onHoverOut() {
  document.getElementById('cmTip').style.display = 'none';
  applyFilters();
}

function onClick(event, d) {
  selectedNode = d;
  var panel = document.getElementById('cmPanel');
  
  // Find connections
  var connected = [];
  graphData.links.forEach(function(l){
    var sid = l.source.id||l.source, tid = l.target.id||l.target;
    if(sid===d.id) {
      var target = graphData.nodes.find(function(n){return n.id===(tid.id||tid)});
      if(target) connected.push(target);
    }
    if(tid===d.id) {
      var source = graphData.nodes.find(function(n){return n.id===(sid.id||sid)});
      if(source) connected.push(source);
    }
  });
  
  // Build URL for this node
  var url = '';
  if(d.type==='subject') url = '/subjects/' + d.label.toLowerCase().replace(/ /g,'-') + '/';
  else if(d.type==='tag') url = '/tags/' + d.label.toLowerCase().replace(/ /g,'-') + '/';
  else if(d.type==='key_concept') url = '/key-concepts/' + d.label.toLowerCase().replace(/ /g,'-') + '/';
  else if(d.type==='topic') url = '/subjects/mathematics/#' + d.label.toLowerCase().replace(/ /g,'-');
  
  var html = '<button class="cm-panel-close" onclick="closePanel()">✕</button>' +
    '<div class="cm-panel-type" style="color:' + (TYPE_COLORS[d.type]||'#64748b') + '">' + (TYPE_LABELS[d.type]||d.type) + '</div>' +
    '<div class="cm-panel-name">' + d.label + '</div>';
  
  if(url) {
    html += '<div class="cm-panel-section"><a href="' + url + '" class="cm-panel-link" target="_top">Browse ' + d.label + ' resources →</a></div>';
  }
  
  // Group connections by type
  var byType = {};
  connected.forEach(function(c){
    if(!byType[c.type]) byType[c.type] = [];
    byType[c.type].push(c);
  });
  
  Object.keys(byType).forEach(function(type){
    html += '<div class="cm-panel-section"><h3>' + (TYPE_LABELS[type]||type) + 's (' + byType[type].length + ')</h3><div class="cm-panel-connections">';
    byType[type].sort(function(a,b){return a.label.localeCompare(b.label)}).forEach(function(c){
      html += '<span class="cm-panel-conn" onclick="focusNode(\'' + c.id + '\')" style="border-color:' + (TYPE_COLORS[c.type]||'#334155') + '30">' + c.label + '</span>';
    });
    html += '</div></div>';
  });
  
  panel.innerHTML = html;
  panel.classList.add('open');
}

window.closePanel = function(){
  document.getElementById('cmPanel').classList.remove('open');
  selectedNode = null;
  applyFilters();
};

window.focusNode = function(id) {
  var n = graphData.nodes.find(function(d){return d.id===id});
  if(n) {
    onClick(null, n);
    // Pan to the node
    if(svg && n.x !== undefined) {
      var width = window.innerWidth;
      var height = window.innerHeight - 52;
      var transform = d3.zoomIdentity.translate(width/2 - n.x*0.8, height/2 - n.y*0.8).scale(0.8);
      svg.transition().duration(500).call(d3.zoom().transform, transform);
    }
  }
};

// ─── Filter & Search ───
window.filterType = function(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.cm-filter').forEach(function(b){b.classList.toggle('on',b.dataset.f===type)});
  applyFilters();
};

window.searchNodes = function(term) {
  searchTerm = term.toLowerCase();
  applyFilters();
};

function applyFilters() {
  if(!node) return;
  node.attr('opacity', function(d){
    var typeMatch = activeFilter==='all' || d.type===activeFilter;
    var searchMatch = !searchTerm || d.label.toLowerCase().indexOf(searchTerm) !== -1;
    return (typeMatch && searchMatch) ? 1 : 0.08;
  });
  node.attr('r', function(d){
    var searchMatch = searchTerm && d.label.toLowerCase().indexOf(searchTerm) !== -1;
    var base = TYPE_RADIUS[d.type]||8;
    return searchMatch ? base * 1.5 : base;
  });
  label.attr('opacity', function(d){
    var typeMatch = activeFilter==='all' || d.type===activeFilter;
    var searchMatch = !searchTerm || d.label.toLowerCase().indexOf(searchTerm) !== -1;
    return (typeMatch && searchMatch) ? 0.8 : 0.05;
  });
  link.attr('stroke-opacity', activeFilter==='all' && !searchTerm ? 0.5 : 0.08);
}

// ─── Drag ───
function dragStart(event, d) {
  if(!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragging(event, d) { d.fx = event.x; d.fy = event.y; }
function dragEnd(event, d) {
  if(!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// Resize handler
window.addEventListener('resize', function(){
  if(svg) {
    svg.attr('width', window.innerWidth).attr('height', window.innerHeight - 52);
  }
});
</script>
</body>
</html>
