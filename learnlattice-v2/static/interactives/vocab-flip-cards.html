<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Vocab Flip Cards</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f8faf9;color:#134e4a;line-height:1.5}.app{max-width:600px;margin:0 auto;padding:20px}h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}.sub{font-size:.82rem;color:#5f8a82;margin-bottom:16px}.controls{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}.topic-btn{padding:7px 14px;border-radius:8px;border:1.5px solid #d5e5e0;background:#fff;color:#5f8a82;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}.topic-btn:hover{border-color:#0d9488;color:#0d9488}.topic-btn.active{background:#0d9488;border-color:#0d9488;color:#fff}.lang-toggle{margin-left:auto;display:flex;gap:2px}.lang-btn{padding:5px 10px;border-radius:6px;border:1px solid #d5e5e0;background:#fff;color:#5f8a82;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}.lang-btn.active{background:#134e4a;border-color:#134e4a;color:#fff}.progress{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:.78rem;color:#5f8a82}.progress-bar{flex:1;height:6px;background:#d5e5e0;border-radius:3px;overflow:hidden}.progress-fill{height:100%;background:#0d9488;border-radius:3px;transition:width .3s}.card-area{perspective:1000px;min-height:320px;margin-bottom:16px}.card{position:relative;width:100%;min-height:320px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}.card.flipped{transform:rotateY(180deg)}.card-face{position:absolute;top:0;left:0;width:100%;min-height:320px;backface-visibility:hidden;border-radius:20px;border:2px solid #d5e5e0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}.card-front{background:linear-gradient(180deg,#fff 0,#f0fdf4 100%)}.card-back{background:linear-gradient(180deg,#f0fdfa 0,#e6faf6 100%);transform:rotateY(180deg)}.card-emoji{font-size:3.5rem;margin-bottom:16px}.card-term{font-size:1.8rem;font-weight:800;color:#134e4a;margin-bottom:8px;letter-spacing:-.5px}.card-l1{font-size:1.1rem;color:#0d9488;font-weight:600;margin-bottom:4px}.card-tap{font-size:.72rem;color:#b0cec6;margin-top:12px}.card-def{font-size:1.05rem;color:#134e4a;line-height:1.6;margin-bottom:16px;max-width:420px}.card-example{font-size:.88rem;color:#5f8a82;font-style:italic;padding:12px 18px;background:rgba(13,148,136,.06);border-radius:10px;border-left:3px solid #0d9488;max-width:420px;text-align:left}.card-example strong{color:#0d9488;font-style:normal;font-weight:700}.nav-row{display:flex;gap:10px;justify-content:center;align-items:center}.nav-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid #d5e5e0;background:#fff;color:#5f8a82;font-size:1.2rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}.nav-btn:hover{border-color:#0d9488;color:#0d9488;background:#f0fdf4}.nav-btn:disabled{opacity:.3;cursor:default}.nav-counter{font-size:.88rem;font-weight:700;color:#134e4a;min-width:60px;text-align:center}.know-btns{display:flex;gap:8px;margin-top:12px;justify-content:center}.know-btn{padding:8px 20px;border-radius:8px;border:1.5px solid;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}.know-btn-no{border-color:#ef4444;color:#ef4444;background:#fff}.know-btn-no:hover{background:#fef2f2}.know-btn-yes{border-color:#22c55e;color:#22c55e;background:#fff}.know-btn-yes:hover{background:#f0fdf4}.score{text-align:center;margin-top:12px;font-size:.78rem;color:#5f8a82}.score strong{color:#0d9488}.done{text-align:center;padding:40px 20px}.done h2{font-size:1.4rem;color:#0d9488;margin-bottom:8px}.done p{font-size:.92rem;color:#5f8a82;margin-bottom:16px}.done-btn{padding:10px 24px;border-radius:10px;border:none;background:#0d9488;color:#fff;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit}.done-btn:hover{background:#0a7c72}@media(max-width:480px){.card-term{font-size:1.4rem}.card-face{padding:24px;min-height:280px}.card-area{min-height:280px}.card{min-height:280px}}</style></head><body><div class="app"><h1>🔤 Visual Vocab Flip Cards</h1><p class="sub">Tap a card to flip. Mark what you know. Study what you don't.</p><div class="controls" id="controls"><button class="topic-btn active" onclick='setTopic("all")'>All</button> <button class="topic-btn" onclick='setTopic("algebra")'>Algebra</button> <button class="topic-btn" onclick='setTopic("geometry")'>Geometry</button> <button class="topic-btn" onclick='setTopic("statistics")'>Statistics</button> <button class="topic-btn" onclick='setTopic("forces")'>Forces</button> <button class="topic-btn" onclick='setTopic("ecology")'>Ecology</button> <button class="topic-btn" onclick='setTopic("chemistry")'>Chemistry</button> <button class="topic-btn" onclick='setTopic("cells")'>Cells</button> <button class="topic-btn" onclick='setTopic("energy")'>Energy</button><div class="lang-toggle"><button class="lang-btn active" onclick='setLang("en")'>EN</button> <button class="lang-btn" onclick='setLang("zh")'>中文</button> <button class="lang-btn" onclick='setLang("ko")'>한국어</button></div></div><div class="progress"><div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div><span id="progText">0 / 0</span></div><div class="card-area" id="cardArea"><div class="card" id="card" onclick="flipCard()"><div class="card-face card-front" id="front"></div><div class="card-face card-back" id="back"></div></div></div><div class="nav-row"><button class="nav-btn" id="prevBtn" onclick="prev()">←</button> <span class="nav-counter" id="counter">1 / 1</span> <button class="nav-btn" id="nextBtn" onclick="next()">→</button></div><div class="know-btns" id="knowBtns"><button class="know-btn know-btn-no" onclick="markKnow(!1)">❌ Still learning</button> <button class="know-btn know-btn-yes" onclick="markKnow(!0)">✅ I know this</button></div><div class="score" id="score"></div></div><script>const VOCAB=[{term:"Variable",emoji:"🔤",def:"A letter (like x or n) that represents a number we don't know yet.",example:"In the expression 3x + 5, the variable is x.",zh:"变量",ko:"변수",topic:"algebra"},{term:"Coefficient",emoji:"🔢",def:"The number in front of a variable. It tells you how many of that variable you have.",example:"In 7y, the coefficient is 7.",zh:"系数",ko:"계수",topic:"algebra"},{term:"Expression",emoji:"📝",def:"A combination of numbers, variables, and operations. but no equals sign.",example:"2x + 3 is an expression. 2x + 3 = 11 is an equation.",zh:"表达式",ko:"식",topic:"algebra"},{term:"Equation",emoji:"⚖️",def:"A mathematical statement that says two things are equal. It always has an equals sign.",example:"3x + 2 = 14 is an equation.",zh:"方程",ko:"방정식",topic:"algebra"},{term:"Substitute",emoji:"🔄",def:"To replace a variable with a number.",example:"If x = 4, then 2x + 1 = 2(4) + 1 = 9.",zh:"代入",ko:"대입하다",topic:"algebra"},{term:"Simplify",emoji:"✂️",def:"To make an expression shorter by combining like terms.",example:"3x + 2x = 5x (simplified).",zh:"化简",ko:"간소화하다",topic:"algebra"},{term:"Term",emoji:"🧩",def:"A single number, variable, or number × variable in an expression.",example:"In 4x + 3y − 7, the terms are 4x, 3y, and −7.",zh:"项",ko:"항",topic:"algebra"},{term:"Linear",emoji:"📏",def:"A relationship that makes a straight line when graphed.",example:"y = 2x + 1 is a linear equation.",zh:"线性的",ko:"선형의",topic:"algebra"},{term:"Perimeter",emoji:"🔲",def:"The total distance around the outside of a shape.",example:"A rectangle 5 cm × 3 cm has perimeter = 2(5+3) = 16 cm.",zh:"周长",ko:"둘레",topic:"geometry"},{term:"Area",emoji:"📐",def:"The amount of space inside a 2D shape. Measured in square units.",example:"A rectangle 5 cm × 3 cm has area = 15 cm².",zh:"面积",ko:"면적",topic:"geometry"},{term:"Volume",emoji:"📦",def:"The amount of space inside a 3D shape. Measured in cubic units.",example:"A cube with sides 2 cm has volume = 8 cm³.",zh:"体积",ko:"부피",topic:"geometry"},{term:"Parallel",emoji:"🟰",def:"Lines that are always the same distance apart. They never cross.",example:"Train tracks are parallel lines.",zh:"平行的",ko:"평행한",topic:"geometry"},{term:"Perpendicular",emoji:"➕",def:"Lines that meet at a 90° angle (right angle).",example:"The corner of a page shows perpendicular lines.",zh:"垂直的",ko:"수직의",topic:"geometry"},{term:"Symmetry",emoji:"🦋",def:"When one half of a shape is a mirror image of the other half.",example:"A butterfly has one line of symmetry.",zh:"对称",ko:"대칭",topic:"geometry"},{term:"Mean",emoji:"📊",def:"The average. Add all values, then divide by how many there are.",example:"Mean of 2, 4, 6 = (2+4+6) ÷ 3 = 4.",zh:"平均值",ko:"평균",topic:"statistics"},{term:"Median",emoji:"🎯",def:"The middle value when all values are in order.",example:"Median of 1, 3, 7, 8, 9 = 7 (the middle one).",zh:"中位数",ko:"중앙값",topic:"statistics"},{term:"Mode",emoji:"🏆",def:"The value that appears most often in a data set.",example:"Mode of 2, 3, 3, 5, 7 = 3 (appears twice).",zh:"众数",ko:"최빈값",topic:"statistics"},{term:"Range",emoji:"↔️",def:"The difference between the highest and lowest values.",example:"Range of 2, 5, 9 = 9 − 2 = 7.",zh:"范围",ko:"범위",topic:"statistics"},{term:"Probability",emoji:"🎲",def:"How likely something is to happen. From 0 (impossible) to 1 (certain).",example:"P(heads on a coin) = 0.5 or 50%.",zh:"概率",ko:"확률",topic:"statistics"},{term:"Force",emoji:"💪",def:"A push or pull on an object. Measured in Newtons (N).",example:"Gravity is a force that pulls objects toward the Earth.",zh:"力",ko:"힘",topic:"forces"},{term:"Friction",emoji:"🤚",def:"A force that slows things down when surfaces rub together.",example:"Rough roads create more friction than smooth ice.",zh:"摩擦力",ko:"마찰력",topic:"forces"},{term:"Gravity",emoji:"🌍",def:"The force that pulls objects toward each other. On Earth, it pulls everything down.",example:"Gravity makes a ball fall to the ground.",zh:"重力",ko:"중력",topic:"forces"},{term:"Mass",emoji:"⚖️",def:"How much matter is in an object. Measured in kilograms (kg).",example:"A bag of flour has a mass of about 1 kg.",zh:"质量",ko:"질량",topic:"forces"},{term:"Weight",emoji:"🏋️",def:"The force of gravity on an object. Weight = mass × gravity.",example:"On Earth, a 10 kg object weighs about 100 N.",zh:"重量",ko:"무게",topic:"forces"},{term:"Ecosystem",emoji:"🌿",def:"A community of living things and their non-living environment, all interacting together.",example:"A pond ecosystem includes fish, plants, water, and sunlight.",zh:"生态系统",ko:"생태계",topic:"ecology"},{term:"Food chain",emoji:"🔗",def:"A diagram showing how energy passes from one living thing to another.",example:"Grass → Rabbit → Fox is a simple food chain.",zh:"食物链",ko:"먹이사슬",topic:"ecology"},{term:"Producer",emoji:"🌱",def:"A living thing that makes its own food, usually using sunlight.",example:"Plants and algae are producers.",zh:"生产者",ko:"생산자",topic:"ecology"},{term:"Consumer",emoji:"🐁",def:"A living thing that eats other living things for energy.",example:"A rabbit is a primary consumer. A fox is a secondary consumer.",zh:"消费者",ko:"소비자",topic:"ecology"},{term:"Decomposer",emoji:"🍄",def:"A living thing that breaks down dead material and recycles nutrients.",example:"Fungi and bacteria are decomposers.",zh:"分解者",ko:"분해자",topic:"ecology"},{term:"Photosynthesis",emoji:"☀️",def:"The process plants use to convert sunlight, water, and CO₂ into glucose and oxygen.",example:"Plants photosynthesise in their leaves using chlorophyll.",zh:"光合作用",ko:"광합성",topic:"ecology"},{term:"Atom",emoji:"⚛️",def:"The smallest particle of an element. Everything is made of atoms.",example:"A gold ring is made of gold atoms.",zh:"原子",ko:"원자",topic:"chemistry"},{term:"Molecule",emoji:"🔬",def:"Two or more atoms joined together by chemical bonds.",example:"H₂O is a molecule. two hydrogen atoms and one oxygen atom.",zh:"分子",ko:"분자",topic:"chemistry"},{term:"Element",emoji:"🧪",def:"A pure substance made of only one type of atom.",example:"Oxygen (O) and Iron (Fe) are elements.",zh:"元素",ko:"원소",topic:"chemistry"},{term:"Compound",emoji:"🧬",def:"A substance made of two or more different elements chemically bonded.",example:"Water (H₂O) is a compound of hydrogen and oxygen.",zh:"化合物",ko:"화합물",topic:"chemistry"},{term:"pH",emoji:"🌡️",def:"A scale from 0–14 that measures how acidic or alkaline a substance is. 7 is neutral.",example:"Lemon juice has pH ≈ 2 (acidic). Soap has pH ≈ 10 (alkaline).",zh:"酸碱度",ko:"수소이온농도",topic:"chemistry"},{term:"Cell",emoji:"🔴",def:"The smallest unit of life. All living things are made of cells.",example:"Your body has about 37 trillion cells.",zh:"细胞",ko:"세포",topic:"cells"},{term:"Nucleus",emoji:"🟣",def:"The control centre of a cell. It contains DNA.",example:"The nucleus tells the cell what to do.",zh:"细胞核",ko:"핵",topic:"cells"},{term:"Cell membrane",emoji:"🛡️",def:"The thin layer around a cell that controls what goes in and out.",example:"The cell membrane lets water in but keeps harmful chemicals out.",zh:"细胞膜",ko:"세포막",topic:"cells"},{term:"Mitochondria",emoji:"⚡",def:"The part of the cell that releases energy from food. The 'powerhouse.'",example:"Active cells like muscle cells have many mitochondria.",zh:"线粒体",ko:"미토콘드리아",topic:"cells"},{term:"Chloroplast",emoji:"🌿",def:"Found only in plant cells. Where photosynthesis happens.",example:"Chloroplasts contain chlorophyll, which makes leaves green.",zh:"叶绿体",ko:"엽록체",topic:"cells"},{term:"Kinetic energy",emoji:"🏃",def:"The energy an object has because it is moving.",example:"A rolling ball has kinetic energy.",zh:"动能",ko:"운동에너지",topic:"energy"},{term:"Potential energy",emoji:"🔋",def:"Stored energy that can be released later.",example:"A stretched rubber band has elastic potential energy.",zh:"势能",ko:"위치에너지",topic:"energy"},{term:"Thermal energy",emoji:"🔥",def:"Energy related to temperature. The hotter something is, the more thermal energy it has.",example:"A cup of hot tea has more thermal energy than a cold glass of water.",zh:"热能",ko:"열에너지",topic:"energy"},{term:"Energy transfer",emoji:"➡️",def:"When energy moves from one object or form to another.",example:"A battery transfers chemical energy to electrical energy.",zh:"能量转移",ko:"에너지 전달",topic:"energy"},{term:"Conservation of energy",emoji:"♻️",def:"Energy cannot be created or destroyed. only changed from one form to another.",example:"When you drop a ball, potential energy changes to kinetic energy.",zh:"能量守恒",ko:"에너지 보존",topic:"energy"}];let currentTopic="all",currentLang="en",deck=[],idx=0,known=new Set;function setTopic(e){currentTopic=e,document.querySelectorAll(".topic-btn").forEach(e=>e.classList.remove("active")),event.target.classList.add("active"),known.clear(),buildDeck()}function setLang(e){currentLang=e,document.querySelectorAll(".lang-btn").forEach(e=>e.classList.remove("active")),event.target.classList.add("active"),renderCard()}function buildDeck(){deck="all"===currentTopic?[...VOCAB]:VOCAB.filter(e=>e.topic===currentTopic),shuffle(deck),idx=0,renderCard(),updateProgress()}function shuffle(e){for(let t=e.length-1;t>0;t--){const o=Math.floor(Math.random()*(t+1));[e[t],e[o]]=[e[o],e[t]]}}function flipCard(){document.getElementById("card").classList.toggle("flipped")}function renderCard(){if(idx>=deck.length)return void showDone();const e=deck[idx];document.getElementById("card").classList.remove("flipped");const t="zh"===currentLang?e.zh:"ko"===currentLang?e.ko:"";document.getElementById("front").innerHTML=`\n    <div class="card-emoji">${e.emoji}</div>\n    <div class="card-term">${e.term}</div>\n    ${t?`<div class="card-l1">${t}</div>`:""}\n    <div class="card-tap">tap to flip →</div>\n  `,document.getElementById("back").innerHTML=`\n    <div class="card-def">${e.def}</div>\n    <div class="card-example"><strong>Example:</strong> ${e.example}</div>\n  `,document.getElementById("counter").textContent=`${idx+1} / ${deck.length}`,document.getElementById("prevBtn").disabled=0===idx,document.getElementById("nextBtn").disabled=idx>=deck.length-1,document.getElementById("cardArea").style.display="block",document.getElementById("knowBtns").style.display="flex",updateProgress()}function next(){idx<deck.length-1&&(idx++,renderCard())}function prev(){idx>0&&(idx--,renderCard())}function markKnow(e){const t=deck[idx];e?known.add(t.term):known.delete(t.term),updateProgress(),idx<deck.length-1?(idx++,renderCard()):showDone()}function updateProgress(){const e=deck.length?Math.round(known.size/deck.length*100):0;document.getElementById("progFill").style.width=e+"%",document.getElementById("progText").textContent=known.size+" / "+deck.length,document.getElementById("score").innerHTML=known.size>0?`<strong>${known.size}</strong> mastered · <strong>${deck.length-known.size}</strong> still learning`:""}function showDone(){const e=deck.length?Math.round(known.size/deck.length*100):0;document.getElementById("cardArea").innerHTML=`\n    <div class="done">\n      <h2>${e>=80?"🎉 Amazing!":e>=50?"💪 Great progress!":"📚 Keep going!"}</h2>\n      <p>You mastered <strong>${known.size}</strong> out of <strong>${deck.length}</strong> terms (${e}%).</p>\n      ${deck.length-known.size>0?'<button class="done-btn" onclick="reviewMissed()">🔄 Review missed terms</button>':'<button class="done-btn" onclick="buildDeck()">🔄 Study again</button>'}\n    </div>\n  `,document.getElementById("knowBtns").style.display="none"}function reviewMissed(){deck=deck.filter(e=>!known.has(e.term)),shuffle(deck),idx=0,document.getElementById("cardArea").innerHTML='<div class="card" id="card" onclick="flipCard()"><div class="card-face card-front" id="front"></div><div class="card-face card-back" id="back"></div></div>',renderCard(),document.getElementById("knowBtns").style.display="flex"}buildDeck()</script></body></html>
