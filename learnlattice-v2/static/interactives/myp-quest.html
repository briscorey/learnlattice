<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MYP Quest — LearnLattice</title>
<!-- MYP Alignment
   Key Concept: Logic, Systems
   ATL: Critical thinking, Transfer
   Global Context: Scientific and Technical Innovation
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--surface:rgba(20,20,40,.85);--border:rgba(100,120,255,.15);--ink:#e8eaff;--muted:#7a7eaa;--accent:#6366f1;--accent2:#22d3ee;--gold:#fbbf24;--danger:#ef4444;--success:#22c55e}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',sans-serif;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}

/* Starfield bg */
.stars{position:fixed;inset:0;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite var(--del,0s)}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

.app{position:relative;z-index:1;width:100%;max-width:900px;padding:16px}

/* Title screen */
.title-screen{text-align:center;animation:fadeUp .6s ease}
.title-screen h1{font-family:'Press Start 2P',monospace;font-size:clamp(20px,4vw,32px);background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;line-height:1.4}
.title-screen .sub{font-size:14px;color:var(--muted);margin-bottom:28px}

/* Theme selector */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:24px}
.theme-card{padding:18px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);backdrop-filter:blur(8px);cursor:pointer;transition:all .2s;text-align:left}
.theme-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(99,102,241,.2)}
.theme-card.selected{border-color:var(--accent2);background:rgba(34,211,238,.08);box-shadow:0 0 0 2px rgba(34,211,238,.2)}
.theme-icon{font-size:1.8rem;margin-bottom:8px}
.theme-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.theme-desc{font-size:11px;color:var(--muted);line-height:1.4}

.start-btn{padding:14px 40px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:.5px}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.4)}
.start-btn:disabled{opacity:.4;cursor:default;transform:none}

/* Game screen */
.game-screen{display:none}
.game-hud{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;margin-bottom:8px;background:var(--surface);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:10px}
.hud-left,.hud-right{display:flex;align-items:center;gap:16px}
.hud-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hud-item strong{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.hud-item.gold strong{color:var(--gold)}
.hud-item.lives strong{color:var(--danger)}
.hud-item.level strong{color:var(--accent2)}
.hud-theme{font-size:11px;color:var(--accent2);font-weight:600}

canvas{display:block;border-radius:14px;border:1px solid var(--border);background:#0a0a1a}

/* Loading overlay */
.loading{display:none;position:absolute;inset:0;background:rgba(10,10,26,.9);backdrop-filter:blur(8px);z-index:100;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
.loading.show{display:flex}
.loading h3{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--accent2);margin-bottom:12px}
.loading p{font-size:13px;color:var(--muted);max-width:300px;text-align:center;line-height:1.5}
.loading-bar{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:16px;overflow:hidden}
.loading-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;animation:loadPulse 1.5s ease-in-out infinite;width:60%}
@keyframes loadPulse{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

/* Level complete overlay */
.level-complete{display:none;position:absolute;inset:0;background:rgba(10,10,26,.85);backdrop-filter:blur(8px);z-index:100;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
.level-complete.show{display:flex}
.level-complete h2{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--gold);margin-bottom:8px}
.level-complete p{font-size:13px;color:var(--muted);margin-bottom:20px;text-align:center;max-width:300px;line-height:1.5}
.level-complete .next-btn{padding:12px 32px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}

/* Game over */
.game-over{display:none;position:absolute;inset:0;background:rgba(10,10,26,.9);backdrop-filter:blur(8px);z-index:100;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
.game-over.show{display:flex}
.game-over h2{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--danger);margin-bottom:8px}

/* Level theme selector between levels */
.next-theme{margin-top:12px}
.next-theme label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px}
.next-theme select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-size:12px;outline:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app" id="app">
  <!-- Title / Theme Select -->
  <div class="title-screen" id="titleScreen">
    <h1>MYP QUEST</h1>
    <p class="sub">An AI-generated platformer. Each level is designed by Claude based on the topic you choose.</p>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px">Choose a theme to start your adventure:</p>
    <div class="themes" id="themeGrid"></div>
    <button class="start-btn" id="startBtn" disabled onclick="startGame()">Start Adventure →</button>
  </div>

  <!-- Game -->
  <div class="game-screen" id="gameScreen" style="position:relative">
    <div class="game-hud">
      <div class="hud-left">
        <div class="hud-item level">🏔️ <strong id="hudLevel">1</strong></div>
        <span class="hud-theme" id="hudTheme"></span>
      </div>
      <div class="hud-right">
        <div class="hud-item gold">⭐ <strong id="hudScore">0</strong></div>
        <div class="hud-item lives">❤️ <strong id="hudLives">3</strong></div>
      </div>
    </div>
    <canvas id="gameCanvas" width="860" height="480"></canvas>
    
    <div class="loading" id="loading">
      <h3>GENERATING LEVEL...</h3>
      <p id="loadMsg">Claude is designing a level about <strong>your topic</strong>...</p>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>
    
    <div class="level-complete" id="levelComplete">
      <h2>⭐ LEVEL COMPLETE!</h2>
      <p id="lcMsg"></p>
      <div class="next-theme">
        <label>Choose theme for next level:</label>
        <select id="nextThemeSelect"></select>
      </div>
      <button class="next-btn" onclick="nextLevel()" style="margin-top:12px">Next Level →</button>
    </div>
    
    <div class="game-over" id="gameOver">
      <h2>GAME OVER</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px">You reached Level <strong id="goLevel">1</strong> with <strong id="goScore">0</strong> stars!</p>
      <button class="next-btn" onclick="location.reload()">Try Again</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// MYP QUEST — AI-Generated Platformer
// ═══════════════════════════════════════════

// ─── Theme data (MYP topics) ───
var THEMES = [
  {id:'algebra',name:'Algebra Land',icon:'📐',desc:'Equations, patterns, and variables',colors:['#0D9488','#14b8a6','#134E4A']},
  {id:'cells',name:'Cell World',icon:'🔬',desc:'Organelles, membranes, and microscopic life',colors:['#059669','#10b981','#064e3b']},
  {id:'forces',name:'Force Fields',icon:'💪',desc:'Gravity, friction, and Newton\'s laws',colors:['#2563eb','#3b82f6','#1e3a5f']},
  {id:'ecology',name:'Eco Realm',icon:'🌿',desc:'Ecosystems, food chains, and habitats',colors:['#16a34a','#4ade80','#14532d']},
  {id:'probability',name:'Chance Canyon',icon:'🎲',desc:'Probability, randomness, and outcomes',colors:['#7c3aed','#a78bfa','#3b1f6e']},
  {id:'chemistry',name:'Reaction Zone',icon:'⚗️',desc:'Elements, reactions, and particle theory',colors:['#dc2626','#f87171','#450a0a']},
  {id:'energy',name:'Energy Peaks',icon:'⚡',desc:'Kinetic, potential, and thermal energy',colors:['#d97706','#fbbf24','#451a03']},
  {id:'space',name:'Cosmic Voyage',icon:'🚀',desc:'Planets, stars, and the universe',colors:['#6366f1','#818cf8','#1e1b4b']},
];

var selectedTheme = null;
var currentLevel = 1;
var score = 0;
var lives = 3;
var levelData = null;
var gameLoop = null;

// ─── Stars background ───
(function(){
  var el = document.getElementById('stars');
  for(var i=0;i<80;i++){
    var s = document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.setProperty('--d',(2+Math.random()*4)+'s');
    s.style.setProperty('--del',Math.random()*3+'s');
    s.style.opacity=Math.random()*.5+.1;
    s.style.width=s.style.height=(1+Math.random()*2)+'px';
    el.appendChild(s);
  }
})();

// ─── Theme selection ───
function renderThemes() {
  var html='';
  THEMES.forEach(function(t){
    html+='<div class="theme-card" data-id="'+t.id+'" onclick="selectTheme(\''+t.id+'\')"><div class="theme-icon">'+t.icon+'</div><div class="theme-name">'+t.name+'</div><div class="theme-desc">'+t.desc+'</div></div>';
  });
  document.getElementById('themeGrid').innerHTML=html;
  // Also populate next-theme select
  var sel='';
  THEMES.forEach(function(t){sel+='<option value="'+t.id+'">'+t.icon+' '+t.name+'</option>';});
  document.getElementById('nextThemeSelect').innerHTML=sel;
}

window.selectTheme=function(id){
  selectedTheme=THEMES.find(function(t){return t.id===id});
  document.querySelectorAll('.theme-card').forEach(function(c){c.classList.toggle('selected',c.dataset.id===id)});
  document.getElementById('startBtn').disabled=false;
};

window.startGame=function(){
  document.getElementById('titleScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  currentLevel=1;score=0;lives=3;
  generateLevel();
};

// ─── Level Generation (AI or fallback) ───
function generateLevel(){
  var loading=document.getElementById('loading');
  loading.classList.add('show');
  document.getElementById('loadMsg').innerHTML='Claude is designing Level '+currentLevel+' about <strong>'+selectedTheme.name+'</strong>...';
  
  var prompt='You are a game level designer. Generate a platformer level for the theme "'+selectedTheme.name+'" ('+selectedTheme.desc+'). This is level '+currentLevel+' so difficulty should be '+(currentLevel<=2?'easy':currentLevel<=4?'medium':'hard')+'. Respond with ONLY a JSON object (no markdown, no backticks) with this exact structure: {"platforms":[{"x":number,"y":number,"w":number,"h":number}],"collectibles":[{"x":number,"y":number,"type":"star"}],"hazards":[{"x":number,"y":number,"w":number}],"exit":{"x":number,"y":number},"spawn":{"x":number,"y":number},"theme_fact":"one short educational fact about '+selectedTheme.id+'","decoration_text":"a short thematic word to display in background"}. Canvas is 860x480. Ground is at y=440. Platforms should have y between 100-400, x between 0-800, w between 60-200, h=16. Include '+(3+currentLevel)+' platforms, '+(2+currentLevel)+' collectibles, and '+(Math.min(currentLevel-1,4))+' hazards. Exit should be on a high platform (y<200). Spawn at x:40,y:420.';

  // Try API call, fallback to procedural
  callClaudeAPI(prompt).then(function(data){
    levelData=data;
    loading.classList.remove('show');
    initLevel();
  }).catch(function(err){
    console.log('API fallback:',err);
    levelData=generateProceduralLevel();
    loading.classList.remove('show');
    initLevel();
  });
}

function callClaudeAPI(prompt){
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ controller.abort(); }, 8000);
  
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      messages:[{role:'user',content:prompt}]
    }),
    signal: controller.signal
  }).then(function(r){
    clearTimeout(timeoutId);
    if(!r.ok) throw new Error('API returned '+r.status);
    return r.json();
  }).then(function(data){
    if(!data.content||!data.content.length) throw new Error('Empty response');
    var text=data.content.map(function(c){return c.text||''}).join('');
    var clean=text.replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(clean);
    if(!parsed.platforms||!parsed.exit) throw new Error('Invalid level data');
    return parsed;
  });
}

function generateProceduralLevel(){
  var platforms=[];
  var collectibles=[];
  var hazards=[];
  var nPlats=3+currentLevel;
  var nColl=2+currentLevel;
  var nHaz=Math.min(currentLevel-1,4);
  
  // Generate platforms as stepping stones going up
  var lastX=100,lastY=380;
  for(var i=0;i<nPlats;i++){
    var x=lastX+80+Math.random()*120;
    var y=lastY-40-Math.random()*60;
    if(x>750)x=100+Math.random()*200;
    if(y<100)y=150+Math.random()*100;
    var w=70+Math.random()*100;
    platforms.push({x:Math.round(x),y:Math.round(y),w:Math.round(w),h:16});
    lastX=x;lastY=y;
  }
  
  // Collectibles on or above platforms
  for(var i=0;i<nColl;i++){
    var p=platforms[i%platforms.length];
    collectibles.push({x:p.x+p.w/2,y:p.y-30,type:'star'});
  }
  
  // Hazards on ground
  for(var i=0;i<nHaz;i++){
    hazards.push({x:200+i*150+Math.random()*80,y:440,w:40+Math.random()*30});
  }
  
  var facts=[
    'Variables represent unknown values in algebra.',
    'Cells are the basic units of life.',
    'Newton\'s 3rd law: every action has an equal opposite reaction.',
    'Producers make food through photosynthesis.',
    'Probability of an event ranges from 0 to 1.',
    'Chemical reactions rearrange atoms, not create them.',
    'Energy cannot be created or destroyed.',
    'Light from the Sun takes 8 minutes to reach Earth.'
  ];
  var idx=THEMES.findIndex(function(t){return t.id===selectedTheme.id});
  
  // Exit on highest platform
  var highest=platforms.reduce(function(a,b){return a.y<b.y?a:b});
  
  return {
    platforms:platforms,
    collectibles:collectibles,
    hazards:hazards,
    exit:{x:highest.x+highest.w/2-12,y:highest.y-32},
    spawn:{x:40,y:420},
    theme_fact:facts[idx]||facts[0],
    decoration_text:selectedTheme.name.split(' ')[0]
  };
}

// ─── Game Engine ───
var canvas,ctx;
var player={x:40,y:420,vx:0,vy:0,w:24,h:32,grounded:false,facing:1};
var keys={};
var GRAVITY=0.5;
var JUMP=-10;
var SPEED=4;
var collected=[];
var particles=[];
var levelWon=false;
var dead=false;
var frameCount=0;

function initLevel(){
  canvas=document.getElementById('gameCanvas');
  ctx=canvas.getContext('2d');
  player.x=levelData.spawn.x;
  player.y=levelData.spawn.y;
  player.vx=0;player.vy=0;player.grounded=false;
  collected=[];
  particles=[];
  levelWon=false;dead=false;
  document.getElementById('hudLevel').textContent=currentLevel;
  document.getElementById('hudScore').textContent=score;
  document.getElementById('hudLives').textContent=lives;
  document.getElementById('hudTheme').textContent=selectedTheme.icon+' '+selectedTheme.name;
  if(gameLoop)cancelAnimationFrame(gameLoop);
  gameLoop=requestAnimationFrame(tick);
}

function tick(){
  if(levelWon||dead){return}
  frameCount++;
  update();
  render();
  gameLoop=requestAnimationFrame(tick);
}

function update(){
  // Input
  if(keys['ArrowLeft']||keys['KeyA']){player.vx=-SPEED;player.facing=-1}
  else if(keys['ArrowRight']||keys['KeyD']){player.vx=SPEED;player.facing=1}
  else{player.vx*=0.8;if(Math.abs(player.vx)<0.5)player.vx=0}
  if((keys['ArrowUp']||keys['KeyW']||keys['Space'])&&player.grounded){player.vy=JUMP;player.grounded=false}
  
  // Physics
  player.vy+=GRAVITY;
  player.x+=player.vx;
  player.y+=player.vy;
  
  // Ground collision
  player.grounded=false;
  if(player.y+player.h>=440){player.y=440-player.h;player.vy=0;player.grounded=true}
  
  // Platform collision
  levelData.platforms.forEach(function(p){
    if(player.vx!==0||player.vy>=0){
      if(player.x+player.w>p.x&&player.x<p.x+p.w&&
         player.y+player.h>=p.y&&player.y+player.h<=p.y+p.h+player.vy+2&&
         player.vy>=0){
        player.y=p.y-player.h;
        player.vy=0;
        player.grounded=true;
      }
    }
  });
  
  // Wall bounds
  if(player.x<0)player.x=0;
  if(player.x+player.w>860)player.x=860-player.w;
  if(player.y<0){player.y=0;player.vy=0}
  
  // Collectibles
  levelData.collectibles.forEach(function(c,i){
    if(collected.indexOf(i)!==-1)return;
    if(Math.abs(player.x+player.w/2-c.x)<20&&Math.abs(player.y+player.h/2-c.y)<20){
      collected.push(i);
      score+=10;
      document.getElementById('hudScore').textContent=score;
      // Particles
      for(var p=0;p<8;p++){
        particles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:30,color:selectedTheme.colors[0]});
      }
    }
  });
  
  // Hazards
  levelData.hazards.forEach(function(h){
    if(player.x+player.w>h.x&&player.x<h.x+h.w&&player.y+player.h>h.y-8&&player.y+player.h<=h.y+8){
      playerDie();
    }
  });
  
  // Exit
  var ex=levelData.exit;
  if(Math.abs(player.x+player.w/2-ex.x-12)<20&&Math.abs(player.y+player.h/2-ex.y-16)<24){
    levelWon=true;
    score+=50;
    document.getElementById('hudScore').textContent=score;
    showLevelComplete();
  }
  
  // Fell off
  if(player.y>500){playerDie()}
  
  // Update particles
  particles=particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
}

function playerDie(){
  dead=true;
  lives--;
  document.getElementById('hudLives').textContent=lives;
  if(lives<=0){
    document.getElementById('goLevel').textContent=currentLevel;
    document.getElementById('goScore').textContent=score;
    document.getElementById('gameOver').classList.add('show');
  } else {
    // Respawn after brief delay
    setTimeout(function(){
      dead=false;
      player.x=levelData.spawn.x;
      player.y=levelData.spawn.y;
      player.vx=0;player.vy=0;
      gameLoop=requestAnimationFrame(tick);
    },800);
  }
}

function render(){
  var c=ctx;
  var tc=selectedTheme.colors;
  
  // Background gradient
  var bg=c.createLinearGradient(0,0,0,480);
  bg.addColorStop(0,tc[2]);
  bg.addColorStop(1,'#0a0a1a');
  c.fillStyle=bg;
  c.fillRect(0,0,860,480);
  
  // Background decoration text
  if(levelData.decoration_text){
    c.save();
    c.globalAlpha=0.04;
    c.font='bold 120px "Press Start 2P",monospace';
    c.fillStyle='#fff';
    c.textAlign='center';
    c.fillText(levelData.decoration_text,430,300);
    c.restore();
  }
  
  // Stars in background
  for(var i=0;i<20;i++){
    var sx=(i*137+frameCount*0.2)%860;
    var sy=(i*89)%300+20;
    c.fillStyle='rgba(255,255,255,'+(0.1+Math.sin(frameCount*0.02+i)*0.1)+')';
    c.fillRect(sx,sy,1.5,1.5);
  }
  
  // Ground
  c.fillStyle=tc[2];
  c.fillRect(0,440,860,40);
  c.fillStyle='rgba(255,255,255,.05)';
  for(var i=0;i<860;i+=20){c.fillRect(i,440,1,40)}
  
  // Platforms
  levelData.platforms.forEach(function(p){
    var pg=c.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    pg.addColorStop(0,tc[0]);
    pg.addColorStop(1,tc[1]);
    c.fillStyle=pg;
    roundRect(c,p.x,p.y,p.w,p.h,4);
    c.fill();
    // Shine
    c.fillStyle='rgba(255,255,255,.15)';
    c.fillRect(p.x+2,p.y+1,p.w-4,3);
  });
  
  // Hazards (spikes)
  levelData.hazards.forEach(function(h){
    c.fillStyle=tc[0]==='#dc2626'?'#ef4444':'#ef4444';
    for(var i=0;i<h.w;i+=12){
      c.beginPath();
      c.moveTo(h.x+i,h.y);
      c.lineTo(h.x+i+6,h.y-14);
      c.lineTo(h.x+i+12,h.y);
      c.fill();
    }
  });
  
  // Collectibles (stars)
  levelData.collectibles.forEach(function(col,i){
    if(collected.indexOf(i)!==-1)return;
    c.save();
    c.translate(col.x,col.y);
    c.rotate(frameCount*0.03);
    // Glow
    c.shadowColor='#fbbf24';
    c.shadowBlur=12;
    drawStar(c,0,0,8,4,5);
    c.fillStyle='#fbbf24';
    c.fill();
    c.shadowBlur=0;
    c.restore();
  });
  
  // Exit portal
  var ex=levelData.exit;
  c.save();
  c.translate(ex.x+12,ex.y+16);
  // Pulsing ring
  var pulse=Math.sin(frameCount*0.06)*4;
  c.strokeStyle=tc[0];
  c.lineWidth=3;
  c.beginPath();
  c.arc(0,0,14+pulse,0,Math.PI*2);
  c.stroke();
  c.strokeStyle='rgba(255,255,255,.3)';
  c.lineWidth=1;
  c.beginPath();
  c.arc(0,0,18+pulse,0,Math.PI*2);
  c.stroke();
  // Arrow
  c.fillStyle='#fff';
  c.font='16px sans-serif';
  c.textAlign='center';
  c.fillText('🚪',0,5);
  c.restore();
  
  // Player
  c.save();
  c.translate(player.x+player.w/2,player.y+player.h/2);
  c.scale(player.facing,1);
  // Body
  c.fillStyle='#6366f1';
  roundRect(c,-10,-14,20,28,6);c.fill();
  // Eyes
  c.fillStyle='#fff';
  c.fillRect(2,-8,5,5);
  c.fillRect(-1,-8,5,5);
  // Pupils
  c.fillStyle='#1e1b4b';
  c.fillRect(4,-7,2,3);
  c.fillRect(1,-7,2,3);
  // Feet
  if(!player.grounded){
    c.fillStyle='#4f46e5';
    c.fillRect(-8,14,7,4);
    c.fillRect(2,14,7,4);
  } else {
    var step=Math.sin(frameCount*0.15)*3;
    c.fillStyle='#4f46e5';
    c.fillRect(-8+step,14,7,4);
    c.fillRect(2-step,14,7,4);
  }
  c.restore();
  
  // Particles
  particles.forEach(function(p){
    c.globalAlpha=p.life/30;
    c.fillStyle=p.color;
    c.fillRect(p.x-2,p.y-2,4,4);
  });
  c.globalAlpha=1;
  
  // Theme fact at bottom
  if(levelData.theme_fact){
    c.fillStyle='rgba(255,255,255,.5)';
    c.font='10px Outfit,sans-serif';
    c.textAlign='center';
    c.fillText('💡 '+levelData.theme_fact,430,472);
  }
}

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}

function drawStar(c,cx,cy,outer,inner,points){
  c.beginPath();
  for(var i=0;i<points*2;i++){
    var r=i%2===0?outer:inner;
    var a=Math.PI/points*i-Math.PI/2;
    if(i===0)c.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    else c.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  c.closePath();
}

function showLevelComplete(){
  document.getElementById('lcMsg').innerHTML='You collected '+(collected.length*10)+' stars!<br><em>"'+levelData.theme_fact+'"</em>';
  document.getElementById('nextThemeSelect').value=selectedTheme.id;
  document.getElementById('levelComplete').classList.add('show');
}

window.nextLevel=function(){
  document.getElementById('levelComplete').classList.remove('show');
  currentLevel++;
  var nextId=document.getElementById('nextThemeSelect').value;
  selectedTheme=THEMES.find(function(t){return t.id===nextId})||selectedTheme;
  generateLevel();
};

// ─── Input ───
document.addEventListener('keydown',function(e){keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].indexOf(e.code)!==-1)e.preventDefault()});
document.addEventListener('keyup',function(e){keys[e.code]=false});

// ─── Init ───
renderThemes();
</script>
