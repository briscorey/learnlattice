<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner. LearnLattice</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0f1a;--card:#0f172a;--surface:#1e293b;--border:#334155;--ink:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--teal:#0D9488;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--violet:#8b5cf6}body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:16px 16px 48px}.sp-header{max-width:800px;margin:0 auto 20px;text-align:center}.sp-header h1{font-size:1.4rem;background:linear-gradient(135deg,var(--teal),#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sp-header p{font-size:.82rem;color:var(--muted);max-width:500px;margin:0 auto}#spEngBar{max-width:800px;margin:0 auto 16px}.sp-layout{max-width:800px;margin:0 auto;display:grid;gap:20px}.sp-add{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:20px}.sp-add h2{font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:14px}.sp-add-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sp-add-full{grid-column:1/-1}.sp-input-group{display:flex;flex-direction:column;gap:4px}.sp-input-group label{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}.sp-input{padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:.85rem;font-family:inherit;outline:0;transition:border-color .15s}.sp-input:focus{border-color:var(--teal)}.sp-input::placeholder{color:var(--dim)}select.sp-input{cursor:pointer}.sp-add-btn{grid-column:1/-1;padding:10px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s}.sp-add-btn:hover{transform:translateY(-2px)}.sp-add-btn:disabled{opacity:.4;cursor:default;transform:none}.sp-cal{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:20px}.sp-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sp-cal-title{font-size:.88rem;font-weight:700;color:var(--ink)}.sp-cal-nav{display:flex;gap:6px}.sp-cal-nav button{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:.72rem;font-weight:600;font-family:inherit;transition:all .12s}.sp-cal-nav button:hover{border-color:var(--teal);color:var(--teal)}.sp-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.sp-cal-day-name{text-align:center;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:6px 0}.sp-cal-cell{min-height:56px;padding:4px 6px;border-radius:8px;background:var(--surface);border:1px solid transparent;font-size:.72rem;position:relative;cursor:default;transition:all .12s}.sp-cal-cell.today{border-color:var(--teal);background:rgba(13,148,136,.06)}.sp-cal-cell.other{opacity:.3}.sp-cal-date{font-weight:700;color:var(--muted);margin-bottom:2px}.sp-cal-events{display:flex;flex-direction:column;gap:1px}.sp-cal-event{padding:2px 5px;border-radius:4px;font-size:.58rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.sp-cal-event.assessment{background:rgba(239,68,68,.15);color:var(--red);border-left:2px solid var(--red)}.sp-cal-event.review{background:rgba(13,148,136,.1);color:var(--teal);border-left:2px solid var(--teal)}.sp-today{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:20px}.sp-today-title{font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px}.sp-today-title::before{content:'📅';font-size:1.1rem}.sp-today-empty{font-size:.78rem;color:var(--dim);text-align:center;padding:16px}.sp-today-list{display:flex;flex-direction:column;gap:6px}.sp-today-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-radius:10px;border-left:3px solid var(--teal)}.sp-today-item.urgent{border-left-color:var(--red)}.sp-today-item.done{opacity:.5;text-decoration:line-through}.sp-today-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:transparent;transition:all .15s;flex-shrink:0}.sp-today-check.checked{background:var(--teal);border-color:var(--teal);color:#fff}.sp-today-text{flex:1;min-width:0}.sp-today-text strong{display:block;font-size:.78rem;color:var(--ink)}.sp-today-text span{font-size:.65rem;color:var(--dim)}.sp-today-link{font-size:.65rem;color:var(--teal);text-decoration:none;font-weight:600;flex-shrink:0}.sp-assessments{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:20px}.sp-assessments h2{font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:12px}.sp-assess-list{display:flex;flex-direction:column;gap:6px}.sp-assess-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border-radius:10px}.sp-assess-date{font-size:.72rem;font-weight:700;color:var(--amber);min-width:70px}.sp-assess-info{flex:1}.sp-assess-info strong{display:block;font-size:.78rem;color:var(--ink)}.sp-assess-info span{font-size:.65rem;color:var(--dim)}.sp-assess-days{font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:100px;white-space:nowrap}.sp-assess-days.soon{background:rgba(239,68,68,.12);color:var(--red)}.sp-assess-days.coming{background:rgba(245,158,11,.12);color:var(--amber)}.sp-assess-days.far{background:rgba(13,148,136,.12);color:var(--teal)}.sp-assess-del{padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:0 0;color:var(--dim);cursor:pointer;font-size:.65rem;font-family:inherit;transition:all .12s}.sp-assess-del:hover{border-color:var(--red);color:var(--red)}.sp-empty{text-align:center;padding:24px;color:var(--dim);font-size:.82rem}@media(max-width:480px){.sp-add-form{grid-template-columns:1fr}.sp-add-full{grid-column:1}.sp-cal-cell{min-height:44px;padding:3px 4px}.sp-cal-event{font-size:.5rem}}</style></head><body><div class="sp-header"><h1>Study Planner</h1><p>Add your upcoming assessments. The planner generates a spaced revision schedule. reviewing at 1, 3, 7, and 14 days before each assessment.</p></div><div id="spEngBar"></div><div class="sp-layout"><div class="sp-add" id="spAdd"><h2>Add an assessment</h2><div class="sp-add-form"><div class="sp-input-group"><label>Subject</label> <select class="sp-input" id="spSubject"><option value="Mathematics">📐 Mathematics</option><option value="Biology">🧬 Biology</option><option value="Chemistry">⚗️ Chemistry</option><option value="Physics">⚡ Physics</option><option value="Ecology">🌿 Ecology</option><option value="Earth Science">🌍 Earth Science</option></select></div><div class="sp-input-group"><label>Assessment date</label> <input type="date" class="sp-input" id="spDate"></div><div class="sp-input-group sp-add-full"><label>Topic / Title</label> <input class="sp-input" id="spTopic" placeholder="e.g. Algebra unit test, Criterion B investigation"></div><div class="sp-input-group"><label>Criterion focus</label> <select class="sp-input" id="spCrit"><option value="">Any / All</option><option value="A">Criterion A</option><option value="B">Criterion B</option><option value="C">Criterion C</option><option value="D">Criterion D</option></select></div><div class="sp-input-group"><label>Priority</label> <select class="sp-input" id="spPriority"><option value="normal">Normal</option><option value="high">High. important assessment</option></select></div><button class="sp-add-btn" id="spAddBtn" onclick="addAssessment()">Add to Planner</button></div></div><div class="sp-today" id="spToday"></div><div class="sp-cal" id="spCal"></div><div class="sp-assessments" id="spAssessments"></div></div><script src="/js/student-engine.js"></script><script>var SP_KEY="ll_planner_",assessments=[],calMonth=(new Date).getMonth(),calYear=(new Date).getFullYear(),REVIEW_DAYS=[1,3,7,14],SUBJECT_COLORS={Mathematics:"#0D9488",Biology:"#059669",Chemistry:"#E11D48",Physics:"#2563EB",Ecology:"#16A34A","Earth Science":"#D97706"};function loadAssessments(){try{assessments=JSON.parse(localStorage.getItem(SP_KEY+"assessments"))||[]}catch(e){assessments=[]}var e=Date.now()-6048e5;assessments=assessments.filter(function(t){return new Date(t.date).getTime()>e}),saveAssessments()}function saveAssessments(){try{localStorage.setItem(SP_KEY+"assessments",JSON.stringify(assessments))}catch(e){}}function getEvents(e,t){var s=[];return assessments.forEach(function(a){var n=new Date(a.date);n>=e&&n<=t&&s.push({date:a.date,type:"assessment",text:a.topic,subject:a.subject,id:a.id,priority:a.priority}),REVIEW_DAYS.forEach(function(o){var c=new Date(n.getTime()-864e5*o),r=c.toISOString().slice(0,10);c>=e&&c<=t&&s.push({date:r,type:"review",text:a.topic+" (review "+o+"d)",subject:a.subject,daysBefore:o,assessmentId:a.id})})}),s}function renderToday(){var e=(new Date).toISOString().slice(0,10),t=new Date(Date.now()+864e5).toISOString().slice(0,10),s=getEvents(new Date(e),new Date(t)).filter(function(t){return t.date===e}),a={};try{a=JSON.parse(localStorage.getItem(SP_KEY+"done_"+e))||{}}catch(e){}var n=document.getElementById("spToday");if(s.length){var o='<div class="sp-today-title">Today\'s Study Plan</div><div class="sp-today-list">';s.forEach(function(e,t){var s=a[t],n="assessment"===e.type||e.daysBefore&&e.daysBefore<=1,c="/subjects/"+e.subject.toLowerCase().replace(/ /g,"-")+"/";o+='<div class="sp-today-item'+(n?" urgent":"")+(s?" done":"")+'"><span class="sp-today-check'+(s?" checked":"")+'" onclick="toggleDone('+t+')">'+(s?"✓":"")+'</span><div class="sp-today-text"><strong>'+("assessment"===e.type?"🔴 ":"📖 ")+e.text+"</strong><span>"+e.subject+'</span></div><a href="'+c+'" class="sp-today-link">Resources →</a></div>'}),o+="</div>",n.innerHTML=o}else n.innerHTML='<div class="sp-today-title">Today\'s Study Plan</div><div class="sp-today-empty">No study sessions today. Add an assessment to get started!</div>'}function renderCalendar(){var e=document.getElementById("spCal"),t=new Date(calYear,calMonth,1),s=new Date(calYear,calMonth+1,0),a=(t.getDay()+6)%7,n=(s.getDate(),(new Date).toISOString().slice(0,10)),o=getEvents(new Date(calYear,calMonth,1-a),new Date(calYear,calMonth+1,7)),c='<div class="sp-cal-header"><span class="sp-cal-title">'+["January","February","March","April","May","June","July","August","September","October","November","December"][calMonth]+" "+calYear+'</span><div class="sp-cal-nav"><button onclick="navMonth(-1)">← Prev</button><button onclick="navMonth(0)">Today</button><button onclick="navMonth(1)">Next →</button></div></div>';c+='<div class="sp-cal-grid">',["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(e){c+='<div class="sp-cal-day-name">'+e+"</div>"});for(var r=new Date(calYear,calMonth,1-a),i=0;i<42;i++){var d=r.toISOString().slice(0,10),l=r.getMonth()!==calMonth,u=d===n,v=o.filter(function(e){return e.date===d});if(c+='<div class="sp-cal-cell'+(u?" today":"")+(l?" other":"")+'"><div class="sp-cal-date">'+r.getDate()+'</div><div class="sp-cal-events">',v.slice(0,3).forEach(function(e){c+='<div class="sp-cal-event '+e.type+'" title="'+e.text+'">'+e.text+"</div>"}),v.length>3&&(c+='<div class="sp-cal-event review">+'+(v.length-3)+" more</div>"),c+="</div></div>",r.setDate(r.getDate()+1),i>=34&&r.getMonth()!==calMonth)break}c+="</div>",e.innerHTML=c}function renderAssessments(){var e=document.getElementById("spAssessments");if(assessments.length){var t=assessments.slice().sort(function(e,t){return new Date(e.date)-new Date(t.date)}),s=Date.now(),a='<h2>Your assessments</h2><div class="sp-assess-list">';t.forEach(function(e){var t=Math.ceil((new Date(e.date).getTime()-s)/864e5),n=t<=3?"soon":t<=7?"coming":"far",o=t<=0?0===t?"Today!":Math.abs(t)+"d ago":t+" days";a+='<div class="sp-assess-item"><span class="sp-assess-date">'+e.date.slice(5)+'</span><div class="sp-assess-info"><strong>'+e.topic+"</strong><span>"+e.subject+(e.criterion?" · Crit "+e.criterion:"")+'</span></div><span class="sp-assess-days '+n+'">'+o+'</span><button class="sp-assess-del" onclick="deleteAssessment(\''+e.id+"')\">✕</button></div>"}),a+="</div>",e.innerHTML=a}else e.innerHTML='<h2>Your assessments</h2><div class="sp-empty">No assessments added yet. Use the form above to add one.</div>'}function renderAll(){renderToday(),renderCalendar(),renderAssessments()}window.addAssessment=function(){var e=document.getElementById("spDate").value,t=document.getElementById("spTopic").value.trim(),s=document.getElementById("spSubject").value,a=document.getElementById("spCrit").value,n=document.getElementById("spPriority").value;if(e&&t){if(assessments.push({id:Date.now().toString(36),date:e,topic:t,subject:s,criterion:a,priority:n,created:Date.now()}),saveAssessments(),document.getElementById("spTopic").value="",document.getElementById("spDate").value="","undefined"!=typeof LL)LL.xp.add(10,"planner"),LL.badges.check().forEach(function(e){LL.render.toast(e)});renderAll()}},window.deleteAssessment=function(e){assessments=assessments.filter(function(t){return t.id!==e}),saveAssessments(),renderAll()},window.toggleDone=function(e){var t=(new Date).toISOString().slice(0,10),s={};try{s=JSON.parse(localStorage.getItem(SP_KEY+"done_"+t))||{}}catch(e){}s[e]=!s[e];try{localStorage.setItem(SP_KEY+"done_"+t,JSON.stringify(s))}catch(e){}renderToday()},window.navMonth=function(e){0===e?(calMonth=(new Date).getMonth(),calYear=(new Date).getFullYear()):((calMonth+=e)>11&&(calMonth=0,calYear++),calMonth<0&&(calMonth=11,calYear--)),renderCalendar()},document.getElementById("spDate").value=new Date(Date.now()+12096e5).toISOString().slice(0,10),loadAssessments(),renderAll(),"undefined"!=typeof LL&&(LL.streak.update(),LL.render.bar("spEngBar"))</script></body></html>
