<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Understand Sequences — LearnLattice</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.5rem;background:linear-gradient(135deg,#0D9488,#0D9488aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.sub{font-size:.85rem;color:#94a3b8;margin-bottom:20px;text-align:center;max-width:500px}.app{width:100%;max-width:560px}.seq-btns{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}.sqb{padding:8px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:.78rem;font-family:inherit;transition:all .15s}.sqb:hover{border-color:#0D9488}.sqb.on{border-color:#0D9488;background:rgba(13,148,136,.15);color:#5eead4}.terms-area{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:20px;margin-bottom:16px;overflow-x:auto}.terms-row{display:flex;gap:4px;align-items:flex-end;justify-content:center;min-height:100px;padding-bottom:8px}.term-col{display:flex;flex-direction:column;align-items:center;gap:4px}.term-bar{width:36px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#0D9488,#0D948866);transition:height .4s cubic-bezier(.22,1,.36,1);min-height:4px}.term-n{font-size:.65rem;color:#64748b;font-family:'Courier New',monospace}.term-val{font-size:.82rem;font-weight:700;color:#e2e8f0;font-family:'Courier New',monospace}.diff-row{display:flex;gap:4px;justify-content:center;margin-top:8px;min-height:20px}.diff{font-size:.7rem;color:#d97706;font-family:'Courier New',monospace;width:40px;text-align:center}.rule-box{text-align:center;padding:20px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:16px}.rule-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1.5px;color:#64748b;margin-bottom:8px;font-weight:700}.rule-text{font-family:'Courier New',monospace;font-size:1.4rem;font-weight:700;color:#0D9488;margin-bottom:6px}.rule-explain{font-size:.82rem;color:#94a3b8;line-height:1.5}.predict-box{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}.predict-box label{font-size:.85rem;color:#94a3b8}.predict-box input{width:60px;padding:6px 10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-family:'Courier New',monospace;font-size:1rem;text-align:center}.predict-box .pres{font-family:'Courier New',monospace;font-size:1rem;color:#0D9488;font-weight:700;min-width:80px}.info{padding:14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:.82rem;color:#94a3b8;line-height:1.6;text-align:center}.info strong{color:#0D9488}</style></head><body>
<h1>Sequences: Find the Rule</h1>
<p class="sub">Pick a sequence. See the pattern. Predict the next term.</p>
<div class="app">
  <div class="seq-btns" id="seqBtns"></div>
  <div class="terms-area">
    <div class="terms-row" id="termsRow"></div>
    <div class="diff-row" id="diffRow"></div>
  </div>
  <div class="rule-box">
    <div class="rule-label">The nth term rule</div>
    <div class="rule-text" id="ruleText">—</div>
    <div class="rule-explain" id="ruleExplain"></div>
  </div>
  <div class="predict-box">
    <label>Find term number:</label>
    <input type="number" id="nInput" value="10" min="1" max="100" onchange="predict()">
    <span>=</span>
    <span class="pres" id="predResult">—</span>
  </div>
  <div class="info" id="info">A <strong>sequence</strong> is a list of numbers that follow a rule. The <strong>nth term</strong> formula lets you find any term without listing them all.</div>
</div>
<script>
var seqs=[
  {name:"3, 6, 9, 12...",terms:[3,6,9,12,15,18],rule:"3n",d:3,c:0,explain:"Common difference is 3. Starts at 3×1. So: 3n."},
  {name:"2, 5, 8, 11...",terms:[2,5,8,11,14,17],rule:"3n − 1",d:3,c:-1,explain:"Common difference is 3 → starts with 3n. First term: 3(1)=3, but we need 2 → subtract 1. So: 3n − 1."},
  {name:"4, 7, 10, 13...",terms:[4,7,10,13,16,19],rule:"3n + 1",d:3,c:1,explain:"Common difference is 3 → 3n. First term: 3(1)=3, but we need 4 → add 1. So: 3n + 1."},
  {name:"1, 4, 9, 16...",terms:[1,4,9,16,25,36],rule:"n²",d:0,c:0,quad:true,explain:"These are square numbers! 1², 2², 3², 4²... The rule is n²."},
  {name:"5, 8, 11, 14...",terms:[5,8,11,14,17,20],rule:"3n + 2",d:3,c:2,explain:"Common difference is 3 → 3n. First term: 3(1)=3, but we need 5 → add 2. So: 3n + 2."},
  {name:"10, 8, 6, 4...",terms:[10,8,6,4,2,0],rule:"12 − 2n",d:-2,c:12,neg:true,explain:"Decreasing by 2 each time → −2n. When n=1: −2(1)=−2, but we need 10 → add 12. So: 12 − 2n."},
  {name:"2, 4, 8, 16...",terms:[2,4,8,16,32,64],rule:"2ⁿ",d:0,c:0,geo:true,explain:"Each term doubles! This is a geometric sequence: 2¹, 2², 2³... The rule is 2ⁿ."},
  {name:"0, 3, 8, 15...",terms:[0,3,8,15,24,35],rule:"n² − 1",d:0,c:-1,quad:true,explain:"These are square numbers minus 1! 1²−1=0, 2²−1=3, 3²−1=8... The rule is n² − 1."}
];
var cur=0;
function init(){
  var el=document.getElementById('seqBtns');
  el.innerHTML=seqs.map(function(s,i){return '<button class="sqb'+(i===0?' on':'')+'" onclick="pick('+i+')">'+s.name+'</button>'}).join('');
  show();
}
function pick(i){cur=i;document.querySelectorAll('.sqb').forEach(function(b,j){b.classList.toggle('on',j===i)});show();}
function show(){
  var s=seqs[cur],maxVal=Math.max.apply(null,s.terms),row=document.getElementById('termsRow'),dr=document.getElementById('diffRow');
  row.innerHTML=s.terms.map(function(v,i){var h=Math.max(8,v/maxVal*90);return '<div class="term-col"><div class="term-val">'+v+'</div><div class="term-bar" style="height:'+h+'px"></div><div class="term-n">n='+(i+1)+'</div></div>'}).join('');
  // Show differences
  if(!s.quad&&!s.geo){
    dr.innerHTML='';
    for(var i=0;i<s.terms.length-1;i++){var d=s.terms[i+1]-s.terms[i];dr.innerHTML+='<div class="diff">'+(d>=0?'+':'')+d+'</div>';}
  } else if(s.quad){
    dr.innerHTML='<div style="font-size:.7rem;color:#d97706;text-align:center;width:100%">Differences: ';
    for(var i=0;i<s.terms.length-1;i++){dr.innerHTML+=(s.terms[i+1]-s.terms[i])+(i<s.terms.length-2?', ':'');}
    dr.innerHTML+=' (not constant → not linear)</div>';
  } else {
    dr.innerHTML='<div style="font-size:.7rem;color:#d97706;text-align:center;width:100%">×2 each time (geometric)</div>';
  }
  document.getElementById('ruleText').textContent='T(n) = '+s.rule;
  document.getElementById('ruleExplain').textContent=s.explain;
  predict();
}
function predict(){
  var s=seqs[cur],n=+document.getElementById('nInput').value;
  if(n<1)n=1;
  var result;
  if(s.geo)result=Math.pow(2,n);
  else if(s.quad&&s.c===0)result=n*n;
  else if(s.quad)result=n*n+s.c;
  else if(s.neg)result=s.c+s.d*n;
  else result=s.d*n+s.c;
  document.getElementById('predResult').textContent=result;
}
init();
</script></body></html>
