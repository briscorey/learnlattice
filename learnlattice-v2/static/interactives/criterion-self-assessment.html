<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYP Criterion Self-Assessment — LearnLattice</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0f1a;--card:#0f172a;--surface:#1e293b;--border:#334155;--ink:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--teal:#0D9488;--teal-bright:#14b8a6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--violet:#8b5cf6}body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;padding:16px 16px 48px}.cs-header{max-width:720px;margin:0 auto 20px;text-align:center}.cs-header h1{font-size:1.4rem;background:linear-gradient(135deg,var(--teal),var(--teal-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.cs-header p{font-size:.82rem;color:var(--muted);line-height:1.5;max-width:500px;margin:0 auto}.cs-selector{max-width:720px;margin:0 auto 20px}.cs-row{display:flex;gap:4px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}.cs-pill{padding:7px 16px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}.cs-pill:hover{border-color:var(--teal);color:var(--ink)}.cs-pill.on{color:#fff}.cs-pill.on[data-s=math]{background:var(--teal);border-color:var(--teal)}.cs-pill.on[data-s=science]{background:var(--blue);border-color:var(--blue)}.cs-crit-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}.cs-crit{padding:6px 14px;border-radius:100px;border:1.5px solid var(--border);background:0 0;color:var(--dim);font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}.cs-crit:hover{border-color:var(--teal);color:var(--muted)}.cs-crit.on{border-color:var(--accent,var(--teal));background:color-mix(in srgb,var(--accent,var(--teal)) 15%,transparent);color:var(--accent,var(--teal))}.cs-area{max-width:720px;margin:0 auto}.cs-crit-header{text-align:center;margin-bottom:20px;animation:csFade .3s ease}.cs-crit-icon{font-size:2rem;margin-bottom:6px}.cs-crit-name{font-size:1.2rem;font-weight:700;margin-bottom:4px}.cs-crit-question{font-size:.88rem;color:var(--muted);font-style:italic}.cs-strands{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}.cs-strand{padding:5px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:.7rem;color:var(--muted)}.cs-bands{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}.cs-band{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s,box-shadow .2s;cursor:pointer}.cs-band:hover{border-color:var(--accent,var(--teal))}.cs-band.selected{border-color:var(--accent,var(--teal));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,var(--teal)) 20%,transparent)}.cs-band-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border)}.cs-band-level{font-size:1rem;font-weight:800;color:var(--accent,var(--teal));min-width:40px}.cs-band-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}.cs-band-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.75rem;color:transparent}.cs-band.selected .cs-band-check{border-color:var(--accent,var(--teal));background:var(--accent,var(--teal));color:#fff}.cs-band-body{padding:16px 18px}.cs-band-student{font-size:.88rem;color:var(--ink);line-height:1.6;margin-bottom:12px;font-style:italic;border-left:3px solid var(--accent,var(--teal));padding-left:14px}.cs-band-lookfors{margin-bottom:12px}.cs-band-lookfors-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}.cs-lookfor{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:.78rem;color:var(--muted);line-height:1.5}.cs-lookfor::before{content:'✓';color:var(--accent,var(--teal));font-weight:700;flex-shrink:0;margin-top:1px}.cs-band-example{padding:10px 14px;background:var(--surface);border-radius:8px;font-size:.75rem;color:var(--muted);line-height:1.55}.cs-band-example-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--amber);margin-bottom:4px}.cs-rate-section{max-width:720px;margin:0 auto 20px;padding:16px 20px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;text-align:center}.cs-rate-section h3{font-size:.88rem;color:var(--ink);margin-bottom:6px}.cs-rate-section p{font-size:.75rem;color:var(--dim);margin-bottom:12px}.cs-rate-action{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.cs-save-btn{padding:10px 28px;border-radius:10px;background:var(--teal);border:none;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s}.cs-save-btn:hover{transform:translateY(-2px)}.cs-save-btn:disabled{opacity:.4;cursor:default;transform:none}.cs-saved-msg{font-size:.78rem;color:var(--green);margin-top:8px;min-height:20px}.cs-history{max-width:720px;margin:0 auto;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px}.cs-history-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:10px}.cs-history-empty{font-size:.78rem;color:var(--dim);text-align:center;padding:12px}.cs-history-list{display:flex;flex-direction:column;gap:6px}.cs-history-item{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--surface);border-radius:8px;font-size:.75rem}.cs-history-date{color:var(--dim);min-width:80px}.cs-history-level{font-weight:700;color:var(--accent,var(--teal));min-width:36px}.cs-history-label{color:var(--muted)}.cs-history-trend{margin-left:auto;font-size:.9rem}@keyframes csFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.cs-fade{animation:csFade .3s ease}@media(max-width:480px){.cs-band-body{padding:12px 14px}.cs-examples{grid-template-columns:1fr}.cs-strands{gap:4px}.cs-strand{font-size:.65rem;padding:4px 8px}}</style></head><body><div class="cs-header"><h1>MYP Criterion Self-Assessment</h1><p>Select your subject and criterion. Read what each level looks like. Then honestly rate where your work falls — and watch yourself improve over time.</p></div><div class="cs-selector"><div class="cs-row" id="csSubjects"><button class="cs-pill on" data-s="math" onclick='setSubject("math")'>📐 Mathematics</button> <button class="cs-pill" data-s="science" onclick='setSubject("science")'>🔬 Sciences</button></div><div class="cs-crit-row" id="csCriteria"></div></div><div class="cs-area" id="csArea"></div><div id="csRate"></div><div id="csHistory"></div><script>var CRITERIA={math:[{c:"A",name:"Knowing and Understanding",color:"#0D9488",icon:"🧠",short:"Can you use what you've learned?",strands:["Select and apply the right mathematical techniques","Use correct notation and terminology","Solve problems in familiar and unfamiliar situations"],bands:[{lv:"1–2",label:"Limited",student:"I can sometimes pick the right method, but I often make mistakes and I need help to set up the problem.",lookfors:["Attempts to use a method but with significant errors","Some correct notation but inconsistent","Can solve very simple, familiar problems only"],example:"A student tries to find the area of a triangle but uses length × width instead of ½ × base × height."},{lv:"3–4",label:"Adequate",student:"I can usually pick the right method for familiar problems. I make some mistakes but my working mostly makes sense.",lookfors:["Selects appropriate methods for routine problems","Generally correct notation with occasional errors","Solves familiar problems with reasonable accuracy"],example:"A student correctly finds the area using ½bh but makes an arithmetic error in the final step."},{lv:"5–6",label:"Substantial",student:"I pick the right method most of the time, even in problems I haven't seen before. My working is clear and mostly correct.",lookfors:["Selects and applies appropriate methods competently","Correct mathematical notation and terminology","Solves problems in both familiar and some unfamiliar situations"],example:"A student finds the area of a composite shape by breaking it into triangles and rectangles, with clear working."},{lv:"7–8",label:"Excellent",student:"I choose the most efficient method, use precise mathematical language, and can solve problems I've never seen before.",lookfors:["Selects the most efficient strategy","Precise, consistent notation throughout","Solves unfamiliar and challenging problems with sophistication"],example:"A student solves a multi-step problem involving area, percentages, and algebra — choosing simultaneous equations as the most efficient approach."}]},{c:"B",name:"Investigating Patterns",color:"#2563EB",icon:"🔍",short:"Can you find and prove patterns?",strands:["Select techniques to discover patterns","Describe patterns as rules","Verify and justify why the rules work"],bands:[{lv:"1–2",label:"Limited",student:"I can draw the first few cases of a pattern, but I can't describe the rule clearly or check if it works.",lookfors:["Generates some correct examples but disorganised","Attempts to describe but description is vague","Little or no verification or justification"],example:"A student draws 3 cases and writes 'it goes up by 2 each time' without showing a formula."},{lv:"3–4",label:"Adequate",student:"I can spot patterns and describe them in words. I try to write a rule and check it for a few cases.",lookfors:["Applies a problem-solving approach to find patterns","Describes correctly in words or partially in algebra","Verifies for one or two additional cases"],example:"A student notices the pattern increases by 3 each time, writes 'the rule is 3n + 1', and checks for n=5."},{lv:"5–6",label:"Substantial",student:"I can find the rule, write it algebraically, and verify it works for untested cases. I start to explain why it works.",lookfors:["Systematically organises data to reveal patterns","Correctly states the general rule algebraically","Verifies for multiple untested values","Begins to provide reasoning"],example:"A student creates a table, finds 3n+1, verifies for n=10 and n=100, and sketches why each case adds 3."},{lv:"7–8",label:"Excellent",student:"I can prove why the pattern works using algebra or geometry — not just that it works, but WHY it works for every case.",lookfors:["Uses sophisticated techniques (algebraic proof, geometric reasoning)","Provides a complete justification, not just verification","Explores extensions or generalisations"],example:"A student proves the rule algebraically, connects to the geometric structure, and extends to 3D."}]},{c:"C",name:"Communicating",color:"#D97706",icon:"💬",short:"Can you show your thinking clearly?",strands:["Use appropriate language, notation, and diagrams","Organise with logical structure","Move between representations"],bands:[{lv:"1–2",label:"Limited",student:"My working is hard to follow. I use some maths language but it's often unclear.",lookfors:["Disorganised presentation with missing steps","Incorrect or missing notation","Diagrams absent or unclear"],example:"A student writes the answer without showing working. Steps are out of order."},{lv:"3–4",label:"Adequate",student:"My working can be followed most of the time. I use some correct notation and include some diagrams.",lookfors:["Working can be followed but has gaps","Some correct notation and terminology","Diagrams present but may lack labels"],example:"Working with correct notation but skipped steps; graph has unlabelled axes."},{lv:"5–6",label:"Substantial",student:"My working is clear and well-organised. I use correct notation, label my diagrams, and move between tables, graphs, and algebra.",lookfors:["Clear, logical structure throughout","Consistent and correct notation","Well-labelled diagrams and graphs","Effectively moves between representations"],example:"A statistical investigation with clear introduction, well-labelled charts, correct calculations, and a reasoned conclusion."},{lv:"7–8",label:"Excellent",student:"My work is so clear anyone could follow it. Precise language, beautiful diagrams, everything connected logically.",lookfors:["Exceptional clarity and organisation","Precise language used consistently","Seamless movement between representations","Coherent narrative throughout"],example:"An investigation that reads like a published article — clear intro, systematic working, accurate graphs, conclusion connecting back to the question."}]},{c:"D",name:"Applying Maths in Real Life",color:"#7C3AED",icon:"🌍",short:"Can you use maths to solve real problems?",strands:["Identify maths in real-life situations","Select appropriate strategies","Explain accuracy","Justify whether the solution makes sense"],bands:[{lv:"1–2",label:"Limited",student:"I can see that maths is involved, but I struggle to set it up or explain whether my answer makes sense.",lookfors:["Identifies some relevant mathematics","Attempts a strategy but with significant errors","Little reflection on reasonableness"],example:"Recognises a budgeting problem needs addition but doesn't account for tax."},{lv:"3–4",label:"Adequate",student:"I can set up a real-world problem mathematically and get a reasonable answer. I sometimes check if my answer makes sense.",lookfors:["Identifies relevant mathematical content","Applies an appropriate strategy with some success","Makes some attempt to reflect on the solution"],example:"Calculates trip cost correctly but doesn't discuss rounding or assumptions."},{lv:"5–6",label:"Substantial",student:"I select good strategies for real-world problems, get accurate answers, and discuss how accurate my solution really is.",lookfors:["Correctly models the real-life situation","Selects and applies appropriate strategies","Discusses accuracy and limitations","Solution is contextually reasonable"],example:"Models population growth, calculates predictions, discusses why the model won't work forever."},{lv:"7–8",label:"Excellent",student:"I build a mathematical model that works, explain what it can and can't predict, justify my assumptions, and suggest improvements.",lookfors:["Creates a sophisticated mathematical model","Justifies assumptions and discusses limitations","Explains degree of accuracy with evidence","Proposes improvements or extensions"],example:"Creates a compound interest model, compares to linear growth, discusses inflation as limitation, suggests modifications."}]}],science:[{c:"A",name:"Knowing and Understanding",color:"#059669",icon:"🧪",short:"Can you explain scientific ideas?",strands:["Explain scientific knowledge","Apply knowledge to solve problems","Analyse and evaluate information"],bands:[{lv:"1–2",label:"Limited",student:"I can remember some science facts, but I struggle to explain them or use them to answer questions.",lookfors:["Recalls some basic facts","Attempts to apply knowledge with major errors","Limited analysis"],example:"Can name parts of a cell but cannot explain what each part does."},{lv:"3–4",label:"Adequate",student:"I can explain basic concepts and apply them to familiar situations. New or complex problems are harder.",lookfors:["Explains concepts with some detail","Applies knowledge to familiar situations","Some analysis with basic reasoning"],example:"Explains photosynthesis needs light and CO₂ but can't explain why more light increases the rate."},{lv:"5–6",label:"Substantial",student:"I explain science concepts clearly, apply them to new situations, and use evidence to support my answers.",lookfors:["Clear, detailed explanations using scientific language","Applies knowledge to unfamiliar situations","Analyses information with evidence-based judgements"],example:"Explains osmosis clearly, predicts cell behaviour in different concentrations with scientific reasoning."},{lv:"7–8",label:"Excellent",student:"I explain science at a deep level, transfer knowledge to completely new contexts, and make sophisticated evidence-based judgements.",lookfors:["Comprehensive explanations showing deep understanding","Transfers knowledge to novel situations","Evaluates information critically","Well-supported scientific judgements"],example:"Explains why different ecosystems respond differently to environmental change, connecting energy transfer, adaptation, and interdependence."}]},{c:"B",name:"Inquiring and Designing",color:"#0284C7",icon:"🔬",short:"Can you design a fair experiment?",strands:["Explain a problem or question to test","Formulate a testable hypothesis","Design a logical, safe method","Control variables"],bands:[{lv:"1–2",label:"Limited",student:"I can state what I want to find out, but I struggle to write a hypothesis or plan an experiment that works.",lookfors:["States a basic research question","Hypothesis is vague or untestable","Method incomplete or unfeasible","Variables not clearly identified"],example:"Writes 'I want to find out about plants' with no specific question; method has only 2 steps."},{lv:"3–4",label:"Adequate",student:"I can write a research question and hypothesis. My method mostly makes sense but might have gaps.",lookfors:["Describes a testable question","Hypothesis with basic reasoning","Method that could be followed","Some variables identified"],example:"Clear question and hypothesis about plant growth, lists equipment, but doesn't explain how to control temperature."},{lv:"5–6",label:"Substantial",student:"My hypothesis is based on science. My method is detailed enough that someone else could follow it. I explain how I'll keep it fair.",lookfors:["Focused, scientifically relevant question","Hypothesis includes scientific reasoning","Detailed, logical, repeatable method","Clear identification and control of variables"],example:"Designs enzyme experiment with hypothesis linking temperature to molecular motion, step-by-step method with quantities."},{lv:"7–8",label:"Excellent",student:"My experiment is designed so well that the results will be reliable and valid. I've thought about everything that could go wrong.",lookfors:["Sophisticated design with controls","Well-reasoned hypothesis linked to theory","Method addresses reliability and validity","Identifies potential sources of error"],example:"Controlled experiment with 5 repeats, explains why each control variable matters, predicts possible errors, includes risk assessment."}]},{c:"C",name:"Processing and Evaluating",color:"#DC2626",icon:"📊",short:"Can you make sense of your results?",strands:["Present data in appropriate formats","Interpret data and describe results","Discuss validity and reliability","Suggest improvements"],bands:[{lv:"1–2",label:"Limited",student:"I can record results in a table, but I struggle to draw a good graph or explain what the results mean.",lookfors:["Some data collected and recorded","Graphs/tables attempted but with errors","Limited interpretation","No evaluation of method"],example:"Records results but table has no units, graph has no title, conclusion just restates results."},{lv:"3–4",label:"Adequate",student:"I present results in tables and graphs that mostly make sense. I describe what happened and start to assess reliability.",lookfors:["Results organised with some appropriate detail","Graphs are right type with most labels","Describes patterns or trends","Some comment on reliability"],example:"Creates results table and bar chart. States the trend but doesn't link to hypothesis."},{lv:"5–6",label:"Substantial",student:"My data presentation is clear and accurate. I interpret what results mean scientifically and discuss whether my method was reliable.",lookfors:["Well-organised data with correct units","Appropriate graph type, fully labelled","Interprets data and links to hypothesis","Discusses reliability and validity with examples"],example:"Processes data into averages, creates accurate scatter graph with line of best fit, discusses anomalies, evaluates method."},{lv:"7–8",label:"Excellent",student:"I process, interpret, and evaluate data like a scientist. I discuss limitations honestly and suggest specific improvements backed by reasoning.",lookfors:["Sophisticated processing (e.g., uncertainties)","Insightful interpretation linking to theory","Thorough evaluation with specific improvements","Suggestions are realistic and justified"],example:"Calculates percentage error, discusses systematic vs random error, explains how each improvement would increase reliability."}]},{c:"D",name:"Reflecting on the Impacts of Science",color:"#9333EA",icon:"🌏",short:"How does science affect people and the planet?",strands:["Explain how science solves real-world problems","Discuss and evaluate implications","Apply scientific language","Document sources"],bands:[{lv:"1–2",label:"Limited",student:"I know science affects the real world, but I struggle to explain how or discuss whether effects are good or bad.",lookfors:["States that science has an impact","Limited explanation of applications","Basic scientific language","Sources missing or incomplete"],example:"Writes 'genetic engineering is used in food' without explaining how or what the implications are."},{lv:"3–4",label:"Adequate",student:"I can describe how science is used in the real world and mention some positive or negative effects.",lookfors:["Describes a real-world application","Identifies some implications","Uses some scientific language correctly","Lists some sources"],example:"Describes how vaccines work and mentions some people refuse them, but doesn't evaluate evidence."},{lv:"5–6",label:"Substantial",student:"I discuss real-world science issues with balance, using evidence from multiple perspectives. I cite my sources properly.",lookfors:["Explains how science applies to a specific issue","Discusses implications from multiple perspectives","Uses scientific language effectively","Sources are relevant and documented"],example:"Discusses GM crops — explaining the science, presenting arguments from farmers, environmentalists, and consumers, citing sources."},{lv:"7–8",label:"Excellent",student:"I evaluate science issues critically, consider ethical and social perspectives, use reliable evidence, and reach a well-justified conclusion.",lookfors:["Comprehensive analysis of a science-society issue","Evaluates ethics, economics, environment","Sophisticated scientific language","Well-documented, critically evaluated sources"],example:"Evaluates CRISPR gene editing — explaining the technology, analysing ethical debates, comparing regulations across countries, forming a justified position."}]}]},KEY="ll_csa_",subject="math",critIdx=0,selectedBand=-1;function getCriteria(){return CRITERIA[subject]}function getCurrent(){return getCriteria()[critIdx]}function getHistory(e,t){try{return JSON.parse(localStorage.getItem(KEY+e+"_"+t))||[]}catch(e){return[]}}function saveRating(e,t,s,a){var i=getHistory(e,t);i.push({date:(new Date).toISOString().slice(0,10),level:s,label:a,ts:Date.now()}),i.length>50&&(i=i.slice(-50));try{localStorage.setItem(KEY+e+"_"+t,JSON.stringify(i))}catch(e){}}function renderCriteriaPills(){var e=getCriteria(),t="";e.forEach(function(e,s){t+='<button class="'+(s===critIdx?"cs-crit on":"cs-crit")+'" style="--accent:'+e.color+'" onclick="setCrit('+s+')">Criterion '+e.c+": "+e.name+"</button>"}),document.getElementById("csCriteria").innerHTML=t}function render(){var e=getCurrent(),t='<div class="cs-crit-header cs-fade" style="--accent:'+e.color+'"><div class="cs-crit-icon">'+e.icon+'</div><div class="cs-crit-name" style="color:'+e.color+'">Criterion '+e.c+": "+e.name+'</div><div class="cs-crit-question">'+e.short+"</div></div>";t+='<div class="cs-strands">',e.strands.forEach(function(e){t+='<div class="cs-strand">'+e+"</div>"}),t+="</div>",t+='<div class="cs-bands">',e.bands.forEach(function(s,a){var i=selectedBand===a;t+='<div class="cs-band'+(i?" selected":"")+'" style="--accent:'+e.color+'" onclick="selectBand('+a+')"><div class="cs-band-header"><span class="cs-band-level">'+s.lv+'</span><span class="cs-band-label">'+s.label+'</span><span class="cs-band-check">'+(i?"✓":"")+'</span></div><div class="cs-band-body"><div class="cs-band-student">'+s.student+'</div><div class="cs-band-lookfors"><div class="cs-band-lookfors-label">What the teacher looks for</div>',s.lookfors.forEach(function(e){t+='<div class="cs-lookfor">'+e+"</div>"}),t+='</div><div class="cs-band-example"><div class="cs-band-example-label">Example</div>'+s.example+"</div></div></div>"}),t+="</div>",document.getElementById("csArea").innerHTML=t,document.getElementById("csRate").innerHTML='<div class="cs-rate-section" style="--accent:'+e.color+'"><h3>Where does your work fall?</h3><p>Click the band that best describes your work right now. Be honest — this is for you, not your teacher.</p><button class="cs-save-btn" onclick="saveSelection()" '+(selectedBand<0?"disabled":"")+">"+(selectedBand>=0?"Save: "+e.bands[selectedBand].lv+" ("+e.bands[selectedBand].label+")":"Select a band above")+'</button><div class="cs-saved-msg" id="csSavedMsg"></div></div>',renderHistory()}function renderHistory(){var e=getCurrent(),t=getHistory(subject,e.c),s='<div class="cs-history" style="--accent:'+e.color+'"><div class="cs-history-title">Your Criterion '+e.c+" History</div>";t.length?(s+='<div class="cs-history-list">',t.slice().reverse().slice(0,10).forEach(function(e,t,a){var i="";if(t<a.length-1){var n=a[t+1].level,o=e.level;i=o>n?"📈":o<n?"📉":"➡️"}s+='<div class="cs-history-item"><span class="cs-history-date">'+e.date+'</span><span class="cs-history-level">'+e.level+'</span><span class="cs-history-label">'+e.label+'</span><span class="cs-history-trend">'+i+"</span></div>"}),s+="</div>"):s+='<div class="cs-history-empty">No self-assessments yet. Select a band above and save to start tracking.</div>',s+="</div>",document.getElementById("csHistory").innerHTML=s}window.setSubject=function(e){subject=e,critIdx=0,selectedBand=-1,document.querySelectorAll(".cs-pill").forEach(function(t){t.classList.toggle("on",t.dataset.s===e)}),renderCriteriaPills(),render()},window.setCrit=function(e){critIdx=e,selectedBand=-1,renderCriteriaPills(),render()},window.selectBand=function(e){selectedBand=e,render()},window.saveSelection=function(){if(!(selectedBand<0)){var e=getCurrent(),t=e.bands[selectedBand];if(saveRating(subject,e.c,t.lv,t.label),document.getElementById("csSavedMsg").textContent="✓ Saved! "+t.lv+" ("+t.label+") recorded for Criterion "+e.c,"undefined"!=typeof LL)LL.xp.add(LL.xp.CRITERION_SELF_ASSESS,"criteria"),LL.badges.check().forEach(function(e){LL.render.toast(e)});renderHistory()}},renderCriteriaPills(),render(),function(){var e=document.createElement("script");e.src="/js/student-engine.js",e.onload=function(){"undefined"!=typeof LL&&LL.streak.update()},document.head.appendChild(e)}()</script></body></html>
