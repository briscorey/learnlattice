# MYP Assessment Criteria — Student-Friendly Descriptors
# Used by the Criterion Self-Assessment Explorer
# Each criterion has 4 bands with student-friendly language + "look-fors"

math:
  - criterion: "A"
    name: "Knowing and Understanding"
    color: "#0D9488"
    icon: "🧠"
    short: "Can you use what you've learned?"
    strands:
      - "Select and apply the right mathematical techniques"
      - "Use correct notation and terminology"
      - "Solve problems in familiar and unfamiliar situations"
    bands:
      - level: "1–2"
        label: "Limited"
        student_friendly: "I can sometimes pick the right method, but I often make mistakes and I need help to set up the problem."
        look_fors:
          - "Attempts to use a method but with significant errors"
          - "Some correct notation but inconsistent"
          - "Can solve very simple, familiar problems only"
        example: "A student tries to find the area of a triangle but uses length × width instead of ½ × base × height."
      - level: "3–4"
        label: "Adequate"
        student_friendly: "I can usually pick the right method for familiar problems. I make some mistakes but my working mostly makes sense."
        look_fors:
          - "Selects appropriate methods for routine problems"
          - "Generally correct notation with occasional errors"
          - "Solves familiar problems with reasonable accuracy"
        example: "A student correctly finds the area of a triangle using ½bh but makes an arithmetic error in the final step."
      - level: "5–6"
        label: "Substantial"
        student_friendly: "I pick the right method most of the time, even in problems I haven't seen before. My working is clear and mostly correct."
        look_fors:
          - "Selects and applies appropriate methods competently"
          - "Correct mathematical notation and terminology"
          - "Solves problems in both familiar and some unfamiliar situations"
        example: "A student finds the area of a composite shape by breaking it into triangles and rectangles, with clear working and correct answer."
      - level: "7–8"
        label: "Excellent"
        student_friendly: "I choose the most efficient method, use precise mathematical language, and can solve problems I've never seen before."
        look_fors:
          - "Selects the most efficient strategy for the problem"
          - "Precise, consistent mathematical notation throughout"
          - "Solves unfamiliar and challenging problems with sophistication"
        example: "A student solves a multi-step problem involving area, percentages, and algebra — choosing to use simultaneous equations as the most efficient approach."
  
  - criterion: "B"
    name: "Investigating Patterns"
    color: "#2563EB"
    icon: "🔍"
    short: "Can you find and prove patterns?"
    strands:
      - "Select and apply problem-solving techniques to discover patterns"
      - "Describe patterns as relationships or general rules"
      - "Verify and justify why the rules work"
    bands:
      - level: "1–2"
        label: "Limited"
        student_friendly: "I can draw the first few cases of a pattern, but I can't describe the rule clearly or check if it works."
        look_fors:
          - "Generates some correct examples but struggles to organise them"
          - "Attempts to describe a pattern but description is vague"
          - "Little or no attempt at verification or justification"
        example: "A student draws 3 cases of a growing pattern and writes 'it goes up by 2 each time' without showing a formula."
      - level: "3–4"
        label: "Adequate"
        student_friendly: "I can spot patterns and describe them in words. I try to write a rule and check it for a few cases."
        look_fors:
          - "Applies a problem-solving approach to find patterns"
          - "Describes the pattern correctly in words or partially in algebra"
          - "Verifies the rule for one or two additional cases"
        example: "A student notices the pattern increases by 3 each time, writes 'the rule is 3n + 1', and checks it works for n=5."
      - level: "5–6"
        label: "Substantial"
        student_friendly: "I can find the rule, write it algebraically, and verify it works for cases I haven't tested. I start to explain why it works."
        look_fors:
          - "Systematically organises data to reveal patterns"
          - "Correctly states the general rule algebraically"
          - "Verifies the rule for multiple untested values"
          - "Begins to provide reasoning for why the rule works"
        example: "A student creates a well-organised table, finds the rule 3n+1, verifies for n=10 and n=100, and sketches a diagram showing why each new case adds 3."
      - level: "7–8"
        label: "Excellent"
        student_friendly: "I can prove why the pattern works using algebra or geometry — not just that it works, but WHY it works for every case."
        look_fors:
          - "Uses sophisticated techniques (e.g., algebraic proof, geometric reasoning)"
          - "Provides a complete justification, not just verification"
          - "Explores extensions or generalisations beyond the original problem"
          - "Communication is clear, logical, and convincing"
        example: "A student proves the rule algebraically by showing that the difference between consecutive terms is always 3, connects this to the geometric structure, and extends the investigation to 3D."
  
  - criterion: "C"
    name: "Communicating"
    color: "#D97706"
    icon: "💬"
    short: "Can you show your thinking clearly?"
    strands:
      - "Use appropriate mathematical language, notation, and diagrams"
      - "Organise information using logical structure"
      - "Move between different forms of mathematical representation"
    bands:
      - level: "1–2"
        label: "Limited"
        student_friendly: "My working is hard to follow. I use some maths language but it's often unclear or incorrect."
        look_fors:
          - "Disorganised presentation with missing steps"
          - "Incorrect or missing mathematical notation"
          - "Diagrams are absent or unclear"
        example: "A student writes the answer without showing working. When working is shown, steps are out of order."
      - level: "3–4"
        label: "Adequate"
        student_friendly: "My working can be followed most of the time. I use some correct maths notation and include some diagrams."
        look_fors:
          - "Working can be followed but has gaps"
          - "Uses some correct notation and terminology"
          - "Includes diagrams or graphs but they may lack labels"
        example: "A student shows working with correct notation but skips steps, and their graph has unlabelled axes."
      - level: "5–6"
        label: "Substantial"
        student_friendly: "My working is clear and well-organised. I use correct notation, label my diagrams, and move between tables, graphs, and algebra."
        look_fors:
          - "Clear, logical structure throughout"
          - "Consistent and correct mathematical notation"
          - "Well-labelled diagrams and graphs"
          - "Effectively moves between representations (table → graph → formula)"
        example: "A student presents a statistical investigation with a clear introduction, well-labelled charts, correct calculations, and a reasoned conclusion."
      - level: "7–8"
        label: "Excellent"
        student_friendly: "My work is so clear that anyone could follow it. I use precise language, beautiful diagrams, and I connect everything together logically."
        look_fors:
          - "Exceptional clarity and organisation"
          - "Precise mathematical language used consistently"
          - "Seamless movement between multiple representations"
          - "Coherent narrative that leads the reader through the reasoning"
        example: "A student's investigation reads like a published article — clear introduction, systematic working, accurate graphs with analysis, and a conclusion that connects back to the original question."
  
  - criterion: "D"
    name: "Applying Mathematics in Real-Life Contexts"
    color: "#7C3AED"
    icon: "🌍"
    short: "Can you use maths to solve real problems?"
    strands:
      - "Identify the mathematics in a real-life situation"
      - "Select appropriate mathematical strategies"
      - "Explain the degree of accuracy of a solution"
      - "Justify whether the solution makes sense in context"
    bands:
      - level: "1–2"
        label: "Limited"
        student_friendly: "I can see that maths is involved in the problem, but I struggle to set it up or explain whether my answer makes sense."
        look_fors:
          - "Identifies some relevant mathematics"
          - "Attempts a strategy but with significant errors"
          - "Little reflection on whether the answer is reasonable"
        example: "A student recognises that a budgeting problem needs addition and subtraction but doesn't account for tax or reach a sensible conclusion."
      - level: "3–4"
        label: "Adequate"
        student_friendly: "I can set up a real-world problem mathematically and get a reasonable answer. I sometimes remember to check if my answer makes sense."
        look_fors:
          - "Identifies relevant mathematical content"
          - "Applies an appropriate strategy with some success"
          - "Makes some attempt to reflect on the solution"
        example: "A student calculates the cost of a school trip correctly but doesn't discuss rounding or the assumption that all students will attend."
      - level: "5–6"
        label: "Substantial"
        student_friendly: "I select good strategies for real-world problems, get accurate answers, and I discuss how accurate my solution really is."
        look_fors:
          - "Correctly models the real-life situation mathematically"
          - "Selects and applies appropriate strategies"
          - "Discusses the accuracy and limitations of the solution"
          - "Solution is contextually reasonable"
        example: "A student models population growth using a formula, calculates predictions, discusses why the model won't work forever, and considers what factors the model ignores."
      - level: "7–8"
        label: "Excellent"
        student_friendly: "I build a mathematical model that works, explain what it can and can't predict, justify my assumptions, and discuss how to improve it."
        look_fors:
          - "Creates a sophisticated mathematical model"
          - "Justifies assumptions and discusses limitations"
          - "Explains the degree of accuracy with evidence"
          - "Proposes improvements or extensions to the model"
        example: "A student creates a compound interest model for a savings plan, compares it to linear growth, discusses inflation as a limitation, and suggests how to modify the model to account for it."

science:
  - criterion: "A"
    name: "Knowing and Understanding"
    color: "#059669"
    icon: "🧪"
    short: "Can you explain scientific ideas?"
    strands:
      - "Explain scientific knowledge"
      - "Apply scientific knowledge to solve problems"
      - "Analyse and evaluate information to make scientific judgements"
    bands:
      - level: "1–2"
        label: "Limited"
        student_friendly: "I can remember some science facts, but I struggle to explain them or use them to answer questions."
        look_fors:
          - "Recalls some basic scientific facts"
          - "Attempts to apply knowledge but with major errors"
          - "Limited analysis of scientific information"
        example: "A student can name the parts of a cell but cannot explain what each part does."
      - level: "3–4"
        label: "Adequate"
        student_friendly: "I can explain basic science concepts and apply them to familiar situations. I sometimes struggle with new or complex problems."
        look_fors:
          - "Explains scientific concepts with some detail"
          - "Applies knowledge to familiar situations"
          - "Some analysis of information with basic reasoning"
        example: "A student explains that photosynthesis needs light and CO₂ but cannot explain why increasing light increases the rate."
      - level: "5–6"
        label: "Substantial"
        student_friendly: "I can explain science concepts clearly, apply them to new situations, and use evidence to support my answers."
        look_fors:
          - "Clear and detailed explanations using scientific language"
          - "Successfully applies knowledge to unfamiliar situations"
          - "Analyses information and makes evidence-based judgements"
        example: "A student explains osmosis clearly, predicts what will happen to cells in different salt concentrations, and supports predictions with scientific reasoning."
      - level: "7–8"
        label: "Excellent"
        student_friendly: "I explain science at a deep level, transfer knowledge to completely new contexts, and make sophisticated judgements backed by evidence."
        look_fors:
          - "Comprehensive explanations showing deep understanding"
          - "Transfers knowledge to novel and complex situations"
          - "Evaluates scientific information critically"
          - "Makes well-supported scientific judgements"
        example: "A student explains why different ecosystems respond differently to the same environmental change, connecting ideas from energy transfer, adaptation, and interdependence."

  - criterion: "B"
    name: "Inquiring and Designing"
    color: "#0284C7"
    icon: "🔬"
    short: "Can you design a fair experiment?"
    strands:
      - "Explain a problem or question to be tested"
      - "Formulate a testable hypothesis using scientific reasoning"
      - "Design a logical, safe, and complete method"
      - "Explain how to manipulate and control variables"
    bands:
      - level: "1–2"
        label: "Limited"
        student_friendly: "I can state what I want to find out, but I struggle to write a hypothesis or plan an experiment that would actually work."
        look_fors:
          - "States a basic research question"
          - "Hypothesis is vague or untestable"
          - "Method is incomplete or unfeasible"
          - "Variables are not clearly identified"
        example: "A student writes 'I want to find out about plants' with no specific question, and their method has only 2 steps."
      - level: "3–4"
        label: "Adequate"
        student_friendly: "I can write a research question and hypothesis. My method mostly makes sense but might have some gaps."
        look_fors:
          - "Describes a testable research question"
          - "Formulates a hypothesis with basic reasoning"
          - "Outlines a method that could be followed"
          - "Identifies some variables"
        example: "A student writes a clear question and hypothesis about plant growth, lists equipment, but doesn't explain how they'll control temperature."
      - level: "5–6"
        label: "Substantial"
        student_friendly: "My hypothesis is based on science. My method is detailed enough that someone else could follow it. I explain how I'll keep it fair."
        look_fors:
          - "Research question is focused and scientifically relevant"
          - "Hypothesis includes scientific reasoning"
          - "Method is detailed, logical, and repeatable"
          - "Clear identification and control of variables"
        example: "A student designs an enzyme experiment with a clear hypothesis linking temperature to molecular motion, a step-by-step method with quantities, and a table for expected results."
      - level: "7–8"
        label: "Excellent"
        student_friendly: "My experiment is designed so well that the results will be reliable and valid. I've thought about everything that could go wrong."
        look_fors:
          - "Sophisticated experimental design with controls"
          - "Hypothesis is well-reasoned and clearly linked to theory"
          - "Method addresses reliability (repeats) and validity"
          - "Identifies potential sources of error and how to minimise them"
        example: "A student designs a controlled experiment with 5 repeats, explains why each control variable matters, predicts possible sources of error, and includes a risk assessment."

  - criterion: "C"
    name: "Processing and Evaluating"
    color: "#DC2626"
    icon: "📊"
    short: "Can you make sense of your results?"
    strands:
      - "Present collected data in appropriate formats"
      - "Interpret data and describe results"
      - "Discuss the validity and reliability of the method"
      - "Suggest improvements"
    bands:
      - level: "1–2"
        label: "Limited"
        student_friendly: "I can record my results in a table, but I struggle to draw a good graph or explain what the results mean."
        look_fors:
          - "Some data collected and recorded"
          - "Graphs/tables attempted but with errors"
          - "Limited interpretation of results"
          - "No evaluation of method"
        example: "A student records results but the table has no units, the graph has no title, and the conclusion just restates the results."
      - level: "3–4"
        label: "Adequate"
        student_friendly: "I present my results in tables and graphs that mostly make sense. I can describe what happened and start to say whether my results are reliable."
        look_fors:
          - "Results organised in tables with some appropriate detail"
          - "Graphs are appropriate type with most labels"
          - "Describes patterns or trends in the data"
          - "Some comment on the reliability of results"
        example: "A student creates a results table and bar chart. They state the trend ('as temperature increased, the rate increased') but don't link it to their hypothesis."
      - level: "5–6"
        label: "Substantial"
        student_friendly: "My data presentation is clear and accurate. I interpret what the results mean scientifically and discuss whether my method was reliable."
        look_fors:
          - "Well-organised data with correct units and processing"
          - "Appropriate graph type, fully labelled, with line of best fit where relevant"
          - "Interprets data and links to hypothesis"
          - "Discusses reliability and validity with specific examples"
        example: "A student processes raw data into averages, creates an accurate scatter graph with line of best fit, interprets the correlation, discusses anomalies, and evaluates their method."
      - level: "7–8"
        label: "Excellent"
        student_friendly: "I process, interpret, and evaluate data like a scientist. I discuss limitations honestly and suggest specific improvements backed by reasoning."
        look_fors:
          - "Sophisticated data processing (e.g., calculated uncertainties)"
          - "Insightful interpretation linking results to scientific theory"
          - "Thorough evaluation of method with specific improvements"
          - "Suggestions are realistic and scientifically justified"
        example: "A student calculates percentage error, discusses systematic vs random error, explains how each improvement would specifically increase reliability or validity, and suggests an extension investigation."

  - criterion: "D"
    name: "Reflecting on the Impacts of Science"
    color: "#9333EA"
    icon: "🌏"
    short: "How does science affect people and the planet?"
    strands:
      - "Explain how science is applied to solve real-world problems"
      - "Discuss and evaluate the implications of using science"
      - "Apply scientific language effectively"
      - "Document sources of information"
    bands:
      - level: "1–2"
        label: "Limited"
        student_friendly: "I know that science affects the real world, but I struggle to explain how or discuss whether the effects are good or bad."
        look_fors:
          - "States that science has an impact"
          - "Limited explanation of how science is applied"
          - "Uses basic scientific language"
          - "Sources are missing or incomplete"
        example: "A student writes 'genetic engineering is used in food' without explaining how, why, or what the implications are."
      - level: "3–4"
        label: "Adequate"
        student_friendly: "I can describe how science is used in the real world and mention some positive or negative effects."
        look_fors:
          - "Describes a real-world application of science"
          - "Identifies some implications (positive and/or negative)"
          - "Uses some scientific language correctly"
          - "Lists some sources"
        example: "A student describes how vaccines work and mentions that some people refuse them, but doesn't evaluate the evidence on both sides."
      - level: "5–6"
        label: "Substantial"
        student_friendly: "I discuss real-world science issues with balance, using evidence from multiple perspectives. I use scientific language accurately and cite my sources."
        look_fors:
          - "Explains how science applies to a specific real-world issue"
          - "Discusses implications from multiple perspectives"
          - "Uses scientific language effectively throughout"
          - "Sources are relevant and properly documented"
        example: "A student discusses genetic modification of crops — explaining the science, presenting arguments from farmers, environmentalists, and consumers, and citing published sources."
      - level: "7–8"
        label: "Excellent"
        student_friendly: "I evaluate real-world science issues critically, consider ethical and social perspectives, use evidence from reliable sources, and reach a well-justified conclusion."
        look_fors:
          - "Comprehensive analysis of a science-society issue"
          - "Evaluates implications considering ethics, economics, environment"
          - "Sophisticated use of scientific language"
          - "Well-documented sources with critical evaluation of reliability"
        example: "A student evaluates the use of CRISPR gene editing — explaining the technology, analysing ethical debates, comparing regulatory approaches in different countries, and forming a justified personal position."
